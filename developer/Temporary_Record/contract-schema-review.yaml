approved_directions_ko:
  - "사용자의 저장 의도와 책임을 먼저 확인한다."
  - "데이터 구조와 검증 스키마의 역할을 분리해 검토한다."
  - "기존 스키마의 외형을 무조건 보존하지 않는다."
  - "실제 수정 코드, 필드별 목적·자료형·검증 동작·참조 이유를 설명한다."
  - "미결정 사항은 사용자에게 질문하고 정식 계약은 승인 후 수정한다."
  - "2026-10-17 사용자 승인: Policy_Status.Schema의 네 계약 버전 필드를 Schema 바로 아래에 독립적으로 둔다(B안). 중복 메타데이터를 허용하며 공용 버전 계층을 강제하지 않는다."
  - "2026-10-17 사용자 승인: Authority의 authority_Identity와 Authority_Category는 최상위 필수, authority_id는 내부 필수. Category는 Major → Minor → Micro 중첩이며 Identity와 분리한다. Major 필수 여부는 별도 미결정."
  - "2026-10-17 사용자 결정: Authority는 별도의 독립 행동 계약을 필수 참조하는 B 방향을 채택한다. 독립 계약 자체와 로컬 권위 정보는 분리한다. 실제 필드·식별자·검증 방식은 미확정."
  - "2026-10-17 사용자 결정: 별도 action_keyword는 만들지 않고 action_ref만으로 행동을 식별하고 사람이 의미를 유추할 수 있게 한다. 행동 URN은 urn:ptsip:authority:action:<target-domain>:<action-name> 구조를 사용하며 승인된 예시는 urn:ptsip:authority:action:policy:policy-modification이다. 향후 target-domain에는 plan, avatar도 예상되나 실제 계약·필드·등록 규칙은 미정이다."
  - "2026-10-17 사용자 승인: authority action URN의 target-domain은 policy, plan, avatar를 포함한다. urn:ptsip:authority:action:<target-domain>:<action-name> 패턴을 채택한다. 동일한 URN을 실제 독립 행동 계약의 식별자와 해당 행동 검증 JSON Schema의 $id로 공동 사용한다. action_keyword는 도입하지 않는다."
  - "2026-10-17 사용자 결정: Authority_Action은 정확히 하나의 독립 행동 계약만 action_ref로 참조한다. 순차적인 여러 내부 행동을 필요로 하면 순서를 소유하는 복합/패키지 행동 계약 하나를 별도의 행동 식별자로 참조한다. Authority_Action은 순서 목록이나 여러 action_ref를 직접 소유하지 않는다. 복합 계약의 내부 수행 제약, 실패/중단 처리 및 실행 승인 의미는 별도 후속 결정 사항이다."
  - "2026-10-17 사용자 승인: Authority_Category 아래 Major 필수, Minor/Micro 선택; Authority 전체 객체 계층에 추가 미정의 필드 전면 금지; action_ref 행동 이름은 소문자·숫자·하이픈 표준으로 제한. Authority_Action은 최상위 필수·단일 action_ref 필수. 정식 스키마에 적용."

review_findings:
  - id: JSON_SYNTAX
    result: OBSERVATION_ONLY
    description_ko: "일부 스키마에서 JSON 문법 문제가 지적됨."
  - id: SCHEMA_PROPERTIES
    result: OBSERVATION_ONLY
    description_ko: "일부 스키마의 properties 계층 오류가 지적됨."
  - id: REFERENCE_MISMATCH
    result: OBSERVATION_ONLY
    description_ko: "$ref 식별자 또는 실제 참조 경로 불일치 가능성이 지적됨."

  - id: AUTHORITY_ACTION_SEMANTICS_OPEN
    result: PARTIALLY_DECIDED
    description_ko: "Authority 필드 구조 승인 및 적용: Authority_Action 단일 action_ref 필수, Category의 Major 필수·Minor/Micro 선택, 각 객체 additionalProperties:false, action_ref URN pattern(policy/plan/avatar, 소문자·하이픈 표준). 남은 부분: 행동 계약 실체, 동일 URN의 계약 ID 및 JSON Schema $id 동시 사용에 따른 단일 조회/리소스 등록 체계, 복합 행동 내부 순서/실패, 행위 허가·금지·의무, 버전 정책(다른 세션), JSON Schema만으로 action_ref 문자열에서 참조 계약이 자동 로드되지 않으므로 Resolver 필요. CR-01 전체는 진행 중."

