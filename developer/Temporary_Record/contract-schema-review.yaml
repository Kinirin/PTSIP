# 한국어 설명을 포함한 임시 작업 단위 기록. 정식 정책/스키마가 아님.
record_type: TEMPORARY_WORK_RECORD
work_id: CONTRACT_SCHEMA_REVIEW
created_at: "2026-10-17"
work_status: IN_REVIEW

purpose_ko: >-
  developer/contracts/의 신규 계약 및 JSON Schema를 사용자 의도에 맞게 검토한다.
  기존 구조를 자동으로 재사용하지 않고 데이터 구조·검증 스키마의 책임을 구분한다.

scope:
  root: developer/contracts/
  root_family: null
  schema_targets:
    - developer/contracts/schemas/Authority/
    - developer/contracts/schemas/Policy_Identity/
    - developer/contracts/schemas/Policy_Rules/
    - developer/contracts/schemas/Policy_Status/
    - developer/contracts/schemas/PTSIP_Public_Structure.schema.json
  related_contract_roots:
