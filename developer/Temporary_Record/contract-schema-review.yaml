approved_directions_ko:
  - "사용자의 저장 의도와 책임을 먼저 확인한다."
  - "데이터 구조와 검증 스키마의 역할을 분리해 검토한다."
  - "기존 스키마의 외형을 무조건 보존하지 않는다."
  - "실제 수정 코드, 필드별 목적·자료형·검증 동작·참조 이유를 설명한다."
  - "미결정 사항은 사용자에게 질문하고 정식 계약은 승인 후 수정한다."
  - "2026-10-17 사용자 승인: Policy_Status.Schema의 네 계약 버전 필드를 Schema 바로 아래에 독립적으로 둔다(B안). 중복 메타데이터를 허용하며 공용 버전 계층을 강제하지 않는다."
  - "2026-10-17 사용자 승인: Authority의 authority_Identity와 Authority_Category는 최상위 필수, authority_id는 내부 필수. Category는 Major → Minor → Micro 중첩이며 Identity와 분리한다. Major 필수 여부는 별도 미결정."
  - "2026-10-17 사용자 결정: Authority는 별도의 독립 행동 계약을 필수 참조하는 B 방향을 채택한다. 독립 계약 자체와 로컬 권위 정보는 분리한다. 실제 필드·식별자·검증 방식은 미확정."
  - "2026-10-17 사용자 결정: 별도 action_keyword는 만들지 않고 action_ref만으로 행동을 식별하고 사람이 의미를 유추할 수 있게 한다. 행동 URN은 urn:ptsip:authority:action:<target-domain>:<action-name> 구조를 사용하며 승인된 예시는 urn:ptsip:authority:action:policy:policy-modification이다. 향후 target-domain에는 plan, avatar도 예상되나 실제 계약·필드·등록 규칙은 미정이다."
  - "2026-10-17 사용자 승인: authority action URN의 target-domain은 policy, plan, avatar를 포함한다. urn:ptsip:authority:action:<target-domain>:<action-name> 패턴을 채택한다. 동일한 URN을 실제 독립 행동 계약의 식별자와 해당 행동 검증 JSON Schema의 $id로 공동 사용한다. action_keyword는 도입하지 않는다."
  - "2026-10-17 사용자 결정: Authority_Action은 정확히 하나의 독립 행동 계약만 action_ref로 참조한다. 순차적인 여러 내부 행동을 필요로 하면 순서를 소유하는 복합/패키지 행동 계약 하나를 별도의 행동 식별자로 참조한다. Authority_Action은 순서 목록이나 여러 action_ref를 직접 소유하지 않는다. 복합 계약의 내부 수행 제약, 실패/중단 처리 및 실행 승인 의미는 별도 후속 결정 사항이다."
  - "2026-10-17 사용자 승인: Authority_Category 아래 Major 필수, Minor/Micro 선택; Authority 전체 객체 계층에 추가 미정의 필드 전면 금지; action_ref 행동 이름은 소문자·숫자·하이픈 표준으로 제한. Authority_Action은 최상위 필수·단일 action_ref 필수. 정식 스키마에 적용."
  - "2026-10-17 사용자 방향: 개발자 검증기는 src/policy/index.yaml에서 ACTIVE 엔진 정책을 찾고 그 정책이 지정하는 적용 버전의 Capability Contract를 기준으로 지원 범위를 판단한다. 정책상 지원을 요구한 기능이 설치 엔진에서 실패하면 중복 구현하지 않고 재현 증거를 수집하여 엔진 개발자에게 긴급 패치 필요성을 보고한다. 사양 미지원과 사양 대비 구현 누락은 구분한다."
  - "2026-10-17 사용자 승인: 엔진 검증·결함 증거의 정식 저장 위치는 .ptsip/engine/evidence/이다. developer/verification/evidence/는 이 목적의 새 저장 위치로 사용하지 않는다. 정책 초안 생성·권위 승격, 증거 서식, 보존 정책 등은 이번 경로 승인에 포함되지 않는다. 정식 최소 경로 계약은 developer/policy/contracts/engine-evidence-location.v1.json으로 생성했고 디렉터리는 .gitkeep으로 물리화했다. 정책 패밀리 및 등록·조회 바인딩은 아직 확정하지 않는다."
  - "2026-10-17 사용자 확정: Policy_Rules는 별도의 독립 규칙 계약을 참조하는 B안을 채택한다. 규칙 본문은 독립 규칙 계약이 소유한다. 개발 정책 Root Family별 내부 규칙 의미 소유는 보존한다. 실제 규칙 계약의 저장 경로 및 참조 조회/등록 방식은 사용자 미결정이며 기존 developer/contracts/schemas/Policy_Rules/root-family/*.schema.json은 검증 스키마이지 규칙 데이터 저장 파일이 아니다. 정식 정책 방향은 developer/policy/registries/public-policy-structure-governance.json에 즉시 반영했다(86b1a3b28a450c65ea7e8b6d0c2eed20e591ed53). 정식 JSON Schema/규칙 계약 데이터는 아직 생성하지 않는다."
  - "2026-10-17 사용자 승인: 독립 Policy_Rules 계약의 저장 경로는 developer/contracts/Policy_Rules/root-family/{FAMILY}/으로 확정했다. 규칙 계약 본문을 검증하는 JSON Schema는 기존 developer/contracts/schemas/Policy_Rules/root-family/와 구별한다. 미결정: 계약 YAML 내부 필드와 JSON Schema 구조, 식별자·참조 해소/등록 체계, 개별 계약 파일명과 실제 계약 생성. 경로 승인만 정식 거버넌스 계약에 기록했으며 물리적 패밀리 디렉터리·규칙 파일이나 스키마는 아직 만들지 않는다. 승인 커밋 5730a1dc21cd1067ddd3e84395153d7c889fd361."

review_findings:
  - id: POLICY_RULES_PRIORITY_BLOCKER
    result: STORAGE_DECIDED_SCHEMA_AND_RESOLUTION_OPEN
    description_ko: "2026-10-17 사용자 우선순위 지시: 새 정책 생성에 필요한 네 공통 섹션 중 Policy_Rules의 구조 결정이 현재 최우선 CR-01 정책 검토 항목. Public_Structure_Rules.schema.json은 끝 쉼표로 JSON 파싱 실패, $id만 있고 규칙 데이터·필수 제약은 미정. Root Family별 Rules 스키마는 대부분 $id 골격만 존재. 2026-10-15 승인된 공통 4개 섹션 및 패밀리 독립 내부 규칙 소유 경계를 보존하며 구조 방향을 사용자에게 제시하고 결정받을 것. 스키마 코드는 미승인으로 수정하지 않음. routing/policy_routes.json의 ARCH rules 경로(ARCH_rules.schema.json)가 현재 실재 파일(ARCH_rules.schemas.json)과 불일치하며 후속 CR-02 대조 필요. 사용자 확정 이전에 보편 규칙 포맷을 임의 결정하지 않음."

  - id: JSON_SYNTAX
    result: OBSERVATION_ONLY
    description_ko: "일부 스키마에서 JSON 문법 문제가 지적됨."
  - id: SCHEMA_PROPERTIES
    result: OBSERVATION_ONLY
    description_ko: "일부 스키마의 properties 계층 오류가 지적됨."
  - id: REFERENCE_MISMATCH
    result: OBSERVATION_ONLY
    description_ko: "$ref 식별자 또는 실제 참조 경로 불일치 가능성이 지적됨."

  - id: ENGINE_EVIDENCE_STORAGE_ROOT
    result: USER_APPROVED_AND_MATERIALIZED
    description_ko: "정식 엔진 검증·결함 증거 경로 .ptsip/engine/evidence/ 승인. 독립 저장 위치 계약 developer/policy/contracts/engine-evidence-location.v1.json 생성(커밋 3b8e2a288a84419d034661b0207da871eae30655), .gitkeep 디렉터리 물리화(커밋 f8402f0c8991888a189edd3f688a30eba7eb7bf5). 엔진 증거와 정책 권위 분리. 미결정: 증거 파일 데이터 스키마, 보존/조회 규칙, 정책 패밀리·색인 등록 방식, 증거 기반 정책 후보 생성·승인 흐름."

  - id: ENGINE_SPEC_IMPLEMENTATION_BOUNDARY
    result: USER_DIRECTION_RECORDED
    description_ko: "적용 버전의 ACTIVE src/policy 규범 및 연결 엔진 Capability Contract가 지원을 요구하는데 설치 엔진에서 미작동한 경우 개발자 검증기의 자체 보완 구현 금지, 재현 증거 수집 및 엔진 결함/패치 요청으로 에스컬레이션. 미지원 사양·버전 바인딩 실패·실제 구현 결함을 구분. 현재 특정 엔진 결함은 재현되지 않았으며, 외부 $ref가 구현 계약 범위에 포함되는지 설치 0.3.1 계약 확인 필요."

  - id: AUTHORITY_ACTION_SEMANTICS_OPEN
    result: PARTIALLY_DECIDED
    description_ko: "Authority 필드 구조 승인 및 적용: Authority_Action 단일 action_ref 필수, Category의 Major 필수·Minor/Micro 선택, 각 객체 additionalProperties:false, action_ref URN pattern(policy/plan/avatar, 소문자·하이픈 표준). 남은 부분: 행동 계약 실체, 동일 URN의 계약 ID 및 JSON Schema $id 동시 사용에 따른 단일 조회/리소스 등록 체계, 복합 행동 내부 순서/실패, 행위 허가·금지·의무, 버전 정책(다른 세션), JSON Schema만으로 action_ref 문자열에서 참조 계약이 자동 로드되지 않으므로 Resolver 필요. CR-01 전체는 진행 중."

