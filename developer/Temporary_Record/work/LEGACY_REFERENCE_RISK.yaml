pending_tasks:
  - "LG-03: 도구를 만들지 않고 기존 파일을 읽기 전용으로 간단히 조회한 뒤, 신규 계약에 이어질 참조 위험과 미결정 사항만 수동 정리한다. 변경은 사용자 승인 후 수행한다."
  - "LG-03 검토 순서: developer/policy/ 외부 대상부터 계약 하나씩 수동 점검한다. 첫 후보는 developer/contracts/lifecycle/policy_version.json이며, 기존 정책 권위 참조가 기록인지 실행 의존성인지 확인하고 사용자 판단 전 파일을 교체하지 않는다."
  - "LG-03 승인된 Policy_Status 버전 구조: 계약 식별형 객체이며 contract는 파일 경로와 독립적인 논리적 계약 식별자, version은 해당 계약의 버전이다. 정책의 contract 및 version 모두 필수다. 계획서의 필드명은 정책 필드와 명확히 구별하도록 별도 결정한다. 식별자 문법·버전 형식·의존성 연결 규칙은 아직 미결정이다. 스키마 작성은 SCHEMA_AND_FAMILY_POLICY 담당 세션 영역이다."
  - "LG-03 사용자 승인: 계획서 계약 필드명은 plan_contract, plan_version으로 분리한다. 정책용 contract, version의 필수 여부는 둘 다 필수이고 contract는 버전이나 의존성이 바뀌어도 유지되는 논리적 계약 식별자다. 다만 정책/계획 각각의 필드 타입, 허용 값과 패턴, 계획서 필수 여부와 식별 대상, 의존성 해석 규칙은 미결정이며 사용자 논의 후 결정한다. 선행 답변의 string 타입은 미승인 예시로 취급한다. SCHEMA_AND_FAMILY_POLICY의 파일은 담당 세션 외 수정하지 않는다."
  - "LG-03 사용자 결정: 정책의 contract 값은 파일/스키마 버전과 독립적인 논리적 계약 식별자를 URN으로 표현한다. URN의 네임스페이스·유일성 충돌 방지·정규식/허용 값은 미결정이다. 정책 인스턴스는 YAML, 검증 스키마 정의는 JSON Schema로 구분한다. type/string/pattern 등 미승인 형식은 확정하지 않는다. 계획용 필드명은 plan_contract, plan_version으로만 확정하며 필수 여부·형식 등 세부 구조는 별도 후순위 논의로 둔다. 당장은 정책용 Policy_Status_version.schema.json 설계에 집중하며 다른 세션 소유 스키마나 작업 기록을 수정하지 않는다."
  - "LG-03 사용자 승인: 정책 contract의 URN 충돌 방지는 계층형 네임스페이스와 등록 시 유일성 검사(D)를 결합한다. 새 논리적 계약 식별자를 최초 생성·등록할 때 이미 등록된 URN과 중복되는지 확인한다. 기존 등록된 계약을 읽거나 참조할 때마다 중복 검사하도록 강제하지 않는다. 동일 논리 계약의 버전·내부 의존성 변경만으로 새 식별자를 요구하지 않는다. 유일성 적용 범위, URN 구체 문법, 등록 원본 위치, 등록/검증 실행 방식은 미결정이며 자동화 도구를 선제 생성하지 않는다. 실제 스키마 및 타 세션 소유 작업 파일은 수정하지 않는다."
  - "LG-03 사용자 선택: 정책 contract URN 명명 계층은 C(계약 종류 > 기능 영역 > 계약 이름)를 기본 방향으로 설계한다. 충돌이 발생하면 기존 식별자의 재발급이 필요한지 우려가 제기되었으며, 신규 발급 전 중복 차단과 발급 후 기능 영역 이동의 식별자 유지/재발급은 서로 다른 문제로 검토한다. 기능 이동 시 처리, 이름 구성의 세부 문법, 의미 변화와 동일 계약 판단, 별칭/이전 규칙은 미승인·미결정이다. 실제 스키마/타 세션 소유 파일은 변경하지 않는다."
  - "LG-03 사용자 승인 RECONCILE: 기능 영역 이동이나 URN 충돌만으로 기존 URN을 자동 변경·재발급하지 않는다. 에이전트는 기존/후보 URN, 대상 정책과 논리 계약, 충돌 계약 및 원인, 확인된 참조·의존성 영향, 이름 후보별 장단점을 조사·보고한다. 새 기능 영역을 반영한 URN은 후보일 뿐이다. 사용자에게 기존 이름 유지/새 이름 승인/보류의 결정을 받고, 승인 전에는 URN 발급·변경 및 참조 수정·자동 접미사 생성을 금지한다. 신규 URN 등록 시 기계적 중복 검사는 유지하고, 버전 변경이나 내부 의존성 변경 자체만으로 새 URN을 요구하지 않는다. 이전 URN 이력·재사용, 별칭, 참조 전환 시점, 등록 원본·실행 방식 및 세부 URN 패턴은 미결정이다. 정식 스키마와 타 세션 소유 기록은 수정하지 않는다."
  - "LG-03 사용자 승인: 정책 contract 필드는 단순 URN 접두부 검사를 넘어 PTSIP의 계층 구조와 문자 규칙을 함께 검사하는 B 방향으로 설계한다. 단, 계약 구분은 후속 사용자 승인으로 정책용 policy로 고정되고 contract의 자료형은 string으로 확정되었다. 기능 영역·계약 이름의 문자 규칙은 후속 승인으로 a-z·0-9·하이픈으로 확정되었다. 기능 영역의 등록 값과 하이픈 경계 규칙은 미결정이다. policy_kind는 URN의 계약 종류와 자동 동일시하지 않는다. root_family는 후속 사용자 승인에 따라 URN 필수 상위 기능 계층에 포함한다. 필요시 신규 기계 판독형 분류 계약의 생성 여부와 형식은 별도 사용자 판단을 받는다. Java 코드·JSON Schema·YAML 계약 간 역할을 먼저 구분하며, 미승인 스키마 패턴과 신규 분류 계약은 생성하지 않는다."
  - "LG-03 사용자 승인: 정책 URN의 기능적 분류에 기존 14개 Root Family를 필수 상위 계층으로 포함한다(선택 A). 기존 root_family 정의를 활용하며 Root Family 내부의 세부 기능 영역을 일괄 사전 고정하지 않는다. policy_kind의 개발자/지원 기능 등 정책 구분과 URN 계약 종류를 자동 동일시하지 않는다. Root Family 표기의 정규화는 후속 승인에 따라 소문자로 확정되었다. 세부 기능 영역은 후속 사용자 승인으로 필수 계층으로 확정되었으며, 실제 하위 분류 목록·명명 문법·계약 이름 값·버전 패턴 및 정식 스키마 구현은 별도 결정한다. 계약 구분 policy와 contract 문자열 자료형은 후속 사용자 승인을 따른다. 영역 변경과 충돌 시 RECONCILE 사용자 결정 절차를 유지한다. 다른 작업 그룹이 소유한 계약 스키마는 수정하지 않는다."
  - "LG-03 사용자 승인: 정책용 URN에 포함하는 Root Family 값은 소문자로 정규화한다(선택 B). 기존 root_family.json의 대문자 코드(예: ARCH)는 권위 있는 분류 값으로 그대로 유지하고 URN 표현에서는 결정론적 소문자 변환(ARCH -> arch)을 적용한다. URN 안의 대문자 Root Family 표기는 허용하지 않도록 향후 형식 검증에 반영한다. policy_kind/Root Family 원본 계약을 수정하거나 세부 기능 영역·계약 이름의 문자 규칙을 자동 확정하지 않는다. 실제 Policy_Status 스키마 수정은 해당 작업 그룹 소유 영역이다."
  - "LG-03 사용자 승인: 정책용 URN에서 Root Family 아래 세부 기능 영역을 항상 필수 계층으로 둔다(선택 A). 이는 세부 기능 영역의 실제 종류·이름·목록을 지금 정의하거나 선등록하라는 뜻이 아니다. 세부 기능 분류의 규범적 소유 책임은 별도 전역 분류를 중복 신설하지 않고 기존 Root Family 계약 체계에 둔다. 현재 root_family.json은 14개 문자열 enum이므로 하위 분류의 표현 방식이나 파일 구조를 승인 없이 확장·변경하지 않는다. 기능 분류 설계는 우선순위 후순위로 미룬다. URN에서 필수 계층 존재 여부는 확정하지만 하위 분류의 허용 값·문자 문법과 실제 검증 연결은 미결정이다. RECONCILE 사용자 결정 원칙을 유지하고 다른 그룹 소유 스키마를 변경하지 않는다."
  - "LG-03 사용자 승인: 정책용 논리적 계약 URN의 계약 구분 계층은 policy로 고정한다(A). 이는 기존 policy_kind의 개발자·지원 기능 등의 분류 값을 URN 계약 구분에 삽입하거나 서로 동일시하는 결정이 아니다. 정책용 contract 필드 자료형은 단일 문자열이다(A); 추후 Policy_Status_version JSON Schema에서 type: string으로 검증한다. 이미 확정된 Root Family 필수 소문자 계층 및 세부 기능 영역 필수 계층을 보존한다. urn:ptsip 접두부 최종 지위·전체 URN 패턴·세부 기능 및 계약명 문자 규칙·version 자료형/문법·등록 방식은 승인하지 않는다. 타 세션 소유 정식 스키마는 수정하지 않는다."
  - "LG-03 사용자 승인 및 적용: 정책용 URN의 세부 기능 영역과 계약 이름은 허용 문자 집합을 ASCII 소문자(a-z), 숫자(0-9), 하이픈(-)으로 제한한다(A). 정책 계약 식별자는 type: string으로 검증하고 계약 구분 policy 및 기존 14개 Root Family의 소문자 표기와 두 필수 이름 계층을 확인한다. 사용자의 스키마 적용 요청에 따라 developer/contracts/schemas/Policy_Status/Policy_Status_version.schema.json에 현재 승인 범위만 반영했다. contract와 version의 필수 존재를 검사하지만 version 값의 타입·형식은 미결정이라 검증하지 않는다. URN NID 최종 지정·첫/끝 하이픈 및 연속 하이픈 경계 문법·세부 기능의 등록 값·추가 필드 허용 여부·등록 중복 검증 구현은 미결정이며 승인 전 임의 제한하지 않는다. Root Family 원본 enum과 타 세션 소유 작업 기록은 수정하지 않는다."
  - "LG-03 사용자 승인 및 스키마 적용: 정책용 Policy_Status_version 객체의 필수 version 필드는 단일 문자열(string)로 확정한다. developer/contracts/schemas/Policy_Status/Policy_Status_version.schema.json의 version 속성에 type: string만 추가하고 기존 required [contract, version] 및 contract URN 패턴은 유지한다. version의 구체적인 문자열 문법·허용 값·버전 비교 및 변경 규칙은 미결정이며 승인 없이 pattern, enum 또는 minLength를 추가하지 않는다. Root Family 하위 분류나 URN 등록 정책도 변경하지 않는다."
  - "LG-03 사용자 정책 결정: 기존 MAJOR.MINOR 정규식 ^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$ 은 신규 정책 버전 문법 설계의 참고 자료로만 승인하며, 신규 Policy_Status_version.schema.json의 version.pattern 채택은 아직 승인하지 않는다. 초기 MPD-0010의 상태별 MAJOR 할당(DRAFT/APPROVED/ACTIVE), 상태 전이에 따른 강제 버전 변경, 변경 종류에 따른 결정론적 자동 MAJOR/MINOR 증가를 신규 정책 체계에서 전면 배제한다. 버전만으로 상태를 추론하거나 상태만으로 버전을 추론하지 않는다. 신규 버전 증가 정책 자체는 이 결정으로 새로 만들지 않는다. 후속 사용자 결정 KEEP_LATEST로 기존 RETIRED_VERSION_PRESERVATION을 새 정책에서 폐기하고 developer/contracts/lifecycle/policy_version.json을 삭제 대상으로 확정했다. 구 구현과 참조 제거 및 실제 파일 삭제의 안전성은 의존성 검토 후 처리하며 단독 삭제하지 않는다. 다른 작업 그룹 소유 파일 및 정식 버전 스키마는 변경하지 않는다."
  - "LG-03 사용자 충돌 해결 KEEP_LATEST 확정: 2026-10-13 과거 승인에서 보존했던 RETIRED -> PRESERVE_PREVIOUS_VERSION 규칙을 최신 사용자 결정으로 대체하여 새 정책 체계에서 완전히 폐기한다. 초기 MPD-0010의 상태 연계 버전 숫자 제약 및 상태 전이/변경 종류별 자동 증가 정책도 재사용 금지다. developer/contracts/lifecycle/policy_version.json은 삭제 대상이며 수정·재사용·신규 정책 계약의 규범 근거로 삼지 않는다. 기존 MAJOR.MINOR 정규식은 참고 자료로만 사용할 수 있고 새 version.pattern 채택은 여전히 미승인이다. 정적 검색에서 developer/automation/policy/lifecycle/version_contract.go가 구 계약을 직접 읽고 current_root.go 등 검증 경로가 이를 호출하며 developer/policy/registries 및 테스트가 파일을 참조함을 확인했다. 물리적 삭제는 해당 의존성 제거/대체와 검증 전에는 실행하지 않으며, 삭제 대상이라는 결정만으로 리포지토리 참조를 깨뜨리지 않는다. 기존 이력과 타 작업 그룹 파일의 권위·소유권을 보존하고 정식 신규 스키마는 변경하지 않는다."
