pending_tasks:
  - "LG-03: 도구를 만들지 않고 기존 파일을 읽기 전용으로 간단히 조회한 뒤, 신규 계약에 이어질 참조 위험과 미결정 사항만 수동 정리한다. 변경은 사용자 승인 후 수행한다."
  - "LG-03 검토 순서: developer/policy/ 외부 대상부터 계약 하나씩 수동 점검한다. 첫 후보는 developer/contracts/lifecycle/policy_version.json이며, 기존 정책 권위 참조가 기록인지 실행 의존성인지 확인하고 사용자 판단 전 파일을 교체하지 않는다."
  - "LG-03 승인된 Policy_Status 버전 구조: 계약 식별형 객체이며 contract는 파일 경로와 독립적인 논리적 계약 식별자, version은 해당 계약의 버전이다. 정책의 contract 및 version 모두 필수다. 계획서의 필드명은 정책 필드와 명확히 구별하도록 별도 결정한다. 식별자 문법·버전 형식·의존성 연결 규칙은 아직 미결정이다. 스키마 작성은 SCHEMA_AND_FAMILY_POLICY 담당 세션 영역이다."
  - "LG-03 사용자 승인: 계획서 계약 필드명은 plan_contract, plan_version으로 분리한다. 정책용 contract, version의 필수 여부는 둘 다 필수이고 contract는 버전이나 의존성이 바뀌어도 유지되는 논리적 계약 식별자다. 다만 정책/계획 각각의 필드 타입, 허용 값과 패턴, 계획서 필수 여부와 식별 대상, 의존성 해석 규칙은 미결정이며 사용자 논의 후 결정한다. 선행 답변의 string 타입은 미승인 예시로 취급한다. SCHEMA_AND_FAMILY_POLICY의 파일은 담당 세션 외 수정하지 않는다."
  - "LG-03 사용자 결정: 정책의 contract 값은 파일/스키마 버전과 독립적인 논리적 계약 식별자를 URN으로 표현한다. URN의 네임스페이스·유일성 충돌 방지·정규식/허용 값은 미결정이다. 정책 인스턴스는 YAML, 검증 스키마 정의는 JSON Schema로 구분한다. type/string/pattern 등 미승인 형식은 확정하지 않는다. 계획용 필드명은 plan_contract, plan_version으로만 확정하며 필수 여부·형식 등 세부 구조는 별도 후순위 논의로 둔다. 당장은 정책용 Policy_Status_version.schema.json 설계에 집중하며 다른 세션 소유 스키마나 작업 기록을 수정하지 않는다."
  - "LG-03 사용자 승인: 정책 contract의 URN 충돌 방지는 계층형 네임스페이스와 등록 시 유일성 검사(D)를 결합한다. 새 논리적 계약 식별자를 최초 생성·등록할 때 이미 등록된 URN과 중복되는지 확인한다. 기존 등록된 계약을 읽거나 참조할 때마다 중복 검사하도록 강제하지 않는다. 동일 논리 계약의 버전·내부 의존성 변경만으로 새 식별자를 요구하지 않는다. 유일성 적용 범위, URN 구체 문법, 등록 원본 위치, 등록/검증 실행 방식은 미결정이며 자동화 도구를 선제 생성하지 않는다. 실제 스키마 및 타 세션 소유 작업 파일은 수정하지 않는다."
  - "LG-03 사용자 선택: 정책 contract URN 명명 계층은 C(계약 종류 > 기능 영역 > 계약 이름)를 기본 방향으로 설계한다. 충돌이 발생하면 기존 식별자의 재발급이 필요한지 우려가 제기되었으며, 신규 발급 전 중복 차단과 발급 후 기능 영역 이동의 식별자 유지/재발급은 서로 다른 문제로 검토한다. 기능 이동 시 처리, 이름 구성의 세부 문법, 의미 변화와 동일 계약 판단, 별칭/이전 규칙은 미승인·미결정이다. 실제 스키마/타 세션 소유 파일은 변경하지 않는다."
  - "LG-03 사용자 승인 RECONCILE: 기능 영역 이동이나 URN 충돌만으로 기존 URN을 자동 변경·재발급하지 않는다. 에이전트는 기존/후보 URN, 대상 정책과 논리 계약, 충돌 계약 및 원인, 확인된 참조·의존성 영향, 이름 후보별 장단점을 조사·보고한다. 새 기능 영역을 반영한 URN은 후보일 뿐이다. 사용자에게 기존 이름 유지/새 이름 승인/보류의 결정을 받고, 승인 전에는 URN 발급·변경 및 참조 수정·자동 접미사 생성을 금지한다. 신규 URN 등록 시 기계적 중복 검사는 유지하고, 버전 변경이나 내부 의존성 변경 자체만으로 새 URN을 요구하지 않는다. 이전 URN 이력·재사용, 별칭, 참조 전환 시점, 등록 원본·실행 방식 및 세부 URN 패턴은 미결정이다. 정식 스키마와 타 세션 소유 기록은 수정하지 않는다."
  - "LG-03 사용자 승인: 정책 contract 필드는 단순 URN 접두부 검사를 넘어 PTSIP의 계층 구조와 문자 규칙을 함께 검사하는 B 방향으로 설계한다. 단, 계약 구분은 후속 사용자 승인으로 정책용 policy로 고정되고 contract의 자료형은 string으로 확정되었다. 기능 영역·계약 이름의 문자 규칙은 후속 승인으로 a-z·0-9·하이픈으로 확정되었다. 기능 영역의 등록 값과 하이픈 경계 규칙은 미결정이다. policy_kind는 URN의 계약 종류와 자동 동일시하지 않는다. root_family는 후속 사용자 승인에 따라 URN 필수 상위 기능 계층에 포함한다. 필요시 신규 기계 판독형 분류 계약의 생성 여부와 형식은 별도 사용자 판단을 받는다. Java 코드·JSON Schema·YAML 계약 간 역할을 먼저 구분하며, 미승인 스키마 패턴과 신규 분류 계약은 생성하지 않는다."
  - "LG-03 사용자 승인: 정책 URN의 기능적 분류에 기존 14개 Root Family를 필수 상위 계층으로 포함한다(선택 A). 기존 root_family 정의를 활용하며 Root Family 내부의 세부 기능 영역을 일괄 사전 고정하지 않는다. policy_kind의 개발자/지원 기능 등 정책 구분과 URN 계약 종류를 자동 동일시하지 않는다. Root Family 표기의 정규화는 후속 승인에 따라 소문자로 확정되었다. 세부 기능 영역은 후속 사용자 승인으로 필수 계층으로 확정되었으며, 실제 하위 분류 목록·명명 문법·계약 이름 값·버전 패턴 및 정식 스키마 구현은 별도 결정한다. 계약 구분 policy와 contract 문자열 자료형은 후속 사용자 승인을 따른다. 영역 변경과 충돌 시 RECONCILE 사용자 결정 절차를 유지한다. 다른 작업 그룹이 소유한 계약 스키마는 수정하지 않는다."
  - "LG-03 사용자 승인: 정책용 URN에 포함하는 Root Family 값은 소문자로 정규화한다(선택 B). 기존 root_family.json의 대문자 코드(예: ARCH)는 권위 있는 분류 값으로 그대로 유지하고 URN 표현에서는 결정론적 소문자 변환(ARCH -> arch)을 적용한다. URN 안의 대문자 Root Family 표기는 허용하지 않도록 향후 형식 검증에 반영한다. policy_kind/Root Family 원본 계약을 수정하거나 세부 기능 영역·계약 이름의 문자 규칙을 자동 확정하지 않는다. 실제 Policy_Status 스키마 수정은 해당 작업 그룹 소유 영역이다."
  - "LG-03 사용자 승인: 정책용 URN에서 Root Family 아래 세부 기능 영역을 항상 필수 계층으로 둔다(선택 A). 이는 세부 기능 영역의 실제 종류·이름·목록을 지금 정의하거나 선등록하라는 뜻이 아니다. 세부 기능 분류의 규범적 소유 책임은 별도 전역 분류를 중복 신설하지 않고 기존 Root Family 계약 체계에 둔다. 현재 root_family.json은 14개 문자열 enum이므로 하위 분류의 표현 방식이나 파일 구조를 승인 없이 확장·변경하지 않는다. 기능 분류 설계는 우선순위 후순위로 미룬다. URN에서 필수 계층 존재 여부는 확정하지만 하위 분류의 허용 값·문자 문법과 실제 검증 연결은 미결정이다. RECONCILE 사용자 결정 원칙을 유지하고 다른 그룹 소유 스키마를 변경하지 않는다."
  - "LG-03 사용자 승인: 정책용 논리적 계약 URN의 계약 구분 계층은 policy로 고정한다(A). 이는 기존 policy_kind의 개발자·지원 기능 등의 분류 값을 URN 계약 구분에 삽입하거나 서로 동일시하는 결정이 아니다. 정책용 contract 필드 자료형은 단일 문자열이다(A); 추후 Policy_Status_version JSON Schema에서 type: string으로 검증한다. 이미 확정된 Root Family 필수 소문자 계층 및 세부 기능 영역 필수 계층을 보존한다. urn:ptsip 접두부 최종 지위·전체 URN 패턴·세부 기능 및 계약명 문자 규칙·version 자료형/문법·등록 방식은 승인하지 않는다. 타 세션 소유 정식 스키마는 수정하지 않는다."
  - "LG-03 사용자 승인 및 적용: 정책용 URN의 세부 기능 영역과 계약 이름은 허용 문자 집합을 ASCII 소문자(a-z), 숫자(0-9), 하이픈(-)으로 제한한다(A). 정책 계약 식별자는 type: string으로 검증하고 계약 구분 policy 및 기존 14개 Root Family의 소문자 표기와 두 필수 이름 계층을 확인한다. 사용자의 스키마 적용 요청에 따라 developer/contracts/schemas/Policy_Status/Policy_Status_version.schema.json에 현재 승인 범위만 반영했다. contract와 version의 필수 존재를 검사하지만 version 값의 타입·형식은 미결정이라 검증하지 않는다. URN NID 최종 지정·첫/끝 하이픈 및 연속 하이픈 경계 문법·세부 기능의 등록 값·추가 필드 허용 여부·등록 중복 검증 구현은 미결정이며 승인 전 임의 제한하지 않는다. Root Family 원본 enum과 타 세션 소유 작업 기록은 수정하지 않는다."
  - "LG-03 사용자 승인 및 스키마 적용: 정책용 Policy_Status_version 객체의 필수 version 필드는 단일 문자열(string)로 확정한다. developer/contracts/schemas/Policy_Status/Policy_Status_version.schema.json의 version 속성에 type: string만 추가하고 기존 required [contract, version] 및 contract URN 패턴은 유지한다. version의 구체적인 문자열 문법·허용 값·버전 비교 및 변경 규칙은 미결정이며 승인 없이 pattern, enum 또는 minLength를 추가하지 않는다. Root Family 하위 분류나 URN 등록 정책도 변경하지 않는다."
  - "LG-03 사용자 정책 결정: 기존 MAJOR.MINOR 정규식 ^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$ 은 신규 정책 버전 문법 설계의 참고 자료로만 승인하며, 신규 Policy_Status_version.schema.json의 version.pattern 채택은 아직 승인하지 않는다. 초기 MPD-0010의 상태별 MAJOR 할당(DRAFT/APPROVED/ACTIVE), 상태 전이에 따른 강제 버전 변경, 변경 종류에 따른 결정론적 자동 MAJOR/MINOR 증가를 신규 정책 체계에서 전면 배제한다. 버전만으로 상태를 추론하거나 상태만으로 버전을 추론하지 않는다. 신규 버전 증가 정책 자체는 이 결정으로 새로 만들지 않는다. 후속 사용자 결정 KEEP_LATEST로 기존 RETIRED_VERSION_PRESERVATION을 새 정책에서 폐기하고 developer/contracts/lifecycle/policy_version.json을 삭제 대상으로 확정했다. 구 구현과 참조 제거 및 실제 파일 삭제의 안전성은 의존성 검토 후 처리하며 단독 삭제하지 않는다. 다른 작업 그룹 소유 파일 및 정식 버전 스키마는 변경하지 않는다."
  - "LG-03 사용자 충돌 해결 KEEP_LATEST 확정: 2026-10-13 과거 승인에서 보존했던 RETIRED -> PRESERVE_PREVIOUS_VERSION 규칙을 최신 사용자 결정으로 대체하여 새 정책 체계에서 완전히 폐기한다. 초기 MPD-0010의 상태 연계 버전 숫자 제약 및 상태 전이/변경 종류별 자동 증가 정책도 재사용 금지다. developer/contracts/lifecycle/policy_version.json은 삭제 대상이며 수정·재사용·신규 정책 계약의 규범 근거로 삼지 않는다. 기존 MAJOR.MINOR 정규식은 참고 자료로만 사용할 수 있고 새 version.pattern 채택은 여전히 미승인이다. 정적 검색에서 developer/automation/policy/lifecycle/version_contract.go가 구 계약을 직접 읽고 current_root.go 등 검증 경로가 이를 호출하며 developer/policy/registries 및 테스트가 파일을 참조함을 확인했다. 물리적 삭제는 해당 의존성 제거/대체와 검증 전에는 실행하지 않으며, 삭제 대상이라는 결정만으로 리포지토리 참조를 깨뜨리지 않는다. 기존 이력과 타 작업 그룹 파일의 권위·소유권을 보존하고 정식 신규 스키마는 변경하지 않는다."
  - "LG-03 구현 점검(정책 확정 아님): 신규 개발자 전용 검증 경로 .ptsip/engine/developer/policy/lifecycle/Probe.go에 Policy_Status_version의 기존 승인 스키마만 사용하는 임시 구조 검증기를 생성하고 개발자 main.go에 policy-lifecycle-proof를 등록했다. 설치된 PTSIP 공식 VALIDATION 엔진 validation.schema 호출을 재사용하기 위해 schema_check/Instance.go의 어댑터를 추가했으며, 구 developer/automation/policy/lifecycle/version_contract.go의 알고리즘·규칙·호출을 재사용하지 않는다. 승인 구조에 한정한 합성 사례 12개(예상 유효 2, 거부 10)를 준비했다. 로컬 Go 단위 테스트 3건/3건 PASS와 go vet PASS는 mock 엔진/비엔진 환경의 구현 구조 검사이고, 별도 로컬 jsonschema Draft 2020-12로 12/12 기대 판정을 비교했다. 로컬 환경에 PTSIP 패키지/공식 엔진이 없어 실제 PTSIP native 호출은 NOT_VERIFIED; 명령은 UNRESOLVED 및 비영(非0) 종료를 확인했다. 정식 정책 적합성·검증기 완료·CI PASS·전체 스키마 검증은 선언하지 않는다. 정책 버전 문법, URN 네임스페이스, 세부 분류/등록, 추가 필드 허용 및 하이픈 경계 결정 전까지 임시 검증기 상태를 유지한다. 기존 계약/검증기 삭제나 워크플로우 변경은 수행하지 않았다."
  - "LG-03 사용자 승인에 따른 임시 policy-lifecycle-proof 제거: 계약 구조가 먼저 확정돼야 한다는 사용자 판단에 따라 앞서 작성한 미완성 개발자 검증 기능을 제거하였다. .ptsip/engine/developer/main.go에서 policy-lifecycle-proof 등록과 import를 삭제하고 .ptsip/engine/developer/policy/lifecycle/Probe.go, Probe_test.go 및 schema_check/Instance.go를 삭제했다. 이는 앞서 기록한 임시 구현 점검의 현행 기능 유지를 철회하는 것으로, 기존 schema-check/Engine.go, Finding.go, 공식 PTSIP 엔진 및 정책·계획 계약 스키마는 변경하지 않았다. Policy_version 및 Plan_version 계약의 책임·정식 스키마와 상위 $ref 해소를 먼저 확정한 후에만 실제 계약 기반 검증 기능 구현을 고려한다. 이번 제거는 신규 정책 문법을 추가 결정하거나 검증기/정식 스키마 완료를 선언하는 것이 아니다."
  - "LG-03 사용자 우선순위 확정(2026-10-18): 1) developer/contracts/lifecycle/Policy_version/의 정책 버전 계약 구조를 먼저 정의·구현한다. 2) 기존 developer/contracts/schemas/Policy_Status/Policy_Status_version.schema.json 및 상위 정책 스키마와의 참조를 정리한다. 3) 정식 스키마 연결 후 PTSIP 공식 VALIDATION 엔진 기반 검증을 실행한다. developer/contracts/lifecycle/Plan_version/의 구조 검토·구현은 사용자 지시에 따라 후순위로 보류하며 이 작업의 선행조건으로 요구하지 않는다. 기존 구형 developer/contracts/lifecycle/policy_version.json의 삭제 대상 및 구 검증기 미사용 결정을 유지한다. 현재 Policy_version/ 디렉터리는 존재하지 않으며 신규 정식 Policy_version 계약의 규범 원본과 기존 Policy_Status_version 스키마 간 책임 방향(원본/어댑터/역할 분리), 새 스키마의 $id·참조/등록 규칙은 사용자 결정 전 미해결이다. 다른 세션이 소유한 SCHEMA_AND_FAMILY_POLICY 작업 파일과 스키마는 임의 수정하지 않으며, 확정되지 않은 필드·버전 문법·상태 기반 자동 증가 정책을 구현하지 않는다."
  - "LG-03 새 사용자 지시 및 정책 책임 충돌 확인(2026-10-18): 기존 developer/contracts/schemas/Policy_Status/Policy_Status_version.schema.json이 contract와 version을 하나의 필수 객체로 정의한 구조는 잘못되었으며 수정한다는 방향을 제시했다. 새 책임 지정은 contract 정의 -> developer/contracts/schemas/Policy_Status/policy_status_constant.schema.json, version 정의 -> developer/contracts/lifecycle/Policy_version/이다. 기존 Policy_Status_version.schema.json의 contract+version 필수 객체 규정(적용 당시 승인/현재 HEAD 모두 존재)과 충돌하므로 무단으로 덮어쓰지 않는다. 기존 policy_status_constant.schema.json은 status,substatus만 required이고 additionalProperties:false이므로 contract 필드의 위치·필수성·URN 제약 반영 시 호환성과 상위 Public_Policy_Status.schema.json의 Schema.Policy_Status_version 및 constant 참조를 함께 검토해야 한다. 신규 Policy_version/은 현재 미존재이며 파일명·신규 $id·version 인스턴스 형태·기존 Policy_Status_version 스키마의 유지/제거/어댑터 역할은 사용자 별도 결정 전 미확정으로 둔다. KEEP_PRIOR/KEEP_LATEST/RECONCILE 정책 충돌 선택지를 제공하고 정식 스키마 담당 SCHEMA_AND_FAMILY_POLICY의 독점 소유 파일과 신규 계약 파일은 이번 LG-03 기록 작업에서 수정하지 않는다. Plan_version은 보류하고 기존 MAJOR.MINOR 패턴은 참고 자료, 상태에 따른 버전 강제 및 자동 증가는 금지한다."
  - "LG-03 사용자 승인 KEEP_LATEST 및 필수 필드 적용(2026-10-18): 이전 Policy_Status_version의 {contract,version} 복합 소유를 철회한다. contract는 developer/contracts/schemas/Policy_Status/policy_status_constant.schema.json의 최상위 required와 properties에서 소유하며 승인된 URN 정규식을 유지한다. 기존 status/substatus 및 additionalProperties:false, legacy #/$defs/policy_fields의 구 카탈로그 참조는 이 변경에서 유지한다. version은 developer/contracts/lifecycle/Policy_version/Policy_version.schema.json의 단독 required 문자열 필드로 소유한다. 기존 urn:ptsip:policy:Status-version:v1 스키마 식별자를 신규 Policy_version 파일로 이전하고 중복/낡은 developer/contracts/schemas/Policy_Status/Policy_Status_version.schema.json은 제거한다. developer/contracts/schemas/Policy_Status/Public_Policy_Status.schema.json의 Schema.Policy_Status_version은 필수이며 기존 $ref는 이전된 동일 $id를 가리키고 constant는 기존 $ref를 유지한다. 정식 권위 기록은 developer/policy/registries/public-policy-structure-governance.json#required_public_structure/policy_status_contract_and_version에 독립 저장했다. JSON 구문, field required/자료형, $id-$ref 정적 일치, 중복 옛 파일 부재는 원격 HEAD에서 확인했다. 버전 문자열 문법 및 MAJOR.MINOR 패턴 적용, URN NID 최종 승인, 미정 하이픈 경계, 등록 유일성 구현은 미결정으로 보존하고 Plan_version은 후순위 보류한다. 구 policy_version.json과 구 검증기 삭제·이식은 수행하지 않았으며 실제 공식 PTSIP 엔진/외부 $ref 해소/정책 전체 적합성 검증은 수행하지 않았다. SCHEMA_AND_FAMILY_POLICY 그룹의 진행 상태·담당 파일은 변경하지 않았다."
  - "LG-03 사용자 승인 물리적 구 버전 계약 및 Go 검증기 제거(2026-10-18): developer/contracts/lifecycle/policy_version.json 및 developer/automation/policy/lifecycle/version_contract.go를 최신 main에서 제거했다. 전용 ValidatePolicyLifecycleVersion 호출은 current_root.go에서 제거하고 현재 승인된 developer/contracts/lifecycle/Policy_version/Policy_version.schema.json의 required string 필드 검사로 제한 대체했다. 현재 적용 검증 테스트의 옛 호출도 버전 스키마 검사로 전환하고 개발 카탈로그 Registry/스키마의 lifecycle_schema_resources.version 및 testrepo/copy.go 경로를 신규 계약으로 변경하였다. 구 계약의 형식/상태 매핑 및 자동 증가 동작에 기대던 version_contract_test.go와 version_test.go의 시험은 신규 승인 문자열 스키마/권위 참조 확인으로 대체하고 타 시험이 쓰는 공통 versionPolicy fixture는 보존했다. 1개 원자적 커밋 6bee3d63bf9ae77b49c3e4a3c824ffc4218c12f8, 삭제 파일과 현재 정책 계약 경로를 원격 HEAD에서 재확인했다. 유의사항: developer/automation/policy/lifecycle/policy_lifecycle.go와 machine 하위 호출에는 과거 버전 자동 증가/형식 파싱 로직이 별개로 남아 있으며 이번 2파일 삭제만으로 해당 과거 서브시스템의 전체 철회가 완료된 것은 아니다. RETIRED 정책(GOV/CHANGE)의 오래된 contract_ref와 이전 승인/이관 기록은 역사적 자료로 남아 있다. 신규 PTSIP VALIDATION 엔진 실행과 GitHub Actions PASS는 아직 검증하지 않았고 기존 Go Repository.Validate는 과도기적 구조 검증일 뿐 정식 신규 엔진 검증기로 승격하지 않는다. SCHEMA_AND_FAMILY_POLICY 및 LEGACY_REPLACEMENT_BLOCKERS 별도 세션 소유 작업 기록은 수정하지 않았다."
  - "LG-03 사용자 승인 신규 엔진 스키마 탐색 범위 연결(2026-10-18): 기존 .ptsip/engine/developer/schema_check/Finding.go의 PTSIP VALIDATION 엔진 validation.schema 호출은 재사용하되 구조 스키마 검색 범위 developer/contracts/schemas/에 승인된 추가 루트 developer/contracts/lifecycle/Policy_version/를 포함했다. 필수 구조 파일 developer/contracts/schemas/Policy_Status/{Public_Policy_Status.schema.json,policy_status_constant.schema.json}, developer/contracts/lifecycle/Policy_version/Policy_version.schema.json의 누락을 MISSING_APPROVED_SCHEMA로 FAIL 처리한다. 기존 전체 schemas 경로 탐색, 두 루트 간 $id 중복 탐지, JSON 구문 점검과 미검증 $ref 표시를 유지한다. Finding_test.go에 파일 포함/누락 등 엔진과 독립적인 탐색 테스트 3개를 만들고 developer/tests/schema_validation/validation_test.go의 엔진 통합 fixture에 실제 승인 파일을 복사하는 방식으로 테스트를 확장했다(승인 규칙 재구현 없이 원본 사용). 교차 루트 $id 중복 및 필수 버전 파일 누락을 fail-closed로 검사하는 시나리오도 추가했다. GitHub main 커밋 44a2cbb926e66394594d7cd08332d83c39c247a3에 반영. 이 단계의 결과는 탐색/검증 진입 경로 연결이며 Policy_Status의 외부 $ref 해소, 개별 정책 인스턴스의 필수 필드 검증, 정책 적합성 및 구 검증기 대체 완료는 뜻하지 않는다. 연결된 기존 developer-schema-contracts GitHub Actions 경로와 .github/test_modes.yaml은 수정하지 않았다. 실제 로컬에 설치된 PTSIP 엔진 및 해당 Actions 결과의 실행 PASS는 아직 확보되지 않았다. Plan_version은 보류하고 타 작업 그룹 소유 기록은 수정하지 않는다."
  - "LG-03 PTSIP native execution probe 2026-10-18: 현재 사용자 지시에 따라 developer/tests/schema_validation/native_trial_test.go를 main에 시험용으로 추가했다(커밋 7c92ebb0b99bd04936c23fb10fdfe3d95c596d61). 본 시험은 설치된 PTSIP의 official VALIDATION registry/contract/executable을 직접 조회하고 validation.schema를 호출하여 실제 Policy_version 필수 문자열의 정상/무효 4건을 판별하며, Policy_Status.constant 및 Public_Policy_Status의 외부 $ref 시도 2건은 오류/성공 응답을 로그로 보고하되 미결정 계약 적합성은 주장하지 않는다. 새 코드는 developer/automation/internal/machine/{root_current.go,policy_planes.go,policy_cleanup.go} 또는 developer/automation/cmd/ptsip-dev/main.go 및 구 Go 검증기 코드·로직을 import/call하지 않는다. 이 채팅 컨테이너에는 PTSIP 실행 파일이 없고 pip 네트워크 접근도 실패하여 actual native integration execution은 NOT_VERIFIED, GitHub Actions dispatch tool도 없어 run은 미실행이다. 별도 로컬 jsonschema Draft 2020-12을 사용해 승인 현재 스키마 구조를 재현한 참조 포함 11개 사례의 판정이 모두 예상과 일치함을 확인했다. 현재 실제 저장소에는 Policy_Identity/Policy_Identity_version.schema.json 및 Policy_Rules/Policy_Rules_version.schema.json의 후행 쉼표로 인한 JSON parse 오류가 있으므로 전체 구조/Actions 검증 실패 가능성이 있으며 사용자 지시에 따라 해당 미완성 스키마는 임의 수정하지 않는다. official engine contract validation.schema의 external ref 지원 범위는 INDEPENDENT_INLINE_JSON_SCHEMA_2020_12_VALIDATION_NO_EXTERNAL_REFERENCE이며 전체 $ref 해소 지원은 NOT_ASSERTED이다. 본 기록은 시험 결과/제약만 기록하고 정책 완료나 새 검증기 공식 전환을 선언하지 않는다."
  - "LG-03 PTSIP 0.3.8b3 실제 네이티브 엔진 외부 참조 탐색 증거(2026-10-18): main 커밋 f1170e1d077867fba5dbf229a44d60ea9043501d에서 별도 진단-only GitHub Actions .github/workflows/ptsip-native-ref-probe.yml이 실제 설치 PTSIP 0.3.8b3, VALIDATION 0.3.1 validation.schema를 호출했다. 실행 URL https://github.com/Kinirin/PTSIP/actions/runs/39099370405, job 117592297404, artifact ptsip-038b3-native-ref-probe(12125429994). 인라인 Policy_version 유효 1건 valid:true, version 누락 1건 valid:false, 숫자 버전 1건 valid:false가 정확히 판정되어 Go 진단 시험 PASS. 실제 policy_status_constant, Public_Policy_Status 외부 $ref(유효·누락 사례) 및 저장소 내 대상 $id가 존재하는 synthetic 외부 $ref는 모든 경우 네이티브 status:FAIL, exit 2, error:external or unresolved schema references are not supported by this capability. 이는 PTSIP 0.3.8b3 공식 엔진의 검증 기능 경계이며 참조 대상 규범 정책 오류나 허용값 판정 아님. 같은 Actions에서 기존 schema-check를 실제 실행했으며 42개 파일 중 2개 실패, unverified_references=35, policy_conformance=NOT_ASSERTED, full_json_schema_conformance=NOT_ASSERTED, 명령 exit 1. 두 실패는 developer/contracts/schemas/Policy_Identity/Policy_Identity_version.schema.json 및 developer/contracts/schemas/Policy_Rules/Policy_Rules_version.schema.json의 기존 JSON 파싱 오류이고, Policy_version.schema.json, Public_Policy_Status.schema.json, policy_status_constant.schema.json은 모두 LIMITED_CHECK_PASS. Actions job 성공은 기대한 외부참조 엔진 한계와 독립 실패를 관측했다는 뜻이지 전체 Schema PASS 또는 정책 적합성 승인 아님. 테스트는 .ptsip/engine/developer/schema_check/Native_ref_probe_test.go(빌드 태그 ptsip_probe) 및 일회성 push/수동 실험 워크플로우로 구성되며, developer/automation/internal/machine/root_current.go, policy_planes.go, policy_cleanup.go, developer/automation/cmd/ptsip-dev/main.go 등 구 검증기는 참조·호출·이식하지 않았다. 본 작업에서 schema/기존 정책 및 타 세션 소유 기록은 변경하지 않았다. 외부 $ref의 정식 해소 방식과 버전 문법 미결정 항목은 결정되지 않은 상태 유지."
  - "LG-03 schema_resources b4 연결 및 실제 Actions 검증(2026-10-18): 사용자 승인에 따라 .ptsip/engine/developer/schema_check/Engine.go 네이티브 validation.schema 어댑터가 선택적으로 input.schema_resources를 전달하도록 리팩터링하고, ReferenceResources.go에서 기존 approvedSchemaPaths에 등록된 파일만 JSON으로 읽어 정책 상태의 실제 Policy_Status_version.$ref를 루트 스키마로 PTSIP 0.3.8b4에 전달한다. schema_resources는 developer/contracts/lifecycle/Policy_version/Policy_version.schema.json 1개만 포함한다. valid version 문자열 사례 PASS 및 누락 version invalid 판정 모두 확인했으며, status constant의 내부 #/$defs 참조는 엔진 0.3.2 미지원이므로 무작정 전달/검증 통과 주장하지 않는다. GitHub main 구현 커밋 2bd661ca063c4d569f4b949cbdae8aabb8b224f1, 재현 Actions https://github.com/Kinirin/PTSIP/actions/runs/39107814817: Ubuntu PTSIP==0.3.8b4 설치, Go schema_check 6개 테스트, developer/tests/schema_validation 통합 테스트 PASS, 전체 기존 스키마 scan 42개 LIMITED_CHECK_PASS/failed=0, reference_probe.status=PASS, reference_probe.resource_ids=[urn:ptsip:policy:Status-version:v1], positive_valid=true, missing_version_rejected=true, unverified_references=35 유지, policy_conformance/full_json_schema_conformance=NOT_ASSERTED. .github/workflows/tooling-test.yml에서 developer-schema-contracts 3개 b3 pin만 b4로 전환하고 ptsip-validation-runtime 등 무관 검증 책임 모드는 유지했다. 신규 진단 전용 .github/workflows/ptsip-schema-resources-smoke.yml이 생성되어 1차 원격 실행 성공했다. 구 Go 검증기 개발 경로 호출/이식 금지, Plan_version 보류, SCHEMA_AND_FAMILY_POLICY 및 LG-04 타 세션 그룹 파일과 미확정 정식 스키마는 변경하지 않았다. 이는 승인된 단일 외부 $ref 연결 검증으로 전체 참조 해소나 정책 적합성 확인이 아니다."
