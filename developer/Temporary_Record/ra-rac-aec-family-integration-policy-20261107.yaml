  rules:
    - id: TEMP-PCI-01
      subject: POLICY_AUTHORITY_SEPARATION
      requirement: "Support와 Developer는 독립적으로 소유한 정책 의미와 상태를 보존하고 서로의 권위를 승계하지 않는다"
    - id: TEMP-PCI-02
      subject: RESPONSIBILITY_SCOPED_USAGE
      requirement: "각 정책의 실제 의미에 필요한 RA·RAC·AEC 계약만 연결한다. 28개 디렉터리에 대한 일괄 삽입은 금지한다"
    - id: TEMP-PCI-03
      subject: SEMANTIC_CONTRACT_BOUNDARY
      requirement: "RA는 관계 선언, RAC는 책임 배정 조건, AEC는 권한 행사 조건을 구분하여 검토하고 Rego 계산은 정책 승인 또는 실행 허가와 혼동하지 않는다"
    - id: TEMP-PCI-04
      subject: EXACT_SOURCE_REFERENCE
      requirement: "정책 ID·항목 포인터·원본 리비전·유효 상태·계약 스키마를 모두 확인한 경우에만 정식 반영 후보를 제시한다"
    - id: TEMP-PCI-05
      subject: LEGACY_ISOLATION
      requirement: "새 RA 계약은 Responsibility-Authority-list.yaml과 Responsibilities_List.schema.json에 의존하지 않으며 기존 스키마는 참조 정리 후 완전히 삭제한다"
    - id: TEMP-PCI-06
      subject: NO_TEMPORARY_AUTHORITY_PROMOTION
      requirement: "임시 기록은 정식 정책·계약의 참조 입력 또는 효력 근거가 아니며, 미등록·RETIRED·DRAFT 정책을 활성화하지 않는다"
    - id: TEMP-PCI-07
      subject: DIRECT_REFERENCE_PER_APPLICABLE_RULE
      requirement: "계약이 필요한 각 규칙에 그 계약의 원본 좌표를 직접 선언한다. 정책 문서나 Family에서 계약을 상속하지 않으며, 계약이 필요 없는 규칙에는 참조를 생략한다."
    - id: TEMP-PCI-08
      subject: INDEPENDENT_CONTRACT_OWNERSHIP
      requirement: "정책 규칙은 계약 사용 여부와 참조를 소유한다. 계약 의미는 독립 계약 원본, 등록은 지정된 등록·해석 경로, 조건 평가는 승인된 원본과 독립 평가 책임에 각각 남긴다."
    - id: TEMP-PCI-09
      subject: CONTRACT_REFERENCE_ADMISSION
      requirement: "계약이 정책을 근거로 인용한 사실만으로 정책의 계약 사용을 판정하지 않는다. 정책 영역별 구조 검사, 규칙의 사용 필요성, 참조 대상 등록이 모두 확인되면 해당 규칙에 정식 반영한다."
