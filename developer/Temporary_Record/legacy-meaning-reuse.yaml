  이 기록은 정식 계약과 정책의 입력이 아니다. 사용자 결정이 채택되면 정식 영역에
  독립적으로 정의하며, 이 기록을 정식 파일의 필수 참조로 만들지 않는다.
  최종적으로 사용자 요청에 따라 Temporary_Record 전체와 함께 삭제한다.
