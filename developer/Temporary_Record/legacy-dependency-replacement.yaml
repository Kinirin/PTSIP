# 한국어 설명을 포함한 임시 작업 기록. 정식 Registry나 Resolver가 아님.
record_type: TEMPORARY_WORK_RECORD
work_id: LEGACY_DEPENDENCY_REPLACEMENT
created_at: "2026-10-17"
work_status: IN_REFORM

purpose_ko: >-
  이전 정책과 계약을 신규 설계의 암묵적인 권위로 채택하지 않고,
  사용자가 검수하여 승인한 의미만 신규 계약·스키마 구조로 재정의한다.
  과거의 필드, 스키마, 호출법 및 의존 관계를 그대로 상속하지 않는다.

scope:
  legacy_reference_paths:
    - developer/policy/approvals/
    - developer/policy/analysis/
    - developer/policy/contracts/
    - developer/policy/policy-resolver-bindings/
    - developer/policy/legacy/
    - developer/policy/registries/
    - developer/policy/schemas/
    - developer/policy/MPD-BOUND-0001.yaml
    - developer/policy/policy-resolver-contract.yaml
    - developer/policy/source-application-review.yaml
    - developer/state/
    - developer/verification/
    - developer/bindings/
    - developer/contracts/lifecycle/policy_status.json
    - developer/contracts/lifecycle/policy_version.json
  legacy_reference_existence: PARTIALLY_UNVERIFIED
  new_policy_destination: developer/policy/
  new_contract_destination: developer/contracts/

approved_directions_ko:
  - "이전 정책의 의미는 비교·참고할 수 있으나 사용자 검수 없이 새 정책의 기본값으로 채택하지 않는다."
  - "새 스키마, 계약, Resolver 및 검증기는 과거 구조나 권위를 자동으로 상속하지 않는다."
  - "이전 파일은 사용자의 명시적 삭제 요청 없이 삭제하거나 덮어쓰지 않는다."
  - "폐기 예정 영역에는 새로운 정책을 저장하지 않는다."
  - "새 계약으로 재정의할 가치가 있는 의미는 사용자 검수를 거친 다음에만 채택한다."
  - "개혁 작업 중 일부 규칙을 개별 만료시키지 않고 남은 작업을 우선 처리한다."
  - "정식 정책에 의한 충분한 대체 여부와 임시 기록 전체 정리 시점은 사용자가 결정한다."


# LG-04: temporary agent-readable execution guide, NOT a product or developer policy.
# Only two fixed index entrypoints; returned policy IDs/paths are DATA, not hardcoded rules.
engine_policy_discovery:
  contract_role: TEMPORARY_WORK_EXECUTION_GUIDE
  source_registries:
    policy_catalog: src/policy/index.yaml
    engine_catalog: src/ptsip/engines/index.json
  source_count: 2
  lookup:
    selection: EXACT_DECLARED_ENGINE_KIND_AND_OPTIONAL_OPERATION
    policy_owner_relation: ENGINE_CATALOG_DECLARED_OWNER_PATH
    policy_identity_resolution: EXACT_POLICY_CATALOG_PATH_MATCH
    eligible_policy_status: ACTIVE
    eligible_authority_role: CANONICAL_AUTHORITY
    fixed_policy_ids: FORBIDDEN
    fixed_policy_paths: FORBIDDEN
    semantic_guessing: FORBIDDEN
    legacy_fallback: FORBIDDEN
    missing_ambiguous_or_nonactive: UNRESOLVED_FAIL_CLOSED
    other_responsibility_without_declared_index_relation: UNRESOLVED_NO_INFERENCE
    successful_lookup_is_policy_validation_pass: false
    successful_lookup_grants_engine_execution_authority: false
  implementation:
    temporary_lookup_tool: developer/Temporary_Record/tools/lg04_engine_policy_lookup.py
    temporary_tool_role: READ_ONLY_INDEX_ROUTING_PROOF
    future_developer_validator_root: .ptsip/engine/developer/
    new_validator_in_legacy_automation_root: FORBIDDEN
    legacy_validator_code_migration: FORBIDDEN
    product_engine_implementation: OUT_OF_SCOPE
    full_product_engine_conformance: OUT_OF_SCOPE
    installed_engine_use: SEPARATE_IMPLEMENTATION_STAGE
    temporary_record_as_formal_runtime_input: FORBIDDEN
  promotion:
    temporary_lookup_tool_promoted_as_formal_policy: FORBIDDEN
    new_permanent_lookup_contract: SEPARATE_POLICY_AND_IMPLEMENTATION_SCOPE

last_checkpoint:
  date: "2026-10-17"
  confirmation_type: USER_SCOPE_AND_BOUNDARY_REVIEW
  old_references_all_removed: NOT_CONFIRMED
  replacement_mapping_complete: NOT_CONFIRMED
