temporary_lifecycle_ko: >-
  이 파일은 대체용 정식 Registry나 자동 검증기가 아니다.
  정식 정책이 충분히 대체 가능하다는 사용자의 결정과 삭제 요청 후에
  임시 폴더 전체와 함께 정리한다.
