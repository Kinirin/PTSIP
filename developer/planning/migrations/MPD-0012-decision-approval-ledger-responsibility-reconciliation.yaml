  target_policy_version: "3.0"
  version_reason: ACTIVE_INCOMPATIBLE_NORMATIVE_RESPONSIBILITY_REDEFINITION
  new_family_policy_creation:
    default: FORBIDDEN
    explicitly_approved:
      - policy_id: MPD-WORK-0004
        family: WORK
        title: Mutation Authorization Gate
        initial_status: DRAFT
        draft_approval_ref: developer/policy/approvals/MPA-20261004-MPD-WORK-0004-MUTATION-AUTHORIZATION-GATE-DRAFT.yaml
        responsibility_analysis_ref: developer/policy/analysis/PRA-20261004-WORK-MUTATION-AUTHORIZATION-GATE.yaml
        implementation_authorized_by_draft_approval: false
  family_policy_dependencies_may_remain_when_REQUIRED_BY_THEIR_OWN_RESPONSIBILITIES: true
  minimum_change_strategy: FORBIDDEN_AS_RESPONSIBILITY_SPLIT_CRITERION

disposition_vocabulary:
  - KEEP_IN_MPD_0012
  - MOVE_TO_EXISTING_OWNER
  - HISTORICAL_REFERENCE_ONLY
  - OWNER_DECISION_REQUIRED

target_boundary:
  mpd_0012_owns:
    - DECISION_IDENTITY
    - DECISION_CLASSIFICATION
    - DECISION_STATE
    - APPROVAL_STATE
    - PROVISIONAL_OR_DEFERRED_CLASSIFICATION
    - DECISION_DATE
    - ACTIVATION_DECISION
    - DECISION_PROVENANCE
    - APPROVAL_AND_AUTHORIZATION_SCOPE_RECORD
  mpd_0012_does_not_own:
    - NORMATIVE_SEMANTICS
    - AGENT_CONTRACT_AUTHORITY_SEMANTICS
    - SOURCE_OR_FEATURE_CONTRACT_SEMANTICS
    - SEMANTIC_VERIFICATION_RULES
    - IMPLEMENTATION_RESOLUTION_SEMANTICS
    - MUTATION_SEMANTICS
    - MIGRATION_SEMANTICS
    - REPOSITORY_MATERIALIZATION_STATE
    - VALIDATION_EVIDENCE
  ledger_rule:
    decision_record_may_name_canonical_owner: true
    naming_owner_creates_runtime_dependency: false
    semantic_payload_duplication_from_owner_policy: FORBIDDEN
    historical_reference_creates_normative_authority: false

responsibility_inventory:
