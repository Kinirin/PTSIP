    source: rules.authority_semantics
    disposition: KEEP_IN_MPD_0012
    target_owner: MPD-0012
    action: REWRITE_AS_LEDGER_AUTHORITY_BOUNDARY
    requirements:
      - REMOVE_CLAIM_THAT_APPROVED_DECISION_PAYLOAD_IS_RUNTIME_SEMANTIC_AUTHORITY
