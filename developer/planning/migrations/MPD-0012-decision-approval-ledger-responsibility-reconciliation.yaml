stale_coupling_inventory:
  - path: developer/automation/markdown_cleanup.py
    coupling: DIRECT_LOAD_OF_MPD_0012_MARKDOWN_CLEANUP_PRECONDITIONS
    disposition: RETIRE_ONE_OFF_ACTIVE_COUPLING_AFTER_COMPLETED_MIGRATION
  - path: developer/automation/markdown_cleanup_workflow.yaml
    coupling: DIRECT_POLICY_REF_TO_MPD_0012_MARKDOWN_CLEANUP_PRECONDITIONS
    disposition: RETIRE_ONE_OFF_ACTIVE_COUPLING_AFTER_COMPLETED_MIGRATION
  - path: developer/tests/test_markdown_cleanup.py
    coupling: TEST_FIXTURE_REQUIRES_OLD_MPD_0012_SECTION
    disposition: RETIRE_WITH_COMPLETED_ONE_OFF_AUTOMATION
  - path: .github/workflows/tooling-test.yml
    coupling: ACTIVE_MARKDOWN_CLEANUP_SIMULATION_ROUTE
    disposition: REMOVE_COMPLETED_ONE_OFF_ROUTE_AFTER_RECONCILIATION
  - path: developer/policy/PLAN/MPD-PLAN-0004.yaml
    coupling: SOURCE_SNAPSHOT_REF_POINTS_TO_MPD_0012_REPOSITORY_MATERIALIZATION_SNAPSHOT
    disposition: REPLACE_WITH_HISTORICAL_MIGRATION_OR_APPROVAL_PROVENANCE_REFERENCE_BEFORE_REMOVING_SNAPSHOT
  - path: developer/policy/source-application-review.yaml
    coupling: MPD_0012_APPROVED_DECISIONS_DESCRIBED_AS_OPERATIONAL_AUTHORITY
    disposition: REWRITE_TO_DECISION_AND_APPROVAL_LEDGER_ROLE

implementation_sequence:
  - phase: P0_OWNER_DECISIONS
    status: COMPLETE
    actions:
      - B01_RESOLVED_TO_MPD_0010_AUTHORIZATION_AND_MPD_0015_RESOLUTION_EXECUTION_REUSE
      - B02_RESOLVED_TO_INDEPENDENT_MPD_WORK_0004_MUTATION_AUTHORIZATION_GATE
    completion: ALL_OWNER_DECISION_REQUIRED_ITEMS_RESOLVED

  - phase: P1_OWNER_POLICY_MATERIALIZATION
    status: NOT_STARTED
    actions:
      - MATERIALIZE_MPD_WORK_0004_AS_DRAFT_0_0_USING_APPROVED_ANALYSIS_G01
      - KEEP_MPD_WORK_0004_NON_OPERATIONAL_WHILE_DRAFT
      - REQUIRE_EXPLICIT_PROJECT_OWNER_POLICY_CONTENT_APPROVAL_BEFORE_APPROVED_OR_ACTIVE_TRANSITION
      - DO_NOT_MOVE_MUTATION_AUTHORIZATION_RUNTIME_AUTHORITY_TO_A_DRAFT_POLICY
    completion: MPD_WORK_0004_DRAFT_EXISTS_AND_EXPLICIT_POLICY_REVIEW_GATE_IS_REACHED

  - phase: P2_EXISTING_OWNER_RECONCILIATION
    status: NOT_STARTED
    actions:
      - EXTEND_MPD_0010_WITH_AUTHORIZED_BOUNDED_PROVISIONAL_RESOLUTION_AUTHORIZATION_ONLY
      - EXTEND_MPD_0015_TO_CONSUME_APPLICABLE_PROVISIONAL_AUTHORIZATION_BEFORE_BOUNDED_RESOLUTION_EXECUTION_AND_REUSE
      - EXTEND_MPD_SPEC_0025_WITH_ONLY_THE_STABLE_FEATURE_MODEL_SEMANTICS_IDENTIFIED_BY_I10
      - EXTEND_MPD_PLAN_0004_WITH_I12_I13_I17_I19_PENDING_OR_SCOPE_SEMANTICS
      - REPLACE_MPD_PLAN_0004_SOURCE_SNAPSHOT_REF_WITH_NON_NORMATIVE_HISTORICAL_PROVENANCE
      - DO_NOT_DUPLICATE_SEMANTICS_ALREADY_OWNED_BY_MPD_SPEC_0024_MPD_VERI_0004_MPD_SPEC_0007_OR_MPD_SPEC_0021
    completion: EVERY_MOVE_TO_EXISTING_OWNER_ITEM_HAS_ONE_CANONICAL_OWNER_WITH_NO_DUPLICATE_RUNTIME_AUTHORITY

  - phase: P3_COMPLETED_MIGRATION_COUPLING_RETIREMENT
    status: NOT_STARTED
    actions:
      - RETIRE_ACTIVE_MPD_0012_MARKDOWN_CLEANUP_POLICY_COUPLING
      - REMOVE_COMPLETED_MARKDOWN_CLEANUP_SIMULATION_FROM_DEFAULT_CI_ROUTING
      - PRESERVE_COMPLETED_MIGRATION_AND_VERIFICATION_HISTORY_IN_DEVELOPER_PLANNING_MIGRATIONS_AND_GIT_HISTORY
      - VERIFY_NO_ACTIVE_EXECUTION_PATH_REQUIRES_REMOVED_MPD_0012_CLEANUP_SEMANTICS
    completion: ACTIVE_REFERENCE_COUNT_TO_MPD_0012_MARKDOWN_CLEANUP_PRECONDITIONS_ZERO

  - phase: P4_MPD_0012_LEDGER_REWRITE
    status: NOT_STARTED
    actions:
      - BUMP_MPD_0012_TO_3_0
      - REPLACE_APPROVED_DECISION_SEMANTIC_PAYLOADS_WITH_DECISION_STATE_OWNER_AND_PROVENANCE_RECORDS
      - REPLACE_PROVISIONAL_SEMANTIC_PAYLOADS_WITH_PROVISIONAL_DECISION_STATE_OWNER_AND_PROVENANCE_RECORDS
      - REMOVE_REPOSITORY_MATERIALIZATION_SNAPSHOT
      - REMOVE_VALIDATION_EVIDENCE
      - NORMALIZE_ACTIVATION_BOUNDARY_TO_APPROVAL_AND_AUTHORIZATION_SCOPE_RECORD
      - REMOVE_SEMANTIC_EXTENDS_AND_DEPENDS_ON_RELATIONS_NO_LONGER_REQUIRED_BY_LEDGER_OPERATION
    completion: MPD_0012_CONTAINS_ONLY_DECISION_APPROVAL_PROVENANCE_AND_AUTHORIZATION_SCOPE_STATE

  - phase: P5_ENTRY_AND_SOURCE_RECONCILIATION
    status: NOT_STARTED
    actions:
      - UPDATE_SOURCE_APPLICATION_REVIEW_TO_QUERY_NEW_LEDGER_SECTIONS
      - REMOVE_CLAIM_THAT_MPD_0012_APPROVED_DECISION_PAYLOAD_IS_OPERATIONAL_SEMANTIC_AUTHORITY
      - DO_NOT_ADD_MPD_0012_AS_RUNTIME_POLICY_RESOLVER_SEMANTIC_INPUT
      - PRESERVE_EXISTING_FAMILY_POLICY_RESOLVER_BINDINGS_ACCORDING_TO_THEIR_OWN_RESPONSIBILITIES
    completion: AGENT_ENTRY_CAN_REACH_CANONICAL_FAMILY_OWNERS_WITHOUT_READING_LEDGER_FOR_DOMAIN_SEMANTICS

  - phase: P6_VERIFICATION
    status: NOT_STARTED
    required_checks:
      - DEVELOPER_POLICY_VALIDATION_PASS
      - RESPONSIBILITY_ANALYSIS_GATE_PASS
      - POLICY_PLAN_BINDING_REGISTRY_PASS
      - NO_ACTIVE_REFERENCE_TO_REMOVED_MPD_0012_SEMANTIC_PATHS
      - MPD_0012_LEDGER_ONLY_BOUNDARY_PASS
      - FAMILY_OWNER_DUPLICATE_AUTHORITY_CHECK_PASS
