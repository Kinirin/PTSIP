    - OPAQUE_NON_SEMANTIC_ID_AND_EXACT_MATCH_ONLY
    - DIFFERENT_EVENT_ID_REASSIGNMENT_PERMANENTLY_FORBIDDEN
    - VERIFIED_SAME_EVENT_MAY_REFERENCE_EXISTING_ID
    - UNKNOWN_EVENT_EQUIVALENCE_NEVER_AUTOMATICALLY_MERGED
    - RECORD_ACTIVE_SOURCE_AND_RETENTION_AUTHORITY_PRESERVED
    - NON_REASSIGNMENT_DOES_NOT_REQUIRE_UNAUTHORIZED_NEW_RECORD_RETENTION_DUTY
    - ANALYSIS_OWNS_EVIDENCE_REFERENCES
    - CONTEXT_FIRST_DERIVED_REVERSE_INDEX_IS_NON_AUTHORITATIVE
    - FORK_AND_RELOCATION_CREATE_INDEPENDENT_ANALYSIS
    - FORK_AUDIT_REQUEST_ONLY_EXISTING_VERIFIED_LOCAL_RECORDS
    - NO_CROSS_REPOSITORY_ORIGIN_LOOKUP_PREREQUISITE

