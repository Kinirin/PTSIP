    listed_components_are_not_forced_all_test_modes: true
    final_selection: EFFECTIVE_PROFILE_RESOLVER
    required_failures_cannot_be_waived: true

planned_work_packages:
  - id: P0-01
    title: Effective authority and existing contract coverage inventory
    depends_on: []
    outputs: [EXACT_POLICY_REVISION_MAP, EXISTING_CONTRACT_COVERAGE_MATRIX, CONFLICT_AND_GAP_LEDGER]
    requirements:
      - DISTINGUISH_ACTIVE_AUTHORITY_FROM_DRAFT_DIRECTION
      - REUSE_EXISTING_MACHINE_CONTRACT_AND_RESOLVER
      - CHECK_CURRENT_BRANCH_HEAD_AND_EFFECTIVE_PROFILE
    acceptance:
      - ALL_RELEVANT_AUTHORITIES_RESOLVED_OR_EXPLICITLY_UNRESOLVED
      - NO_DUPLICATE_NORMATIVE_CONTRACT_OWNER
  - id: P0-02
    title: Policy-derived machine contract interface specification
    depends_on: [P0-01]
    outputs: [VERSIONED_CANDIDATE_CONTRACT_SPEC, POLICY_TO_CONTRACT_BINDINGS, FAILURE_AND_PROOF_OBLIGATION_MATRIX]
    requirements:
      - PRESERVE_SIX_CANONICAL_ACCESS_PRIMITIVE_RESPONSIBILITIES
      - TYPED_INPUT_OUTPUT_OPERATION_AND_FAILURE_SEMANTICS
      - FAILURE_CANNOT_GRANT_IDENTITY_OR_REUSE_AUTHORITY
      - NO_LANGUAGE_SPECIFIC_NORMATIVE_SEMANTICS
      - NO_UNAPPROVED_CANONICAL_ACTIVATION
    acceptance:
      - EVERY_CONTRACT_SEMANTIC_HAS_EXACT_POLICY_OR_APPROVED_CONTRACT_SOURCE
      - UNRESOLVED_SEMANTIC_REQUIRES_ESCALATION_NOT_DEFAULT_SELECTION
  - id: P0-03
    title: Deterministic plan projection and verification responsibility mapping
    depends_on: [P0-02]
    outputs: [CONTRACT_TO_PLAN_WORK_PACKET_MAPPING, AUTOMATIC_TEST_MODE_RESOLUTION_CRITERIA]
    requirements:
      - EXISTING_WU_05_RESOLVER_FIRST
      - PLAN_PROJECTION_CONVEYS_NO_NEW_AUTHORITY
      - NO_DEFAULT_ALL_TEST_MODES_WITHOUT_REQUIREMENT
    acceptance:
      - EXACT_MATCH_ROUTING_AND_FAIL_CLOSED_UNRESOLVED_RESULT
      - IMPLEMENTATION_REMAINS_UNAUTHORIZED
  - id: P1-01
    title: Opaque repository-scoped issuance contract
    depends_on: [P0-02]
    outputs: [OPAQUE_ID_ISSUANCE_OPERATION_CANDIDATE, SOURCE_AND_METADATA_SEPARATION_RULES]
    requirements:
      - ID_VALUE_HAS_NO_TIME_SOURCE_TYPE_FEATURE_OR_CLASSIFICATION_MEANING
      - PROVIDER_NATIVE_ID_FORMAT_NOT_REDEFINED
      - CONSUMER_REPOSITORY_LOCAL_UNIQUENESS
      - ISSUANCE_USES_PROVEN_UNASSIGNED_ID_IN_SCOPE
    acceptance:
      - NO_ID_STRING_MEANING_OR_FILENAME_BASED_RESOLUTION
      - COLLISION_AND_AMBIGUITY_HAVE_EXPLICIT_FAILURE_SEMANTICS
  - id: P1-02
    title: Issued-ID history and irreversible non-reassignment proof
    depends_on: [P1-01]
    outputs: [EVER_ISSUED_PROOF_INTERFACE_CANDIDATE, RETIREMENT_AND_CLEANUP_NEGATIVE_VECTORS]
    requirements:
      - RETIREMENT_OR_CLEANUP_NEVER_RELEASES_ID_FOR_DISTINCT_OBSERVATION
      - MISSING_REGISTRY_ENTRY_IS_NOT_PROOF_OF_NEVER_ASSIGNED
      - UNKNOWN_PRIOR_ISSUANCE_FAIL_CLOSED
      - NEVER_CREATE_NEW_GLOBAL_REGISTRY_OR_RECORD_RETENTION_AUTHORITY_SILENTLY
    acceptance:
      - DISTINCT_OBSERVATION_CANNOT_REUSE_HISTORICALLY_ISSUED_ID
      - RECORD_RETENTION_RULES_ARE_INDEPENDENT_FROM_ID_NON_REASSIGNMENT
  - id: P1-03
    title: Same-event reuse preservation and conformance vectors
    depends_on: [P1-01, P1-02, P0-03]
    outputs: [SUCCESS_FAILURE_NEGATIVE_CONFORMANCE_VECTOR_PLAN, VERIFICATION_GATE_MATRIX]
    requirements:
      - VERIFIED_SAME_EVENT_REUSE_OF_EXISTING_ID_REMAINS_ALLOWED
      - PROVIDER_ID_OR_PAYLOAD_SIMILARITY_ALONE_IS_NOT_SAME_EVENT_PROOF
      - UNRESOLVED_SAME_EVENT_PROOF_BLOCKS_MERGE_OR_REUSE
      - RACE_COLLISION_RETIREMENT_SOURCE_REVISION_AND_METADATA_CHANGE_TEST_CASES
      - REQUIRE_MACHINE_CONTRACT_PROOF_FOR_EACH_EXPECTED_OUTCOME
    acceptance:
      - EXAMPLES_COVER_NEW_ISSUE_VERIFIED_REOBSERVATION_DISTINCT_EVENT_AND_UNKNOWN_PROOF
      - NEGATIVE_CASES_CANNOT_LEAK_FALSE_AUTHORITY
      - RESPONSIBILITY_SELECTED_TEST_MODES_AND_BASELINE_REGRESSIONS_DEFINED
  - id: P1-04
    title: Contract plan approval package
    depends_on: [P1-03]
    outputs: [POLICY_COVERAGE_REPORT, OPEN_AUTHORITY_DECISIONS, EXECUTION_READINESS_CHECKLIST, APPROVAL_HANDOFF]
    requirements:
      - NO_CODE_OR_RUNTIME_IMPLEMENTATION_IN_THIS_PROPOSAL
      - NO_ACTIVATION_WITH_OPEN_REQUIRED_POLICY_OR_PROOF_GAP
      - REQUIRE_SEPARATE_APPROVAL_BEFORE_IMPLEMENTATION
    acceptance:
      - ALL_P0_P1_ACCEPTANCE_GATES_ARE_EXPLICIT_AND_MACHINE_TESTABLE
      - APPROVAL_IS_PENDING_AND_IMPLEMENTATION_AUTHORIZATION_IS_HOLD

