    - {id: SFP-RECORD-0001, path: src/policy/RECORD/SFP-RECORD-0001.yaml, status_at_review: ACTIVE, responsibility: ORIGINAL_PROVENANCE_AND_RETENTION}
    - {id: SFP-RECORD-0004, path: src/policy/RECORD/SFP-RECORD-0004.yaml, status_at_review: DRAFT, responsibility: ANALYSIS_WORKING_RETENTION_BOUNDARY}
