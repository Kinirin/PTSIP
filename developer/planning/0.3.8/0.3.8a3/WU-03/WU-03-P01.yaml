    plan_ref: developer/planning/0.3.8/0.3.8a3/WU-03/WU-03.yaml
    candidate_root: src/agent_contracts/
    normative_activation_status: VERIFY_AT_EXECUTION_PREFLIGHT
    candidate_format: JSON
    structure_validation: JSON_SCHEMA
    conformance_vectors: JSON
    required_primitive_roles: [primitive_id, input_schema_ref, output_schema_ref, operation_semantics_ref, failure_semantics_ref, conformance_vectors_ref]
    four_field_collapse: FORBIDDEN
  resolver_and_plan_projection:
    plan_ref: developer/planning/0.3.8/0.3.8a3/WU-05/WU-05.yaml
    reuse_existing_resolver_before_building_new_one: true
    exact_identity_binding: REQUIRED
    guess_semantic_equivalence: FORBIDDEN
