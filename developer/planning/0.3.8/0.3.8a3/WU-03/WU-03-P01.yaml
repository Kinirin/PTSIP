    - {id: SFP-INFO-0005, path: src/policy/INFO/SFP-INFO-0005.yaml, status_at_review: DRAFT, responsibility: ANALYSIS_OWNED_REGISTERED_EVIDENCE_REFERENCES}
    - {id: SFP-CNTR-0006, path: src/policy/CNTR/SFP-CNTR-0006.yaml, status_at_review: DRAFT, responsibility: TYPED_RESOLUTION_AND_CONTEXT_FIRST_LOOKUP}
