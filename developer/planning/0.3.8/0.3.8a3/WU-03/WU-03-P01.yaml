objective:
  first_vertical_slice: POLICY_BINDING_AND_CONTEXT_EVIDENCE_ID_ISSUANCE
  phases: [P0_POLICY_TO_CONTRACT_BINDING, P1_CONTEXT_EVIDENCE_ID_CONTRACT]
  future_phases: [P2_PROVIDER_AND_EVENT_PROOF, P3_ANALYSIS_REFERENCES, P4_RELOCATION_FORK_AUDIT, P5_INTEGRATION_AND_COST_MEASUREMENT]
  future_phases_authorized_by_this_plan: false
  result: >-
    Design a policy-derived, language-neutral candidate machine-contract and
    execution plan for consumer-repository-local opaque Context/Evidence IDs,
    permanent non-reassignment, proof-bound reuse, and automated conformance.
    No implementation is authorized by this draft.

authority_boundary:
  order: [EFFECTIVE_POLICY, APPROVED_PLAN, IMPLEMENTATION]
  active_policy_must_not_be_overridden: true
  draft_policy_may_not_be_activated_by_plan: true
  contract_may_not_invent_normative_semantics: true
  no_dual_normative_contract_authority: true
  exact_registered_bindings_before_agent_inference: true
  uncertain_new_policy_or_required_proof: ESCALATE_WITHOUT_MUTATION
  policy_refs:
