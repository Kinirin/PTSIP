policy_class: PTSIP_DEVELOPER_POLICY
plan_id: PLAN-0.3.8A3-MPD-0015

work_unit:
  id: WU-08
  title: Conformance cutover and 0.3.8a3 readiness gate
  classification: CORE/RELEASE-BLOCKING
  lifecycle: {status: BLOCKED}
  approval: {status: APPROVED, inherited_from: [PLAN-0.3.8A3-MPD-0015], approval_source: USER_EXPLICIT}
  implementation_authorization: {status: AUTHORIZED, authorization_source: USER_EXPLICIT}
  depends_on: [WU-06, WU-07]

  objective: >-
    Prove conformance to the approved semantic baseline, activate the language-neutral contract authority only when cutover requirements are met, and establish a bounded readiness result for a future Go canonical runtime candidate without freezing Python implementation evolution.

  canonical_serialization_decision:
    status: ADOPTED
    scheme: PTSIP_CANONICAL_JSON_V1
    authority_source: USER_EXPLICIT
    policy_ref: MPD-0015
    fixed_rules:
      - UTF_8
      - BOM_FORBIDDEN
      - DUPLICATE_OBJECT_KEYS_FORBIDDEN
      - DETERMINISTIC_OBJECT_MEMBER_ORDER
      - ARRAY_ELEMENT_ORDER_PRESERVED
      - INSIGNIFICANT_WHITESPACE_FORBIDDEN_IN_CANONICAL_OUTPUT
      - AMBIGUOUS_OR_UNSUPPORTED_INPUT_FAILS_CLOSED
    adopted_subrules:
      number:
        option: N2
        model: EXACT_DECIMAL_VALUE
        binary_floating_point_conversion_for_canonicalization: FORBIDDEN
        negative_zero: NORMALIZE_TO_ZERO
        canonical_decimal_lexical_form:
          option: L2
          model: NORMALIZED_EXACT_SCIENTIFIC
          zero: "0"
          exactly_one_nonzero_digit_before_decimal_point: true
          lowercase_exponent_marker: true
          exponent_plus_sign: FORBIDDEN
          exponent_leading_zeroes: FORBIDDEN
          trailing_fractional_zeroes: FORBIDDEN
          rounding: FORBIDDEN
      unicode:
        option: U2
        normalization: NFC
        applies_to: [OBJECT_MEMBER_NAMES, STRING_VALUES]
        compatibility_normalization: FORBIDDEN
        post_normalization_object_key_collision: FAIL_CLOSED
      string_escape:
        option: E1
        model: MINIMAL_UTF8_ESCAPE
        non_control_unicode: EMIT_UTF8
        unnecessary_unicode_escape: FORBIDDEN
        lone_surrogate: FAIL_CLOSED
    unresolved_subrules: []
    canonical_serialization_semantics_status: COMPLETE
    canonical_digest_status: UNRESOLVED
    activation_blocked_until_digest_and_other_required_checks_resolved: true

  canonical_digest_decision:
    management_model:
      option: D-B
      model: SINGLE_ACTIVE_WITH_ALGORITHM_AGILITY
      status: ADOPTED
      authority_source: USER_EXPLICIT
    registry:
      multiple_registered_schemes_allowed: true
      multiple_digest_emission_allowed: true
      roles: [CANONICAL, SUPPORTED, RETIRED]
      canonical_role_cardinality: EXACTLY_ONE_ACTIVE
    canonical_use:
      semantic_equality: ACTIVE_CANONICAL_ONLY
      stale_state_detection: ACTIVE_CANONICAL_ONLY
      evidence_binding: ACTIVE_CANONICAL_ONLY
      noncanonical_fallback: FORBIDDEN
    scheme_identity_components:
      - NORMATIVE_SEMANTIC_PROJECTION
      - PTSIP_CANONICAL_JSON_V1
      - HASH_ALGORITHM
      - OUTPUT_ENCODING
    active_scheme: UNRESOLVED
    normative_semantic_projection: UNRESOLVED
    overall_digest_semantics_status: PARTIALLY_RESOLVED

    projection:
      id: PTSIP_NORMATIVE_SEMANTIC_PROJECTION_V1
      collection_order:
        option: C3
        model: MEANING_AWARE_COLLECTION_ORDER
        collection_type_must_be_explicit: true
        set_like:
          ordering: DETERMINISTIC_SORT
          strategy: S2_PRIMARY_S3_EXACT_BINDING_EXCEPTION
          primary:
            option: S2
            model: STABLE_SEMANTIC_IDENTITY
            identity_contract: UNRESOLVED
            missing_or_invalid_identity: FAIL_CLOSED
          exception:
            option: S3
            model: COLLECTION_EXACT_SORT_BINDING
            explicit_exception_required: true
            exact_bindings: UNRESOLVED
            automatic_exception_inference: FORBIDDEN
            missing_binding: FAIL_CLOSED
        ordered:
          ordering: PRESERVE_DECLARED_ORDER
        unclassified_collection: FAIL_CLOSED
      field_governance:
        model: P2_PLUS_P3_DUAL_GUARD
        include_allowlist_required: true
        exclude_denylist_veto: true
        eligible_only_when_included_and_not_excluded: true
        include_exclude_overlap:
          classification: POLICY_CONFLICT
          behavior: FAIL_CLOSED
          digest_generation_allowed: false
        unclassified_field: FAIL_CLOSED
        ai_auto_admission: FORBIDDEN
        exact_include_list:
          option: I3
          model: SEMANTIC_ROLE_WITH_EXACT_BINDING
          semantic_role_registry_required: true
          exact_binding_required: true
          automatic_binding_inference: FORBIDDEN
          unresolved_role_or_binding: FAIL_CLOSED
          exact_semantic_roles: UNRESOLVED
          exact_role_bindings: UNRESOLVED
        exact_exclude_list:
          option: E3
          model: SEMANTIC_ROLE_WITH_EXACT_BINDING
          semantic_role_registry_required: true
          exact_binding_required: true
          automatic_binding_inference: FORBIDDEN
          unresolved_role_or_binding: FAIL_CLOSED
          exact_semantic_roles: UNRESOLVED
          exact_role_bindings: UNRESOLVED

    selected_digest_components:
      hash_algorithm: SHA_256
      output_encoding: LOWERCASE_HEXADECIMAL
      digest_size_bits: 256
      output_length_characters: 64
      active_scheme_activation: BLOCKED_UNTIL_PROJECTION_COMPLETE

  semantic_baseline:
    comparison_target: CURRENT_APPROVED_SEMANTIC_BASELINE
    python_is_reference_implementation_not_authority: true
    python_may_change_during_plan_execution: true
    conformance_recheck_required_after_relevant_python_change: true
    semantic_baseline_may_not_be_silently_redefined_by_python_changes: true

  reasoning_boundary:
    fixed:
      - ALL_REQUIRED_CONFORMANCE_DIMENSIONS_MUST_PASS_FOR_CUTOVER
      - UNKNOWN_REQUIRED_SEMANTICS_BLOCKS_CUTOVER
      - DUAL_NORMATIVE_AUTHORITY_IS_FORBIDDEN
      - PYTHON_REMOVAL_WITHOUT_SEPARATE_AUTHORIZATION_BY_THIS_WORK_UNIT_IS_FORBIDDEN
      - PYTHON_EVOLUTION_IS_ALLOWED_WHEN_SEMANTIC_CONFORMANCE_IS_PRESERVED
      - TESTS_MAY_NOT_REDEFINE_CONTRACT_SEMANTICS
      - GO_RUNTIME_IMPLEMENTATION_IS_OUTSIDE_THIS_WORK_UNIT
      - FINAL_.PTSIP_RUNTIME_PERSISTENCE_SEMANTICS_ARE_NOT_CLAIMED
    bounded_reasoning:
      - TEST_VECTOR_SELECTION
      - EDGE_CASE_EXPANSION
      - REGRESSION_TARGET_SELECTION
      - CONFORMANCE_TEST_ORGANIZATION
      - DIAGNOSTIC_EVIDENCE_PRESENTATION
    candidate_only:
      - ADDITIONAL_CONFORMANCE_VECTOR
      - NEW_NEGATIVE_TEST_CASE
      - FUTURE_GO_RUNTIME_READINESS_REQUIREMENT
    escalation_required:
      - CONTRACT_AND_PYTHON_SEMANTIC_MISMATCH_WITH_NO_EXISTING_AUTHORITY
      - REQUEST_TO_WAIVE_A_REQUIRED_CONFORMANCE_FAILURE
      - REQUEST_TO_REMOVE_PYTHON_WITHOUT_SEPARATE_AUTHORIZATION
      - PYTHON_CHANGE_THAT_REQUIRES_NEW_NORMATIVE_SEMANTICS
      - REQUEST_TO_ACTIVATE_GO_AS_CANONICAL_RUNTIME
      - REQUEST_TO_FINALIZE_.PTSIP_RUNTIME_PERSISTENCE

  approved_conformance_test_scope:
    path: tests/ptsip/conformance/**
    operations: [MODIFY, VERIFY]
    mechanical_reference_remediation_allowed: true
    normative_expectation_change_allowed_without_applicable_authority: false

  inherited_regression_debt_gate:
    source: PLAN_0_3_8A3_PRE_EXISTING_REGRESSION_DEBT
    current_known_count: 23
    debt_origin: PRE_WU_01
    debt_is_wu01_regression: false
    failure_waiver_created: false
    cutover_may_ignore_required_pre_existing_regression_debt: false
    required_action_before_cutover:
      - REVALIDATE_APPLICABLE_REGRESSION_DEBT
      - RESOLVE_OR_OBTAIN_SEPARATE_EXPLICIT_AUTHORITY_FOR_ANY_NON_APPLICABLE_CLASSIFICATION

  required_verification:
    - CONTRACT_SCHEMA_VALIDATION
    - EXACT_IDENTITY_AND_REFERENCE_RESOLUTION
    - PYTHON_IMPLEMENTATION_BINDING_RESOLUTION
    - INPUT_OUTPUT_CONFORMANCE_TO_APPROVED_SEMANTIC_BASELINE
    - EFFECT_CONFORMANCE_TO_APPROVED_SEMANTIC_BASELINE
    - FAILURE_SEMANTIC_CONFORMANCE_TO_APPROVED_SEMANTIC_BASELINE
    - STATE_TRANSITION_CONFORMANCE_TO_APPROVED_SEMANTIC_BASELINE
    - EXECUTION_FEEDBACK_LOOP_PASS
    - REASONING_PROMOTION_BOUNDARY_PASS
    - NEGATIVE_UNBOUND_SCOPE_TESTS
    - REGRESSION_TEST_MODE_PASS

  cutover:
    activate_json_contract_authority_only_if_all_required_checks_pass: true
    legacy_yaml_after_cutover: MIGRATION_REFERENCE_ONLY
    dual_normative_authority: FORBIDDEN
    python_removal_by_this_work_unit: FORBIDDEN
    python_implementation_evolution: ALLOWED_WHEN_CONFORMANT
    unresolved_required_semantics: BLOCK_CUTOVER

  go_runtime_candidate:
    role: CANONICAL_RUNTIME_CANDIDATE_READINESS
    implementation_in_this_work_unit: false
    readiness_requires_language_neutral_contract_and_conformance_vectors: true
    separate_plan_extension_or_explicit_authorization_for_implementation: true

  release_gate:
    prerelease: "0.3.8a3"
    must_not_claim:
      - COMPLETE_GENERIC_REPOSITORY_TASK_ENGINE_IF_NOT_IMPLEMENTED
      - GO_CANONICAL_RUNTIME_IF_NOT_IMPLEMENTED
      - PYTHON_REMOVAL
      - FINAL_.PTSIP_RUNTIME_PERSISTENCE_SEMANTICS


