schema_version: ptsip-prerelease-work-unit/v1alpha1
policy_class: PTSIP_DEVELOPER_POLICY
plan_id: PLAN-0.3.8A3-MPD-0015

work_unit:
  id: WU-05
  title: Deterministic resolver and automatic plan projection
  classification: CORE/RELEASE-BLOCKING
  lifecycle: {status: COMPLETE}
  approval: {status: APPROVED, inherited_from: [PLAN-0.3.8A3-MPD-0015], approval_source: USER_EXPLICIT}
  implementation_authorization: {status: COMPLETE, authorization_source: USER_EXPLICIT}
  depends_on: [WU-03, WU-04]

  objective: >-
    Resolve already-decided identities and bindings mechanically and derive
    execution plans from resolved facts, contracts, bindings, state and valid authorization.

  preferred_reuse_candidates:
    - src/agent_contracts/resolver.py
    - src/ptsip/agent_contracts/runtime.py
    - src/ptsip/migration/planner.py
    - src/ptsip/migration/direct_planner.py
    - developer/automation/implementation_work_packet.py
    - developer/automation/implementation_workflows.yaml

  resolver_rules:
    semantic_similarity_selection: FORBIDDEN
    new_normative_meaning_creation: FORBIDDEN
    exact_identity_and_explicit_binding_first: true
    unresolved_result_is_typed: true
    ai_reasoning_may_follow_only_when_machine_resolution_is_unavailable: true

  automatic_plan_inputs:
    - RESOLVED_FACTS
    - MACHINE_CONTRACTS
    - MACHINE_BINDINGS
    - CURRENT_STATE
    - VERIFIED_EVIDENCE
    - AUTHORIZATION

  mutation_boundary:
    unresolved_required_authority_allows_mutation: false
    plan_projection_is_new_authority: false

  reasoning_boundary:
    fixed:
      - EXACT_IDENTITY_AND_EXPLICIT_BINDING_PRECEDE_AI_REASONING
      - SEMANTIC_SIMILARITY_SELECTION_IS_FORBIDDEN
      - RESOLVER_MAY_NOT_CREATE_NORMATIVE_MEANING
      - UNRESOLVED_REQUIRED_AUTHORITY_DOES_NOT_AUTHORIZE_MUTATION
      - PLAN_PROJECTION_IS_NOT_NEW_AUTHORITY
    bounded_reasoning:
      - RESOLVER_PIPELINE_DECOMPOSITION
      - LOOKUP_DATA_STRUCTURE
      - CACHE_STRATEGY
      - INTERNAL_PLAN_INTERMEDIATE_REPRESENTATION
      - REUSE_SELECTION_AMONG_EXISTING_COMPATIBLE_COMPONENTS
    candidate_only:
      - NEW_RESOLUTION_ADAPTER_FOR_A_CURRENTLY_UNRESOLVED_CASE
      - NEW_PLAN_PROJECTION_OPTIMIZATION
      - NEW_MACHINE_BINDING_CANDIDATE
    escalation_required:
      - AMBIGUOUS_MULTIPLE_AUTHORITATIVE_RESOLUTIONS
      - NEW_NORMATIVE_OPERATION_MEANING
      - MISSING_REQUIRED_AUTHORIZATION
      - SCOPE_EXPANSION_OUTSIDE_APPROVED_MPD_0015_BOUNDARY

  acceptance:
    - same resolved inputs produce the same semantic plan
    - exact current binding prevents repeated AI routing
    - missing binding produces bounded unresolved state rather than guessed selection
    - existing migration/planning semantics are reused rather than replaced by a parallel DSL

completion_evidence:
- '9 focused tests PASS: exact current graph parity, no similarity routing, dependency freshness, deterministic
  existing direct-planner reuse, missing binding UNRESOLVED, no mutation authorization.'
- 'Automatic modes: ptsip-contract 96 passed / 1 known failure; ptsip-migration 58 passed / 15 failures; vpms 114
  passed / 2 known failures. All 15 migration failures reproduce with identical failure signatures at 3914cba74ea4438e76e6593237f94ababb5685ba;
  no observed new regression, no waiver.'
- Rule identity lookup is materialized during compilation; query routing is exact. JSON contracts remain unactivated.
  Existing mutation authorization and ledger mechanisms remain separate.
- WORK_PACKET_NOT_AVAILABLE. Planning validation PASS.
