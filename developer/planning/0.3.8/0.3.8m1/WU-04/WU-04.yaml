work_unit:
  id: WU-04
  title: Decompose execution state guard authorization and ledger
  lifecycle: {status: COMPLETED}
  approval: {status: APPROVED, approval_source: USER_EXPLICIT}
  implementation_authorization: {status: AUTHORIZED, authorization_source: USER_EXPLICIT}
  depends_on: [WU-01, WU-02, WU-03]
  objective: >-
    Separate execution state models, repository/mutation guards, authorization
    binding/proofs/preconditions, and checkpoint ledger storage.
  target_paths:
    - src/ptsip/migration/execution/state/**
    - src/ptsip/migration/execution/guard/**
    - src/ptsip/migration/execution/authorization/**
    - src/ptsip/migration/execution/ledger/**
  source_modules:
    - src/ptsip/migration/execution_model.py
    - src/ptsip/migration/execution_binding.py
    - src/ptsip/migration/execution_ledger.py
  invariants:
    - guard state is not authorization authority
    - authorization logic does not perform target mutation
    - ledger records and ledger persistence are separately owned
    - recovery state does not silently authorize execution
  acceptance:
    - execution binding and ledger tests introduce no new failures versus the pinned parent baseline
    - state guard authorization and ledger responsibilities are separately addressable

