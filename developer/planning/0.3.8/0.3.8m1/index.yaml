    depends_on: [WU-01, WU-02]
  - id: WU-04
    path: developer/planning/0.3.8/0.3.8m1/WU-04/WU-04.yaml
    title: Decompose execution state guard authorization and ledger
    depends_on: [WU-01, WU-02, WU-03]
  - id: WU-05
    path: developer/planning/0.3.8/0.3.8m1/WU-05/WU-05.yaml
    title: Decompose execution mutation promotion and direct flow
    depends_on: [WU-04]
  - id: WU-06
    path: developer/planning/0.3.8/0.3.8m1/WU-06/WU-06.yaml
    title: Remove flat implementation paths and verify migration package
    depends_on: [WU-02, WU-03, WU-04, WU-05]

execution_model:
