    - RESPONSIBILITY_MAP_MATCHES_IMPLEMENTED_LAYOUT
    - NO_OLD_FLAT_MIGRATION_IMPLEMENTATION_MODULES_REMAIN
    - NO_PERMANENT_PRIVATE_PATH_COMPATIBILITY_SHIMS
    - CANONICAL_PUBLIC_MIGRATION_IMPORTS_RESOLVE
    - FOCUSED_MIGRATION_TESTS_PASS
    - IMPACTED_PTSIP_REGRESSION_TESTS_PASS
    - NO_POLICY_OR_PLANNING_SCHEMA_FILE_CHANGED
    - NO_INTENTIONAL_SEMANTIC_DELTA
