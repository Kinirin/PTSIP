schema_version: ptsip-isolated-implementation-plan/v1alpha1
artifact_class: PTSIP_DEVELOPER_PLANNING

plan:
  id: PLAN-0.3.8M1-MIGRATION-RESPONSIBILITY-DECOMPOSITION
  development_line: "0.3.8"
  branch: dev/0.3.8m1
  parent_branch: dev/0.3.8
  parent_sha: 698c1a79aee06fcc0705663f8eecf9462a6d46c0
  status: DRAFT
  approval:
    status: PENDING
  implementation_authorization:
    status: NOT_AUTHORIZED
  canonical_location: developer/planning/0.3.8/0.3.8m1/index.yaml

  planning_mode: ISOLATED_BRANCH_LOCAL
  existing_planning_schema_compatibility: UNSUPPORTED_BY_CURRENT_A_B_RC_ONLY_SCHEMA

  isolation:
    policy_generation: SKIPPED_BY_USER_DIRECTION
    create_new_policy_artifacts: FORBIDDEN
    modify_existing_policy_artifacts: FORBIDDEN
    modify_policy_registries: FORBIDDEN
    modify_developer_planning_root_index: FORBIDDEN
    register_0_3_8m1_in_existing_prerelease_schema: FORBIDDEN
    reason: AVOID_CONFLICT_WITH_CONCURRENT_POLICY_AND_PLANNING_WORK
    merge_strategy: UNIQUE_PLAN_PATH_AND_MIGRATION_CODE_ONLY

  objective: >-
    Decompose src/ptsip/migration into explicit responsibility-owned modules and
    subdirectories so that future modular/extension migration can identify ownership
    mechanically without re-reading mixed-responsibility legacy modules.

  scope:
    primary:
      - src/ptsip/migration/**
      - tests/ptsip/migration/**
    conditional_import_remediation:
      - tests/ptsip/**
      - src/ptsip/**
    conditional_rule: >-
      Files outside src/ptsip/migration may change only when an exact import path,
      re-export, or test reference must be updated because of the migration package
      structural move.
    planning:
      - developer/planning/0.3.8/0.3.8m1/**
    forbidden:
      - developer/policy/**
      - developer/planning/index.yaml
      - developer/planning/schemas/**
      - specification policy or semantic changes
      - source file extension changes
      - unrelated src/ptsip subsystem restructuring

  invariants:
    - NO_NEW_POLICY_AUTHORITY
    - NO_NORMATIVE_SEMANTIC_CHANGE
    - NO_INTENTIONAL_RUNTIME_BEHAVIOR_CHANGE
    - NO_SOURCE_EXTENSION_CHANGE
    - MIGRATION_ONLY_RESTRUCTURE
    - DIRECTORY_EXISTS_ONLY_FOR_STABLE_MULTI_MODULE_RESPONSIBILITY_GROUP
    - FINAL_MODULE_HAS_ONE_PRIMARY_CHANGE_REASON
    - NO_GENERIC_UTILS_COMMON_HELPERS_BUCKET
    - MUTATION_AND_VERIFICATION_RESPONSIBILITIES_REMAIN_SEPARATE
    - NO_PERMANENT_OLD_PRIVATE_MODULE_PATH_COMPATIBILITY_SHIMS
    - CANONICAL_PUBLIC_MIGRATION_API_MUST_REMAIN_RESOLVABLE
    - ALL_OLD_FLAT_MIGRATION_IMPLEMENTATION_MODULES_REMOVED_AT_FINAL_GATE

  responsibility_map: developer/planning/0.3.8/0.3.8m1/responsibility-map.yaml

work_units:
  - id: WU-01
    path: developer/planning/0.3.8/0.3.8m1/WU-01/WU-01.yaml
    title: Freeze migration surface and relocation baseline
    depends_on: []
  - id: WU-02
    path: developer/planning/0.3.8/0.3.8m1/WU-02/WU-02.yaml
    title: Decompose analysis and proposal responsibilities
    depends_on: [WU-01]
  - id: WU-03
    path: developer/planning/0.3.8/0.3.8m1/WU-03/WU-03.yaml
