state: APPROVED.provisional
title: "GOV README 번역 등록과 활성화"
Identity:
  family: GOV
  contract_id: "urn:ptsip:policy:rule:gov:translation-activation:v1"
  version: "1"
  approval:
    state: APPROVED.provisional
    review_required: true
Definition:
  meaning: "영어 README가 안내 콘텐츠의 원본이고 활성 번역은 등록부가 결정하며, 번역은 독립적인 규범 의미를 추가하지 못한다."
  rationale: "활성 언어를 정책이나 CI의 고정 목록에 중복 저장하면 실제 등록부와 불일치할 수 있다."
Boundary:
  scope: "README 원본 권위 및 번역 등록·활성화"
  subjects: ["영어 README", "등록된 번역 문서", "번역을 조회하는 워크플로우"]
  exclusions: ["미등록 언어의 암묵적 활성화", "번역을 새 독립 규범 권위로 취급"]
Constraints:
  translation_sources:
    canonical: README.md
    activation_registry: docs/translated/index.yaml
    output_root: docs/translated/
    output_pattern: "README.{language-tag}.md"
  activation:
    eligible_languages: REGISTERED_ONLY
    hardcoded_workflow_languages_authoritative: false
    implicit_activation: FORBIDDEN
  normative_consistency:
    independent_translation_authority: false
    independent_normative_addition: FORBIDDEN
    conflict_resolution: CANONICAL_README_PREVAILS
Evaluation:
  criteria:
    evidence: ["등록부의 현재 언어 목록", "각 등록 항목의 파일 확인", "원문과 번역 충돌 판정"]
    absent_registration_result: NOT_ACTIVE
