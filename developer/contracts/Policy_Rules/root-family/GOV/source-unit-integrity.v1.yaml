state: APPROVED.provisional
title: "원본 정책 규칙 단위 보존 및 계약 분할 승인 경계"
Identity:
  family: GOV
  contract_id: "urn:ptsip:policy:rule:gov:source-unit-integrity:v1"
  version: "1"
  approval:
    state: APPROVED.provisional
Definition:
  meaning: "정책 재작성 및 계약 구조 변경에서 원본 규칙의 경계는 명시적 사용자 승인 없이 분할·병합하거나 재해석할 수 없다."
  rationale: "문서에 여러 주제·소제목·필드가 있다는 사실은 독립 계약의 개수와 소유권을 새로 결정할 근거가 아니다."
Boundary:
  scope: "모든 Root Family의 정책 의미 이전 및 독립 규칙 계약 생성 결정"
  subjects:
    - "원본 정책의 규범 의미 단위"
    - "이전 대상 정책의 Policy_Rules 참조 구조"
    - "새 독립 계약의 식별자와 수량"
  exclusions:
    - "문단 수·키워드·AI 선호도를 승인된 계약 분할 근거로 추정"
    - "검증·Resolver 구현 편의만으로 규범 단위 변경"
Constraints:
  obligations:
    - id: PRESERVE_SOURCE_UNIT
      condition: "SOURCE_POLICY_REWRITE"
      rule: "원본이 명시한 규범 단위와 승인된 독립 계약 단위를 그대로 유지"
    - id: REQUIRE_EXPLICIT_PARTITION_AUTHORITY
      condition: "PROPOSED_SPLIT_OR_MERGE"
      rule: "변경 대상 정책 하나, 이전/이후 규칙 단위, 의미·권한 영향, 선택 가능한 구조를 독립적으로 제시하고 사용자 승인 확인"
    - id: NO_UNAPPROVED_CARDINALITY_CHANGE
      condition: "NO_EXPLICIT_APPROVAL_FOR_SPLIT_OR_MERGE"
      rule: "기존 규범 단위와 다른 계약 수의 생성 또는 재편 금지"
    - id: DECLARED_EXCEPTION
      condition: "EXPLICIT_USER_APPROVED_NEW_BOUNDARY"
      rule: "승인된 범위만 변경하고 나머지 규칙·Family 작업은 계속 수행"
    - id: USE_EXISTING_FIELD_ENVELOPE
      condition: "MIGRATION_FIELD_LIMIT_CHECK"
      rule: "승인된 필수·선택 필드로 의미를 표현할 수 없다는 사실을 증명한 경우에만 새 필드 후보를 제시"
  prohibitions:
    - id: TOPIC_COUNT_TO_CONTRACT_COUNT
      operation: "원본의 주제나 하위 항목 개수로 독립 계약 수 자동 결정"
    - id: AUTO_SEMANTIC_UNIT_REPARTITION
      operation: "코딩 에이전트가 원본의 규범 의미를 단위 분할·병합으로 변경"
    - id: LEGACY_FIELD_RENAME_AS_MIGRATION
      operation: "과거 필드의 명칭만 바꾸어 새 계약 구조로 복제"
Evaluation:
  criteria:
    evidence:
      - "원본 규범 단위와 대상 규범 단위의 일대일 추적"
      - "단위 수나 소유권을 변경한 경우 명시적 사용자 승인"
      - "필드 추가가 필요한 경우 기존 필수·선택 필드의 표현 불가능성 설명"
    no_approval_result: BLOCK_AFFECTED_POLICY_REPARTITION_ONLY
