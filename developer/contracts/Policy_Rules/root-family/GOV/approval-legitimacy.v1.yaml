state: APPROVED.provisional
title: "GOV 승인 출처와 정책 상태의 정당성"
Identity:
  family: GOV
  contract_id: "urn:ptsip:policy:rule:gov:approval-legitimacy:v1"
  version: "1"
  approval:
    state: APPROVED.provisional
    review_required: true
Definition:
  meaning: "정책 등록, 생명주기 상태 전이와 개발 작업 승인은 출처, 대상 및 적용 범위가 명시적으로 일치해야 유효하다."
  rationale: "검증 PASS와 실행 가능성을 새로운 정책 승인이나 상태 권위로 오인하지 않도록 한다."
Boundary:
  scope: "정책 승인·등록·상태 전이 및 개발 작업 승인"
  subjects: ["정책 등록", "정책 상태 전이 승인", "개발 작업 승인"]
  exclusions: ["테스트 PASS 자체를 정책 승인으로 해석", "실행 허가를 정책 상태 승인으로 해석"]
Constraints:
  approval_binding:
    coordinates: [approval_source, approval_subject, target_scope, approval_decision]
    evidence_contract: UNRESOLVED
    missing: UNRESOLVED_NOT_APPROVED
  obligations:
    - "승인 출처와 승인 대상, 적용 범위 및 근거를 확인한다."
  prohibitions:
    - "CTRL의 실행 가능 판정이나 테스트 PASS로 미승인 정책 상태를 생성하지 않는다."
Evaluation:
  criteria:
    evidence: ["승인 주체와 승인 대상의 연결", "상태 전이 및 승인 근거의 적용 범위"]
    missing_result: UNRESOLVED
