schema_version: ptsip-developer-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY

policy:
  id: MPD-PLAN-0001
  version: "2.0"
  title: Developer Planning Authority and Lifecycle Boundary
  status: ACTIVE

rules:
  planning_boundary:
    authority:
      root: developer/planning/
      control_plane_entry: developer/planning/index.yaml
      ownership: PLANNING_AUTHORITY

    schema:
      root: developer/planning/schemas/
      ownership: PLANNING_AUTHORITY
      canonical_schema_files:
        - planning-root-index.schema.json
        - planning-index.schema.json
        - work-unit.schema.json
        - plan-extension.schema.json

    external_interfaces:
      policy_plan_binding:
        authority_ref: developer/bindings/policy-plan-bindings.yaml
        automation_ref: developer/automation/policy_plan_binding/
        ownership: EXTERNAL_TO_PLANNING
        authority_owner: POLICY_PLAN_BINDING
        planning_may_directly_mutate_binding_authority: false
        mutation_interface_required: true

    subsystem_ownership:
      planning_authority:
        owns:
          - PLAN_CONTENT
          - PLAN_STRUCTURE
          - PLAN_LIFECYCLE
          - PLAN_APPROVAL_STATE
          - PLAN_IMPLEMENTATION_PROGRESS
          - PLAN_COMPLETION_STATE
          - PLAN_VERIFICATION_EVIDENCE
      policy_plan_binding:
        external_to_planning: true
        owns:
          - POLICY_PLAN_RELATIONSHIP
          - BINDING_IDENTITY
          - PLAN_EXISTENCE_RELATION_STATE
          - PLAN_ID_AND_PLAN_REF_BINDING

    work_unit:
      id_pattern: '^WU-[0-9]{2}$'
      extension_id_pattern: '^WU-[0-9]{2}-P[0-9]{2}$'
      extension_meaning: PLAN_EXTENSION
      machine_fields:
        may_be_detailed: true
        minimal_size_requirement: false
        implementation_required_for_automatable_state: true

    explanation:
      suffix: '-explanation.yaml'
      machine_authority: false
      allowed_for_ambiguous_or_unsupported_definition: true

    completion_transition:
      pending_status: IMPLEMENTED_VALIDATION_PENDING
      complete_status: COMPLETE
      rule: REGISTERED_MACHINE_CHECKS_MUST_PASS_BEFORE_AUTOMATIC_PROMOTION
      failed_validation_mutation: FORBIDDEN
      post_promotion_planning_validation_required: true

relations:
  supersedes: []
  amends: []
  extends: []
  depends_on:
    - policy: MPD-SPEC-0023
      scope: POLICY_PLAN_BINDING_CONTRACT
