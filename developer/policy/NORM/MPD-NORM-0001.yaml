schema_version: ptsip-developer-root-family-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: NORM
policy:
  id: MPD-NORM-0001
  title: NORM authority (ACTIVE source responsibilities)
  status: ACTIVE
  version: '2.0'
authority_subject:
  id: DEV_RULE_NORMATIVITY
  statement: PTSIP 개발에 적용되는 규칙의 규범적 효력, 해석 및 명시적으로 선택된 immutable Specification과의 구속
    관계를 소유한다.
exclusive_kernel:
- DEV_RULE_FORCE_AND_PRECEDENCE
- DEV_NORMATIVE_INTERPRETATION
rules:
  family_definition:
    kernel_definitions:
    - id: DEV_RULE_FORCE_AND_PRECEDENCE
      statement: 개발 규칙의 MUST/MUST_NOT 의미, 적용 범위 및 명시적 규범 우선순위를 정한다. bound Specification의
        상위 요구를 완화할 수 없다.
      non_substitutability: GOV의 적법한 승인만으로 규칙의 의무 강도나 상위 Specification 구속력을 바꿀 수 없다.
    - id: DEV_NORMATIVE_INTERPRETATION
      statement: 규칙 간 충돌과 해석 가능한 범위를 선택된 규범 revision 안에서 정하고, 새 규범 의미가 필요한 변경을 식별한다.
      non_substitutability: ASSURE는 정해진 규칙으로 판정하며 새로운 규범 의미를 검증 결과에서 만들어 낼 수 없다.
    source_scope:
    - MPD-0015
    - MPD-SPEC-0002
    - MPD-SPEC-0003
    - MPD-SPEC-0004
    - MPD-SPEC-0021
    - MPD-SPEC-0024
  unit_mpd_0015_181bf674e753:
    go_role: CANONICAL_RUNTIME_CANDIDATE
    go_is_normative_authority: false
  unit_mpd_spec_0002_8b9a13c6427c:
