schema_version: ptsip-developer-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY

policy:
  id: MPD-PLAN-0001
  version: "2.1"
  title: Developer Planning Authority and Lifecycle Boundary
  status: ACTIVE

rules:
  planning_boundary:
    authority:
      root: developer/planning/
      control_plane_entry: developer/planning/index.yaml
      ownership: PLANNING_AUTHORITY

    schema:
      root: developer/planning/schemas/
      ownership: PLANNING_AUTHORITY
      canonical_schema_files:
        - planning-root-index.schema.json
        - planning-index.schema.json
        - work-unit.schema.json
        - plan-extension.schema.json

    external_interfaces:
      policy_plan_binding:
        authority_ref: developer/bindings/policy-plan-bindings.yaml
        automation_ref: developer/automation/policy_plan_binding/
        ownership: EXTERNAL_TO_PLANNING
        authority_owner: POLICY_PLAN_BINDING
        planning_may_directly_mutate_binding_authority: false
        mutation_interface_required: true

    subsystem_ownership:
      planning_authority:
        owns:
          - PLAN_CONTENT
          - PLAN_STRUCTURE
          - PLAN_LIFECYCLE
          - PLAN_APPROVAL_STATE
          - PLAN_IMPLEMENTATION_PROGRESS
          - PLAN_COMPLETION_STATE
          - PLAN_VERIFICATION_EVIDENCE
      policy_plan_binding:
        external_to_planning: true
        owns:
          - POLICY_PLAN_RELATIONSHIP
          - BINDING_IDENTITY
          - PLAN_EXISTENCE_RELATION_STATE
          - PLAN_ID_AND_PLAN_REF_BINDING

    work_unit:
      id_pattern: '^WU-[0-9]{2}$'
      extension_id_pattern: '^WU-[0-9]{2}-P[0-9]{2}$'
      extension_meaning: PLAN_EXTENSION
      machine_fields:
        may_be_detailed: true
        minimal_size_requirement: false
        implementation_required_for_automatable_state: true

    explanation:
      suffix: '-explanation.yaml'
      machine_authority: false
      allowed_for_ambiguous_or_unsupported_definition: true

    user_review_and_targeted_revision:
      decision: RECONCILE
      approval_ref: developer/policy/approvals/MPA-20261011-PLAN-REVIEW-RECONCILE.yaml
      scope: POLICY_DERIVED_PLAN_HUMAN_REVIEW_AND_TARGETED_CORRECTION
      user_review_required_before_each_stage: false
      user_review_is_approval_transition: false
      user_review_may_identify_intent_mismatch: true
      approval_state_on_review_only: PRESERVE_EXISTING_VALUE
      approval_state_on_targeted_revision: PRESERVE_EXISTING_VALUE
      implementation_authorization_state_on_review_or_revision: PRESERVE_EXISTING_VALUE
      pending_plan_does_not_become_approved_by_review: true
      completed_work_evidence_is_not_retroactively_rewritten: true
      exact_edit_scope: USER_IDENTIFIED_ISSUE_AND_PROVEN_DEPENDENT_IMPACT_ONLY
      unrelated_plan_content_status_and_evidence: PRESERVE
      changed_part_requires_policy_binding_coverage_and_registered_machine_revalidation: true
      affected_dependent_checks_only_when_MACHINE_PROVEN_COMPLETE_IMPACT_SCOPE: true
      unknown_change_impact: FAIL_CLOSED_REVALIDATE_OR_ESCALATE
      approval_effectiveness_for_revised_scope:
        scope_and_semantic_equivalence_proof_required: true
        new_or_expanded_scope_receives_automatic_authority: false
        incompatible_edit_executes_before_user_decision: false
        ineligible_execution_does_not_revoke_recorded_approval: true
      approval_provenance_mutation: FORBIDDEN
      new_approval_or_authorization_from_review: FORBIDDEN
      next_stage_auto_continuation:
        existing_authorization_and_binding_required: true
        registered_required_checks_all_pass_required: true
        no_new_user_review_required_if_unchanged_authorized_scope: true
        failed_unknown_or_stale_required_proof: BLOCK
      review_display_projection:
        human_readable_explanation_may_be_derived: true
        explanation_is_not_authoritative_plan_semantics: true
        machine_plan_source_remains_authoritative: true

    completion_transition:
      pending_status: IMPLEMENTED_VALIDATION_PENDING
      complete_status: COMPLETE
      rule: REGISTERED_MACHINE_CHECKS_MUST_PASS_BEFORE_AUTOMATIC_PROMOTION
      failed_validation_mutation: FORBIDDEN
      post_promotion_planning_validation_required: true

relations:
  supersedes: []
  amends: []
  extends: []
  depends_on:
    - policy: MPD-SPEC-0023
      scope: POLICY_PLAN_BINDING_CONTRACT
