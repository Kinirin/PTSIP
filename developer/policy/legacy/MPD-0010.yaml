schema_version: ptsip-developer-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY

policy:
  id: MPD-0010
  version: "2.0"
  title: Canonical Semantic Contract Extension and Inference Cost Policy
  status: RETIRED
  substatus: Removable

rules:
  ptsip_design_priority:
    precedence_order:
      - CODING_AGENT_INFERENCE_COST_MINIMIZATION
      - INDEPENDENT_EXTENSION_WITHOUT_UNRELATED_DEVELOPER_DISRUPTION
      - USER_MACHINE_READABLE_POLICY_AUTOMATION
    coding_agent_inference_cost_minimization:
      objective: MINIMIZE_REPEATED_REASONING_CONTEXT_LOOKUP_AND_CREDIT_COST_FOR_CODING_AGENTS
      rules:
        - PREFER_MACHINE_EXPLICIT_DIRECTLY_RESOLVABLE_CONTRACTS_WHEN_THEY_REDUCE_REPEATED_INFERENCE
        - ALLOW_BOUNDED_REFERENCE_DUPLICATION_WHEN_IT_REDUCES_AGENT_CONTEXT_OR_LOOKUP_COST
        - DO_NOT_REDUCE_MACHINE_CLARITY_MERELY_TO_MINIMIZE_FIELD_COUNT
    independent_extension_without_unrelated_developer_disruption:
      objective: ALLOW_INDEPENDENT_EXTENSION_WHEN_PTSIP_CORE_DOES_NOT_NATIVELY_SUPPORT_REQUIRED_SEMANTICS
      rules:
        - EXTENSION_MUST_USE_DISTINCT_IDENTITY_AND_MUST_NOT_IMPERSONATE_OFFICIAL_CORE_SEMANTICS
        - EXTENSION_UNSUPPORTED_BY_A_CONSUMER_MUST_BE_REPORTED_EXPLICITLY_WITHOUT_SILENT_CORE_MAPPING
        - UNSUPPORTED_EXTENSION_CAPABILITY_MUST_BE_SCOPED_TO_DEPENDENT_OPERATIONS_OR_VALIDATION
        - UNSUPPORTED_EXTENSION_CAPABILITY_MUST_NOT_BLOCK_UNRELATED_DEVELOPMENT
        - EXTENSION_OWNER_RETAINS_SEMANTIC_CONFORMANCE_MAINTENANCE_REVALIDATION_MIGRATION_AND_COMPATIBILITY_RESPONSIBILITY
    user_machine_readable_policy_automation:
      objective: ENABLE_USERS_TO_EXPRESS_PROJECT_OR_PERSONAL_POLICY_AS_MACHINE_READABLE_CONTRACTS_AND_BUILD_LOCAL_AUTOMATED_REASONING
      rules:
        - PREFER_DECLARATIVE_MACHINE_READABLE_CONTRACT_SURFACES_OVER_REQUIRED_CUSTOM_CORE_CODE
        - USER_DEFINED_POLICY_MAY_USE_REGISTERED_EXTENSION_IDENTITIES_AND_INTERFACES
        - USER_POLICY_AUTOMATION_MUST_NOT_SILENTLY_GAIN_PROJECT_OR_CORE_AUTHORITY
        - USER_POLICY_INTERPRETATION_MUST_REMAIN_EXACT_BOUNDED_AND_FAIL_CLOSED_WHEN_REQUIRED_SEMANTICS_CANNOT_BE_RESOLVED

  semantic_inference_cost:
    objective: REDUCE_REPEATED_SEMANTIC_INFERENCE_AND_AMBIGUITY_BEFORE_MINIMIZING_IMPLEMENTATION_TIME
    absolute_zero_inference_required: false
    machine_explicit_reference_duplication_allowed_when_it_reduces_semantic_inference_cost: true
    machine_explicit_duplication_does_not_create_authority_confidence_priority_or_ranking: true

  evidence_driven_contract_refinement:
    strategy: EVIDENCE_DRIVEN_CONTRACT_REFINEMENT
    refinement_signals:
      - REPEATED_SEMANTIC_INFERENCE
      - REPEATED_HUMAN_INTERVENTION
      - RECURRING_CUSTOM_WORKAROUNDS
      - REPEATED_EXTENSION_PATTERNS
      - ACCUMULATED_USER_FEEDBACK_OR_OPERATIONAL_DATA
    refinement_is_not_an_end_in_itself: true
    practical_stop_allowed_when_further_subdivision_has_no_worthwhile_efficiency_or_clarity_benefit: true
    stop_is_permanent_closure: false
    refinement_may_reopen_when_new_evidence_appears: true

  management_policy_identity_lifecycle_preflight:
    objective: ELIMINATE_REPEATED_AGENT_INFERENCE_AND_PREVENT_POLICY_ID_OR_STATUS_COLLISIONS
    automation_module: developer.automation.policy_identity_lifecycle
    approval_provenance_schema: developer/policy/schemas/policy-approval-provenance.schema.json
    approval_provenance_root: developer/policy/approvals/

    mandatory_order:
      - RECONCILE_POLICY_FILE_INDEX_AND_SUBJECT_IDENTITY_CORPUS
      - INSPECT_REQUESTED_OR_EXISTING_POLICY_ID
      - VERIFY_EXISTING_POLICY_CONTENT_AND_INDEX_STATUS_WHEN_PRESENT
      - VALIDATE_EXPLICIT_PROJECT_OWNER_APPROVAL_PROVENANCE
      - ALLOCATE_NEW_ID_OR_BIND_EXISTING_ID_EXACTLY
      - VERIFY_POLICY_FILE_ID_AND_EXPLICIT_TARGET_STATUS
      - MUTATE_INDEX_AND_SUBJECT_IDENTITY_REGISTRY
      - REVALIDATE_POLICY_CONTROL_PLANE

    inference_boundary:
      infer_next_id_from_visual_or_semantic_guessing: FORBIDDEN
      infer_policy_status_from_approval_wording: FORBIDDEN
      infer_activation_from_implementation_authorization: FORBIDDEN
      infer_approval_from_repository_state: FORBIDDEN
      existing_id_collision: FAIL_CLOSED
      corpus_mismatch: FAIL_CLOSED
      missing_or_invalid_approval_provenance: FAIL_CLOSED

    approval_semantics:
      temporary_approval_may_authorize_implementation: true
      temporary_approval_does_not_imply_active_or_draft_status: true
      target_policy_status_must_be_explicit_in_approval_provenance: true
      implementation_authorization_and_policy_lifecycle_status_are_independent_fields: true
      policy_content_review_scope_must_be_recorded: true

    policy_version_contract:
      format: MAJOR.MINOR
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      minor_digit_limit: UNBOUNDED
      initial_version: "0.0"
      lifecycle_major_contract:
        DRAFT: 0
        APPROVED: 1
        ACTIVE_MINIMUM: 2
        SUPERSEDED_PRESERVE_VERSION: true
        RETIRED_PRESERVE_VERSION: true
      status_version_cross_check:
        status_inference_from_version: FORBIDDEN
        version_inference_from_status: FORBIDDEN
        mismatch: FAIL_CLOSED
      change_classes:
        - NON_NORMATIVE
        - DRAFT_NORMATIVE
        - COMPATIBLE_NORMATIVE
        - INCOMPATIBLE_NORMATIVE
        - LIFECYCLE_TRANSITION
      deterministic_transitions:
        NEW_POLICY: "0.0"
        NON_NORMATIVE: KEEP
        DRAFT_NORMATIVE: INCREMENT_MINOR_KEEP_MAJOR_0
        DRAFT_TO_APPROVED: PRESERVE_MINOR_SET_MAJOR_1
        APPROVED_TO_ACTIVE: PRESERVE_MINOR_SET_MAJOR_2
        ACTIVE_COMPATIBLE_NORMATIVE: INCREMENT_MINOR_KEEP_MAJOR
        ACTIVE_INCOMPATIBLE_NORMATIVE: INCREMENT_MAJOR_RESET_MINOR_0
        ACTIVE_TO_SUPERSEDED: KEEP
        ACTIVE_TO_RETIRED: KEEP
      unsupported_transition: FAIL_CLOSED
      compatibility_obligation_across_major: NOT_REQUIRED
      exact_snapshot_identity: GIT_REVISION
      contract_adoption_baseline:
        DRAFT: "0.0"
        APPROVED: "1.0"
        ACTIVE: "2.0"
        SUPERSEDED: "2.0"
        RETIRED: "2.0"

    registry_semantics:
      subject_identity_registry_tracks_existing_policy_ids_regardless_of_active_or_draft_status: true
      authority_schema_and_role_registries_do_not_gain_draft_operational_authority: true
      registration_requires_exact_policy_file_index_status_match: true


  provisional_resolution_framework:
    decision: APPROVED
    authority_role: OPERATIONAL_RESOLUTION_NOT_POLICY_AUTHORITY

    default_behavior:
      provisional_resolution_enabled: false
      explicit_user_authorization_required: true
      user_silence_is_authorization: false
      implementation_urgency_is_authorization: false
      agent_convenience_is_authorization: false

    unauthorized_case:
      agent_may_create_provisional_resolution: false
      unresolved_normative_decision_result: USER_DECISION_REQUIRED

    authorized_case:
      agent_may_create_provisional_resolution: true
      implementation_may_proceed_when_not_blocked_by_official_policy: true
      creates_official_policy_authority: false
      automatic_promotion_to_official_authority: FORBIDDEN
      test_success_promotes_to_official_authority: false
      implementation_success_promotes_to_official_authority: false
      future_user_review_required: true

    authorization_scope:
      default_inheritance: FORBIDDEN
      must_be_bounded_to:
        - TASK
        - RESPONSIBILITY_SCOPE
        - EXPLICITLY_DECLARED_OPERATION_SCOPE
      authorization_outside_declared_scope: FORBIDDEN

    required_record:
      - DECISION_SOURCE
      - AUTHORIZATION_SOURCE
      - REASON
      - RESPONSIBILITY_SCOPE
      - AFFECTED_POLICY_REFS
      - AFFECTED_PLAN_REFS
      - UNRESOLVED_QUESTIONS

    conflict_boundary:
      official_policy_may_be_overridden_by_provisional_resolution: false
      official_policy_conflict_result: CHANGE_IMPLEMENTATION_OR_BLOCK
      provisional_resolution_must_remain_distinguishable_from_user_approved_policy: true

    lifecycle_boundary:
      physical_policy_status_mutation_from_provisional_resolution: FORBIDDEN
      provisional_resolution_is_not_management_policy_status: true
      provisional_resolution_is_not_plan_approval_status: true
      explicit_user_approval_required_for_official_promotion: true


relations:
  supersedes: []
  amends: []
  extends: []
  depends_on: []
