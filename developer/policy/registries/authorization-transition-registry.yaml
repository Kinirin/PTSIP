schema_version: ptsip-developer-authorization-transition-registry/v1
policy_class: PTSIP_DEVELOPER_POLICY
registry_role: PROJECT_OWNER_PREAUTHORIZED_IMPLEMENTATION_TRANSITION_CATALOG
project_authority: false
authorization_provenance:
  authority: PROJECT_OWNER
  type: GIT_COMMIT
  repository: Kinirin/PTSIP
  revision: 7f5b92945b4880298b16164f92d586ebd9873254
states:
  - NOT_AUTHORIZED
  - HOLD_NOT_AUTHORIZED
  - READY_FOR_AUTO_AUTHORIZATION
  - AUTHORIZED
  - REVOKED_OR_INVALIDATED
rules:
  P03G_PROJECT_AUTHORITY_RUNTIME:
    target_scopes:
      - PROJECT_AUTHORITY_ELIGIBILITY_RUNTIME
      - PROJECT_AUTHORITY_PROJECTION_RUNTIME
      - PROJECT_AUTHORITY_RECORD_MATERIALIZATION
      - AUTHORIZATION_READINESS_TRANSITION_ENGINE
    required_predicates:
      AUTHORITY_SCHEMA_REGISTRY_VALID: true
      AUTHORITY_ROLE_REGISTRY_VALID: true
      AUTHORITY_SUBJECT_REGISTRY_VALID: true
      CURRENT_SUPPORT_POLICY_CORPUS_VALID: true
      ROLE_EFFECT_VOCABULARY_VALID: true
      SUPPORT_POLICY_SUBJECT_CONTRACT_VALID: true
      PROJECT_AUTHORITY_RUNTIME_OWNER_PREAUTHORIZED: true
    when_all_true: AUTHORIZED
    otherwise: HOLD_NOT_AUTHORIZED
held_scopes:
  SOLUTION_SPACE_AUTHORITY_CONSUMPTION_RUNTIME:
    state: HOLD_NOT_AUTHORIZED
    blockers:
      - NO_OWNER_PREAUTHORIZED_TRANSITION_RULE_FOR_THIS_SCOPE
      - PARENT_WU_02_GENERAL_IMPLEMENTATION_REMAINS_PARTIAL
  REMEDIATION_RUNTIME_IMPLEMENTATION:
    state: HOLD_NOT_AUTHORIZED
    blockers:
      - OUTSIDE_CURRENT_OWNER_APPROVAL_SCOPE
      - MUTATION_AND_REMEDIATION_EXECUTION_BOUNDARIES_REMAIN_CLOSED
  REPOSITORY_MUTATION:
    state: HOLD_NOT_AUTHORIZED
    blockers:
      - MUTATION_AUTHORIZATION_NOT_GRANTED
  MUTATION_AUTHORIZATION:
    state: HOLD_NOT_AUTHORIZED
    blockers:
      - MUTATION_AUTHORIZATION_NOT_GRANTED
