Policy_Identity:
  id: "MPD-ARCH-0013"
  policy_kind: "PTSIP_DEVELOPER_POLICY"
  root_family: "ARCH"
  title: "ARCH 신규 Policy 검증 책임 영역 제안 경계"
Policy_Status:
  Policy_Status_Schema_ver: "1"
  status: "APPROVED.provisional"
  contract: "urn:ptsip:contract:policy:arch:responsibility:new-domain-admission"
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:arch:responsibility-new-domain"
    Rule_ver: "1"
  Definition:
    - id: "R-ID-041A6F1A24458B0331470B8BCA0297F9"
      rule: "NEW-DOMAIN-APPROVAL"
    - id: "R-ID-94A807F68F314338AAB708ED95BE6C13"
      rule: "DOMAIN-EVIDENCE"
  title: "ARCH 신규 Policy 검증 책임 영역 제안 경계"
  Boundary:
    scope: ".ptsip/engine/developer/policy/ 내 신규 검증 책임 영역 후보의 독립성·승인 경계"
    subjects:
      - "기존 책임 영역에서 수행 책임을 소유하지 않거나 기존 영역 배정 시 의미 왜곡 위험이 있을 때만 신규 후보를 제안"
      - "제안에는 후보 책임 설명, 의미 왜곡의 근거, 가장 가까운 기존 영역, 경계 차이, 중복·비소유 이유를 각각 포함"
      - "신규 책임 영역은 기존 영역과 명확히 구분되는 단일 책임을 가져야 하며 중복되어서는 안 됨"
      - "후보 등록은 비권위 분석으로만 허용하며 새 영역 채택·소유권 확정은 프로젝트 소유자의 별도 명시적 결정이 필요"
      - "MPD-ARCH-0009의 신규 영역 승인 경계와 POLICY-SPLIT 원칙을 그대로 유지"
    exclusions:
      - "근접 영역의 명칭·편의만으로 중복 책임을 신규 생성"
      - "후보 분석을 신규 소유권·승인·실행 권한으로 자동 승격하거나 검증기 파일을 자동 생성"
  Evaluation:
    criteria:
      evidence:
        - "신규 후보마다 기존 영역 부재 또는 의미 왜곡 위험과 비중복 근거가 제시되었는지 확인"
        - "개별 신규 책임 후보 및 실제 채택·등록은 아직 미확정"
    result:
      status: "incomplete_fulfillment"
      task_name: "신규 Policy 검증 책임 영역 제안 기준 검토"
      task_id: "MPD-ARCH-0013"
