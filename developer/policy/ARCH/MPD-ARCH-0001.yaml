schema_version: ptsip-developer-root-family-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: ARCH
policy:
  id: MPD-ARCH-0001
  title: ARCH authority (ACTIVE source responsibilities)
  status: ACTIVE
  version: '3.2'
authority_subject:
  id: DEV_TOOL_RESPONSIBILITY_STRUCTURE
  statement: Reference Tool과 개발 체계의 lifecycle 책임 소유, 구성 요소 경계 및 명시적인 typed 관계를 소유한다.
exclusive_kernel:
- DEV_LIFECYCLE_RESPONSIBILITY_BOUNDARIES
- DEV_EXPLICIT_COMPONENT_RELATIONSHIPS
rules:
  fsd_family_layout_and_isolation:
    decision: APPROVED_CORE_POLICY
    approval_ref: developer/policy/approvals/MPA-20261012-FSD-FAMILY-LAYOUT-INDEPENDENCE.yaml
    policy_scope: PTSIP_DEVELOPER_POLICY
    root_family_policy_schema_ownership:
      owner: MATCHING_RESPONSIBILITY_FAMILY
      scope: ENTIRE_POLICY_RECORD_FIELD_SCHEMA
      each_family_independent_schema: true
      shared_cross_family_normative_schema: FORBIDDEN
      field_schema_authority_inferred_from_filename_only: FORBIDDEN
    canonical_fsd_layout:
      root: developer/policy/schemas/FSD/
      index_schema: developer/policy/schemas/FSD/index.schema.json
      family_schema_paths:
      NORM: developer/policy/schemas/FSD/NORM.schema.json
      GOV: developer/policy/schemas/FSD/GOV.schema.json
      INTENT: developer/policy/schemas/FSD/INTENT.schema.json
      ARCH: developer/policy/schemas/FSD/ARCH.schema.json
      INFO: developer/policy/schemas/FSD/INFO.schema.json
      CNTR: developer/policy/schemas/FSD/CNTR.schema.json
      RISK: developer/policy/schemas/FSD/RISK.schema.json
      SUPPLY: developer/policy/schemas/FSD/SUPPLY.schema.json
      REAL: developer/policy/schemas/FSD/REAL.schema.json
      ASSURE: developer/policy/schemas/FSD/ASSURE.schema.json
      CTRL: developer/policy/schemas/FSD/CTRL.schema.json
      CHANGE: developer/policy/schemas/FSD/CHANGE.schema.json
      OPS: developer/policy/schemas/FSD/OPS.schema.json
      RECORD: developer/policy/schemas/FSD/RECORD.schema.json
      exact_family_membership: REQUIRED
      schema_binding_must_be_machine_discoverable: true
    policy_class_isolation:
      isolated_from: src/policy
      schema_file_sharing: FORBIDDEN
      normative_schema_definition_sharing: FORBIDDEN
      policy_class_owner_merging: FORBIDDEN
      support_feature_authority_unchanged: true
    deferred_subordinate_decisions:
      schema_document_serialization: RESOLVED_KEEP_PRIOR
      policy_status_lifecycle_reform: NOT_APPROVED_AS_CORE_POLICY
    implementation_authorization: NOT_GRANTED
    existing_validator_cutover_authorized: false
  fsd_file_serialization_contract:
    approval_ref: developer/policy/approvals/MPA-20261012-FSD-SERIALIZATION-KEEP-PRIOR.yaml
    resolution: KEEP_PRIOR
    scope_root: developer/policy/
    bindings:
      policy_yaml:
        extension: '.yaml'
        encoding_format: YAML
      fsd_schema_json:
        extension: '.schema.json'
        encoding_format: JSON
        schema_language: JSON_SCHEMA
        root: developer/policy/schemas/FSD/
    schema_json_yaml_serialization: FORBIDDEN
    existing_canonical_schema_paths: PRESERVE
    independent_src_policy_boundary: PRESERVE
    content_format_must_match_declared_extension: true
    parser_rebinding_and_file_materialization: DEFER_TO_SEPARATE_PLAN
  fsd_root_family_full_schema_authority:
    resolution: KEEP_LATEST
    change_class: INCOMPATIBLE_NORMATIVE
    approval_ref: developer/policy/approvals/MPA-20261012-FSD-FAMILY-SCHEMA-KEEP-LATEST.yaml
    applies_to:
      policy_class: PTSIP_DEVELOPER_POLICY
      artifact_kind: ROOT_FAMILY_POLICY_RECORD
      owner_identity: [policy_class, responsibility_family]
    independent_owner: MATCHING_RESPONSIBILITY_FAMILY
    ownership_scope:
    - COMPLETE_RECORD_FIELD_STRUCTURE
    - REQUIRED_AND_OPTIONAL_FIELDS
    - FIELD_TYPES_AND_VALUE_CONSTRAINTS
    - FAMILY_SPECIFIC_RULE_PAYLOAD
    - COMMON_NAMED_FIELDS_WITHIN_FAMILY_RECORD
    each_family_owns_entire_schema: true
    cross_family_schema_normative_inheritance: FORBIDDEN
    info_global_field_schema_authority_for_other_families: REPLACED
    shared_primitives_transfer_field_authority: false
    target_schema_directory: developer/policy/schemas/FSD/
    target_family_schema_pattern: '{FAMILY}.schema.json'
    target_catalog_schema: developer/policy/schemas/FSD/index.schema.json
    catalog_contract_owner: PROJECT_OWNER_SHARED_DEVELOPER_CATALOG
    catalog_not_a_root_family_policy_record: true
    excluded_scopes:
    - PTSIP_SUPPORT_FEATURE
    - POLICY_ANALYSIS_LOCAL_SCHEMA_OWNERSHIP
    - NON_FAMILY_DEVELOPER_CATALOG_AUTHORITY
    implementation_state:
      family_schema_materialization: NOT_IMPLEMENTED
      validator_registry_rebinding: NOT_IMPLEMENTED
      current_shared_schema_is_not_new_family_authority: true
      implementation_authorized_by_this_decision: false
      separate_plan_approval_required: true
    prior_conflict_resolution:
      KEEP_PRIOR: REJECTED
      KEEP_LATEST: SELECTED
      RECONCILE: REJECTED
      resolved_against: MPD-INFO-0001#rules.family_definition.kernel_definitions
      preserve_unrelated_authority: true
  family_definition:
    kernel_definitions:
    - id: DEV_LIFECYCLE_RESPONSIBILITY_BOUNDARIES
      statement: Product, Development Tooling, Delivery, Operations 및 Neutral Contract
        책임을 governing lifecycle obligation에 따라 분리한다.
      non_substitutability: SUPPLY의 생산자, 파일 형식 또는 실행 환경이 Artifact의 lifecycle 소유자를
        결정하지 않는다.
    - id: DEV_EXPLICIT_COMPONENT_RELATIONSHIPS
      statement: 독립적으로 통제할 수 있는 책임 단위의 분할, 경계와 프로젝트가 선언한 typed directed 관계를 정한다.
      non_substitutability: INFO의 schema나 관측 import 목록만으로 프로젝트의 책임 분할과 관계 의도를 확정할
        수 없다.
    source_scope:
    - MPD-0001
    - MPD-0010
    - MPD-0013
    - MPD-PLAN-0001
    - MPD-SPEC-0001
    - MPD-SPEC-0005
    - MPD-SPEC-0023
    - MPD-WORK-0003
  unit_mpd_0001_bd42d96859af:
    compatibility_state: TEMPORARY_UNTIL_DEVELOPER_AUTOMATION_EXPLICIT_PROFILE_SELECTION_IS_VERIFIED
    support_profile_subsystem:
      decision: APPROVED
    migration_authority_ref: MPD-MIGR-0001
  unit_mpd_0001_9718874b8c69:
    root: developer/automation/planning/
    ownership: PLANNING_AUTOMATION
    owns:
    - PLANNING_RESOLUTION
    - PLANNING_VALIDATION
    - PLAN_EXTENSION_LIFECYCLE
    - PLANNING_RECONCILIATION
    - PLANNING_COMPLETION_TRANSITION
    does_not_own:
    - POLICY_LIFECYCLE
    - POLICY_PLAN_RELATIONSHIP
    - BINDING_IDENTITY
    - BINDING_LIFECYCLE
    authoritative_mutation_scope:
    - developer/planning/
    external_authority_direct_mutation: FORBIDDEN
  unit_mpd_0010_cb51d9f40c3d:
    canonical_root: .agent/
    purpose: REPOSITORY_LOCAL_AGENT_INSTRUCTION_MANAGEMENT
    developer_tool_implementation_root: developer/automation/
    developer_tool_root_is_management_surface: false
    product_distribution: FORBIDDEN
  unit_mpd_0013_98ec2a596e7d:
    target_namespace: developer/planning/
    canonical_root_transition_owned_by_this_policy: false
    current_repository_migration_authorized_by_this_policy: false
    note: MPD-PLAN-0001_OWNS_PLANNING_BOUNDARY
  approved_work_unit_registry_admission:
    resolution: KEEP_LATEST
    approval_source: USER_EXPLICIT
    approval_ref: developer/policy/approvals/MPA-20261011-PLAN-WORK-UNIT-KEEP-LATEST.yaml
    approval_date: '2026-10-11'
    subject: DEVELOPER_RELEASE_PLANNING_WORK_UNITS_REGISTRY
    registration_precondition: USER_REVIEWED_AND_APPROVED_PLAN_WORK_UNIT
    unapproved_plan: REVIEW_ONLY_NOT_WORK_UNITS_REGISTRY_MEMBER
    provisional_work_unit_registry_placeholder: FORBIDDEN
    registered_work_unit_lifecycle_excludes:
    - NOT_CREATED
    - DRAFT
    registered_work_unit_approval_excludes:
    - PENDING
    - REJECTED
    registered_work_unit_approval_requires: USER_EXPLICIT_APPROVED
    plan_review_alone_is_approval: false
    plan_review_or_plan_document_creation_grants_implementation_authority: false
    absent_registered_work_units: VALID_WHEN_NO_APPROVED_WORK_UNIT
    legacy_policy_plan_relationship_NOT_CREATED_semantics: PRESERVED_IN_BINDING_PLANE
    other_plan_lifecycle_and_approval_history: PRESERVE
    no_branch_or_runtime_activation_authorized: true
  unit_mpd_plan_0001_50410dc74c9f:
    root: developer/planning/
    control_plane_entry: developer/planning/index.yaml
    ownership: PLANNING_AUTHORITY
  unit_mpd_plan_0001_7f56c7fed0e5:
    root: developer/planning/schemas/
    ownership: PLANNING_AUTHORITY
    canonical_schema_files:
    - planning-root-index.schema.json
    - planning-index.schema.json
    - work-unit.schema.json
    - plan-extension.schema.json
  unit_mpd_plan_0001_dfacd421d3a0:
    policy_plan_binding:
      authority_ref: developer/bindings/policy-plan-bindings.yaml
      automation_ref: developer/automation/policy_plan_binding/
      ownership: EXTERNAL_TO_PLANNING
      authority_owner: POLICY_PLAN_BINDING
      planning_may_directly_mutate_binding_authority: false
      mutation_interface_required: true
  unit_mpd_plan_0001_edc33d7514e8:
    planning_authority:
      owns:
      - PLAN_CONTENT
      - PLAN_STRUCTURE
      - PLAN_LIFECYCLE
      - PLAN_APPROVAL_STATE
      - PLAN_IMPLEMENTATION_PROGRESS
      - PLAN_COMPLETION_STATE
      - PLAN_VERIFICATION_EVIDENCE
    policy_plan_binding:
      external_to_planning: true
      owns:
      - POLICY_PLAN_RELATIONSHIP
      - BINDING_IDENTITY
      - PLAN_EXISTENCE_RELATION_STATE
      - PLAN_ID_AND_PLAN_REF_BINDING
  unit_mpd_plan_0001_3297aa85e519:
    suffix: -explanation.yaml
    machine_authority: false
    allowed_for_ambiguous_or_unsupported_definition: true
  unit_mpd_spec_0001_bd42d96859af:
    developer_repository_profile: developer/profiles/ptsip-repository.yaml
    compatibility_root_profile: ptsip.yaml
    support_profile_subsystem:
      target_root: src/ptsip/profiles/
      schema_root: src/ptsip/profiles/schema/
      builtin_root: src/ptsip/profiles/builtin/
      ownership: PTSIP_SUPPORT_FEATURE
      distribution: REQUIRED
    current_profile_schema_location: src/ptsip/specdata/
    current_profile_schema_files:
    - ptsip-profile.schema.json
    - ptsip-profile-pp-1.01.schema.json
    builtin_profile_instance_policy: CREATE_DIRECTORY_OR_INSTANCE_ONLY_WHEN_A_RUNTIME_SHIPPED_BUILTIN_PROFILE_EXISTS
  unit_mpd_spec_0001_021ba43d3136:
    developer_policy_must_ship: false
    support_feature_policy_must_ship: true
    developer_policy_must_not_define_consumer_project_requirement: true
    support_feature_must_not_depend_on_developer_policy_at_runtime: true
  unit_mpd_spec_0005_8b9a13c6427c:
    components:
    - id: ptsip-evidence
      classification: PRODUCT
      role: IMPLEMENTATION
      selector: src/ptsip/evidence/**
    - id: ptsip-source-compat
      classification: PRODUCT
      role: IMPLEMENTATION
      selector: src/ptsip/source_compat/**
    - id: ptsip-migration
      classification: PRODUCT
      role: IMPLEMENTATION
      selector: src/ptsip/migration/**
    common_properties:
      shipped: true
      runtime_required: false
      executable: false
      release_owner: tool
      compatibility_owner: tool
    ptsip_core_selector_broadened_to_recursive_src_ptsip: false
    relationships:
    - ptsip-evidence:IMPORTS:ptsip-core
    - ptsip-source-compat:IMPORTS:ptsip-core
    - ptsip-source-compat:READS:ptsip-embedded-contracts
    - ptsip-migration:IMPORTS:ptsip-core
    - ptsip-migration:IMPORTS:ptsip-evidence
    - ptsip-migration:IMPORTS:ptsip-source-compat
  unit_mpd_spec_0023_7795cd9b8dbc:
    policy_planning_implementation_are_separate_authority_layers: true
    policy_authority:
      owns:
      - POLICY_SEMANTICS
      - POLICY_LIFECYCLE
      - POLICY_APPROVAL
      does_not_own:
      - PLAN_CONTENT
      - PLAN_APPROVAL
      - PLAN_IMPLEMENTATION_PROGRESS
      - PLAN_COMPLETION_STATE
      - IMPLEMENTATION_ARTIFACT_STATE
    planning_authority:
      owns:
      - PLAN_CONTENT
      - PLAN_DESIGN
      - PLAN_OPTIONS
      - PLAN_APPROVAL
      - PLAN_IMPLEMENTATION_PROGRESS
      - PLAN_IMPLEMENTATION_COMPLETION
      - PLAN_COMPLETION_AND_VERIFICATION_EVIDENCE
      superior_policy_reference_required: true
    implementation_artifacts:
      role: IMPLEMENTATION_OUTPUT
      own_authoritative_plan_completion_state: false
    approval_boundary:
      policy_approval_implies_plan_approval: false
      plan_requires_separate_approval: true
      multiple_valid_planning_options_may_exist_for_same_policy: true
    work_unit_priority_boundary:
      priority_owner: PLANNING_WORK_UNIT
      execution_order_owner: PLANNING_WORK_UNIT
      work_unit_dependencies_owner: PLANNING_WORK_UNIT
      normative_policy_may_assign_priority: false
      normative_policy_may_assign_work_unit_execution_order: false
      normative_policy_may_assign_work_unit_dependencies: false
      policy_prerequisites_and_conformance_guards: PRESERVE
      unresolved_work_unit_priority: PLAN_UNASSIGNED
      approved_policy_correction_ref: developer/policy/approvals/MPA-20261011-WU-PRIORITY-PLAN-BOUNDARY.yaml
    source_boundary:
      governance_source_registry_ref: developer/policy/registries/governance-source-registry.yaml
      approval_source_role: ORIGIN_OF_PLAN_APPROVAL_AUTHORITY
      authorization_source_role: ORIGIN_OF_IMPLEMENTATION_EXECUTION_AUTHORIZATION
      official_plan_approval_source: USER_EXPLICIT
      official_implementation_authorization_source: USER_EXPLICIT
      automation_derived_may_create_plan_approval: false
      automation_derived_may_create_implementation_authorization: false
      automation_derived_may_propagate_or_transition_existing_authority: true
      approval_source_and_authorization_source_are_independent: true
      lifecycle_or_completion_transition_does_not_create_new_authority: true
  unit_mpd_work_0003_6c611ebb841f: RESPONSIBILITY_UNIT
  unit_mpd_work_0003_409ccab39a04: false
  unit_mpd_work_0003_742060fc39ee:
  - SPEC
  - PLAN
  - WORK
  - VERI
  - MIGR
  - RELS
  unit_mpd_work_0003_ecbccb9b85f5:
  - OWN
  - REFERENCE
  - CONSUME
  - VERIFY
  - TRANSFORM
  - EXECUTE
  unit_mpd_work_0003_ba7539c50202:
    every_normative_responsibility_must_be_classified_independently: true
    multiple_owned_families_require_split: true
    referenced_family_does_not_determine_owner_family: true
    unresolved_responsibility_boundary: FAIL_CLOSED
  unit_mpd_work_0003_9dea768abc1a:
    same_family_does_not_imply_same_policy_identity: true
    merge_requires_same_cohesion_key: true
    cohesion_rationale_required: true
  common_and_developer_engine_responsibility_boundary:
    conflict_resolution: RECONCILE
    approval_ref: developer/policy/approvals/MPA-20261011-DEVELOPER-ENGINE-RECONCILE.yaml
    common_engine:
      authority_plane: PTSIP_SUPPORT_FEATURE
      normative_semantics: LANGUAGE_NEUTRAL_MACHINE_CONTRACT
      product_distribution: SITE_PACKAGES
      current_engine_plan: PRESERVE_INDEPENDENTLY
      developer_go_tool_defines_product_standard: false
      product_runtime_depends_on_developer_tool: false
    developer_extension:
      lifecycle: DEVELOPMENT_TOOLING
      implementation_language: GO
      current_implementation_root: developer/automation/
      target_implementation_root: .ptsip/engine/developer/
      parent_repository_local_engine_root: .ptsip/engine/
      parent_root_status: CONSUMER_ENGINE_STATE_NAMESPACE
      eligibility: PTSIP_DEVELOPER_WORKSPACE_WITH_EXPLICIT_REGISTERED_BINDING
      source_role: DEVELOPER_TOOL_NOT_INSTALLED_PRODUCT_ENGINE
      consumer_project_propagation: FORBIDDEN
      source_copy_of_installed_product_engine: FORBIDDEN
      target_root_activation: AFTER_COMMON_ENGINE_CONFORMANCE_AND_APPROVED_DEVELOPER_MIGRATION
      common_engine_role: CONTRACT_CONSUMER
      product_distribution: FORBIDDEN
    existing_dot_ptsip_engine_state: PRESERVE_UNTIL_APPROVED_MIGRATION
    engine_root_namespace_reconciliation:
      resolution: RECONCILE
      approved_scope_ref: developer/policy/approvals/MPA-20261011-ENGINE-ROOT-RECONCILE.yaml
      consumer_engine_state_policy_ref: SFP-ARCH-0001#authority_semantics.engine_plane_boundary
      consumer_project_state_and_runtime_semantics: PRESERVE
      product_engine_executable_owner: INSTALLED_PTSIP_PACKAGE
      developer_workspace_exception: EXPLICIT_BINDING_ONLY
      target_developer_subnamespace: .ptsip/engine/developer/
      concrete_go_package_move: DEFER_TO_SEPARATE_PLAN
      existing_common_engine_plan: PRESERVE
      implementation_authorized: false
relations:
  supersedes: []
  amends: []
  extends: []
  depends_on: []
transition:
  target_status: ACTIVE
  state: COMPLETE
  requirements:
  - id: TR-001
    type: ROOT_FAMILY_SOURCE_STATE_PRESERVATION
    state: SATISFIED
    refs:
    - developer/policy/approvals/MPA-20261006-ROOT-ARCH-0001-ACTIVE.yaml
    next_action:
      action: VERIFY_SOURCE_PROJECTION
      execution: SERIAL_REQUIRED
      completion_check: EXACT_SOURCE_RECONSTRUCTION_AND_STATE_MATCH
  - id: TR-002
    type: PROJECT_OWNER_FSD_FAMILY_SCHEMA_AUTHORITY_APPROVAL
    state: SATISFIED
    refs:
    - developer/policy/approvals/MPA-20261012-FSD-FAMILY-SCHEMA-KEEP-LATEST.yaml
    next_action:
      action: DERIVE_FSD_IMPLEMENTATION_PLAN
      execution: OWNER_DECISION_REQUIRED
      completion_check: NO_SCHEMA_OR_RESOLVER_CUTOVER_WITHOUT_SEPARATE_APPROVED_PLAN
  - id: TR-003
    type: PROJECT_OWNER_FSD_CANONICAL_LAYOUT_AND_SEPARATION_APPROVAL
    state: SATISFIED
    refs:
    - developer/policy/approvals/MPA-20261012-FSD-FAMILY-LAYOUT-INDEPENDENCE.yaml
    next_action:
      action: DERIVE_POLICY_CONFORMANT_FSD_PLAN_AFTER_SERIALIZATION_DECISION
      execution: OWNER_DECISION_REQUIRED
      completion_check: FSD_FAMILY_SCHEMA_LAYOUT_OWNERSHIP_AND_SEPARATION_PRESERVED
  - id: TR-004
    type: PROJECT_OWNER_FSD_FILE_SERIALIZATION_KEEP_PRIOR_APPROVAL
    state: SATISFIED
    refs:
    - developer/policy/approvals/MPA-20261012-FSD-SERIALIZATION-KEEP-PRIOR.yaml
    next_action:
      action: DERIVE_FSD_SCHEMA_AND_PARSER_CONFORMANT_PLAN
      execution: OWNER_DECISION_REQUIRED
      completion_check: YAML_FOR_YAML_FILES_AND_JSON_FOR_SCHEMA_JSON_FILES
