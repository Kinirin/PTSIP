  root_family: "ARCH"
  title: "ARCH 개발 체계의 생명주기별 책임 경계와 명시적 구성 요소 관계"
Policy_Status:
  Policy_Status_Schema_ver: "1"
  status: "APPROVED.Application_Problems"
  contract: "urn:ptsip:contract:policy:arch:lifecycle-responsibility:boundaries"
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:arch:lifecycle-responsibility"
    Rule_ver: "1"
  Definition:
    - id: "R-ID-BF212913700A411DB188A1E926F5B3DB"
      rule: "LIFECYCLE-OWNERSHIP"
    - id: "R-ID-5189116EFBED456BAFA9586901F8C045"
      rule: "COMPONENT-BOUNDARIES"
    - id: "R-ID-22F632FA935247A4B87CD8E50FAB7939"
      rule: "TYPED-RELATIONS"
    - id: "R-ID-605FD39BDF2C4F19B59936055877DDC7"
      rule: "NO-IMPLICIT-OWNER"
  title: "ARCH 개발 체계의 생명주기별 책임 경계와 명시적 구성 요소 관계"
  Boundary:
    scope: "개발 체계의 생명주기별 책임 소유와 독립 구성 요소 간 명시적 방향·유형 관계"
    subjects:
      - "Product, Development Tooling, Delivery, Operations, Neutral Contract의 생명주기별 책임 분리"
      - "독립적으로 통제할 수 있는 구성 요소의 책임 경계"
      - "프로젝트가 명시적으로 선언하는 typed directed component relationship"
    exclusions:
      - "계획 생성과 계획 승인, 정책 스키마 소유권, 배포 기능 분리는 해당 독립 ARCH 정책에서 관리"
      - "SUPPLY의 생산자·파일 형식·실행 환경만으로 생명주기 소유자를 추정하지 않음"
      - "INFO 스키마·import 관측만으로 소유권이나 관계 의도를 확정하지 않음"
  Evaluation:
    criteria:
      evidence:
        - "구성 요소마다 생명주기 책임 소유가 명시되어 있음"
        - "방향과 유형이 지정된 독립 구성 요소 관계를 확인할 수 있음"
        - "파일 배치 및 import 정보만으로 소유권이 승격되지 않음"