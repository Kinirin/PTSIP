Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:arch:planning-creation"
    Rule_ver: "1"
  Definition:
    - id: "R-ID-B57C4B5C975B444AA9B2C42B165FD287"
      rule: "USER-PLAN-CREATION"
    - id: "R-ID-BB7BBACE51DD4D379B03E9D749FD1693"
      rule: "DETERMINISTIC-PATH"
    - id: "R-ID-941D410F67F44DE89F0194258E22B9CF"
      rule: "BLOCK-AMBIGUOUS-PATH"
    - id: "R-ID-93952D9E7DA14B46887934C305F7261A"
      rule: "NO-BRANCH-INFERENCE"
  title: "ARCH 계획 생성 권한·저장 루트·경로 결정 원칙"
  Boundary:
    scope: "현재 PTSIP 개발 저장소의 계획 아티팩트 생성 권한과 저장 위치 및 논리적 계획 식별 경계"
    subjects:
      - "사용자 승인 개발 계획 루트와 하위 경로의 기계적 도출"
      - "명시적인 계획 생성 요청과 정책 승인·계획 생성 권한의 분리"
      - "계획의 논리적 식별자와 Git 브랜치·물리적 경로의 독립성"
    exclusions:
      - "소비자 프로젝트에 대한 계획 루트 강제"
      - "승인되지 않은 계획 경로 선택 알고리즘·생성기 파이프라인을 정책으로 확정"
      - "계획 식별자만으로 브랜치를 생성하거나 선택하는 행위"
  Evaluation:
    criteria:
      evidence:
        - "명시적인 생성 요청 및 승인된 루트·라우팅 계약 확인"
        - "단일 정규 경로가 도출되지 않으면 생성 차단"
        - "계획 ID 변경 없이 실행 브랜치가 달라질 수 있음"
