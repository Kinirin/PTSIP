  Definition:
    - id: "R-ID-AFB9CA12F7BE4D9C946960BCE6B79B4F"
      rule: "POLICY-PLAN-LAYERS"
    - id: "R-ID-5C5ECE193926457CBEE2887CEE7A9330"
      rule: "PLAN-APPROVAL-GATE"
    - id: "R-ID-BD3E9B19FD1441AFAFECE2490BB6AB46"
      rule: "NO-IMPL-PLAN-AUTH"
  title: "ARCH 정책·계획·구현 권한 계층의 분리"
  Boundary:
    scope: "개발 정책·계획·구현 산출물의 상하 관계와 상호 독립적인 권한 경계"
    subjects:
      - "POLICY > PLAN > IMPLEMENTATION 계층과 책임 소유"
      - "정책 승인과 계획 승인 및 구현 허가의 독립성"
      - "구현 산출물의 계획 완료 권한 비승계"
    exclusions:
      - "작업 단위 우선순위·실행 순서·의존관계 및 과거 Work Unit 등록 정책"
      - "개별 계획 필드·구현 단계의 상세 형식 및 실행 허가 출처의 생성"
  Evaluation:
    criteria:
      evidence:
        - "정책·계획·구현의 권한 소유가 분리되어 있음"
        - "정책 승인만으로 계획 승인이 발생하지 않음"
        - "구현 산출물이 계획 완료 여부를 독립적으로 선언하지 않음"
