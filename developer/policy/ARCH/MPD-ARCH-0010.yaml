Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:arch:developer-verification"
    Rule_ver: "1"
  Definition:
    - id: "R-ID-A8C12D874B4C4DDF91C9DF2F63729005"
      rule: "POLICY-VERIFY-SCOPE"
    - id: "R-ID-F12085AE7275C5CBBB93DCEC057DFAC1"
      rule: "SINGLE-DOMAIN-OWNER"
    - id: "R-ID-26D7F9291CDA4B099128DE728157A249"
      rule: "NO-MIXED-VERIFIER"
    - id: "R-ID-724F13D635A94D8C9C3D156F843F052C"
      rule: "MANUAL-VERIFIER-FIX"
  title: "ARCH Policy 검증기 단일 책임 경계 및 수동 분리"
  Boundary:
    scope: ".ptsip/engine/developer/policy/ 범위의 Policy 검증 구현 단일 책임 구조"
    subjects:
      - "Policy 검증 구현은 해당 영역의 기존 유효 계약을 소비하며 구현 위치를 이유로 새 규범적 권위를 생성하지 않음"
      - "새 검증기를 생성할 때는 검증 책임별 디렉터리로 구분하고 각 구현 단위는 정확히 하나의 검증 책임을 수행"
      - "서로 다른 책임을 하나의 검증 파일이나 검증기에 혼합하는 것을 권장하지 않음"
      - "이미 혼합 책임으로 작성된 검증기는 미해결 검토 대상으로 이 문서에 명시하고 실제 분리는 사용자 수동 변경으로만 수행"
      - "미확정 책임 경계를 임의 배정하거나 분석 결과로 새 검증기 또는 책임 디렉터리를 자동 생성하지 않음"
    exclusions:
      - "Policy 검증기 외의 검증 체계에 관한 소유권·적용 범위·책임 정의"
      - "혼합 검증기 파일의 자동 분할·이동·재작성 및 임의 책임 영역 확정"
      - "검증 대상 또는 패키지 경로만으로 정책 의미·승인·실행 권한을 생성하는 행위"
      - "폐기된 developer/automation/ 경로의 재활성화"
  Evaluation:
    criteria:
      evidence:
        - "미해결 검토 후보: verification/Finding.go — 스키마 파일 탐색·구조 검사·참조 수집·RBAC scaffold·상태·routing probe가 함께 존재; 의미적 혼합 여부는 미판정"
        - "추가 검토 후보: verification/Document.go — Identity·Policy_Status·Plan_Status·Rules의 검증 요청을 분기; 조정 역할인지 책임 혼합인지 미판정"
        - "위 후보는 수동 분리 작업이 완료되었다는 뜻이 아니며 자동 분리 또는 파일 변경은 허가하지 않음"
        - "Policy 검증기의 책임별 디렉터리 및 구현 적합성 검증은 아직 미완료"
    result:
      status: "incomplete_fulfillment"
      task_name: "Policy 검증기 책임별 분리 적용 평가"
      task_id: "MPD-ARCH-0010"
