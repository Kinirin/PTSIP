contract_type: PTSIP_DEVELOPER_INDEPENDENT_RULE_CONTRACT_GOVERNANCE
contract_revision: 1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: ARCH
authority:
  decision_source: PROJECT_OWNER_EXPLICIT
  decision_scope:
    - P1_FAMILY_POLICY_AUTHORITY_LOCATION
    - S2_DECLARATIVE_SCHEMA_AND_SEPARATE_VERSION_RESOLUTION_RESPONSIBILITIES
    - FIVE_COMMON_GROUPS_AND_FAMILY_OWNED_NESTED_FIELDS
    - RETIRING_SOURCE_NONINHERITANCE_BOUNDARY
  approved_direction_status: APPROVED
  canonical_mpd_identity: UNRESOLVED
  canonical_policy_activation: PENDING_ID_ISSUANCE_SCHEMA_VALIDATION_AND_REGISTRATION
  this_contract_is_registered_active_mpd: false
  this_contract_is_legacy_policy_authority: false
  cross_family_field_semantic_authority: NOT_GRANTED
  unrelated_policy_scope: PRESERVED
policy_location:
  selected_option: P1
  canonical_family_policy_root_pattern: "developer/policy/{FAMILY}/"
  new_policy_must_reside_in_own_responsibility_family: true
  retiring_subtrees_do_not_supply_new_normative_authority: true
  physical_path_does_not_alone_confer_policy_authority: true
  new_policy_identity_and_registration: SEPARATE_MACHINE_RESOLUTION_REQUIRED
independent_rule_contract:
  policy_public_sections:
    - Policy_Identity
    - Policy_Status
    - Authority
    - Policy_Rules
  policy_rules_section_role: INDEPENDENT_RULE_CONTRACT_IDENTIFICATION_AND_REFERENCE
  independent_contract_body_role: RULE_NORMATIVE_CONTENT_AND_INDIVIDUAL_APPROVAL_EVIDENCE
  common_envelope:
    required_groups:
      - Identity
      - Definition
      - Boundary
      - Constraints
      - Evaluation
    required_presence: ALL_FIVE
    group_omission: INVALID
    unused_group_marker: EXPLICIT_REPRESENTATION_TO_BE_DEFINED
    role: GROUP_PRESENCE_STRUCTURE_ONLY
    grants_field_semantic_authority: false
  family_owned_internal_structure:
    owner_coordinate: POLICY_CLASS_AND_ROOT_FAMILY
    independent_fields_types_requiredness_and_meaning: FAMILY_OWNED
    common_group_presence_does_not_unify_inner_field_semantics: true
    cross_family_inheritance_from_shared_group_name: FORBIDDEN
    nested_field_requirements: NOT_INFERRED_FROM_GROUP_PRESENCE
schema_responsibility:
  selected_option: S2
  model: DECLARATIVE_SCHEMA_WITH_SEPARATE_VERSION_REGISTRY_AND_RESOLVER
  shared_structure_schema:
    ref: ".ptsip/contracts/schemas/Policy_Rules/Public_Structure_Rules.schema.json"
    responsibility: VALIDATE_FIVE_GROUP_PRESENCE
    normative_semantic_authority: NONE
  family_schema:
    ref_pattern: ".ptsip/contracts/schemas/Policy_Rules/root-family/{FAMILY}_rules.schema.json"
    responsibility: VALIDATE_MATCHING_FAMILY_FIELDS_AND_SHAPE
    schema_declares_new_family_meaning: false
    exact_binding_and_nonuniform_existing_filenames: UNRESOLVED
  version_metadata_schema:
    ref: ".ptsip/contracts/schemas/Policy_Rules/Policy_Rules_version.schema.json"
    responsibility: VALIDATE_VERSION_REFERENCE_AND_COMPATIBILITY_DECLARATION_SHAPE
    performs_runtime_lookup: false
    executes_migrations: false
    field_layout_and_allowed_values: UNRESOLVED
  version_registry:
    responsibility: REGISTER_APPROVED_CURRENT_ARCHIVED_AND_COMPATIBILITY_FACTS
    source_location_and_contract: UNRESOLVED
    facts_do_not_create_normative_policy_meaning: true
  resolver:
    responsibility:
      - EXACT_REGISTERED_CONTRACT_VERSION_LOOKUP
      - REFERENCE_INTEGRITY_CHECK
      - REGISTERED_COMPATIBILITY_QUERY_AND_REPORT
      - REGISTERED_MIGRATION_ROUTE_DISCOVERY
    arbitrary_compatibility_or_migration_inference: FORBIDDEN
    implementation_and_binding: NOT_YET_AUTHORIZED
  archive:
    proposed_root: ".ptsip/contracts/schemas/Policy_Rules/abortively/"
    owner_requested_example: "v1_ASSURE.schema.json"
    preservation_goal: IMMUTABLE_PRIOR_SCHEMA_BY_VERSION
    archived_schema_auto_promotes_to_current_normative_authority: false
    final_naming_and_registry_mapping: UNRESOLVED
retirement:
  target_status: DECLARED_FOR_EVENTUAL_RETIREMENT_NOT_YET_EXECUTED
  legacy_sources_for_new_normative_policy_derivation: FORBIDDEN
  targets:
    - developer/policy/schemas/
    - developer/policy/registries/
    - developer/policy/policy-resolver-bindings/
    - developer/policy/legacy/
    - developer/policy/contracts/
    - developer/policy/analysis/
    - developer/policy/approvals/
    - developer/policy/MPD-BOUND-0001.yaml
    - developer/policy/policy-resolver-contract.yaml
    - developer/policy/source-application-review.yaml
  staging_source: developer/policy/ARCH/Policy_Rules_Decisions.yaml
  staging_source_new_decisions: FORBIDDEN
  historical_sources_are_not_automatic_new_policy_authority: true
  retirement_requires_approved_semantic_transfer_and_reference_validation: true
unresolved_policy_contract:
  - CANONICAL_MPD_IDENTITY_ISSUER_AND_REGISTRATION_BINDING
  - CURRENT_PUBLIC_STRUCTURE_SCHEMA_AND_VALIDATOR_ADMISSION
  - POLICY_RULES_REFERENCE_FIELDS_AND_EXACT_SHAPE
  - VERSION_REGISTRY_DECLARATION_SCHEMA_AND_LOOKUP_BINDING
  - ARCHIVED_VERSION_NAMING_AND_IMMUTABILITY_CONTRACT
  - RETIREMENT_DEPENDENCY_AND_MIGRATION_COMPLETION_GATES
implementation:
  new_version_schema_materialization: NOT_AUTHORIZED_BY_ABSTRACT_S2_APPROVAL
  new_registry_or_resolver_materialization: NOT_AUTHORIZED_BY_ABSTRACT_S2_APPROVAL
  policy_cutover: NOT_EXECUTED
