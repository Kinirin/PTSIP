schema_version: ptsip-developer-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
policy:
  id: MPD-ARCH-0004
  version: "1.0"
  title: Independent Repository Test Mode Control Plane
  status: ACTIVE
rules:
  control_plane:
    component_id: repository-test-mode-control-plane
    definition: FRESH_AUTHORITY_CONTRACT
    identity_rule: PRESERVE_COMPONENT_ID_ONLY
    prior_implementation_semantics: NON_NORMATIVE
    normative_inputs:
      ownership: EFFECTIVE_PROJECT_PROFILE
      execution_registration: CURRENT_TEST_MODE_REGISTRY
      structure_validation: OFFICIAL_PTSIP_VALIDATION_ENGINE
    authority_boundaries:
      verification_requirements_owner: PROJECT_PROFILE
      executable_targets_owner: TEST_MODE_REGISTRY
      validation_engine_owner: OFFICIAL_PTSIP_VALIDATION
      test_mode_selector_may_redefine_verification_responsibility: false
    structure:
      package: PTSIP
      pinned_version: "0.3.8b5"
      operation: validation.schema
      independent_reference_resolution_required: true
      missing_or_ambiguous_reference: FAIL_CLOSED
    selection:
      contract_basis: NEW_APPROVED_PROFILE_AND_REGISTRY_CONTRACTS_ONLY
      changed_file_trigger_semantics: UNRESOLVED
      automatic_algorithm_legacy_fallback: FORBIDDEN
      unresolved_selection: FAIL_CLOSED
    prohibitions:
      import_legacy_validator: true
      invoke_legacy_validator: true
      copy_legacy_selector_algorithm: true
      infer_normative_rules_from_historical_test_vectors: true
      use_retired_policy_as_runtime_authority: true
      silently_reassign_verification_ownership: true
    independence_acceptance:
      - NO_LEGACY_VALIDATOR_IMPORT_OR_INVOCATION
      - NO_UNAPPROVED_HISTORICAL_RULE_INHERITANCE
      - ONLY_EFFECTIVE_POLICY_PROFILE_REGISTRY_AS_AUTHORITY
      - ALL_REGISTERED_MODE_TARGETS_EXIST_AND_HAVE_VERIFICATION_OWNERS
      - NO_INDIRECT_LEGACY_EXECUTION_FROM_WORKFLOWS_OR_WRAPPERS
      - NEW_VALIDATOR_PASSES_WITH_LEGACY_VALIDATORS_REMOVED
    cutover:
      old_validator_deletion: REQUIRED_AFTER_NEW_VALIDATOR_VERIFIED
      allow_completion_claim_without_execution_evidence: false
      preserve_unrelated_release_assurance: true
relations:
  supersedes: []
  amends: []
  extends: []
  depends_on: []
