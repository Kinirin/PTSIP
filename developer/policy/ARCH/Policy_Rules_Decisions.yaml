contract_type: PTSIP_ARCH_POLICY_RULES_DECISIONS
contract_revision: 1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: ARCH

authority:
  decision_source: PROJECT_OWNER_EXPLICIT
  decision_state: APPROVED_DIRECTION
  scope: ARCH_POLICY_RULES_AND_INDEPENDENT_CONTRACT_BOUNDARY
  retired_root_policy_reactivation: FORBIDDEN
  policy_id_allocation: UNRESOLVED
  full_mpd_policy_materialization: NOT_COMPLETED
  active_mpd_policy_claim: FORBIDDEN
  retired_registries_dependency: FORBIDDEN

public_policy_structure:
  required_sections:
    - Policy_Identity
    - Policy_Status
    - Authority
    - Policy_Rules
  existing_common_rules_schema: developer/contracts/schemas/Policy_Rules/Public_Structure_Rules.schema.json
  current_common_validation:
    type: object
    shared_rule_reference_fields: NOT_MANDATED
    shared_required_properties: NONE
    min_properties: UNCONSTRAINED
    additional_properties_restriction: NOT_IMPOSED
    sufficiency: REOPENED_FOR_REVIEW
  family_internal_semantics: INDEPENDENT
  family_structural_unification: FORBIDDEN
  fourteen_family_field_review_direction:
    authorization: PROJECT_OWNER_EXPLICIT
    meaning_ko: >-
      승인된 5개 그룹의 19개 필드 경로를 고정 후보로 삼아 14개 Root Family를
      하나씩 검토하며 각 필드의 포함 여부를 패밀리별 true/false로 독립 결정한다.
      14개 전체 심사가 끝난 뒤 모든 패밀리가 true인 필드만 공통 필수로,
      하나라도 false인 필드는 공통 선택으로 분류한다. 공통 선택이더라도
      true로 승인한 패밀리 안에서는 필수이며 false인 패밀리에서는 필수가 아니다.
      부모와 하위 필드의 조건은 상속하지 않는다. 이 필수 분류는 패밀리 내부의
      동일 필드명·자료형·구조 강제를 자동 승인하지 않으며 기존의 자연어 의미
      필드 존재 필수와 승인·B3 권위 경계는 별도 변경 승인 없이 유지한다.
    field_candidates_source: APPROVED_FIVE_GROUP_FIELD_SHORTLISTS
    family_order: [NORM, GOV, INTENT, ARCH, INFO, CNTR, RISK, SUPPLY, REAL, ASSURE, CTRL, CHANGE, OPS, RECORD]
    review_unit: ONE_FAMILY_AT_A_TIME
    inclusion_decision: PER_FAMILY_PER_FIELD_BOOLEAN
    include_true: REQUIRED_IN_THIS_FAMILY
    include_false: OPTIONAL_IN_THIS_FAMILY
    false_field_semantics_decision:
      authorization: PROJECT_OWNER_EXPLICIT
      meaning_ko: >-
        Root Family의 필드별 false는 미포함이나 사용 금지가 아니라 비필수이다.
        해당 필드는 승인된 후보 집합에 남아 있으며 필요한 규칙에서는 사용할 수 있다.
        false라는 이유만으로 후보에서 삭제하거나 향후 신규 필드로 다시 생성하지 않는다.
        true인 패밀리의 필수 조건과 하위 필드의 독립성은 그대로 유지하고,
        필드명·자료형·검증 스키마의 확정 및 권위 변경을 자동 승인하지 않는다.
      false_meaning: OPTIONAL_FIELD_PERMITTED
      field_permitted_when_false: true
      omit_field_permitted_when_false: true
      field_removed_or_prohibited_when_false: false
      new_field_creation_due_to_optional_status: NOT_REQUIRED
      parent_child_requiredness_inheritance: FORBIDDEN
      family_field_shape_and_schema_materialization: UNRESOLVED_USER_DECISION
      previous_approval_and_B3_boundaries: PRESERVED
      record_role: ARCH_LOCAL_NONCANONICAL_ACKNOWLEDGMENT_ONLY
      this_record_owns_cross_family_policy_authority: false
    family_field_review_results:
      NORM:
        decision: USER_APPROVED_PRIOR_NORM_RECOMMENDATION
        authorization: PROJECT_OWNER_EXPLICIT
        meaning_ko: >-
          NORM 패밀리의 19개 필드 중 5개는 필수(true), 14개는 비필수(false)로 승인한다.
          비필수 필드는 제거·금지되지 않으며 필요할 때 사용할 수 있다.
          이 결과는 NORM의 정식 정책이나 공통 필드 스키마를 생성하지 않는다.
        family: NORM
        field_requiredness:
          Identity.family: true
          Identity.approval.state: true
          Definition.meaning: true
          Definition.rationale: false
          Boundary.scope: true
          Boundary.subjects: true
          Boundary.exclusions: false
          Boundary.context: false
          Boundary.context.environment: false
          Boundary.context.phase: false
          Constraints.obligations: false
          Constraints.prohibitions: false
          Constraints.preconditions: false
          Constraints.dependencies: false
          Evaluation.criteria: false
          Evaluation.criteria.evidence: false
          Evaluation.method: false
          Evaluation.method.ref: false
          Evaluation.method.outcome_ref: false
        field_count: 19
        required_count: 5
        optional_count: 14
        all_fourteen_family_review_completed: false
        cross_family_name_shape_enforcement: NOT_AUTHORIZED_BY_THIS_DECISION
        normative_NORM_policy_sync: NOT_MATERIALIZED
        B3_approval_and_meaning_presence: PRESERVED
        schema_or_validator_materialization: NOT_AUTHORIZED_BY_THIS_DECISION
        record_role: ARCH_LOCAL_NONCANONICAL_REVIEW_CHECKPOINT_ONLY
        this_record_owns_NORM_policy_authority: false
    common_required_if: ALL_14_FAMILIES_INCLUDE_TRUE
    common_optional_if: ANY_FAMILY_INCLUDE_FALSE
    common_classification_before_all_14_resolved: UNRESOLVED
    unselected_in_all_families: OPTIONAL_UNLESS_SEPARATELY_REMOVED
    parent_child_requiredness_inheritance: FORBIDDEN
    cross_family_field_name_and_structure_forcing: NOT_AUTHORIZED_BY_THIS_DECISION
    previously_approved_meaning_presence: PRESERVED_REQUIRES_SEPARATE_CONFLICT_RESOLUTION_TO_CHANGE
    schema_or_validator_materialization: NOT_AUTHORIZED_BY_THIS_DECISION
    record_role: ARCH_LOCAL_NONCANONICAL_ACKNOWLEDGMENT_ONLY
    this_record_owns_cross_family_policy_authority: false
  identity_field_shortlist_direction:
    authorization: PROJECT_OWNER_EXPLICIT
    meaning_ko: >-
      독립 규칙 계약 Identity 그룹에서는 우선 family와 approval.state만
      채택하고 이전에 제안한 다른 Identity 필드 후보는 현 단계에서 사용하지 않는다.
      이 선택은 계약의 논리적 식별과 B3 승인 콘텐츠 결합 의무를 폐기하지 않으며,
      이들의 다른 저장 위치나 참조 방식은 아직 결정하지 않는다.
    selected_field_candidates: [family, approval.state]
    previous_other_identity_candidates: NOT_SELECTED_FOR_CURRENT_SCHEMA_REVIEW
    same_inner_field_shape_across_families: UNRESOLVED_USER_DECISION
    per_family_field_presence: UNRESOLVED_USER_DECISION
    approval_state_container_representation: UNRESOLVED_USER_DECISION
    contract_identity_and_B3_binding: PRESERVED_SEPARATELY
    schema_or_contract_file_change: NOT_AUTHORIZED_BY_THIS_DECISION
    record_role: ARCH_LOCAL_NONCANONICAL_ACKNOWLEDGMENT_ONLY
    this_record_owns_cross_family_policy_authority: false
  evaluation_field_shortlist_direction:
    authorization: PROJECT_OWNER_EXPLICIT
    meaning_ko: >-
      독립 규칙 계약 Evaluation 그룹에 criteria, method, method.ref를 채택하고,
      독립 evidence_requirements 필드는 criteria.evidence 하위 필드로,
      독립 outcomes 필드는 method.outcome_ref 하위 참조 필드로 대체한다.
      criteria.evidence는 판정에 필요한 증거 요건을, method.outcome_ref는
      판정 결과 정의의 참조를 표현한다. 실제 검증 증거·실행 결과 자체의
      저장 책임이나 승인 권위는 이 필드 선택으로 변경하지 않는다.
      필드별 공통 구조 강제와 패밀리별 필수 여부는 부모·자식 모두 독립 결정이며,
      자료형·참조 해소·허용값 및 실제 스키마 변경은 아직 승인되지 않았다.
    group: Evaluation
    selected_field_paths: [criteria, criteria.evidence, method, method.ref, method.outcome_ref]
    replaced_standalone_candidates: [evidence_requirements, outcomes]
    not_selected_for_current_review: [on_unresolved, coverage]
    criteria_evidence_responsibility: EVIDENCE_REQUIREMENTS_NOT_OBSERVED_EVIDENCE
    method_outcome_ref_responsibility: OUTCOME_DEFINITION_REFERENCE_NOT_OBSERVED_RESULT
    child_conditions_inherited_from_parent: false
    cross_family_field_shape_enforcement: UNRESOLVED_USER_DECISION
    per_family_field_presence_boolean_matrix: UNRESOLVED_USER_DECISION
    exact_types_allowed_values_and_reference_resolution: UNRESOLVED_USER_DECISION
    approval_and_provenance_boundaries: GOV_ASSURE_RECORD_B3_PRESERVED
    schema_or_validator_materialization: NOT_AUTHORIZED_BY_THIS_DECISION
    record_role: ARCH_LOCAL_NONCANONICAL_ACKNOWLEDGMENT_ONLY
    this_record_owns_cross_family_policy_authority: false
  constraints_field_shortlist_direction:
    authorization: PROJECT_OWNER_EXPLICIT
    meaning_ko: >-
      독립 규칙 계약의 Constraints 그룹에서 의무 obligations, 금지 prohibitions,
      사전조건 preconditions, 의존조건 dependencies 네 필드만 설계 대상으로 채택한다.
      앞서 제안한 invariants, postconditions, limits는 현 단계에서 사용하지 않는다.
      이 선정만으로 14개 Root Family의 내부 필드명과 구조를 통일하거나
      패밀리별 필수 조건, 자료형, 허용값 및 실행·승인 책임을 확정하지 않는다.
    group: Constraints
    selected_field_candidates: [obligations, prohibitions, preconditions, dependencies]
    not_selected_for_current_review: [invariants, postconditions, limits]
    shared_inner_field_structure: UNRESOLVED_USER_DECISION
    per_family_requiredness: UNRESOLVED_USER_DECISION
    machine_schema_and_validator_materialization: NOT_AUTHORIZED_BY_THIS_DECISION
    existing_family_authority_and_B3: PRESERVED
    record_role: ARCH_LOCAL_NONCANONICAL_ACKNOWLEDGMENT_ONLY
    this_record_owns_cross_family_policy_authority: false
  boundary_field_shortlist_direction:
    authorization: PROJECT_OWNER_EXPLICIT
    meaning_ko: >-
      독립 규칙 계약의 Boundary 그룹에서 적용 범위(scope), 직접 적용 대상(subjects),
      적용 제외(exclusions), 적용 상황(context), 적용 환경(context.environment),
      적용 단계(context.phase)를 각각 설계 대상으로 채택한다.
      적용 범위 및 제외는 의무 또는 금지 규칙을 자동으로 생성하지 않으며,
      context의 하위 필드 둘도 부모의 공통 강제와 필수 여부를 자동 상속하지 않는다.
      이 채택은 14개 Root Family에 동일한 내부 필드명과 구조를 강제하거나
      패밀리별 필수 여부, 세부 자료형, 허용값, 빈 값 표현을 확정하는 결정이 아니다.
    group: Boundary
    selected_field_candidates:
      - scope
      - subjects
      - exclusions
      - context
      - context.environment
      - context.phase
    child_field_conditions_inherited_from_parent: false
    cross_family_inner_field_shape_enforcement: UNRESOLVED_USER_DECISION
    per_family_field_presence_boolean_matrix: UNRESOLVED_USER_DECISION
    exact_types_values_and_nested_shapes: UNRESOLVED_USER_DECISION
    common_five_group_structure: PRESERVED
    family_internal_semantic_ownership: PRESERVED
    B3_binding: PRESERVED
    schema_or_validator_materialization: NOT_AUTHORIZED_BY_THIS_DECISION
    record_role: ARCH_LOCAL_NONCANONICAL_ACKNOWLEDGMENT_ONLY
    this_record_owns_cross_family_policy_authority: false
  definition_field_shortlist_direction:
    authorization: PROJECT_OWNER_EXPLICIT
    meaning_ko: >-
      독립 규칙 계약 Definition 그룹의 필드 후보 중 meaning과 rationale만
      현 단계의 설계 대상으로 채택하고 title과 terms는 사용하지 않는다.
      meaning은 앞서 승인된 자연어 규칙 의미 원본을 담고 반드시 존재하되 빈 값이 허용된다.
      rationale은 규칙을 채택한 이유와 판단 근거의 설명을 담되 승인된 규칙 의미나
      B3의 정확한 승인 콘텐츠 검증을 대체하지 않는다.
      이 필드 선정만으로 모든 Root Family에 동일한 내부 필드 구조를 강제하거나
      미결정된 패밀리별 필수 조건과 실제 JSON Schema를 확정하지 않는다.
    group: Definition
    selected_field_candidates: [meaning, rationale]
    not_selected_for_current_review: [title, terms]
    meaning_presence: REQUIRED
    meaning_empty_value: ALLOWED
    rationale_role: NON_NORMATIVE_EXPLANATION_OF_DECISION_MOTIVATION
    rationale_presence: UNRESOLVED_USER_DECISION
    field_names_types_and_nested_shapes: UNRESOLVED_USER_DECISION
    cross_family_internal_shape_unification: NOT_AUTHORIZED_BY_THIS_DECISION
    per_family_presence_boolean_matrix: UNRESOLVED_USER_DECISION
    exact_approval_content_binding: B3_PRESERVED
    schema_or_validator_materialization: NOT_AUTHORIZED_BY_THIS_DECISION
    record_role: ARCH_LOCAL_NONCANONICAL_ACKNOWLEDGMENT_ONLY
    this_record_owns_cross_family_policy_authority: false
  schema_first_review_authority_reconciliation:
    resolution: RECONCILE
    authorization: PROJECT_OWNER_EXPLICIT
    purpose: POLICY_RULES_SCHEMA_CONTRACT_FIELD_REVIEW
    meaning_ko: >-
      정책관리 Policy_Rules 스키마 계약을 설계할 때 실제 대상 스키마와 패밀리별 하위 스키마를
      먼저 분석하고 필드의 자연어 의미, 역할, 자료형, 허용값과 검증 책임을 사용자와 독립적으로 검토한다.
      승인 전 스키마와 필드는 비규범적 설계 후보로만 다루며, 사용자 승인 후 정식 정책에 의미를
      기록한 다음 승인된 스키마 변경을 계획하고 구현한다.
      이 절차는 POLICY > PLAN > IMPLEMENTATION 권한 순위를 변경하지 않는다.
    initial_target: developer/contracts/schemas/Policy_Rules/Public_Structure_Rules.schema.json
    subordinate_target_root: developer/contracts/schemas/Policy_Rules/root-family/
    review_mode: SCHEMA_TARGET_FIRST_NON_NORMATIVE_CANDIDATE
    candidate_normative_authority: NONE
    require_separate_semantic_and_machine_field_decisions: true
    field_purpose_type_allowed_values_and_validation_review: REQUIRED
    user_approval_before_formal_policy_and_schema_mutation: REQUIRED
    semantic_meaning_in_candidate_not_automatically_normative: true
    natural_language_meaning_field_placement_and_authority: AUTHORITY_APPROVED_LOCATION_UNRESOLVED
    natural_language_semantic_baseline_decision:
      decision: APPROVED_NATURAL_LANGUAGE_SEMANTIC_BASELINE
      authorization: PROJECT_OWNER_EXPLICIT
      meaning_ko: >-
        사용자에게 승인받은 자연어 정책 의미를 해당 규칙의 의미 기준으로 보존한다.
        기계 필드는 승인된 의미를 조회·검증·실행하기 위한 파생 표현이며,
        이 표현이 승인된 자연어의 적용 범위, 조건 또는 정책 효과를 임의로 변경하거나
        새로운 규범 권한을 생성할 수 없다. 승인 이전의 자연어 후보는 규범이 아니며,
        자연어와 기계 필드가 불일치하면 이를 조용히 해소하거나 자동 승인할 수 없다.
        자연어 의미의 승인만으로 정확한 계약 콘텐츠의 B3 승인 검증을 대체할 수 없다.
      scope: POLICY_RULES_INDEPENDENT_CONTRACT_SEMANTIC_FIELD_RESPONSIBILITY
      semantic_source: EXPLICITLY_APPROVED_NATURAL_LANGUAGE_MEANING
      candidate_semantic_authority: NONE
      machine_field_role: APPROVED_MEANING_DERIVED_REPRESENTATION
      machine_may_invent_or_override_meaning: FORBIDDEN
      conflict_silent_override: FORBIDDEN
      approval_authority: GOV_PRESERVED
      content_integrity_approval_boundary: B3_PRESERVED
      family_inner_semantics_ownership: PRESERVED
      meaning_field_location: INDEPENDENT_RULE_CONTRACT_BODY
      meaning_field_location_decision:
        authorization: PROJECT_OWNER_EXPLICIT
        meaning_ko: >-
          자연어 정책 의미 필드는 정책 문서의 Policy_Rules 참조 영역이 아니라
          별도 독립 규칙 계약 내부에 저장한다. 공통 5개 그룹의 이름과 존재 의무는
          보존하며 자연어 의미의 논리적 위치는 Definition 그룹으로 정한다.
        storage_owner: INDEPENDENT_POLICY_RULES_CONTRACT
        policy_rules_reference_section_owns_semantic_body: false
        common_five_group_envelope: PRESERVED
        selected_semantic_group: Definition
        exact_inner_field_path: UNRESOLVED_USER_DECISION
        common_inner_field_shape: NOT_AUTHORIZED_BY_THIS_DECISION
        family_nested_field_semantics_ownership: PRESERVED
        record_role: ARCH_LOCAL_NONCANONICAL_ACKNOWLEDGMENT_ONLY
        this_record_owns_cross_family_policy_authority: false
      meaning_field_value_emptiness_decision:
        authorization: PROJECT_OWNER_EXPLICIT
        meaning_ko: >-
          자연어 의미 필드가 존재할 때 그 값은 비어 있을 수 있다.
          필드값이 반드시 비어 있지 않아야 한다는 조건은 두지 않는다.
          자연어 의미 필드는 반드시 존재해야 하지만 필드값은 비어 있어도 되며,
          빈 값의 표현 방식과 의미 부재 시 정책 해석·승인·실행 처리도 아직 결정하지 않는다.
          비어 있는 값을 AI가 임의로 보충하거나 B3의 정확한 승인 검증을 대체해서는 안 된다.
        value_nonempty_constraint: NOT_REQUIRED
        empty_field_value: ALLOWED
        field_presence_requirement: REQUIRED
        empty_value_representation: UNRESOLVED_USER_DECISION
        empty_value_semantic_and_lifecycle_effect: UNRESOLVED_USER_DECISION
        automatic_semantic_inference_from_empty_value: FORBIDDEN
        B3_exact_approved_content_binding: PRESERVED
        candidate_or_unapproved_text_normative_authority: NONE
        record_role: ARCH_LOCAL_NONCANONICAL_ACKNOWLEDGMENT_ONLY
        this_record_owns_cross_family_policy_authority: false
      meaning_field_requiredness: REQUIRED_PRESENCE_EMPTY_VALUE_ALLOWED
      meaning_field_name_and_representation: UNRESOLVED_USER_DECISION
      machine_semantic_binding_and_conflict_resolution: UNRESOLVED_USER_DECISION
      machine_field_vocabulary_and_enum_governance: UNRESOLVED_USER_DECISION
      formal_shared_policy_owner_and_identity: UNRESOLVED_USER_DECISION
      record_role: ARCH_LOCAL_NONCANONICAL_ACKNOWLEDGMENT_ONLY
      this_record_owns_cross_family_policy_authority: false
      actual_schema_contract_or_validator_materialization: NOT_AUTHORIZED_BY_THIS_DECISION
    natural_language_vs_machine_binding_and_conflict_handling: UNRESOLVED_USER_DECISION
    machine_field_vocabulary_type_and_enum_governance: UNRESOLVED_USER_DECISION
