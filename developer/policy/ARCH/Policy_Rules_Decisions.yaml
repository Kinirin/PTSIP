contract_type: PTSIP_ARCH_POLICY_RULES_DECISIONS
contract_revision: 1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: ARCH

authority:
  decision_source: PROJECT_OWNER_EXPLICIT
  decision_state: APPROVED_DIRECTION
  scope: ARCH_POLICY_RULES_AND_INDEPENDENT_CONTRACT_BOUNDARY
  retired_root_policy_reactivation: FORBIDDEN
  policy_id_allocation: UNRESOLVED
  full_mpd_policy_materialization: NOT_COMPLETED
  active_mpd_policy_claim: FORBIDDEN
  retired_registries_dependency: FORBIDDEN

public_policy_structure:
  required_sections:
    - Policy_Identity
    - Policy_Status
    - Authority
    - Policy_Rules
  existing_common_rules_schema: developer/contracts/schemas/Policy_Rules/Public_Structure_Rules.schema.json
  current_common_validation:
    type: object
    shared_rule_reference_fields: NOT_MANDATED
    shared_required_properties: NONE
    min_properties: UNCONSTRAINED
    additional_properties_restriction: NOT_IMPOSED
    sufficiency: REOPENED_FOR_REVIEW
  family_internal_semantics: INDEPENDENT
  family_structural_unification: FORBIDDEN

validation_responsibility:
  common_schema: MINIMAL_SHARED_STRUCTURE_ONLY
  arch_schema:
    owner: ARCH
    targets:
      - POLICY_RULES_REFERENCE_SECTION
      - INDEPENDENT_RULE_CONTRACT_BODY
    exact_properties_and_constraints: UNRESOLVED
    physical_schema_partition: UNRESOLVED
  reference_existence_check: REQUIRES_SEPARATE_RESOLUTION

rule_contract_boundary:
  selected_direction: INDEPENDENT_RULE_CONTRACT
  reconciliation: POLICY_REFERENCES_INDEPENDENT_REQUIREMENTS
  policy_rules_section_owns:
    - RULE_IDENTIFICATION
    - INDEPENDENT_CONTRACT_REFERENCE
  independent_rule_contract_owns:
    - NORMATIVE_REQUIREMENTS_BODY
    - INDIVIDUAL_RULE_APPROVAL_METADATA
    - INDIVIDUAL_RULE_APPROVAL_EVIDENCE_REFERENCE
  contract_storage_root: developer/contracts/Policy_Rules/root-family/ARCH/
  approval_metadata_in_policy_document: NON_OWNING
  policy_lifecycle_status_vs_rule_approval: DISTINCT
  multi_rule_reference_decision:
    decision_id: P1
    user_selected_option: B
    authorization: PROJECT_OWNER_EXPLICIT
    policy_document_rule_cardinality: MULTIPLE_INDEPENDENT_CONTRACT_REFERENCES_ALLOWED
    actual_rule_body_owner: EACH_REFERENCED_INDEPENDENT_CONTRACT
    rule_grouping_criterion: UNRESOLVED_USER_DECISION
    exact_reference_fields_and_shape: UNRESOLVED_USER_DECISION
    minimum_and_maximum_rule_count: UNRESOLVED_USER_DECISION
    duplicate_reference_handling: UNRESOLVED_USER_DECISION

unresolved:
  rule_identity_format: UNRESOLVED
  policy_reference_field_and_structure: UNRESOLVED
  rule_approval_fields_names_and_nesting: UNRESOLVED
  rule_approval_requiredness_and_types: UNRESOLVED
  approval_evidence_reference_format: UNRESOLVED
  approval_authority_and_transition: UNRESOLVED
  requirements_fields_types_and_values: UNRESOLVED
  contract_reference_resolution: UNRESOLVED
  duplicated_identity_or_metadata_policy: UNRESOLVED
  final_arch_schema_and_policy_document_fields: UNRESOLVED
  canonical_new_mpd_policy_identity_and_status: UNRESOLVED
  common_rules_stronger_structural_validation: UNRESOLVED

materialization:
  this_file: TEMPORARY_NON_CANONICAL_DECISION_STAGING
  temporary_staging_policy:
    decision_source: PROJECT_OWNER_EXPLICIT_CONDITIONAL_APPROVAL
    canonical_policy_filename_pattern: "MPD-ARCH-[0-9]{4}.yaml"
    canonical_policy_directory: developer/policy/ARCH/
    temporary_file_is_policy_identity: false
    temporary_file_is_activation_authority: false
    allowed_use: HOLD_APPROVED_ARCH_DECISIONS_ONLY_WHILE_CANONICAL_MPD_AUTHORING_IS_UNAVAILABLE
    when_canonical_mpd_authoring_is_available: WRITE_CANONICAL_MPD_DIRECTLY
    subsequent_temporary_file_updates_when_mpd_authoring_available: FORBIDDEN
    new_normative_consumers_or_bindings_to_temporary_file: FORBIDDEN
    permanent_policy_schema_resolver_and_index_references_to_temporary_file: FORBIDDEN
    existing_canonical_mpd_ids_must_not_be_reused_or_overwritten: true
    mpd_readiness_checks:
      - POLICY_ID_ISSUER_OR_EXPLICITLY_AUTHORIZED_ID_IS_AVAILABLE
      - FOUR_SECTION_DOCUMENT_AND_ARCH_FIELDS_ARE_DECIDED
      - CANONICAL_SCHEMA_AND_REFERENCE_VALIDATION_CAN_VALIDATE_DOCUMENT
    migration_when_ready:
      - MATERIALIZE_APPROVED_DECISIONS_WITHOUT_INVENTING_UNRESOLVED_DETAILS_IN_CANONICAL_MPD
      - PRESERVE_INDEPENDENT_RULE_CONTRACT_OWNERSHIP
      - VALIDATE_AND_REGISTER_CANONICAL_MPD_UNDER_APPROVED_AUTHORITY
      - VERIFY_CANONICAL_MPD_HAS_NO_REFERENCE_TO_TEMPORARY_FILE
      - REMOVE_ALL_LIVE_REPOSITORY_REFERENCES_TO_TEMPORARY_FILE
      - DELETE_TEMPORARY_FILE
      - VERIFY_NO_LIVE_REPOSITORY_DEPENDENCY_ON_TEMPORARY_FILE
    deletion_must_not_require_legacy_registry_or_temporary_contract: true
    migration_completion: NOT_COMPLETED
  independent_rule_contract_files: NOT_YET_AUTHORIZED
  new_arch_mpd_policy: NOT_YET_MATERIALIZED
  new_arch_json_schema: NOT_YET_AUTHORIZED
  new_validator_or_resolver: NOT_YET_AUTHORIZED
  other_root_families: NOT_MODIFIED
