    - id: "R-ID-EF3214C5C86C2AA012051E075080B80B"
      rule: "NO-LEGACY-ROOTS"
  title: "ARCH Developer Automation 책임 영역 분리"
  Boundary:
    scope: "PTSIP 저장소 전용 Developer Automation의 단일 책임 소유와 Go 구현 경계"
    subjects:
      - "모든 구현 단위의 책임 영역은 정확히 하나이며 패키지 경로로 기계 식별 가능해야 함"
      - "서로 다른 책임 영역의 협력·의존은 가능하지만 소유권·권위의 승계를 뜻하지 않음"
      - "BRANCH: .ptsip/engine/developer/Distribution/branch/ — 브랜치 제어"
      - "RELEASE: .ptsip/engine/developer/Distribution/release/ — 릴리스 식별·준비·빌드 조정·배포 조립·태그·게시·게이트 호출; 책임 확대는 사용자 승인 필요"
      - "TEST_MODE: .ptsip/engine/developer/testmode/ — 등록부 검증·자동/수동 모드 선택·변경 파일·삭제 전 이미지 해석·실행 계획 구성"
      - "TEST_MODE는 .github/test_modes.yaml을 소비하며 .ptsip/profiles/Test_Mode.ptsip.yaml은 독립 계약 승인 전 비활성 참조 초안임"
      - "POLICY: .ptsip/engine/developer/policy/ — 정책 조회·해석·연결·바인딩·식별자·버전·상태·산출물 생명주기"
      - "POLICY 구현은 여섯 개의 독립된 하위 책임으로 분할하되 각 책임명·경로는 후속 사용자 결정 대상"
      - "Family 정책 검증 기능은 .ptsip/engine/developer/policy/ 아래의 Go 개발 도구에 배치하고 Family 간 규범적 소유권을 침범하지 않음"
      - "새 책임 영역은 정확한 기존 영역이 없거나 의미 왜곡 위험이 있을 때 근거·근접 영역 비교·비중복 설명을 제시하고 사용자 승인으로만 확정"
      - "구체적인 구현 목록·파일 이동·패키지 의존관계·마이그레이션 순서는 PLAN 소유"
    exclusions:
      - "서로 다른 책임을 하나의 범용 패키지에 혼합하거나 소유자가 없는 공통 구현을 생성하는 행위"
      - "다른 영역이 소유하는 규범적 의미를 재정의하거나 의존·동일 경로를 이유로 책임을 병합·승계하는 행위"
      - "TEST_MODE가 원본 구성 요소 소유권·검증 관계·검증 의무를 변경하거나 생성하는 행위"
      - "기존에 폐기한 developer/automation/planning/ 및 developer/automation/ 경로의 보존·재활성화"
      - "폐기된 .github/checks/release/ 경로의 보존 또는 신규 릴리스 구현의 실행 의존"
      - "사용자 승인 없이 새로운 책임 영역·POLICY 하위 여섯 개의 상세 책임·실행 권한을 확정하는 행위"
      - "Family 검증기의 구현만으로 제품 검증 엔진의 규범적 권위를 변경하는 행위"
  Evaluation:
    criteria:
      evidence:
        - "구현 단위별 단일 책임 소유 및 패키지 경로 기반 기계 식별 가능 여부"
        - "Branch·Release·Test Mode·Policy 책임 분리와 상호 비승계 여부"
        - "Test Mode가 기존 등록부를 소비하되 원본 소유권과 검증 요구를 재정의하지 않는지 확인"
        - "Policy의 여섯 하위 책임 상세는 별도 승인 전 미확정으로 유지"
        - "신규 책임 영역의 승인 근거가 있고 구현·이전 작업의 구체 내용은 PLAN에 있는지 확인"
        - "폐기된 developer/automation/ 및 .github/checks/release/에 대한 신규 권위 의존이 없는지 확인"
