Policy_Identity:
  id: "MPD-ARCH-0007"
  policy_kind: "PTSIP_DEVELOPER_POLICY"
  root_family: "ARCH"
  title: "ARCH PTSIP 구성 요소 분류 및 의존관계 재검토"
Policy_Status:
  Policy_Status_Schema_ver: "1"
  status: "DRAFT.Default"
  contract: "urn:ptsip:contract:policy:arch:component-dependency:review"
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:arch:component-dependency"
    Rule_ver: "1"
  Definition:
    - id: "R-ID-3EB28F73985142D8A8280737834859ED"
      rule: "REVIEW-COMPONENTS"
    - id: "R-ID-CD21A5697F2840BFA0EECAF0CC3AEBC3"
      rule: "REVIEW-DEPENDENCIES"
    - id: "R-ID-A61E1B094A43435EBF91F5A516BF6129"
      rule: "NO-INFERRED-RELATION"
  title: "ARCH PTSIP 구성 요소 분류 및 의존관계 재검토"
  Boundary:
    scope: "기존 PTSIP 구성 요소와 import·read 의존관계의 수정 전 검토 후보"
    subjects:
      - "ptsip-evidence, ptsip-source-compat, ptsip-migration의 과거 분류"
      - "과거 선언된 IMPORTS 및 READS 관계"
      - "현재 구성 요소·소유 책임·의존관계 재검토"
    exclusions:
      - "기존 기록을 확인 없이 현재 적용 중인 공식 의존관계로 확정"
      - "관찰된 import만으로 ARCH 관계 의도를 추정"
      - "검토 후보에서 제품 실행 권한 또는 배포 승인 생성"
    authority_semantics:
      candidate_only: true
      normative_adoption: "NOT_AUTHORIZED_UNTIL_REVIEW"
      prior_components:
        -
          id: "ptsip-evidence"
          classification: "PRODUCT"
          role: "IMPLEMENTATION"
          selector: "src/ptsip/evidence/**"
        -
          id: "ptsip-source-compat"
          classification: "PRODUCT"
          role: "IMPLEMENTATION"
          selector: "src/ptsip/source_compat/**"
        -
          id: "ptsip-migration"
          classification: "PRODUCT"
          role: "IMPLEMENTATION"
          selector: "src/ptsip/migration/**"
      prior_common_properties:
        shipped: true
        runtime_required: false
        executable: false
        release_owner: "tool"
        compatibility_owner: "tool"
      prior_relationships:
        -
          from: "ptsip-evidence"
          type: "IMPORTS"
          to: "ptsip-core"
        -
          from: "ptsip-source-compat"
          type: "IMPORTS"
          to: "ptsip-core"
        -
          from: "ptsip-source-compat"
          type: "READS"
          to: "ptsip-embedded-contracts"
        -
          from: "ptsip-migration"
          type: "IMPORTS"
          to: "ptsip-core"
        -
          from: "ptsip-migration"
          type: "IMPORTS"
          to: "ptsip-evidence"
        -
          from: "ptsip-migration"
          type: "IMPORTS"
          to: "ptsip-source-compat"
      ptsip_core_selector_broadened_to_recursive_src_ptsip: false
      review_status: "UNVERIFIED_CANDIDATES"
  Evaluation:
    criteria:
      evidence:
        - "선언된 구성 요소 목록을 실제 프로젝트 프로파일 및 파일 구조와 대조"
        - "IMPORTS·READS의 방향과 의미를 현재 근거로 재검증"
        - "검토 완료 전 DRAFT 상태와 비활성 후보를 유지"
    application_problems:
      - "ARCH_RULE_DEFINITION_R_ID_AND_PROFILE_REGISTRATION_PENDING"
      - "ARCH_FAMILY_SCHEMA_IDENTITY_APPROVAL_AND_RULE_STATE_CONFLICT_UNRESOLVED"
      - "POLICY_STATUS_CONTRACT_URN_REGISTRATION_PENDING"
