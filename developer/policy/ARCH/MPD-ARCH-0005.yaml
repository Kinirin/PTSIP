Policy_Identity:
  id: "MPD-ARCH-0005"
  policy_kind: "PTSIP_DEVELOPER_POLICY"
  root_family: "ARCH"
  title: "ARCH 개발자 정책과 배포용 PTSIP 기능의 권한·배포 경계"
Policy_Status:
  Policy_Status_Schema_ver: "1"
  status: "APPROVED.Application_Problems"
  contract: "urn:ptsip:contract:policy:arch:developer-support:isolation"
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:arch:developer-support"
    Rule_ver: "1"
  Definition:
    - id: "R-ID-D81909A614BE4DCAAA79224988A89643"
      rule: "DEV-PRODUCT-BOUNDARY"
    - id: "R-ID-1B1BBFD12FC94F4EAF811D0E7A89762D"
      rule: "NO-CONSUMER-IMPOSE"
    - id: "R-ID-D0D57D5167034760AA0FF9C22859AF05"
      rule: "NO-RUNTIME-DEV-DEP"
  title: "ARCH 개발자 정책과 배포용 PTSIP 기능의 권한·배포 경계"
  Boundary:
    scope: "PTSIP 저장소의 개발 정책 영역과 배포되는 PTSIP Support Feature 정책 영역 사이의 격리"
    subjects:
      - "개발자 전용 정책의 저장소 내부 책임과 제품 기능 정책의 배포 책임 분리"
      - "개발 정책이 일반 소비자 프로젝트의 필수 조건이 되지 않음"
      - "제품 런타임에서 개발 전용 정책·도구에 대한 의존 금지"
    exclusions:
      - "제품 정책(src/policy)의 규범적 의미를 개발 정책이 변경하는 행위"
      - "개발자 정책과 지원 기능 정책의 Owner 병합"
      - "두 정책 클래스 간 권한 스키마 공유"
  Evaluation:
    criteria:
      evidence:
        - "제품 배포 아티팩트가 개발자 정책에 의존하지 않음"
        - "개발자 정책으로 일반 사용자 프로젝트 의무가 생성되지 않음"
        - "서로 다른 정책 클래스의 소유 권한이 분리되어 있음"
