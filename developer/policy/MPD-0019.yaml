schema_version: ptsip-developer-policy/v1
policy_class: PTSIP_BOUND_POLICY

policy:
  id: MPD-0019
  version: "1.0"
  title: PTSIP and VPMS Verification Responsibility Boundary
  status: APPROVED

rules:
  ptsip_vpms_verification_boundary:
    responsibility: PTSIP_VPMS_VERIFICATION_RESPONSIBILITY_BOUNDARY

    participants:
      ptsip:
        owns:
          - ARCHITECTURE_CLASSIFICATION
          - CHANGE_IMPACT_RESOLUTION
          - VERIFICATION_RESPONSIBILITY
          - TEST_MODE_SELECTION
          - VERIFICATION_REF_SELECTION
        emits: EXPLICIT_VERIFICATION_REF_SET
        must_not_own:
          - FRAMEWORK_SPECIFIC_RUNNER_BINDING
          - VERIFICATION_PROTOCOL_EXECUTION
          - VERIFICATION_RESULT_NORMALIZATION
          - VERIFICATION_EVIDENCE_NORMALIZATION

      vpms:
        owns:
          - VERIFICATION_PROTOCOL_RESOLUTION
          - VERIFICATION_INPUT_BINDING
          - FORMULA_BINDING
          - POLICY_BINDING
          - RUNNER_RESOLUTION
          - VERIFICATION_EXECUTION
          - VERIFICATION_RESULT_NORMALIZATION
          - VERIFICATION_EVIDENCE_NORMALIZATION
        must_not_own:
          - PTSIP_ARCHITECTURE_CLASSIFICATION
          - CHANGE_IMPACT_RESOLUTION
          - TEST_MODE_SELECTION
          - PROJECT_PROFILE_AUTHORITY

    handoff_contract:
      producer: PTSIP_TEST_MODE_CONTROL_PLANE
      consumer: VPMS
      payload: EXPLICIT_VERIFICATION_REF_SET
      selection_complete_before_handoff: true
      vpms_may_expand_selection_scope: false
      implicit_selection: FORBIDDEN
      unresolved_verification_ref: FAIL_CLOSED

    taxonomy_firewall:
      ptsip_lifecycle_classification_must_not_be_copied_into_vpms: true
      vpms_product_toolchain_scope:
        status: LEGACY_NOT_CANONICAL
        may_be_used_as_ptsip_classification_alias: false

    current_test_mode_execution_debt:
      current_contract: PYTEST_TARGET_LIST
      current_registry_field: execution.pytest
      current_resolver_behavior: DIRECT_PYTEST_TARGET_PLAN
      state: TRANSITION_DEBT
      target_contract: EXPLICIT_VERIFICATION_REF_SET
      selection_semantics_must_not_change_during_execution_contract_migration: true

    legacy_vpms_authority:
      policy_ref: SFP-0006
      state: ACTIVE_LEGACY_SUPPORT_FEATURE_AUTHORITY
      direct_override_by_approved_developer_policy: FORBIDDEN
      reconciliation_required_before_this_policy_activation: true

  responsibility_boundary:
    participants:
      - PTSIP
      - VPMS
    owns:
      - PTSIP_TO_VPMS_VERIFICATION_HANDOFF
      - SELECTION_EXECUTION_AUTHORITY_FIREWALL
      - PTSIP_VPMS_TAXONOMY_FIREWALL
    does_not_own:
      - PTSIP_TEST_MODE_SELECTION_ALGORITHM
      - VPMS_PROTOCOL_INTERNAL_MODEL
      - PTSIP_PROJECT_PROFILE_SEMANTICS
      - RUNNER_ADAPTER_IMPLEMENTATION

transition:
  target_status: ACTIVE
  state: PENDING
  requirements:
    - id: TR-001
      type: VPMS_POLICY
      state: OPEN
      refs:
        - developer/policy/MPD-0020.yaml
      next_action:
        action: VALIDATE_VPMS_PROTOCOL_POLICY
        execution: PARALLEL_ALLOWED
        target_refs:
          - developer/policy/MPD-0020.yaml
        completion_check: VPMS_PROTOCOL_POLICY_VALID

    - id: TR-002
      type: LEGACY_AUTHORITY_RECONCILIATION
      state: OPEN
      refs:
        - src/policy/SFP-0006.yaml
      next_action:
        action: RECONCILE_LEGACY_VPMS_SUPPORT_AUTHORITY
        execution: SERIAL_REQUIRED
        target_refs:
          - src/policy/SFP-0006.yaml
          - developer/policy/MPD-0019.yaml
          - developer/policy/MPD-0020.yaml
        completion_check: LEGACY_VPMS_AUTHORITY_RECONCILED

    - id: TR-003
      type: HANDOFF_CONTRACT
      state: OPEN
      refs:
        - .github/test_modes.yaml
        - .github/scripts/resolve_test_modes.py
      next_action:
        action: MATERIALIZE_VERIFICATION_REF_HANDOFF
        execution: SERIAL_REQUIRED
        target_refs:
          - .github/test_modes.yaml
          - .github/scripts/resolve_test_modes.py
        after:
          - TR-001
          - TR-002
        completion_check: VERIFICATION_REF_HANDOFF_VALID

relations:
  supersedes: []
  amends: []
  extends: []
  depends_on:
    - policy: MPD-0018
      scope: POLICY_CLASS_AND_BOUNDARY_CLASSIFICATION
    - policy: SFP-0006
      scope: LEGACY_VPMS_SUPPORT_AUTHORITY_REQUIRING_RECONCILIATION
