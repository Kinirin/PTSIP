schema_version: ptsip-developer-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY

policy:
  id: MPD-SPEC-0027
  version: "2.0"
  title: Project Profile User Revision Lineage Contract
  status: ACTIVE

rules:
  user_revision_lineage:
      owner: USER
      developer_distributed_baseline_revision: 1
      developer_pp_generation_change_revision: RESET_TO_1
      user_authoritative_mutation_within_same_pp: INCREMENT_EXACTLY_ONE_AFTER_SUCCESSFUL_ATOMIC_APPLY
      read_only_or_derived_operations_increment_revision: false
      developer_must_not_use_user_revision_as_pp_version_bump_substitute: true
      content_digest_is_user_revision: false
      content_digest_purpose:
        - INTEGRITY
        - EXACT_CONTENT_IDENTITY
        - STALE_PLAN_DETECTION
  

relations:
  supersedes: []
  amends: []
  extends: []
  depends_on: []
