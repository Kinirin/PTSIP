schema_version: ptsip-developer-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY

policy:
  id: MPD-SPEC-0028
  version: "2.0"
  title: Policy Analysis Registry-First Identity and Discovery Contract
  status: ACTIVE

rules:
  policy_analysis_contract:
    authority_scope: POLICY_ANALYSIS

    schema_ownership:
      owner: POLICY_ANALYSIS
      schema_root: developer/policy/analysis/schemas
      responsibility_analysis_schema: developer/policy/analysis/schemas/policy-responsibility-analysis.schema.json
      materialization_analysis_registry_schema: developer/policy/analysis/schemas/policy-materialization-analysis-registry.schema.json

    record_identity:
      identity_pattern: "^PRA-[0-9]{4}$"
      canonical_filename_rule: ANALYSIS_ID_WITH_YAML_SUFFIX
      record_root: developer/policy/analysis/records
      date_in_identity: FORBIDDEN
      descriptive_semantics_in_filename: FORBIDDEN

    discovery:
      sole_entrypoint: developer/policy/analysis/registry.yaml
      direct_record_path_as_discovery_input: FORBIDDEN
      filename_semantic_inference: FORBIDDEN
      date_based_discovery: FORBIDDEN
      allowed_resolution_keys:
        - ANALYSIS_ID
        - SUBJECT_TYPE_SUBJECT_ID_ANALYSIS_KIND
      unresolved_or_ambiguous_resolution: FAIL_CLOSED

    registry:
      all_analysis_records_must_be_registered: true
      registry_record_owns_analysis_ref: true
      policy_binding_references_analysis_id: true
      policy_binding_duplicates_analysis_ref: false
      subject_kind_identity_must_be_unique: true

    provenance:
      recorded_at_allowed: true
      recorded_at_is_identity: false
      recorded_at_is_discovery_key: false

    generalization:
      scope: POLICY_ANALYSIS_ONLY
      automatic_application_to_other_policy_subsystems: FORBIDDEN
      other_subsystem_schema_ownership_requires_explicit_policy_authority: true

relations:
  supersedes: []
  amends: []
  extends: []
  depends_on: []
