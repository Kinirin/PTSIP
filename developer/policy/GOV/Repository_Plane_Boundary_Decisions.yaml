    consumer_product_feature_normative_ownership: FORBIDDEN
    consumer_product_engine_or_language_selection_authority: FORBIDDEN
  consumer_policy:
    root: src/policy/
    owns: [DISTRIBUTED_PRODUCT_FEATURE_SEMANTICS, PRODUCT_IMPLEMENTATION_POLICY, PRODUCT_PLANNING]
    source_scope: src/
    product_tests: src/tests/
    product_plans: src/plans/
