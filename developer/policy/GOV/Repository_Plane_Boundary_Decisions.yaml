  default_cross_plane_dependency: FORBIDDEN
  explicit_exception: .ptsip/profiles/rbac/
  consumer_scope: [REFERENCE_RBAC_DECLARATIONS, ADD_RBAC_DECLARATIONS, UPDATE_RBAC_DECLARATIONS]
  sharing_between_developer_and_consumer: PERMITTED
  contract_kinds: [RESPONSIBILITY, CONDITION_ATOM, PERMISSION_ATOM, BINDING]
  existing_opt_in_and_activation_contract: PRESERVED
  exception_does_not_grant_other_dot_ptsip_paths: true
  exception_does_not_grant_developer_policy_authorship: true
  exception_does_not_grant_dot_ptsip_schema_mutation: true
other_domains:
