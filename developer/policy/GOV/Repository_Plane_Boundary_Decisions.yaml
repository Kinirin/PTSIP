    external_reference_default: FORBIDDEN
contract_location_resolution:
  decision: KEEP_PRIOR
  original_root: src/policy/contracts/
  retained_as: CONSUMER_CONTRACT_DEFINITION_ROOT
  rejected_new_root: src/ptsip/default_contract/
  new_root_creation: WITHDRAWN
  existing_contract_and_subindex_decisions: PRESERVED
rbac_dependency_resolution:
