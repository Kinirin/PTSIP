    - id: "R-ID-MPD-GOV-0006-OBLIGATION-DISTRIBUTED_RBAC_VALIDATION_ENGINE"
      rule: "GOV.MPD-GOV-0006.OBLIGATION.DISTRIBUTED_RBAC_VALIDATION_ENGINE"
      preconditions:
