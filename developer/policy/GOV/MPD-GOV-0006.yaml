      rule: "GOV.MPD-GOV-0006.PROHIBITION.NO_OUT_OF_SCOPE_APPROVAL"
    - id: "R-ID-MPD-GOV-0006-PROHIBITION-NO_INFERRED_OFFICIAL_AUTHORITY"
      rule: "GOV.MPD-GOV-0006.PROHIBITION.NO_INFERRED_OFFICIAL_AUTHORITY"
    - id: "R-ID-MPD-GOV-0006-PROHIBITION-NO_AUTOMATION_NEW_AUTHORITY"
      rule: "GOV.MPD-GOV-0006.PROHIBITION.NO_AUTOMATION_NEW_AUTHORITY"
    - id: "R-ID-MPD-GOV-0006-PROHIBITION-NO_SOURCE_ESCALATION"
      rule: "GOV.MPD-GOV-0006.PROHIBITION.NO_SOURCE_ESCALATION"
  Boundary:
    scope: "정책 생명주기 및 변경 허가, 기계 중심 코딩 에이전트 제어 구조, 반복 추론의 계약화, 거버넌스 결정·승인·실행·전환 출처"
    subjects:
      - "정책 상태와 버전의 공통 계약 및 적용 조건"
      - "정책 상태 정규화와 충돌 복구"
      - "변경 범위·선행조건·최신성·충돌 검사"
      - "정책 조회·라우팅·상태 확인·계획 구성·문맥 생성의 기계적 제어"
      - "제한된 AI 추론과 검증된 기계 계약·바인딩의 재사용"
      - "USER_EXPLICIT, AGENT_INFERRED, AUTOMATION_DERIVED"
      - "결정 출처, 승인 출처, 실행 허가 출처, 상태 전환 출처"
    exclusions:
      - "정책 식별자의 생성 및 등록부 무결성은 MPD-GOV-0005의 책임"
      - "정책·작업의 결정권과 README 관리는 MPD-GOV-0004의 책임"
      - "에이전트 제어 구조의 모든 상세 구현이 완료되었다는 주장"
  Constraints: {}
  Evaluation:
    criteria:
      evidence:
        - "정책 상태와 구현 승인의 독립성"
        - "변경 범위·선행조건·최신성·충돌 확인 결과"
        - "추론 후보의 검증과 승인 근거, 기계 계약 승격 여부"
        - "사용자 명시·에이전트 추론·자동화 파생 출처의 분리"
        - "정책 생명주기와 상태 전환을 정의하는 실제 계약 참조"
        - "developer/policy/registries/**의 퇴역 권위 참조 또는 실행 의존성이 정책 판단에 사용되지 않는지 확인"
