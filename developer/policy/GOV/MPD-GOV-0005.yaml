Policy_Identity:
  id: MPD-GOV-0005
  policy_kind: PTSIP_DEVELOPER_POLICY
  root_family: GOV
  title: "GOV 정책 식별 관리"
Policy_Status:
  Policy_Status_Schema_ver: "3"
  status: APPROVED.Applying
  contract: urn:ptsip:contract:policy:gov:identity:integrity
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:gov:policy-identification"
    Rule_ver: "2"
  Definition:
    - id: "R-ID-MPD-GOV-0005-OBLIGATION-SEPARATE_RULE_IDENTITY_CONTRACT"
      rule: "GOV.MPD-GOV-0005.OBLIGATION.SEPARATE_RULE_IDENTITY_CONTRACT"
      preconditions:
        - "C-ID-RULE_CONTRACT_ID_ASSIGNMENT"
    - id: "R-ID-MPD-GOV-0005-OBLIGATION-POLICY_ID_CONTRACT_OWNER"
      rule: "GOV.MPD-GOV-0005.OBLIGATION.POLICY_ID_CONTRACT_OWNER"
      preconditions:
        - "C-ID-POLICY_IDENTITY_ASSIGNMENT"
    - id: "R-ID-MPD-GOV-0005-OBLIGATION-POLICY_ID_DERIVED_INDEX_CONSISTENCY"
      rule: "GOV.MPD-GOV-0005.OBLIGATION.POLICY_ID_DERIVED_INDEX_CONSISTENCY"
      preconditions:
        - "C-ID-POLICY_DISCOVERY_OR_IDENTITY_VALIDATION"
    - id: "R-ID-MPD-GOV-0005-OBLIGATION-APPROVAL_PROVENANCE_SCOPE"
      rule: "GOV.MPD-GOV-0005.OBLIGATION.APPROVAL_PROVENANCE_SCOPE"
      preconditions:
        - "C-ID-POLICY_IDENTITY_OR_STATUS_APPROVAL_EVIDENCE"
    - id: "R-ID-MPD-GOV-0005-OBLIGATION-FAIL_CLOSED_ON_INTEGRITY_FAULT"
      rule: "GOV.MPD-GOV-0005.OBLIGATION.FAIL_CLOSED_ON_INTEGRITY_FAULT"
      preconditions:
        - "C-ID-ID_COLLISION_OR_CATALOG_MISMATCH_OR_INVALID_PROVENANCE"
    - id: "R-ID-MPD-GOV-0005-OBLIGATION-MACHINE_CONTRACT_FIRST"
      rule: "GOV.MPD-GOV-0005.OBLIGATION.MACHINE_CONTRACT_FIRST"
      preconditions:
        - "C-ID-INCOMPLETE_IDENTITY_INFORMATION"
    - id: "R-ID-MPD-GOV-0005-OBLIGATION-BOUNDED_NON_AUTHORITY_DEFAULT"
      rule: "GOV.MPD-GOV-0005.OBLIGATION.BOUNDED_NON_AUTHORITY_DEFAULT"
      preconditions:
        - "C-ID-MISSING_DETERMINISTIC_RESULT"
    - id: "R-ID-MPD-GOV-0005-OBLIGATION-PERSIST_VERIFIED_RESOLUTION"
      rule: "GOV.MPD-GOV-0005.OBLIGATION.PERSIST_VERIFIED_RESOLUTION"
      preconditions:
        - "C-ID-REPEATED_IDENTITY_DECISION"
    - id: "R-ID-MPD-GOV-0005-PROHIBITION-NO_VISUAL_ID_GUESS"
      rule: "GOV.MPD-GOV-0005.PROHIBITION.NO_VISUAL_ID_GUESS"
    - id: "R-ID-MPD-GOV-0005-PROHIBITION-NO_APPROVAL_WORDING_STATUS_GUESS"
      rule: "GOV.MPD-GOV-0005.PROHIBITION.NO_APPROVAL_WORDING_STATUS_GUESS"
    - id: "R-ID-MPD-GOV-0005-PROHIBITION-NO_IMPLEMENTATION_TO_ACTIVATION"
      rule: "GOV.MPD-GOV-0005.PROHIBITION.NO_IMPLEMENTATION_TO_ACTIVATION"
    - id: "R-ID-MPD-GOV-0005-PROHIBITION-NO_REPOSITORY_EXISTENCE_APPROVAL"
      rule: "GOV.MPD-GOV-0005.PROHIBITION.NO_REPOSITORY_EXISTENCE_APPROVAL"
    - id: "R-ID-MPD-GOV-0005-PROHIBITION-NO_REPEATED_MACHINE_RESOLVABLE_INFERENCE"
      rule: "GOV.MPD-GOV-0005.PROHIBITION.NO_REPEATED_MACHINE_RESOLVABLE_INFERENCE"
  Boundary:
    scope: "개발 정책 식별, 정책 문서와 자동 생성 인덱스의 일치, 승인 출처 확인 및 기계적 식별 문제 해결"
    subjects:
      - "원본 정책 문서의 정책 식별자와 파생 식별 인덱스"
      - "정책 문서의 선언된 제목"
      - "정책 문서와 파생 인덱스의 식별자·경로·상태 정보 일치"
      - "승인 대상, 목표 상태와 검토 범위를 지정하는 승인 근거"
      - "계약이 제공하는 식별 문제 해결 결과와 검증된 재사용 바인딩"
    exclusions:
      - "정책의 상태 전이 자체를 승인하거나 변경하는 권한"
      - "기술적 구현 승인만으로 정책 권위를 생성하는 행위"
  Constraints: {}
  Evaluation:
    criteria:
      evidence:
        - "정책 문서의 ID·제목·상태와 자동 생성된 식별 인덱스의 일치"
        - "승인 출처, 승인 대상, 목표 상태 및 내용 검토 범위의 명시"
        - "ID 충돌과 등록 불일치에 대한 실패 처리"
        - "기계 계약 우선 해결 및 검증된 결과 재사용"
