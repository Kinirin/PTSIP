Policy_Identity:
  id: MPD-GOV-0005
  policy_kind: PTSIP_DEVELOPER_POLICY
  root_family: GOV
  title: "GOV 정책 식별 관리"
Policy_Status:
  Policy_Status_Schema_ver: "3"
  status: APPROVED.provisional
  contract: urn:ptsip:contract:policy:gov:identity:integrity
Authority:
  authority_id: MPD-GOV-0005
  Authority_Category:
    Authority_Major_Category:
      major: responsibilities
  Authority_Action:
    action_ref: urn:ptsip:authority:action:policy:policy-modification
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:gov:policy-identification"
    Rule_ver: "1"
  Definition:
    meaning: "GOV의 정책 식별 원본은 정책 문서가 소유한다. 식별 인덱스는 정책 문서와 승인된 계약에서 자동 생성하는 비권위 조회 결과이다."
    rationale: "식별자나 상태를 에이전트의 추측으로 결정하지 않고 승인·검증된 결과를 재사용한다."
  Boundary:
    scope: "개발 정책 식별, 정책 문서와 자동 생성 인덱스의 일치, 승인 출처 확인 및 기계적 식별 문제 해결"
    subjects:
      - "원본 정책 문서의 정책 식별자와 파생 식별 인덱스"
      - "정책 문서의 선언된 제목"
      - "정책 문서와 파생 인덱스의 식별자·경로·상태 정보 일치"
      - "승인 대상, 목표 상태와 검토 범위를 지정하는 승인 근거"
      - "계약이 제공하는 식별 문제 해결 결과와 검증된 재사용 바인딩"
    exclusions:
      - "정책의 상태 전이 자체를 승인하거나 변경하는 권한"
      - "기술적 구현 승인만으로 정책 권위를 생성하는 행위"
  Constraints:
    obligations:
      - id: OBLIGATION/SEPARATE_RULE_IDENTITY_CONTRACT
        applies_when: RULE_CONTRACT_ID_ASSIGNMENT
        rule: "Policy_Rules.Identity.contract_id는 Policy_Status.contract와 별도 식별 책임을 가지며 규칙의 안정적·버전 비포함 식별자를 사용한다. 규칙 버전은 Rule_ver가 소유하며, 식별자 생성·유일성 검증은 독립적으로 관리한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/POLICY_ID_CONTRACT_OWNER
        applies_when: POLICY_IDENTITY_ASSIGNMENT
        rule: "정책 식별자와 제목은 각 항목을 소유하는 계약을 기준으로 결정하고 제목은 정책 문서에서 선언한 값을 사용한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/POLICY_ID_DERIVED_INDEX_CONSISTENCY
        applies_when: POLICY_DISCOVERY_OR_IDENTITY_VALIDATION
        rule: "승인된 계약으로 정책 문서를 탐색·검증하고 자동 생성된 인덱스의 식별자·경로·상태가 원본과 정확히 일치하는지 확인한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/APPROVAL_PROVENANCE_SCOPE
        applies_when: POLICY_IDENTITY_OR_STATUS_APPROVAL_EVIDENCE
        rule: "승인 근거에는 승인 대상, 목표 상태와 정책 내용 검토 범위를 명시한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/FAIL_CLOSED_ON_INTEGRITY_FAULT
        applies_when: ID_COLLISION_OR_CATALOG_MISMATCH_OR_INVALID_PROVENANCE
        rule: "식별자 충돌, 정책 문서와 파생 인덱스 불일치, 승인 근거 누락 또는 무효한 승인 근거가 발생하면 해당 처리를 실패로 판정한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/MACHINE_CONTRACT_FIRST
        applies_when: INCOMPLETE_IDENTITY_INFORMATION
        rule: "정보가 부족하면 먼저 기계 계약에 정의된 해결 결과를 사용한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/BOUNDED_NON_AUTHORITY_DEFAULT
        applies_when: MISSING_DETERMINISTIC_RESULT
        rule: "정당한 권위를 새로 생성하거나 변경하지 않는 범위에서만 제한적인 합리적 기본값을 사용할 수 있다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/PERSIST_VERIFIED_RESOLUTION
        applies_when: REPEATED_IDENTITY_DECISION
        rule: "검증된 해결 결과는 기계가 재사용할 수 있는 계약 또는 바인딩으로 보존하고 동일한 현재 문제의 반복 추론을 방지한다."
        Rule_state: APPROVED.provisional
      - id: PROHIBITION/NO_VISUAL_ID_GUESS
        rule: "정책 외형이나 의미를 보고 다음 정책 식별자를 추측하여 결정하는 행위"
      - id: PROHIBITION/NO_APPROVAL_WORDING_STATUS_GUESS
        rule: "승인 문구만으로 정책 상태를 추론하는 행위"
      - id: PROHIBITION/NO_IMPLEMENTATION_TO_ACTIVATION
        rule: "구현 승인을 정책 활성화 승인으로 취급하는 행위"
      - id: PROHIBITION/NO_REPOSITORY_EXISTENCE_APPROVAL
        rule: "저장소에 파일이 존재한다는 사실만으로 정책 승인을 인정하는 행위"
      - id: PROHIBITION/NO_REPEATED_MACHINE_RESOLVABLE_INFERENCE
        rule: "기계가 이미 해결할 수 있거나 유효한 해결 결과가 보존된 문제를 반복해서 새로 추론하는 행위"
    dependencies:
      - ".ptsip/contracts/policy/boundary.json"
  Evaluation:
    criteria:
      evidence:
        - "정책 문서의 ID·제목·상태와 자동 생성된 식별 인덱스의 일치"
        - "승인 출처, 승인 대상, 목표 상태 및 내용 검토 범위의 명시"
        - "ID 충돌과 등록 불일치에 대한 실패 처리"
        - "기계 계약 우선 해결 및 검증된 결과 재사용"
