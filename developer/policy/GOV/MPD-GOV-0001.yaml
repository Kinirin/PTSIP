Policy_Identity:
  id: MPD-GOV-0001
  policy_kind: PTSIP_DEVELOPER_POLICY
  root_family: GOV
  title: "GOV 정책 정의 및 책임 오케스트레이션"
Policy_Status:
  Policy_Status_Schema_ver: "2"
  status: APPROVED.Applying
  contract: urn:ptsip:contract:policy:gov:responsibility:orchestration
Authority:
  authority_id: MPD-GOV-0001
  Authority_Category:
    Authority_Major_Category:
      major: responsibilities
  Authority_Action:
    action_ref: urn:ptsip:authority:action:policy:policy-modification
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:gov:responsibility-orchestration"
    Rule_ver: "20"
  Definition:
    meaning: "GOV는 개발 정책·개발 작업·개발 통제 영역에서 결정과 승인의 정당성을 관리하는 정책 Family이며, 개별 GOV 정책의 책임 경계를 정의하고 정책 간 소유권을 분배한다."
    rationale: "GOV의 공통 책임과 개별 정책 소유 규칙을 분리하여, AI가 정책 주제나 실행 편의를 근거로 책임 및 승인 권한을 중복하거나 임의 재배분하지 못하게 한다."
  Boundary:
    scope: "GOV Family의 정책 정의, 결정·승인 정당성의 기본 경계, GOV 정책별 책임 소유와 분배"
    subjects:
      - "개발 정책 영역의 결정과 승인 정당성"
      - "개발 작업 영역의 결정과 승인 정당성"
      - "개발 통제 영역의 결정과 승인 정당성"
      - "정책 계약 소유 경계: .ptsip/contracts/policy/identity/, routing/, lifecycle/, authority/"
      - "MPD-GOV-0004: 개발 결정권·위임 범위·승인 정당성과 README 관리"
      - "MPD-GOV-0005: 정책 식별자·제목·등록 무결성과 식별 문제의 기계적 해결"
      - "MPD-GOV-0006: 정책 생명주기·변경 허가·코딩 에이전트 기계적 제어·거버넌스 출처"
    exclusions:
      - "개별 GOV 정책이 소유하는 규칙 본문을 GOV 총칙에 중복하여 정의하지 않는다."
      - "새 정책의 책임 범위를 GOV의 총칙만으로 자동 확대하거나 재분배하지 않는다."
      - "미배정 기존 세부 규칙은 별도 사용자 결정 없이 새로운 GOV 책임으로 간주하지 않는다."
  Constraints:
    obligations:
      - id: OBLIGATION/GOV_FAMILY_RESPONSIBILITY
        applies_when: GOV_POLICY_SCOPE
        rule: "GOV는 개발 정책, 개발 작업 및 개발 통제 영역에서 결정과 승인에 관한 정당성을 관리한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/GOV_DECISION_LEGITIMACY
        applies_when: DEVELOPMENT_DECISION_OR_APPROVAL
        rule: "결정의 정당성은 결정 대상, 권한 소유자, 위임 범위 및 승인 주체에 따라 판단한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/GOV_DELEGATION_POLICY_0004
        applies_when: DECISION_MANDATE_OR_README_GOVERNANCE
        rule: "개발 결정권·위임·승인 정당성과 README 관리의 구체적인 규칙은 MPD-GOV-0004가 소유한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/GOV_DELEGATION_POLICY_0005
        applies_when: POLICY_IDENTIFICATION_AND_REGISTRATION
        rule: "정책 식별자·제목·등록 무결성·식별 문제 대응의 구체적인 규칙은 MPD-GOV-0005가 소유한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/GOV_DELEGATION_POLICY_0006
        applies_when: POLICY_LIFECYCLE_AND_GOVERNANCE_PROVENANCE
        rule: "정책 상태·버전 관리, 변경 승인 조건, 코딩 에이전트 기계적 판단 및 거버넌스 출처의 구체적인 규칙은 MPD-GOV-0006이 소유한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/GOV_CONTRACT_OWNERSHIP
        applies_when: POLICY_IDENTITY_STATUS_VERSION_OR_TITLE
        rule: "정책 식별자, 제목, 상태 및 버전은 각 항목을 소유하는 계약을 기준으로 관리하며 세부 적용은 해당 GOV 정책에 위임한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_RBAC_SUCCESSOR
        applies_when: LEGACY_AUTHORITY_MODEL_REPLACEMENT
        rule: "기존 GOV·조건·실행의 권한 부여 방식은 Compile-Sealed RBAC로 대체한다(KEEP_LATEST). 새 권한 모델의 상위 경계는 컴파일 확정, 책임·조건 원자·권한 원자·바인딩 정당성의 독립 소유 및 변경 감응이다. 무관한 GOV 정책 책임은 자동 폐기하지 않는다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_INDEPENDENT_CONTRACT_TRANSITION
        applies_when: COMPILE_SEALED_AUTHORITY_MODEL_MIGRATION
        rule: "Compile-Sealed RBAC의 기존 GOV·조건·실행 권한 모델 대체는 C 독립 계약 전환형으로 진행한다(KEEP_LATEST). 책임, 조건 원자, 권한 원자, 승인된 바인딩, 컴파일·Seal, 책임 활성화 및 변경 감응은 독립된 의미·소유 계약으로 정의하고, 검증·승인된 참조 단위부터 기존 권한 계약을 단계적으로 대체한다. 전환은 기존 권한 체계의 영구 병행을 의미하지 않는다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_NEW_INDEPENDENT_SCHEMAS
        applies_when: COMPILE_SEALED_RBAC_SCHEMA_DESIGN
        rule: "Compile-Sealed RBAC의 새 권한 모델은 기존 Authority·조건·실행 계약 필드의 단순 이름 변경이나 내부 확장이 아닌 신규 독립 스키마로 설계한다. 새 스키마는 독립 의미·소유권을 검증할 수 있어야 하며 기존 계약은 승인되고 검증된 참조 전환에 따라 대체한다. 승인된 H-B 내부 계층 방향과 신규 스키마 상위 경로는 해당 GOV 계약을 따르며, 세부 필드·참조 표현·실제 전환 범위는 후속 결정으로 남기며 개별 스키마 파일명은 승인된 명칭을 따른다. 신규 스키마 파일은 승인된 최상위 스키마 경로에 직접 배치한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/RETIRE_LEGACY_AUTHORITY_CATEGORIES
        applies_when: LEGACY_AUTHORITY_MAJOR_MINOR_MICRO_MIGRATION
        rule: "KEEP_LATEST: Authority_Major_Category, Authority_Minor_Category, Authority_Micro_Category의 분류 계층 및 값은 새 Compile-Sealed RBAC의 권한·책임 계약에 승계하지 않고 규범적 분류 책임에서 전면 폐기한다. 기존 계약·GOV 및 타 Family 참조·스키마·Resolver·검증기의 관련 규칙은 변경 영향 대상으로 식별하여, 새 계약에 의한 유효한 참조 전환과 검증 후 물리적으로 제거한다. 전환 전 레거시 필드의 존재는 새 권위나 승인 근거를 생성하지 않는다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_HIERARCHICAL_SCHEMA_DESIGN
        applies_when: COMPILE_SEALED_RBAC_INDEPENDENT_SCHEMA_DESIGN
        rule: "Compile-Sealed RBAC 독립 계약의 신규 스키마는 H-B 공통 메타와 도메인별 의미 계층을 구분하는 구조로 설계한다. 공통 메타는 독립 계약 간에 실제로 공유되는 기계 검증 책임에 한정하고, Responsibility·Condition Atom·Permission Atom·Binding·Seal·Activation 등 고유 의미 계층과 소유권은 각 계약이 독립적으로 정의한다. 이 결정은 정책 Root Family 전체에 공통 문서 골격을 강제하지 않는다. H-B의 공통 메타와 도메인별 의미 계층은 YAML·스키마의 논리적 필드 구조이지 common/ 또는 domains/ 물리 디렉터리를 요구하지 않는다. 공통 메타의 구체 항목·필드명·필수 여부는 후속 결정으로 남기고, 신규 스키마 파일은 승인된 최상위 경로에 직접 둔다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_SCHEMA_ROOT_LOCATION
        applies_when: COMPILE_SEALED_RBAC_INDEPENDENT_SCHEMA_LOCATION
        rule: "Compile-Sealed RBAC 신규 독립 스키마의 최상위 저장 경로는 .ptsip/contracts/schemas/compile-sealed-rbac/ 로 확정한다. 이 위치 결정은 JSON Schema 저장 책임에 한정되며 원자 등록부, 바인딩 인덱스, Compiler 관련 기계 계약, 실제 YAML 정의 및 Seal 산출물의 경로를 이곳에 강제하지 않는다. 이들 비스키마 산출물의 저장 위치는 별도 결정한다. 신규 독립 스키마 파일은 위 확정 경로 바로 아래에 두고 common/ 및 domains/와 같은 내부 분류용 하위 디렉터리를 만들지 않는다. 독립 스키마는 승인된 계약별 6종으로 분할하며 상세 필드·공통 메타 재사용 방식은 미결정이다. 실제 스키마 파일명은 responsibility.schema.json, condition-atom.schema.json, permission-atom.schema.json, binding.schema.json, sealed-contract.schema.json, activation.schema.json으로 확정한다. 이 경로 결정만으로 미확정 스키마를 생성하거나 기존 권한 검증을 제거하지 않는다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_SIX_INDEPENDENT_SCHEMAS
        applies_when: COMPILE_SEALED_RBAC_SCHEMA_PARTITIONING
        rule: "Compile-Sealed RBAC 신규 독립 JSON Schema는 Responsibility, Condition Atom, Permission Atom, Binding, Seal, Activation의 계약별 6개 파일로 분할한다. 각 스키마가 해당 계약의 구조 및 도메인별 의미 검증을 독립적으로 소유하고 H-B 공통 메타·도메인 계층형 설계 원칙을 유지한다. 6개 스키마 파일은 .ptsip/contracts/schemas/compile-sealed-rbac/ 바로 아래에 배치하고 common/, domains/ 하위 디렉터리를 사용하지 않는다. 각 계약의 승인·활성화·변경 감응 등 독립 의미와 권위 경계를 스키마 통합으로 합치지 않는다. 개별 스키마 상세 필드 정의·공통 메타 재사용/검증의 기술적 표현과 Seal·Activation 산출물의 저장 위치는 별도 결정한다. RBAC 선언형 계약 원본의 저장 루트는 별도로 승인된 프로젝트 프로파일 RBAC 경로 정책을 따른다. 이 분할 결정만으로 미정의 스키마 파일을 생성하거나 구현·권한 전환을 완료한 것으로 간주하지 않는다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_OPT_IN_PROFILE_RBAC_ROOT
        applies_when: PROJECT_USES_COMPILE_SEALED_RBAC
        rule: "Compile-Sealed RBAC 기능을 명시적으로 사용하는 프로젝트는 자신의 저장소에서 .ptsip/profiles/rbac/ 를 RBAC 선언형 계약 기록의 필수 저장 루트로 사용한다. 이 경로는 Responsibility·Condition Atom·Permission Atom·Binding 등의 재사용 가능한 계약 기록에 적용하며 Root Family 이름별 중복 사본·파일명을 요구하지 않는다. 프로젝트 프로파일은 해당 독립 계약을 기계적으로 조회할 수 있도록 연결해야 하며 pp.2.00 프로파일의 명시적 RBAC 기능 사용 선언과 등록부 참조 필드는 별도 승인된 정책에 따르되, 필드명·자료형·등록부 파일명·개별 계약 파일명·등록/조회 표현은 추후 독립적으로 결정한다. RBAC 기능을 사용하지 않는 프로젝트에는 이 디렉터리 및 고객 정책 문서 형식을 강제하지 않는다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_OPT_IN_SIX_SCHEMA_REQUIREMENT
        applies_when: PROJECT_USES_COMPILE_SEALED_RBAC
        rule: "Compile-Sealed RBAC 기능을 사용하는 프로젝트에는 .ptsip/contracts/schemas/compile-sealed-rbac/ 아래 responsibility.schema.json, condition-atom.schema.json, permission-atom.schema.json, binding.schema.json, sealed-contract.schema.json, activation.schema.json 여섯 독립 스키마의 생성·존재 및 검증 사용을 필수로 요구한다. 이 조건을 충족하지 못한 프로젝트는 해당 RBAC 기능을 유효하게 사용할 수 없으며 권한을 추론하거나 기존 승인·실행 검사를 우회해 보완하지 않는다. 비사용 프로젝트에 여섯 스키마를 강제하지 않는다. 스키마 상세 필드, 배포/생성 방법, 기능 활성화 선언·검출 및 검증 절차의 구체적 구현은 후속 결정한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/PP200_EXPLICIT_RBAC_OPT_IN_AND_REGISTRY_REF
        applies_when: PROJECT_PROFILE_PP_2_00_COMPILE_SEALED_RBAC_USE
        rule: "Project Profile pp.2.00은 Compile-Sealed RBAC 기능의 사용 여부와 RBAC 계약 등록부 참조를 프로젝트 프로파일의 기계 검증 가능한 선언 필드로 정의한다. 기능 사용을 명시적으로 선언한 경우에만 RBAC 기능의 활성화 검증을 시작하고, 등록부 참조가 누락되었거나 참조 대상·필수 6개 스키마·독립 계약의 유효성을 검증하지 못하면 RBAC 기능을 실패 시 차단한다. 디렉터리·계약 파일의 존재나 에이전트 추론만으로 기능 사용 또는 실행 권한을 인정하지 않는다. 비사용 프로젝트의 RBAC 구조 미보유는 실패로 보지 않는다. 상위 정책이 승인한 .ptsip/profiles/rbac/ 계약 루트와 .ptsip/contracts/schemas/compile-sealed-rbac/ 스키마 루트는 유지한다. pp.2.00 프로젝트 프로파일의 신규 최상위 필드는 rbac이며 그 하위 기능 사용 선언 필드는 enabled(rbac.enabled), 등록부 참조 필드는 registry_ref(rbac.registry_ref)로 확정한다. rbac.enabled가 false로 선언된 프로젝트는 rbac.registry_ref를 생략할 수 있으며, 해당 참조나 RBAC 스키마·계약 기록의 부재를 검증 실패로 간주하지 않는다. 비활성 선언에서 참조가 존재하더라도 이를 기능 사용·권한 활성화의 근거로 사용하지 않는다. 그 밖의 필드 값·자료형 제약·등록부 개별 파일명 및 버전 전환·배포 절차는 별도 결정한다. 이 승인으로 pp.1.02의 현재 상태를 변경하거나 pp.2.00의 프로파일/도구 전환을 완료한 것으로 간주하지 않는다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_CENTRAL_RBAC_REGISTRY
        applies_when: PROJECT_PROFILE_PP_2_00_COMPILE_SEALED_RBAC_REGISTRY_DISCOVERY
        rule: "Compile-Sealed RBAC는 A 중앙 등록부 방식을 사용한다. RBAC 사용 프로젝트의 pp.2.00 rbac.registry_ref는 .ptsip/profiles/rbac/ 내 하나의 중앙 등록부 진입점을 참조하며, 해당 등록부는 Responsibility·Condition Atom·Permission Atom·Binding 등 독립 선언 계약의 ID와 실제 계약 원본 파일 참조를 통합적으로 탐색·해소하는 단일 조회 기준이다. 계약 원본은 각각 독립적으로 유지하고 등록부에 정의 본문·승인 권위·권한 활성화 의미를 흡수하지 않으며 Root Family별 동일 책임·조건·권한 사본의 생성을 요구하지 않는다. 별도의 원자·Binding별 조회 인덱스를 독립적인 정식 등록부로 필수화하지 않는다. 중앙 등록부의 필수·조건부·선택 필드는 별도의 승인된 필드 계약을 따르고, 등록부 개별 파일명·직렬화 형식·필드 상세 자료형과 제약·참조 검증 규칙·파생 조회 자료의 허용 형태는 후속 결정한다. 등록부의 존재나 파일 등록 자체만으로 승인·Seal·Activation을 인정하지 않는다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_CENTRAL_REGISTRY_FIELDS
        applies_when: PROJECT_USES_COMPILE_SEALED_RBAC_CENTRAL_REGISTRY
        rule: "Compile-Sealed RBAC의 중앙 등록부 필드 계약은 registry/compile-sealed-rbac-registry-fields.json을 기계 판독 기준으로 따른다. schema_version, entries, entries[].id, entries[].kind, entries[].resource는 필수이고 entries[].revision은 조건부, metadata는 선택으로 정의한다. schema_version은 등록부 형식 버전, entries는 독립 계약 목록, id는 독립 계약 ID, kind는 계약 종류, resource는 실제 계약 파일 참조, revision은 적용되는 경우 계약 개정 구분, metadata는 비권위적 설명·진단에 한정한다. revision 필수화 조건, 등록부 파일명·직렬화 형식, 필드 자료형·허용값·고유성 및 참조 검증 규칙은 별도 결정하며 추론으로 확정하지 않는다. 등록부에는 원본 책임·조건·권한·Binding 정의나 승인·실행 권위를 흡수하지 않는다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_SIX_SCHEMA_PROVISIONAL_SCAFFOLDS
        applies_when: COMPILE_SEALED_RBAC_SCHEMA_FIELD_DEFINITION_PENDING
        rule: "사용자는 .ptsip/contracts/schemas/compile-sealed-rbac/ 의 승인된 여섯 독립 JSON Schema 및 배포용 동일 사본의 현행 fail-closed 골격을 상세 필드 결정 작업의 임시 기준으로 승인한다. 이 임시 승인은 이미 생성된 스키마 파일의 존재·독립 분할·해당 위치에 한정하며 각 스키마의 실제 필수/선택 필드, 참조 문법, 승인 정당성, Seal 무결성, Activation 의미 또는 유효한 RBAC 인스턴스 판정을 승인하지 않는다. 세부 계약이 독립적으로 승인되어 실제 검증 가능한 스키마로 대체되기 전까지 골격은 모든 계약 인스턴스를 거부하며, 골격 파일 존재를 pp.2.00 활성화·RBAC 실행 권한·정식 엔진 연산 등록 또는 0.3.8b6 배포 완료의 근거로 사용하지 않는다. 실제 필드와 등록부 의미를 사용자의 후속 결정에 따라 독립 기계 계약으로 확정한다."
        Rule_state: APPROVED.provisional
      - id: PROHIBITION/REUSE_RETIRED_AUTHORITY_CATEGORY
        rule: "폐기된 Authority Major·Minor·Micro의 분류 계층·값을 새 RBAC 책임·조건·권한·바인딩 계약의 필수 의미 또는 승인 근거로 재사용하거나, 레거시 분류 참조에 근거하여 실행 권한을 부여하는 행위"
      - id: PROHIBITION/INTENT_ARCH_CANNOT_CREATE_GOV_MANDATE
        rule: "INTENT의 작업 목표나 ARCH의 기술 설계를 근거로 GOV의 위임 권한을 자동 생성하는 행위"
      - id: PROHIBITION/CTRL_TEST_CANNOT_APPROVE_POLICY
        rule: "CTRL의 실행 가능 판정이나 테스트 통과로 명시되지 않은 정책 승인을 생성하는 행위"
      - id: PROHIBITION/UNAUTHORIZED_RESPONSIBILITY_REPARTITION
        rule: "사용자의 정책 결정 없이 GOV 개별 정책의 소유권을 임의로 분할·병합하거나 재배분하는 행위"
    dependencies:
      - "developer/policy/GOV/MPD-GOV-0004.yaml"
      - "developer/policy/GOV/MPD-GOV-0005.yaml"
      - "developer/policy/GOV/MPD-GOV-0006.yaml"
  Evaluation:
    criteria:
      evidence:
        - "GOV의 개발 정책·작업·통제 세 영역에 대한 결정과 승인 책임 명시"
        - "결정 주체·대상·위임 범위·승인 주체에 대한 기본 정당성 경계"
        - "GOV-0004, GOV-0005, GOV-0006의 책임 분배 및 문서 참조"
        - "GOV 총칙과 개별 GOV 정책 사이의 책임 중복 또는 미결정 구분"
        - "Authority Major·Minor·Micro 분류 전면 폐기, 신규 모델 미승계 및 레거시 참조의 검증된 제거"
