  Boundary:
    scope: "GOV Family의 정책 정의, 결정·승인 정당성의 기본 경계, GOV 정책별 책임 소유와 분배"
    subjects:
      - "개발 정책 영역의 결정과 승인 정당성"
      - "개발 작업 영역의 결정과 승인 정당성"
      - "개발 통제 영역의 결정과 승인 정당성"
      - "정책 계약 소유 경계: .ptsip/contracts/policy/identity/, routing/, lifecycle/, Rules/; 신규 권한 작성 계약은 .ptsip/contracts/Responsibility-Authority/에서 관리"
      - "MPD-GOV-0004: 개발 결정권·위임 범위·승인 정당성과 README 관리"
      - "MPD-GOV-0005: 정책 식별자·제목·등록 무결성과 식별 문제의 기계적 해결"
      - "MPD-GOV-0006: 정책 생명주기·변경 허가·코딩 에이전트 기계적 제어·거버넌스 출처"
    exclusions:
      - "개별 GOV 정책이 소유하는 규칙 본문을 GOV 총칙에 중복하여 정의하지 않는다."
      - "새 정책의 책임 범위를 GOV의 총칙만으로 자동 확대하거나 재분배하지 않는다."
      - "미배정 기존 세부 규칙은 별도 사용자 결정 없이 새로운 GOV 책임으로 간주하지 않는다."
  Constraints:
    dependencies:
      - "developer/policy/GOV/MPD-GOV-0004.yaml"
      - "developer/policy/GOV/MPD-GOV-0005.yaml"
      - "developer/policy/GOV/MPD-GOV-0006.yaml"
  Evaluation:
    criteria:
      evidence:
        - "GOV의 개발 정책·작업·통제 세 영역에 대한 결정과 승인 책임 명시"
        - "결정 주체·대상·위임 범위·승인 주체에 대한 기본 정당성 경계"
        - "GOV-0004, GOV-0005, GOV-0006의 책임 분배 및 문서 참조"
        - "GOV 총칙과 개별 GOV 정책 사이의 책임 중복 또는 미결정 구분"
        - "Authority Major·Minor·Micro 분류 전면 폐기, 신규 모델 미승계 및 레거시 참조의 검증된 제거"
