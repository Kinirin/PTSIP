Policy_Identity:
  id: MPD-GOV-0004
  policy_kind: PTSIP_DEVELOPER_POLICY
  root_family: GOV
  title: "GOV — 승인된 출처의 책임과 결정 권한"
Policy_Status:
  Policy_Status_Schema_ver: "3"
  status: APPROVED.Applying
  contract: urn:ptsip:contract:policy:gov:approved-source:responsibilities
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:gov:approved-source-responsibilities"
    Rule_ver: "3"
  Definition:
    meaning: "GOV는 개발 결정권과 위임 범위의 정당성 및 정책 등록·생명주기 상태·개발 작업 승인의 출처와 적용 범위가 적법한지를 판단하고, 공식 README 원본과 번역 활성화의 기준을 규정한다."
    rationale: "작업 목표·기술 설계·실행 가능성·검증 성공은 결정권 또는 정책 승인을 대신 증명하지 못하며, README 번역 활성화와 파일명은 각각 등록부 및 문서 계약을 기준으로 한다."
  Boundary:
    scope: "개발 정책·개발 작업·개발 통제 영역의 결정과 승인, 공식 README의 원본 및 번역 관리"
    subjects:
      - "개발 결정의 권한 주체와 위임 범위"
      - "정책 등록·생명주기 상태·개발 작업 승인 출처 및 적용 범위"
      - "저장소 최상위 영어 README.md"
      - "docs/translated/index.yaml에 따른 번역 언어 활성화"
      - ".ptsip/contracts/docs/에 정의되는 번역 등록부 및 파일명 계약"
    exclusions:
      - "GOV Family 전체의 핵심 책임 총칙은 MPD-GOV-0001의 전환 범위로 둔다."
  Constraints:
    obligations:
      - id: OBLIGATION/GOV_DECISION_MANDATE
        applies_when: DEVELOPMENT_DECISION
        rule: "개발 과정의 결정에는 결정을 내릴 권한 주체와 권한의 적용 범위를 명확히 정의한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/GOV_APPROVAL_SOURCE_SCOPE
        applies_when: POLICY_REGISTRATION_LIFECYCLE_OR_WORK_APPROVAL
        rule: "정책 등록, 정책 생명주기 상태 및 개발 작업 승인에 대해 승인 출처와 적용 대상 범위가 적법한지 판단한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/README_CANONICAL_SOURCE
        applies_when: README_CONTENT_AUTHORITY
        rule: "PTSIP 공식 README의 콘텐츠 원본은 저장소 최상위의 영어 README.md이다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/README_TRANSLATION_ACTIVATION
        applies_when: TRANSLATION_ACTIVATION
        rule: "활성 번역 언어 집합은 docs/translated/index.yaml에 기록된 번역 등록 정보에 따라 결정한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/TRANSLATION_REGISTRY_CONTRACT
        applies_when: TRANSLATION_REGISTRY_VALIDATION
        rule: "docs/translated/index.yaml의 계약은 .ptsip/contracts/docs/에 명시한다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/TRANSLATION_FILENAME_CONTRACT
        applies_when: TRANSLATION_FILE_NAMING
        rule: "번역 파일명은 .ptsip/contracts/docs/에 명시된 해당 계약을 따른다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/COMPILE_SEALED_INDEPENDENT_BINDINGS
        applies_when: RESPONSIBILITY_CONDITION_PERMISSION_BINDING
        rule: "Compile-Sealed RBAC에서 책임의 목적·경계, 재사용 가능한 조건 원자, 재사용 가능한 권한 원자 및 승인된 바인딩의 정당성은 독립된 의미와 소유 경계를 가진다. 원자의 존재·등록·컴파일 성공만으로 바인딩 승인 권위를 만들지 않는다."
        Rule_state: APPROVED.provisional
      - id: OBLIGATION/RESPONSIBILITY_WIDE_PERMISSION_ACTIVATION
        applies_when: SEALED_RESPONSIBILITY_CONDITIONS_SATISFIED
        rule: "정당하게 연결된 책임의 충족 조건이 만족되면 해당 책임에 연결된 모든 승인된 권한을 일괄 활성화한다. 개별 권한별 추가 실행 승인을 요구하지 않으며 미연결·미승인 권한은 자동 활성화하지 않는다."
        Rule_state: APPROVED.provisional
      - id: PROHIBITION/OTHER_FAMILY_CANNOT_REPLACE_GOV_AUTHORITY
        rule: "사용자의 승인과 유효한 권한 모델 전환 결정 없이 다른 책임 영역이 GOV의 현재 결정 권한을 임의로 대체하거나, Compile-Sealed RBAC 전환을 구실로 미승인 권위를 생성하는 행위"
      - id: PROHIBITION/GOAL_OR_DESIGN_DOES_NOT_PROVE_MANDATE
        rule: "작업 목표나 기술 설계가 타당하다는 이유만으로 결정권자의 권한이 증명되었다고 판단하는 행위"
      - id: PROHIBITION/EXECUTION_OR_TEST_DOES_NOT_APPROVE_POLICY
        rule: "기술적 실행 가능성이나 검증 성공을 정책상 승인과 동일하게 취급하는 행위"
    dependencies:
      - "README.md"
      - "docs/translated/index.yaml"
      - ".ptsip/contracts/docs/"
  Evaluation:
    criteria:
      evidence:
        - "개발 결정의 권한 주체와 위임 범위 명시 여부"
        - "정책 등록·생명주기 상태·개발 작업 승인 출처 및 적용 범위의 정당성"
        - "저장소 최상위 영어 README.md의 원본 지정 여부"
        - "docs/translated/index.yaml의 번역 등록 및 활성 언어 집합"
        - ".ptsip/contracts/docs/에서 번역 등록부와 파일명 계약을 확인할 수 있는지"
