  Boundary:
    scope: "개발 정책·개발 작업·개발 통제 영역의 결정과 승인, 공식 README의 원본 및 번역 관리"
    subjects:
      - "개발 결정의 권한 주체와 위임 범위"
      - "2026-11-01 사용자 승인 C(계약 범위별 위탁): 기존 정책 책임의 위탁 계약은 독립적으로 확인된 기계 계약의 적용 범위에 한해서만 임시 규범적 권위를 승계하며, 계약으로 확인되지 않은 책임은 출처 및 의미를 보존하되 자동 집행 권위를 부여하지 않음"
      - "위탁 계약의 임시 적용 범위는 기존 책임의 최종 정책 소유권·승인·생명주기 상태 전이와 분리되며, 미해결 책임은 후속 정책 이전까지 보존·검토 대상으로 유지"
      - "정책 등록·생명주기 상태·개발 작업 승인 출처 및 적용 범위"
      - "저장소 최상위 영어 README.md"
      - "docs/translated/index.yaml에 따른 번역 언어 활성화"
      - ".ptsip/contracts/schemas/release/releasenote/에 정의되는 번역 등록부 및 파일명 계약"
    exclusions:
      - "GOV Family 전체의 핵심 책임 총칙은 MPD-GOV-0001의 전환 범위로 둔다."
      - "자연어 원본 보존이나 위탁 수락 사실만으로 불확정 책임 전체를 적용 가능한 정책 권위로 자동 승격하는 행위"
      - "GOV 위임 범위 판단을 근거로 CHANGE의 기존 정책 제거 조건, GOV-0006의 상태 전이, 별도 정책 승인·계획 승인 또는 미확정 세부 판정 계약을 대신 결정하는 행위"
  Evaluation:
    criteria:
      evidence:
        - "개발 결정의 권한 주체와 위임 범위 명시 여부"
        - "2026-11-01 사용자 C 승인 근거에 따라 확인된 임시 적용 범위와 미확정·보존 전용 책임이 분리되고 후속 정책의 최종 권위로 자동 승격하지 않는지 검토"
        - "정책 등록·생명주기 상태·개발 작업 승인 출처 및 적용 범위의 정당성"
        - "저장소 최상위 영어 README.md의 원본 지정 여부"
        - "docs/translated/index.yaml의 번역 등록 및 활성 언어 집합"
        - ".ptsip/contracts/schemas/release/releasenote/에서 번역 등록부와 파일명 계약을 확인할 수 있는지"
