  Boundary:
    scope: "개발 정책·개발 작업·개발 통제 영역의 결정과 승인, 공식 README의 원본 및 번역 관리"
    subjects:
      - "개발 결정의 권한 주체와 위임 범위"
      - "2026-11-01 사용자 승인 C(계약 범위별 위탁): 기존 정책 책임의 위탁 계약은 독립적으로 확인된 기계 계약의 적용 범위에 한해서만 임시 규범적 권위를 승계하며, 계약으로 확인되지 않은 책임은 출처 및 의미를 보존하되 자동 집행 권위를 부여하지 않음"
      - "위탁 계약의 임시 적용 범위는 기존 책임의 최종 정책 소유권·승인·생명주기 상태 전이와 분리되며, 미해결 책임은 후속 정책 이전까지 보존·검토 대상으로 유지"
      - "위탁 책임의 원본 출처 정당성 및 책임 소유권·승인 권위의 비승계를 GOV 경계에서 판단한다. 위탁 기록의 필드·자료형·저장 구조는 독립적인 trusteeship 기계 계약이 정의하며 GOV가 특정 위탁 필드의 존재를 의무화하지 않는다"
      - "PTSIP 공통 위탁 계약은 출처 명시 중앙 미이전 책임 저장소를 허용하지만 중앙 정책 의미 소유자·중앙 승인 주체를 생성하지 않으며, 위탁 보존 검증 PASS와 실제 정책 제거 실행 허가는 서로 별도 판단으로 유지한다"
      - "GOV는 위탁 수락 및 정책 제거의 승인 근거를 판단할 때 코딩 에이전트 의미 검토를 포함한 유효한 위탁 적격성 근거의 존재를 요구하며, 검토 누락·근거 불충분 상태를 정당한 승인 근거로 인정하지 않는다. 의미 검토 수행 방법과 위탁 데이터·증거 필드 정의는 GOV의 책임이 아니다"
      - "2026-11-01 사용자 승인 A(출처 영역 보존): 최종 인수 영역이 불명확한 책임은 원본 정책의 출처 영역이 원문·출처·미이전 상태를 유지하며, 원본 정책 파일의 제거와 해당 영역의 책임 보존 의무는 별개로 취급"
      - "출처 영역의 보존은 임시 보관 책임일 뿐 타 영역의 최종 정책 권위를 선점하지 않음; 정책 영역 전체 폐지는 별도 예외로 구분"
      - "2026-11-01 사용자 결정(정책 영역 전체 폐지 예외): 이전 정책 문서나 기계 책임 계약의 보존보다 미배치된 의미론적 책임을 자연어 기록으로만 남기는 것을 우선하며, 이 경우 기계적 자동화로 책임을 판정·배치하지 않음"
      - "폐지 영역의 자연어 의미론적 책임은 AI의 자연어 기반 의미 분석을 통해 대상 정책 영역에 배치할 책임 후보를 식별하며, 확정된 수용자·승인 근거가 없으면 신규 정책 권위로 자동 적용하지 않음"
      - "정책 등록·생명주기 상태·개발 작업 승인 출처 및 적용 범위"
      - "저장소 최상위 영어 README.md"
      - "docs/translated/index.yaml에 따른 번역 언어 활성화"
      - ".ptsip/contracts/schemas/release/releasenote/에 정의되는 번역 등록부 및 파일명 계약"
    exclusions:
      - "GOV Family 전체의 핵심 책임 총칙은 MPD-GOV-0001의 전환 범위로 둔다."
      - "자연어 원본 보존이나 위탁 수락 사실만으로 불확정 책임 전체를 적용 가능한 정책 권위로 자동 승격하는 행위"
      - "GOV 위임 범위 판단을 근거로 CHANGE의 기존 정책 제거 조건, GOV-0006의 상태 전이, 별도 정책 승인·계획 승인 또는 미확정 세부 판정 계약을 대신 결정하는 행위"
      - "서로 다른 정책 영역의 최종 책임 소유자를 자동 추정하거나 중앙 위탁 계층이 불분명한 소유권을 임의로 배분하는 행위; 인수 영역 미확정 시 출처 영역 보존을 기본으로 하되 영역 전체 폐지 예외에는 자연어 의미론적 책임 기록과 비권위적 AI 분석만 허용하고 최종 이전·권위 승격은 별도 승인 전까지 미확정"
      - "분야별 보존 방향의 승인만으로 실제 책임 위탁 검증·정책 제거·권한 전환을 완료 처리하는 행위"
      - "검토·보존 적격성의 통과나 자동화 산출물을 GOV의 정책 승인·삭제 실행 허가·임시 규범 집행 권위로 자동 승격하는 행위"
      - "정책 영역 전체 폐지 시 자연어 책임 기록을 기계 검증이 완료된 위탁 계약 또는 적용 가능한 정책 규칙으로 간주하거나 AI 분석 결과만으로 정책 영역 폐지·최종 책임 배치를 자동 승인하는 행위"
  Evaluation:
    criteria:
      evidence:
        - "개발 결정의 권한 주체와 위임 범위 명시 여부"
        - "2026-11-01 사용자 C 승인 근거에 따라 확인된 임시 적용 범위와 미확정·보존 전용 책임이 분리되고 후속 정책의 최종 권위로 자동 승격하지 않는지 검토"
        - "위탁 책임의 출처 정당성과 원래 책임 소유권을 확인하고, 정책 ID의 명칭만으로 출처 Family나 최종 책임 소유자를 추정·재배정하지 않으며, 중앙 위탁 보존과 GOV 승인 권위를 분리"
        - "코딩 에이전트 의미 검토를 포함한 위탁 수락 적격성의 유효한 근거가 확인되지 않으면 GOV 승인 또는 정책 제거의 적법 근거로 인정하지 않으며, 검토 적격성과 GOV의 승인·규범 적용 권위를 분리"
        - "2026-11-01 사용자 A 승인 근거에 따라 최종 인수 영역 미확정 책임의 출처 영역 보존과 최종 인수·권위 승격의 미확정 상태가 구분되는지 확인"
        - "2026-11-01 정책 영역 전체 폐지 예외에서 자연어 의미 책임 기록·AI 의미 분석과 기계 자동 집행·규범적 책임 배치가 명확히 구별되는지 검토"
        - "정책 등록·생명주기 상태·개발 작업 승인 출처 및 적용 범위의 정당성"
        - "저장소 최상위 영어 README.md의 원본 지정 여부"
        - "docs/translated/index.yaml의 번역 등록 및 활성 언어 집합"
        - ".ptsip/contracts/schemas/release/releasenote/에서 번역 등록부와 파일명 계약을 확인할 수 있는지"
