schema_version: ptsip-developer-root-family-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: GOV
policy:
  id: MPD-GOV-0002
  title: GOV authority (APPROVED source responsibilities)
  status: APPROVED
  version: '1.0'
authority_subject:
  id: DEV_DECISION_LEGITIMACY
  statement: 개발 정책, 개발 작업 및 개발 control plane에서 누가 어떤 subject에 대해 결정을 내리고 승인할 수 있는지와
    그 결정의 정당성을 소유한다.
exclusive_kernel:
- DEV_DECISION_OWNER_AND_MANDATE
- DEV_APPROVAL_AND_LIFECYCLE_LEGITIMACY
rules:
  family_definition:
    kernel_definitions:
    - id: DEV_DECISION_OWNER_AND_MANDATE
      statement: 개발 결정의 정확한 authority subject, 소유자, 위임 범위와 승인 주체를 명시하고 무권한 결정을 배제한다.
      non_substitutability: INTENT의 작업 목표나 ARCH의 기술 설계가 결정권자의 위임 범위를 대신 만들 수 없다.
    - id: DEV_APPROVAL_AND_LIFECYCLE_LEGITIMACY
      statement: 정책 등록, 정책 lifecycle 상태 및 개발 작업 승인의 출처와 대상 범위가 적법한지를 정한다.
      non_substitutability: CTRL의 실행 가능 판정이나 테스트 PASS가 명시되지 않은 ACTIVE/DRAFT 상태 승인을
        만들어 내지 못한다.
    source_scope:
    - MPD-0016
  unit_mpd_0016_4194ac6b92bb:
    canonical_readme:
      path: README.md
      language: en
      authority: CANONICAL_CONTENT_SOURCE
    translation_registry:
      path: docs/translated/index.yaml
      role: TRANSLATION_ACTIVATION_REGISTRY
      registered_languages_define_active_translation_set: true
      workflow_hard_coded_language_list_is_activation_authority: false
      implicit_language_activation: FORBIDDEN
    current_translation_scope:
      active_languages:
      - ko
      not_activated:
      - ja
      - zh-CN
    translation_projection:
      root: docs/translated/
      filename_pattern: README.<language-tag>.md
      canonical_authority: README.md
      translation_is_independent_normative_authority: false
      translation_may_add_independent_normative_meaning: false
      conflict_resolution: CANONICAL_README_WINS
