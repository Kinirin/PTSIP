schema_version: ptsip-developer-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY

policy:
  id: MPD-0010
  title: Canonical Semantic Contract Extension and Inference Cost Policy
  status: ACTIVE

rules:
  ptsip_design_priority:
    precedence_order:
      - CODING_AGENT_INFERENCE_COST_MINIMIZATION
      - INDEPENDENT_EXTENSION_WITHOUT_UNRELATED_DEVELOPER_DISRUPTION
      - USER_MACHINE_READABLE_POLICY_AUTOMATION
    coding_agent_inference_cost_minimization:
      objective: MINIMIZE_REPEATED_REASONING_CONTEXT_LOOKUP_AND_CREDIT_COST_FOR_CODING_AGENTS
      rules:
        - PREFER_MACHINE_EXPLICIT_DIRECTLY_RESOLVABLE_CONTRACTS_WHEN_THEY_REDUCE_REPEATED_INFERENCE
        - ALLOW_BOUNDED_REFERENCE_DUPLICATION_WHEN_IT_REDUCES_AGENT_CONTEXT_OR_LOOKUP_COST
        - DO_NOT_REDUCE_MACHINE_CLARITY_MERELY_TO_MINIMIZE_FIELD_COUNT
    independent_extension_without_unrelated_developer_disruption:
      objective: ALLOW_INDEPENDENT_EXTENSION_WHEN_PTSIP_CORE_DOES_NOT_NATIVELY_SUPPORT_REQUIRED_SEMANTICS
      rules:
        - EXTENSION_MUST_USE_DISTINCT_IDENTITY_AND_MUST_NOT_IMPERSONATE_OFFICIAL_CORE_SEMANTICS
        - EXTENSION_UNSUPPORTED_BY_A_CONSUMER_MUST_BE_REPORTED_EXPLICITLY_WITHOUT_SILENT_CORE_MAPPING
        - UNSUPPORTED_EXTENSION_CAPABILITY_MUST_BE_SCOPED_TO_DEPENDENT_OPERATIONS_OR_VALIDATION
        - UNSUPPORTED_EXTENSION_CAPABILITY_MUST_NOT_BLOCK_UNRELATED_DEVELOPMENT
        - EXTENSION_OWNER_RETAINS_SEMANTIC_CONFORMANCE_MAINTENANCE_REVALIDATION_MIGRATION_AND_COMPATIBILITY_RESPONSIBILITY
    user_machine_readable_policy_automation:
      objective: ENABLE_USERS_TO_EXPRESS_PROJECT_OR_PERSONAL_POLICY_AS_MACHINE_READABLE_CONTRACTS_AND_BUILD_LOCAL_AUTOMATED_REASONING
      rules:
        - PREFER_DECLARATIVE_MACHINE_READABLE_CONTRACT_SURFACES_OVER_REQUIRED_CUSTOM_CORE_CODE
        - USER_DEFINED_POLICY_MAY_USE_REGISTERED_EXTENSION_IDENTITIES_AND_INTERFACES
        - USER_POLICY_AUTOMATION_MUST_NOT_SILENTLY_GAIN_PROJECT_OR_CORE_AUTHORITY
        - USER_POLICY_INTERPRETATION_MUST_REMAIN_EXACT_BOUNDED_AND_FAIL_CLOSED_WHEN_REQUIRED_SEMANTICS_CANNOT_BE_RESOLVED

  agent_instruction_entry_taxonomy_trial:
    decision: APPROVED
    stage: REPOSITORY_TRIAL
    objective: REDUCE_CODING_AGENT_ENTRY_INFERENCE_WITH_LOW_DIFFICULTY_MACHINE_ROUTING
    distribution: FORBIDDEN
    product_integration: NOT_AUTHORIZED
    promotion_to_product_requires_separate_evidence_and_approval: true
    repository_management_surface:
      canonical_root: .agent/
      purpose: REPOSITORY_LOCAL_AGENT_INSTRUCTION_MANAGEMENT
      developer_tool_implementation_root: developer/automation/
      developer_tool_root_is_management_surface: false
      product_distribution: FORBIDDEN
    level_1_bootstrap:
      source: AGENTS.md
      existing_agent_surface_required: false
      legacy_materialization_required: false
      source_mutation_during_bootstrap: FORBIDDEN
      output_index: .agent/index.yaml
      output_pass_stage: .agent/stages/level1.json
      output_unresolved_stage: .agent/unresolved/level1.json
      registry_required: false
      provenance_markdown_required: false
      source_change_after_bootstrap_marks_stage_stale: true
    managed_level_1_transition:
      activation: EXPLICIT
      activation_precondition: CURRENT_LEVEL_1_STAGE
      level_1_pass_destination: .agent/stages/level1.json
      level_1_unresolved_destination: .agent/unresolved/level1.json
      registry_role_after_activation: IDENTITY_AND_ROUTING_METADATA_ONLY
      natural_language_payload_in_registry_after_activation: FORBIDDEN
      provenance_markdown_as_reasoning_input: FORBIDDEN
      unresolved_state_after_activation: UNRESOLVED
      unresolved_must_remain_unclassified: true
      root_agents_role_after_activation: ENTRY_BOOTSTRAP_ONLY
      level_2_during_transition: FORBIDDEN
    progressive_reasoning_pipeline:
      ordered_levels:
        - LEVEL_1
        - LEVEL_2
        - LEVEL_3
      stage_contract:
        next_level_input: CURRENT_LEVEL_PASS_SUBSET_ONLY
        next_level_payload: PASS_HEADER_PLUS_MACHINE_FIELDS_PLUS_REMAINING_NATURAL_RESIDUAL
        rerun_previous_passed_level: FORBIDDEN
        machine_resolved_fragments_must_not_remain_in_next_natural_reasoning_input: true
        unresolved_remains_natural_language_at_current_level: true
        unresolved_is_direct_next_level_candidate: false
        unresolved_may_transition_to_pass_when_current_level_becomes_exactly_classifiable: true
        pass_transition_immediately_creates_next_level_candidate: true
        unresolved_blocks_other_passed_atoms: false
        current_level_unresolved_zero_required_for_next_level: false
        next_level_candidate_set_is_dynamic: true
      runtime_entry:
        progression_unit: ATOM
        consume_deepest_proven_machine_stage_per_atom: true
        consume_only_remaining_natural_residual: true
        current_level_unresolved_is_retained_until_same_level_pass_transition: true
        unresolved_pass_transition_does_not_skip_current_level: true
        provenance_or_history_as_reasoning_input: FORBIDDEN
      partial_mechanization:
        allowed: true
        full_mechanization_required: false
        machine_constants_preferred_when_exact_semantics_are_available: true
        natural_residual_allowed_only_for_semantics_not_yet_mechanized: true
      unresolved_reassessment:
        source: .agent/unresolved/level1.json
        allowed_triggers:
          - CLASSIFIER_CAPABILITY_EXPANSION
          - TAXONOMY_EXTENSION
          - EXACT_RESPONSIBILITY_BOUNDARY_BECOMES_RESOLVABLE
        reassess_only_at_current_level: true
        positive_result_transition: UNRESOLVED_TO_PASS
        negative_result_behavior: KEEP_UNRESOLVED
        forced_assignment_to_reduce_unresolved_count: FORBIDDEN
      taxonomy_evolution:
        unresolved_may_persist_without_forced_classification: true
        new_level_1_category_may_be_added_when_distinct_semantics_are_evidenced: true
        taxonomy_extension_may_re_evaluate_unresolved_atoms_only: true
        newly_passed_unresolved_atom_becomes_next_level_candidate: true
        adding_category_does_not_force_existing_pass_reclassification: true
        existing_category_semantic_change_requires_explicit_revalidation: true
    level_1_entry_resolution:
      routing_stage: DEEPEST_ACTIVE_PROGRESSIVE_STAGE
      default_routes:
        READ:
          - APPLICABILITY
          - RULE
          - ACTION
        MODIFY:
          - APPLICABILITY
          - RULE
          - ACTION
        PLAN:
          - APPLICABILITY
          - RULE
          - ACTION
        VERIFY:
          - APPLICABILITY
          - RULE
          - ACTION
          - EVIDENCE
        RELEASE:
          - APPLICABILITY
          - RULE
          - ACTION
          - EVIDENCE
      explicit_widen_allowed:
        - OTHER
        - EVIDENCE
      unresolved_policy: ALWAYS_INCLUDE_UNTIL_CLASSIFIED
      scope_filtering: NOT_AVAILABLE_AT_LEVEL_1
      level_2_used: false
      preserve_registry_order: true
      deduplicate_by_atom_id: true
    level_1_vocabulary:
      - APPLICABILITY
      - RULE
      - ACTION
      - EVIDENCE
      - OTHER
    level_1_rules:
      - LEVEL_1_MUST_USE_LOW_DIFFICULTY_MACHINE_CLASSIFICATION_ONLY
      - MULTI_LABEL_CLASSIFICATION_IS_ALLOWED
      - CLASSIFY_ONLY_WITH_POSITIVE_MACHINE_EVIDENCE
      - OTHER_MUST_NOT_BE_USED_AS_A_CLASSIFICATION_FAILURE_FALLBACK
      - UNRESOLVED_IS_A_ROUTING_STATE_NOT_A_NAMESPACE
      - EXPLICIT_PARENT_SEMANTICS_MAY_BE_INHERITED_BY_CHILD_INSTRUCTION_ATOMS
      - DEEPER_CLASSIFICATION_MAY_STOP_AT_THE_DEEPEST_PROVEN_PARENT
    level_2_vocabulary:
      APPLICABILITY:
        - PATH
        - TASK
        - ENVIRONMENT
        - VERSION
        - VCS_CONTEXT
      RULE:
        - MUTATION
        - DEPENDENCY
        - COMPATIBILITY
        - STYLE
        - SECURITY
        - RESOURCE
      ACTION:
        - COMMAND
        - READ
        - WRITE
        - GENERATE
        - BUILD
        - INSTALL
        - PUBLISH
      EVIDENCE:
        - TEST
        - BUILD_RESULT
        - STATIC_CHECK
        - ARTIFACT
        - REVIEW
        - STATUS
      OTHER:
        - CONTEXT
        - GOAL
    other_semantics:
      context_and_goal_share_level_1_parent: true
      goal_machine_classification_requires_explicit_purpose_relation: true
      ambiguous_context_or_goal_may_stop_at_other: true
    unresolved_is_namespace: false
    unresolved_behavior:
      preserve_as_routing_state: true
      must_not_be_silently_coerced_to_other: true
      ai_or_person_escalation_only_when_required_by_current_operation: true
    source_and_authority:
      pre_activation_source_instruction_text_is_authoritative_for_its_own_instruction_semantics: true
      post_activation_level_1_pass_authority: ".agent/stages/level1.json#pass[]"
      post_activation_level_1_unresolved_authority: ".agent/unresolved/level1.json#items[]"
      registry_is_instruction_authority_after_activation: false
      activated_level_1_labels_are_routing_metadata: true
      machine_fields_and_natural_residual_jointly_preserve_remaining_semantics: true
      classifier_must_not_rewrite_unresolved_natural_language: true
      ai_classification_does_not_create_policy_authority: true

  normative_contract_architecture:
    language_runtime_os_tool_neutral: true
    canonical_layers:
      - CANONICAL_IDENTITY_REGISTRY
      - CANONICAL_SCHEMA
      - CANONICAL_INVARIANTS
      - GENERATED_BINDINGS
    registry_does_not_define_object_shape: true
    schema_does_not_duplicate_identity_grammar: true
    invariants_do_not_duplicate_registry_or_schema_definitions: true
    generated_bindings_must_not_add_change_or_remove_normative_semantics: true

  semantic_inference_cost:
    objective: REDUCE_REPEATED_SEMANTIC_INFERENCE_AND_AMBIGUITY_BEFORE_MINIMIZING_IMPLEMENTATION_TIME
    absolute_zero_inference_required: false
    machine_explicit_reference_duplication_allowed_when_it_reduces_semantic_inference_cost: true
    machine_explicit_duplication_does_not_create_authority_confidence_priority_or_ranking: true

  evidence_driven_contract_refinement:
    strategy: EVIDENCE_DRIVEN_CONTRACT_REFINEMENT
    refinement_signals:
      - REPEATED_SEMANTIC_INFERENCE
      - REPEATED_HUMAN_INTERVENTION
      - RECURRING_CUSTOM_WORKAROUNDS
      - REPEATED_EXTENSION_PATTERNS
      - ACCUMULATED_USER_FEEDBACK_OR_OPERATIONAL_DATA
    refinement_is_not_an_end_in_itself: true
    practical_stop_allowed_when_further_subdivision_has_no_worthwhile_efficiency_or_clarity_benefit: true
    stop_is_permanent_closure: false
    refinement_may_reopen_when_new_evidence_appears: true

  identity_and_resolution:
    canonical_identity_default: OPAQUE_IMMUTABLE_EXACTLY_RESOLVABLE
    same_identity_same_normative_semantics: true
    semantic_change_requires_new_identity: true
    registry_resolution_budget:
      runtime_lookup: EXACT_BOUNDED
      full_registry_scan: FORBIDDEN
      semantic_similarity_search: FORBIDDEN
      history_or_git_traversal_for_runtime_semantics: FORBIDDEN
      documentation_lookup_for_runtime_semantics: FORBIDDEN
      interpretive_fallback_candidate_selection: FORBIDDEN
    unresolved_unsupported_or_interface_mismatch: FAIL_CLOSED

  canonical_and_runtime_projection:
    principle: SPARSE_CANONICAL_DENSE_RUNTIME
    canonical_source_should_omit_semantically_redundant_empty_optional_structures: true
    canonical_source_should_have_one_representation_for_one_semantic_state_where_practical: true
    load_or_compile_may_normalize_missing_optional_structures_to_dense_empty_runtime_forms: true
    generated_or_compiled_runtime_projection_is_not_authority: true
    runtime_should_not_repeat_registry_traversal_when_a_reproducible_generated_projection_can_be_used: true

  extension_compatibility:
    extension_freedom: ALLOWED
    extension_freedom_does_not_imply_core_identity_reuse: true
    extension_freedom_does_not_imply_backward_or_forward_compatibility_entitlement: true
    official_core_semantics_immutable_within_bound_canonical_specification_revision: true
    modified_official_core_behavior_requires_distinct_extension_identity: true
    absent_explicit_compatibility_must_not_be_interpreted_as_compatibility: true
    ptsip_may_provide_machine_readable_compatibility_revalidation_or_migration_assistance: true
    extension_owner_responsibilities:
      - SEMANTIC_DEFINITION
      - IMPLEMENTATION_COST
      - INFERENCE_COST
      - MAINTENANCE
      - CONFORMANCE
      - REVALIDATION_AFTER_SPEC_OR_CAPABILITY_CHANGE
      - MIGRATION_RESPONSE
      - COMPATIBILITY_CONFIRMATION
    official_promotion_of_community_or_custom_semantics_requires_new_official_identity: true
    feedback_usage_or_popularity_is_refinement_evidence_not_normative_authority: true

  canonical_atomic_extension:
    official_core_atomic_representations:
      - SCALAR.BOOLEAN
      - SCALAR.INTEGER
      - SCALAR.DECIMAL
      - SCALAR.TEXT
      - REFERENCE.IDENTITY
    extension_inline_allowed: true
    extension_modes:
      - CORE_BACKED
      - CUSTOM_ATOMIC
    core_backed_reuses_official_atomic_representation_semantics: true
    custom_atomic_may_define_new_atomic_representation_semantics: true
    validation_and_canonicalization_are_separate_responsibilities: true
    custom_atomic_representation_contract_current_fields:
      - representation_contract_id
      - validation_ref
      - canonicalization_ref
      - canonical_serialization_ref
      - conformance_vectors_ref
    exact_registry_topology_for_component_refs_fixed_by_this_policy: false
    required_ref_interfaces:
      validation_ref: VALIDATION
      canonicalization_ref: CANONICALIZATION
      canonical_serialization_ref: CANONICAL_SERIALIZATION
      conformance_vectors_ref: CONFORMANCE_VECTOR_SET
    ref_common_rules:
      - OPAQUE_IMMUTABLE_IDENTITY
      - EXACT_RESOLUTION
      - EXPECTED_INTERFACE_MATCH
      - FAIL_CLOSED_ON_UNRESOLVED_UNSUPPORTED_OR_MISMATCH
      - NO_UNDECLARED_COMPATIBILITY_INFERENCE

  evidence_kind_extension:
    official_core_closed_vocabulary:
      - EVIDENCE_KIND.OBSERVED
      - EVIDENCE_KIND.DECLARED
      - EVIDENCE_KIND.DERIVED
      - EVIDENCE_KIND.EXPLICIT_HUMAN_INPUT
    selector_forms:
      - EXACT
      - PATTERN
    official_core_kind_selector: EXACT_ONLY
    pattern_selector:
      allowed_scope: EXTENSION_COMMUNITY_OR_USER_NAMESPACE
      matching: TERMINAL_NAMESPACE_PREFIX_ONLY
      global_wildcard: FORBIDDEN
      regex: FORBIDDEN
      arbitrary_glob: FORBIDDEN
      semantic_similarity_matching: FORBIDDEN
      registration_required_before_match_can_be_accepted: true
      unknown_pattern_grammar: FAIL_CLOSED
      compatibility_guarantee: false
      maintenance_and_revalidation_owner: EXTENSION_OWNER

  deterministic_external_state_boundary:
    current_time_dependency_in_normative_semantics: FORBIDDEN
    randomness_dependency_in_normative_semantics: FORBIDDEN
    direct_network_dependency_in_normative_semantics: FORBIDDEN
    mutable_external_state_dependency_in_normative_semantics: FORBIDDEN
    changing_external_state_must_be_materialized_as_evidence_before_normative_consumption: true

relations:
  supersedes: []
  amends: []
  extends:
    - policy: MPD-0001
      scope: DEVELOPER_CANONICAL_SEMANTIC_CONTRACT_AND_EXTENSION_BOUNDARY
  depends_on: []
