  title: "지정된 계약에 따른 정책 생성, 기본 계약 구조 지원 및 검증기 확장 권고"
  Definition:
    - id: R-ID-16C8255C833446A4A0BAC7086AC52F89
      rule: CHECK-CURRENT-CONTR
    - id: R-ID-4BE43BF42A34442D943DF7CD6A2C1738
      rule: CHECK-POLICY-SHAPE
    - id: R-ID-9C4AF8F043834F26968ED4B01F84C2F1
      rule: CHECK-LEGACY-REUSE
    - id: R-ID-2A49E0D1888945B5AA82A0792BE65E8B
      rule: CHECK-COVERAGE-EVID
    - id: R-ID-8AA61B6798C742F7B499BA519E1720BC
      rule: REPORT-MISSING-CONTR
    - id: R-ID-C2B27612F8AB4EA8B984056775169A74
      rule: NO-AUTHORITY-GRANT
  Boundary:
    scope: "저장소 환경의 검증을 위한 기계적 계약 구조의 생성 지원, 지정된 계약에 따른 정책 문서 생성 및 저장소 검증기 확장 지원"
    subjects:
      - "이 정책은 저장소 환경의 검증을 위한 기계적 계약 구조를 생성하도록 하고, 그 구조에 따른 정책 생성과 검증을 지원한다."
      - "모든 정책 문서는 생성할 때 반드시 지정된 기계적 계약 구조에 따라 생성되어야 한다."
      - "검증 대상 정책 문서에 적용되는 유효한 기계 계약의 정확한 식별과 참조 적합성"
      - "정책 문서가 해당 계약의 구조와 검증 조건을 만족하는지에 관한 증거 판단"
      - "사용자 저장소 환경에 기본적인 계약 구조가 존재하지 않는 경우 PTSIP는 필요한 계약 구조의 생성을 지원할 수 있다."
      - "PTSIP가 저장소 환경에 설치되어 있고 비규범적 정책 등으로 기존 검증 엔진에서 정책을 검증하기 어려운 경우, 검증기의 확장·생성을 지원할 수 있다."
      - "필요 계약이 없거나 검증할 수 없는 경우 검증 공백을 명시하고 근거 없는 PASS를 금지"
      - "검증 결과가 실제 검증 대상, 계약 버전 및 저장소 스냅샷과 일치하는지 판단"
    exclusions:
      - "과거 정책 문서의 본문을 직접 읽거나 폐기된 원본의 구조를 변형하여 정책 문서를 생성하는 행위를 금지한다."
      - "GOV의 정책 결정·승인 권한 및 계약 소유 경계를 인수하지 않는다."
      - "ARCH와 각 Root Family의 문서 구조·스키마 정의 권한을 인수하지 않는다."
      - "CNTR·INFO의 인터페이스 및 데이터 의미를 임의로 재정의하지 않는다."
      - "CTRL의 정책 적용·실행 허가 또는 RECORD의 증거 보존 책임을 인수하지 않는다."
      - "VPMS 전용 사례·실행기·결과 계약과 퇴역 정책의 권한을 상속하지 않는다."
  Evaluation:
    criteria:
      evidence:
        - "정책 생성 시 사용한 지정 기계 계약의 식별자·버전·출처와 생성된 정책 문서의 대응"
        - "검증 대상에 적용되는 현재 유효 계약의 등록 식별자·버전·출처"
        - "정책 문서와 계약 구조의 필수 필드·형식·참조에 대한 검증 결과"
        - "검증 범위, 미실행 항목, 누락 계약 및 검증 불가능 영역에 대한 명시적 보고"
        - "과거 정책 본문 또는 폐기된 원본 구조를 정책 생성의 근거로 사용하지 않았다는 확인"
        - "기본 계약 구조 부재에 따른 생성 지원 여부와 기존 검증 엔진의 검증 공백에 따른 확장·생성 지원 조건"
        - "검증 대상의 정확한 revision 및 결과와의 연결"
    method:
