schema_version: ptsip-developer-root-family-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: ASSURE
policy:
  id: MPD-ASSURE-0001
  title: ASSURE authority (ACTIVE source responsibilities)
  status: ACTIVE
  version: '3.2'
authority_subject:
  id: DEV_VERIFICATION_EVIDENCE_JUDGMENT
  statement: Project Profile에 선언된 저장소 개발 테스트의 coverage, 증거 적합성 및 정확한 source snapshot의
    검증 결과 판정을 소유한다. 기존 ACTIVE 필수 검증 의무는 별도 권위 이전 완료 전까지 보존한다.
exclusive_kernel:
- DEV_VERIFICATION_COVERAGE_AND_ADMISSIBILITY
- DEV_EXACT_SOURCE_VERIFICATION_OUTCOME
rules:
  family_definition:
    kernel_definitions:
    - id: DEV_VERIFICATION_COVERAGE_AND_ADMISSIBILITY
      statement: 기계적으로 선택된 Test Mode와 규범상 필요한 검증 항목의 coverage 및 증거의 admissibility를
        평가한다.
      non_substitutability: CTRL의 gate 목록이나 RECORD의 로그 존재만으로 필요한 검증 coverage와 증거 적합성이
        충족되지 않는다.
    - id: DEV_EXACT_SOURCE_VERIFICATION_OUTCOME
      statement: 검증 판정을 실행한 source SHA, 환경 및 Artifact snapshot에 결합하고 functional PASS와
        PTSIP conformance 및 VPMS purpose를 구별한다.
      non_substitutability: RECORD가 후속 documentation commit을 보존하거나 GOV가 release를 승인해도
        미검증 SHA를 PASS로 만들 수 없다.
    source_scope:
    - MPD-0011
    - MPD-0012
    - MPD-SPEC-0011
    - MPD-VERI-0002
    - MPD-VERI-0003
    - MPD-VERI-0004
    - MPD-VERI-0005
  developer_test_verification_boundary:
    decision: KEEP_LATEST
    scope: REPOSITORY_DEVELOPER_TEST_COVERAGE_AND_EVIDENCE_JUDGMENT
    test_source:
      repository_test_root: src/tests
      selected_by: DECLARED_PROJECT_PROFILE_VERIFICATION_RESPONSIBILITY
      class_or_path_alone_confers_normative_ownership: false
      test_implementation_may_create_normative_semantics: false
    owns:
    - REQUIRED_TEST_COVERAGE_ADMISSIBILITY
    - REQUIRED_VS_EXECUTED_VERIFICATION_EVIDENCE_JUDGMENT
    - EXPECTED_VS_OBSERVED_VERIFICATION_JUDGMENT
    - EXACT_SOURCE_SNAPSHOT_VERIFICATION_OUTCOME
    does_not_own:
    - TEST_MODE_REGISTRY_SHAPE_AND_MODE_MEMBERSHIP
    - TEST_MODE_EXECUTION_TARGET_DECLARATION
    - TEST_MODE_RESOLVER_AND_RUNNER_IMPLEMENTATION
    - GITHUB_ACTIONS_WORKFLOW_TOPOLOGY
    - WORKFLOW_DISPATCH_SELECTION_UI
    - RELEASE_PUBLICATION_AUTHORIZATION
    adjacent_authorities:
      verification_component_ownership: DECLARED_PROJECT_PROFILE
      mode_execution_declarations: REPOSITORY_TEST_MODE_REGISTRY
      workflow_executor_boundary: MPD-ARCH-0002
      release_and_transition_gate_eligibility: MPD-CTRL-0001
    preserved_existing_required_verification:
      source_units:
      - unit_mpd_veri_0002_260ced325054
      - unit_mpd_veri_0003_c4b59fc85667
      - unit_mpd_veri_0004_f699ce5ccfa4
      - unit_mpd_veri_0004_2f347420dfff
      - unit_mpd_veri_0005_b5e5149c8490
      - unit_mpd_0011_1491da54b643
      coverage_and_required_checks_remain_binding: true
      local_remote_release_verification_remains_binding: true
      source_sha_evidence_and_result_semantics_remain_binding: true
      ownership_transfer_state: NOT_AUTHORIZED
      reassignment_requires_explicit_owner_and_policy_transition: true
      deletion_or_weakening_before_verified_transfer: FORBIDDEN
      historical_evidence_records_remain_unchanged: true
    plan_authority:
      execution_adapter_and_migration_details: PLAN
      plan_may_redefine_required_verification_or_authority: false
  approved_required_verification_responsibility_split:
    decision: C_RESPONSIBILITY_BY_RESPONSIBILITY_SPLIT
    decision_authority: PROJECT_OWNER_EXPLICIT
    source_policy_scope:
    - MPD-VERI-0002
    - MPD-VERI-0003
    - MPD-VERI-0004
    - MPD-VERI-0005
    transition_state: APPROVED_DIRECTION_TARGET_MAPPING_UNRESOLVED
    entries:
      MPD-VERI-0002:
        retain_in_assure:
        - ISOLATED_FIXTURE_VERIFICATION_ADMISSIBILITY
        split_topics:
        - ISOLATED_FIXTURE_SCOPE_VS_MUTATION_PROMOTION_ELIGIBILITY
        unresolved_authority_decisions:
        - MUTATION_PROMOTION_ELIGIBILITY_SEMANTIC_OWNER
      MPD-VERI-0003:
        retain_in_assure:
