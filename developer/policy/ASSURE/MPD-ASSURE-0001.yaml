        unresolved_authority_decisions:
        - OBSERVATION_ASSEMBLY_VS_RECORD_PROVENANCE_BOUNDARY
        - EXACT_SOURCE_UNIT_DESTINATION_BINDING
    existing_policy_boundary_references:
      verification_evidence_and_judgment: MPD-ASSURE-0001
      execution_eligibility_gates: MPD-CTRL-0001
      project_profile_change_continuity: MPD-CHANGE-0001
      component_and_test_mode_structure: MPD-ARCH-0002
      execution_provenance_and_history: MPD-RECORD-0001
      automation_result_interfaces: MPD-CNTR-0001
    boundary_reference_is_source_unit_transfer_authority: false
    invariants:
      all_four_approved_decisions_are_independent: true
      unresolved_transfer_may_be_implicitly_inferred: false
      source_units_remain_binding_until_verified_transfer: true
      required_checks_cannot_be_omitted: true
      existing_fail_closed_semantics_preserved: true
