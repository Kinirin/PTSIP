schema_version: ptsip-developer-policy/v1
policy_class: PTSIP_BOUND_POLICY

policy:
  id: MPD-0018
  version: "1.0"
  title: Developer Policy Ownership and Cross-Subsystem Boundary Classification
  status: APPROVED

rules:
  developer_policy_ownership_classification:
    responsibility: POLICY_OWNERSHIP_CLASSIFICATION_AND_CROSS_SUBSYSTEM_BOUNDARY
    canonical_owner_discriminator: policy_class

    class_vocabulary:
      PTSIP_DEVELOPER_POLICY:
        owner: PTSIP_DEVELOPER_GOVERNANCE
        role: PTSIP_INTERNAL_DEVELOPER_POLICY
      VPMS_DEVELOPER_POLICY:
        owner: VPMS_DEVELOPER_GOVERNANCE
        role: VPMS_INTERNAL_DEVELOPER_POLICY
      PTSIP_BOUND_POLICY:
        owner: PTSIP_BOUNDARY_GOVERNANCE
        role: CROSS_SUBSYSTEM_RESPONSIBILITY_AND_INTERFACE_BOUNDARY
        counterpart_specific_class_name_required: false
        future_non_vpms_boundary_use_allowed: true

    storage_model:
      shared_root: developer/policy
      owner_specific_directory_required: false
      repository_relocation_required_for_class_extension: false
      physical_directory_implies_policy_owner: false
      policy_id_implies_policy_owner: false
      schema_version_prefix_implies_policy_owner: false

    boundary_policy_contract:
      counterpart_must_be_declared_in_policy_rules: true
      boundary_policy_owns_participant_internal_semantics: false
      boundary_policy_may_define:
        - RESPONSIBILITY_HANDOFF
        - INTERFACE_CONTRACT
        - AUTHORITY_FIREWALL
        - MIGRATION_GATE

    validation:
      missing_policy_class: FAIL_CLOSED
      unknown_policy_class: FAIL_CLOSED
      exact_class_identity_required: true
      directory_based_owner_inference: FORBIDDEN

  responsibility_boundary:
    owns:
      - DEVELOPER_POLICY_OWNER_DISCRIMINATION
      - PTSIP_BOUND_POLICY_CLASS_SEMANTICS
      - SHARED_POLICY_ROOT_STORAGE_RULE
    does_not_own:
      - PTSIP_RUNTIME_SEMANTICS
      - VPMS_RUNTIME_SEMANTICS
      - SUBSYSTEM_INTERNAL_POLICY_CONTENT
      - SUPPORT_FEATURE_POLICY_SEMANTICS

transition:
  target_status: ACTIVE
  state: PENDING
  requirements:
    - id: TR-001
      type: POLICY_SCHEMA
      state: OPEN
      refs:
        - developer/policy/schemas/management-policy.schema.json
      next_action:
        action: VALIDATE_POLICY_CLASS_VOCABULARY
        execution: PARALLEL_ALLOWED
        target_refs:
          - developer/policy/schemas/management-policy.schema.json
          - developer/policy/MPD-0018.yaml
        completion_check: POLICY_CLASS_VOCABULARY_VALID

    - id: TR-002
      type: CORPUS_COMPATIBILITY
      state: OPEN
      refs:
        - developer/policy/index.yaml
        - developer/policy/registries/authority-subject-registry.yaml
      next_action:
        action: VALIDATE_MIXED_POLICY_CLASS_CORPUS
        execution: PARALLEL_ALLOWED
        target_refs:
          - developer/policy
        completion_check: MIXED_POLICY_CLASS_CORPUS_VALID

relations:
  supersedes: []
  amends: []
  extends: []
  depends_on:
    - policy: MPD-0001
      scope: EXISTING_DEVELOPER_AND_SUPPORT_POLICY_BOUNDARY
