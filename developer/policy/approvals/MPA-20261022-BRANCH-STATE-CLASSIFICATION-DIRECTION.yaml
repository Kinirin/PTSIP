schema_version: ptsip-policy-approval-provenance/v1
policy_class: PTSIP_DEVELOPER_POLICY
approval:
  approval_id: MPA-20261022-BRANCH-STATE-CLASSIFICATION-DIRECTION
  decision: APPROVED
  source_kind: PROJECT_OWNER_DIRECT_INSTRUCTION
  decision_source: USER_EXPLICIT
  source_reference: >-
    The project owner selected option C: determine branch synchronization
    eligibility from an approved, machine-readable branch-state contract rather
    than inferring ACTIVE from branch existence, name pattern, or recency.
    The branch creation naming-pattern contract must be addressed early, before
    subordinate branch-state synchronization behavior is specified. Naming,
    creation authorization, lifecycle state, and synchronization eligibility
    are separate policy decisions. Previously implemented branch-name guards
    and retired Developer GOV records are evidence only, not automatically
    inherited successor authority. This direction approves neither a new
    branch-name grammar nor implicit creation, implementation, or a new GOV
    schema or validator.
  approval_scope: FINAL_POLICY
  target_status: APPROVED
  policy_content_review_scope: DIRECTION
  implementation_authorized: false
  branch_creation_authorized: false
  recorded_at: '2026-10-22'
