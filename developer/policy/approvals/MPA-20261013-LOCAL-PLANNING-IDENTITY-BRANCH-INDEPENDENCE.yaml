  decision_source: USER_EXPLICIT
  source_reference: >-
    사용자는 작업 계획을 브랜치와 독립적인 논리적 객체로 취급하고 브랜치는
    그 계획을 실행하는 수단이라는 상위 방향에 동의하였다. 단, 이 계획 생성 정책은
    사용자 자신의 저장소 환경에서만 사용하는 로컬 Developer Planning 정책이다.
    PTSIP 전체 또는 도입한 소비자 저장소에 강제할 범용 규칙으로 확장하지 않는다.
    기존 경로 규칙 및 미결정 생성 계약은 별도 결정 대상이다.
