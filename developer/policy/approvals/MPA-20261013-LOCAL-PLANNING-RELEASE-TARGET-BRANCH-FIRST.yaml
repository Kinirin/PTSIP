  approval_id: MPA-20261013-LOCAL-PLANNING-RELEASE-TARGET-BRANCH-FIRST
  decision: APPROVED
  source_kind: PROJECT_OWNER_DIRECT_INSTRUCTION
  decision_source: USER_EXPLICIT
  source_reference: >-
    사용자는 Developer Planning 대상 릴리스 결정의 B 방향을 승인했다.
    유효한 버전 개발 브랜치를 우선하고, 버전 브랜치가 없는 경우에는
    사용자 승인에 근거한 정확한 릴리스 정보만 사용한다. 누락, 모호성
    또는 승인 증거 부족 시 대상 릴리스 결정을 차단한다.
    기존 정책과 충돌을 확인한 뒤 현재 활성 HEAD에 반영하도록 지시했다.
    이번 승인에는 임의의 fallback 원본 선정, 계획 하위 경로 결정,
    신규 브랜치·계획서 생성 또는 생성기 구현 권한이 포함되지 않는다.
