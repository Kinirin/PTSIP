schema_version: ptsip-policy-approval-provenance/v1
policy_class: PTSIP_DEVELOPER_POLICY
approval:
  approval_id: MPA-20261023-OPTIONAL-HIERARCHICAL-BRANCH-PATTERNS
  decision: APPROVED
  source_kind: PROJECT_OWNER_DIRECT_INSTRUCTION
  decision_source: USER_EXPLICIT
  source_reference: >-
    The owner selected hierarchical branch-naming patterns within the
    previously approved repository-scoped, user-owned, optional pattern
    registration model. Multiple patterns and user-defined hierarchical
    depth are allowed, but no fixed pattern taxonomy, priority ordering,
    or mandatory inheritance structure is imposed by PTSIP. Expose optional
    fields for priority and inheritance relationships; their values are
    provided only when the user chooses to supply them. An omitted priority
    or inheritance relationship must not be fabricated or inferred by
    PTSIP. Responsibility for absent hierarchy/priority management belongs
    to the user. Naming patterns remain independent of explicit branch
    creation authorization and main-owned branch activity registration.
    Exact pattern registry shape, field types, evaluation order, inheritance
    semantics, and ambiguous-pattern reconciliation are subordinate
    unresolved decisions. No live branch creation or guard replacement
    is authorized by this direction.
  approval_scope: FINAL_POLICY
  target_status: APPROVED
  policy_content_review_scope: DIRECTION
  implementation_authorized: false
  branch_creation_authorized: false
  recorded_at: '2026-10-23'
