  decision: APPROVED
  source_kind: PROJECT_OWNER_DIRECT_INSTRUCTION
  decision_source: USER_EXPLICIT
  source_reference: >-
    User approved direction C: missing or unregistered authorization
    rules must block without creating an implicit DENY record; only
    explicitly registered ALLOW/DENY effects may be considered.
    An explicit DENY blocks the requested operation. An explicit ALLOW
    is a candidate and never bypasses higher-policy authority,
    registered binding/conditions or execution-time gates. Missing,
    invalid or unresolved bindings block without automatic effects.
    No specific resource scope, condition evaluation, actor binding,
    conflicting-rule precedence, grants, revocations or new action
    types are authorized by this direction; such decisions stay
    unresolved pending separate user authorization. Do not create
    default ALLOW or DENY authorization entries.
