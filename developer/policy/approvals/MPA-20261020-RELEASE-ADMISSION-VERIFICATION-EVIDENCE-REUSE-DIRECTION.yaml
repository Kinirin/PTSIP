  source_reference: >-
    Owner selected common Release Admission topic 3 option B: conditionally
    reuse existing verification evidence when its verified source, artifact
    identity, component and verification scope, validity and applicable
    policy requirements remain satisfied. Verification evidence may support
    more than one publication destination when the covered verification scope
    is the same, but an Admission result or publication success for one
    independent logical release and publisher does not authorize or prove
    completion for another. Record the direction on main and present
    topic 4; stages 2 and 3 remain deferred.
