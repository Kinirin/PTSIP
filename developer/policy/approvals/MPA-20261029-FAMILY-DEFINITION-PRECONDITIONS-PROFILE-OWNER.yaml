approval:
  approval_id: MPA-20261029-FAMILY-DEFINITION-PRECONDITIONS-PROFILE-OWNER
  decision: APPROVED
  source_kind: PROJECT_OWNER_DIRECT_INSTRUCTION
  decision_source: USER_EXPLICIT
  source_reference: >-
    The owner directed elimination of Constraints.preconditions and
    Constraints.dependencies from all fourteen independent Family contracts.
    Each Definition item may name registered condition identifiers through
    preconditions but this is a non-owning, reference-only selector.
    The authoritative rule-to-condition list is component_bindings[R-ID].condition_id
    in .ptsip/profiles/Responsibility-Authority-list.yaml. A Definition
    reference must exactly match that registered list, with no condition
    authoring or privilege creation from policy input. The independent Condition
    and Operational_Authority contracts continue to own their declarations.
    No decision was made to remove the now-empty, separately required
    Constraints structural group.
