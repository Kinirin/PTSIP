schema_version: ptsip-policy-approval-provenance/v1
policy_class: PTSIP_DEVELOPER_POLICY
approval:
  approval_id: MPA-20261023-CONTRACT-UNIT-EXCEPTION-SYNC
  decision: APPROVED
  source_kind: PROJECT_OWNER_DIRECT_INSTRUCTION
  decision_source: USER_EXPLICIT
  source_reference: >-
    The owner selected B: an exception branch excludes only explicitly
    owner-designated contract units from automated synchronization.
    All other common contract units remain subject to the ordinary
    active-branch contract synchronization policy. Exception membership
    alone does not mean branch-wide exclusion, create branch activity,
    or grant write permission. Ambiguous or unresolvable exclusions
    cannot authorize mutation. Specific contract identity/mapping,
    overlap between active and exception sets, roster mutation rules,
    and propagation execution remain independent unresolved decisions.
  approval_scope: FINAL_POLICY
  target_status: APPROVED
  policy_content_review_scope: DIRECTION
  implementation_authorized: false
  branch_creation_authorized: false
  recorded_at: '2026-10-23'
