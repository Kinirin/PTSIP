schema_version: ptsip-policy-approval-provenance/v1
policy_class: PTSIP_DEVELOPER_POLICY
approval:
  approval_id: MPA-20261023-GIT-MUTATION-AUTHORITY-TRIGGER-DEFERRED
  decision: APPROVED
  source_kind: PROJECT_OWNER_DIRECT_INSTRUCTION
  decision_source: USER_EXPLICIT
  source_reference: >-
    The project owner recognizes PTSIP's Git mutation authority within the
    already approved contract-synchronization responsibility (Git work, merge,
    retry and recovery), but expressly defers any general rule specifying when
    that authority may be exercised. Limited case evidence is insufficient to
    define an automatic execution trigger. Capability and responsibility are
    therefore distinct from action-time eligibility. Until a specific
    execution condition is separately authorized, this decision must not be
    used to infer an automatic Git mutation trigger or to execute a Git change.
    Prior branch membership, contract-unit exception, compatibility and
    no-silent-conflict rules remain unchanged. This decision does not permit
    branch creation, unrelated Git operations or unilateral trigger policy.
  approval_scope: FINAL_POLICY
  target_status: APPROVED
  policy_content_review_scope: DIRECTION
  implementation_authorized: false
  branch_creation_authorized: false
  recorded_at: '2026-10-23'
