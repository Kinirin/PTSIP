schema_version: ptsip-policy-approval-provenance/v1
policy_class: PTSIP_DEVELOPER_POLICY
approval:
  approval_id: MPA-20261015-LANGUAGE-NEUTRAL-COMPOSITION-RECONCILE
  decision: APPROVED
  source_kind: PROJECT_OWNER_DIRECT_INSTRUCTION
  decision_source: USER_EXPLICIT
  source_reference: >-
    The owner explicitly rejects Python packaging metadata as the canonical
    authority for PTSIP release composition and independently versioned
    components. RECONCILE the former pyproject.toml source authority with
    a language-neutral hierarchy: composition-contract.json governs
    version representation, projection and source binding, but MUST NOT
    own the current component version values. Exactly one subordinate,
    machine-readable canonical version/composition manifest MUST own current
    Package, Tool, Profile, Engine and Specification bindings; its exact
    path/interface remain subordinate unresolved work. Registered packaging
    projections including pyproject.toml and future package.json or OCI
    metadata MUST derive or verify their versions against this manifest,
    never independently authorize them. The existing release-contract.json
    version patterns, package base and bootstrap entries are preserved as
    existing facts, not silently promoted to the complete current-version
    manifest. Preserve independent component versions, explicit approvals,
    no automatic version increments, published release immutability,
    evidence/provenance, and fail-closed mismatch handling. Do not reopen
    NuGet deployment. This approval establishes durable policy direction;
    it does not itself materialize or activate a successor INFO policy
    record before its independent family format and identity are resolved,
    and it does not authorize implementation cutover, publication, or
    restoration of retired MPD-INFO-0005. Preserve the isolated dev/0.3.8b2 branch and do not
    merge into main.
  approval_scope: FINAL_POLICY
  target_status: APPROVED
  target_substatus: Unresolved
  implementation_authorized: false
  policy_content_review_scope: DIRECTION
  conflict_resolution:
    strategy: RECONCILE
    prior_approval_ref: developer/policy/approvals/MPA-20261013-PYPROJECT-CANONICAL-PACKAGE-COMPOSITION-KEEP-LATEST.yaml
    superseded_rule: PYPROJECT_TOML_IS_CANONICAL_RELEASE_AND_COMPONENT_VERSION_AUTHORITY
    replacement_rule: COMPOSITION_CONTRACT_TO_SINGLE_CANONICAL_VERSION_MANIFEST_TO_ECOSYSTEM_PROJECTIONS
    preserved_rules:
      - INDEPENDENT_COMPONENT_VERSION_IDENTITIES
      - EXPLICIT_VERSION_CHANGE_AUTHORITY
      - NO_AUTOMATIC_VERSION_INCREMENT
      - EXACT_SOURCE_AND_ARTIFACT_EVIDENCE
      - PUBLISHED_ARTIFACT_IMMUTABILITY
      - FAIL_CLOSED_ON_MISSING_OR_STALE_PROJECTION
  affected_policy_ids:
    - MPD-INFO-0005
  recorded_at: '2026-10-15'
