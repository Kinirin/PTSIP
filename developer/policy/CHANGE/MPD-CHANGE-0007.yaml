  root_family: "CHANGE"
  title: "CHANGE 위탁 책임 수락 적격성"
Policy_Status:
  Policy_Status_Schema_ver: "1"
  status: "DRAFT.Default"
  contract: "urn:ptsip:contract:policy:change:trusteeship-acceptance:eligibility"
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:change:trusteeship-acceptance"
    Rule_ver: "1"
  Definition:
    - id: "R-ID-8F3AB54D5A644ADBB81291D4E6007001"
      rule: "TRUSTEESHIP-ACCEPT"
    - id: "R-ID-791E4C98DF554CAB8DA81BC0CE000702"
      rule: "SEMANTIC-REVIEW"
  title: "CHANGE 위탁 책임 수락 적격성"
  Boundary:
    scope: "기존 정책 책임의 위탁 수락 적격성 판정에 필요한 보존·출처·의미 검토 의무의 정책적 경계. 기존 정책 제거 허가와 별개이며, 현 문서는 승인 전 후속 책임 이전 후보."
    subjects:
      - "위탁 수락 적격성은 원본 정책에서 근거 있게 식별된 의무·금지·조건·책임 소유 경계 및 출처가 위탁 대상에서 누락되거나 왜곡되지 않았는지 검토하는 책임으로 한정한다."
      - "TRUSTEESHIP_AGENT_SEMANTIC_REVIEW_REQUIRED: 코딩 에이전트는 위탁 수락 전에 원본 책임의 의미를 직접 검토하고 누락·변형 가능성과 미확인 범위를 보고해야 하며, 수행 근거가 없거나 불충분하면 수락 적격성을 충족하지 못한다."
      - "원본 책임 항목과 위탁 항목의 포함 관계를 점검하되, 목록 검사·원문 복사·필드 매핑·스키마 통과만으로 의미 동등성을 증명하지 않는다."
      - "미이전 책임의 저장 형식과 자료형은 .ptsip/contracts/trusteeship/의 유효 계약에 따르며, 수락 검토의 증거와 위탁 책임 본문의 의미를 동일시하지 않는다."
      - "독립적 수락 적격성 검토의 결과는 후속 기존 정책 제거 적격성 정책에 전달할 수 있으나, 그 자체로 기존 정책 제거 또는 GOV 승인·권위 전환을 허가하지 않는다."
      - "MPD-CHANGE-0001에 보존된 해당 책임의 원문 및 세부 예외는 의미 검토를 거친 이전과 승인 이전까지 원본에서 유지한다."
    exclusions:
      - "기존 정책 제거 적격성·실제 정책 삭제·정책 생명주기 상태 전이를 직접 소유하거나 허가하는 행위"
      - "trusteeship 계약의 데이터 필드·자료형·증거 저장 형식을 본 정책에서 추가로 정의하는 행위"
      - "다른 정책 Family의 최종 책임 소유자·승인 주체 또는 공통 검증의 최종 소유자를 추정·승계하는 행위"
      - "DRAFT 정책을 적용 승인된 수락 권위로 주장하거나 원본 세부 규칙 이전을 검토 완료로 간주하는 행위"
  Evaluation:
    criteria:
      evidence:
        - "원본 책임·출처 및 위탁 대상의 포함 관계에서 누락·미확인 범위가 구별되는지 확인"
        - "코딩 에이전트가 원본 책임의 의미·금지·조건·소유 경계와 변형 위험을 검토한 수행 근거가 존재하는지 확인"
        - "위탁 수락 검토 결과가 기존 정책 삭제 허가 또는 최종 정책 권위로 자동 승격되지 않는지 확인"
        - "MPD-CHANGE-0001 원본 세부 책임의 후속 이전 범위와 수락 여부는 아직 미완료"
    result:
      status: "incomplete_fulfillment"
      task_name: "CHANGE 위탁 책임 수락 적격성 후속 책임 이전 검토"
      task_id: "MPD-CHANGE-0007"
