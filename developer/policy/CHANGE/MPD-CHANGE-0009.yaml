      original_subjects:
        - "위탁 수락 적격성은 원본에서 근거 있게 식별된 의무·금지·적용 조건·책임 소유 경계·출처뿐 아니라 해당 책임의 원문이 손실 없이 보존되고 자연어 의미 해석으로 누락·왜곡되지 않았는지 확인하는 책임으로 한정한다. 원문 보존과 코딩 에이전트의 해석 내용을 구별한다."
        - "TRUSTEESHIP_AGENT_SEMANTIC_REVIEW_REQUIRED: 코딩 에이전트는 위탁 수락 전에 원본 책임의 의미를 직접 검토하고 누락·변형 가능성과 미확인 범위를 보고해야 하며, 수행 근거가 없거나 불충분하면 수락 적격성을 충족하지 못한다."
        - "원본 책임 항목과 위탁 항목의 포함 관계를 점검하되, 목록 검사·원문 복사·필드 매핑·스키마 통과만으로 의미 동등성을 증명하지 않는다."
        - "원본 책임 항목을 근거 있게 식별하지 못하거나 위탁된 항목의 포함 여부를 확인할 수 없는 범위는 보존 검증 PASS 또는 수락 적격으로 처리하지 않고 미확인 범위를 명시한다. 자동 추정된 책임 목록만으로 원본의 완전한 책임 목록을 확정하지 않는다."
        - "위탁 수락에 신규 정책 전용 스키마·전용 검증기·필드 대응 또는 새 정책으로의 최종 이전 완료를 필수 선행조건으로 요구하지 않는다. 수락 적격성 검토와 GOV의 임시 규범 권위 판단 및 최종 이전 승인은 각각 독립된 판단으로 유지한다."
        - "원본 정책 영역은 자신의 책임 원문·출처·미이전 상태·인계 근거를 개별 보존하고, 위탁 수락의 보존 검증은 분야 간 재사용 가능한 공통 검증 계약·방식을 따르되 공통 검증 주체가 중앙 의미 소유자·승인 주체가 되지는 않는다. 공통 검증의 구체적 증명 범위·최종 소유권은 별도 정책 결정 대상으로 남긴다."
        - "미이전 책임의 저장 형식과 자료형은 .ptsip/contracts/trusteeship/의 유효 계약에 따르며, 수락 검토의 증거와 위탁 책임 본문의 의미를 동일시하지 않는다."
        - "독립적 수락 적격성 검토의 결과는 후속 기존 정책 제거 적격성 정책에 전달할 수 있으나, 그 자체로 기존 정책 제거 또는 GOV 승인·권위 전환을 허가하지 않는다."
        - "MPD-CHANGE-0001에 보존된 해당 책임의 원문 및 세부 예외는 의미 검토를 거친 이전과 승인 이전까지 원본에서 유지한다."
