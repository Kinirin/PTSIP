schema_version: ptsip-developer-root-family-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: CHANGE
policy:
  id: MPD-CHANGE-0001
  title: CHANGE authority (ACTIVE source responsibilities)
  status: APPROVED
  substatus: Applying
  version: '4.0'
authority_subject:
  id: DEV_VERSIONED_TRANSITION_SEMANTICS
  statement: 개발 규범, 정책, profile 및 Tool의 명시적인 old→new 변경 관계, 영향과 안전한 전환 순서를 소유한다.
exclusive_kernel:
- DEV_CHANGE_IMPACT_AND_COMPATIBILITY
- DEV_MIGRATION_ORDER_AND_CONTINUITY
rules:
  planning_policy_delta_and_legacy_reconciliation:
    decision: KEEP_LATEST
    approval_ref: developer/policy/approvals/MPA-20261012-PLANNING-CREATION-USER-DECISION-GATE.yaml
    scope: PLANNING_CREATION_RULE_CHANGE_AND_LEGACY_PLAN_IMPACT
    existing_plan_refs_are_not_new_creation_authority: true
    previous_planning_path_does_not_establish_new_canonical_subpath: true
    existing_plan_format_does_not_establish_new_universal_schema: true
    effective_policy_change_requires_exact_bound_plan_impact_analysis: true
    plan_binding_source: developer/bindings/policy-plan-bindings.yaml
    semantic_similarity_is_binding_proof: false
    unknown_or_ambiguous_relation: FAIL_CLOSED_REQUEST_USER_DIRECTION
    missing_registered_path_or_format: NO_AUTO_MIGRATION_NO_PLAN_CREATION
    do_not_reinterpret_old_plan_approval_as_new_plan_approval: true
    preserve_recorded_prior_approval_and_execution_evidence: true
    prior_approval_reuse: ONLY_WITH_MACHINE_PROVEN_SCOPE_AND_SEMANTIC_EQUIVALENCE
    new_or_expanded_scope_requires_fresh_user_decision: true
    affected_current_plans: BLOCK_USE_UNTIL_RECONCILED_AND_VERIFIED
    unrelated_policy_change_and_migration_rules: PRESERVED_UNTIL_SEPARATE_OWNER_DIRECTED_CHANGE

  policy_status_reform_legacy_semantics_replacement:
    primary_lifecycle_owner_policy: MPD-GOV-0001
    primary_lifecycle_contract_ref: developer/contracts/lifecycle/policy_status.json
    owned_scope: LEGACY_TO_NEW_STATUS_MIGRATION_RELATIONSHIP_ONLY
    decision: KEEP_LATEST
    approval_ref: developer/policy/approvals/MPA-20261012-POLICY-STATUS-MEANING-REPLACEMENT.yaml
    policy_scope: PTSIP_DEVELOPER_POLICY
    repository_path_scope: developer/**
    external_paths: EXCLUDED
    subject: POLICY_LIFECYCLE_STATUS_REFORM
    legacy_state_transitions:
      ACTIVE:
        target_status: APPROVED
        target_substatus: Applying
      SUPERSEDED:
        target_status: RETIRED
        target_substatus: Waiting
    legacy_status_meaning_preservation: NOT_REQUIRED
    legacy_status_effect_inheritance: NOT_REQUIRED
    legacy_supersession_meaning_preservation: NOT_REQUIRED
    supplementary_legacy_semantics_projection: NOT_REQUIRED
    preserved_semantic_equivalence_check: FORBIDDEN_AS_STATUS_REFORM_GATE
    rationale: LEGACY_POLICY_STATUSES_NOT_RELIABLE_REFLECTION_OF_CURRENT_POLICY_LIFECYCLE
    conflicting_prior_rule:
      policy_id: MPD-CHANGE-0001
      authority: DEV_CHANGE_IMPACT_AND_COMPATIBILITY
      resolution: KEEP_LATEST
      override_scope: POLICY_LIFECYCLE_STATUS_REFORM_LEGACY_TO_NEW_STATUS
      unrelated_migration_preservation: UNAFFECTED
    transition_boundary:
      approved_legacy_mapping_semantics: true
      target_lifecycle_model_complete: true
      status_record_bulk_rewrite_authorized: true
      current_schema_and_runtime_enforcement_change: GOV_CONTRACT_ADMITTED
      current_application_approval_ref: developer/policy/approvals/MPA-20261012-GOV-CURRENT-LIFECYCLE-APPLY.yaml
      excluded_paths:
      - developer/policy/legacy/**
      other_legacy_statuses_and_substatus_rules: CONSUME_GOV_CANONICAL_CONTRACT
      implementation_plan: SEPARATE
      scope_approval_ref: developer/policy/approvals/MPA-20261012-POLICY-STATUS-DEV-SCOPE.yaml
  family_definition:
    kernel_definitions:
    - id: DEV_CHANGE_IMPACT_AND_COMPATIBILITY
      statement: 변경 전후 의미, identity와 호환 약속의 차이 및 영향 받는 책임을 명시한다. 의미적 근거 없이 version
        문자열이나 Family 이름을 치환하지 않는다.
      non_substitutability: INFO의 유효한 새 schema나 CNTR의 새 계약만으로 기존 상태와의 의미적 대응이 확정되지
        않는다.
    - id: DEV_MIGRATION_ORDER_AND_CONTINUITY
      statement: 승인된 변경의 migration 경로, 선행 조건, staged legacy 책임 보존 및 retirement 조건을
        정한다.
      non_substitutability: REAL의 변환 성공이나 OPS의 회복 조치만으로 전환 순서와 legacy authority 폐기
        조건을 정당화할 수 없다.
    source_scope:
    - MPD-0001
    - MPD-0010
    - MPD-0011
    - MPD-0013
    - MPD-0014
    - MPD-0015
    - MPD-0018
    - MPD-MIGR-0001
    - MPD-MIGR-0004
    - MPD-MIGR-0005
    - MPD-PLAN-0003
    - MPD-SPEC-0020
    - MPD-SPEC-0026
    - MPD-SPEC-0027
    - MPD-WORK-0001
