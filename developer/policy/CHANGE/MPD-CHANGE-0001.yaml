  Policy_Status_Schema_ver: "1"
  status: "DRAFT.Reviewed"
  contract: "urn:ptsip:contract:policy:change:family:orchestration"
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:change:family-orchestration"
    Rule_ver: "1"
  Definition:
    - id: "R-ID-C615A4E8BF5F4A0597CD28E6A5B79011"
      rule: "CHANGE-ORCHESTRATION"
    - id: "R-ID-E29A03BD454B4BB2A4074F16C587AD62"
      rule: "CHANGE-RESP-GOV"
  title: "CHANGE 정책 정의 및 책임 오케스트레이션"
  Boundary:
    scope: "PTSIP 개발 과정의 정책·규범·Project Profile·개발 도구 변경 전후 관계와 Developer CHANGE Family 내부 정책 책임"
    subjects:
      - "PTSIP 개발 과정에서 정책·규범·프로젝트 프로파일·개발 도구가 변경되면 변경 전과 변경 후 상태 사이의 관계를 CHANGE 정책의 책임 범위로 관리"
      - "MPD-CHANGE-0001은 CHANGE Family 정책의 정의 및 책임 오케스트레이션을 담당"
      - "CHANGE Family 정책 정의, CHANGE 영역의 결정·승인 정당성을 판단할 기본 경계, CHANGE 정책별 책임 범위와 분배 원칙을 관리"
      - "CHANGE의 결정·승인 정당성 판단은 유효한 상위 정책 권한과 GOV 승인 근거를 존중하며 CHANGE 자체가 새로운 승인 권한을 생성하지 않음"
      - "개발자 CHANGE 정책과 배포용 PTSIP 정책의 권한 경계는 후속 MPD-CHANGE-0006 정책 책임으로 분리하는 방향; 기존 MPD-CHANGE-0002의 번호 변경 및 실제 내용은 별도 검토 대상"
      - "개별 규칙의 의미 소유자 선언·확정·등록은 별도 사용자 승인 전까지 유보하며 책임 후보 분석이 이를 대신하지 않음"
      - "KEEP_LATEST 승인: 기존 정책 책임이 PTSIP 위탁 계약에 인계되면 새 정책 문서·전용 검증기 완성 전에도 기존 정책 제거가 가능하도록 한다"
      - "위탁 수락과 새 정책으로의 최종 이전은 독립 단계이며 미이전 책임은 후속 비동기 이전 대상으로 보존한다"
      - "위탁 책임은 원본 의미와 출처를 보존하고 자연어 의미 및 기계적 책임 분류를 함께 사용한다"
      - "2026-11-01 사용자 승인 A(보존 중심 수락 검증): 일반적인 정책 제거 전 위탁 수락은 기존 책임의 원문·의미·출처·누락 여부 등 손실 없는 보존을 확인하는 독립 검증으로 한정한다"
      - "위탁 수락에 신규 정책 전용 스키마·검증기·필드 대응 및 최종 정책 이전의 완성을 필수 선행조건으로 요구하지 않으며, 수락 검증과 책임의 임시 적용 권위·최종 수용 승인 판단은 분리한다"
      - "2026-11-01 사용자 승인 B(분야 보존·공통 검증): 각 정책 영역은 자기 책임의 원문·출처·미이전 상태 및 인계 증거를 개별 보존하고, 위탁 수락의 보존 증거 검증은 분야 간 재사용 가능한 공통 검증 계약·방식을 따른다"
      - "공통 검증 결과는 보존 증거의 수락 판단만 지원하며 중앙 책임 소유자·승인 주체를 만들지 않고, 검증 책임 정책의 최종 소유자와 구체적인 증명 범위·방법은 별도로 결정한다"
    exclusions:
      - "구형 MPD-CHANGE-0001에 누적된 legacy unit_mpd 작업·이전 경로·상태 변경·버전 산식·브랜치·검증·배포 구현 규칙의 자동 승계"
      - "정책 변경에 따른 PLAN 자동 생성·자동 승인, Project Profile 변경, 사용자 Revision, 계획 파일 식별 관리의 세부 정책을 이 총칙에서 확정하는 행위"
      - "계획 또는 구현의 상세 이동 순서·파일 작업을 CHANGE 총칙의 규범적 내용으로 고정하는 행위"
      - "MPD-CHANGE-0002를 MPD-CHANGE-0006으로 무검증 식별자 치환하거나 과거 내용을 새 권한으로 활성화하는 행위"
      - "CHANGE의 책임 오케스트레이션을 GOV의 승인 정당성 부여 권한 또는 각 정책의 미확정 의미 소유권으로 확대하는 행위"
      - "퇴역 MPD-CHANGE-0004의 일반적인 완전 책임 이전·전체 소비자 전환 선행조건을 위탁 인계 후 제거의 조건으로 다시 강제하는 행위"
      - "위탁 계약 미확정 상태에서 실제 정책 삭제를 허가하거나 별도 승인된 Profile 전환 조건을 일괄 폐기하는 행위"
      - "위탁 저장 및 검증 상세, 새로운 정책 소유권, PLAN 자동 승인까지 이 총칙에서 임의로 확정하는 행위"
      - "보존 증거가 확인되지 않은 책임을 위탁 수락 완료로 취급하거나, 보존 검증 결과를 새 정책의 실행·승인 권위로 자동 승격하는 행위"
      - "위탁 수락을 위해 신규 정책 전용 검증의 완성을 강제하거나 위탁의 기술적 검증 방법·기록 필드·저장 위치를 총칙에서 확정하는 행위"
      - "공통 검증기의 존재만으로 분야별 보존 책임이나 GOV 승인·권위 판단을 공통 검증 주체에 이전하거나, DRAFT 검증 정책을 자동 승인된 책임 소유자로 간주하는 행위"
  Evaluation:
    criteria:
      evidence:
        - "CHANGE 정책 정의·결정 근거·책임 분배가 후속 정책과 구별되는지 확인"
        - "MPD-CHANGE-0006 개발자 정책·배포 정책 권한 경계는 후속 검토 전까지 미확정"
        - "개별 후속 주제의 정책 번호, 책임·자동 승인 범위, 현행 승인 정책과 충돌 처리까지는 미완료"
        - "기존 RETIRED.Waiting 문서의 원문은 Git 이력에 남으며 구형 규칙을 자동으로 규범적 권한으로 승계하지 않음"
        - "2026-11-01 사용자 KEEP_LATEST: RETIRED MPD-CHANGE-0004 일반 제거 게이트를 위탁 완료 후 제거 방향으로 대체하며 다른 기존 승인 규칙은 유지"
        - "2026-11-01 사용자 A 승인: 기존 책임 보존 수락 검증과 GOV의 임시 규범 적용 범위 판단 및 최종 정책 이전 승인 경계가 별도인지 평가; 구체적 수락 검증 방법은 미확정"
        - "2026-11-01 사용자 B 승인: 분야별 증거 보존과 공통 보존 검증의 책임이 구별되고, 검증 결과가 실행 권위 또는 최종 소유권을 승인하지 않는지 평가; 공통 검증의 의미적 증명 범위와 ASSURE 귀속 여부는 미결정"
    result:
      status: "incomplete_fulfillment"
      task_name: "CHANGE 총칙의 계약 개혁 및 하위 정책 분리 평가"
      task_id: "MPD-CHANGE-0001"
