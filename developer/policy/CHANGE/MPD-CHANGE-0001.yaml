    purpose: Establish the Root Responsibility Family transition authority for PTSIP_DEVELOPER_POLICY
      without treating the new Root families as a hierarchy over the legacy SPEC,
      PLAN, WORK, VERI, MIGR, and RELS families.
    root_family_vocabulary:
