        schema_ref: developer/policy/schemas/root-family-approved-baseline.schema.json
        approved_graph_ref: developer/policy/registries/root-family-migration.json
        source_partition: FROZEN_PRE_MIGRATION_CATALOG_AND_GRAPH
        original_catalog_snapshot_binding: EXACT_GIT_BLOB
        current_catalog_migration_source_role: AUDIT_ONLY_CATALOG
