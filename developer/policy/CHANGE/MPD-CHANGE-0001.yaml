Policy_Identity:
  id: "MPD-CHANGE-0001"
  policy_kind: "PTSIP_DEVELOPER_POLICY"
  root_family: "CHANGE"
  title: "CHANGE 정책 정의 및 책임 오케스트레이션"
Policy_Status:
  Policy_Status_Schema_ver: "1"
  status: "DRAFT.Reviewed"
  contract: "urn:ptsip:contract:policy:change:family:orchestration"
Policy_Rules:
  Identity:
    contract_id: "urn:ptsip:policy:rule:change:family-orchestration"
    Rule_ver: "1"
  Definition:
    - id: "R-ID-C615A4E8BF5F4A0597CD28E6A5B79011"
      rule: "CHANGE-ORCHESTRATION"
    - id: "R-ID-E29A03BD454B4BB2A4074F16C587AD62"
      rule: "CHANGE-RESP-GOV"
  title: "CHANGE 정책 정의 및 책임 오케스트레이션"
  Boundary:
    scope: "PTSIP 개발 과정의 정책·규범·Project Profile·개발 도구 변경 전후 관계와 Developer CHANGE Family 내부 정책 책임"
    subjects:
      - "PTSIP 개발 과정에서 정책·규범·프로젝트 프로파일·개발 도구가 변경되면 변경 전과 변경 후 상태 사이의 관계를 CHANGE 정책의 책임 범위로 관리"
      - "MPD-CHANGE-0001은 CHANGE Family 정책의 정의 및 책임 오케스트레이션을 담당"
      - "CHANGE Family 정책 정의, CHANGE 영역의 결정·승인 정당성을 판단할 기본 경계, CHANGE 정책별 책임 범위와 분배 원칙을 관리"
      - "CHANGE의 결정·승인 정당성 판단은 유효한 상위 정책 권한과 GOV 승인 근거를 존중하며 CHANGE 자체가 새로운 승인 권한을 생성하지 않음"
      - "개발자 CHANGE 정책과 배포용 PTSIP 정책의 권한 경계는 후속 MPD-CHANGE-0006 정책 책임으로 분리하는 방향; 기존 MPD-CHANGE-0002의 번호 변경 및 실제 내용은 별도 검토 대상"
      - "개별 규칙의 의미 소유자 선언·확정·등록은 별도 사용자 승인 전까지 유보하며 책임 후보 분석이 이를 대신하지 않음"
      - "KEEP_LATEST 승인: 기존 정책 책임이 PTSIP 위탁 계약에 인계되면 새 정책 문서·전용 검증기 완성 전에도 기존 정책 제거가 가능하도록 한다"
      - "위탁 수락과 새 정책으로의 최종 이전은 독립 단계이며 미이전 책임은 후속 비동기 이전 대상으로 보존한다"
      - "위탁 책임은 원본 의미와 출처를 보존하고 자연어 의미 및 기계적 책임 분류를 함께 사용한다"
      - "2026-11-01 사용자 승인 A(보존 중심 수락 검증): 일반적인 정책 제거 전 위탁 수락은 기존 책임의 원문·의미·출처·누락 여부 등 손실 없는 보존을 확인하는 독립 검증으로 한정한다"
      - "위탁 수락에 신규 정책 전용 스키마·검증기·필드 대응 및 최종 정책 이전의 완성을 필수 선행조건으로 요구하지 않으며, 수락 검증과 책임의 임시 적용 권위·최종 수용 승인 판단은 분리한다"
      - "2026-11-01 사용자 승인 B(분야 보존·공통 검증): 각 정책 영역은 자기 책임의 원문·출처·미이전 상태 및 인계 증거를 개별 보존하고, 위탁 수락의 보존 증거 검증은 분야 간 재사용 가능한 공통 검증 계약·방식을 따른다"
      - "공통 검증 결과는 보존 증거의 수락 판단만 지원하며 중앙 책임 소유자·승인 주체를 만들지 않고, 검증 책임 정책의 최종 소유자와 구체적인 증명 범위·방법은 별도로 결정한다"
      - "2026-11-01 사용자 승인 B(책임 목록 포함성): 공통 보존 검증의 증명 대상은 원본에서 근거 있게 식별된 책임 항목 목록과 위탁 보존 대상 항목의 포함 관계 및 누락 여부이며, 원문·출처 보존 증거를 함께 유지한다"
      - "책임 항목을 검증 가능하게 식별하지 못하거나 포함 여부를 확인할 수 없는 범위는 보존 검증 PASS로 간주하지 않고 미확인 범위를 명시하며, 항목 포함성 검증만으로 자연어 의미 동등성·실행 권위·최종 이전 승인을 입증했다고 선언하지 않는다"
      - "2026-11-01 사용자 승인 B(독립 실행 게이트): 책임 목록 보존 검증 PASS와 실제 기존 정책 제거의 실행 허가는 서로 독립된 판단으로 유지하며, 제거는 유효한 GOV 승인 출처 및 정책 생명주기·적용 범위 등 별도 실행 허가 조건을 충족할 때만 가능하다"
      - "CHANGE는 위탁 수락과 기존 정책 제거의 정책적 적격 조건을 정의하고, 독립 실행 게이트의 권위 판단·상태 전이는 해당 유효 정책 소유자에게 남기며, 구체적인 게이트 구현 및 최종 실행 소유자는 별도 정책에서 결정한다"
      - "2026-11-01 사용자 승인 A(PLAN 관계 정리 중심): 기존 정책 제거 시 해당 정책과 PLAN 사이의 유효한 관계만 정리하는 것을 기본 변경 범위로 삼고, 동일 PLAN에 연결된 다른 유효한 정책 관계는 유지한다"
      - "정책-PLAN 관계 정리는 PLAN 본문·승인·진행·완료·생명주기를 직접 변경하지 않으며, 관계 소유권의 최종 귀속과 무연결 PLAN의 후속 처분은 별도 정책 결정을 따른다"
      - "2026-11-01 사용자 승인 B(무연결 PLAN 정책 근거 미확정): 유효한 정책-PLAN 관계가 모두 제거된 PLAN은 문서·기존 승인·진행·완료·생명주기 상태를 그대로 유지하고, 관계 계층에서는 정책 근거가 미확정임을 구별하여 보존한다"
      - "정책 근거 미확정은 PLAN 자체의 신규 생명주기 상태·자동 취소·승인 철회를 의미하지 않으며, 해당 근거에 의존하는 실행은 실행 시점에 유효한 권위가 별도로 확인되는지 판정한다; 다른 독립적 근거의 작업을 일괄 차단하지 않는다"
      - "2026-11-01 사용자 승인 A(관계 독립 계층): 정책-PLAN 연결의 존재·해제·유효 관계 및 정책 근거 미확정 여부에 관한 규범적 소유권은 개별 정책 Family와 PLAN 자체 관리 권위 모두로부터 독립된 관계 권위 계층에 둔다"
      - "독립 관계 계층은 정책별 의미론적 책임·승인·생명주기 또는 PLAN 본문·승인·진행·완료·생명주기를 소유하거나 변경하지 않고, 관계만의 일관성·다대다 연결을 다루며 물리 경로·후속 정책 식별자·승인 증거 기록 형식은 별도 결정 대상으로 둔다"
      - "2026-11-01 사용자 승인 B(범위 검증 후 신규 관계 연결): 독립 관계 계층은 신규 정책-PLAN 연결에 앞서 각자의 유효한 권위 출처가 제공하는 적용 범위 근거의 부합 여부를 검증하며, 검증되지 않은 범위 또는 단순 명칭 유사성만으로 새 관계를 확정하지 않는다"
      - "관계 범위 검증은 연결 적합성에 국한되고 정책의 규범적 의미·PLAN 내용·기존 PLAN 승인 상태를 재정의하지 않는다; 검증 결과와 신규 관계 생성 허가는 분리하며 불확정 범위 근거의 후속 처리 방식은 별도 결정으로 남긴다"
      - "2026-11-01 사용자 승인 C(신규 관계 생성의 건별 사용자 승인): 각각의 신규 정책-PLAN 관계는 대상 정책·대상 PLAN·연결 범위가 특정된 사용자 명시적 승인 출처와 앞서 승인된 범위 적합성 검증을 모두 충족할 때에만 생성할 수 있다"
      - "개별 관계 생성 승인은 그 특정 연결에만 적용되며 정책의 규범적 승인·PLAN 자체의 승인·재승인·실행 허가를 부여하지 않는다; 관계 계층은 사용자 승인을 검증·참조할 뿐 승인 권한을 스스로 생성하지 않는다"
      - "2026-11-01 사용자 승인 B(관계 승인 유효성의 범위 변경 시 재승인): 특정 정책-PLAN 관계에서 기존 사용자가 승인한 실질적 연결 적용 범위가 변경된 경우 변경 범위의 관계 적용 전 해당 관계에 대한 새로운 사용자 명시적 승인을 요구한다"
      - "정책 또는 PLAN의 단순 버전·리비전 변경만으로 승인된 연결 범위가 달라지지 않았다면 관계 재승인을 강제하지 않으며, 변경되지 않은 승인 범위의 기존 관계·PLAN 자체 승인·상태는 유지한다; 범위 변경 여부를 검증할 근거가 없으면 변경 범위 적용을 승인된 것으로 간주하지 않는다"
    exclusions:
      - "구형 MPD-CHANGE-0001에 누적된 legacy unit_mpd 작업·이전 경로·상태 변경·버전 산식·브랜치·검증·배포 구현 규칙의 자동 승계"
      - "정책 변경에 따른 PLAN 자동 생성·자동 승인, Project Profile 변경, 사용자 Revision, 계획 파일 식별 관리의 세부 정책을 이 총칙에서 확정하는 행위"
      - "계획 또는 구현의 상세 이동 순서·파일 작업을 CHANGE 총칙의 규범적 내용으로 고정하는 행위"
      - "MPD-CHANGE-0002를 MPD-CHANGE-0006으로 무검증 식별자 치환하거나 과거 내용을 새 권한으로 활성화하는 행위"
      - "CHANGE의 책임 오케스트레이션을 GOV의 승인 정당성 부여 권한 또는 각 정책의 미확정 의미 소유권으로 확대하는 행위"
      - "퇴역 MPD-CHANGE-0004의 일반적인 완전 책임 이전·전체 소비자 전환 선행조건을 위탁 인계 후 제거의 조건으로 다시 강제하는 행위"
      - "위탁 계약 미확정 상태에서 실제 정책 삭제를 허가하거나 별도 승인된 Profile 전환 조건을 일괄 폐기하는 행위"
      - "위탁 저장 및 검증 상세, 새로운 정책 소유권, PLAN 자동 승인까지 이 총칙에서 임의로 확정하는 행위"
      - "보존 증거가 확인되지 않은 책임을 위탁 수락 완료로 취급하거나, 보존 검증 결과를 새 정책의 실행·승인 권위로 자동 승격하는 행위"
      - "위탁 수락을 위해 신규 정책 전용 검증의 완성을 강제하거나 위탁의 기술적 검증 방법·기록 필드·저장 위치를 총칙에서 확정하는 행위"
      - "공통 검증기의 존재만으로 분야별 보존 책임이나 GOV 승인·권위 판단을 공통 검증 주체에 이전하거나, DRAFT 검증 정책을 자동 승인된 책임 소유자로 간주하는 행위"
      - "책임 목록 검증을 빌미로 신규 정책 전용 스키마·전용 검증기·필드 대응의 선완성을 요구하거나, 자동 생성된 추정 책임 목록을 근거 없는 완전한 원본 책임 목록으로 취급하는 행위"
      - "보존 검증기의 PASS나 위탁 수락만으로 정책 파일 삭제·정책 상태 전이·승인 범위 확대를 자동 실행하거나, RETIRED 상태의 CTRL 정책을 독립 실행 게이트의 현행 규범적 소유자로 재활성화하는 행위"
      - "독립 실행 게이트를 이유로 이전 정책의 전체 신규 정책 전환·전용 검증기 완성을 제거 선행조건으로 다시 강제하는 행위; 별도 승인된 특수 전환 의무는 유지한다"
      - "정책 제거를 근거로 연결된 PLAN 전체를 일괄 무효화·삭제·재생성·재승인하거나, CHANGE 총칙이 정책-PLAN 관계 등록부·PLAN 상태의 새 규범 소유권을 직접 취득하는 행위"
      - "퇴역된 정책-PLAN 관계 계약이나 폐지 예정 결합 경로를 현행 권위로 자동 부활시키거나, 실제 정책 제거의 적법성 검증 없이 관계 정리 완료를 선언하는 행위"
      - "모든 정책 연결이 사라졌다는 이유만으로 PLAN을 자동 삭제·실효화·재승인하거나, 정책 근거 미확정 해소를 기존 정책 제거의 새로운 필수 선행조건으로 강제하는 행위"
      - "관계 계층의 미확정 표시를 PLAN 자체 상태로 강제하거나, 제거된 정책을 현행 실행 권위로 묵시적 재연결하는 행위"
      - "독립 관계 계층을 중앙 정책 책임 보관소·정책 소유자·PLAN 승인 주체로 승격하거나, CHANGE 총칙이나 퇴역 MPD-SPEC-0023·developer/bindings 경로를 후속 관계 계층의 현재 권위로 자동 재활성화하는 행위"
      - "신규 관계의 적용 범위를 정책명·PLAN명·Family명만으로 추정하거나 관계 검증 PASS를 새 정책 권위 또는 PLAN 재승인·실행 허가로 취급하는 행위"
      - "범위 확인만으로 관계 자동 생성의 승인 출처를 새로 부여하거나, 관계 생성 검증을 이유로 기존 PLAN 전체의 변경·재승인을 요구하는 행위"
      - "관계 범위 검증 PASS, AI 추론, 자동화 산출물, 정책·PLAN의 기존 승인 또는 포괄적 방향 승인만으로 특정되지 않은 신규 관계를 생성하거나 건별 사용자 승인으로 간주하는 행위"
