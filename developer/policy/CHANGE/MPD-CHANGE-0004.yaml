schema_version: ptsip-developer-root-family-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: CHANGE
policy:
  id: MPD-CHANGE-0004
  version: '2.4'
  title: Developer legacy policy and Python automation retirement
  status: ACTIVE
authority_subject:
  id: DEV_VERSIONED_TRANSITION_SEMANTICS
  statement: 개발 규범, 정책, profile 및 Tool의 명시적인 old→new 변경 관계, 영향과 안전한 전환 순서를 소유한다.
exclusive_kernel:
- DEV_CHANGE_IMPACT_AND_COMPATIBILITY
- DEV_MIGRATION_ORDER_AND_CONTINUITY
rules:
  family_definition:
    kernel_definitions:
    - id: DEV_CHANGE_IMPACT_AND_COMPATIBILITY
      statement: 변경 전후 의미, identity와 호환 약속의 차이 및 영향 받는 책임을 명시한다. 의미적 근거 없이 version
        문자열이나 Family 이름을 치환하지 않는다.
      non_substitutability: INFO의 유효한 새 schema나 CNTR의 새 계약만으로 기존 상태와의 의미적 대응이 확정되지
        않는다.
    - id: DEV_MIGRATION_ORDER_AND_CONTINUITY
      statement: 승인된 변경의 migration 경로, 선행 조건, staged legacy 책임 보존 및 retirement 조건을
        정한다.
      non_substitutability: REAL의 변환 성공이나 OPS의 회복 조치만으로 전환 순서와 legacy authority 폐기
        조건을 정당화할 수 없다.
    source_scope: []
  developer_legacy_retirement:
    scope: DEVELOPER_CONTROL_PLANE
    support_plane_inheritance: FORBIDDEN
    target_policy_families:
    - NORM
    - GOV
    - INTENT
    - ARCH
    - INFO
    - CNTR
    - RISK
    - SUPPLY
    - REAL
    - ASSURE
    - CTRL
    - CHANGE
    - OPS
    - RECORD
    target_policy_reference_model: EXACT_ROOT_POLICY_ID_AND_SECTION
    target_removed_path: developer/policy/legacy
    original_responsibility_lifecycle: PRESERVE
    subsequent_manual_responsibility_review:
      conflict_resolution: RECONCILE
      approval_ref: developer/policy/approvals/MPA-20261011-ROOT-FAMILY-MANUAL-RECONCILE.yaml
      prior_materialization_state_rule: PRESERVE_AS_HISTORICAL_DECISION
      historical_legacy_source_status: PRESERVE_UNCHANGED
      historical_legacy_source_authority: AUDIT_ONLY
      current_authority_source: REGISTERED_ROOT_FAMILY_POLICY_AND_EXACT_SECTION
      eligible_for_activation: USER_REVIEWED_AND_EXPLICITLY_APPROVED_RESPONSIBILITY_ONLY
      required_review:
      - LEGACY_SOURCE_CONTENT
      - ALL_EXISTING_RELEVANT_FAMILY_POLICY_RULES
      - CONFLICT_AND_DUPLICATE_AUTHORITY
      - RUNTIME_LEGACY_AUTHORITY_DEPENDENCIES
      - EXACT_RESPONSIBILITY_OWNER_AND_BOUNDARY
      approved_responsibility_target_status: ACTIVE
      unreviewed_responsibility_status: PRESERVE_EXISTING
      family_policy_active_does_not_prove_all_units_reviewed: true
      source_status_does_not_auto_promote_target: true
      approval_of_review_process_does_not_approve_individual_migrations: true
      unresolved_conflict_or_owner: USER_DECISION_REQUIRED
      duplicate_canonical_ownership: FORBIDDEN
      unrelated_existing_policy_rules: PRESERVE
    delete_before_complete_coverage_and_consumer_cutover: FORBIDDEN
    historical_provenance: AUDIT_ONLY_NO_RUNTIME_AUTHORITY
    runtime_legacy_policy_projection: REMOVE
    completion_contract_ref: developer/policy/contracts/go-automation-cutover.v1.json
  developer_go_engine_post_common_engine_migration:
    conflict_resolution: RECONCILE
    approval_ref: developer/policy/approvals/MPA-20261011-DEVELOPER-ENGINE-RECONCILE.yaml
    from_root: developer/automation/
    to_root: .ptsip/engine/developer/
    product_engine_repository_state_root: .ptsip/engine/
    source_workspace_scope: PTSIP_DEVELOPER_REPOSITORY_ONLY
    explicit_developer_workspace_binding_required: true
    ordinary_consumer_project_migration: FORBIDDEN
    installed_product_engine_source_copy: FORBIDDEN
    engine_root_reconciliation_approval_ref: developer/policy/approvals/MPA-20261011-ENGINE-ROOT-RECONCILE.yaml
    common_engine_plan: PRESERVE_EXISTING_SEPARATE_PLAN
    work_unit_planning_boundary:
      priority_owner: APPROVED_WU_PLAN
      execution_order_owner: APPROVED_WU_PLAN
      dependency_owner: APPROVED_WU_PLAN
      policy_defined_work_priority: FORBIDDEN
      policy_defined_work_sequence: FORBIDDEN
      policy_defined_work_unit_dependencies: FORBIDDEN
      plan_binding_creation_by_policy_sync: FORBIDDEN
      approval_ref: developer/policy/approvals/MPA-20261011-WU-PRIORITY-PLAN-BOUNDARY.yaml
    retirement_guard:
      required: VERIFIED_SEMANTIC_EQUIVALENCE_AND_OPERATIONAL_CALLER_CUTOVER
      existing_go_entrypoints_preserved_until_cutover: true
    existing_go_automation_cutover_contract: REMAINS_EFFECTIVE_UNTIL_AUTHORIZED_REPLACEMENT
    no_early_path_move_or_implicit_activation: true
    existing_dot_ptsip_engine_data: PRESERVE
    no_existing_common_engine_plan_mutation: true
    no_implicit_shared_normative_authority_from_developer_tools: true
    implementation_authorization_granted_by_policy_sync: false
    branch_creation_authorized: false
relations:
  supersedes: []
  amends: []
  extends: []
  depends_on: []
transition:
  target_status: ACTIVE
  state: COMPLETE
  requirements:
  - id: TR-001
    type: PROJECT_OWNER_GO_AUTOMATION_POLICY_ADMISSION
    state: SATISFIED
    refs:
    - developer/policy/approvals/MPA-20261006-GO-CHANGE-0004-ACTIVE.yaml
    next_action:
      action: VERIFY_GO_AUTOMATION_CUTOVER
      execution: SERIAL_REQUIRED
      completion_check: POLICY_ADMISSION_DOES_NOT_IMPLY_IMPLEMENTATION_COMPLETION
