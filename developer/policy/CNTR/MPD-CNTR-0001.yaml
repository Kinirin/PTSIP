schema_version: ptsip-developer-root-family-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: CNTR
policy:
  id: MPD-CNTR-0001
  title: CNTR authority (ACTIVE source responsibilities)
  status: ACTIVE
  version: '2.0'
authority_subject:
  id: DEV_AUTOMATION_INTERFACE_OBLIGATIONS
  statement: 개발 resolver, IWP, command plane 및 검증 자동화가 호출자와 맺는 입력, 출력, 오류 및 호환 의무를
    소유한다.
exclusive_kernel:
- DEV_AUTOMATION_REQUEST_RESULT_CONTRACT
- DEV_INTERFACE_COMPATIBILITY_COMMITMENT
rules:
  family_definition:
    kernel_definitions:
    - id: DEV_AUTOMATION_REQUEST_RESULT_CONTRACT
      statement: 호출 가능한 command vocabulary, typed 입력과 출력, 오류 의미 및 precondition/postcondition
        약속을 명시한다.
      non_substitutability: INFO의 내부 데이터 모델만으로 외부 호출에 허용된 command와 결과 약속을 만들 수 없다.
    - id: DEV_INTERFACE_COMPATIBILITY_COMMITMENT
      statement: 개발 자동화 인터페이스의 보장 범위와 호환성 약속을 정하고 미등록 command나 추측 fallback이 계약이 되는
        것을 금지한다.
      non_substitutability: CHANGE가 전환 일정을 정하거나 REAL이 편의 기능을 구현해도 계약상 지원 의무가 자동으로
        생기지 않는다.
    source_scope:
    - MPD-0001
    - MPD-0010
    - MPD-0014
    - MPD-0015
    - MPD-SPEC-0006
    - MPD-SPEC-0007
    - MPD-SPEC-0021
    - MPD-SPEC-0025
    - MPD-VERI-0004
  unit_mpd_0001_394f16f8e8c8:
    loader: developer/automation/policy_loader.py
    policy_validator: developer/automation/policy_validator.py
    planning:
      root: developer/automation/planning/
      entry_resolver: developer/automation/planning/planning_entry_resolver.py
      validator: developer/automation/planning/planning_validator.py
      stage_finalizer: developer/automation/planning/planning_stage_finalizer.py
      extension_finalizer: developer/automation/planning/planning_extension_finalizer.py
      leaf_merge: developer/automation/planning/planning_leaf_merge.py
      merge_reconciler: developer/automation/planning/planning_merge_reconciler.py
    policy_plan_binding:
      root: developer/automation/policy_plan_binding/
    current_dependency_gate: developer/automation/current_dependency_gate.py
    transition_evaluator: developer/automation/transition_evaluator.py
  unit_mpd_0010_a352aeef1624: APPROVED
  unit_mpd_0010_d3321af4d08d: REPOSITORY_TRIAL
  unit_mpd_0010_6a8bfa4fc46a: REDUCE_CODING_AGENT_ENTRY_INFERENCE_WITH_LOW_DIFFICULTY_MACHINE_ROUTING
  unit_mpd_0010_951f7d0a9910: FORBIDDEN
  unit_mpd_0010_84d3056c0f72: NOT_AUTHORIZED
  unit_mpd_0010_e3648d889e5e: true
  unit_mpd_0010_1a1ded8f6e50: LOCAL_CLI_ONLY
  unit_mpd_0010_cf1cf677bb81: true
  unit_mpd_0010_8c4943001024: STDIO
  unit_mpd_0010_2f902a371ae6: false
  unit_mpd_0010_2fc2f0184767: false
  unit_mpd_0010_cd2d703ea855: false
  unit_mpd_0010_dcf4d9aa4edb: true
  unit_mpd_0010_b9dc8d1b0f13: FORBIDDEN
  unit_mpd_0010_e1b3d9d451a5: NOT_AVAILABLE
  unit_mpd_0010_495d6dd54d4f: ABSENT
  unit_mpd_0010_1dd36e23033b: false
  unit_mpd_0010_bef56b8c5b40: python -m developer.automation.agent_integration install-mcp
    --user-approved
  unit_mpd_0010_4af236e21b78:
    state: READY
    resolver_command: python -m developer.automation.agent_instruction_entry_resolver
      <READ|MODIFY|PLAN|VERIFY|RELEASE>
  unit_mpd_0010_643f3ad3e527: true
  unit_mpd_0010_166beaafa334: true
  unit_mpd_0010_4fba394eb019:
    next_level_input: CURRENT_LEVEL_PASS_SUBSET_ONLY
    next_level_payload: PASS_HEADER_PLUS_MACHINE_FIELDS_PLUS_REMAINING_NATURAL_RESIDUAL
    rerun_previous_passed_level: FORBIDDEN
    machine_resolved_fragments_must_not_remain_in_next_natural_reasoning_input: true
    unresolved_remains_natural_language_at_current_level: true
    unresolved_is_direct_next_level_candidate: false
    unresolved_may_transition_to_pass_when_current_level_becomes_exactly_classifiable: true
    pass_transition_immediately_creates_next_level_candidate: true
    unresolved_blocks_other_passed_atoms: false
    current_level_unresolved_zero_required_for_next_level: false
    next_level_candidate_set_is_dynamic: true
  unit_mpd_0010_804417a00130: false
  unit_mpd_0014_2636c6da29a8:
    allowed: GITHUB_CREATE_BRANCH_API
    direct_api_use_authorized: true
    caller_must_run_branch_creation_guard_first: true
    canonical_command_plane: developer/automation/branch_control.py
    branch_operations_must_enter_through_command_plane: true
    unregistered_command: FAIL_CLOSED
    out_of_plane_branch_operation: MANAGEMENT_INTENT_DEVIATION_SIGNAL
    registered_commands:
    - COMMANDS
    - LIST
    - INSPECT
    - CREATE
    - RECREATE
    recreate_semantics:
      authorization_source: USER_EXPLICIT
      exact_user_approved_name_required: true
      require_existing_branch: true
      require_existing_branch_fully_contained_in_base_ref: true
      delete_existing_ref_before_creation: true
      refresh_base_ref_before_creation: true
      verify_recreated_ref_matches_base_ref: true
      rollback_original_ref_on_creation_failure: true
    forbidden:
    - GIT_PUSH_BRANCH_CREATION
    - GIT_SWITCH_CREATE
    - GIT_CHECKOUT_CREATE
    - GIT_UPDATE_REF
    - GITHUB_UPDATE_REF_API
    - WORKFLOW_REF_CREATION
  unit_mpd_0015_6f37556a3bbc:
    objective: REDUCE_REPEATED_AI_REASONING_BY_REUSING_VERIFIED_MACHINE_RESOLUTIONS
    semantic_responsibility:
      roles_must_be_distinguishable_when_present: true
      roles_may_include:
      - RULE
      - CONDITION
      - OPERATION
      - FAILURE
      - CAPABILITY
      - CONFORMANCE
      independent_file_per_role_required: false
      independent_contract_per_role_required: false
      domain_or_semantic_unit_grouping_allowed: true
    explicit_binding:
      previously_decided_reusable_relationships_should_be_machine_explicit: true
      current_explicit_binding_must_precede_repeated_semantic_inference: true
      repeated_ai_reinference_when_current_binding_resolves_exactly: FORBIDDEN
    deterministic_resolver:
      purpose: RESOLVE_EXISTING_DECISIONS
      may_create_new_normative_meaning: false
      resolution_basis:
      - REGISTERED_IDENTITY
      - EXPLICIT_MACHINE_BINDING
      deterministic_resolution_precedes_ai_reasoning: true
    unresolved_resolution:
      bounded_ai_reasoning_allowed: true
      ai_result_role: CANDIDATE
      ai_candidate_is_normative_authority: false
      candidate_may_become_reusable_only_after_applicable_validation_and_authority_rules: true
      verified_or_approved_reusable_resolution_may_be_materialized_as:
      - MACHINE_CONTRACT
      - MACHINE_BINDING
    automatic_plan:
      preferred_inputs:
      - RESOLVED_FACTS
      - MACHINE_BINDINGS
      - MACHINE_CONTRACTS
      machine_derivation_preferred_when_inputs_are_sufficiently_resolved: true
      analysis_uncertainty_allowed: true
      unresolved_authority_may_be_invented: false
      mutation_may_proceed_without_required_approved_semantics: false
  unit_mpd_0015_8c9c31aedf17:
    purpose: BOUND_MPD_0015_DEVELOPER_POLICY_APPLICATION_WITHOUT_SEMANTIC_SCOPE_GUESSING
    registration:
      initial_scope_or_file_registration_requires_explicit_human_decision: true
      automatic_semantic_scope_discovery: FORBIDDEN
      semantic_similarity_scope_mapping: FORBIDDEN
      registered_binding_resolution_may_be_automatic: true
      new_unregistered_scope_remains_unbound_until_explicitly_registered: true
    inherited_directory_scopes:
    - path: src/agent_contracts
      operations:
      - PLAN
      - MODIFY
      - VERIFY
