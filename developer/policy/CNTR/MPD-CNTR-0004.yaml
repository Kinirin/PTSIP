schema_version: ptsip-developer-root-family-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: CNTR
policy:
  id: MPD-CNTR-0004
  version: '2.0'
  title: Direct Root policy Go automation interface
  status: ACTIVE
authority_subject:
  id: DEV_AUTOMATION_INTERFACE_OBLIGATIONS
  statement: 개발 resolver, IWP, command plane 및 검증 자동화가 호출자와 맺는 입력, 출력, 오류 및 호환 의무를
    소유한다.
exclusive_kernel:
- DEV_AUTOMATION_REQUEST_RESULT_CONTRACT
- DEV_INTERFACE_COMPATIBILITY_COMMITMENT
rules:
  family_definition:
    kernel_definitions:
    - id: DEV_AUTOMATION_REQUEST_RESULT_CONTRACT
      statement: 호출 가능한 command vocabulary, typed 입력과 출력, 오류 의미 및 precondition/postcondition
        약속을 명시한다.
      non_substitutability: INFO의 내부 데이터 모델만으로 외부 호출에 허용된 command와 결과 약속을 만들 수 없다.
    - id: DEV_INTERFACE_COMPATIBILITY_COMMITMENT
      statement: 개발 자동화 인터페이스의 보장 범위와 호환성 약속을 정하고 미등록 command나 추측 fallback이 계약이 되는
        것을 금지한다.
      non_substitutability: CHANGE가 전환 일정을 정하거나 REAL이 편의 기능을 구현해도 계약상 지원 의무가 자동으로
        생기지 않는다.
    source_scope: []
  direct_root_automation_contract:
    contract_ref: developer/policy/contracts/go-automation-cutover.v1.json
    resolver_contract_ref: developer/policy/contracts/go-policy-resolver.v1.yaml
    policy_reference_model: EXACT_ROOT_POLICY_ID_AND_SECTION
    legacy_policy_id_fallback: FORBIDDEN
    legacy_policy_body_read: FORBIDDEN
    authority_owner: LANGUAGE_NEUTRAL_MACHINE_CONTRACT
    go_source_owns_normative_semantics: false
    support_authority_inheritance: FORBIDDEN
relations:
  supersedes: []
  amends: []
  extends: []
  depends_on: []
transition:
  target_status: ACTIVE
  state: COMPLETE
  requirements:
  - id: TR-001
    type: PROJECT_OWNER_GO_AUTOMATION_POLICY_ADMISSION
    state: SATISFIED
    refs:
    - developer/policy/approvals/MPA-20261006-GO-CNTR-0004-ACTIVE.yaml
    next_action:
      action: VERIFY_GO_AUTOMATION_CUTOVER
      execution: SERIAL_REQUIRED
      completion_check: POLICY_ADMISSION_DOES_NOT_IMPLY_IMPLEMENTATION_COMPLETION
