schema_version: ptsip-legacy-decision-reference-routing/v1
policy_class: PTSIP_DEVELOPER_POLICY
source_inventory: developer/policy/legacy-decisions-inventory.yaml

routing_principles:
  split_relation_requires_explicit_route: true
  unique_to_unique_relation_may_project_deterministically: true
  unregistered_split_relation: FAIL_CLOSED
  textual_reference_is_not_dependency: true

id_routes:
  ADR-0001:
    targets: [SFP-0001]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0002:
    targets: [SFP-0002]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0003:
    targets: [SFP-0003, MPD-0002]
    textual_reference_mode: MANUAL_CONTEXT_REVIEW
  ADR-0004:
    targets: [SFP-0004]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0005:
    targets: [SFP-0005, MPD-0003]
    textual_reference_mode: MANUAL_CONTEXT_REVIEW
  ADR-0006:
    targets: [SFP-0006]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0007:
    targets: [SFP-0007]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0008:
    targets: [SFP-0008]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0009:
    targets: [SFP-0009]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0010:
    targets: [SFP-0010]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0011:
    targets: [SFP-0011, MPD-0004]
    textual_reference_mode: MANUAL_CONTEXT_REVIEW
  ADR-0012:
    targets: [SFP-0012]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0013:
    targets: [SFP-0013]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0014:
    targets: [SFP-0014]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0015:
    targets: [SFP-0015]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0016:
    targets: [SFP-0016]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0017:
    targets: [SFP-0017, MPD-0005]
    textual_reference_mode: MANUAL_CONTEXT_REVIEW
  ADR-0018:
    targets: [MPD-0008]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0019:
    targets: [SFP-0018]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0020:
    targets: [MPD-0009]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0021:
    targets: [SFP-0019, MPD-0006]
    textual_reference_mode: MANUAL_CONTEXT_REVIEW
  ADR-0022:
    targets: [SFP-0020]
    textual_reference_mode: AUTO_SINGLE_TARGET
  ADR-0023:
    targets: [SFP-0021, MPD-0007]
    textual_reference_mode: MANUAL_CONTEXT_REVIEW

relation_routes:
  - source_adr: ADR-0008
    relation: depends_on
    target_adr: ADR-0007
    scope: PRIMARY_LIFECYCLE_ONTOLOGY
    projected_edges:
      - {source: SFP-0008, target: SFP-0007}

  - source_adr: ADR-0009
    relation: depends_on
    target_adr: ADR-0007
    scope: PRIMARY_LIFECYCLE_ONTOLOGY
    projected_edges:
      - {source: SFP-0009, target: SFP-0007}

  - source_adr: ADR-0009
    relation: depends_on
    target_adr: ADR-0008
    scope: RESPONSIBILITY_MAP_SEMANTIC_AXES
    projected_edges:
      - {source: SFP-0009, target: SFP-0008}

  - source_adr: ADR-0011
    relation: depends_on
    target_adr: ADR-0010
    scope: PROFILE_TRANSITION_SEMANTICS
    projected_edges:
      - {source: SFP-0011, target: SFP-0010}
      - {source: MPD-0004, target: SFP-0010}

  - source_adr: ADR-0017
    relation: amends
    target_adr: ADR-0011
    scope: REPOSITORY_SELF_ADOPTION_ASSUMPTION
    projected_edges:
      - {source: MPD-0005, target: MPD-0004}
textual_reference:
  eligible_extensions: [.md, .txt, .rst]
  single_target_rewrite: AUTO_CANONICAL_TARGET
  split_target_rewrite: FORBIDDEN
  split_review_registry: developer/policy/split-textual-reference-review.yaml
  split_review_granularity: OCCURRENCE
  manual_resolution_vocabulary:
    - SFP_ONLY
    - MPD_ONLY
    - BOTH
    - REMOVE_REFERENCE
  unresolved_split_reference_blocks_legacy_removal: true
  unmapped_adr_behavior: FAIL_CLOSED
