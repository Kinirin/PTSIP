schema_version: ptsip-developer-root-family-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: REAL
policy:
  id: MPD-REAL-0005
  version: '2.0'
  title: Mandatory Go implementation for all Developer automation
  status: ACTIVE
authority_subject:
  id: DEV_APPROVED_ARTIFACT_REALIZATION
  statement: 선택된 설계와 명시적으로 허용된 변경 대상을 코드, 정책 표현 및 생성 Artifact로 실제 구현하는 의미 보존 절차를 소유한다.
exclusive_kernel:
- DEV_IMPLEMENTATION_AND_MATERIALIZATION
- DEV_MUTATION_INTEGRITY
rules:
  family_definition:
    kernel_definitions:
    - id: DEV_IMPLEMENTATION_AND_MATERIALIZATION
      statement: 해결된 target과 입력을 사용해 코드와 결정론적 Artifact를 구현·materialize하고 선언된 의미 및
        provenance를 보존한다.
      non_substitutability: INTENT의 목표나 ARCH의 설계 선언만으로 실제 구현 절차와 생성 결과가 존재하게 되지 않는다.
    - id: DEV_MUTATION_INTEGRITY
      statement: 허용된 파일 변경의 적용 단위, 원자성 및 실패 시 보존 조건을 정하고 예상하지 않은 overwrite와 부분 적용을
        방지한다.
      non_substitutability: CTRL이 변경을 허용했다는 판정은 실제 쓰기의 원자성과 실패 처리를 대신 보장하지 않는다.
    source_scope: []
  go_automation_implementation:
    scope_root: developer/automation
    inherit_to_descendants: true
    implementation_language: GO
    existing_implementations: MIGRATE_ALL_TO_GO
    new_or_modified_python_automation: FORBIDDEN
    python_automation_entrypoints: REMOVE_AFTER_EQUIVALENCE_VERIFICATION
    go_wrapper_delegating_to_python_automation: FORBIDDEN
    embedded_python_implementation: FORBIDDEN
    language_neutral_contracts_remain_authority: true
    root_and_src_neutral_module_policy_ref: MPD-REAL-0004
    existing_python_regression_coverage: PRESERVE_SEMANTIC_COVERAGE
    migration_contract_ref: developer/policy/contracts/go-automation-cutover.v1.json
relations:
  supersedes: []
  amends: []
  extends: []
  depends_on: []
transition:
  target_status: ACTIVE
  state: COMPLETE
  requirements:
  - id: TR-001
    type: PROJECT_OWNER_GO_AUTOMATION_POLICY_ADMISSION
    state: SATISFIED
    refs:
    - developer/policy/approvals/MPA-20261006-GO-REAL-0005-ACTIVE.yaml
    next_action:
      action: VERIFY_GO_AUTOMATION_CUTOVER
      execution: SERIAL_REQUIRED
      completion_check: POLICY_ADMISSION_DOES_NOT_IMPLY_IMPLEMENTATION_COMPLETION
