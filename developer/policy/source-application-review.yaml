schema_version: ptsip-source-application-review/v1
artifact_class: PTSIP_DEVELOPER_POLICY_SOURCE_REVIEW
authority: false
canonical_source_registry_ref: developer/policy/registries/governance-source-registry.yaml

policy_query_list:
  - policy_id: MPD-0001
    expected_status: ACTIVE
    sections:
      - planning_boundary
    reason: Planning lifecycle, approval, and implementation authorization are separate responsibilities.

  - policy_id: MPD-0010
    expected_status: ACTIVE
    sections:
      - identity_and_resolution
      - management_policy_identity_lifecycle_preflight
      - provisional_resolution_framework
      - governance_source_vocabulary
    reason: Canonical owner of source vocabulary, provisional resolution, identity, and inference boundaries.

  - policy_id: MPD-0011
    expected_status: ACTIVE
    sections:
      - authority_semantics
      - transition_generation
      - reconciliation_safety
    reason: Contains explicit project-owner decision requirements and derived transition semantics.

  - policy_id: MPD-0012
    expected_status: ACTIVE
    sections:
      - authority_semantics
      - approved_decisions
      - provisional_decisions
    reason: Approved decisions are operational authority; provisional and deferred decisions remain explicitly non-authoritative.

  - policy_id: MPD-0013
    expected_status: ACTIVE
    sections:
      - authority_separation
      - policy_plan_binding_authority
      - deferred_relation_lifecycle_semantics
    reason: Separates Policy, Planning, Binding, and implementation authority planes.

artifact_review_list:
  - path: developer/policy/schemas/policy-approval-provenance.schema.json
    classification: GOVERNANCE_SOURCE_ADOPTED
    target_role: DECISION_SOURCE

  - path: developer/policy/approvals/
    classification: GOVERNANCE_SOURCE_ADOPTED
    target_role: DECISION_SOURCE

  - path: developer/policy/registries/authorization-transition-registry.yaml
    classification: GOVERNANCE_SOURCE_ADOPTED
    target_role: AUTHORIZATION_SOURCE_AND_TRANSITION_SOURCE

  - path: developer/planning/schemas/work-unit.schema.json
    classification: GOVERNANCE_SOURCE_ADOPTED
    target_role: APPROVAL_SOURCE_AND_AUTHORIZATION_SOURCE

  - path: developer/planning/schemas/plan-extension.schema.json
    classification: GOVERNANCE_SOURCE_ADOPTED
    target_role: APPROVAL_SOURCE_AND_AUTHORIZATION_SOURCE

  - path: developer/planning/schemas/planning-index.schema.json
    classification: GOVERNANCE_SOURCE_ADOPTED
    target_role: APPROVAL_SOURCE_AND_AUTHORIZATION_SOURCE

  - path: developer/planning/migrations/MPD-0001-planning-subsystem-migration.yaml
    classification: GOVERNANCE_SOURCE_ADOPTED
    target_role: AUTHORIZATION_SOURCE

  - path: developer/automation/implementation_workflows.schema.json
    classification: SOURCE_KEY_HAS_NON_GOVERNANCE_MEANING
    target_role: NONE

excluded_existing_source_semantics:
  - location: developer/policy/MPD-0010.yaml#rules.agent_instruction_entry_taxonomy_trial.level_1_bootstrap.source
    meaning: FILE_SOURCE
  - location: developer/policy/MPD-0010.yaml#rules.agent_instruction_entry_taxonomy_trial.unresolved_reassessment.source
    meaning: FILE_SOURCE
  - location: developer/policy/MPD-0011.yaml#rules.commit_candidate_trigger.release.source
    meaning: VERIFICATION_REVISION_SOURCE
  - location: developer/automation/implementation_workflows.yaml#tasks.*.watch_inputs.*.source
    meaning: DATA_SOURCE

migration_order:
  - ESTABLISH_SOURCE_REGISTRY
  - VALIDATE_POLICY_QUERY_LIST
  - DECISION_SOURCE_TO_POLICY_APPROVAL_PROVENANCE_ADOPTED
  - AUTHORIZATION_TRANSITION_SOURCE_ADOPTED
  - PLANNING_APPROVAL_AND_AUTHORIZATION_SOURCE_ADOPTED
  - LEGACY_PLANNING_GOVERNANCE_SOURCE_NORMALIZED
  - ADD_DERIVED_PROJECTIONS_ONLY_AFTER_CANONICAL_FIELDS_EXIST
