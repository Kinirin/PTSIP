schema_version: ptsip-developer-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY

policy:
  id: MPD-0015
  title: Language-Neutral Normative Authority and Implementation Migration
  status: ACTIVE

rules:
  mechanized_resolution_cycle:
    objective: REDUCE_REPEATED_AI_REASONING_BY_REUSING_VERIFIED_MACHINE_RESOLUTIONS

    semantic_responsibility:
      roles_must_be_distinguishable_when_present: true
      roles_may_include:
        - RULE
        - CONDITION
        - OPERATION
        - FAILURE
        - CAPABILITY
        - CONFORMANCE
      independent_file_per_role_required: false
      independent_contract_per_role_required: false
      domain_or_semantic_unit_grouping_allowed: true

    explicit_binding:
      previously_decided_reusable_relationships_should_be_machine_explicit: true
      current_explicit_binding_must_precede_repeated_semantic_inference: true
      repeated_ai_reinference_when_current_binding_resolves_exactly: FORBIDDEN

    deterministic_resolver:
      purpose: RESOLVE_EXISTING_DECISIONS
      may_create_new_normative_meaning: false
      resolution_basis:
        - REGISTERED_IDENTITY
        - EXPLICIT_MACHINE_BINDING
      deterministic_resolution_precedes_ai_reasoning: true

    unresolved_resolution:
      bounded_ai_reasoning_allowed: true
      ai_result_role: CANDIDATE
      ai_candidate_is_normative_authority: false
      candidate_may_become_reusable_only_after_applicable_validation_and_authority_rules: true
      verified_or_approved_reusable_resolution_may_be_materialized_as:
        - MACHINE_CONTRACT
        - MACHINE_BINDING

    automatic_plan:
      preferred_inputs:
        - RESOLVED_FACTS
        - MACHINE_BINDINGS
        - MACHINE_CONTRACTS
      machine_derivation_preferred_when_inputs_are_sufficiently_resolved: true
      analysis_uncertainty_allowed: true
      unresolved_authority_may_be_invented: false
      mutation_may_proceed_without_required_approved_semantics: false

  execution_feedback_cycle:
    work_execution_lifecycle_ref: MPD-WORK-0002
    cycle:
      - AUTOMATIC_PLAN
      - EXECUTION
      - STRUCTURED_RESULT
      - OBSERVABLE_EVIDENCE
      - MECHANICAL_VERIFICATION
      - STATE_PROJECTION
      - RERESOLUTION

    execution_output:
      observable_evidence_required: true

    verification:
      expected_vs_observed_required: true
      verification_result_must_be_machine_readable: true

    state_boundary:
      exact_runtime_persistence_path_fixed_by_this_policy: false
      state_projection_is_normative_authority: false
      state_may_propagate_existing_verified_facts_only: true

  reasoning_promotion_cycle:
    objective: TURN_VERIFIED_REPEATED_REASONING_INTO_REUSABLE_MACHINE_RESOLUTION

    entry_conditions:
      - DETERMINISTIC_RESOLUTION_UNAVAILABLE
      - VERIFIED_EXECUTION_DEVIATION_REQUIRING_NEW_RESOLUTION

    flow:
      - BOUNDED_AI_REASONING
      - CANDIDATE
      - VALIDATION
      - AUTHORITY_BOUNDARY
      - REUSABLE_MACHINE_RESOLUTION
      - DETERMINISTIC_RESOLVER_REUSE

    candidate:
      normative_authority: false
      implementation_success_is_promotion_authority: false
      test_success_is_promotion_authority: false
      model_confidence_is_promotion_authority: false

    promotion:
      applicable_validation_required: true
      applicable_authority_rules_required: true
      reusable_targets:
        - MACHINE_CONTRACT
        - MACHINE_BINDING
      promoted_resolution_must_preserve_source_and_authority_provenance: true

    reuse:
      current_promoted_resolution_should_precede_new_ai_reasoning: true
      repeat_reasoning_for_same_current_resolved_case: FORBIDDEN
      revalidation_may_reopen_resolution_when_contract_binding_capability_or_evidence_changes: true

  developer_policy_resolution_binding_boundary:
    purpose: BOUND_MPD_0015_DEVELOPER_POLICY_APPLICATION_WITHOUT_SEMANTIC_SCOPE_GUESSING

    registration:
      initial_scope_or_file_registration_requires_explicit_human_decision: true
      automatic_semantic_scope_discovery: FORBIDDEN
      semantic_similarity_scope_mapping: FORBIDDEN
      registered_binding_resolution_may_be_automatic: true
      new_unregistered_scope_remains_unbound_until_explicitly_registered: true

    inherited_directory_scopes:
      - path: src/agent_contracts
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/agent_contracts
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/migration
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/repository
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/validation
        operations: [MODIFY, VERIFY]
      - path: developer/automation/planning
        operations: [PLAN, MODIFY, VERIFY]
      - path: developer/state
        operations: [PLAN, MODIFY, VERIFY]
      - path: tests/ptsip/agent_contracts
        operations: [MODIFY, VERIFY]
      - path: tests/ptsip/conformance
        operations: [MODIFY, VERIFY]
      - path: tests/ptsip/migration
        operations: [MODIFY, VERIFY]
      - path: tests/ptsip/repository
        operations: [MODIFY, VERIFY]
      - path: tests/ptsip/validation
        operations: [MODIFY, VERIFY]

    exact_file_scopes:
      - path: developer/automation/policy_resolver.py
        operations: [PLAN, MODIFY, VERIFY]
      - path: developer/automation/repository_state_resolver.py
        operations: [PLAN, MODIFY, VERIFY]
      - path: developer/automation/implementation_work_packet.py
        operations: [PLAN, MODIFY, VERIFY]
      - path: developer/automation/implementation_workflows.yaml
        operations: [PLAN, MODIFY, VERIFY]
      - path: developer/automation/implementation_workflows.schema.json
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/conformance.py
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/conformance_engine.py
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/conformance_audit.py
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/validation_capture.py
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/artifact_evidence.py
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/lifecycle_evidence.py
        operations: [PLAN, MODIFY, VERIFY]
      - path: src/ptsip/review_evidence.py
        operations: [PLAN, MODIFY, VERIFY]
      - path: developer/policy/MPD-0015.yaml
        operations: [PLAN, MODIFY, VERIFY]
      - path: pyproject.toml
        operations: [MODIFY, VERIFY]

    explicitly_not_inherited_roots:
      - src/ptsip
      - developer/automation
      - tests/ptsip
      - .github
      - .ptsip

    inheritance_boundary:
      descendant_inheritance_applies_only_to_registered_directory_scopes: true
      exact_file_scope_does_not_expand_to_siblings: true
      parent_root_presence_does_not_imply_mpd_0015_applicability: true

  implementation_language:
    allowed_language_set: OPEN
    python_only: false
    go_only: false
    python_and_go_only: false

  canonical_runtime:
    go_role: CANONICAL_RUNTIME_CANDIDATE
    go_is_normative_authority: false

  python_migration_reference:
    applies_to_behavior_not_yet_extracted_to_machine_contract: true
    role: MIGRATION_REFERENCE
    permanent_normative_authority: false

  implementation_authorization:
    policy_approval_authorizes_runtime_migration: false
    policy_approval_authorizes_python_removal: false
    separate_planning_and_user_authorization_required: true

relations:
  supersedes: []
  amends: []
  extends: []
  depends_on:
    - policy: MPD-SPEC-0021
      scope: LANGUAGE_NEUTRAL_NORMATIVE_AUTHORITY
    - policy: MPD-SPEC-0022
      scope: CONTRACT_ARTIFACT_REPRESENTATION
    - policy: MPD-WORK-0002
      scope: EXECUTION_LIFECYCLE_AND_RESULT_HANDOFF
