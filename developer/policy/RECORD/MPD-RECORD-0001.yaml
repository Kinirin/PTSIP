Policy_Identity:
  id: MPD-RECORD-0001
  policy_kind: PTSIP_DEVELOPER_POLICY
  root_family: RECORD
  title: RECORD responsibilities and policy document orchestration
Policy_Status:
  Policy_Status_Schema_ver: '1'
  status: APPROVED.Unresolved
  contract: urn:ptsip:contract:policy:record:responsibility:orchestration
Policy_Rules:
  Identity:
    contract_id: urn:ptsip:policy:rule:record:responsibility-orchestration
    Rule_ver: '1'
  Definition:
  - id: R-ID-2791BF0E5A354FC58D837882A10BD867
    rule: RECORD-ORCHESTRATION
  Boundary:
    scope: RECORD responsibilities and subordinate policy boundaries for decision and document records in the Kinirin/PTSIP developer control plane
    subjects:
    - RECORD describes and separates the responsibilities for decisions concerning policy documents, decisions concerning work-plan documents, and release-note records.
    - This orchestration policy makes RECORD responsibilities and roles explicit so that users and AI agents can assess and recommend a suitable Root Family when policy classification is ambiguous.
    - MPD-RECORD-0002 owns policy-decision recording, MPD-RECORD-0003 owns work-plan decision recording, and MPD-RECORD-0004 owns release-note recording.
    - The orchestration document connects subordinate responsibilities without concentrating every recording method and detailed contract in one policy.
    - This revision follows the user's new declaration of 2026-11-01. Historical implementation observations, earlier plans, approval history, and the provisional contract candidate are not inherited wholesale as new normative content.
    exclusions:
    - GOV retains responsibility for the legitimacy of policy decisions and approvals and the scope of delegation. RECORD recording responsibilities and Family recommendations do not replace GOV.
    - Using a Family recommendation to automatically settle unresolved classification, routing, lifecycle status, or execution authority.
    - Consumer-repository PTSIP feature declarations, implementation, and activation are outside this developer-policy revision and remain a separate Support Feature follow-up.
  Evaluation:
    criteria:
      evidence:
      - Review whether the orchestration policy states RECORD responsibilities, roles, and subordinate document boundaries explicitly.
      - Review whether policy decisions, work-plan decisions, and release-note records have separate responsibilities.
      - Review whether Family recommendations remain distinct from policy authority and machine routing.
  title: RECORD responsibilities and policy document orchestration
