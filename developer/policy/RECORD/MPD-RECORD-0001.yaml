schema_version: ptsip-developer-root-family-policy/v1
policy_class: PTSIP_DEVELOPER_POLICY
responsibility_family: RECORD
policy:
  id: MPD-RECORD-0001
  title: RECORD authority (ACTIVE source responsibilities)
  status: ACTIVE
  version: '2.0'
authority_subject:
  id: DEV_DECISION_AND_EXECUTION_PROVENANCE
  statement: 개발 결정, 승인, 작업 실행 및 검증 사건의 출처와 exact revision 결합, 감사 가능성과 역사적 보존을 소유한다.
exclusive_kernel:
- DEV_EVENT_PROVENANCE_AND_SOURCE_BINDING
- DEV_HISTORY_RETENTION_AND_TRACEABILITY
rules:
  family_definition:
    kernel_definitions:
    - id: DEV_EVENT_PROVENANCE_AND_SOURCE_BINDING
      statement: 개발 기록에 subject, 수행 주체, 승인 근거, source SHA, 시점과 결과 출처를 결합하고 다른 revision의
        증거를 혼합하지 않는다.
      non_substitutability: ASSURE의 판정이나 GOV의 결정만으로 그 사건의 재확인 가능한 provenance가 보존되지
        않는다.
    - id: DEV_HISTORY_RETENTION_AND_TRACEABILITY
      statement: 원본 검증 로그, receipt와 완료 산출물의 보존·조회 및 이력 연결을 정한다. 과거 기록을 현재 권한이나 현재
        PASS로 승격하지 않는다.
      non_substitutability: INFO의 현재 canonical 레코드나 OPS의 회복 상태가 역사적 사건의 원본 출처와 보존을
        대체하지 못한다.
    source_scope:
    - MPD-0010
    - MPD-0011
    - MPD-0012
    - MPD-RELS-0001
    - MPD-WORK-0002
