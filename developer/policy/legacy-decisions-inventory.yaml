schema_version: ptsip-legacy-decision-inventory/v1
policy_class: PTSIP_DEVELOPER_POLICY

source:
  directory: decisions/
  index: decisions/INDEX.yaml
  record_count: 23
  id_pattern: '^ADR-[0-9]{4}$'

classification_vocabulary:
  - MPD
  - SFP
  - SPLIT
  - RETIRE

projection_rules:
  SFP:
    destination: src/ptsip/specdata/SFP-*.yaml
    preserve:
      - authority_contract
      - authority_semantics
    drop_legacy_developer_wrappers:
      - authority_role
      - subject_binding
      - representation_migration
    repository_binding_must_not_be_copied: true
    distribution: REQUIRED
  MPD:
    destination: developer/policy/MPD-*.yaml
    transform_source_semantics_into_developer_policy_rules: true
    repository_specific_semantics_allowed: true
    distribution: FORBIDDEN
  SPLIT:
    field_level_route_required: true
    unassigned_semantic_field_forbidden: true
    cross_product_projection_forbidden: true
  RETIRE:
    active_policy_materialization: NONE
    retain_provenance_in_inventory_and_git_history: true

summary:
  MPD: 2
  SFP: 15
  SPLIT: 6
  RETIRE: 0
  total: 23
  planned_sfp_targets: 21
  planned_mpd_targets: 5
  retired_fragments: 3

