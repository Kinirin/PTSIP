    source_path: decisions/AUTHORITY-SCHEMA-REGISTRY.yaml
    sfp_target: src/ptsip/specdata/ptsip-support-authority-schema-registry.yaml
    mpd_target: developer/policy/registries/authority-schema-registry.yaml
    routing: ADR_OUTPUT_AND_SEMANTIC_FIELD_PROJECTION
  - id: AUTHORITY_ROLE_REGISTRY
    source_path: decisions/AUTHORITY-ROLE-REGISTRY.yaml
