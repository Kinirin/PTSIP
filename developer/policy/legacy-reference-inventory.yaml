    source_type: LEGACY_ADR
    source_revision_anchor: 5ac6e8f23c5adaa58a4dd8c45b610afea376990c
    source_revision_anchor_materialized_in_policy_records: false
    cleanup_action: REMOVE_LEGACY_POLICY_PROVENANCE_WITHOUT_REVISION_RETENTION
  support_policy_source_path_schema:
