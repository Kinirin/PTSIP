      responsibilities:
        - COMPONENT_CLASSIFICATION_ROLE_AND_SELECTOR
        - COMPONENT_COMMON_PROPERTIES
        - PTSIP_CORE_SELECTOR_RECURSION_BOUNDARY
        - COMPONENT_RELATIONSHIP_CONTRACT
    - target_policy: MPD-MIGR-0003
      responsibilities:
        - PROJECT_PROFILE_VERSION_MIGRATION_AUTHORITY_REFERENCE
        - PROJECT_PROFILE_VERSION_MIGRATION_AUTHORIZATION_GATE
        - PROJECT_PROFILE_VERSION_MIGRATION_DEFAULT_FORBIDDEN_STATE

relations:
