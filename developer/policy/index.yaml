schema_version: ptsip-developer-policy-index/v1
policy_class: PTSIP_DEVELOPER_POLICY

policies:
  - id: MPD-0001
    path: developer/policy/MPD-0001.yaml
    status: ACTIVE
  - id: MPD-0002
    path: developer/policy/MPD-0002.yaml
    status: ACTIVE
  - id: MPD-0003
    path: developer/policy/MPD-0003.yaml
    status: ACTIVE
  - id: MPD-0004
    path: developer/policy/MPD-0004.yaml
    status: ACTIVE
  - id: MPD-0005
    path: developer/policy/MPD-0005.yaml
    status: ACTIVE
  - id: MPD-0006
    path: developer/policy/MPD-0006.yaml
    status: ACTIVE
  - id: MPD-0007
    path: developer/policy/MPD-0007.yaml
    status: ACTIVE
  - id: MPD-0008
    path: developer/policy/MPD-0008.yaml
    status: ACTIVE
  - id: MPD-0009
    path: developer/policy/MPD-0009.yaml
    status: ACTIVE

legacy_decisions_migration:
  source_path: decisions/
  legacy_id_pattern: '^ADR-[0-9]{4}$'
  target_classes:
    - MPD
    - SFP
    - SPLIT
    - RETIRE
  state: RUNTIME_BOUNDARY_COMPLETE_REFERENCE_SCAN_PENDING
  inventory_path: developer/policy/legacy-decisions-inventory.yaml
  inventory_schema: developer/policy/schemas/legacy-decision-inventory.schema.json
  reference_routing: developer/policy/legacy-decision-reference-routing.yaml
  reference_routing_schema: developer/policy/schemas/legacy-decision-reference-routing.schema.json
  automatic_removal:
    preauthorized: true
    confirmation_required_when_ready: false
    action_when_ready: REMOVE_FROM_ACTIVE_TREE
    required_predicates:
      ALL_LEGACY_DECISIONS_CLASSIFIED: true
      ALL_MPD_RESULTS_MATERIALIZED: true
      ALL_SFP_RESULTS_MATERIALIZED: true
      ALL_SPLIT_RESULTS_MATERIALIZED: true
      ALL_RETIRE_RESULTS_RECORDED: true
      PRODUCT_RUNTIME_DECISIONS_DEPENDENCY_COUNT_ZERO: true
      ACTIVE_REFERENCE_COUNT_ZERO: true
      SPLIT_TEXTUAL_REFERENCE_REVIEW_COMPLETE: true
      MACHINE_VALIDATION_PASS: true
  current_blockers:
    - ACTIVE_REFERENCE_COUNT_ZERO_NOT_YET_VERIFIED
