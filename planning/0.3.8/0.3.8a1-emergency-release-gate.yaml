release_family: 0.3.8
package_version_target: 0.3.8a1
release_kind: DEMO_PRERELEASE
status: EMERGENCY_FEATURE_IMPLEMENTED_SELECTIVE_VERIFICATION_PASSED_FULL_RELEASE_VERIFICATION_NOT_YET_RUN

purpose: >
  Emergency bridge release that restores development progress by allowing a component
  that does not yet exist to be represented first as an explicit proposed candidate,
  without pretending that the component already exists or silently granting project authority.

scope_guard:
  complete_0_4_0_policy_implementation_required_for_this_release: false
  complete_0_4_0_policy_implementation_claimed_by_this_release: false
  release_gate_applies_only_to: EXPLICIT_PROPOSED_NONEXISTENT_COMPONENT_REGISTRATION
  inherited_0_4_0_policy_documents_are:
    - SEMANTIC_DESIGN_AUTHORITY
    - IMPLEMENTATION_CONSTRAINTS
    - NOT_RUNTIME_COMPLETION_EVIDENCE
  rule: DO_NOT_PROMOTE_THIS_GATE_TO_A_TOOL_0_4_0_IMPLEMENTATION_OR_RELEASE_GATE

single_feature_gate:
  id: PROPOSED_NONEXISTENT_COMPONENT_CANDIDATE
  required: true
  complete_when:
    - A_NOT_YET_EXISTING_COMPONENT_CAN_BE_REGISTERED_AS_AN_EXPLICIT_PROPOSED_CANDIDATE
    - THE_PROPOSED_CANDIDATE_HAS_MACHINE_READABLE_STABLE_IDENTITY
    - THE_CANDIDATE_CAN_BE_RESOLVED_THROUGH_THE_SUPPORTED_FLOW
    - RESOLUTION_RECORDS_TERMINAL_PROPOSAL_APPROVED_STATE_WITHOUT_ACTIVE_COMPONENT_PROJECTION
    - REGISTRATION_DOES_NOT_MATERIALIZE_THE_COMPONENT_AS_ALREADY_EXISTING
    - CANDIDATE_DISCOVERY_OR_REGISTRATION_DOES_NOT_CREATE_PROJECT_INTENT_OR_PROJECT_AUTHORITY
    - MALFORMED_AMBIGUOUS_OR_UNSUPPORTED_INPUT_FAILS_CLOSED_FOR_THE_DEPENDENT_OPERATION
    - EXISTING_NORMAL_DEVELOPMENT_REMAINS_UNBLOCKED_WHEN_THE_FEATURE_IS_NOT_USED
    - FOCUSED_TESTS_FOR_SUCCESS_AND_FAIL_CLOSED_CASES_PASS

non_goals_for_this_release:
  - COMPLETE_0_4_0_CAPABILITY_RECOVERY_ARCHITECTURE
  - FINALIZE_PROVISIONAL_S3_RECORD_SHAPES
  - SHIP_UNFINISHED_0_4_0_ONLY_SEMANTICS
  - GENERALIZE_ALL_FUTURE_COMPONENT_CREATION_WORKFLOWS

release_readiness_after_feature_gate:
  required:
    - UPDATE_pyproject_VERSION_TO_0_3_8a1
    - FINALIZE_releasenote_tool_0_3_8a1
    - RUN_FOCUSED_TESTS
    - RUN_RELEVANT_REGRESSION_TESTS
    - RUN_SELF_HOSTED_tooling_test_ON_EXACT_main_SHA
    - VERIFY_RELEASE_CONTRACT
    - DISPATCH_release_yml_FROM_CURRENT_main_HEAD
  exact_sha_rule: RELEASE_ONLY_THE_VERIFIED_CURRENT_main_SHA
  workflow_note: release.yml_requires_a_successful_self-hosted/tooling-test_status_for_the_exact_release_candidate_SHA

policy:
  - NONCRITICAL_POLICY_REFINEMENT_MUST_NOT_DELAY_THIS_RELEASE
  - ONLY_BEHAVIOR_AUTHORITY_SSOT_OR_FAIL_CLOSED_AMBIGUITY_MAY_BLOCK_THE_RELEASE
  - POST_RELEASE_REFINEMENT_MAY_REPLACE_PROVISIONAL_RECORD_SHAPES_WITHOUT_CHANGING_THE_FIXED_SEMANTIC_BOUNDARIES

verification_evidence:
  focused_suite:
    status: PASS
    branch: dev/0.3.8a1
    branch_head: 382494cbfd44fb264966b9f1c913738cf249037f
    result: 19_PASSED_0_FAILED
    covers:
      - PROPOSED_COMPONENT_REGISTRATION_AND_APPROVAL
      - TOOL_RUNTIME_IDENTITY_0_3_8a1
      - SPECIFICATION_BINDING_0_3_7_DRAFT
      - PROJECT_PROFILE_pp_1_01
      - RELEASE_READINESS_CONTRACT
    note: USER_REPORTED_LOCAL_PYTEST_RESULT
  selective_tooling_test:
    status: PASS
    workflow_run: 34756326353
    branch: dev/0.3.8a1
    branch_head: 5bce769e824e48221b4178361ca9ae7a6c4ac619
    scope: selective
    validated_modes:
      - ptsip-migration
      - ptsip-evidence
      - ptsip-source-compat
      - vpms
    explicitly_not_validated_by_this_run:
      - COMPLETE_REPOSITORY_REGRESSION
      - RELEASE_CONTRACT
      - REPOSITORY_PROFILE
      - DISTRIBUTION_BUILD
      - WHEEL_AND_SDIST_EMBEDDED_CONTRACTS
      - PRODUCT_ARTIFACT_EVIDENCE
      - REINSTALL_AND_PUBLIC_SURFACE_SMOKE
      - COMPLETE_TOOL_0_4_0_RUNTIME_IMPLEMENTATION
  remaining:
    - REVIEW_EMERGENCY_FEATURE_IMPLEMENTATION_COMPLETENESS
    - FULL_RELEASE_VERIFICATION_ONLY_AFTER_IMPLEMENTATION_REVIEW
    - INTEGRATE_dev_0_3_8a1_TO_dev_0_4_0
    - RESTORE_0_4_0_ACTIVE_PLANNING_CONTEXT
    - INTEGRATE_dev_0_4_0_TO_main
    - EXACT_main_SHA_SELF_HOSTED_FULL_STATUS
    - RELEASE_CONTRACT_ON_FINAL_main
    - RELEASE_DISPATCH
