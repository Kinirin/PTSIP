release_family: 0.3.8
package_version_target: 0.3.8a1
release_kind: DEMO_PRERELEASE
status: PREPARED_WAITING_FOR_SINGLE_FEATURE_GATE

purpose: >
  Emergency bridge release that restores development progress by allowing a component
  that does not yet exist to be represented first as an explicit proposed candidate,
  without pretending that the component already exists or silently granting project authority.

single_feature_gate:
  id: PROPOSED_NONEXISTENT_COMPONENT_CANDIDATE
  required: true
  complete_when:
    - A_NOT_YET_EXISTING_COMPONENT_CAN_BE_REGISTERED_AS_AN_EXPLICIT_PROPOSED_CANDIDATE
    - THE_PROPOSED_CANDIDATE_HAS_MACHINE_READABLE_STABLE_IDENTITY
    - THE_CANDIDATE_CAN_BE_RESOLVED_THROUGH_THE_SUPPORTED_FLOW
    - REGISTRATION_DOES_NOT_MATERIALIZE_THE_COMPONENT_AS_ALREADY_EXISTING
    - CANDIDATE_DISCOVERY_OR_REGISTRATION_DOES_NOT_CREATE_PROJECT_INTENT_OR_PROJECT_AUTHORITY
    - MALFORMED_AMBIGUOUS_OR_UNSUPPORTED_INPUT_FAILS_CLOSED_FOR_THE_DEPENDENT_OPERATION
    - EXISTING_NORMAL_DEVELOPMENT_REMAINS_UNBLOCKED_WHEN_THE_FEATURE_IS_NOT_USED
    - FOCUSED_TESTS_FOR_SUCCESS_AND_FAIL_CLOSED_CASES_PASS

non_goals_for_this_release:
  - COMPLETE_0_4_0_CAPABILITY_RECOVERY_ARCHITECTURE
  - FINALIZE_PROVISIONAL_S3_RECORD_SHAPES
  - SHIP_UNFINISHED_0_4_0_ONLY_SEMANTICS
  - GENERALIZE_ALL_FUTURE_COMPONENT_CREATION_WORKFLOWS

release_readiness_after_feature_gate:
  required:
    - UPDATE_pyproject_VERSION_TO_0_3_8a1
    - FINALIZE_releasenote_tool_0_3_8a1
    - RUN_FOCUSED_TESTS
    - RUN_RELEVANT_REGRESSION_TESTS
    - RUN_SELF_HOSTED_tooling_test_ON_EXACT_main_SHA
    - VERIFY_RELEASE_CONTRACT
    - DISPATCH_release_yml_FROM_CURRENT_main_HEAD
  exact_sha_rule: RELEASE_ONLY_THE_VERIFIED_CURRENT_main_SHA
  workflow_note: release.yml_requires_a_successful_self-hosted/tooling-test_status_for_the_exact_release_candidate_SHA

policy:
  - NONCRITICAL_POLICY_REFINEMENT_MUST_NOT_DELAY_THIS_RELEASE
  - ONLY_BEHAVIOR_AUTHORITY_SSOT_OR_FAIL_CLOSED_AMBIGUITY_MAY_BLOCK_THE_RELEASE
  - POST_RELEASE_REFINEMENT_MAY_REPLACE_PROVISIONAL_RECORD_SHAPES_WITHOUT_CHANGING_THE_FIXED_SEMANTIC_BOUNDARIES
