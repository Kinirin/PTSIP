  top_level_release_direction_outside_wu_namespace: planning/0.4.0.md

authority:
  release_boundary: planning/0.4.0/WU-00/WU-00A-release-boundary-classification.yaml
  core_contract_freeze: planning/0.4.0/WU-00/WU-00B-core-contract-freeze.yaml
  supporting_core_design: planning/0.4.0/WU-00/WU-00-core-design-contracts.yaml
  canonical_work_unit_state: planning/0.4.0/WU-*/WU-*.yaml
