  - {id: core-contract-freeze, path: planning/0.4.0/WU-00/WU-00B-core-contract-freeze.yaml, authority: CANONICAL}
  - {id: core-design-contracts, path: planning/0.4.0/WU-00/WU-00-core-design-contracts.yaml, authority: SUPPORTING_SUBORDINATE}
  - {id: wu-01-controller, path: planning/0.4.0/WU-01/WU-01.yaml, authority: CANONICAL_FOR_WU_01_STATE}
  - {id: wu-01-plan, path: planning/0.4.0/WU-01/remediation-responsibility-typed-foundation.yaml, authority: CANONICAL_FOR_WU_01_SCOPE}

