  - {id: WU-00B, kind: PRE_WORK_UNIT, path: planning/0.4.0/WU-00/WU-00B-core-contract-freeze.yaml, status: COMPLETE, approval: APPROVED, implementation_authorization: NOT_AUTHORIZED, depends_on: [WU-00A]}
  - id: WU-01
    kind: WORK_UNIT
    path: planning/0.4.0/WU-01/WU-01.yaml
    detail: planning/0.4.0/WU-01/remediation-responsibility-typed-foundation.yaml
    status: ACTIVE
    approval: NOT_REQUIRED
    approval_inherited_from: [WU-00B/D02, WU-00B/D03, WU-00B/D06, WU-00B/D08]
    implementation_authorization: AUTHORIZED_WITHIN_WU_BOUNDARY
    depends_on: [WU-00A, WU-00B]
  - {id: WU-02, kind: WORK_UNIT, status: NOT_CREATED, depends_on: [WU-01]}
  - {id: WU-03, kind: WORK_UNIT, status: NOT_CREATED, depends_on: [WU-02]}
  - {id: WU-04, kind: WORK_UNIT, status: NOT_CREATED, depends_on: [WU-03]}
