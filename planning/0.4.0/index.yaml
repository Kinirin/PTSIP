state_vocabulary:
  status: [DRAFT, ACTIVE, APPROVED, COMPLETE, BLOCKED, DEFERRED, NOT_CREATED]
  approval: [NOT_REQUIRED, PENDING, APPROVED, REJECTED]
  implementation_authorization: [NOT_AUTHORIZED, AUTHORIZED_WITHIN_WU_BOUNDARY]

work_units:
