  integration_branch: dev/0.4.0
  classification: CORE/RELEASE-BLOCKING
  control_plane: planning/0.4.0/index.yaml
  current_gate: WU-01/IMPLEMENTATION_ACTIVE

machine_document_policy:
  canonical_format: YAML
  natural_language_wu_documents: REMOVED
  natural_language_markdown_allowed_as_canonical_wu_state: false
  canonical_machine_documents:
    - planning/0.4.0/index.yaml
    - planning/0.4.0/WU-00/WU-00A-release-boundary-classification.yaml
    - planning/0.4.0/WU-00/WU-00B-core-contract-freeze.yaml
    - planning/0.4.0/WU-00/WU-00-core-design-contracts.yaml
