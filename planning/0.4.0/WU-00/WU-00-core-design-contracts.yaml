planning_contract: ptsip-planning/v1
document:
  id: WU-00-CORE-DESIGN-CONTRACTS
  kind: MACHINE_DESIGN_CONTRACT_SET
  status: FROZEN_SUPPORTING_CONTRACT
  authority: SUBORDINATE_TO_WU-00A_AND_WU-00B
  conflict_resolution: WU-00A_OR_WU-00B_CANONICAL_MACHINE_RECORD_OVERRIDES_LEGACY_DRAFT_CONTENT
contracts:
  authority_and_remediation_domain:
    invariants:
    - Evidence != DerivedFact != NormativeConstraint != ProjectArchitectureAuthority
    - RepositoryEvidence_CANNOT_SILENTLY_BECOME_ArchitectureAuthority
    - SemanticDeterminacy != MutationAuthorization
    - CurrentSpecification+CurrentAuthority+CurrentRepositoryState == FreshSolveInput
    tool_owned:
    - COLLECT_REPOSITORY_EVIDENCE
    - NORMALIZE_PROVENANCE_AND_DERIVED_FACTS
    - DETERMINE_RULE_APPLICABILITY
    - EVALUATE_DEFINITIVE_VIOLATIONS
    - ENUMERATE_MODELED_LEGAL_REMEDIATION_CANDIDATES
    - ELIMINATE_CANDIDATES_BY_HARD_CONSTRAINT_OR_EXPLICIT_AUTHORITY
    - REDUCE_PROVABLY_EQUIVALENT_OR_DOMINATED_CANDIDATES
    - GENERATE_MECHANICAL_TRANSFORMATIONS_AFTER_TARGET_SEMANTICS_DECIDED
    - VERIFY_EXACT_PRESTATE_AND_POSTSTATE
    - RERUN_CONFORMANCE_AFTER_AUTHORIZED_APPLICATION
    owner_required_when:
    - GENUINELY_AMBIGUOUS_LIFECYCLE_PURPOSE
    - MULTIPLE_ARCHITECTURE_VALID_SEMANTIC_TARGETS_REMAIN
    - DESTRUCTIVE_OR_ARCHITECTURE_SEMANTIC_MUTATION_REQUIRES_CONFIRMATION
    - DECLARATIONS_CONFLICT_AND_NO_EXISTING_AUTHORITY_DETERMINES_PRECEDENCE
    outcomes: [DETERMINISTIC, OWNER_INTENT_REQUIRED, EXTERNAL_FACT_REQUIRED, UNSATISFIABLE, TOOL_CAPABILITY_GAP]
    architecture_preservation: VALIDATED_PROJECT_PROFILE_AUTHORITY_OVERRIDES_COARSE_DISCOVERY_CANDIDATES
    verification_expectations:
    - NO_EVIDENCE_TO_AUTHORITY_CONVERSION
    - NO_HEURISTIC_OR_AI_AUTHORITY_CREATION
    - UNKNOWN_AUTHORITY_FAILS_CLOSED
    - EXTERNAL_FACT_REMAINS_EVIDENCE_UNLESS_SEPARATELY_MATERIALIZED_AS_INTENT
    - SEMANTIC_TARGET_INSPECTABLE
    - MUTATION_AUTHORIZATION_INSPECTABLE
    - EXPLICIT_ARCHITECTURE_PRESERVED_OVER_COARSE_DISCOVERY
  solution_space_and_planning:
    reasoning_target: LEGAL_SEMANTIC_TARGET_STATES_NOT_PLAUSIBLE_EDITS
    confidence_as_authority: false
    cardinality: {ZERO: UNSATISFIABLE, ONE: DETERMINISTIC, TWO_OR_MORE: OWNER_INTENT_REQUIRED}
    cardinality_scope: DECLARED_MODELED_REMEDIATION_FAMILIES_ONLY
    pipeline: [CANDIDATE_GENERATION, NORMATIVE_ELIMINATION, ARCHITECTURE_PRESERVATION, SEMANTIC_EQUIVALENCE_OR_DOMINANCE_REDUCTION, RANK_VALID_SURVIVORS]
    valid_elimination_reasons:
    - VIOLATES_NORMATIVE_CONSTRAINT
    - CONFLICTS_WITH_EXPLICIT_CURRENT_AUTHORITY
    - FAILS_REQUIRED_PRECONDITION
    - BREAKS_REQUIRED_ARCHITECTURE_INVARIANT
    - PROVABLY_SEMANTICALLY_EQUIVALENT_TO_RETAINED_CANDIDATE
    - PROVABLY_DOMINATED_UNDER_MODELED_SEMANTIC_OBJECTIVE
    ranking_factors: [REVERSIBILITY, BLAST_RADIUS, FUTURE_CONSISTENCY, IMPLEMENTATION_COST, ADVISORY_HEURISTICS]
    ranking_can_eliminate: false
    uniqueness_language: UNIQUE_AMONG_MODELED_REMEDIATION_FAMILIES
    incomplete_model_outcome: TOOL_CAPABILITY_GAP
    plan_separation: SemanticRemediationPlan != RepositoryChangePlan
    planner_priority: [NORMATIVE_CORRECTNESS, AUTHORITY_PRESERVATION, ARCHITECTURE_INTENT_PRESERVATION, LIFECYCLE_SEPARATION, FUTURE_CONSISTENCY, REVERSIBILITY, BLAST_RADIUS, IMPLEMENTATION_COST, DIFF_SIZE]
    invariant: MINIMAL_DIFF != BEST_ARCHITECTURE
  operational_rule_registry:
    authority_separation:
      Specification: NORMATIVE_CORRECTNESS
      OperationalRuleRegistry: TOOL_INTERNAL_EXECUTABLE_SUPPORT_FOR_SELECTED_RULES
      ptsip.yaml: PROJECT_TRUTH_INTENT_ANALYSIS_CONTRACT
    stable_bridge: rule_id
    minimum_questions: [APPLIES, CURRENT_RULE_OUTCOME, MODELED_SEMANTIC_REMEDIATION_FAMILIES, TARGET_VERIFICATION]
    candidate_protocol_responsibilities: [APPLIES, EVALUATE, PROPOSE_SOLUTIONS, VERIFY]
    metadata: [rule_id, authority_requirement, automation_level, supported_remediation_families, verification_capability]
    secondary_policy_dsl: false
    capability_reporting_is_normative_policy: false
    versioning_invariants: [TOOL_VERSION_INDEPENDENT, PROJECT_PROFILE_CONTRACT_VERSION_INDEPENDENT, PROJECT_PROFILE_INSTANCE_REVISION_INDEPENDENT, TYPED_SPECIFICATION_BINDING_REQUIRED, NO_TOOL_OR_PP_VERSION_TO_SPEC_SUPPORT_INFERENCE]
    rule_may: [READ_NORMALIZED_EVIDENCE_AND_FACTS, DETERMINE_NORMATIVE_APPLICABILITY, PRODUCE_DETERMINISTIC_RULE_OUTCOME, ENUMERATE_MODELED_SEMANTIC_FAMILIES, DEFINE_POSTCONDITIONS]
    rule_may_not: [INVENT_PROJECT_INTENT, CONVERT_OBSERVATION_TO_AUTHORITY, WEAKEN_SPEC_CONSTRAINT, USE_AI_AS_RULE_AUTHORITY, USE_HISTORY_AS_CURRENT_NORMATIVE_CONSTRAINT]
  escalation_and_advisory:
    escalate_only_after: DETERMINISTIC_REDUCTION_EXHAUSTED
    invalid_escalation_reasons: [COMPLEX, LOW_CONFIDENCE, AI_NEEDED]
    escalation_proof_fields: [EXACT_UNRESOLVED_SEMANTIC_DIMENSION, SURVIVING_SEMANTIC_CANDIDATES, ELIMINATED_CANDIDATES_WITH_REASONS, ESTABLISHED_REPOSITORY_FACTS, APPLICABLE_NORMATIVE_CONSTRAINTS, AVAILABLE_AUTHORITY, EXACT_MISSING_AUTHORITY_OR_INTENT]
    owner_question_policy: ASK_ONLY_REMAINING_PROJECT_INTENT_DIMENSION
    unresolved_input_classification: {MISSING_PROJECT_INTENT: OWNER_INTENT_REQUIRED, MISSING_EXTERNALLY_KNOWABLE_FACT: EXTERNAL_FACT_REQUIRED}
    external_fact_materialization: PROVENANCED_EVIDENCE_NOT_PROJECT_INTENT
    ai_role: OPTIONAL_ADVISORY_ONLY
    ai_forbidden: [SPECIFICATION_AUTHORITY, RULE_EVALUATOR_AUTHORITY, ARCHITECTURE_INTENT_AUTHORITY, FINAL_DECISION, LEGAL_CANDIDATE_ELIMINATION, MUTATION_AUTHORIZATION]
    ai_allowed: [AMBIGUITY_EXPLANATION, CANDIDATE_COMPARISON, SURVIVOR_RANKING, OWNER_QUESTION_DRAFTING, HUMAN_READABLE_RATIONALE]
    core_requires_ai: false
    advisory_ranking_can_remove_legal_candidate: false
    self_authorized_spec_change: false
  authority_gate_and_safe_apply:
    invariant: SemanticDeterminacy != MutationAuthorization
    gate_position: AFTER_SEMANTIC_TARGET_BEFORE_PHYSICAL_MUTATION
    legacy_draft_combined_authorization_values: [AUTO_AUTHORIZED, MECHANICALLY_AUTHORIZED, OWNER_CONFIRMATION_REQUIRED, NOT_AUTHORIZED]
    legacy_draft_combined_values_status: SUPERSEDED_BY_WU-00B_TWO_AXIS_MUTATION_CLASS_AND_AUTHORIZATION_DECISION
    safe_apply_lifecycle: [SEMANTIC_REMEDIATION_PLAN, AUTHORITY_GATE, REPOSITORY_CHANGE_PLAN, EXACT_PRESTATE_SNAPSHOT, AUTHORIZATION_BINDING, APPLY, POSTSTATE_VALIDATION, RELEVANT_PTSIP_CONFORMANCE, COMMIT_OR_PROMOTION]
    stale_state: REJECT_PLAN_AND_REQUIRE_FRESH_SOLVE
    repository_change_plan_may: [CREATE, UPDATE, DELETE, MOVE, ORDERING_CONSTRAINTS, PRECONDITIONS, ROLLBACK_OR_RECOVERY_METADATA, EXACT_SNAPSHOT_BINDING, EXPECTED_POSTCONDITIONS]
    repository_change_plan_may_not: [REDECIDE_ARCHITECTURE_INTENT]
    destructive_requires: [STRONGER_AUTHORIZATION, EXACT_TARGET_INVENTORY, PROOF_REMOVED_DATA_NOT_REQUIRED_BY_CURRENT_AUTHORITY, STRONGER_POSTCONDITION_VERIFICATION, NO_IMPLICIT_FALLBACK_AFTER_PARTIAL_FAILURE]
    recovery: [APPLY_ONLY_ACCEPTED_SEMANTIC_DELTAS, MAINTAIN_EXACT_PRESTATE_IDENTITY, NO_CONTINUATION_FROM_AMBIGUOUS_PARTIAL_STATE, RECOVERY_BOUND_TO_EXPLICIT_PLAN_OR_LEDGER, POST_APPLY_VALIDATION_FAILURE_BLOCKS_PROMOTION]
    success_requires: [EXPECTED_SEMANTIC_TARGET_MATERIALIZED, ARCHITECTURE_INVARIANTS_PRESERVED, APPLICABLE_RULE_CONFORMANT, NO_UNAUTHORIZED_SEMANTIC_DELTA, RELEVANT_FULL_CONFORMANCE]
  verification_and_test_mode:
    invariant: VerificationResponsibility != PhysicalTestLocation != CIExecutionMode
    authority_sources:
      ptsip.yaml: VERIFICATION_RESPONSIBILITY_AND_ARCHITECTURE_AUTHORITY
      tests/**: PHYSICAL_TEST_IMPLEMENTATION
      .github/test_modes.yaml: EXECUTION_DECLARATION
      resolve_test_modes.py: DETERMINISTIC_SELECTION
      tooling-test.yml: EXECUTION_MECHANISM
    direction: [DECLARED_VERIFICATION_RESPONSIBILITY, component_ref, TEST_MODE, PYTEST_TARGET_AND_EXECUTION_SETTINGS]
    watch_paths_are_authority: false
    baseline_modes:
    - {mode: ptsip-migration, component_ref: ptsip-migration-verification, target: tests/ptsip/migration}
    - {mode: ptsip-evidence, component_ref: ptsip-evidence-verification, target: tests/ptsip/evidence}
    - {mode: ptsip-source-compat, component_ref: ptsip-source-compat-verification, target: tests/ptsip/source_compat}
    - {mode: vpms, component_ref: vpms-verification, target: tests/vpms}
    resolver_capabilities: [PATH_NORMALIZATION, WATCH_GLOB_MATCHING, AUTOMATIC_CHANGED_FILE_SELECTION, DEPENDENCY_SENSITIVE_MULTI_MODE_SELECTION, MANUAL_EXACT_OR_ALL, CONTROL_PLANE_CHANGES_SELECT_ALL, FAIL_CLOSED_UNKNOWN_MANUAL_MODE, ACTUAL_GIT_DIFF_INPUT, MINIMAL_EXECUTION_PLAN]
    resolver_must_not_duplicate: [CLASSIFICATION, ROLES, PURPOSE]
    selective_success_equals_full_qualification: false
    full_qualification_requires: [COMPLETE_REPOSITORY_REGRESSION, RELEASE_CONTRACT_CHECKS, PACKAGE_BUILD_DISTRIBUTION_CHECKS, ARTIFACT_VERIFICATION, EXACT_SHA_SELF_HOSTED_TOOLING_TEST_STATUS]
    iteration: [FOCUSED_TESTS, RELEVANT_TEST_MODES, WU_OR_INTEGRATION_CHECKPOINT, FULL_EXACT_SHA_AT_MEANINGFUL_BOUNDARY]
    new_mode_sequence: [DURABLE_VERIFICATION_RESPONSIBILITY, PROJECT_PROFILE_DECLARATION, COMPONENT_REF, TEST_MODE_IF_USEFUL]
    workflow_selector_simplification: OPTIONAL_NON_BLOCKING
  development_branch_and_wu_strategy:
    integration_branch: dev/0.4.0
    baseline: f2fbbb5175eafde0ff8a3b7c5e7ca31a8224189d
    core_lane: DIRECT_ON_DEV_0_4_0_ALLOWED_WITH_NARROW_COMMITS_EXPLICIT_WU_SCOPES_FOCUSED_VERIFICATION
    optional_lane: OPTIONAL_SUBBRANCH_ALLOWED_FOR_EXPERIMENTAL_OR_DISCARDABLE_SCOPE
    invariants: [WU_BOUNDARY != MANDATORY_GIT_BRANCH, SUBBRANCH_EXISTS != RELEASE_PREREQUISITE, PLANNING_TOPIC != IMPLEMENTATION_REQUIREMENT]
    wu_required_fields: [PRIMARY_RESPONSIBILITY, ENTRY_BASELINE_OR_CONTEXT, NON_GOALS, AUTHORITY_BOUNDARY, INPUT_OUTPUT_CONTRACTS, FOCUSED_VERIFICATION_TARGETS, COMPLETION_CONDITIONS, LATER_UNRESOLVED_DECISIONS]
    core_preference: MEANINGFUL_VERTICAL_SLICES
    candidate_layers: [TYPED_DOMAIN, OPERATIONAL_RULE, RULE_EVALUATION_FACTS, SOLUTION_SPACE, SEMANTIC_PLANNER, ESCALATION, AUTHORITY_GATE, EXECUTION_PLANNER_SAFE_APPLY, POSTCONDITION_VERIFICATION, OPTIONAL_ADVISORY]
    candidate_layers_are_one_to_one_wus: false
    full_exact_sha_frequency: MAJOR_CHECKPOINT_OR_RELEASE_BOUNDARY_NOT_EVERY_SMALL_EDIT
    legacy_markdown_planning_hierarchy_status: SUPERSEDED_BY_MACHINE_PLANNING_INDEX_AND_WU_YAML
    release_dependency_must_be_explicit: true
  representative_rule_families:
    framework_proof_over_universal_coverage: true
    minimum_outcomes: [DETERMINISTIC, OWNER_INTENT_REQUIRED, UNSATISFIABLE, TOOL_CAPABILITY_GAP]
    external_fact_boundary_required: true
    deterministic_proof: [REPOSITORY_EVIDENCE, DERIVED_FACTS, NORMATIVE_CONSTRAINT, MODELED_LEGAL_CANDIDATES, HARD_ELIMINATION, ONE_SURVIVOR, AUTHORITY_GATE, PHYSICAL_PLAN_IF_AUTHORIZED, POSTCONDITION]
    owner_intent_proof: [FACTS_AND_CONSTRAINTS, TWO_OR_MORE_LEGAL_SURVIVORS, ESCALATION_PROOF, MINIMAL_UNRESOLVED_INTENT_QUESTION, OWNER_AUTHORITY_MATERIALIZATION, FRESH_SOLVE]
    unsatisfiable_forbidden: [LEAST_BAD_INVALID_SOLUTION, AI_INVENTED_EXCEPTION, WEAKEN_NORMATIVE_CONSTRAINT, REINTERPRET_EVIDENCE_AS_AUTHORITY]
    capability_gap_distinct_from: [OWNER_INTENT_REQUIRED, UNSATISFIABLE, EXTERNAL_FACT_REQUIRED]
    external_fact_materialization: PROVENANCED_EVIDENCE
    rule_selection_criteria: [GROUNDED_IN_EXISTING_NORMATIVE_CONCEPTS, SMALL_ENOUGH_TO_MODEL_COMPLETELY, REAL_AUTHORITY_BOUNDARY, SYNTHETIC_FIXTURE_TESTABLE, POSTCONDITION_CAPABLE, NO_AI_DEPENDENCY, NO_UNNECESSARY_PP_SCHEMA_DEPENDENCY]
    family_completion: [DETECT, EXPLAIN, PLAN, CLASSIFY_AUTHORITY, APPLY_WHEN_AUTHORIZED, VERIFY]
    release_success_steps: [DISCOVER_EVIDENCE, DERIVE_FACTS, EVALUATE_RULE, ENUMERATE_MODELED_REMEDIES, ELIMINATE_INVALID_OR_REDUNDANT, CLASSIFY_OUTCOME, ASK_ONLY_MISSING_INTENT, CREATE_SAFE_PHYSICAL_PLAN, REJECT_STALE_STATE, APPLY_ONLY_AUTHORIZED, VERIFY_POSTSTATE, NO_AGENT_RECONSTRUCTION_OF_SUPPORTED_SPEC_REASONING]
  resolved_decisions_and_non_goals:
    status: RESOLVED_BY_WU-00B
    decisions: [D01=A, D02=A, D03=A, D04=A, D05=A, D06=A, D07=A, D08=A]
    issue_31_invariant: CoverageGap != RemediationCandidate != AcceptedArchitectureDecision
    ownership: [ptsip-remediation, ptsip-remediation-verification]
    outcomes: [DETERMINISTIC, OWNER_INTENT_REQUIRED, EXTERNAL_FACT_REQUIRED, UNSATISFIABLE, TOOL_CAPABILITY_GAP]
    mutation_classes: [MECHANICAL_REVERSIBLE, STRUCTURAL_SEMANTIC_PRESERVING, ARCHITECTURE_SEMANTIC, DESTRUCTIVE]
    authorization: [AUTHORIZED, OWNER_CONFIRMATION_REQUIRED, NOT_AUTHORIZED]
    next: WU-01
