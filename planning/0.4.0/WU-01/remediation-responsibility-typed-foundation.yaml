    - DerivedFact
    - NormativeConstraint
    - ProjectIntentAuthority
    - RemediationDispositionCandidate
    - SemanticCandidate
    - ResolutionOutcome
    - SemanticRemediationPlan
    - EscalationProof
    - MutationClass
    - AuthorizationDecision
    - RepositoryChangePlan
    - PostconditionResult
