          role: ANALYSIS_ONLY_COARSE_CATEGORY
        normative_constraint_authority:
          role: ANALYSIS_ONLY_COARSE_CATEGORY
        governance_control_authority:
          role: ANALYSIS_ONLY_COARSE_CATEGORY
      coarse_category_binary_combination_count: 8
      coarse_categories_are_initial_registered_vocabulary: false
