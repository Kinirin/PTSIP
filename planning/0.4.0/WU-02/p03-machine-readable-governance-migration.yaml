  P03_B_EXPLICIT_AUTHORITY_ROLE_AND_FRESH_ELIGIBILITY:
    status: APPROVED
    authority: PROJECT_OWNER
    approval_date: '2026-09-04'

    purpose:
      machine_readable_record_implies_project_authority: false
      project_authority_requires_explicit_role_contract_and_current_eligibility: true
      persistent_project_authority_promotion_state: FORBIDDEN
      eligibility_is_current_state_derivation: true

    machine_readable_boundary:
      principle: MACHINE_READABLE_NE_PROJECT_AUTHORITY
      examples_of_machine_readable_non_project_authority:
        - WORK_UNIT_PLANNING_RECORD
        - GOVERNANCE_CONTROL_RECORD
        - TOOL_ARCHITECTURE_RECORD
        - NORMATIVE_MACHINE_CONTRACT
      adr_machine_readability_is_only_a_precondition_for_machine_consumption: true

    authority_role_representation:
      machine_role_code:
        required: true
        vocabulary: CLOSED_REGISTERED_VOCABULARY
        opaque_natural_language: FORBIDDEN
        automatic_reasoning_eligible: true
      human_role_explanation:
        allowed: true
        responsibility: PRESENTATION_AND_HUMAN_UNDERSTANDING_ONLY
        automatic_reasoning_eligible: false
        may_change_authority_role: false
        may_change_project_authority_eligibility: false
      separation_invariant: MACHINE_ROLE_CODE_NE_HUMAN_ROLE_EXPLANATION
      exact_initial_role_vocabulary: NOT_FROZEN
      project_authority_projection_role: PROJECT_ARCHITECTURE_AUTHORITY

    current_selection_and_role_responsibility:
      decisions_index:
        responsibility: SELECT_CURRENT_GOVERNANCE_DECISION
        determines_current_adr: true
        determines_authority_role: false
        expands_into_role_registry: false
      adr_record:
        responsibility: DECLARE_OR_BIND_ITS_AUTHORITY_ROLE
        role_must_be_machine_readable: true
      invariants:
        - CURRENT_ADR_SELECTION_NE_AUTHORITY_ROLE
        - AUTHORITY_ROLE_NE_SUBJECT_APPLICABILITY
        - INDEX_MUST_NOT_INFER_ROLE_FROM_ADR_PROSE

    subject_binding:
      purpose: MACHINE_READABLE_APPLICABILITY_SCOPE
      minimum_semantic_dimensions:
        - authority_domain
        - repository_binding
        - subject_type
        - subject_identity
      repository_binding:
        required: true
        exact_repository_identity_mechanism: NOT_FROZEN
      subject_type:
        required: true
        closed_registered_vocabulary_required: true
      subject_identity:
        required: true
        exact_identifier_shape: NOT_FROZEN
      authority_domain:
        required: true
        closed_registered_vocabulary_required: true
      current_solve_requires_binding_match: true
      subject_mismatch_result: NOT_APPLICABLE
      repository_mismatch_result: NOT_APPLICABLE

    authority_role_resolution:
      role_and_resolution_state_are_separate: true
      states:
        DECLARED:
          meaning: ROLE_EXISTS_IN_CURRENT_MACHINE_AUTHORITY
          automatic_project_authority_eligibility_input: ALLOWED
        DETERMINISTICALLY_DERIVED:
          meaning: ROLE_IS_RESOLVED_BY_REGISTERED_MACHINE_RULE_OR_EXPLICIT_MACHINE_AUTHORITY
          opaque_prose_inference: FORBIDDEN
          ai_confidence_as_derivation: FORBIDDEN
          automatic_project_authority_eligibility_input: ALLOWED
        ADVISORY_CANDIDATE:
          meaning: ROLE_IS_PROPOSED_BY_AI_OR_NON_AUTHORITATIVE_HEURISTIC
          automatic_project_authority_eligibility_input: FORBIDDEN
          may_be_presented_for_owner_review: true
        UNRESOLVED:
          meaning: NO_SUPPORTED_MACHINE_RESOLUTION_ESTABLISHES_THE_ROLE
          automatic_project_authority_eligibility_input: FORBIDDEN
          owner_discussion_may_be_required: true
      exact_serialized_state_field_name: NOT_FROZEN

    ai_boundary:
      may:
        - DISCOVER_EXISTING_EXPLICIT_MACHINE_ROLE_DECLARATION
        - DISCOVER_EXISTING_MACHINE_AUTHORITY_REFERENCES
        - PRESENT_ROLE_CANDIDATE_FOR_OWNER_REVIEW
        - SUMMARIZE_AVAILABLE_MACHINE_EVIDENCE_AND_GAPS
      may_not:
        - CREATE_MACHINE_AUTHORITY_FROM_CONFIDENCE
        - PROMOTE_ADVISORY_ROLE_TO_DECLARED_ROLE
        - USE_OPAQUE_PROSE_AS_AUTOMATIC_ROLE_AUTHORITY
        - TREAT_HIGH_CONFIDENCE_AS_PROJECT_AUTHORITY
      distinction:
        explicit_authority_discovery: ALLOWED
        missing_authority_semantic_invention: FORBIDDEN
      invariant: AI_ADVISORY_NE_AUTHORITY

    current_project_authority_eligibility:
      persistence: DERIVED_NOT_STORED_AS_PERMANENT_PROMOTION
      evaluation_timing: EVERY_FRESH_SOLVE
      required_current_inputs:
        - CURRENT_DECISIONS_INDEX_SELECTION
        - CURRENT_MACHINE_ADR
        - CURRENT_AUTHORITY_ROLE_REGISTRY
        - CURRENT_AUTHORITY_SCHEMA_REGISTRY
        - CURRENT_TOOL_AUTHORITY_CAPABILITIES
        - CURRENT_REPOSITORY_BINDING
        - CURRENT_SOLVE_SUBJECT
      eligibility_checks_in_order:
        - CURRENT_ADR_IS_SELECTED
        - AUTHORITY_ROLE_IS_RESOLVED
        - AUTHORITY_ROLE_IS_PROJECT_AUTHORITY_ELIGIBLE
        - AUTHORITY_CONTRACT_IS_VALID
        - AUTHORITY_CONTRACT_LIFECYCLE_IS_CURRENTLY_USABLE
        - TOOL_SUPPORT_IS_SUFFICIENT
        - REPOSITORY_BINDING_MATCHES
        - SUBJECT_BINDING_MATCHES
        - CURRENT_APPLICABILITY_IS_APPLICABLE
      eligible_result: CURRENTLY_ELIGIBLE_FOR_PROJECT_AUTHORITY_PROJECTION
      ineligible_result: CURRENTLY_INELIGIBLE_FOR_PROJECT_AUTHORITY_PROJECTION
      project_authority_record_materialization:
        allowed_only_when_currently_eligible: true
        historical_ineligibility_blocks_future_eligibility: false
        historical_eligibility_guarantees_future_eligibility: false
      fresh_solve_invariant: PROJECT_AUTHORITY_ELIGIBILITY_MUST_BE_REEVALUATED_FROM_CURRENT_STATE

    authority_contract_state_axes:
      validity:
        states:
          - VALID
          - MALFORMED
          - UNREGISTERED
        responsibility: STRUCTURAL_AND_REGISTRATION_CORRECTNESS
      lifecycle:
        states:
          - ACTIVE
          - DEPRECATED
          - SUPERSEDED
          - RETIRED
          - DRAFT
        responsibility: CURRENT_CONTRACT_GOVERNANCE_LIFECYCLE
      tool_support:
        states:
          - SUPPORTED
          - KNOWN_NOT_IMPLEMENTED
          - INTENTIONALLY_UNSUPPORTED
        responsibility: CURRENT_TOOL_EXECUTABLE_SEMANTIC_CAPABILITY
      applicability:
        states:
          - APPLICABLE
          - NOT_APPLICABLE
        responsibility: CURRENT_SOLVE_RELEVANCE
      invariants:
        - CONTRACT_VALIDITY_NE_CONTRACT_LIFECYCLE
        - CONTRACT_LIFECYCLE_NE_TOOL_SUPPORT
        - TOOL_SUPPORT_NE_CURRENT_APPLICABILITY
        - CURRENT_APPLICABILITY_NE_PROJECT_AUTHORITY_ROLE

    failure_and_outcome_boundaries:
      valid_active_supported_applicable:
        authority_eligibility: MAY_CONTINUE_TO_BINDING_AND_ROLE_CHECKS
      valid_active_known_not_implemented:
        authority_eligibility: INELIGIBLE_FOR_CURRENT_AUTOMATIC_CONSUMPTION
        resolution_outcome: TOOL_CAPABILITY_GAP
      malformed:
        authority_eligibility: INELIGIBLE
        diagnostic_category: MALFORMED_AUTHORITY_RECORD
        resolution_outcome: NOT_TOOL_CAPABILITY_GAP
      superseded_or_retired_current_reference:
        authority_eligibility: INELIGIBLE
        diagnostic_category: AUTHORITY_RECONCILIATION_OR_GOVERNANCE_CONSISTENCY
        resolution_outcome: NOT_TOOL_CAPABILITY_GAP
      not_applicable:
        authority_eligibility: INELIGIBLE_FOR_CURRENT_SOLVE
        diagnostic_category: NONE_REQUIRED
        resolution_outcome: NOT_TOOL_CAPABILITY_GAP
      advisory_candidate_role:
        authority_eligibility: INELIGIBLE
        owner_review_candidate: true
        resolution_outcome_mapping: NOT_FROZEN
      unresolved_role:
        authority_eligibility: INELIGIBLE
        owner_discussion_may_be_required: true
        resolution_outcome_mapping: NOT_FROZEN
      unregistered_contract:
        authority_eligibility: INELIGIBLE
        diagnostic: UNREGISTERED_AUTHORITY_CONTRACT
        resolution_outcome_mapping: NOT_FROZEN
      intentionally_unsupported_tool_capability:
        authority_eligibility: INELIGIBLE
        resolution_outcome_mapping: NOT_FROZEN

    tool_capability_gap_narrow_definition:
      required_conditions:
        - AUTHORITY_CONTRACT_VALIDITY_IS_VALID
        - AUTHORITY_CONTRACT_LIFECYCLE_IS_ACTIVE
        - CURRENT_CASE_IS_APPLICABLE
        - REQUIRED_MACHINE_SEMANTICS_ARE_KNOWN
        - CURRENT_TOOL_IMPLEMENTATION_IS_KNOWN_NOT_IMPLEMENTED
      forbidden_as_catch_all_for:
        - MALFORMED_CONTRACT
        - SUPERSEDED_CONTRACT
        - RETIRED_CONTRACT
        - NOT_APPLICABLE_CASE
        - UNRESOLVED_AUTHORITY_ROLE
        - ADVISORY_ONLY_ROLE
      principle: TOOL_CAPABILITY_GAP_MEANS_KNOWN_VALID_ACTIVE_REQUIRED_CAPABILITY_IS_NOT_IMPLEMENTED

    project_authority_projection:
      source: CURRENT_MACHINE_GOVERNANCE_RECORD
      direct_adr_to_project_authority_record: FORBIDDEN
      requires_current_eligibility_evaluation: true
      requires_supported_registered_semantics: true
      requires_subject_binding_match: true
      requires_repository_binding_match: true
      consumes_human_explanation: false
      output: ProjectAuthorityRecord
      output_is_current_solve_view: true

    approved_invariants:
      - MACHINE_READABLE_NE_PROJECT_AUTHORITY
      - AUTHORITY_ROLE_NE_ROLE_RESOLUTION_STATE
      - AUTHORITY_ROLE_NE_TOOL_SUPPORT
      - AUTHORITY_ROLE_NE_CURRENT_APPLICABILITY
      - CURRENT_ADR_SELECTION_NE_AUTHORITY_ROLE
      - MACHINE_ROLE_CODE_NE_HUMAN_ROLE_EXPLANATION
      - AI_ADVISORY_NE_AUTHORITY
      - HIGH_CONFIDENCE_NE_AUTHORITY
      - PROJECT_AUTHORITY_ELIGIBILITY_IS_DERIVED_CURRENT_STATE
      - HISTORICAL_INELIGIBILITY_MUST_NOT_BLOCK_FUTURE_ELIGIBILITY
      - HISTORICAL_ELIGIBILITY_MUST_NOT_BYPASS_FRESH_REVALIDATION
      - CONTRACT_VALIDITY_NE_CONTRACT_LIFECYCLE
      - CONTRACT_LIFECYCLE_NE_TOOL_SUPPORT
      - TOOL_SUPPORT_NE_CURRENT_APPLICABILITY
      - TOOL_CAPABILITY_GAP_IS_NOT_A_GENERIC_AUTHORITY_FAILURE_BUCKET


  P03_C_AUTHORITY_ROLE_VECTOR_AND_VOCABULARY_REFINEMENT:
    status: APPROVED
    authority: PROJECT_OWNER
    approval_date: '2026-09-05'

    authority_role_model:
      representation: CLOSED_MACHINE_DIMENSION_VECTOR
      single_exclusive_role_enum: REJECTED
      reason: THREE_INDEPENDENT_BINARY_DIMENSIONS_ALLOW_EIGHT_COMBINATIONS
      current_dimensions:
        project_architecture_authority:
          type: BOOLEAN
          closed_machine_dimension: true
        normative_constraint_authority:
          type: BOOLEAN
          closed_machine_dimension: true
        governance_control_authority:
          type: BOOLEAN
          closed_machine_dimension: true
      combination_count_for_current_dimensions: 8
      all_combinations_automatically_legal: false
      combination_legality_requires_registered_contract_validation: true
      exact_future_dimension_set: EVOLVABLE_BY_APPROVED_REFINEMENT_CYCLE

    semantic_cardinality_boundary:
      one_adr_one_authority_semantic: true
      one_adr_one_exclusive_role: false
      one_authority_semantic_may_have_multiple_role_effects: true
      invariant: ONE_ADR_ONE_AUTHORITY_SEMANTIC_ONE_RESOLVED_ROLE_VECTOR

    role_resolution_boundary:
      resolved_false_vector:
        vector:
          project_architecture_authority: false
          normative_constraint_authority: false
          governance_control_authority: false
        meaning: EXPLICITLY_NO_CURRENT_AUTOMATIC_AUTHORITY_CONSUMPTION_PATH
        equals_unresolved: false
      unresolved_role:
        must_not_be_encoded_as_all_false: true
        resolution_state: UNRESOLVED
      advisory_role:
        canonical_authority_field: FORBIDDEN
        separate_candidate_representation_required: true
        resolution_state: ADVISORY_CANDIDATE
      declared_role:
        resolution_state: DECLARED
      deterministic_role_derivation:
        resolution_state: DETERMINISTICALLY_DERIVED
        registered_machine_rule_required: true
        prose_inference_forbidden: true

    role_description_reference:
      field: roles_description_id
      location: ADR_MACHINE_RECORD
      value:
        stable_description_id_or_null: true
      description_store: decisions/ADR-description-map.yaml
      description_store_role: HUMAN_EXPLANATION_AND_VOCABULARY_REFINEMENT_SOURCE
      machine_authority: NONE
      runtime_solver_consumption: FORBIDDEN
      candidate_elimination_consumption: FORBIDDEN
      project_authority_projection_consumption: FORBIDDEN
      role_resolution_runtime_consumption: FORBIDDEN
      natural_language_allowed: true
      natural_language_is_authority: false

    description_map_boundary:
      description_change_must_not_change_runtime_decision: true
      description_translation_must_not_change_runtime_decision: true
      description_deletion_must_not_change_existing_resolved_machine_role: true
      explanation_may_be_used_for_design_time_vocabulary_refinement: true
      explanation_may_not_be_used_as_runtime_authority: true
      invariant: DESIGN_TIME_REFINEMENT_INPUT_NE_RUNTIME_AUTHORITY

    authority_role_vocabulary_refinement_cycle:
      name: AUTHORITY_ROLE_VOCABULARY_REFINEMENT_CYCLE
      mode: ITERATIVE_SEMANTIC_NORMALIZATION
      trigger:
        - ROLE_DESCRIPTION_EXISTS
        - AUTHORITY_RELEVANT_MEANING_MAY_REMAIN_OUTSIDE_CURRENT_MACHINE_DIMENSIONS
      stages:
        - EXTRACT_AUTHORITY_RELEVANT_SEMANTICS_FROM_ROLE_EXPLANATION_FOR_DESIGN_REVIEW
        - COMPARE_WITH_CURRENT_CLOSED_MACHINE_DIMENSIONS
        - IDENTIFY_UNREPRESENTED_AUTHORITY_RELEVANT_MEANING
        - PROPOSE_NEW_MACHINE_DIMENSION_CANDIDATE_WHEN_NEEDED
        - QUALIFY_DIMENSION_CANDIDATE
        - REGISTER_APPROVED_CLOSED_MACHINE_DIMENSION
        - REEXPRESS_RELEVANT_ADR_ROLE_VECTORS
        - RECHECK_REMAINING_AUTHORITY_RELEVANT_NATURAL_LANGUAGE_SEMANTICS
        - REPEAT_UNTIL_NO_REQUIRED_MACHINE_SEMANTICS_REMAIN_OUTSIDE_VOCABULARY

    machine_dimension_candidate_qualification:
      required_checks:
        - NOT_ALREADY_EXPRESSIBLE_BY_EXISTING_MACHINE_DIMENSIONS
        - NOT_AUTHORITY_TYPE_RESPONSIBILITY
        - NOT_SUBJECT_BINDING_RESPONSIBILITY
        - NOT_HUMAN_RATIONALE_ONLY
        - REUSABLE_SEMANTIC_AXIS
        - MACHINE_DECISION_RELEVANCE_EXISTS
        - CLOSED_VOCABULARY_REPRESENTATION_IS_POSSIBLE
      explanation_occurrence_alone_creates_dimension: false
      arbitrary_dimension_growth: FORBIDDEN
      approval_required_before_registry_addition: true

    vocabulary_refinement_states:
      EXPLANATION_ONLY:
        machine_dimension_registered: false
        runtime_authority: false
      DIMENSION_CANDIDATE:
        machine_dimension_registered: false
        runtime_authority: false
      QUALIFIED_MACHINE_DIMENSION:
        machine_dimension_registered: false
        runtime_authority: false
      REGISTERED_MACHINE_DIMENSION:
        machine_dimension_registered: true
        runtime_use_requires_compatible_contract: true
      ADOPTED_IN_ADR_ROLE:
        machine_dimension_registered: true
        relevant_adr_reexpressed: true

    description_completeness:
      description_presence_ne_machine_vocabulary_completeness: true
      machine_coverage_state_required_conceptually: true
      exact_field_name: NOT_FROZEN
      conceptual_states:
        PARTIAL:
          authority_relevant_semantics_remain_outside_machine_vocabulary: true
          roles_description_id_may_be_null: false
        COMPLETE_BUT_HUMAN_EXPLANATION_RETAINED:
          authority_relevant_semantics_remain_outside_machine_vocabulary: false
          human_explanation_still_useful: true
          roles_description_id_may_be_null: false
        FULLY_MACHINE_EXPRESSED:
          authority_relevant_semantics_remain_outside_machine_vocabulary: false
          human_role_explanation_required: false
          roles_description_id_may_be_null: true

    roles_description_id_null_semantics:
      null_is_not_empty_string: true
      meaning: NO_REMAINING_AUTHORITY_RELEVANT_SEMANTICS_OUTSIDE_MACHINE_VOCABULARY_AND_NO_HUMAN_ROLE_DESCRIPTION_REQUIRED
      requires_refinement_cycle_completion_for_current_role_semantics: true
      description_removal_changes_authority_semantic: false
      description_removal_changes_role_vector: false
      description_removal_changes_runtime_eligibility: false

    runtime_vs_evolution_pipeline:
      runtime_authority_pipeline:
        consumes:
          - RESOLVED_CLOSED_MACHINE_ROLE_DIMENSIONS
          - REGISTERED_AUTHORITY_CONTRACT
          - CURRENT_SUBJECT_BINDING
          - CURRENT_TOOL_CAPABILITY
        consumes_role_description: false
      vocabulary_evolution_pipeline:
        may_consume_role_description_for_design_review: true
        may_propose_dimensions: true
        may_register_dimensions_without_approval: false
        directly_changes_runtime_authority: false
      invariant: RUNTIME_AUTHORITY_PIPELINE_NE_VOCABULARY_EVOLUTION_PIPELINE

    approved_invariants:
      - AUTHORITY_ROLE_IS_CLOSED_MACHINE_DIMENSION_VECTOR
      - THREE_CURRENT_BINARY_DIMENSIONS_ALLOW_EIGHT_MACHINE_COMBINATIONS
      - ONE_ADR_ONE_AUTHORITY_SEMANTIC_DOES_NOT_REQUIRE_ONE_EXCLUSIVE_ROLE
      - ALL_FALSE_DECLARED_ROLE_NE_UNRESOLVED_ROLE
      - ROLE_DESCRIPTION_NE_RUNTIME_AUTHORITY
      - ROLE_DESCRIPTION_MAY_FEED_DESIGN_TIME_VOCABULARY_REFINEMENT
      - MACHINE_DIMENSION_ADDITION_REQUIRES_SEMANTIC_QUALIFICATION
      - DESCRIPTION_PRESENCE_NE_MACHINE_VOCABULARY_COMPLETENESS
      - ROLES_DESCRIPTION_ID_NULL_REQUIRES_NO_REMAINING_AUTHORITY_RELEVANT_NATURAL_LANGUAGE_DEPENDENCY
      - RUNTIME_AUTHORITY_PIPELINE_NE_VOCABULARY_EVOLUTION_PIPELINE
      - NATURAL_LANGUAGE_AUTHORITY_EXPLANATION_MUST_CONVERGE_TOWARD_CLOSED_MACHINE_DIMENSIONS


