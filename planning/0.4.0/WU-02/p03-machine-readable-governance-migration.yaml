      one_adr_one_exclusive_role: false
      one_authority_semantic_may_have_multiple_role_effects: true
      invariant: ONE_ADR_ONE_AUTHORITY_SEMANTIC_ONE_RESOLVED_ROLE_VECTOR

    role_resolution_boundary:
      resolved_false_vector:
        vector:
          project_architecture_authority: false
          normative_constraint_authority: false
          governance_control_authority: false
        meaning: EXPLICITLY_NO_CURRENT_AUTOMATIC_AUTHORITY_CONSUMPTION_PATH
        equals_unresolved: false
      unresolved_role:
        must_not_be_encoded_as_all_false: true
        resolution_state: UNRESOLVED
      advisory_role:
