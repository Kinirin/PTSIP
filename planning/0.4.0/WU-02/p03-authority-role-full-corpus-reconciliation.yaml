split_reconciliation:
  define_ordered_decision_process:
    operation: SPLIT
    primary_candidate: govern_decision_precedence_and_resolution
    secondary_candidate: govern_migration_source_ordering
    rationale: "The current dimension combines ordered architecture/owner determination with migration source-processing order. Keep ordered_determination in decision resolution; source ordering is already exactly represented by order_transition_sources."
  define_purpose_vocabulary:
    operation: SPLIT
    primary_candidate: govern_verification_purpose_contract
    secondary_candidate: govern_migration_reconciliation_model
    rationale: "Verification-purpose vocabulary and reconciliation proposal purposes are different semantic domains. Verification purposes remain in VPMS; proposal_purposes belongs to reconciliation planning."
  require_version_revision_transition_inputs:
    operation: SPLIT
    primary_candidate: govern_normative_contract_binding
    secondary_candidate: govern_migration_analysis_pipeline
    rationale: "Version/revision transition binding and the separate typed accepted-target-state input are distinct. The latter belongs to migration analysis inputs."

