planning_contract: ptsip-planning/v1
work_unit: WU-02
document:
  id: WU-02-P03-F-SUBJECT-BINDING-SCHEMA-CONTRACT
  type: DESIGN_CONTRACT
  status: PROJECT_OWNER_APPROVED_AND_FROZEN
  authority: PROJECT_OWNER
  approval: planning/0.4.0/WU-02/p03-f-subject-binding-owner-approval.yaml
  runtime_authority: NONE
  language_neutral_schema: schemas/ptsip-governance-subject-binding.schema.json
  corpus: planning/0.4.0/WU-02/p03-f-subject-binding-corpus.yaml

exact_subject_binding:
  cardinality_per_adr: EXACTLY_ONE
  authority_domain:
    const: PROJECT_GOVERNANCE
  repository_binding:
    scheme:
      const: GITHUB_REPOSITORY_ID
    host:
      required: true
      current_value: github.com
    repository_id:
      type: DECIMAL_IDENTIFIER_STRING
      current_value: '1327447827'
  subject_type:
    const: GOVERNANCE_TOPIC
  subject_identity:
    scheme:
      const: DECISION_TOPIC_ID
    value:
      source: decision.topic_id
      pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'

matching_semantics:
  order:
    - EXACT
    - REGISTERED_MACHINE_RELATIONSHIP
    - NO_MATCH
  registered_machine_relationship:
    registry: decisions/AUTHORITY-SUBJECT-REGISTRY.yaml
    required_before_relaxation: true
    unregistered_relationship_may_match: false
    semantic_similarity_may_match: false
    ai_confidence_may_match: false
  repository_or_subject_mismatch_after_registered_matching: NOT_APPLICABLE
  malformed_binding: INVALID_BINDING

invariants:
  - DECISION_TOPIC_ID_IS_SUBJECT_IDENTITY
  - SUBJECT_TYPE_NE_SECONDARY_TOPIC_TAXONOMY
  - AUTHORITY_EFFECT_NE_SUBJECT_BINDING
  - REPOSITORY_SLUG_NE_STABLE_REPOSITORY_IDENTITY
  - EXACT_MATCH_PRECEDES_REGISTERED_MACHINE_RELATIONSHIP
  - UNREGISTERED_RELAXATION_IS_FORBIDDEN
  - ONE_ADR_HAS_EXACTLY_ONE_INITIAL_SUBJECT_BINDING
