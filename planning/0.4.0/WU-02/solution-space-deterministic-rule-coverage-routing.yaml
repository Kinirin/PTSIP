    status: NOT_REQUIRED
    inherited_from: [WU-00B/D01, WU-00B/D03, WU-00B/D06, WU-00B/D08]
  implementation_authorization: NOT_AUTHORIZED

inputs:
  predecessor: planning/0.4.0/WU-01/WU-01.yaml
  core_freeze: planning/0.4.0/WU-00/WU-00B-core-contract-freeze.yaml
  supporting_design: planning/0.4.0/WU-00/WU-00-core-design-contracts.yaml
  project_profile: ptsip.yaml
  specification:
    family: 0.3.7-draft
    source: https://github.com/Kinirin/PTSIP
    revision: 3c47816770d194ae42f98faedc911d980db0e62a
    representative_rule: PTSIP-PKG-001
    structural_followup_rules: [PTSIP-CLS-002, PTSIP-CLS-010]
  governance:
    primary_lifecycle_boundary: decisions/ADR-0007-primary-lifecycle-boundary-determination.md
    declaration_authority: decisions/ADR-0009-responsibility-map-declaration-authority.md
    decision_index: decisions/INDEX.yaml
  implemented_foundation:
