format: ptsip-wu13-local-agent-cost-control/v1
status: ACTIVE
scope: WU-13
authority: operational_only
normative_specification_change: false

objective:
  description: >-
    Reduce local AI-agent credit consumption by requiring deterministic evidence
    extraction and bounded review before source-wide reasoning.
  success_signal: >-
    Most dependency evidence is handled mechanically and AI reviews only a small
    REVIEW_REQUIRED queue.

machine_first:
  required: true
  order:
    - collect
    - reconcile
    - classify
    - summarize
    - review_bounded
    - validate_batch
  do_not_send_to_ai:
    - AUTO_RESOLVED
    - RESOLVER_LIMITATION
  repository_defect_policy: >-
    Prefer deterministic remediation candidates. Escalate only when a support,
    version, ownership, or compatibility decision is still required.
  ai_allowed_bucket:
    - REVIEW_REQUIRED

review_budget:
  max_items_per_cycle: 8
  max_source_files_per_item: 4
  max_context_bytes_per_item: 12000
  overflow: DEFER
  require_evidence_ids: true
  require_exact_paths: true

bootstrap:
  focused_test:
    command:
      - python
      - -m
      - pytest
      - tests/ptsip/conformance/test_dependency_reconciliation.py
      - -q
  conform_report:
    output_location: TEMP
    powershell:
      - '$wu13Report = Join-Path $env:TEMP "ptsip-wu13-conform.json"'
      - 'ptsip conform . --json | Set-Content -LiteralPath $wu13Report -Encoding UTF8'
      - '$wu13ExitCode = $LASTEXITCODE'
  compact_summary:
    powershell:
      - '$wu13Result = Get-Content -LiteralPath $wu13Report -Raw -Encoding UTF8 | ConvertFrom-Json'
      - '$wu13Blocking = @($wu13Result.coverage.blocking_gaps)'
      - '$wu13Runtime = @($wu13Blocking | Where-Object { $_.id -like "dependency-target:*" })'
      - '$wu13Verification = @($wu13Blocking | Where-Object { $_.id -like "verification-dependency-target:*" })'
      - '[pscustomobject]@{ Outcome=$wu13Result.outcome; Blocking=$wu13Blocking.Count; RuntimeDependency=$wu13Runtime.Count; VerificationDependency=$wu13Verification.Count; CombinedDependency=($wu13Runtime.Count + $wu13Verification.Count); ExitCode=$wu13ExitCode }'
  full_json_console_output: prohibited_by_default

validation_cadence:
  focused_change: focused_tests_only
  tranche_complete: conformance_suite
  checkpoint: full_regression
  avoid:
    - full_ci_per_dependency
    - full_conform_per_dependency

implementation_priority:
  - actionability_classifier
  - review_pack_generator
  - concise_summary
  - incremental_evidence_cache
  - validation_plan_generator
  - verification_dependency_separation
  - relative_import_reconciliation
  - namespace_local_package_reconciliation
  - dynamic_import_classification
  - consumer_remeasurement

implemented:
  - actionability_classifier
  - review_pack_generator
  - incremental_evidence_cache
  - validation_plan_generator

public_surface_workflow:
  analyze:
    command: [ptsip, dependency, analyze, .]
    machine_report:
      output_location: TEMP
      powershell:
        - '$wu13Analysis = Join-Path $env:TEMP "ptsip-wu13-analysis.json"'
        - 'ptsip dependency analyze . --json | Set-Content -LiteralPath $wu13Analysis -Encoding UTF8'
        - '$wu13AnalysisExitCode = $LASTEXITCODE'
        - '$wu13AnalysisResult = Get-Content -LiteralPath $wu13Analysis -Raw -Encoding UTF8 | ConvertFrom-Json'
        - '$wu13AnalysisResult.summary'
  review_pack:
    command: [ptsip, dependency, review-pack, ., --max-items, '8', --max-context-bytes, '12000']
    output_location: external_tool_owned_state
    ai_input: selected_review_pack_items_only
    insufficient_import_context: DEFER
    ai_review_count: record_separately_from_generator_count
  validation_plan:
    command: [ptsip, dependency, validation-plan, ., --changed, src/ptsip/dependency_analysis.py]
    changed_path_policy: replace_example_with_actual_tracked_paths_and_repeat_changed_as_needed
    authority: advisory_only
    execution: explicitly_run_proposed_commands_at_applicable_validation_cadence
  policy: >-
    Run analysis before detailed review. Use only the bounded Review Pack as
    detailed AI input and defer insufficient or overflow context. Reuse unchanged
    source evidence through the external cache and compare report deltas before
    repeating collection. Apply generated validation plans at focused and batch
    boundaries; preserve full regression and exact-SHA checkpoint requirements.
    These advisory surfaces do not replace strict conformance, resolve support
    or ownership decisions, or authorize consumer changes.
  prohibit:
    - reading_all_dependency_sources
    - passing_full_conform_json_to_ai
    - repeated_search_for_already_collected_evidence

stop_conditions:
  - PTSIP_GATE_DECISION_REQUIRED
  - NORMATIVE_SPECIFICATION_CHANGE_REQUIRED
  - NEW_ARCHITECTURE_OWNERSHIP_DECISION_REQUIRED
  - DIRTY_WORKTREE_WITH_UNRELATED_USER_CHANGES
