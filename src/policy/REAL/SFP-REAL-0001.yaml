  - id: SRC-0008
    source_pointer: /authority_semantics/family_definition/kernel_definitions/0
    value:
      id: SUP_DECLARATION_PRESERVING_MATERIALIZATION
      statement: 명시적으로 선택된 immutable template/source에서 effective map과 projection을 결정론적으로 materialize하고 source facts 및 derived
        provenance를 보존한다.
      non_substitutability: ARCH의 설계 의도나 INFO의 schema가 실제 materialization 결과를 생성하지 않으며 생성 과정도 새 architecture 의도를 추론할 수 없다.
  - id: SRC-0009
    source_pointer: /authority_semantics/family_definition/kernel_definitions/1
    value:
      id: SUP_PREPARED_WRITE_AND_FAILURE_INTEGRITY
      statement: 허용된 prepared write의 적용 단위, 원자성과 실패 보존을 정한다. read-only operation은 repository-local state를 materialize하지 않는다.
      non_substitutability: CTRL의 fresh eligibility나 GOV의 승인은 쓰기 중 partial mutation과 실패 보존의 실행 mechanics를 대신 보장하지 않는다.
