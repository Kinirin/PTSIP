    source_pointer: /authority_subject
    value:
      id: SUP_FRESH_CONSUMER_ACTION_ELIGIBILITY
      statement: consumer repository/profile/authority의 fresh state를 기준으로 특정 prepared mutation이나 transition의 현재 실행 허용 여부를
        소유한다.
