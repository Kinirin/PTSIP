schema_version: ptsip-support-root-family-policy/v1
policy_class: PTSIP_SUPPORT_FEATURE
responsibility_family: CTRL
policy:
  id: SFP-CTRL-0001
  title: CTRL authority (ACTIVE source responsibilities)
  status: ACTIVE
authority_subject:
  id: SUP_FRESH_CONSUMER_ACTION_ELIGIBILITY
  statement: consumer repository/profile/authority의 fresh state를 기준으로 특정 prepared
    mutation이나 transition의 현재 실행 허용 여부를 소유한다.
exclusive_kernel:
- SUP_FRESH_REPOSITORY_PROFILE_AUTHORITY_GATE
- SUP_STALE_WRITER_AND_PREAUTHORIZED_TRANSITION_GATE
authority_contract:
  authority_type: ROOT_FAMILY_CTRL
  schema_id: ptsip.governance/root-family/ctrl
  schema_version: 1
authority_semantics:
  family_definition:
    kernel_definitions:
    - id: SUP_FRESH_REPOSITORY_PROFILE_AUTHORITY_GATE
      statement: 실행 직전 repository/profile revision과 관련 distributed authority를 확인한다.
        완전한 local declaration만으로 필요한 remote authority 읽기를 생략하지 않는다.
      non_substitutability: GOV의 이전 winner나 ASSURE의 과거 PASS는 현재 profile/authority
        freshness를 대신 보장하지 않는다.
    - id: SUP_STALE_WRITER_AND_PREAUTHORIZED_TRANSITION_GATE
      statement: expected revision, operation identity와 등록된 transition 조건으로 stale
        writer 및 무권한 mutation을 차단한다. unresolved 관계는 fail-closed한다.
      non_substitutability: REAL의 원자적 write 구현이나 OPS의 재시도는 stale 상태에 대한 실행 허용을 만들
        수 없다.
