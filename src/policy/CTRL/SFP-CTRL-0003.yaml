        },
        {
          "id": "SUP_STALE_WRITER_AND_PREAUTHORIZED_TRANSITION_GATE",
          "statement": "expected revision, operation identity와 등록된 transition 조건으로 stale writer 및 무권한 mutation을 차단한다. unresolved 관계는 fail-closed한다.",
          "non_substitutability": "REAL의 원자적 write 구현이나 OPS의 재시도는 stale 상태에 대한 실행 허용을 만들 수 없다."
        }
