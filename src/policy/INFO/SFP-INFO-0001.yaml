      schema_id: ptsip.governance/root-family/info
      schema_version: 1
  - id: SRC-0008
    source_pointer: /authority_semantics/family_definition/kernel_definitions/0
    value:
      id: SUP_CANONICAL_INFORMATION_MODEL
      statement: profile의 classification, roles, relationships, source_mode 및 evidence 정보형을 서로 다른 의미 축으로 정의한다.
      non_substitutability: ARCH의 특정 project 선언이나 ASSURE의 판정이 정보 축의 의미를 합치거나 새 canonical alias를 만들 수 없다.
  - id: SRC-0009
    source_pointer: /authority_semantics/family_definition/kernel_definitions/1
    value:
      id: SUP_SEMANTIC_SOURCE_AND_PROJECTION_BINDING
      statement: Source Profile 및 context semantic source와 결정론적 effective/projection 정보의 결합과 non-authoritative derivation
        관계를 명시한다.
      non_substitutability: REAL의 출력 파일 존재나 RECORD의 과거 snapshot은 현재 source 의미를 대신 소유하지 않는다.
