  - id: SRC-0005
    source_pointer: /authority_subject
    value:
      id: SUP_PROFILE_CONTEXT_INFORMATION_SEMANTICS
      statement: consumer profile, canonical effective metadata, Context Plane 및 관측 evidence의 정보 의미와 semantic source/projection
        구분을 소유한다.
  - id: SRC-0006
    source_pointer: /exclusive_kernel
    value:
    - SUP_CANONICAL_INFORMATION_MODEL
    - SUP_SEMANTIC_SOURCE_AND_PROJECTION_BINDING
