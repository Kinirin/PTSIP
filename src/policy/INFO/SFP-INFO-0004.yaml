    current_composition_legacy_authority_boundary: CURRENT_AUTHORITY_FULLY_SEPARATED_FROM_LEGACY
    logical_profile_model: SINGLE_LOGICAL_PROFILE
    source_membership_authority: REGISTERED_MEMBERSHIP
    component_fragment_ownership: ATOMIC_COMPONENT_OWNERSHIP
