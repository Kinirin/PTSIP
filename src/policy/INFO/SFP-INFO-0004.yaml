      machine_verifiable_recovery_conditions_required: true
      qualified_recovery_without_per_case_approval_allowed: true
      unqualified_or_ambiguous_recovery: ESCALATE_WITHOUT_MUTATION
      recovered_sources_require_complete_revalidation: true
    source_change:
      authority_transition: ATOMIC
      publication_requires_complete_validated_source_set: true
      intermediate_storage_state_confers_authority: false
      failed_or_partial_change_can_activate_new_profile: false
      intermediate_physical_storage_state_permitted: true
