    grouping_stability: GLOBAL_REOPTIMIZATION
    relationship_source_ownership: PROFILE_LEVEL_RELATIONSHIP_OWNERSHIP
    relationship_source_partitioning: MULTI_RELATIONSHIP_SOURCE_ALLOWED
    relationship_declaration_ownership: ATOMIC_RELATIONSHIP_OWNERSHIP
    source_assembly_consistency: COMPLETE_ASSEMBLY_ONLY
