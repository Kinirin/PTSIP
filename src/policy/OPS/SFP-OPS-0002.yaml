  "policy": {
    "id": "SFP-OPS-0002",
    "title": "Engine composition outcome and recovery responsibility (DRAFT)",
    "status": "DRAFT"
  },
  "authority_subject": {
    "id": "SUP_AVAILABLE_CAPABILITY_CONTINUITY_AND_RECOVERY",
    "statement": "PTSIP Engine approved-direction draft; does not activate runtime semantics or supersede existing ACTIVE authority."
  },
  "exclusive_kernel": [
    "SUP_OPERATIONAL_RECOVERY_WITH_AUTHORITY_PRESERVATION",
    "SUP_IDEMPOTENT_RETRY_AND_RECONCILIATION"
  ],
  "authority_contract": {
    "authority_type": "ROOT_FAMILY_OPS",
    "schema_id": "ptsip.governance/root-family/ops",
    "schema_version": 1
  },
  "authority_semantics": {
    "family_definition": {
      "kernel_definitions": [
        {
          "id": "SUP_OPERATIONAL_RECOVERY_WITH_AUTHORITY_PRESERVATION",
          "statement": "지원된 operation의 실패 분류, 회복과 canonical namespace 유지 조건을 정한다. 충돌 source, stale lock 또는 모호한 journal을 임의 폐기하지 않는다.",
          "non_substitutability": "REAL의 단일 성공 write나 SUPPLY의 환경 공급이 장애 이후 authority 보존과 운영 회복 책임을 대체하지 못한다."
        },
        {
          "id": "SUP_IDEMPOTENT_RETRY_AND_RECONCILIATION",
          "statement": "계약에 정의된 operation ID와 expected revision을 보존해 재시도하고 conflict를 검토 가능하게 유지한다. RESERVED .ptsip/tasks 또는 .ptsip/runtime의 미정 persistence 의미를 새로 정의하지 않는다.",
          "non_substitutability": "CTRL의 한 번의 실행 허용이나 CHANGE의 migration 경로는 반복 시도의 동일성 및 운영 연속성을 대신 정의하지 않는다."
        }
      ],
      "source_scope": []
    },
    "domain": "PTSIP_ENGINE",
    "draft_activation": "BLOCKED_PENDING_USER_REVIEW_AND_RESOLUTION",
    "approved_decisions": {
      "per_engine_outcome_owner": "EXECUTING_ENGINE",
      "combined_operation_outcome_owner": "INDEPENDENT_COMPOSITION_COORDINATOR",
      "coordinator_new_policy_authority": false,
      "recovery_must_preserve_operation_identity": true,
      "irreversible_or_mutating_failure_requires_existing_ctrl_real_ops_gates": true
    },
    "invariants": {
      "no_success_from_partial_failed_composition": true,
      "no_recovery_path_can_synthesize_authorization": true,
      "retries_must_respect_original_operation_and_expected_revision": true,
      "composition_result_requires_member_outcome_provenance": true
    },
    "unresolved_decisions": [
      {
        "id": "COMPOSITION_RECOVERY_AND_FAILURE_PROPAGATION_INTERFACE",
