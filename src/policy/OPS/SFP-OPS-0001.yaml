    source_pointer: /authority_semantics/family_definition/kernel_definitions/1
    value:
      id: SUP_IDEMPOTENT_RETRY_AND_RECONCILIATION
      statement: 계약에 정의된 operation ID와 expected revision을 보존해 재시도하고 conflict를 검토 가능하게 유지한다. RESERVED .ptsip/tasks 또는 .ptsip/runtime의
        미정 persistence 의미를 새로 정의하지 않는다.
      non_substitutability: CTRL의 한 번의 실행 허용이나 CHANGE의 migration 경로는 반복 시도의 동일성 및 운영 연속성을 대신 정의하지 않는다.
