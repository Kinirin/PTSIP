          policy_base_semantic_owner: "GO_COMMON_CONTRACT"
          single_declared_semantic_owner_per_contract: true
          developer_is_extension: true
          developer_must_not_redefine_base_semantics: true
          consumer_custom_contract_independent_from_official_source: true
        plan_state_permission_binding_20261128: {"scope":"OFFICIAL_PTSIP_PRODUCT_PLAN_CONTRACT","status_permission_binding":"INDIVISIBLE","approval_authority_source":"REGISTERED_STATUS","status_definition_owner":"INDEPENDENT_OFFICIAL_PLAN_STATE_PERMISSION_CONTRACT","initial_official_status_count":7,"permanent_status_count_limit":false,"registered_permission_binding_required":true,"unregistered_or_unbound_status_usage":"FORBIDDEN","permission_acquisition":"AUTOMATIC_ON_VALID_STATUS","instance_permission_change":"CHANGE_STATUS","independent_plan_permission_declarations":"FORBIDDEN","per_instance_permission_override":"FORBIDDEN","separate_plan_approval_evidence":"REMOVE","separate_plan_approval_history":"REMOVE","duplicate_plan_approval_states":"FORBIDDEN","insufficient_permissions":{"preferred":"REGISTER_NEW_STATUS_WITH_PERMISSION_BINDING","alternative":"REVISE_EXISTING_STATUS_PERMISSION_BINDING"},"existing_status_revision":{"all_usage_impact_analysis":"REQUIRED","semantic_identity_preservation":"REQUIRED","usage_specific_exceptions":"FORBIDDEN","permission_addition":"ONLY_IF_ALL_USAGE_REMAINS_VALID_WITHOUT_EXCEPTIONS","semantic_identity_change":"REGISTER_NEW_STATUS"},"status_assignment_authority":"NOT_GRANTED_BY_TARGET_STATUS","higher_policy_and_work_scope":"PRESERVED","consumer_owned_independent_contracts":"PRESERVED","developer_policy_change_approval":"OUTSIDE_PRODUCT_STATUS_PERMISSION_BINDING","permission_mapping_and_transition_details":"PERMISSION_MAPPING_UNRESOLVED;TRANSITION_PATH_FREE;ASSIGNMENT_AUTHORITY_UNCHANGED","status_transition_path":"FREE","fixed_transition_order_required":false,"fixed_transition_graph_required":false,"permission_binding_owner":"INDEPENDENT_OFFICIAL_PLAN_STATE_PERMISSION_CONTRACT","ownership_model":"INDEPENDENT_STATE_PERMISSION_CONTRACT","single_semantic_owner_for_status_and_permissions":true,"lifecycle_contract_role":"CONSUMER_OF_REGISTERED_STATE_PERMISSION_CONTRACT","lifecycle_independent_status_or_permission_definition":"FORBIDDEN","