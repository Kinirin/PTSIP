  "authority_semantics": {
    "family_definition": {
      "kernel_definitions": [
        {
          "id": "SUP_OBSERVATION_RECEIPT_SOURCE_BINDING",
          "statement": "report와 receipt를 실제 관측 repository/profile/authority revision 및 Artifact snapshot에 결합하고 다른 시점의 결과를 섞지 않는다.",
          "non_substitutability": "ASSURE의 conformance 판정이나 CTRL의 실행 허용은 그 결과의 재확인 가능한 source provenance를 자동 보존하지 않는다."
        },
        {
          "id": "SUP_TRACEABILITY_RETENTION_AND_RETRIEVAL",
          "statement": "operation identity, observed evidence와 판단 출처의 보존 및 조회를 정한다. 기록은 새로운 global authority나 live canonical source가 되지 않는다.",
          "non_substitutability": "GOV의 현재 winner나 INFO의 semantic source는 이전 사건의 history와 원본 receipt를 대체하지 못한다."
        }
      ],
      "source_scope": []
    },
    "unit_consumer_analysis_approved_decisions": {
      "analysis_tiers": "WORKING_AND_REUSABLE",
      "working_retention_scope": "MACHINE_DERIVED_SELECTIVE_RETENTION",
      "working_retention_release": "CONTRACT_PROVEN_RETENTION_RELEASE",
      "mandatory_record_retention": "PRESERVED_WITH_PRECEDENCE",
      "original_records_for_equivalence": "PRESERVE_ID_PROVENANCE_AND_VERIFICATION_HISTORY",
      "retention_inputs": "EXISTING_TASK_REFERENCE_VERIFICATION_AND_RECORD_CONTRACTS",
      "per_record_manual_retention_list": "NOT_REQUIRED"
    },
    "unit_consumer_analysis_invariants": {
      "working_retention_needs_machine_proven_reference_scope": true,
      "lifecycle_end_alone_proves_release": false,
      "no_reference_found_proves_release": false,
      "unresolved_reference_or_retention_obligation": "FAIL_CLOSED_KEEP",
      "cleanup_eligible_does_not_authorize_deletion": true,
      "reusable_logical_merge_does_not_merge_or_delete_source_records": true,
