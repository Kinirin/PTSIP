  "policy": {
    "id": "SFP-RECORD-0003",
    "title": "Engine simulation and operational evidence provenance (DRAFT)",
    "status": "DRAFT"
  },
  "authority_subject": {
    "id": "SUP_OBSERVATION_AND_OPERATION_PROVENANCE",
    "statement": "PTSIP Engine approved-direction draft; does not activate runtime semantics or supersede existing ACTIVE authority."
  },
  "exclusive_kernel": [
    "SUP_OBSERVATION_RECEIPT_SOURCE_BINDING",
    "SUP_TRACEABILITY_RETENTION_AND_RETRIEVAL"
  ],
  "authority_contract": {
    "authority_type": "ROOT_FAMILY_RECORD",
    "schema_id": "ptsip.governance/root-family/record",
    "schema_version": 1
  },
  "authority_semantics": {
    "family_definition": {
      "kernel_definitions": [
        {
          "id": "SUP_OBSERVATION_RECEIPT_SOURCE_BINDING",
          "statement": "report와 receipt를 실제 관측 repository/profile/authority revision 및 Artifact snapshot에 결합하고 다른 시점의 결과를 섞지 않는다.",
          "non_substitutability": "ASSURE의 conformance 판정이나 CTRL의 실행 허용은 그 결과의 재확인 가능한 source provenance를 자동 보존하지 않는다."
        },
        {
          "id": "SUP_TRACEABILITY_RETENTION_AND_RETRIEVAL",
          "statement": "operation identity, observed evidence와 판단 출처의 보존 및 조회를 정한다. 기록은 새로운 global authority나 live canonical source가 되지 않는다.",
          "non_substitutability": "GOV의 현재 winner나 INFO의 semantic source는 이전 사건의 history와 원본 receipt를 대체하지 못한다."
        }
      ],
      "source_scope": []
    },
    "domain": "PTSIP_ENGINE",
    "draft_activation": "BLOCKED_PENDING_USER_REVIEW_AND_RESOLUTION",
    "approved_decisions": {
      "evidence_tracks": [
        "ISOLATED_SIMULATION",
        "OPERATIONAL_OBSERVATION"
      ],
      "reuse_requires_current_conditions_applicability": true,
      "outcome_provenance": "ENGINE_VERSION_CONTRACT_SOURCE_ENVIRONMENT_WORKLOAD_EVALUATION_OBJECTIVE",
      "cached_record_is_not_new_authority": true,
      "recording_a_success_is_not_conformance": true
    },
    "invariants": {
      "every_record_keeps_origin_and_observation_context": true,
      "unlike_conditions_must_not_be_silently_merged": true,
      "provenance_identity_must_remain_queryable": true,
      "selection_winner_not_defined_by_most_recent_receipt": true
    },
    "unresolved_decisions": [
      {
        "id": "EVIDENCE_RECORD_AND_CACHE_DATA_MODEL",
        "kind": "CONTRACT_DESIGN",
        "status": "UNRESOLVED"
      },
      {
        "id": "EVIDENCE_RETENTION_AND_INVALIDATION_HANDOFF",
        "kind": "CONTRACT_DESIGN",
        "status": "UNRESOLVED"
      }
    ],
    "activation_requirements": {
      "owner_decisions_all_resolved": true,
      "responsibility_mapping_verified": true,
      "conflicts_with_existing_active_policies_resolved": true,
      "machine_contract_and_registry_validation_passed": true,
      "explicit_separate_user_active_approval_required": true
    },
    "out_of_scope": [
      "IMMEDIATE_RUNTIME_ACTIVATION",
      "EXISTING_ACTIVE_POLICY_MUTATION",
