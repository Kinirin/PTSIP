  items:
  - id: SRC-0001
    source_pointer: /schema_version
    value: ptsip-support-root-family-policy/v1
  - id: SRC-0002
    source_pointer: /policy_class
    value: PTSIP_SUPPORT_FEATURE
  - id: SRC-0003
    source_pointer: /responsibility_family
    value: CHANGE
  - id: SRC-0004
    source_pointer: /policy
    value:
      id: SFP-CHANGE-0001
      title: CHANGE authority (ACTIVE source responsibilities)
      status: ACTIVE
  - id: SRC-0005
    source_pointer: /authority_subject
    value:
      id: SUP_EXPLICIT_PROFILE_AUTHORITY_MIGRATION
      statement: consumer의 기존 profile, context 및 authority 상태에서 명시된 target 의미로 이동하는 변경 대응과 compatibility 및 staged
        migration 흐름을 소유한다. 필요한 작업 책임은 등록된 RA 식별자로 참조하며 RAC 연결과 AEC 권한 조건을 CHANGE에 중복 선언하지 않는다.
  - id: SRC-0006
    source_pointer: /exclusive_kernel
    value:
    - SUP_SOURCE_TARGET_SEMANTIC_MAPPING
    - SUP_COMPATIBILITY_ORDER_AND_RETIREMENT
  - id: SRC-0007
    source_pointer: /authority_contract
    value:
      authority_type: ROOT_FAMILY_CHANGE
      schema_id: ptsip.governance/root-family/change
      schema_version: 1
  - id: SRC-0008
    source_pointer: /authority_semantics/family_definition/kernel_definitions/0
    value:
      id: SUP_SOURCE_TARGET_SEMANTIC_MAPPING
      statement: 지원된 source와 target의 의미 대응, 보존할 사실과 unresolved 선택을 명시한다. legacy TOOLCHAIN, lifecycle_owner 또는 version 문자열을
        canonical 의미로 기계 치환하지 않는다.
      non_substitutability: INFO의 새 schema 유효성이나 REAL의 parser 성공만으로 역사적 상태의 의미가 target과 동등해지지 않는다.
  - id: SRC-0009
    source_pointer: /authority_semantics/family_definition/kernel_definitions/1
    value:
      id: SUP_COMPATIBILITY_ORDER_AND_RETIREMENT
      statement: 명시적으로 등록된 migration 경로와 호환 입력 범위를 식별하고 선행 validation 또는 legacy retirement가 필요한 경우
        RA_list.yaml에 등록된 해당 RA 책임을 참조하여 호출한다. 폐기 조건과 RAC 연결 및 AEC 권한 행사 조건은 CHANGE가 정의하지 않으며 RA 책임 선언에 따른다.
        문서나 인접 version에서 누락된 hop을 추론하지 않는다.
      non_substitutability: CNTR의 호환 약속이나 OPS의 회복 절차만으로 semantic replacement와 legacy deletion이 허용되지 않는다.
