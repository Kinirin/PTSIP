  id: SUP_EXPLICIT_PROFILE_AUTHORITY_MIGRATION
  statement: consumer의 기존 profile, context 및 authority 상태에서 명시된 target 의미로 이동하는 변경
    대응과 compatibility 및 staged migration을 소유한다.
