authority_semantics:
  family_definition:
    kernel_definitions:
    - id: SUP_SOURCE_TARGET_SEMANTIC_MAPPING
      statement: 지원된 source와 target의 의미 대응, 보존할 사실과 unresolved 선택을 명시한다. legacy TOOLCHAIN,
        lifecycle_owner 또는 version 문자열을 canonical 의미로 기계 치환하지 않는다.
      non_substitutability: INFO의 새 schema 유효성이나 REAL의 parser 성공만으로 역사적 상태의 의미가 target과
        동등해지지 않는다.
    - id: SUP_COMPATIBILITY_ORDER_AND_RETIREMENT
      statement: 명시적으로 등록된 migration 경로, 호환 입력의 범위, 선행 validation 및 legacy retirement
        조건을 정한다. 문서나 인접 version에서 누락된 hop을 추론하지 않는다.
      non_substitutability: CNTR의 호환 약속이나 OPS의 회복 절차만으로 semantic replacement와 legacy
        deletion이 허용되지 않는다.
