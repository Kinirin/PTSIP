  "authority_subject": {
    "id": "SUP_PROJECT_AUTHORITY_LEGITIMACY",
    "statement": "SFP-GOV-0002는 엔진 선택 및 확정된 선택 변경에 관한 결정의 정당성, 승인 출처, 검증된 분석의 단계적 자율성 확대 권한 정책에 대한 내용을 관리한다. 조건의 정보 의미, 엔진 기능 계약, 실행 허가와 실제 상태 변경이 발생할 때 이에 대한 관리법에 대한 정책을 위주로 책임을 가진다."
  },
  "exclusive_kernel": [
    "SUP_SUBJECT_ROLE_AND_DECISION_MANDATE",
    "SUP_COORDINATED_WINNER_AND_AUTHORITY_SCOPE"
  ],
