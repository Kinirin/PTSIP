    "family_definition": {
      "kernel_definitions": [
        {
          "id": "SUP_SUBJECT_ROLE_AND_DECISION_MANDATE",
          "statement": "subject applicability, 결정 주체 및 Authority Role의 효력을 shipped registry의 정확한 identity와 명시적 relationship으로만 해석한다.",
          "non_substitutability": "ARCH의 완전한 local profile이나 AI의 의미 유사성이 Project Authority와 역할 권한을 만들어 내지 못한다."
        },
        {
          "id": "SUP_COORDINATED_WINNER_AND_AUTHORITY_SCOPE",
          "statement": "최초 유효 확정 결정 우선 원칙와 global authority/local projection 구분에 따라 어느 적법한 결정이 해당 subject의 winner인지 정한다.",
          "non_substitutability": "CTRL의 fresh read 성공이나 RECORD의 가장 최근 기록이라는 사실만으로 authority winner가 바뀌지 않는다."
        }
      ]
    },
