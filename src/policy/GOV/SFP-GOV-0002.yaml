  Boundary:
    scope: "엔진 선택·확정된 선택 변경의 결정 정당성, 승인 출처, 검증된 분석에 따른 단계적 자율성 확대와 인접 계약·권한·상태 변경의 거버넌스"
    subjects:
      - "엔진 선택 결정의 주체, 적용 범위와 결정 정당성을 관리한다."
      - "엔진 선택 및 변경의 승인 출처와 그 효력 범위를 관리한다."
      - "확정된 엔진 선택 변경의 정당한 결정·승인 관계를 관리한다."
      - "검증된 분석에 따른 자율성 확대의 정당성과 승인 경계를 관리한다."
      - "조건의 정보 의미, 엔진 기능 계약, 실행 허가, 실제 상태 변경과 관련된 권한·변경 관리의 경계를 조정한다."
    exclusions:
      - "INFO의 정보 의미, CNTR의 기능 계약을 GOV가 직접 재정의하지 않는다."
      - "CTRL의 실행 허가, REAL의 실제 상태 변경을 GOV가 직접 수행하지 않는다."
      - "기존 SFP-GOV-0001의 결정 권한을 자동 승계하거나 대체하지 않는다."
      - "검증 결과만으로 신규 승인·실행 권한이나 정책 활성화 효력을 생성하지 않는다."
  Evaluation:
    criteria:
      evidence:
        - "엔진 선택 결정 주체와 정당한 승인 출처를 확인할 수 있는가?"
        - "기존 확정 선택과 변경 결정의 권한 관계를 검증할 수 있는가?"
        - "분석 검증과 자율성 확대 승인의 근거가 구분되는가?"
        - "INFO·CNTR·CTRL·REAL의 의미·실행·상태 책임을 침범하지 않는가?"
        - "SFP-GOV-0001의 결정 권한과의 충돌 및 미해결 사항이 식별되는가?"
        - "미해결 승인·권한 문제를 유지하며 별도 승인 전 활성화하지 않는가?"
