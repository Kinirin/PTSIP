    source_pointer: /authority_semantics/family_definition/kernel_definitions/1
    value:
      id: SUP_COORDINATED_WINNER_AND_AUTHORITY_SCOPE
      statement: 최초 유효 확정 결정 우선 원칙와 global authority/local projection 구분에 따라 어느 적법한 결정이 해당 subject의 winner인지 정한다.
      non_substitutability: CTRL의 fresh read 성공이나 RECORD의 가장 최근 기록이라는 사실만으로 authority winner가 바뀌지 않는다.
