      id: SUP_SUBJECT_ROLE_AND_DECISION_MANDATE
      statement: subject applicability, 결정 주체 및 Authority Role의 효력을 shipped registry의 정확한 identity와 명시적 relationship으로만 해석한다.
      non_substitutability: ARCH의 완전한 local profile이나 AI의 의미 유사성이 Project Authority와 역할 권한을 만들어 내지 못한다.
