schema_version: ptsip-support-root-family-policy/v1
policy_class: PTSIP_SUPPORT_FEATURE
responsibility_family: ASSURE
policy:
  id: SFP-ASSURE-0006
  title: Reusable Test Verification Mode and Evidence Boundary
  status: DRAFT
authority_subject:
  id: SUP_REUSABLE_TEST_VERIFICATION_MODE_EVIDENCE
  statement: src/tests 검증 모듈의 검증 책임과 실행 결과의 판정 경계를 정의한다. Test Mode 실행 대상과 워크플로우 세부 구현은 소유하지 않는다.
exclusive_kernel:
  - SUP_REGISTERED_TEST_MODE_EVIDENCE_ADMISSIBILITY
authority_contract:
  authority_type: ROOT_FAMILY_ASSURE
  schema_id: ptsip.governance/root-family/assure
  schema_version: 1
authority_semantics:
  family_definition:
    kernel_definitions:
      - id: SUP_REGISTERED_TEST_MODE_EVIDENCE_ADMISSIBILITY
        statement: 검증 결과는 등록된 Test Mode, 검증 책임의 정확한 참조, 실제 실행된 target 및 source revision의 증거를 기반으로 판단한다.
        non_substitutability: 워크플로우 성공 메시지나 발견된 테스트 경로만으로 요구된 검증 책임 또는 PTSIP conformance를 대신하지 않는다.
    source_scope: []
  unit_reusable_test_verification_approved_direction:
    consumer_goal: NO_CUSTOM_POLICY_MANAGEMENT_TOOL_REQUIRED_FOR_PTSIP_ADOPTION
    verification_source_root: src/tests
    responsibility_authority: EXPLICIT_PROJECT_PROFILE_VERIFICATION_COMPONENT
    execution_target_authority: REGISTERED_TEST_MODE
    workflow_role: EXECUTION_ORCHESTRATION_AND_VERIFICATION_RESULT_PROJECTION
    workflow_version_target: '2.0'
    test_mode_registry_version_target: '3.0'
    requested_mode_groups:
      - SUPPLY
      - DEVELOPER
    group_order: EXPLICIT_GROUP_BOUNDARY_WITH_NAME_SORT_WITHIN_GROUP
    group_semantics: SUPPLY_PRODUCT_SIDE_DEVELOPER_TOOLING_SIDE
    workflow_dispatch_selection: ONE_BOOLEAN_CHECKBOX_PER_REGISTERED_MODE
    github_scripts_language_rule: GO_REQUIRED_WHERE_REASONABLY_APPLICABLE
  unit_reusable_test_verification_invariants:
    mode_group_cannot_create_component_ownership: true
    test_path_cannot_create_responsibility_authority: true
    workflow_may_create_new_normative_verification_requirements: false
    workflow_may_report_pass_without_required_executed_evidence: false
    full_test_mode_selection_must_resolve_registered_modes: true
    github_scripts_non_go_exception_requires_justification: true
    functional_test_pass_is_ptsip_conformance_by_itself: false
    implementation_detail_authority: PLAN
  unit_reusable_test_verification_responsibilities:
    ASSURE: VERIFICATION_EVIDENCE_AND_COVERAGE_JUDGMENT
    INFO: REGISTERED_MODE_AND_GROUP_INFORMATION_MEANING
    CNTR: RESOLVER_AND_EXECUTION_INTERFACE
    ARCH: SOURCE_COMPONENT_VERIFICATION_OWNERSHIP
    PLAN: RUNNER_IMPLEMENTATION_WORKFLOW_ADAPTER_AND_MIGRATION
  unit_reusable_test_verification_unresolved_decisions: []
relations:
  supersedes: []
  amends: []
  extends: []
  depends_on: []
