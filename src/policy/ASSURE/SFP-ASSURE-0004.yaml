        "evidence_classes_have_distinct_provenance": true,
        "evaluation_order": "MANDATORY_CONTRACT_CONFORMANCE_BEFORE_PERFORMANCE_RANKING",
        "measured_performance_cannot_compensate_policy_failure": true,
        "evaluation_objective": "POLICY_AND_USER_AUTHORIZED",
        "ranking_model": "MULTI_OBJECTIVE_PARETO_WITH_AUTHORIZED_FURTHER_PREFERENCE",
        "evidence_reuse": "CONDITION_AND_APPLICABILITY_VERIFIED",
        "evidence_missing": "CONTROLLED_AUTHORIZED_AUTOMATIC_REEVALUATION",
        "evidence_sufficient_but_unranked": "DO_NOT_INVENT_NEW_PREFERENCE",
        "environment_sensitive_measurement": true,
        "engine_impact_verification_direction": "DEPENDENCY_GRAPH_COVERAGE_AND_CONTRACT_COMPATIBILITY_EVIDENCE",
        "engine_interoperability_evidence_production_linkage": "PROVIDER_CONSUMER_ENGINE_SPLIT_WITH_ASSURE_NORMATIVE_AUTHORITY_PRESERVED"
      },
      "invariants": {
