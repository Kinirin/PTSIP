        "evidence_without_coverage_not_conformance": true,
        "benchmark_requires_fair_comparability": true,
        "unknown_safety_or_contract_state_not_eligible_for_ranking": true,
        "simulation_must_observe_authorized_side_effect_bounds": true,
        "impact_verification_requires_dependency_coverage_evidence": true,
        "compatibility_verdict_requires_applicable_version_bound_evidence": true,
        "unverified_change_impact_must_not_be_reported_as_no_effect": true,
        "impact_assessment_does_not_override_existing_assure_normative_conformance_authority": true,
        "provider_and_consumer_evidence_roles_do_not_reassign_assure_conformance_verdict": true,
        "provider_evidence_and_consumer_evidence_retain_distinct_provenance_and_applicability_context": true,
        "evidence_linkage_or_engine_level_compatibility_claim_is_not_automatic_ptsip_conformance": true,
        "assure_retains_normative_conformance_judgment_and_evidence_sufficiency_authority": true,
