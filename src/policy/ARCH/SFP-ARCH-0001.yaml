  - id: SRC-0008
    source_pointer: /authority_semantics/family_definition/kernel_definitions/0
    value:
      id: SUP_PRIMARY_LIFECYCLE_OWNER_AND_BOUNDARY
      statement: classification을 governing lifecycle obligation에 따른 primary ownership으로 선언하고 material mixed 책임 및 unresolved
        소유를 구분한다.
      non_substitutability: SUPPLY의 dependency 분류나 관측 파일의 executable 여부가 프로젝트 lifecycle ownership을 자동 결정하지 않는다.
  - id: SRC-0009
    source_pointer: /authority_semantics/family_definition/kernel_definitions/1
    value:
      id: SUP_EXPLICIT_ROLES_AND_TYPED_RELATIONSHIPS
      statement: roles, associated artifacts 및 typed directed relationships를 프로젝트의 명시적 architecture 사실로 선언하고 evidence에서 자동
        생성하지 않는다.
      non_substitutability: INFO의 필드 schema나 REAL의 template materialization이 프로젝트 소유 architecture 의도를 만들어 내지 못한다.
