[package]
name = "ptsip-engine-validation"
version = "0.3.4"
edition = "2021"
rust-version = "1.85"
license-file = "../../../../License-Authority/LICENSE.md"
include = ["src/**", "manifest.json", "contract.json", "execution-bindings.json", "transport.json", "runtime-contracts.json", "Cargo.toml", "Cargo.lock", "version.yaml"]

[dependencies]
serde_json = "1.0"
serde = "1.0"
sha2 = "0.10.9"
jsonschema = { version = "0.58.6", default-features = false }

[lints.rust]
unsafe_code = "forbid"
