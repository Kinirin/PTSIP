[package]
name = "ptsip-engine-validation"
version = "0.3.3"
edition = "2021"
rust-version = "1.88"
license-file = "../../../../License-Authority/LICENSE.md"
include = ["src/**", "manifest.json", "contract.json", "execution-bindings.json", "transport.json", "runtime-contracts.json", "Cargo.toml", "Cargo.lock", "version.yaml"]

[dependencies]
serde_json = "1.0"
serde = "1.0"
sha2 = "0.10.9"
jsonschema = { version = "0.58.6", default-features = false }
referencing = { version = "0.58.6", default-features = false }
url = "2.5"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"
