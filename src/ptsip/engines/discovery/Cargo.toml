[package]
name = "ptsip-engine-discovery"
version = "0.3.3"
edition = "2021"
rust-version = "1.85"
license-file = "../../../../License-Authority/LICENSE.md"
include = [
    "src/**",
    "manifest.json",
    "contract.json",
    "execution-bindings.json",
    "transport.json",
    "runtime-contracts.json",
    "tpbg-f3.schema.json",
    "tests/*.rs",
    "tests/fixtures/*.json",
    "Cargo.toml",
    "Cargo.lock",
    "version.yaml",
]

[dependencies]
serde_json = "1.0"
serde = "1.0"
sha2 = "0.10.9"
jsonschema = { version = "0.58.6", default-features = false }
saphyr = { version = "0.3.3", default-features = false }
saphyr-parser = "0.3.3"

[lints.rust]
unsafe_code = "forbid"
