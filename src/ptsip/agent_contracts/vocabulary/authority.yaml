status: CURRENT
entries:
  - {id: PENDING, meaning: "A coordinated architecture decision exists but has no accepted winner."}
  - {id: RESOLVED, meaning: "One valid architecture answer is the accepted distributed winner."}
  - {id: LOCAL_PROFILE, meaning: "Project-owned durable declaration for the repository revision or worktree; it is not distributed Decision Authority."}
  - {id: DISTRIBUTED_AUTHORITY, meaning: "Coordination plane that determines the accepted winner for a stable distributed decision identity."}
