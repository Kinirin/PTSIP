format: ptsip-agent-vocabulary/v2
vocabulary_id: PTSIP-VOCAB-LIFECYCLE
status: CANDIDATE
domain: PRIMARY_LIFECYCLE_CLASSIFICATION
entries:
  - id: PRODUCT
    category: CLASSIFICATION
    meaning: Responsibility governed by the product lifecycle and product-owned runtime or distribution obligations.
  - id: DEVELOPMENT_TOOLING
    category: CLASSIFICATION
    meaning: Responsibility governed by development-time authoring, analysis, transformation, validation, or reusable development support.
  - id: DELIVERY
    category: CLASSIFICATION
    meaning: Responsibility governed by release, publication, promotion, distribution, deployment, or delivery handoff.
  - id: OPERATIONS
    category: CLASSIFICATION
    meaning: Responsibility governed by post-delivery operation, health, recovery, maintenance, or production-state management.
  - id: NEUTRAL_CONTRACT
    category: CLASSIFICATION
    meaning: Non-executable contract responsibility intentionally independent from executable lifecycle ownership.
