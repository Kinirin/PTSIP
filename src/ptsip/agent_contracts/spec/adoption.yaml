format: ptsip-agent-spec/v2
id: PTSIP-AGENT-SPEC-ADOPTION
status: CANDIDATE
scope: Controlled adoption of PTSIP architecture declarations.
rules:
  - rule_id: PTSIP-ADP-001
    modality: MUST
    subject: adoption
    predicate: preserve_supplied_structured_architecture_facts
    object: LOSSLESS
  - rule_id: PTSIP-ADP-002
    modality: MUST
    subject: adoption_planning
    predicate: mutation
    object: NONE
  - rule_id: PTSIP-ADP-003
    modality: MUST
    subject: adoption_apply
    predicate: freshness_recheck
    object:
      - repository
      - project_profile
      - relevant_authority
  - rule_id: PTSIP-ADP-004
    modality: MUST
    subject: adoption_write
    predicate: authorization
    object: EXPLICIT
  - rule_id: PTSIP-ADP-005
    modality: MUST_NOT
    subject: adoption
    predicate: convert_unresolved_fact_to_assumed_architecture
    object: true
