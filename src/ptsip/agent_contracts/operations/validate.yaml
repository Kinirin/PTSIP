format: ptsip-agent-operation/v2
operation_id: PTSIP-OP-VALIDATE-001
status: CANDIDATE
rule_refs:
  - PTSIP-RMAP-001
  - PTSIP-RMAP-002
  - PTSIP-RMAP-003
  - PTSIP-RMAP-004
  - PTSIP-RMAP-005
  - PTSIP-ACP-GOV-003
mutation:
  default: READ_ONLY
  write_requires: []
preconditions:
  - PROJECT_PROFILE_SELECTED
  - PROJECT_PROFILE_CONTRACT_RESOLVED
steps:
  - step_id: RESOLVE
    action_id: RESOLVE_PROFILE_SCHEMA
    fail_closed_outcomes:
      - UNSUPPORTED_PROFILE_CONTRACT
      - SCHEMA_RESOLUTION_FAILED
  - step_id: STRUCTURE
    action_id: VALIDATE_PROFILE_STRUCTURE
    fail_closed_outcomes:
      - PROFILE_INVALID
  - step_id: SEMANTICS
    action_id: VALIDATE_RESPONSIBILITY_MAP_SEMANTICS
    fail_closed_outcomes:
      - PROFILE_INVALID
outcomes:
  - VALID
  - PROFILE_INVALID
  - UNSUPPORTED_PROFILE_CONTRACT
  - SCHEMA_RESOLUTION_FAILED
