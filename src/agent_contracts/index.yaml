format: ptsip-agent-contract-index/v2
contract_set:
  id: ptsip-agent-contracts
  status: CANDIDATE
  authority_scope: CODING_AGENT_BEHAVIOR
  purpose: Machine-readable normative control plane for coding agents using PTSIP.
dependency_policy:
  markdown_normative_dependency: FORBIDDEN
  unresolved_reference: FAIL_CLOSED
  external_machine_contracts: EXPLICIT_BINDING_ONLY
schemas:
  index: schemas/index.schema.json
  spec: schemas/spec.schema.json
  operation: schemas/operation.schema.json
  vocabulary: schemas/vocabulary.schema.json
  binding: schemas/binding.schema.json
binding:
  current_ref: bindings/current.yaml
specs:
  - id: PTSIP-AGENT-SPEC-CORE
    ref: spec/core.yaml
  - id: PTSIP-AGENT-SPEC-CLASSIFICATION
    ref: spec/classification.yaml
  - id: PTSIP-AGENT-SPEC-RESPONSIBILITY-MAP
    ref: spec/responsibility-map.yaml
  - id: PTSIP-AGENT-SPEC-ADOPTION
    ref: spec/adoption.yaml
  - id: PTSIP-AGENT-SPEC-AUTHORITY
    ref: spec/authority.yaml
  - id: PTSIP-AGENT-SPEC-CONFORMANCE
    ref: spec/conformance.yaml
  - id: PTSIP-AGENT-SPEC-GOVERNANCE
    ref: spec/governance.yaml
  - id: PTSIP-AGENT-SPEC-PROFILE-TRANSITION
    ref: spec/profile-transition.yaml
operations:
  - id: PTSIP-OP-ADOPT-001
    ref: operations/adopt.yaml
  - id: PTSIP-OP-VALIDATE-001
    ref: operations/validate.yaml
  - id: PTSIP-OP-CONFORM-001
    ref: operations/conform.yaml
  - id: PTSIP-OP-RECONCILE-AUTHORITY-001
    ref: operations/reconcile-authority.yaml
  - id: PTSIP-OP-MIGRATE-PROFILE-001
    ref: operations/migrate-profile.yaml
vocabularies:
  - id: PTSIP-VOCAB-LIFECYCLE
    ref: vocabulary/lifecycle.yaml
  - id: PTSIP-VOCAB-OUTCOMES
    ref: vocabulary/outcomes.yaml
  - id: PTSIP-VOCAB-DIAGNOSTICS
    ref: vocabulary/diagnostics.yaml
  - id: PTSIP-VOCAB-AUTHORITY
    ref: vocabulary/authority.yaml
