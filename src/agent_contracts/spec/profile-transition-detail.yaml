      "object": "A supported historical source MUST reconcile directly against the current canonical PP target selected by explicit Tool/PP compatibility authority.\n\nCompleted or historical intermediate Project Profile generations MUST NOT be required as migration hops. No synthetic intermediate profile may be created solely for version traversal."
