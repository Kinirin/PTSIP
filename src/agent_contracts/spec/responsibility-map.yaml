format: ptsip-agent-spec/v2
id: PTSIP-AGENT-SPEC-RESPONSIBILITY-MAP
status: CANDIDATE
scope: Machine-readable project responsibility declaration.
rules:
  - rule_id: PTSIP-RMAP-001
    modality: MUST
    subject: responsibility_map
    predicate: ownership
    object: PROJECT
  - rule_id: PTSIP-RMAP-002
    modality: MUST
    subject: responsibility_map
    predicate: preserve_distinct_axes
    object:
      - classification
      - roles
      - typed_relationships
  - rule_id: PTSIP-RMAP-003
    modality: MUST
    subject: associated_artifact
    predicate: anchor_count
    object: 1
  - rule_id: PTSIP-RMAP-004
    modality: DEFINITION
    subject: responsibility_map_source_mode
    predicate: allowed_values
    object:
      - explicit
      - template
      - hybrid
  - rule_id: PTSIP-RMAP-005
    modality: MUST
    subject: materialized_responsibility_map
    predicate: stable_identity_preserved
    object: true
