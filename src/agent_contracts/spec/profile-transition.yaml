format: ptsip-agent-spec/v2
id: PTSIP-AGENT-SPEC-PROFILE-TRANSITION
status: CURRENT
scope: Project Profile transition from an identified source contract to the current target contract.
rules:
  - rule_id: PTSIP-MIG-001
    modality: MUST
    subject: profile_transition
    predicate: source_identity
    object: EXPLICIT
  - rule_id: PTSIP-MIG-002
    modality: MUST
    subject: profile_transition
    predicate: target
    object: CURRENT_SUPPORTED_PROJECT_PROFILE_CONTRACT
  - rule_id: PTSIP-MIG-003
    modality: MUST_NOT
    subject: retired_profile_semantics
    predicate: become_current_authority_by_readability
    object: true
  - rule_id: PTSIP-MIG-004
    modality: MUST
    subject: lossy_or_ambiguous_transition
    predicate: result
    object: OWNER_DECISION_REQUIRED
  - rule_id: PTSIP-MIG-005
    modality: MUST
    subject: transition_apply
    predicate: stale_state_behavior
    object: REFUSE
