format: ptsip-agent-spec/v2
id: PTSIP-AGENT-SPEC-GOVERNANCE
status: CANDIDATE
scope: Authority and dependency rules for the Agent Contract Plane.
rules:
  - rule_id: PTSIP-ACP-GOV-001
    modality: MUST_NOT
    subject: agent_contract_plane
    predicate: require_markdown_for_normative_behavior
    object: true
  - rule_id: PTSIP-ACP-GOV-002
    modality: MUST
    subject: agent_contract_discovery
    predicate: root
    object: index.yaml
  - rule_id: PTSIP-ACP-GOV-003
    modality: MUST
    subject: unresolved_internal_reference
    predicate: behavior
    object: FAIL_CLOSED
  - rule_id: PTSIP-ACP-GOV-004
    modality: MUST
    subject: external_machine_contract
    predicate: consumption
    object: EXPLICIT_BINDING_REQUIRED
  - rule_id: PTSIP-ACP-GOV-005
    modality: MUST_NOT
    subject: implementation_binding
    predicate: create_normative_semantics
    object: true
