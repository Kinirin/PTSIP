format: ptsip-agent-spec/v2
id: PTSIP-AGENT-SPEC-CONFORMANCE
status: CURRENT
scope: Conformance evaluation semantics and evidence sufficiency.
rules:
  - rule_id: PTSIP-CONF-001
    modality: MUST
    subject: conformance_evaluation
    predicate: remain_distinct_from
    object:
      - PROFILE_VALIDATION
      - AUTHORITY_RECONCILIATION
  - rule_id: PTSIP-CONF-002
    modality: MUST
    subject: completed_conformance_evaluation
    predicate: outcome
    object:
      - CONFORMANT
      - NON_CONFORMANT
      - INCOMPLETE
  - rule_id: PTSIP-CONF-003
    modality: MUST_NOT
    subject: conformant_outcome
    predicate: inferred_from_empty_findings_alone
    object: true
  - rule_id: PTSIP-CONF-004
    modality: MUST
    subject: conformant_outcome
    predicate: blocking_uncertainty
    object: NONE
  - rule_id: PTSIP-CONF-005
    modality: MUST
    subject: evidence_model
    predicate: distinguish
    object:
      - DECLARED
      - OBSERVED
      - INFERRED
  - rule_id: PTSIP-CONF-006
    modality: MUST_NOT
    subject: unresolved_evidence
    predicate: count_as_absence_of_violation
    object: true
