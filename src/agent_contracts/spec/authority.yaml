format: ptsip-agent-spec/v2
id: PTSIP-AGENT-SPEC-AUTHORITY
status: CURRENT
scope: Distributed decision authority and local declaration reconciliation.
rules:
  - rule_id: PTSIP-AUT-001
    modality: MUST
    subject: decision_authority
    predicate: remain_distinct_from
    object: PROJECT_PROFILE
  - rule_id: PTSIP-AUT-002
    modality: MUST
    subject: distributed_decision
    predicate: identity
    object: STABLE_ACROSS_PARTICIPATING_ENVIRONMENTS
  - rule_id: PTSIP-AUT-003
    modality: INVARIANT
    subject: distributed_decision
    predicate: resolution_order
    object: FIRST_VALID_RESOLUTION_WINS
  - rule_id: PTSIP-AUT-004
    modality: MUST
    subject: architecture_sensitive_operation
    predicate: authority_freshness
    object: CURRENT_RELEVANT_STATE_REQUIRED
  - rule_id: PTSIP-AUT-005
    modality: MUST
    subject: authority_profile_reconciliation
    predicate: conflict_behavior
    object: EXPOSE_CONFLICT_WITHOUT_SILENT_OVERWRITE
  - rule_id: PTSIP-AUT-006
    modality: MUST_NOT
    subject: distributed_coordination_failure
    predicate: fallback
    object: ISOLATED_LOCAL_WINNER
  - rule_id: PTSIP-AUT-007
    modality: MUST
    subject: global_decision_state
    predicate: remain_distinct_from
    object: LOCAL_PROJECTION_STATE
