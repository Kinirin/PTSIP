format: ptsip-agent-binding/v2
binding_id: PTSIP-AGENT-BINDING-CURRENT
status: CANDIDATE
contract_set_id: ptsip-agent-contracts
active_specs:
  - PTSIP-AGENT-SPEC-CORE
  - PTSIP-AGENT-SPEC-CLASSIFICATION
  - PTSIP-AGENT-SPEC-RESPONSIBILITY-MAP
  - PTSIP-AGENT-SPEC-ADOPTION
  - PTSIP-AGENT-SPEC-AUTHORITY
  - PTSIP-AGENT-SPEC-CONFORMANCE
  - PTSIP-AGENT-SPEC-GOVERNANCE
  - PTSIP-AGENT-SPEC-PROFILE-TRANSITION
active_operations:
  - PTSIP-OP-ADOPT-001
  - PTSIP-OP-VALIDATE-001
  - PTSIP-OP-CONFORM-001
  - PTSIP-OP-RECONCILE-AUTHORITY-001
  - PTSIP-OP-MIGRATE-PROFILE-001
active_vocabularies:
  - PTSIP-VOCAB-LIFECYCLE
  - PTSIP-VOCAB-OUTCOMES
  - PTSIP-VOCAB-DIAGNOSTICS
