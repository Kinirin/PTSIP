    python_modules:
      - ptsip.validation.profile
      - ptsip.project_profile_contracts
    cli_command: ptsip validate
  - operation_id: PTSIP-OP-CONFORM-001
    python_modules:
      - ptsip.conformance
      - ptsip.conformance_audit
  - operation_id: PTSIP-OP-RECONCILE-AUTHORITY-001
    python_modules:
      - ptsip.app.github_authority
      - ptsip.app.github_reconciliation
  - operation_id: PTSIP-OP-MIGRATE-PROFILE-001
    python_modules:
      - ptsip.migration.analyzer
      - ptsip.migration.direct_planner
      - ptsip.migration.direct_execution
