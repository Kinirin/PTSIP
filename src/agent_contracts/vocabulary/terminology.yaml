{
  "format": "ptsip-agent-vocabulary/v2",
  "vocabulary_id": "PTSIP-VOCAB-TERMINOLOGY",
  "status": "CURRENT",
  "domain": "PTSIP_CANONICAL_TERMINOLOGY",
  "entries": [
    {
      "id": "TERM_CLASSIFICATION",
      "category": "PTSIP_TERM",
      "meaning": "The canonical PTSIP **primary lifecycle ownership** of an in-scope project-owned architectural responsibility.\n\nFor `0.3.6-draft`, the only canonical classifications are:\n\n- `PRODUCT`;\n- `DEVELOPMENT_TOOLING`;\n- `DELIVERY`;\n- `OPERATIONS`;\n- `NEUTRAL_CONTRACT`.\n\nClassification is not a file type, framework label, role, evidence state, confidence value, or VPMS Verification Purpose."
    },
    {
      "id": "TERM_PRIMARY_LIFECYCLE_OWNERSHIP",
      "category": "PTSIP_TERM",
      "meaning": "The lifecycle that primarily owns the existence, change responsibility, compatibility obligations, release/deployment/operation implications, and consumer impact of a project-owned architectural responsibility.\n\nFor `0.3.6-draft`, `classification` is the canonical representation of primary lifecycle ownership.\n\nA separate legacy `lifecycle_owner` field may be consumed by migration tooling as historical metadata, but it must not create a second competing ownership authority or contradict canonical `classification` semantics."
    },
    {
      "id": "TERM_GOVERNING_LIFECYCLE_OBLIGATION",
      "category": "PTSIP_TERM",
      "meaning": "The lifecycle-specific reason a coherent project-owned responsibility must exist, change, remain compatible, execute, or be retired.\n\nPTSIP lifecycle determination uses the governing lifecycle obligation rather than the most common file type, workflow phase, activity verb, technology, invocation frequency, or confidence score."
    },
    {
      "id": "TERM_DELIVERY_HANDOFF",
      "category": "PTSIP_TERM",
      "meaning": "The semantic boundary where a selected release target has reached or been accepted by its intended publication/deployment destination and ordinary ongoing operation begins.\n\nResponsibilities whose primary obligation ends at this boundary are `DELIVERY` candidates. Responsibilities whose primary obligation continues after this boundary to maintain deployed state are `OPERATIONS` candidates."
    },
    {
      "id": "TERM_MATERIAL_MIXED_LIFECYCLE_RESPONSIBILITY",
      "category": "PTSIP_TERM",
      "meaning": "A component state in which one classification cannot describe lifecycle truth without hiding an independently governable responsibility.\n\nMaterial mixed-lifecycle evidence can include different lifecycle triggers, release/compatibility/permission/environment obligations, independently evolving dependencies, distinct failure meanings/owners, or independently changeable release/deploy/operate behavior.\n\nWhen material responsibilities are separable, PTSIP prefers a component-split proposal over forcing one classification."
    },
    {
      "id": "TERM_SUBORDINATE_LIFECYCLE_ACTIVITY",
      "category": "PTSIP_TERM",
      "meaning": "An activity from another lifecycle phase that exists only to complete one coherent primary lifecycle obligation and does not introduce independently governable lifecycle ownership, release, compatibility, permission, environment, or dependency obligations.\n\nSubordinate activity does not by itself require a component split."
    },
    {
      "id": "TERM_PRODUCT",
      "category": "PTSIP_TERM",
      "meaning": "Primary lifecycle ownership for Product runtime, user-facing behavior, Product distribution content, runtime SDK responsibility, and Product-specific quality or verification responsibility.\n\nProduct-owned tests are valid `PRODUCT` responsibilities when their existence and change obligations are owned by the Product lifecycle."
    },
    {
      "id": "TERM_DEVELOPMENT_TOOLING",
      "category": "PTSIP_TERM",
      "meaning": "Primary lifecycle ownership for development support such as reusable verification infrastructure, test SDKs/frameworks, generators, migration tooling, linting, static analysis, developer CLI tooling, build helpers, repository transformation, and development-environment tooling.\n\nIt contains much of the responsibility previously represented by Tool `0.3.5` `TOOLCHAIN`, but it is not a universal one-to-one rename target for legacy `TOOLCHAIN`."
    },
    {
      "id": "TERM_DELIVERY",
      "category": "PTSIP_TERM",
      "meaning": "Primary lifecycle ownership for carrying a release target or Product through release, publication, promotion, distribution, or deployment to a destination environment.\n\nTypical responsibilities include release workflows, package publication, container image build/publication, artifact signing, deployment automation, deployment manifests/configuration, and release promotion."
    },
    {
      "id": "TERM_OPERATIONS",
      "category": "PTSIP_TERM",
      "meaning": "Primary lifecycle ownership for post-deployment operation: maintaining availability, recoverability, production state, infrastructure health, backup/recovery, incident response support, and ongoing production maintenance.\n\nThe Delivery/Operations distinction is based on primary lifecycle purpose and the delivery handoff, not technology."
    },
    {
      "id": "TERM_NEUTRAL_CONTRACT",
      "category": "PTSIP_TERM",
      "meaning": "A deliberately non-executable, non-owning contract responsibility with lifecycle independence from Product, Development Tooling, Delivery, and Operations ownership.\n\nNeutrality is determined by semantics and independent lifecycle, not by directory name, file extension, non-executable form, or current consumer count."
    },
    {
      "id": "TERM_LEGACY_TOOLCHAIN",
      "category": "PTSIP_TERM",
      "meaning": "A canonical Tool `0.3.5` classification retained only as a **legacy migration input concept** in Tool `0.3.6`.\n\n`TOOLCHAIN` is not a canonical Tool `0.3.6` lifecycle classification and must not be preserved as a new-schema alias merely for compatibility.\n\nLegacy `TOOLCHAIN` responsibility may migrate to `PRODUCT`, `DEVELOPMENT_TOOLING`, `DELIVERY`, `OPERATIONS`, a component split, or unresolved clarification depending on repository evidence and project-owner confirmation."
    },
    {
      "id": "TERM_PTSIP_COMPONENT",
      "category": "PTSIP_TERM",
      "meaning": "A coherent project-owned architectural unit to which one primary lifecycle classification and one primary purpose can apply.\n\nA component may be a package, module group, executable, generated artifact group, script, protocol bundle, workflow group, infrastructure responsibility, verification unit, or another project-defined unit."
    },
    {
      "id": "TERM_COMPONENT_BOUNDARY",
      "category": "PTSIP_TERM",
      "meaning": "The declared scope that keeps one component's primary lifecycle ownership and purpose coherent.\n\nIf one old component contains materially different Product, Development Tooling, Delivery, Operations, or independent-contract responsibilities, migration may require a component-split proposal rather than a classification rename."
    },
    {
      "id": "TERM_COMPONENT_SPLIT_DECISION",
      "category": "PTSIP_TERM",
      "meaning": "The lifecycle-boundary result used when one candidate contains multiple materially independent lifecycle responsibilities that can be represented separately.\n\nThe decision test is whether independently governable lifecycle responsibility exists, not whether several activity verbs or workflow steps appear in one file."
    },
    {
      "id": "TERM_RESPONSIBILITY_ROLE",
      "category": "PTSIP_TERM",
      "meaning": "The responsibility performed by a component **inside** its lifecycle ownership.\n\nRole is orthogonal to classification. A `PRODUCT` component and a `DEVELOPMENT_TOOLING` component may both perform verification roles without sharing lifecycle ownership.\n\nThe canonical closed role vocabulary is defined by Responsibility Map v2 schema/rule work and must remain separate from lifecycle classification."
    },
    {
      "id": "TERM_TYPED_RESPONSIBILITY_RELATIONSHIP",
      "category": "PTSIP_TERM",
      "meaning": "A declared semantic relationship between project responsibilities or associated artifacts, such as verification, generation, packaging, publication, documentation, specification, governance, or another schema-defined relationship.\n\nTyped relationships preserve semantics that cannot be represented losslessly by an untyped `from`/`to` edge.\n\nEvidence relationship vocabulary and project-declared Responsibility Map relationships are related but are not automatically identical namespaces."
    },
    {
      "id": "TERM_ASSOCIATED_ARTIFACT",
      "category": "PTSIP_TERM",
      "meaning": "A project-owned documentation/authority/support artifact that is explicitly associated with a component without being promoted to an independent architecture component merely to express the relationship.\n\nAssociated-artifact representation is not a classification escape hatch. Executable responsibility, independent lifecycle/release/compatibility ownership, or independently owned cross-lifecycle contract semantics require component/classification evaluation."
    },
    {
      "id": "TERM_PRODUCT_OWNED_TEST",
      "category": "PTSIP_TERM",
      "meaning": "A test or verification responsibility whose existence, change responsibility, compatibility expectations, and quality obligation belong primarily to the Product lifecycle.\n\nThe directory name `tests/` does not force `DEVELOPMENT_TOOLING` ownership."
    },
    {
      "id": "TERM_REUSABLE_VERIFICATION_INFRASTRUCTURE",
      "category": "PTSIP_TERM",
      "meaning": "Verification implementation, test SDK/framework, or shared verification mechanism whose primary ownership belongs to the development lifecycle rather than to one Product's own lifecycle.\n\nIt is typically a `DEVELOPMENT_TOOLING` responsibility, even when it verifies `PRODUCT` behavior."
    },
    {
      "id": "TERM_DEVELOPMENT_BUILD",
      "category": "PTSIP_TERM",
      "meaning": "Build responsibility whose governing obligation is coding, local compilation, inspection, testing, or creation of non-release intermediate outputs.\n\nIt is normally a `DEVELOPMENT_TOOLING` candidate."
    },
    {
      "id": "TERM_DELIVERY_BUILD",
      "category": "PTSIP_TERM",
      "meaning": "Build responsibility whose governing obligation is to materialize, assemble, sign, verify for handoff, package, or otherwise prepare an authoritative release/distribution/deployment unit for delivery to a destination.\n\nIt is normally a `DELIVERY` candidate. The resulting Product Artifact may remain `PRODUCT`-owned."
    },
    {
      "id": "TERM_ARTIFACT_KIND_NEUTRALITY_RULE",
      "category": "PTSIP_TERM",
      "meaning": "The principle that file type, language, framework, path, executable status, compilation behavior, or workflow provider alone does not determine PTSIP classification.\n\nFastAPI, Cloudflare Workers, GitHub Actions, Docker, Terraform, Python, PowerShell, Markdown, YAML, tests, and workflows do not have universal PTSIP classifications by themselves."
    },
    {
      "id": "TERM_PRODUCT_ARTIFACT",
      "category": "PTSIP_TERM",
      "meaning": "A Product-owned deployable, distributable, installable, loadable, or otherwise release-relevant output.\n\nArtifact ownership is independent from producer ownership. A `DEVELOPMENT_TOOLING` or `DELIVERY` producer may create/package/publish a Product Artifact without becoming Product-owned."
    },
    {
      "id": "TERM_ARTIFACT_PRODUCER",
      "category": "PTSIP_TERM",
      "meaning": "The component/process that generates, assembles, packages, signs, publishes, or otherwise produces an artifact.\n\nProducer lifecycle ownership does not automatically determine artifact ownership."
    },
    {
      "id": "TERM_ARTIFACT_DERIVATION",
      "category": "PTSIP_TERM",
      "meaning": "Evidence describing how an artifact was generated, assembled, packaged, signed, published, promoted, or deployed from source components or other artifacts."
    },
    {
      "id": "TERM_RESPONSIBILITY_MAP",
      "category": "PTSIP_TERM",
      "meaning": "A project-owned machine-readable declaration of intended lifecycle ownership, component boundaries, and related responsibility semantics.\n\nDiscovery output, migration proposals, templates, and coding-agent confidence are not architecture authority."
    },
    {
      "id": "TERM_RESPONSIBILITY_MAP_V2",
      "category": "PTSIP_TERM",
      "meaning": "The Tool `0.3.6` Responsibility Map generation whose canonical schema is based on the five primary lifecycle classifications and can preserve role/typed-relationship/associated-artifact semantics without retaining legacy `TOOLCHAIN` as a canonical alias.\n\nIts conceptual modes are `explicit`, `template`, and `hybrid`."
    },
    {
      "id": "TERM_EXPLICIT_RESPONSIBILITY_MAP",
      "category": "PTSIP_TERM",
      "meaning": "A Responsibility Map in which the repository directly declares the complete canonical project-owned map without runtime template defaults."
    },
    {
      "id": "TERM_TEMPLATE_RESPONSIBILITY_MAP",
      "category": "PTSIP_TERM",
      "meaning": "A Responsibility Map that explicitly selects a supported versioned/revision-bound template.\n\nTemplate selection is project-owned and must not be inferred solely from repository shape or discovery confidence."
    },
    {
      "id": "TERM_HYBRID_RESPONSIBILITY_MAP",
      "category": "PTSIP_TERM",
      "meaning": "A Responsibility Map that combines an explicitly selected template with project-owned overrides/extensions.\n\nExplicit repository declarations take precedence within the schema-defined override boundary."
    },
    {
      "id": "TERM_LEGACY_PROFILE_READER",
      "category": "PTSIP_TERM",
      "meaning": "Tool `0.3.6` functionality that recognizes and parses valid Tool `0.3.5` Project Profiles for inspection and migration without treating the old ontology as canonical `0.3.6` semantics."
    },
    {
      "id": "TERM_ASSISTED_MIGRATION",
      "category": "PTSIP_TERM",
      "meaning": "A preview-first process that combines legacy declarations with repository evidence to propose lifecycle classification, role, relationship, associated-artifact, and component-boundary changes for project-owner confirmation.\n\nAssisted migration shifts evidence-collection cost toward tooling while keeping final architecture authority with the project owner."
    },
    {
      "id": "TERM_MIGRATION_PROPOSAL",
      "category": "PTSIP_TERM",
      "meaning": "A non-authoritative proposed change from legacy/current representation to a target Responsibility Map.\n\nA useful proposal may include supporting evidence, provenance, confidence/ambiguity, component-split effects, semantic diff, textual diff, and unresolved facts."
    },
    {
      "id": "TERM_COMPONENT_SPLIT_PROPOSAL",
      "category": "PTSIP_TERM",
      "meaning": "A migration proposal that separates one legacy component into multiple components because one primary lifecycle classification can no longer describe its responsibilities coherently."
    },
    {
      "id": "TERM_PTSIP_PROJECT_PROFILE",
      "category": "PTSIP_TERM",
      "meaning": "A project-owned machine-readable declaration of intended architecture ownership and policy. It is durable declaration state, not observed conformance truth.\n\nFor Tool `0.3.6`, the canonical profile representation is Responsibility Map v2 once the schema work is frozen. Valid Tool `0.3.5` profiles remain legacy migration inputs rather than automatically canonical `0.3.6` profiles."
    },
    {
      "id": "TERM_DECISION_STATUS",
      "category": "PTSIP_TERM",
      "meaning": "The state of an architecture/ownership decision during inspection or migration. Examples include `RESOLVED`, `UNKNOWN`, `CONFLICT`, `PENDING`, and `INCOMPLETE`.\n\nA decision status is not a PTSIP classification."
    },
    {
      "id": "TERM_CONSUMER_REPOSITORY",
      "category": "PTSIP_TERM",
      "meaning": "A repository being inspected, adopted, validated, coordinated, migrated, or governed using PTSIP. PTSIP does not own the repository's directory, testing, development, or documentation conventions."
    },
    {
      "id": "TERM_EXTERNAL_PTSIP_TOOLING",
      "category": "PTSIP_TERM",
      "meaning": "PTSIP implementation operated outside the Consumer Repository project-owned source tree. It is outside repository classification scope unless intentionally vendored or adopted by the project."
    },
    {
      "id": "TERM_CONSUMER_REPOSITORY_NON_INTRUSION",
      "category": "PTSIP_TERM",
      "meaning": "The property that external PTSIP tooling can operate without requiring PTSIP-specific repository directories or default repository mutation. Tool-owned operational state should remain outside the Consumer Repository unless the user explicitly chooses otherwise."
    },
    {
      "id": "TERM_SPECIFICATION_BINDING",
      "category": "PTSIP_TERM",
      "meaning": "The association between a PTSIP declaration/Tool and the canonical Specification source, draft family/version, and immutable revision used to interpret it."
    },
    {
      "id": "TERM_DRAFT_FAMILY",
      "category": "PTSIP_TERM",
      "meaning": "A mutable family label such as `0.3.6-draft`. The label names the evolving family; an immutable Git revision identifies an exact normative snapshot."
    },
    {
      "id": "TERM_EVIDENCE_SNAPSHOT",
      "category": "PTSIP_TERM",
      "meaning": "The observable Consumer Repository state to which one automated evidence set is bound. For Git repositories this normally includes immutable revision identity and enough tracked-state information to detect instability during collection."
    },
    {
      "id": "TERM_OBSERVED_EVIDENCE",
      "category": "PTSIP_TERM",
      "meaning": "Repository/artifact/runtime/static-analysis facts collected directly from observable state."
    },
    {
      "id": "TERM_DECLARED_EVIDENCE",
      "category": "PTSIP_TERM",
      "meaning": "Facts explicitly declared by a profile, manifest, configuration, Responsibility Map, or other project-owned declaration. Declaration is not proof that observed behavior agrees."
    },
    {
      "id": "TERM_INFERRED_EVIDENCE",
      "category": "PTSIP_TERM",
      "meaning": "A bounded conclusion derived from evidence by deterministic logic, human review, or constrained agent reasoning and explicitly marked as inferred."
    },
    {
      "id": "TERM_EVIDENCE_PROVENANCE",
      "category": "PTSIP_TERM",
      "meaning": "The origin category attached to evidence. Canonical values carried forward are `DECLARED`, `OBSERVED`, and `INFERRED`."
    },
    {
      "id": "TERM_CANDIDATE_DISCOVERY",
      "category": "PTSIP_TERM",
      "meaning": "Evidence acquisition that identifies likely project responsibilities, boundaries, roles, relationships, lifecycle ownership candidates, and migration candidates.\n\nCandidate discovery is not project architecture authority."
    },
    {
      "id": "TERM_DEPENDENCY_EVIDENCE_RELATIONSHIP_TYPE",
      "category": "PTSIP_TERM",
      "meaning": "The semantic relationship represented by an observed/declared evidence edge.\n\nCanonical values carried forward from `0.3.4-draft` are `IMPORTS`, `LINKS`, `LOADS`, `INVOKES`, `READS`, `GENERATES`, `PACKAGES`, `TESTS`, and `PUBLISHES`.\n\nResponsibility Map v2 may define additional project-declared relationship types after schema/rule normalization."
    },
    {
      "id": "TERM_LIFECYCLE_PHASE",
      "category": "PTSIP_TERM",
      "meaning": "The lifecycle context of an evidence relationship. Canonical phases carried forward are `RUNTIME`, `BUILD`, `TEST`, `RELEASE`, and `INSPECTION`.\n\nTool `0.3.6` evidence work may add delivery/operations phases. Unknown phase remains unresolved rather than guessed."
    },
    {
      "id": "TERM_EVIDENCE_NODE_SCOPE",
      "category": "PTSIP_TERM",
      "meaning": "Dependency/artifact graph scope distinct from PTSIP classification. Reference scopes include `PROJECT_COMPONENT`, `EXTERNAL_DEPENDENCY`, `PLATFORM`, and `UNRESOLVED_TARGET`."
    },
    {
      "id": "TERM_BOUNDARY",
      "category": "PTSIP_TERM",
      "meaning": "The dependency, packaging, release, delivery, operations, compatibility, and lifecycle constraints separating primary lifecycle responsibilities."
    },
    {
      "id": "TERM_ISOLATION",
      "category": "PTSIP_TERM",
      "meaning": "The property that one lifecycle responsibility can evolve and be governed without accidentally acquiring incompatible runtime, release, delivery, operations, or compatibility obligations from another lifecycle."
    },
    {
      "id": "TERM_PACKAGING_OWNERSHIP",
      "category": "PTSIP_TERM",
      "meaning": "Responsibility for deciding whether a component belongs in a Product Artifact or another distributable output."
    },
    {
      "id": "TERM_BUILD_ENVIRONMENT",
      "category": "PTSIP_TERM",
      "meaning": "The dependency and execution context needed to resolve/build a lifecycle responsibility. PTSIP does not require a particular environment technology."
    },
    {
      "id": "TERM_CROSS_LIFECYCLE_DEPENDENCY",
      "category": "PTSIP_TERM",
      "meaning": "A dependency relationship from a component in one PTSIP lifecycle classification to a component in another lifecycle classification."
    },
    {
      "id": "TERM_BLOCKING_EVIDENCE_GAP",
      "category": "PTSIP_TERM",
      "meaning": "An evidence gap capable of concealing whether an applicable PTSIP `MUST`/`MUST NOT` is satisfied. It prevents `CONFORMANT` unless a definite violation already establishes `NON_CONFORMANT`."
    },
    {
      "id": "TERM_NON_BLOCKING_EVIDENCE_GAP",
      "category": "PTSIP_TERM",
      "meaning": "An evidence gap that cannot materially change the applicable mandatory-rule result."
    },
    {
      "id": "TERM_PROJECT_COMPONENT_DEPENDENCY_POLICY",
      "category": "PTSIP_TERM",
      "meaning": "Optional repository-specific dependency constraints that may strengthen but never weaken universal PTSIP requirements."
    },
    {
      "id": "TERM_PROFILE_VALIDATION",
      "category": "PTSIP_TERM",
      "meaning": "Validation of Project Profile structure/semantics. It does not determine repository conformance."
    },
    {
      "id": "TERM_MIGRATION_ANALYSIS",
      "category": "PTSIP_TERM",
      "meaning": "Evidence-backed proposal generation for legacy/current architecture representation. Migration analysis does not itself authorize repository mutation or architecture decisions."
    },
    {
      "id": "TERM_CONFORMANCE_EVALUATION",
      "category": "PTSIP_TERM",
      "meaning": "Deterministic evaluation combining declaration with observed dependency, artifact, lifecycle, snapshot, and coverage evidence against Consumer Repository PTSIP rules."
    },
    {
      "id": "TERM_CONFORMANCE_OUTCOME",
      "category": "PTSIP_TERM",
      "meaning": "The result of a completed Consumer Repository Conformance Evaluation. Canonical outcomes are `CONFORMANT`, `NON_CONFORMANT`, and `INCOMPLETE`. `NOT_EVALUATED` may be a Tool execution state but is not a conformance outcome."
    },
    {
      "id": "TERM_PTSIP_DIAGNOSTIC",
      "category": "PTSIP_TERM",
      "meaning": "A machine-readable finding instance that references a stable PTSIP rule ID and supporting evidence. Diagnostic instance identity and rule identity are different."
    },
    {
      "id": "TERM_DECISION_AUTHORITY",
      "category": "PTSIP_TERM",
      "meaning": "The authority used to coordinate unresolved/resolved explicit architecture decisions for a defined coordination domain.\n\nA Decision Authority records **which explicit architecture answer won**. It does not replace the Project Profile and does not prove conformance."
    },
    {
      "id": "TERM_COORDINATION_DOMAIN",
      "category": "PTSIP_TERM",
      "meaning": "The scope within which one distributed architecture decision identity has one authoritative winner. Repository identity is normally part of repository-scoped coordination."
    },
    {
      "id": "TERM_DISTRIBUTED_DECISION_IDENTITY",
      "category": "PTSIP_TERM",
      "meaning": "A deterministic identity for one coordinated architecture decision derived from stable coordination-domain identity plus normalized architecture/component scope. It must not depend solely on clone-local temporary IDs or missing-field state."
    },
    {
      "id": "TERM_AUTHORITY_REVISION",
      "category": "PTSIP_TERM",
      "meaning": "An ordered state token that lets participants distinguish one authority state from a later state and perform safe conditional mutation. Examples include Git commit/ref revision, transaction version, ETag/generation, or consensus log index."
    },
    {
      "id": "TERM_FIRST_VALID_RESOLUTION_WINS",
      "category": "PTSIP_TERM",
      "meaning": "The distributed coordination rule that the first valid accepted resolution for one decision identity is the winner and later contradictory answers cannot silently replace it."
    },
    {
      "id": "TERM_AUTHORITY_FRESHNESS",
      "category": "PTSIP_TERM",
      "meaning": "The requirement that a distributed coordination-sensitive operation account for relevant current authority state before relying on local Project Profile state as authoritative for the coordinated scope."
    },
    {
      "id": "TERM_READ_ONLY_AUTHORITY_OBSERVATION",
      "category": "PTSIP_TERM",
      "meaning": "A non-mutating lookup used to determine whether relevant authority state exists. Absence checking should not fabricate a pending decision or create history merely to prove absence."
    },
    {
      "id": "TERM_AUTHORITY_PROFILE_RECONCILIATION",
      "category": "PTSIP_TERM",
      "meaning": "Deterministic comparison and safe handling of local Project Profile declaration versus distributed authority state.\n\nRequired semantic distinctions include missing/no-decision, missing/resolved, present/no-authority, present/equivalent, present/conflicting, and stale-during-reconciliation states."
    },
    {
      "id": "TERM_SEMANTIC_EQUIVALENCE",
      "category": "PTSIP_TERM",
      "meaning": "Equality of architecture meaning independent from incidental serialization differences such as YAML key order, whitespace, or Tool-generated formatting."
    },
    {
      "id": "TERM_AUTHORITY_PROFILE_CONFLICT",
      "category": "PTSIP_TERM",
      "meaning": "A state where a resolved distributed winner and an existing local Project Profile declaration disagree semantically for the same coordinated scope. The implementation must not silently overwrite either side."
    },
    {
      "id": "TERM_GLOBAL_DECISION_STATE",
      "category": "PTSIP_TERM",
      "meaning": "Coordination-domain-wide decision state such as `PENDING` or `RESOLVED`."
    },
    {
      "id": "TERM_LOCAL_PROJECTION",
      "category": "PTSIP_TERM",
      "meaning": "Clone/worktree-local application/consistency state for a resolved architecture declaration. Local projection may be missing, consistent, locally applied, stale, or failed. It cannot change the global winner."
    },
    {
      "id": "TERM_ACTION_TIME_SYNCHRONIZATION",
      "category": "PTSIP_TERM",
      "meaning": "Synchronization performed when an active architecture-sensitive operation reaches a boundary where current authority matters. Continuous background polling is not required."
    },
    {
      "id": "TERM_FAIL_CLOSED_DISTRIBUTED_COORDINATION",
      "category": "PTSIP_TERM",
      "meaning": "The rule that a selected distributed coordination operation must stop explicitly when required authority freshness or safe mutation cannot be established, rather than silently creating an isolated Local winner."
    },
    {
      "id": "TERM_VPMS",
      "category": "PTSIP_TERM",
      "meaning": "Verification Purpose Management System. VPMS manages why a Verification Case exists and what it protects. VPMS purpose is orthogonal to PTSIP lifecycle classification.\n\nTool `0.3.5` VPMS purpose vocabulary currently uses `PRODUCT | TOOLCHAIN`. The `TOOLCHAIN` token in that VPMS vocabulary is not a Tool `0.3.6` PTSIP lifecycle classification and must not be renamed accidentally as part of lifecycle-ontology migration."
    },
    {
      "id": "TERM_VERIFICATION_CASE",
      "category": "PTSIP_TERM",
      "meaning": "The purpose-bound VPMS execution unit that combines Formula, Variables, Policy, Target, and Runner concerns."
    },
    {
      "id": "TERM_FORMULA",
      "category": "PTSIP_TERM",
      "meaning": "Purpose-neutral reusable verification mechanism where possible. Formula reuse does not collapse Verification Purpose or PTSIP lifecycle ownership."
    },
    {
      "id": "TERM_VERIFICATION_PURPOSE",
      "category": "PTSIP_TERM",
      "meaning": "The VPMS axis describing what a Verification Case protects/verifies. It is not PTSIP lifecycle classification."
    },
    {
      "id": "TERM_PTSIP_MANDATORY_RULE_WAIVER",
      "category": "PTSIP_TERM",
      "meaning": "PTSIP defines no waiver that authorizes a real `MUST`/`MUST NOT` violation. Project governance may record debt or migration approval, but confirmed violation remains `NON_CONFORMANT` until remediated."
    },
    {
      "id": "TERM_CONFORMANCE",
      "category": "PTSIP_TERM",
      "meaning": "A reproducible claim that a project satisfies a defined PTSIP conformance outcome under one exact bound Specification revision and evidence snapshot."
    }
  ]
}
