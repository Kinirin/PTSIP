format: ptsip-agent-vocabulary/v2
vocabulary_id: PTSIP-VOCAB-AUTHORITY
status: CANDIDATE
domain: ARCHITECTURE_AUTHORITY
entries:
  - id: PENDING
    category: GLOBAL_DECISION_STATE
    meaning: Coordinated decision exists but has no accepted winner.
  - id: RESOLVED
    category: GLOBAL_DECISION_STATE
    meaning: Coordinated decision has one accepted winner.
  - id: LOCAL_PROFILE
    category: AUTHORITY_PLANE
    meaning: Project-owned durable declaration for the local repository state.
  - id: DISTRIBUTED_AUTHORITY
    category: AUTHORITY_PLANE
    meaning: Coordination plane that determines an accepted winner for a stable distributed decision identity.
  - id: LOCAL_PROJECTION_STATE
    category: LOCAL_STATE
    meaning: Clone or worktree state describing whether distributed authority has been locally projected or reconciled.
