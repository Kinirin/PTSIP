format: ptsip-agent-vocabulary/v2
vocabulary_id: PTSIP-VOCAB-DIAGNOSTICS
status: CANDIDATE
domain: STABLE_DIAGNOSTIC_CLASSES
entries:
  - id: RULE_VIOLATION
    category: EVALUATION
    meaning: A machine-defined mandatory rule is violated by sufficient evidence.
  - id: REFERENCE_UNRESOLVED
    category: CONTRACT
    meaning: Required internal or explicitly bound machine reference cannot be resolved.
  - id: CONTRACT_INVALID
    category: CONTRACT
    meaning: A machine contract fails its governing schema or semantic integrity checks.
  - id: EVIDENCE_INCOMPLETE
    category: EVIDENCE
    meaning: Required evidence coverage is insufficient to safely settle an applicable rule.
  - id: AUTHORITY_CONFLICT
    category: AUTHORITY
    meaning: Competing architecture authority states cannot be reconciled without explicit resolution.
  - id: STALE_MUTATION_BLOCKED
    category: SAFETY
    meaning: Mutation was blocked because relevant state changed after analysis.
