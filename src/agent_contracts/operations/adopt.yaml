format: ptsip-agent-operation/v2
operation_id: PTSIP-OP-ADOPT-001
status: CANDIDATE
rule_refs:
  - PTSIP-ADP-001
  - PTSIP-ADP-002
  - PTSIP-ADP-003
  - PTSIP-ADP-004
  - PTSIP-ADP-005
  - PTSIP-AUT-004
  - PTSIP-AUT-005
  - PTSIP-AUT-006
input_schema_ref: PTSIP-IO-ADOPT-REQUEST-001
output_schema_ref: PTSIP-IO-ADOPT-RESULT-001
preconditions: []
entry_step: SNAPSHOT
steps:
  - step_id: SNAPSHOT
    type: ACTION
    action_ref: PTSIP-ACT-CAPTURE-REPOSITORY-SNAPSHOT-001
    input_bindings:
      /context: $input#/context
    on_success:
      step_ref: ANALYZE
  - step_id: ANALYZE
    type: ACTION
    action_ref: PTSIP-ACT-RESOLVE-ADOPTION-FACTS-001
    input_bindings:
      /context: $step:SNAPSHOT#/context
      /snapshot_identified: $step:SNAPSHOT#/snapshot_identified
    on_success:
      step_ref: FACTS
  - step_id: FACTS
    type: CONDITION
    condition_ref: PTSIP-COND-ADOPT-FACTS-RESOLVED-001
    input_bindings:
      /context: $step:ANALYZE#/context
      /facts_resolved: $step:ANALYZE#/facts_resolved
    branches:
      "TRUE":
        step_ref: PREPARE
      "FALSE":
        outcome: CLARIFICATION_REQUIRED
      "UNKNOWN":
        outcome: CLARIFICATION_REQUIRED
  - step_id: PREPARE
    type: ACTION
    action_ref: PTSIP-ACT-BUILD-ADOPTION-PLAN-001
    input_bindings:
      /context: $step:ANALYZE#/context
      /snapshot_identified: $step:ANALYZE#/snapshot_identified
      /facts_resolved: $step:ANALYZE#/facts_resolved
    on_success:
      step_ref: APPLY-REQUESTED
  - step_id: APPLY-REQUESTED
    type: CONDITION
    condition_ref: PTSIP-COND-ADOPT-APPLY-REQUESTED-001
    input_bindings:
      /context: $step:PREPARE#/context
    branches:
      "TRUE":
        step_ref: APPLY
      "FALSE":
        outcome: READY
      "UNKNOWN":
        outcome: READY
  - step_id: APPLY
    type: ACTION
    action_ref: PTSIP-ACT-APPLY-ADOPTION-001
    input_bindings:
      /context: $step:PREPARE#/context
      /facts_resolved: $step:PREPARE#/facts_resolved
      /repository_fresh: $step:PREPARE#/repository_fresh
      /profile_fresh: $step:PREPARE#/profile_fresh
      /authority_fresh: $step:PREPARE#/authority_fresh
      /plan_ready: $step:PREPARE#/plan_ready
    mutation_gate_ref: PTSIP-GATE-ADOPTION-WRITE-001
    mutation_gate_input_bindings:
      /context: $step:PREPARE#/context
      /repository_fresh: $step:PREPARE#/repository_fresh
      /profile_fresh: $step:PREPARE#/profile_fresh
      /authority_fresh: $step:PREPARE#/authority_fresh
    on_success:
      outcome: APPLIED
outcomes:
  - READY
  - APPLIED
  - CLARIFICATION_REQUIRED
  - PROFILE_INVALID
  - AUTHORITY_PROFILE_CONFLICT
  - STALE_STATE
  - WRITE_NOT_AUTHORIZED
  - SNAPSHOT_UNAVAILABLE
  - COORDINATION_UNAVAILABLE
