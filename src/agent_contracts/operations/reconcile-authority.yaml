format: ptsip-agent-operation/v2
operation_id: PTSIP-OP-RECONCILE-AUTHORITY-001
status: CANDIDATE
rule_refs:
  - PTSIP-AUT-001
  - PTSIP-AUT-002
  - PTSIP-AUT-003
  - PTSIP-AUT-004
  - PTSIP-AUT-005
  - PTSIP-AUT-006
  - PTSIP-AUT-007
mutation:
  default: READ_ONLY
  write_requires:
    - EXPLICIT_WRITE_AUTHORIZATION
    - AUTHORITY_FRESHNESS_RECHECK_PASS
    - PROFILE_FRESHNESS_RECHECK_PASS
preconditions:
  - COORDINATION_BACKEND_SELECTED
  - COORDINATION_SCOPE_IDENTIFIED
steps:
  - step_id: READ
    action_id: READ_RELEVANT_AUTHORITY
    fail_closed_outcomes:
      - COORDINATION_UNAVAILABLE
  - step_id: COMPARE
    action_id: COMPARE_PROFILE_AND_AUTHORITY_SEMANTICS
  - step_id: DECIDE
    action_id: RESOLVE_RECONCILIATION_STATE
  - step_id: PROJECT
    action_id: PROJECT_AUTHORIZED_WINNER
    requires:
      - EXPLICIT_WRITE_AUTHORIZATION
      - SEMANTIC_CONFLICT_ABSENT
      - FRESHNESS_RECHECK_PASSED
    fail_closed_outcomes:
      - AUTHORITY_PROFILE_CONFLICT
      - STALE_STATE
outcomes:
  - NO_REMOTE_DECISION
  - CONSISTENT
  - REMOTE_RESOLVED
  - AUTHORITY_PROFILE_CONFLICT
  - COORDINATION_UNAVAILABLE
  - STALE_STATE
