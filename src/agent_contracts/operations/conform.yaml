format: ptsip-agent-operation/v2
operation_id: PTSIP-OP-CONFORM-001
status: CURRENT
rule_refs:
  - PTSIP-CONF-001
  - PTSIP-CONF-002
  - PTSIP-CONF-003
  - PTSIP-CONF-004
  - PTSIP-CONF-005
  - PTSIP-CONF-006
vocabulary_refs:
  - PTSIP-VOCAB-LIFECYCLE
  - PTSIP-VOCAB-OUTCOMES
  - PTSIP-VOCAB-DIAGNOSTICS
  - PTSIP-VOCAB-AUTHORITY
  - PTSIP-VOCAB-TERMINOLOGY
input_schema_ref: PTSIP-IO-CONFORM-REQUEST-001
output_schema_ref: PTSIP-IO-CONFORM-RESULT-001
preconditions:
  - condition_ref: PTSIP-COND-CONFORM-PROFILE-READY-001
    on_false: INCOMPLETE
    on_unknown: INCOMPLETE
entry_step: COLLECT
steps:
  - step_id: COLLECT
    type: ACTION
    action_ref: PTSIP-ACT-COLLECT-CONFORMANCE-EVIDENCE-001
    input_bindings:
      /context: $input#/context
      /profile_ready: $input#/profile_ready
    on_success:
      step_ref: EVALUATE
  - step_id: EVALUATE
    type: ACTION
    action_ref: PTSIP-ACT-EVALUATE-CONFORMANCE-RULES-001
    input_bindings:
      /context: $step:COLLECT#/context
      /snapshot_identified: $step:COLLECT#/snapshot_identified
      /evidence_collected: $step:COLLECT#/evidence_collected
    on_success:
      step_ref: EMIT
  - step_id: EMIT
    type: ACTION
    action_ref: PTSIP-ACT-EMIT-CONFORMANCE-RESULT-001
    input_bindings:
      /context: $step:EVALUATE#/context
      /snapshot_identified: $step:EVALUATE#/snapshot_identified
      /evidence_collected: $step:EVALUATE#/evidence_collected
      /evaluation_complete: $step:EVALUATE#/evaluation_complete
      /outcome: $step:EVALUATE#/outcome
    on_success:
      outcome_from: $step:EMIT#/outcome
outcomes:
  - CONFORMANT
  - NON_CONFORMANT
  - INCOMPLETE
  - NOT_EVALUATED
