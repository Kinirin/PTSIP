format: ptsip-agent-operation/v2
operation_id: PTSIP-OP-MIGRATE-PROFILE-001
status: CANDIDATE
rule_refs:
  - PTSIP-MIG-001
  - PTSIP-MIG-002
  - PTSIP-MIG-003
  - PTSIP-MIG-004
  - PTSIP-MIG-005
input_schema_ref: PTSIP-IO-MIGRATE-REQUEST-001
output_schema_ref: PTSIP-IO-MIGRATE-RESULT-001
preconditions:
  - condition_ref: PTSIP-COND-MIG-SOURCE-PROFILE-IDENTIFIED-001
    on_false: UNSUPPORTED_SOURCE
    on_unknown: UNSUPPORTED_SOURCE
entry_step: ANALYZE
steps:
  - step_id: ANALYZE
    type: ACTION
    action_ref: PTSIP-ACT-ANALYZE-SOURCE-PROFILE-001
    input_bindings:
      /context: $input#/context
      /source_profile_identified: $input#/source_profile_identified
    on_success:
      step_ref: MAP
  - step_id: MAP
    type: ACTION
    action_ref: PTSIP-ACT-MAP-PROFILE-TARGET-001
    input_bindings:
      /context: $step:ANALYZE#/context
      /target_contract_resolved: $step:ANALYZE#/target_contract_resolved
      /source_fresh: $step:ANALYZE#/source_fresh
      /target_fresh: $step:ANALYZE#/target_fresh
    on_success:
      step_ref: PREPARE
  - step_id: PREPARE
    type: ACTION
    action_ref: PTSIP-ACT-BUILD-TRANSITION-PLAN-001
    input_bindings:
      /context: $step:MAP#/context
      /target_contract_resolved: $step:MAP#/target_contract_resolved
      /source_fresh: $step:MAP#/source_fresh
      /target_fresh: $step:MAP#/target_fresh
    on_success:
      step_ref: APPLY-REQUESTED
  - step_id: APPLY-REQUESTED
    type: CONDITION
    condition_ref: PTSIP-COND-MIG-APPLY-REQUESTED-001
    input_bindings:
      /context: $step:PREPARE#/context
    branches:
      TRUE:
        step_ref: APPLY
      FALSE:
        outcome: READY
      UNKNOWN:
        outcome: READY
  - step_id: APPLY
    type: ACTION
    action_ref: PTSIP-ACT-APPLY-PROFILE-TRANSITION-001
    input_bindings:
      /context: $step:PREPARE#/context
      /target_contract_resolved: $step:PREPARE#/target_contract_resolved
      /source_fresh: $step:PREPARE#/source_fresh
      /target_fresh: $step:PREPARE#/target_fresh
      /plan_ready: $step:PREPARE#/plan_ready
    mutation_gate_ref: PTSIP-GATE-PROFILE-TRANSITION-WRITE-001
    mutation_gate_input_bindings:
      /context: $step:PREPARE#/context
      /source_fresh: $step:PREPARE#/source_fresh
      /target_fresh: $step:PREPARE#/target_fresh
    on_success:
      outcome: APPLIED
outcomes:
  - READY
  - APPLIED
  - OWNER_DECISION_REQUIRED
  - UNSUPPORTED_SOURCE
  - STALE_STATE
  - WRITE_NOT_AUTHORIZED
