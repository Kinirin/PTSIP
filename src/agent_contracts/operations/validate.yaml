format: ptsip-agent-operation/v2
operation_id: PTSIP-OP-VALIDATE-001
status: CANDIDATE
rule_refs:
  - PTSIP-RMAP-001
  - PTSIP-RMAP-002
  - PTSIP-RMAP-003
  - PTSIP-RMAP-004
  - PTSIP-RMAP-005
  - PTSIP-ACP-GOV-003
vocabulary_refs:
  - PTSIP-VOCAB-LIFECYCLE
  - PTSIP-VOCAB-OUTCOMES
  - PTSIP-VOCAB-DIAGNOSTICS
  - PTSIP-VOCAB-TERMINOLOGY
input_schema_ref: PTSIP-IO-VALIDATE-REQUEST-001
output_schema_ref: PTSIP-IO-VALIDATE-RESULT-001
preconditions:
  - condition_ref: PTSIP-COND-VALIDATE-PROFILE-SELECTED-001
    on_false: PROFILE_INVALID
    on_unknown: PROFILE_INVALID
entry_step: RESOLVE
steps:
  - step_id: RESOLVE
    type: ACTION
    action_ref: PTSIP-ACT-RESOLVE-PROFILE-SCHEMA-001
    input_bindings:
      /context: $input#/context
      /profile_selected: $input#/profile_selected
    on_success:
      step_ref: STRUCTURE
  - step_id: STRUCTURE
    type: ACTION
    action_ref: PTSIP-ACT-VALIDATE-PROFILE-STRUCTURE-001
    input_bindings:
      /context: $step:RESOLVE#/context
      /contract_resolved: $step:RESOLVE#/contract_resolved
    on_success:
      step_ref: SEMANTICS
  - step_id: SEMANTICS
    type: ACTION
    action_ref: PTSIP-ACT-VALIDATE-RESPONSIBILITY-MAP-SEMANTICS-001
    input_bindings:
      /context: $step:STRUCTURE#/context
      /contract_resolved: $step:STRUCTURE#/contract_resolved
      /structure_valid: $step:STRUCTURE#/structure_valid
    on_success:
      outcome: VALID
outcomes:
  - VALID
  - PROFILE_INVALID
  - UNSUPPORTED_PROFILE_CONTRACT
  - SCHEMA_RESOLUTION_FAILED
