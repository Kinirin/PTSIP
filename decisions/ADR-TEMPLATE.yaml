schema_version: ptsip-adr-template/v2
output:
  format: yaml
  filename_pattern: ^ADR-[0-9]{4}-[a-z0-9.]+(?:-[a-z0-9.]+)*\.yaml$
  record_schema: schemas/ptsip-adr.schema.json
  current_index: decisions/INDEX.yaml
semantic_contract:
  authority_semantic_cardinality: EXACTLY_ONE
  authority_contract_required: true
  authority_semantics_required: true
  registered_language_neutral_schema_required: true
  opaque_natural_language_in_authority_semantics: FORBIDDEN
  arbitrary_unregistered_semantic_fields: FORBIDDEN
  authority_schema_registry: decisions/AUTHORITY-SCHEMA-REGISTRY.yaml
explanation_boundary:
  human_explanation_is_machine_authority: false
  human_explanation_location: SEPARATE_PRESENTATION_OR_GIT_HISTORY
  core_reasoning_may_consume_explanation: false
history_policy:
  accepted_semantic_rewrite_without_new_governance_decision: FORBIDDEN
  representation_migration_exception:
    status: CONSUMED_BY_P03
    source_format: MARKDOWN
    target_format: YAML_MACHINE_RECORD
    semantic_change_allowed: false
relationships:
  supported:
  - SUPERSEDES
  - AMENDS
  - EXTENDS
  - DEPENDS_ON
  scope_required: true
