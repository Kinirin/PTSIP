# yaml-language-server: $schema=../contracts/schemas/compile-sealed-rbac/Responsibilities_List.schema.json
# R-ID keyed policy rule references; no component owner metadata.
ptsip:
  version: pp.2.01
  revision: Rev.0001
  profile_role: RESPONSIBILITY-AUTHORITY
  specification:
    source: https://github.com/Kinirin/PTSIP
    revision: 3c47816770d194ae42f98faedc911d980db0e62a
responsibility_map:
  mode: explicit
  contract_ref: .ptsip/contracts/Responsibility-Authority/Responsibility-Authority.json
responsibility: []
component_bindings:
  R-ID-MPD-GOV-0001-OBLIGATION-ALL_FAMILY_DEFINITION_ID_RULE_CONTRACT_DIRECTION:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.ALL_FAMILY_DEFINITION_ID_RULE_CONTRACT_DIRECTION"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-ALL_FAMILY_POLICY_RULE_DEFINITION_CONTRACT_REDESIGN"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/ALL_FAMILY_DEFINITION_ID_RULE_CONTRACT_DIRECTION"
    source_text: "KEEP_LATEST: 14개 Family의 structure.Definition은 규칙별 id 및 rule 상수만 가진 배열이고 기존 자연어 meaning 및 rationale의 필수 구조는 폐기한다. 별도 responsibility_refs와 기존 component_bindings.component_id 및 컴포넌트 소유자 메타데이터는 이관 없이 제거한다. component_bindings는 R-ID 키별 rule·Rule_state·Condition 참조의 원본이며 정책 문서의 applies_when 및 Rule_state를 제거한다. 기존 원문은 비권한적 출처 설명으로 프로필에 보존하되 사용자의 새로운 승인이나 실행 권한을 생성하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-ALL_ROOT_FAMILY_RULE_RESPONSIBILITY_CONTRACT_SCOPE:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.ALL_ROOT_FAMILY_RULE_RESPONSIBILITY_CONTRACT_SCOPE"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-ROOT_FAMILY_INDEPENDENT_POLICY_RULE_CONTRACT_TRANSITION"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/ALL_ROOT_FAMILY_RULE_RESPONSIBILITY_CONTRACT_SCOPE"
    source_text: "KEEP_LATEST: ARCH, ASSURE, CHANGE, CNTR, CTRL, GOV, INFO, INTENT, NORM, OPS, REAL, RECORD, RISK, SUPPLY의 14개 Root Family 규칙 계약 전체에 규칙별 Definition(id, rule) 참조 형식과 R-ID 기반 프로필 해소를 적용한다. Family별 고유 권한은 유지하며 이전 Constraints.obligations의 존재를 공통 조건으로 강제하지 않는다. 정책 규칙 개수에 맞게 Definition 항목을 각각 기록하고 참조 무결성을 확인한다."
  R-ID-MPD-GOV-0001-OBLIGATION-APPROVED_ALL_FAMILY_RID_RULE_CUTOVER:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.APPROVED_ALL_FAMILY_RID_RULE_CUTOVER"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_RULE_REFERENCE_MIGRATION"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/APPROVED_ALL_FAMILY_RID_RULE_CUTOVER"
    source_text: "KEEP_LATEST 사용자 승인: Rule 단위 책임 ID는 R-ID이며 Definition은 id·rule의 개별 항목 배열이다. 모든 14개 Family의 별도 responsibility_refs를 제거하고, component_bindings는 R-ID 키별 규칙 상수와 상태의 등록 원본으로 사용하며 기존 컴포넌트 메타데이터를 제거한다. 규칙별 상태는 프로필이, 조건과 운영 권한의 세부 선언은 각 독립 스키마가 담당한다. 상태 미선언 규칙에 대한 승인 상태를 임의로 생성하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_CENTRAL_RBAC_REGISTRY:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_CENTRAL_RBAC_REGISTRY"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-PROJECT_PROFILE_PP_2_00_COMPILE_SEALED_RBAC_REGISTRY_DISCOVERY"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_CENTRAL_RBAC_REGISTRY"
    source_text: "Compile-Sealed RBAC는 A 중앙 등록부 방식을 사용한다. RBAC 사용 프로젝트의 pp.2.00 rbac.registry_ref는 .ptsip/profiles/rbac/ 내 하나의 중앙 등록부 진입점을 참조하며, 해당 등록부는 Responsibility·Condition Atom·Permission Atom·Binding 네 종류의 독립 선언 계약 ID와 실제 계약 원본 파일 참조만 통합적으로 탐색·해소하는 단일 조회 기준이다. Seal과 Activation은 중앙 선언 계약 등록부 entries의 등록 대상이 아니며, 각각 독립된 검증·활성화 산출물 체계에서 관리한다. 계약 원본은 각각 독립적으로 유지하고 등록부에 정의 본문·승인 권위·권한 활성화 의미를 흡수하지 않으며 Root Family별 동일 책임·조건·권한 사본의 생성을 요구하지 않는다. 별도의 원자·Binding별 조회 인덱스를 독립적인 정식 등록부로 필수화하지 않는다. 중앙 등록부의 필수·조건부·선택 필드는 별도의 승인된 필드 계약을 따르고, 등록부 개별 파일명·직렬화 형식·필드 상세 자료형과 제약·참조 검증 규칙·파생 조회 자료의 허용 형태는 후속 결정한다. 등록부의 존재나 파일 등록 자체만으로 승인·Seal·Activation을 인정하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_CENTRAL_REGISTRY_FIELDS:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_CENTRAL_REGISTRY_FIELDS"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-PROJECT_USES_COMPILE_SEALED_RBAC_CENTRAL_REGISTRY"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_CENTRAL_REGISTRY_FIELDS"
    source_text: "Compile-Sealed RBAC의 중앙 등록부 필드 계약은 registry/compile-sealed-rbac-registry-fields.json을 기계 판독 기준으로 따른다. schema_version, entries, entries[].id, entries[].kind, entries[].resource는 필수이고 entries[].revision은 조건부, metadata는 선택으로 정의한다. schema_version은 등록부 형식 버전, entries는 독립 계약 목록, id는 독립 계약 ID, kind는 계약 종류, resource는 실제 계약 파일 참조, revision은 적용되는 경우 계약 개정 구분, metadata는 비권위적 설명·진단에 한정한다. entries[].kind의 의미상 등록 대상은 Responsibility·Condition Atom·Permission Atom·Binding 네 종류만 허용하고 Seal·Activation은 허용하지 않는다. entries[].kind의 정확한 문자열 및 entries[].resource의 파일 경로·직렬화·보안 규칙은 별도 승인된 기계 계약의 확정 항목을 따른다. revision 필수화 조건, 등록부 파일명·직렬화 형식, 나머지 필드 자료형·ID 고유성 및 원본 ID 일치 규칙은 별도 결정하며 추론으로 확정하지 않는다. 등록부에는 원본 책임·조건·권한·Binding 정의나 승인·실행 권위를 흡수하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_HIERARCHICAL_SCHEMA_DESIGN:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_HIERARCHICAL_SCHEMA_DESIGN"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-COMPILE_SEALED_RBAC_INDEPENDENT_SCHEMA_DESIGN"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_HIERARCHICAL_SCHEMA_DESIGN"
    source_text: "Compile-Sealed RBAC 독립 계약의 신규 스키마는 H-B 공통 메타와 도메인별 의미 계층을 구분하는 구조로 설계한다. 공통 메타는 독립 계약 간에 실제로 공유되는 기계 검증 책임에 한정하고, Responsibility·Condition Atom·Permission Atom·Binding·Seal·Activation 등 고유 의미 계층과 소유권은 각 계약이 독립적으로 정의한다. 이 결정은 정책 Root Family 전체에 공통 문서 골격을 강제하지 않는다. H-B의 공통 메타와 도메인별 의미 계층은 YAML·스키마의 논리적 필드 구조이지 common/ 또는 domains/ 물리 디렉터리를 요구하지 않는다. 공통 메타의 구체 항목·필드명·필수 여부는 후속 결정으로 남기고, 신규 스키마 파일은 승인된 최상위 경로에 직접 둔다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_INDEPENDENT_CONTRACT_TRANSITION:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_INDEPENDENT_CONTRACT_TRANSITION"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-COMPILE_SEALED_AUTHORITY_MODEL_MIGRATION"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_INDEPENDENT_CONTRACT_TRANSITION"
    source_text: "Compile-Sealed RBAC의 기존 GOV·조건·실행 권한 모델 대체는 C 독립 계약 전환형으로 진행한다(KEEP_LATEST). 책임, 조건 원자, 권한 원자, 승인된 바인딩, 컴파일·Seal, 책임 활성화 및 변경 감응은 독립된 의미·소유 계약으로 정의하고, 검증·승인된 참조 단위부터 기존 권한 계약을 단계적으로 대체한다. 전환은 기존 권한 체계의 영구 병행을 의미하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_NEW_INDEPENDENT_SCHEMAS:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_NEW_INDEPENDENT_SCHEMAS"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-COMPILE_SEALED_RBAC_SCHEMA_DESIGN"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_NEW_INDEPENDENT_SCHEMAS"
    source_text: "Compile-Sealed RBAC의 새 권한 모델은 기존 Authority·조건·실행 계약 필드의 단순 이름 변경이나 내부 확장이 아닌 신규 독립 스키마로 설계한다. 새 스키마는 독립 의미·소유권을 검증할 수 있어야 하며 기존 계약은 승인되고 검증된 참조 전환에 따라 대체한다. 승인된 H-B 내부 계층 방향과 신규 스키마 상위 경로는 해당 GOV 계약을 따르며, 세부 필드·참조 표현·실제 전환 범위는 후속 결정으로 남기며 개별 스키마 파일명은 승인된 명칭을 따른다. 신규 스키마 파일은 승인된 최상위 스키마 경로에 직접 배치한다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_OPT_IN_PROFILE_RBAC_ROOT:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_OPT_IN_PROFILE_RBAC_ROOT"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-PROJECT_USES_COMPILE_SEALED_RBAC"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_OPT_IN_PROFILE_RBAC_ROOT"
    source_text: "Compile-Sealed RBAC 기능을 명시적으로 사용하는 프로젝트는 자신의 저장소에서 .ptsip/profiles/rbac/ 를 RBAC 선언형 계약 기록의 필수 저장 루트로 사용한다. 이 경로는 Responsibility·Condition Atom·Permission Atom·Binding 등의 재사용 가능한 계약 기록에 적용하며 Root Family 이름별 중복 사본·파일명을 요구하지 않는다. 프로젝트 프로파일은 해당 독립 계약을 기계적으로 조회할 수 있도록 연결해야 하며 pp.2.00 프로파일의 명시적 RBAC 기능 사용 선언과 등록부 참조 필드는 별도 승인된 정책에 따르되, 필드명·자료형·등록부 파일명·개별 계약 파일명·등록/조회 표현은 추후 독립적으로 결정한다. RBAC 기능을 사용하지 않는 프로젝트에는 이 디렉터리 및 고객 정책 문서 형식을 강제하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_OPT_IN_SIX_SCHEMA_REQUIREMENT:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_OPT_IN_SIX_SCHEMA_REQUIREMENT"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-PROJECT_USES_COMPILE_SEALED_RBAC"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_OPT_IN_SIX_SCHEMA_REQUIREMENT"
    source_text: "Compile-Sealed RBAC 기능을 사용하는 프로젝트에는 .ptsip/contracts/schemas/compile-sealed-rbac/ 아래 responsibility.schema.json, condition-atom.schema.json, permission-atom.schema.json, binding.schema.json, sealed-contract.schema.json, activation.schema.json 여섯 독립 스키마의 생성·존재 및 검증 사용을 필수로 요구한다. 이 조건을 충족하지 못한 프로젝트는 해당 RBAC 기능을 유효하게 사용할 수 없으며 권한을 추론하거나 기존 승인·실행 검사를 우회해 보완하지 않는다. 비사용 프로젝트에 여섯 스키마를 강제하지 않는다. 스키마 상세 필드, 배포/생성 방법, 기능 활성화 선언·검출 및 검증 절차의 구체적 구현은 후속 결정한다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_RBAC_SUCCESSOR:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_RBAC_SUCCESSOR"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-LEGACY_AUTHORITY_MODEL_REPLACEMENT"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_RBAC_SUCCESSOR"
    source_text: "기존 GOV·조건·실행의 권한 부여 방식은 Compile-Sealed RBAC로 대체한다(KEEP_LATEST). 새 권한 모델의 상위 경계는 컴파일 확정, 책임·조건 원자·권한 원자·바인딩 정당성의 독립 소유 및 변경 감응이다. 무관한 GOV 정책 책임은 자동 폐기하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_REGISTRY_KIND_RESOURCE_REFERENCES:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_REGISTRY_KIND_RESOURCE_REFERENCES"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-PROJECT_USES_COMPILE_SEALED_RBAC_CENTRAL_REGISTRY"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_REGISTRY_KIND_RESOURCE_REFERENCES"
    source_text: "사용자 위임으로 확정한 중앙 RBAC 등록부의 entries[].kind는 대소문자를 구분하는 문자열이며 허용값은 RESPONSIBILITY, CONDITION_ATOM, PERMISSION_ATOM, BINDING 네 개뿐이다. Seal·Activation과 임의 문자열·대소문자 별칭은 허용하지 않는다. entries[].resource는 프로젝트 저장소 루트 기준 .ptsip/profiles/rbac/ 내부의 POSIX 슬래시 상대 파일 경로 문자열만 허용하며, 중첩 폴더를 허용하지만 Root Family 이름·폴더·파일명 규칙을 요구하지 않는다. 파일 확장자는 소문자 .json, .yaml, .yml을 허용하고 Binding에 YAML을 강제하지 않는다. 절대 경로·URI 스킴·경로의 빈 구간/./../·역슬래시·콜론·물음표·샵·퍼센트·제어문자·루트 밖 참조·심볼릭 링크 구간·부재 파일·일반 파일이 아닌 대상을 거부한다. 참조는 원본 계약 조회만 의미하며 파일 존재만으로 승인·Seal·Activation·실행 권한을 인정하지 않는다. 이 계약의 정확한 기계 값과 실패 규칙은 registry/compile-sealed-rbac-registry-fields.json의 revision 3 이상에서 확인하고, ID의 고유성·원본 내용의 identity 필드 표현·등록부 파일명 등 미결정 사항은 후속 결정으로 유지한다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_SCHEMA_ROOT_LOCATION:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_SCHEMA_ROOT_LOCATION"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-COMPILE_SEALED_RBAC_INDEPENDENT_SCHEMA_LOCATION"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_SCHEMA_ROOT_LOCATION"
    source_text: "KEEP_LATEST: Compile-Sealed RBAC 스키마 루트는 .ptsip/contracts/schemas/compile-sealed-rbac/ 이다. 기존 여섯 독립 Seal·Activation 관련 계약 골격의 미확정 의미와 실패 시 차단 경계는 보존한다. 책임·권한 작성 인터페이스의 필드 스키마는 책임 실행조건을 Conditions_exercise/, 책임을 responsibility/, 권한을 authority/ 하위 디렉터리로 분리한다. Responsibilities_List.schema.json은 이 필드 스키마들을 참조하여 .ptsip/profiles/Responsibility-Authority-list.yaml을 검증한다. 기존 임시 후보 스키마의 additionalProperties:false는 새 작성 필드 계약의 제약으로 승계하지 않는다. 작성 인터페이스의 구조 검증은 Seal·Activation·실행 권한을 생성하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_SIX_INDEPENDENT_SCHEMAS:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_SIX_INDEPENDENT_SCHEMAS"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-COMPILE_SEALED_RBAC_SCHEMA_PARTITIONING"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_SIX_INDEPENDENT_SCHEMAS"
    source_text: "Compile-Sealed RBAC의 Responsibility, Condition Atom, Permission Atom, Binding, Seal, Activation 독립 의미와 소유 경계를 보존한다. 기존 여섯 독립 계약 골격의 파일 존재와 실패 시 차단은 미확정 실행 의미를 승인하지 않는다. 책임·조건·권한의 선언 작성에는 Conditions_exercise/, responsibility/, authority/의 필드 스키마와 Responsibilities_List.schema.json을 사용한다. 이 작성 인터페이스를 기존 골격 전체의 유효 인스턴스 승인이나 런타임 활성화 완료로 간주하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-COMPILE_SEALED_SIX_SCHEMA_PROVISIONAL_SCAFFOLDS:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.COMPILE_SEALED_SIX_SCHEMA_PROVISIONAL_SCAFFOLDS"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-COMPILE_SEALED_RBAC_SCHEMA_FIELD_DEFINITION_PENDING"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_SIX_SCHEMA_PROVISIONAL_SCAFFOLDS"
    source_text: "사용자는 .ptsip/contracts/schemas/compile-sealed-rbac/ 의 승인된 여섯 독립 JSON Schema 및 배포용 동일 사본의 현행 fail-closed 골격을 상세 필드 결정 작업의 임시 기준으로 승인한다. 이 임시 승인은 이미 생성된 스키마 파일의 존재·독립 분할·해당 위치에 한정하며 각 스키마의 실제 필수/선택 필드, 참조 문법, 승인 정당성, Seal 무결성, Activation 의미 또는 유효한 RBAC 인스턴스 판정을 승인하지 않는다. 세부 계약이 독립적으로 승인되어 실제 검증 가능한 스키마로 대체되기 전까지 골격은 모든 계약 인스턴스를 거부하며, 골격 파일 존재를 pp.2.00 활성화·RBAC 실행 권한·정식 엔진 연산 등록 또는 0.3.8b6 배포 완료의 근거로 사용하지 않는다. 실제 필드와 등록부 의미를 사용자의 후속 결정에 따라 독립 기계 계약으로 확정한다."
  R-ID-MPD-GOV-0001-OBLIGATION-GOV_CONTRACT_OWNERSHIP:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.GOV_CONTRACT_OWNERSHIP"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_IDENTITY_STATUS_VERSION_OR_TITLE"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/GOV_CONTRACT_OWNERSHIP"
    source_text: "정책 식별자, 제목, 상태 및 버전은 각 항목을 소유하는 계약을 기준으로 관리하며 세부 적용은 해당 GOV 정책에 위임한다."
  R-ID-MPD-GOV-0001-OBLIGATION-GOV_DECISION_LEGITIMACY:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.GOV_DECISION_LEGITIMACY"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-DEVELOPMENT_DECISION_OR_APPROVAL"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/GOV_DECISION_LEGITIMACY"
    source_text: "결정의 정당성은 결정 대상, 권한 소유자, 위임 범위 및 승인 주체에 따라 판단한다."
  R-ID-MPD-GOV-0001-OBLIGATION-GOV_DELEGATION_POLICY_0004:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.GOV_DELEGATION_POLICY_0004"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-DECISION_MANDATE_OR_README_GOVERNANCE"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/GOV_DELEGATION_POLICY_0004"
    source_text: "개발 결정권·위임·승인 정당성과 README 관리의 구체적인 규칙은 MPD-GOV-0004가 소유한다."
  R-ID-MPD-GOV-0001-OBLIGATION-GOV_DELEGATION_POLICY_0005:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.GOV_DELEGATION_POLICY_0005"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_IDENTIFICATION_AND_REGISTRATION"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/GOV_DELEGATION_POLICY_0005"
    source_text: "정책 식별자·제목·등록 무결성·식별 문제 대응의 구체적인 규칙은 MPD-GOV-0005가 소유한다."
  R-ID-MPD-GOV-0001-OBLIGATION-GOV_DELEGATION_POLICY_0006:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.GOV_DELEGATION_POLICY_0006"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_LIFECYCLE_AND_GOVERNANCE_PROVENANCE"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/GOV_DELEGATION_POLICY_0006"
    source_text: "정책 상태·버전 관리, 변경 승인 조건, 코딩 에이전트 기계적 판단 및 거버넌스 출처의 구체적인 규칙은 MPD-GOV-0006이 소유한다."
  R-ID-MPD-GOV-0001-OBLIGATION-GOV_FAMILY_RESPONSIBILITY:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.GOV_FAMILY_RESPONSIBILITY"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-GOV_POLICY_SCOPE"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/GOV_FAMILY_RESPONSIBILITY"
    source_text: "GOV는 개발 정책, 개발 작업 및 개발 통제 영역에서 결정과 승인에 관한 정당성을 관리한다."
  R-ID-MPD-GOV-0001-OBLIGATION-GOV_PROFILE_BACKED_RULE_CONSTANTS:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.GOV_PROFILE_BACKED_RULE_CONSTANTS"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-GOV_INDEPENDENT_RULE_CONTRACT_CONSTANTIZATION"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/GOV_PROFILE_BACKED_RULE_CONSTANTS"
    source_text: "KEEP_LATEST: 모든 Root Family 정책 문서의 각 Definition 항목은 id 및 rule 상수만 선언한다. id는 Responsibility-Authority-list.yaml의 component_bindings에 등록된 R-ID와 동일하고 rule은 같은 바인딩의 규칙 상수와 일치한다. 규칙별 상태는 프로필의 Rule_state가 소유하고 적용 조건은 Condition 계약이 소유한다. 미등록 또는 불일치 ID·상수는 검증 실패하며 임의 생성하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-GOV_SHARED_PUBLIC_AND_INDEPENDENT_RULES:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.GOV_SHARED_PUBLIC_AND_INDEPENDENT_RULES"
    Rule_state: "APPROVED.Applying"
    condition_id:
      - "C-ID-DEVELOPER_POLICY_RULES_SCHEMA_LOCATION_OR_VALIDATION"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/GOV_SHARED_PUBLIC_AND_INDEPENDENT_RULES"
    source_text: "KEEP_LATEST: 개발 정책의 공통 문서 구조는 .ptsip/contracts/schemas/Policy/PTSIP_Public_Structure.schema.json이 소유한다. 공통 Policy_Rules 필드 구조는 .ptsip/contracts/schemas/Policy/Policy_Rules/Public_Structure_Rules.schema.json이 선언하며 모든 필드는 기본 선택이고 생성하지 않는다. Policy_Identity.root_family가 .ptsip/contracts/policy/identity/root_family.json에 등록된 값이면 .ptsip/contracts/policy/Rules/{root_family}_rules.json의 명시된 structure로 해당 Family의 조건부 필수 필드와 내부 검증 구조를 선택한다. 기존 Family별 .schema.json·.schemas.json 및 Policy_Rules_version.schema.json은 제거하며 기존 스키마 경로를 규칙 본문으로 자동 승격하지 않는다. 공통 문서 검증·Family 구조 선택·규칙 승인 및 실행 권한의 경계를 보존한다."
  R-ID-MPD-GOV-0001-OBLIGATION-POLICY_RULES_A2_FAMILY_MACHINE_VALIDATION:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.POLICY_RULES_A2_FAMILY_MACHINE_VALIDATION"
    Rule_state: "APPROVED.Applying"
    condition_id:
      - "C-ID-INDEPENDENT_POLICY_RULES_FAMILY_VALIDATION_DESIGN"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/POLICY_RULES_A2_FAMILY_MACHINE_VALIDATION"
    source_text: "KEEP_LATEST A2: 14개 Root Family의 기계 판독형 작성·검증 계약은 .ptsip/contracts/policy/Rules/의 ARCH_rules.json, ASSURE_rules.json, CHANGE_rules.json, CNTR_rules.json, CTRL_rules.json, GOV_rules.json, INFO_rules.json, INTENT_rules.json, NORM_rules.json, OPS_rules.json, REAL_rules.json, RECORD_rules.json, RISK_rules.json, SUPPLY_rules.json이다. Family_Rules_Contract.schema.json은 이 계약의 구조 및 Compile-Sealed RBAC 책임 참조를 검증한다. root_family.json의 값과 정확히 일치하는 계약만 선택하고 일치하지 않는 값·부재 계약·해소 불가능한 참조는 실패 시 차단한다. 반복된 Family별 구 스키마 라우팅을 유지하거나 폐기된 policy/authority를 권위로 사용하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-POLICY_RULES_B3_ENTRY_AND_INDEPENDENT_JSON:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.POLICY_RULES_B3_ENTRY_AND_INDEPENDENT_JSON"
    Rule_state: "APPROVED.Applying"
    condition_id:
      - "C-ID-INDEPENDENT_POLICY_RULES_JSON_STORAGE_AND_DISCOVERY"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/POLICY_RULES_B3_ENTRY_AND_INDEPENDENT_JSON"
    source_text: "KEEP_LATEST: 14개 Family 규칙 계약은 structure.Definition의 규칙별 id 및 rule만을 규범적 규칙 참조로 사용하며 책임 ID와 규칙 상수의 조회 기준은 .ptsip/profiles/Responsibility-Authority-list.yaml의 component_bindings[R-ID]이다. 기존 별도 responsibility_refs 참조와 컴포넌트 메타데이터 투영은 폐기한다. 조건은 독립 Condition 계약, 실행 권한은 독립 Operational_Authority 계약에서 정의하며, 형식 검증만으로 승인·Seal·Activation 또는 실행 권한을 생성하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-POLICY_RULES_SHARED_PRESENCE_FAMILY_SEMANTICS:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.POLICY_RULES_SHARED_PRESENCE_FAMILY_SEMANTICS"
    Rule_state: "APPROVED.Applying"
    condition_id:
      - "C-ID-INDEPENDENT_POLICY_RULES_CONTRACT_VALIDATION"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/POLICY_RULES_SHARED_PRESENCE_FAMILY_SEMANTICS"
    source_text: "KEEP_LATEST: 공통 Policy_Rules의 Identity, Definition, Boundary, Constraints, Evaluation은 Family를 지정하지 않으면 임의 생성되지 않는다. 14개 Family 계약은 명시된 root_family와 일치할 때 structure.Definition에서 규칙별 id와 rule을 필수화하고 R-ID와 rule 상수는 프로필에 등록된 항목과 일치해야 한다. 별도 Responsibility_Refs 및 responsibility_refs 필드는 폐기하며 검증이나 생성 시 사용하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-PP200_EXPLICIT_RBAC_OPT_IN_AND_REGISTRY_REF:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.PP200_EXPLICIT_RBAC_OPT_IN_AND_REGISTRY_REF"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-PROJECT_PROFILE_PP_2_00_COMPILE_SEALED_RBAC_USE"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/PP200_EXPLICIT_RBAC_OPT_IN_AND_REGISTRY_REF"
    source_text: "Project Profile pp.2.00은 Compile-Sealed RBAC 기능의 사용 여부와 RBAC 계약 등록부 참조를 프로젝트 프로파일의 기계 검증 가능한 선언 필드로 정의한다. 기능 사용을 명시적으로 선언한 경우에만 RBAC 기능의 활성화 검증을 시작하고, 등록부 참조가 누락되었거나 참조 대상·필수 6개 스키마·독립 계약의 유효성을 검증하지 못하면 RBAC 기능을 실패 시 차단한다. 디렉터리·계약 파일의 존재나 에이전트 추론만으로 기능 사용 또는 실행 권한을 인정하지 않는다. 비사용 프로젝트의 RBAC 구조 미보유는 실패로 보지 않는다. 상위 정책이 승인한 .ptsip/profiles/rbac/ 계약 루트와 .ptsip/contracts/schemas/compile-sealed-rbac/ 스키마 루트는 유지한다. pp.2.00 프로젝트 프로파일의 신규 최상위 필드는 rbac이며 그 하위 기능 사용 선언 필드는 enabled(rbac.enabled), 등록부 참조 필드는 registry_ref(rbac.registry_ref)로 확정한다. rbac.enabled가 false로 선언된 프로젝트는 rbac.registry_ref를 생략할 수 있으며, 해당 참조나 RBAC 스키마·계약 기록의 부재를 검증 실패로 간주하지 않는다. 비활성 선언에서 참조가 존재하더라도 이를 기능 사용·권한 활성화의 근거로 사용하지 않는다. 그 밖의 필드 값·자료형 제약·등록부 개별 파일명 및 버전 전환·배포 절차는 별도 결정한다. 이 승인으로 pp.1.02의 현재 상태를 변경하거나 pp.2.00의 프로파일/도구 전환을 완료한 것으로 간주하지 않는다."
  R-ID-MPD-GOV-0001-OBLIGATION-RETIRE_LEGACY_AUTHORITY_CATEGORIES:
    rule: "GOV.MPD-GOV-0001.OBLIGATION.RETIRE_LEGACY_AUTHORITY_CATEGORIES"
    Rule_state: "APPROVED.Applying"
    condition_id:
      - "C-ID-LEGACY_AUTHORITY_MAJOR_MINOR_MICRO_MIGRATION"
    source_policy: "MPD-GOV-0001"
    source_rule_id: "OBLIGATION/RETIRE_LEGACY_AUTHORITY_CATEGORIES"
    source_text: "KEEP_LATEST: 기존 Authority_Major_Category, Authority_Minor_Category, Authority_Micro_Category의 정책 권한 분류와 .ptsip/contracts/policy/authority/ 저장 영역은 폐기하고 물리적으로 제거한다. 신규 정책 작성·계약 조회·검증은 해당 분류 파일을 참조하지 않는다. 기존 Authority 분류용 .ptsip/contracts/schemas/Authority/ 내 21개 호환·임시 스키마도 삭제하고 종전 정책 후보 문서의 Authority_Category 선언은 제거하며 해당 제거만으로 Compile-Sealed RBAC의 새 책임·조건·권한 바인딩 또는 승인·Seal·Activation·실행 권한을 생성하지 않는다. 별도 검증되지 않은 실행 활성화를 완료 상태로 취급하지 않는다."
  R-ID-MPD-GOV-0001-PROHIBITION-CTRL_TEST_CANNOT_APPROVE_POLICY:
    rule: "GOV.MPD-GOV-0001.PROHIBITION.CTRL_TEST_CANNOT_APPROVE_POLICY"
    Rule_state: null
    source_policy: "MPD-GOV-0001"
    source_rule_id: "PROHIBITION/CTRL_TEST_CANNOT_APPROVE_POLICY"
    source_text: "CTRL의 실행 가능 판정이나 테스트 통과로 명시되지 않은 정책 승인을 생성하는 행위"
  R-ID-MPD-GOV-0001-PROHIBITION-INTENT_ARCH_CANNOT_CREATE_GOV_MANDATE:
    rule: "GOV.MPD-GOV-0001.PROHIBITION.INTENT_ARCH_CANNOT_CREATE_GOV_MANDATE"
    Rule_state: null
    source_policy: "MPD-GOV-0001"
    source_rule_id: "PROHIBITION/INTENT_ARCH_CANNOT_CREATE_GOV_MANDATE"
    source_text: "INTENT의 작업 목표나 ARCH의 기술 설계를 근거로 GOV의 위임 권한을 자동 생성하는 행위"
  R-ID-MPD-GOV-0001-PROHIBITION-REUSE_RETIRED_AUTHORITY_CATEGORY:
    rule: "GOV.MPD-GOV-0001.PROHIBITION.REUSE_RETIRED_AUTHORITY_CATEGORY"
    Rule_state: null
    source_policy: "MPD-GOV-0001"
    source_rule_id: "PROHIBITION/REUSE_RETIRED_AUTHORITY_CATEGORY"
    source_text: "폐기된 Authority Major·Minor·Micro의 분류 계층·값을 새 RBAC 책임·조건·권한·바인딩 계약의 필수 의미 또는 승인 근거로 재사용하거나, 레거시 분류 참조에 근거하여 실행 권한을 부여하는 행위"
  R-ID-MPD-GOV-0001-PROHIBITION-UNAUTHORIZED_RESPONSIBILITY_REPARTITION:
    rule: "GOV.MPD-GOV-0001.PROHIBITION.UNAUTHORIZED_RESPONSIBILITY_REPARTITION"
    Rule_state: null
    source_policy: "MPD-GOV-0001"
    source_rule_id: "PROHIBITION/UNAUTHORIZED_RESPONSIBILITY_REPARTITION"
    source_text: "사용자의 정책 결정 없이 GOV 개별 정책의 소유권을 임의로 분할·병합하거나 재배분하는 행위"
  R-ID-MPD-GOV-0004-OBLIGATION-COMPILE_SEALED_INDEPENDENT_BINDINGS:
    rule: "GOV.MPD-GOV-0004.OBLIGATION.COMPILE_SEALED_INDEPENDENT_BINDINGS"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-RESPONSIBILITY_CONDITION_PERMISSION_BINDING"
    source_policy: "MPD-GOV-0004"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_INDEPENDENT_BINDINGS"
    source_text: "Compile-Sealed RBAC에서 책임의 목적·경계, 재사용 가능한 조건 원자, 재사용 가능한 권한 원자 및 승인된 바인딩의 정당성은 독립된 의미와 소유 경계를 가진다. 원자의 존재·등록·컴파일 성공만으로 바인딩 승인 권위를 만들지 않는다."
  R-ID-MPD-GOV-0004-OBLIGATION-GOV_APPROVAL_SOURCE_SCOPE:
    rule: "GOV.MPD-GOV-0004.OBLIGATION.GOV_APPROVAL_SOURCE_SCOPE"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_REGISTRATION_LIFECYCLE_OR_WORK_APPROVAL"
    source_policy: "MPD-GOV-0004"
    source_rule_id: "OBLIGATION/GOV_APPROVAL_SOURCE_SCOPE"
    source_text: "정책 등록, 정책 생명주기 상태 및 개발 작업 승인에 대해 승인 출처와 적용 대상 범위가 적법한지 판단한다."
  R-ID-MPD-GOV-0004-OBLIGATION-GOV_DECISION_MANDATE:
    rule: "GOV.MPD-GOV-0004.OBLIGATION.GOV_DECISION_MANDATE"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-DEVELOPMENT_DECISION"
    source_policy: "MPD-GOV-0004"
    source_rule_id: "OBLIGATION/GOV_DECISION_MANDATE"
    source_text: "개발 과정의 결정에는 결정을 내릴 권한 주체와 권한의 적용 범위를 명확히 정의한다."
  R-ID-MPD-GOV-0004-OBLIGATION-README_CANONICAL_SOURCE:
    rule: "GOV.MPD-GOV-0004.OBLIGATION.README_CANONICAL_SOURCE"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-README_CONTENT_AUTHORITY"
    source_policy: "MPD-GOV-0004"
    source_rule_id: "OBLIGATION/README_CANONICAL_SOURCE"
    source_text: "PTSIP 공식 README의 콘텐츠 원본은 저장소 최상위의 영어 README.md이다."
  R-ID-MPD-GOV-0004-OBLIGATION-README_TRANSLATION_ACTIVATION:
    rule: "GOV.MPD-GOV-0004.OBLIGATION.README_TRANSLATION_ACTIVATION"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-TRANSLATION_ACTIVATION"
    source_policy: "MPD-GOV-0004"
    source_rule_id: "OBLIGATION/README_TRANSLATION_ACTIVATION"
    source_text: "활성 번역 언어 집합은 docs/translated/index.yaml에 기록된 번역 등록 정보에 따라 결정한다."
  R-ID-MPD-GOV-0004-OBLIGATION-RESPONSIBILITY_WIDE_PERMISSION_ACTIVATION:
    rule: "GOV.MPD-GOV-0004.OBLIGATION.RESPONSIBILITY_WIDE_PERMISSION_ACTIVATION"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-SEALED_RESPONSIBILITY_CONDITIONS_SATISFIED"
    source_policy: "MPD-GOV-0004"
    source_rule_id: "OBLIGATION/RESPONSIBILITY_WIDE_PERMISSION_ACTIVATION"
    source_text: "정당하게 연결된 책임의 충족 조건이 만족되면 해당 책임에 연결된 모든 승인된 권한을 일괄 활성화한다. 개별 권한별 추가 실행 승인을 요구하지 않으며 미연결·미승인 권한은 자동 활성화하지 않는다."
  R-ID-MPD-GOV-0004-OBLIGATION-TRANSLATION_FILENAME_CONTRACT:
    rule: "GOV.MPD-GOV-0004.OBLIGATION.TRANSLATION_FILENAME_CONTRACT"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-TRANSLATION_FILE_NAMING"
    source_policy: "MPD-GOV-0004"
    source_rule_id: "OBLIGATION/TRANSLATION_FILENAME_CONTRACT"
    source_text: "번역 파일명은 .ptsip/contracts/schemas/release/releasenote/에 명시된 해당 계약을 따른다."
  R-ID-MPD-GOV-0004-OBLIGATION-TRANSLATION_REGISTRY_CONTRACT:
    rule: "GOV.MPD-GOV-0004.OBLIGATION.TRANSLATION_REGISTRY_CONTRACT"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-TRANSLATION_REGISTRY_VALIDATION"
    source_policy: "MPD-GOV-0004"
    source_rule_id: "OBLIGATION/TRANSLATION_REGISTRY_CONTRACT"
    source_text: "docs/translated/index.yaml의 계약은 .ptsip/contracts/schemas/release/releasenote/에 명시한다."
  R-ID-MPD-GOV-0004-PROHIBITION-EXECUTION_OR_TEST_DOES_NOT_APPROVE_POLICY:
    rule: "GOV.MPD-GOV-0004.PROHIBITION.EXECUTION_OR_TEST_DOES_NOT_APPROVE_POLICY"
    Rule_state: null
    source_policy: "MPD-GOV-0004"
    source_rule_id: "PROHIBITION/EXECUTION_OR_TEST_DOES_NOT_APPROVE_POLICY"
    source_text: "기술적 실행 가능성이나 검증 성공을 정책상 승인과 동일하게 취급하는 행위"
  R-ID-MPD-GOV-0004-PROHIBITION-GOAL_OR_DESIGN_DOES_NOT_PROVE_MANDATE:
    rule: "GOV.MPD-GOV-0004.PROHIBITION.GOAL_OR_DESIGN_DOES_NOT_PROVE_MANDATE"
    Rule_state: null
    source_policy: "MPD-GOV-0004"
    source_rule_id: "PROHIBITION/GOAL_OR_DESIGN_DOES_NOT_PROVE_MANDATE"
    source_text: "작업 목표나 기술 설계가 타당하다는 이유만으로 결정권자의 권한이 증명되었다고 판단하는 행위"
  R-ID-MPD-GOV-0004-PROHIBITION-OTHER_FAMILY_CANNOT_REPLACE_GOV_AUTHORITY:
    rule: "GOV.MPD-GOV-0004.PROHIBITION.OTHER_FAMILY_CANNOT_REPLACE_GOV_AUTHORITY"
    Rule_state: null
    source_policy: "MPD-GOV-0004"
    source_rule_id: "PROHIBITION/OTHER_FAMILY_CANNOT_REPLACE_GOV_AUTHORITY"
    source_text: "사용자의 승인과 유효한 권한 모델 전환 결정 없이 다른 책임 영역이 GOV의 현재 결정 권한을 임의로 대체하거나, Compile-Sealed RBAC 전환을 구실로 미승인 권위를 생성하는 행위"
  R-ID-MPD-GOV-0005-OBLIGATION-APPROVAL_PROVENANCE_SCOPE:
    rule: "GOV.MPD-GOV-0005.OBLIGATION.APPROVAL_PROVENANCE_SCOPE"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_IDENTITY_OR_STATUS_APPROVAL_EVIDENCE"
    source_policy: "MPD-GOV-0005"
    source_rule_id: "OBLIGATION/APPROVAL_PROVENANCE_SCOPE"
    source_text: "승인 근거에는 승인 대상, 목표 상태와 정책 내용 검토 범위를 명시한다."
  R-ID-MPD-GOV-0005-OBLIGATION-BOUNDED_NON_AUTHORITY_DEFAULT:
    rule: "GOV.MPD-GOV-0005.OBLIGATION.BOUNDED_NON_AUTHORITY_DEFAULT"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-MISSING_DETERMINISTIC_RESULT"
    source_policy: "MPD-GOV-0005"
    source_rule_id: "OBLIGATION/BOUNDED_NON_AUTHORITY_DEFAULT"
    source_text: "정당한 권위를 새로 생성하거나 변경하지 않는 범위에서만 제한적인 합리적 기본값을 사용할 수 있다."
  R-ID-MPD-GOV-0005-OBLIGATION-FAIL_CLOSED_ON_INTEGRITY_FAULT:
    rule: "GOV.MPD-GOV-0005.OBLIGATION.FAIL_CLOSED_ON_INTEGRITY_FAULT"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-ID_COLLISION_OR_CATALOG_MISMATCH_OR_INVALID_PROVENANCE"
    source_policy: "MPD-GOV-0005"
    source_rule_id: "OBLIGATION/FAIL_CLOSED_ON_INTEGRITY_FAULT"
    source_text: "식별자 충돌, 정책 문서와 파생 인덱스 불일치, 승인 근거 누락 또는 무효한 승인 근거가 발생하면 해당 처리를 실패로 판정한다."
  R-ID-MPD-GOV-0005-OBLIGATION-MACHINE_CONTRACT_FIRST:
    rule: "GOV.MPD-GOV-0005.OBLIGATION.MACHINE_CONTRACT_FIRST"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-INCOMPLETE_IDENTITY_INFORMATION"
    source_policy: "MPD-GOV-0005"
    source_rule_id: "OBLIGATION/MACHINE_CONTRACT_FIRST"
    source_text: "정보가 부족하면 먼저 기계 계약에 정의된 해결 결과를 사용한다."
  R-ID-MPD-GOV-0005-OBLIGATION-PERSIST_VERIFIED_RESOLUTION:
    rule: "GOV.MPD-GOV-0005.OBLIGATION.PERSIST_VERIFIED_RESOLUTION"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-REPEATED_IDENTITY_DECISION"
    source_policy: "MPD-GOV-0005"
    source_rule_id: "OBLIGATION/PERSIST_VERIFIED_RESOLUTION"
    source_text: "검증된 해결 결과는 기계가 재사용할 수 있는 계약 또는 바인딩으로 보존하고 동일한 현재 문제의 반복 추론을 방지한다."
  R-ID-MPD-GOV-0005-OBLIGATION-POLICY_ID_CONTRACT_OWNER:
    rule: "GOV.MPD-GOV-0005.OBLIGATION.POLICY_ID_CONTRACT_OWNER"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_IDENTITY_ASSIGNMENT"
    source_policy: "MPD-GOV-0005"
    source_rule_id: "OBLIGATION/POLICY_ID_CONTRACT_OWNER"
    source_text: "정책 식별자와 제목은 각 항목을 소유하는 계약을 기준으로 결정하고 제목은 정책 문서에서 선언한 값을 사용한다."
  R-ID-MPD-GOV-0005-OBLIGATION-POLICY_ID_DERIVED_INDEX_CONSISTENCY:
    rule: "GOV.MPD-GOV-0005.OBLIGATION.POLICY_ID_DERIVED_INDEX_CONSISTENCY"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_DISCOVERY_OR_IDENTITY_VALIDATION"
    source_policy: "MPD-GOV-0005"
    source_rule_id: "OBLIGATION/POLICY_ID_DERIVED_INDEX_CONSISTENCY"
    source_text: "승인된 계약으로 정책 문서를 탐색·검증하고 자동 생성된 인덱스의 식별자·경로·상태가 원본과 정확히 일치하는지 확인한다."
  R-ID-MPD-GOV-0005-OBLIGATION-SEPARATE_RULE_IDENTITY_CONTRACT:
    rule: "GOV.MPD-GOV-0005.OBLIGATION.SEPARATE_RULE_IDENTITY_CONTRACT"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-RULE_CONTRACT_ID_ASSIGNMENT"
    source_policy: "MPD-GOV-0005"
    source_rule_id: "OBLIGATION/SEPARATE_RULE_IDENTITY_CONTRACT"
    source_text: "Policy_Rules.Identity.contract_id는 Policy_Status.contract와 별도 식별 책임을 가지며 규칙의 안정적·버전 비포함 식별자를 사용한다. 규칙 버전은 Rule_ver가 소유하며, 식별자 생성·유일성 검증은 독립적으로 관리한다."
  R-ID-MPD-GOV-0005-PROHIBITION-NO_APPROVAL_WORDING_STATUS_GUESS:
    rule: "GOV.MPD-GOV-0005.PROHIBITION.NO_APPROVAL_WORDING_STATUS_GUESS"
    Rule_state: null
    source_policy: "MPD-GOV-0005"
    source_rule_id: "PROHIBITION/NO_APPROVAL_WORDING_STATUS_GUESS"
    source_text: "승인 문구만으로 정책 상태를 추론하는 행위"
  R-ID-MPD-GOV-0005-PROHIBITION-NO_IMPLEMENTATION_TO_ACTIVATION:
    rule: "GOV.MPD-GOV-0005.PROHIBITION.NO_IMPLEMENTATION_TO_ACTIVATION"
    Rule_state: null
    source_policy: "MPD-GOV-0005"
    source_rule_id: "PROHIBITION/NO_IMPLEMENTATION_TO_ACTIVATION"
    source_text: "구현 승인을 정책 활성화 승인으로 취급하는 행위"
  R-ID-MPD-GOV-0005-PROHIBITION-NO_REPEATED_MACHINE_RESOLVABLE_INFERENCE:
    rule: "GOV.MPD-GOV-0005.PROHIBITION.NO_REPEATED_MACHINE_RESOLVABLE_INFERENCE"
    Rule_state: null
    source_policy: "MPD-GOV-0005"
    source_rule_id: "PROHIBITION/NO_REPEATED_MACHINE_RESOLVABLE_INFERENCE"
    source_text: "기계가 이미 해결할 수 있거나 유효한 해결 결과가 보존된 문제를 반복해서 새로 추론하는 행위"
  R-ID-MPD-GOV-0005-PROHIBITION-NO_REPOSITORY_EXISTENCE_APPROVAL:
    rule: "GOV.MPD-GOV-0005.PROHIBITION.NO_REPOSITORY_EXISTENCE_APPROVAL"
    Rule_state: null
    source_policy: "MPD-GOV-0005"
    source_rule_id: "PROHIBITION/NO_REPOSITORY_EXISTENCE_APPROVAL"
    source_text: "저장소에 파일이 존재한다는 사실만으로 정책 승인을 인정하는 행위"
  R-ID-MPD-GOV-0005-PROHIBITION-NO_VISUAL_ID_GUESS:
    rule: "GOV.MPD-GOV-0005.PROHIBITION.NO_VISUAL_ID_GUESS"
    Rule_state: null
    source_policy: "MPD-GOV-0005"
    source_rule_id: "PROHIBITION/NO_VISUAL_ID_GUESS"
    source_text: "정책 외형이나 의미를 보고 다음 정책 식별자를 추측하여 결정하는 행위"
  R-ID-MPD-GOV-0006-OBLIGATION-AUTOMATION_SOURCE_PROPAGATION_ONLY:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.AUTOMATION_SOURCE_PROPAGATION_ONLY"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-AUTOMATION_DERIVED_RESULT"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/AUTOMATION_SOURCE_PROPAGATION_ONLY"
    source_text: "AUTOMATION_DERIVED는 기존 규칙에서 파생된 결과로서 이미 존재하는 권위만 전달할 수 있다."
  R-ID-MPD-GOV-0006-OBLIGATION-COMMON_STATUS_CONTRACT_RECONCILIATION:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.COMMON_STATUS_CONTRACT_RECONCILIATION"
    Rule_state: "APPROVED.Applying"
    condition_id:
      - "C-ID-ROOT_FAMILY_POLICY_STATUS_SCHEMA_OWNERSHIP_OR_VALIDATION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/COMMON_STATUS_CONTRACT_RECONCILIATION"
    source_text: "KEEP_LATEST: PTSIP_DEVELOPER_POLICY의 14개 Root Family는 공통 Public_Policy_Status.schema.json의 상태 검증 구조를 사용한다. GOV는 생명주기에 관한 정책 내용을 정의하지만 해당 스키마를 소유하지 않는다. 어느 Root Family도 스키마 자체의 소유권을 갖지 않으며 정책 구조 및 검증 요건을 정의하거나 담당할 뿐이다. 기존 ARCH·INFO의 Family별 스키마 독립 소유 규칙은 채택하지 않고, 각 Family의 고유 정책 내용과 Policy_Rules에 대한 책임은 보존한다. Family별 Policy_Status 스키마나 GOV 단독 contract 패턴은 현재 규범을 대체할 수 없으며 구형 상태 검증기와 참조는 제거한다. 승인 없는 정책 상태 전환이나 전체 문서 적합성 주장은 허용하지 않는다."
  R-ID-MPD-GOV-0006-OBLIGATION-COMPILE_SEALED_CHANGE_SENSITIVE_VALIDITY:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.COMPILE_SEALED_CHANGE_SENSITIVE_VALIDITY"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-SEALED_ATOM_OR_BINDING_CHANGE"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_CHANGE_SENSITIVE_VALIDITY"
    source_text: "확정된 Compile-Sealed 계약은 불변으로 보존하며 관련 조건 원자·권한 원자·바인딩이 변경되면 영향을 받는 책임 활성화의 유효성을 기계적으로 재판정한다. 재활성화는 책임 단위로 수행하고 권한별 재승인을 도입하지 않는다."
  R-ID-MPD-GOV-0006-OBLIGATION-COMPILE_SEALED_MIGRATION_BOUNDARY:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.COMPILE_SEALED_MIGRATION_BOUNDARY"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-LEGACY_TO_COMPILE_SEALED_TRANSITION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/COMPILE_SEALED_MIGRATION_BOUNDARY"
    source_text: "신규 독립 스키마의 최상위 경로는 승인된 GOV 상위 정책의 경로 계약을 따른다. RBAC를 선택한 프로젝트의 선언형 계약 원본 저장 루트와 여섯 스키마의 조건부 필수 위치는 GOV 상위 정책을 따른다. RBAC의 단일 중앙 등록부는 Responsibility·Condition Atom·Permission Atom·Binding의 선언형 계약 조회만 소유하며 Seal·Activation은 그 등록부에서 분리한 독립 산출물 체계가 소유한다. 여섯 독립 JSON Schema의 분할과 파일명은 유지한다. 중앙 등록부의 개별 파일명·내부 구조·직렬화 형식과 Compiler 관련 기계 계약의 세부 배치, Seal·Activation 산출물 저장·조회 위치와 형식, 스키마 세부 필드, 구현 방식 및 실제 전환 시점은 미결정이다. 이 상위 방향의 승인만으로 기존 검사를 제거하거나 미구현 책임 활성화를 현재 실행 허가로 간주하지 않는다. 실제 전환은 후속 승인된 계약과 검증된 이관에 따른다."
  R-ID-MPD-GOV-0006-OBLIGATION-CONTRACT_BOUNDED_NORMALIZATION:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.CONTRACT_BOUNDED_NORMALIZATION"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-STATUS_NORMALIZATION_OR_CONFLICT_RECOVERY"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/CONTRACT_BOUNDED_NORMALIZATION"
    source_text: "상태 정규화와 충돌 복구는 관련 계약이 허용하는 범위에서만 자동 수행한다."
  R-ID-MPD-GOV-0006-OBLIGATION-DISTRIBUTED_RBAC_VALIDATION_ENGINE:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.DISTRIBUTED_RBAC_VALIDATION_ENGINE"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-PTSIP_TOOL_COMPILE_SEALED_RBAC_PROFILE_VALIDATION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/DISTRIBUTED_RBAC_VALIDATION_ENGINE"
    source_text: "KEEP_LATEST: Compile-Sealed RBAC의 pp.2.00 프로파일 선언·등록부·필수 스키마의 정식 검증 소유자는 배포되는 독립 Rust Validation Engine(src/ptsip/engines/validation)이다. src/ptsip/validation/profile.py는 기존 프로파일 호환 검증 전용이며 RBAC 검증의 권한·정식 진입점으로 사용하지 않는다. 검증은 엔진 고유의 버전된 연산·계약과 배포 가능한 검증 코드로 구현한다. developer/tests는 독립 검증 증거일 뿐 고객용 검증기를 대체하지 않는다. pp.1.02의 현재 지원을 보존하고, pp.2.00의 버전 활성화나 원자·바인딩·Seal·Activation 의미 검증이 미결정인 동안에는 단순 사전 검증으로 실행 권한을 생성하지 않는다. 구현·배포는 기존 검증 책임과 승인·권한 경계를 준수해야 한다."
  R-ID-MPD-GOV-0006-OBLIGATION-FLATTEN_POLICY_STATUS:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.FLATTEN_POLICY_STATUS"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_STATUS_SERIALIZATION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/FLATTEN_POLICY_STATUS"
    source_text: "KEEP_LATEST: PTSIP_DEVELOPER_POLICY의 14개 Root Family는 하나의 공통 Policy_Status 구조를 사용하며, 필수 최상위 필드 Policy_Status_Schema_ver, status, contract를 유지한다. 정책 문서의 status는 APPROVED.Applying 같은 결합 문자열로 유지하고 객체형 상태나 분리된 substatus 필드로 이관하지 않는다. .ptsip/contracts/schemas/Policy/Policy_Status/Public_Policy_Status.schema.json의 properties.status는 결합 상태 상수를 자체 enum으로 중복 선언하지 않고, JSON Schema oneOf와 해소 가능한 버전 명시 $ref를 사용해 .ptsip/contracts/policy/lifecycle/Policy_status/Policy_status_APPROVED.json, Policy_status_DRAFT.json, Policy_status_RETIRED.json 세 원본 계약의 properties.status를 참조한다. 각 원본 계약의 properties.status는 해당 범주의 결합 상태 문자열 type:string 및 enum을 정의하는 단일 상태 상수 원본이며, 기존 properties.status.const와 properties.substatus.enum을 결합하는 DERIVED_DOT_JOIN 투영 및 공통 스키마의 상태값 복제 목록을 폐기한다. 동일한 결합 상태 상수의 중복을 금지하고, 정의되지 않은 상태·누락 또는 해소 불가능한 참조·원본 계약 불일치는 실패 시 차단한다. 개별 하위 상태의 추가·변경·삭제·분할은 해당 원본 계약에서만 관리하고, 공통 스키마는 APPROVED/DRAFT/RETIRED 같은 상위 상태 분류의 추가·제거 또는 참조 계약 식별자 변경 등 참조 구성 자체의 변경에만 수정한다. 상태별 description은 해당 원본 계약에서 상태 상수와 분리하여 조회 가능한 비권한적 설명 정보로 취급하며, 일반 상태 판정은 상수만 조회하고 의미 확인이 필요한 경우에 한해 설명을 조회한다. description의 세부 필드명과 값, Compile-Sealed RBAC 권한·승인·전이 조건은 이 결정으로 확정하거나 생성하지 않으며, 설명만으로 승인·실행 권한을 부여하지 않는다. 세 원본 상태 계약은 additionalProperties:false를 필수로 두지 않는다. 기존 Schema/Policy_Status_version/version 및 constant 그룹과 Family별 상태 스키마는 되살리지 않고 공통 스키마의 contract 패턴을 유지한다. 스키마·검증기·테스트와 원본 계약의 실제 변경은 이 정책에 종속되는 별도 검증된 이관으로 수행하고, 정책 변경만으로 구형 문서 적합성·정책 활성화·RBAC 실행 허가를 인정하지 않는다."
  R-ID-MPD-GOV-0006-OBLIGATION-GOVERNANCE_SOURCE_SEPARATION:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.GOVERNANCE_SOURCE_SEPARATION"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-GOVERNANCE_DECISION_OR_AUTHORIZATION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/GOVERNANCE_SOURCE_SEPARATION"
    source_text: "결정 출처, 승인 출처, 실행 허가 출처 및 상태 전환 출처를 각각 구별한다."
  R-ID-MPD-GOV-0006-OBLIGATION-INDEPENDENT_CONTRACT_PHASED_REFERENCE_CUTOVER:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.INDEPENDENT_CONTRACT_PHASED_REFERENCE_CUTOVER"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-COMPILE_SEALED_REFERENCE_TRANSITION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/INDEPENDENT_CONTRACT_PHASED_REFERENCE_CUTOVER"
    source_text: "독립 계약 전환형에서는 신규 원자·바인딩·Seal의 정당성과 참조 정합성 및 책임 단위 활성화·변경 감응의 유효성을 전환 대상 범위에서 검증한 뒤 기존 권한 참조를 단계적으로 대체한다. 미검증 영역의 기존 정식 권한 효력을 편의상 변경하거나 부분 전환을 전체 전환 완료로 간주하지 않는다."
  R-ID-MPD-GOV-0006-OBLIGATION-INFERRED_SOURCE_NON_AUTHORITY:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.INFERRED_SOURCE_NON_AUTHORITY"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-AGENT_INFERRED_DECISION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/INFERRED_SOURCE_NON_AUTHORITY"
    source_text: "AGENT_INFERRED는 추론 후보일 뿐 정식 정책 권위를 생성하지 않으며 임시 해결에도 명시적인 사용자 허용이 필요하다."
  R-ID-MPD-GOV-0006-OBLIGATION-LIFECYCLE_CONTRACT_AUTHORITY:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.LIFECYCLE_CONTRACT_AUTHORITY"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_STATUS_OR_VERSION_CHANGE"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/LIFECYCLE_CONTRACT_AUTHORITY"
    source_text: "정책 상태와 버전은 해당 공통 생명주기 계약 및 승인 조건에 따라 관리한다. GOV 정책은 생명주기에 관한 정책 내용을 정의하며 스키마 소유권을 갖지 않는다."
  R-ID-MPD-GOV-0006-OBLIGATION-MACHINE_FIRST_AGENT_CONTROL:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.MACHINE_FIRST_AGENT_CONTROL"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-CODING_AGENT_TASK"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/MACHINE_FIRST_AGENT_CONTROL"
    source_text: "정책 조회, 작업 라우팅, 상태 확인, 실행 계획 구성 및 문맥 생성은 가능한 범위에서 재사용 가능한 기계적 제어를 우선 사용한다."
  R-ID-MPD-GOV-0006-OBLIGATION-MUTATION_PRECONDITION_CHECK:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.MUTATION_PRECONDITION_CHECK"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_OR_IMPLEMENTATION_CHANGE"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/MUTATION_PRECONDITION_CHECK"
    source_text: "변경 대상 범위, 실행 선행조건, 정보 최신성 및 기존 결정이나 작업과의 충돌을 확인하고 필수 조건이 해결된 경우에만 해당 범위의 변경을 허용한다."
  R-ID-MPD-GOV-0006-OBLIGATION-PRESERVE_EXISTING_MAJOR_VERSION:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.PRESERVE_EXISTING_MAJOR_VERSION"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-EXISTING_POLICY_VERSION_MAJOR_AT_LEAST_ONE"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/PRESERVE_EXISTING_MAJOR_VERSION"
    source_text: "기존 정책의 주 버전이 1 이상이면 별도 승인 없이 임의로 다른 버전으로 변환하지 않는다."
  R-ID-MPD-GOV-0006-OBLIGATION-RBAC_FIELD_CONTRACT_BEFORE_ENGINE_OPERATION_AND_RELEASE:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.RBAC_FIELD_CONTRACT_BEFORE_ENGINE_OPERATION_AND_RELEASE"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-COMPILE_SEALED_RBAC_VALIDATION_OPERATION_REGISTRATION_OR_DISTRIBUTION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/RBAC_FIELD_CONTRACT_BEFORE_ENGINE_OPERATION_AND_RELEASE"
    source_text: "Compile-Sealed RBAC 검증의 독립 엔진 연산 등록·버전된 공개 인터페이스 확정·패키지 배포보다 먼저 pp.2.00 RBAC 선언 필드의 조건부 필수·자료형, RBAC 등록부와 독립 계약 6종의 필수·선택 필드, 참조·승인 근거·Seal/Activation 무결성 의미 및 직렬화 경계를 각각 사용자 승인된 기계 계약으로 확정한다. 미결정 필드를 구현으로 암묵 확정하지 않는다. 미확정인 동안 이미 작성된 Rust RBAC 사전 검증 모듈은 비권위적 내부 구현 초안으로만 취급하고, 단순 파일 존재·스키마 문법 검사나 테스트 코드만으로 RBAC 기능의 정식 검증 완료·엔진 연산 등록·배포 준비를 주장하지 않는다. 필드별 상세 설계 및 실제 구현은 정책 확정 후 승인된 계약에 종속시킨다. 기존 pp.1.02 프로파일 지원 및 다른 검증 엔진 기능의 독립 배포는 이 RBAC 전환 규칙만으로 제한하지 않는다."
  R-ID-MPD-GOV-0006-OBLIGATION-REASONING_TO_REUSABLE_CONTRACT:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.REASONING_TO_REUSABLE_CONTRACT"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-UNRESOLVED_CONTRACT_CASE_OR_EXECUTION_DEVIATION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/REASONING_TO_REUSABLE_CONTRACT"
    source_text: "기계 계약으로 해결되지 않는 경우 제한된 AI 추론→후보→검증→권한 경계 확인→재사용 가능한 기계 계약 또는 바인딩으로 전환의 절차를 따른다."
  R-ID-MPD-GOV-0006-OBLIGATION-STATUS_IMPLEMENTATION_INDEPENDENCE:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.STATUS_IMPLEMENTATION_INDEPENDENCE"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-POLICY_LIFECYCLE_OR_IMPLEMENTATION_AUTHORIZATION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/STATUS_IMPLEMENTATION_INDEPENDENCE"
    source_text: "정책 상태와 구현 승인 여부를 서로 독립적으로 취급한다."
  R-ID-MPD-GOV-0006-OBLIGATION-USER_EXPLICIT_AUTHORITY:
    rule: "GOV.MPD-GOV-0006.OBLIGATION.USER_EXPLICIT_AUTHORITY"
    Rule_state: "APPROVED.provisional"
    condition_id:
      - "C-ID-OFFICIAL_POLICY_AUTHORITY_CREATION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "OBLIGATION/USER_EXPLICIT_AUTHORITY"
    source_text: "USER_EXPLICIT는 명시적인 사용자 결정이며 정식 정책 권위를 생성할 수 있는 근거로 사용한다."
  R-ID-MPD-GOV-0006-PROHIBITION-DUAL_ACTIVE_AUTHORITY_DURING_TRANSITION:
    rule: "GOV.MPD-GOV-0006.PROHIBITION.DUAL_ACTIVE_AUTHORITY_DURING_TRANSITION"
    Rule_state: null
    source_policy: "MPD-GOV-0006"
    source_rule_id: "PROHIBITION/DUAL_ACTIVE_AUTHORITY_DURING_TRANSITION"
    source_text: "동일한 권한 대상과 범위에서 구권한 체계와 새 Compile-Sealed RBAC가 독립적인 중복 승인 권위로 함께 작동하게 하거나, 신규 계약의 미결정·미검증 상태를 다른 체계의 우회 승인으로 해결하는 행위"
  R-ID-MPD-GOV-0006-PROHIBITION-NO_AUTOMATION_NEW_AUTHORITY:
    rule: "GOV.MPD-GOV-0006.PROHIBITION.NO_AUTOMATION_NEW_AUTHORITY"
    Rule_state: null
    source_policy: "MPD-GOV-0006"
    source_rule_id: "PROHIBITION/NO_AUTOMATION_NEW_AUTHORITY"
    source_text: "자동화 파생 결과를 독립적인 새로운 승인 권위로 사용하는 행위"
  R-ID-MPD-GOV-0006-PROHIBITION-NO_INFERRED_OFFICIAL_AUTHORITY:
    rule: "GOV.MPD-GOV-0006.PROHIBITION.NO_INFERRED_OFFICIAL_AUTHORITY"
    Rule_state: null
    source_policy: "MPD-GOV-0006"
    source_rule_id: "PROHIBITION/NO_INFERRED_OFFICIAL_AUTHORITY"
    source_text: "AI의 추론·테스트 통과·구현 성공만으로 정식 정책 권위를 만드는 행위"
  R-ID-MPD-GOV-0006-PROHIBITION-NO_OUT_OF_SCOPE_APPROVAL:
    rule: "GOV.MPD-GOV-0006.PROHIBITION.NO_OUT_OF_SCOPE_APPROVAL"
    Rule_state: null
    source_policy: "MPD-GOV-0006"
    source_rule_id: "PROHIBITION/NO_OUT_OF_SCOPE_APPROVAL"
    source_text: "필수 조건이 해결되지 않았거나 허가 범위를 벗어난 변경을 편의상 승인하는 행위"
  R-ID-MPD-GOV-0006-PROHIBITION-NO_SOURCE_ESCALATION:
    rule: "GOV.MPD-GOV-0006.PROHIBITION.NO_SOURCE_ESCALATION"
    Rule_state: null
    source_policy: "MPD-GOV-0006"
    source_rule_id: "PROHIBITION/NO_SOURCE_ESCALATION"
    source_text: "사용자의 침묵이나 파일 존재를 USER_EXPLICIT로 간주하거나 낮은 권한의 출처를 높은 권한으로 재표시하는 행위"
  R-ID-MPD-GOV-0006-PROHIBITION-RETIRED_DEVELOPER_POLICY_REGISTRIES_AS_AUTHORITY:
    rule: "GOV.MPD-GOV-0006.PROHIBITION.RETIRED_DEVELOPER_POLICY_REGISTRIES_AS_AUTHORITY"
    Rule_state: "APPROVED.Applying"
    condition_id:
      - "C-ID-DEVELOPER_POLICY_DISCOVERY_OR_SCHEMA_OR_CONTRACT_OR_LIFECYCLE_OR_APPROVAL_RESOLUTION"
    source_policy: "MPD-GOV-0006"
    source_rule_id: "PROHIBITION/RETIRED_DEVELOPER_POLICY_REGISTRIES_AS_AUTHORITY"
    source_text: "developer/policy/registries/**는 퇴역한 비권위 영역이며 정책·계약·스키마·검증·라우팅·생명주기·승인 판단의 권위 원본이나 실행 의존성으로 조회·사용·재활성화할 수 없다. developer/policy/registries/public-policy-structure-governance.json의 규칙·경로·참조의무는 효력이 없고 새 정책이나 구현의 필수 조건이 아니다. 이 디렉터리에 있는 파일의 존재 또는 과거의 참조는 현재 권한을 발생시키지 않으며, 후속 정책은 유효한 developer/policy/** 정책 원본과 별도로 승인된 기계 계약에서만 도출한다."
