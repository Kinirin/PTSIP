ptsip:
  version: "pp.1.01"
  specification:
    family: "0.3.7-draft"
    source: "https://github.com/Kinirin/PTSIP"
    revision: "3c47816770d194ae42f98faedc911d980db0e62a"

responsibility_map:
  mode: explicit

components:
  - id: ptsip-core
    classification: PRODUCT
    roles:
      - IMPLEMENTATION
    include:
      - "src/ptsip/*.py"
      - "src/ptsip/app/**"
      - "src/ptsip/clarification/**"
      - "src/ptsip/inspection/**"
      - "src/ptsip/pilot/**"
      - "src/ptsip/repository/**"
      - "src/ptsip/storage/**"
      - "src/ptsip/validation/**"
    purpose: distributed_ptsip_reference_tool
    shipped: true
    runtime_required: true
    executable: true
    release_owner: tool
    compatibility_owner: tool

  - id: ptsip-evidence
    classification: PRODUCT
    roles:
      - IMPLEMENTATION
    include:
      - "src/ptsip/evidence/**"
    purpose: normalized_evidence_contract_and_adapter_runtime
    shipped: true
    runtime_required: false
    executable: false
    release_owner: tool
    compatibility_owner: tool

  - id: ptsip-source-compat
    classification: PRODUCT
    roles:
      - IMPLEMENTATION
    include:
      - "src/ptsip/source_compat/**"
    purpose: revision_bound_source_profile_compatibility_runtime
    shipped: true
    runtime_required: false
    executable: false
    release_owner: tool
    compatibility_owner: tool

  - id: ptsip-migration
    classification: PRODUCT
    roles:
      - IMPLEMENTATION
    include:
      - "src/ptsip/migration/**"
    purpose: deterministic_profile_migration_planning_execution_and_recovery_runtime
    shipped: true
    runtime_required: false
    executable: false
    release_owner: tool
    compatibility_owner: tool

  - id: vpms
    classification: PRODUCT
    roles:
      - IMPLEMENTATION
    include:
      - "src/vpms/**"
    purpose: distributed_verification_purpose_management_library
    shipped: true
    runtime_required: false
    executable: true
    release_owner: tool
    compatibility_owner: tool

  - id: ptsip-distribution
    classification: PRODUCT
    roles:
      - CONFIGURATION
    include:
      - "pyproject.toml"
    purpose: product_distribution_identity_runtime_metadata_and_package_contract
    shipped: true
    runtime_required: false
    executable: false
    release_owner: tool
    compatibility_owner: tool

  - id: ptsip-package-assembly
    classification: DELIVERY
    roles:
      - CONFIGURATION
    include:
      - "MANIFEST.in"
    purpose: release_distribution_content_assembly_configuration
    shipped: false
    runtime_required: false
    executable: false
    release_owner: delivery
    compatibility_owner: delivery

  - id: ptsip-embedded-contracts
    classification: NEUTRAL_CONTRACT
    include:
      - "src/ptsip/specdata/**"
    purpose: tool_embedded_machine_readable_specification_contracts
    shipped: true
    runtime_required: true
    executable: false
    release_owner: specification
    compatibility_owner: specification

  - id: ptsip-canonical-contracts
    classification: NEUTRAL_CONTRACT
    include:
      - "spec/**"
      - "schemas/**"
      - "registry/**"
    purpose: canonical_ptsip_specification_and_machine_readable_contracts
    shipped: false
    runtime_required: false
    executable: false
    release_owner: specification
    compatibility_owner: specification

  - id: repository-architecture
    classification: DEVELOPMENT_TOOLING
    roles:
      - CONFIGURATION
      - GOVERNANCE
    include:
      - "ptsip.yaml"
      - "profiles/**"
    purpose: repository_architecture_declaration_and_profile_examples
    shipped: false
    runtime_required: false
    executable: false
    release_owner: architecture
    compatibility_owner: architecture

  - id: product-documentation
    classification: PRODUCT
    roles:
      - DOCUMENTATION
    include:
      - "README.md"
      - "README.ko.md"
      - "LICENSE"
      - "releasenote/**"
    purpose: product_distribution_documentation_and_release_history
    shipped: true
    runtime_required: false
    executable: false
    release_owner: tool
    compatibility_owner: tool

  - id: repository-verification
    classification: DEVELOPMENT_TOOLING
    roles:
      - VERIFICATION
    include:
      - "tests/**"
    purpose: repository_verification_and_regression
    shipped: false
    runtime_required: false
    executable: true
    release_owner: development_tooling
    compatibility_owner: development_tooling
    analysis_inputs:
      - "src/**"
      - "spec/**"
      - "schemas/**"
      - "registry/**"
      - "ptsip.yaml"

  - id: repository-release-automation
    classification: DELIVERY
    roles:
      - AUTOMATION
      - VERIFICATION
    include:
      - ".github/workflows/release.yml"
      - ".github/workflows/tooling-release.yml"
      - ".github/scripts/verify_release_contract.py"
    purpose: tool_release_build_contract_tagging_and_publication_automation
    shipped: false
    runtime_required: false
    executable: true
    release_owner: delivery
    compatibility_owner: delivery
    analysis_inputs:
      - "pyproject.toml"
      - "src/ptsip/**"
      - "src/vpms/**"
      - "spec/**"
      - "schemas/**"
      - "registry/**"
      - "releasenote/**"

  - id: repository-ci
    classification: DEVELOPMENT_TOOLING
    roles:
      - VERIFICATION
      - AUTOMATION
    include:
      - ".github/workflows/tooling-test.yml"
      - ".github/workflows/readme-translation.yml"
      - ".github/scripts/sync_readme_argos.py"
      - ".github/scripts/wu04g_guard.py"
      - ".github/scripts/wu04g_track_tests.py"
      - ".github/scripts/wu04g_bridge_log.ps1"
      - ".codex/openai-local-bridge/**"
    purpose: development_verification_repository_and_localization_automation
    shipped: false
    runtime_required: false
    executable: true
    release_owner: development_tooling
    compatibility_owner: development_tooling
    analysis_inputs:
      - "tests/**"
      - "src/**"
      - "README.md"
      - "README.ko.md"

  - id: repository-maintenance
    classification: DEVELOPMENT_TOOLING
    roles:
      - AUTOMATION
      - CONFIGURATION
      - DOCUMENTATION
      - GOVERNANCE
    include:
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "MEMORY.md"
      - "STATUS.md"
      - "bootstrap_repo.ps1"
      - "setup_dev.bat"
      - "cliff.toml"
      - "planning/**"
      - "docs/ptsip/validation/**"
      - "verification-evidence/**"
    purpose: development_planning_evidence_and_repository_maintenance
    shipped: false
    runtime_required: false
    executable: true
    release_owner: development_tooling
    compatibility_owner: development_tooling

associated_artifacts:
  - id: ptsip-governance-support
    anchor: ptsip-canonical-contracts
    include:
      - "adoption/**"
      - "agents/**"
      - "decisions/**"
      - "reference/**"
    purpose: specification_governance_adoption_agent_and_architecture_support

relationships:
  - id: core-reads-embedded-contracts
    from: ptsip-core
    to: ptsip-embedded-contracts
    type: READS

  - id: evidence-imports-core
    from: ptsip-evidence
    to: ptsip-core
    type: IMPORTS

  - id: source-compat-imports-core
    from: ptsip-source-compat
    to: ptsip-core
    type: IMPORTS

  - id: source-compat-reads-embedded-contracts
    from: ptsip-source-compat
    to: ptsip-embedded-contracts
    type: READS

  - id: migration-imports-core
    from: ptsip-migration
    to: ptsip-core
    type: IMPORTS

  - id: migration-imports-evidence
    from: ptsip-migration
    to: ptsip-evidence
    type: IMPORTS

  - id: migration-imports-source-compat
    from: ptsip-migration
    to: ptsip-source-compat
    type: IMPORTS

  - id: canonical-specifies-core
    from: ptsip-canonical-contracts
    to: ptsip-core
    type: SPECIFIES

  - id: canonical-specifies-evidence
    from: ptsip-canonical-contracts
    to: ptsip-evidence
    type: SPECIFIES

  - id: canonical-specifies-source-compat
    from: ptsip-canonical-contracts
    to: ptsip-source-compat
    type: SPECIFIES

  - id: canonical-specifies-migration
    from: ptsip-canonical-contracts
    to: ptsip-migration
    type: SPECIFIES

  - id: canonical-specifies-vpms
    from: ptsip-canonical-contracts
    to: vpms
    type: SPECIFIES

  - id: governance-support-governs-canonical
    from: ptsip-governance-support
    to: ptsip-canonical-contracts
    type: GOVERNS

  - id: governance-support-documents-canonical
    from: ptsip-governance-support
    to: ptsip-canonical-contracts
    type: DOCUMENTS

  - id: repository-verification-verifies-core
    from: repository-verification
    to: ptsip-core
    type: VERIFIES

  - id: repository-verification-verifies-evidence
    from: repository-verification
    to: ptsip-evidence
    type: VERIFIES

  - id: repository-verification-verifies-source-compat
    from: repository-verification
    to: ptsip-source-compat
    type: VERIFIES

  - id: repository-verification-verifies-migration
    from: repository-verification
    to: ptsip-migration
    type: VERIFIES

  - id: repository-verification-verifies-vpms
    from: repository-verification
    to: vpms
    type: VERIFIES

  - id: repository-verification-verifies-contracts
    from: repository-verification
    to: ptsip-canonical-contracts
    type: VERIFIES

  - id: package-assembly-packages-distribution
    from: ptsip-package-assembly
    to: ptsip-distribution
    type: PACKAGES

  - id: release-builds-distribution
    from: repository-release-automation
    to: ptsip-distribution
    type: BUILDS

  - id: release-packages-distribution
    from: repository-release-automation
    to: ptsip-distribution
    type: PACKAGES

  - id: release-publishes-distribution
    from: repository-release-automation
    to: ptsip-distribution
    type: PUBLISHES

policies:
  product_to_nonproduct_runtime_dependency: deny
  nonproduct_in_product_package: deny
  independent_build_resolution: required
  shared_executable_cross_lifecycle: deny
  neutral_contract_sharing: allow
