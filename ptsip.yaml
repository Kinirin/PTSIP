ptsip:
  version: "0.3.4-draft"
  specification:
    source: "https://github.com/Kinirin/PTSIP"
    revision: "b5b17dd16667cc1afaf1d23054b6e5dd773e3f5e"

components:
  - id: ptsip-core
    classification: PRODUCT
    include:
      - "src/ptsip/*.py"
      - "src/ptsip/app/**"
      - "src/ptsip/clarification/**"
      - "src/ptsip/inspection/**"
      - "src/ptsip/pilot/**"
      - "src/ptsip/repository/**"
      - "src/ptsip/storage/**"
      - "src/ptsip/validation/**"
    purpose: distributed_ptsip_reference_tool
    shipped: true
    runtime_required: true
    lifecycle_owner: PRODUCT
    executable: true
    release_owner: tool
    compatibility_owner: tool

  - id: vpms
    classification: PRODUCT
    include:
      - "src/vpms/**"
    purpose: distributed_verification_purpose_management_library
    shipped: true
    runtime_required: false
    lifecycle_owner: PRODUCT
    executable: true
    release_owner: tool
    compatibility_owner: tool

  - id: ptsip-distribution
    classification: PRODUCT
    include:
      - "pyproject.toml"
      - "MANIFEST.in"
    purpose: product_distribution_identity_and_package_definition
    shipped: true
    runtime_required: false
    lifecycle_owner: PRODUCT
    executable: false
    release_owner: tool
    compatibility_owner: tool

  - id: ptsip-embedded-contracts
    classification: NEUTRAL_CONTRACT
    include:
      - "src/ptsip/specdata/**"
    purpose: tool_embedded_machine_readable_specification_contracts
    shipped: true
    runtime_required: true
    lifecycle_owner: INDEPENDENT
    executable: false
    release_owner: specification
    compatibility_owner: specification
    consumers:
      - ptsip-core

  - id: ptsip-canonical-contracts
    classification: NEUTRAL_CONTRACT
    include:
      - "spec/**"
      - "schemas/**"
      - "registry/**"
    purpose: canonical_ptsip_specification_and_machine_readable_contracts
    shipped: false
    runtime_required: false
    lifecycle_owner: INDEPENDENT
    executable: false
    release_owner: specification
    compatibility_owner: specification
    consumers:
      - ptsip-core
      - repository-verification

  - id: ptsip-governance-contracts
    classification: NEUTRAL_CONTRACT
    include:
      - "adoption/**"
      - "agents/**"
      - "decisions/**"
      - "reference/**"
    purpose: architecture_governance_adoption_and_agent_contracts
    shipped: false
    runtime_required: false
    lifecycle_owner: INDEPENDENT
    executable: false
    release_owner: specification
    compatibility_owner: specification
    consumers:
      - ptsip-core
      - vpms
      - repository-verification

  - id: repository-architecture
    classification: NEUTRAL_CONTRACT
    include:
      - "ptsip.yaml"
      - "profiles/**"
    purpose: repository_architecture_declaration_and_profile_examples
    shipped: false
    runtime_required: false
    lifecycle_owner: INDEPENDENT
    executable: false
    release_owner: architecture
    compatibility_owner: architecture
    consumers:
      - ptsip-core
      - vpms
      - repository-verification

  - id: product-documentation
    classification: PRODUCT
    include:
      - "README.md"
      - "README.ko.md"
      - "LICENSE"
      - "releasenote/**"
    purpose: product_distribution_documentation_and_release_history
    shipped: true
    runtime_required: false
    lifecycle_owner: PRODUCT
    executable: false
    release_owner: tool
    compatibility_owner: tool

  - id: repository-verification
    classification: TOOLCHAIN
    include:
      - "tests/**"
    purpose: repository_verification_and_regression
    shipped: false
    runtime_required: false
    lifecycle_owner: DEVELOPMENT_TOOLING
    executable: true
    release_owner: toolchain
    compatibility_owner: toolchain
    analysis_inputs:
      - "src/**"
      - "spec/**"
      - "schemas/**"
      - "registry/**"
      - "ptsip.yaml"

  - id: repository-release-automation
    classification: TOOLCHAIN
    include:
      - ".github/workflows/release.yml"
      - ".github/workflows/tooling-release.yml"
    purpose: tool_release_tagging_and_publication_automation
    shipped: false
    runtime_required: false
    lifecycle_owner: DEVELOPMENT_TOOLING
    executable: true
    release_owner: toolchain
    compatibility_owner: toolchain
    analysis_inputs:
      - "pyproject.toml"
      - "src/ptsip/**"
      - "src/vpms/**"
      - "releasenote/**"

  - id: repository-ci
    classification: TOOLCHAIN
    include:
      - ".github/workflows/tooling-test.yml"
      - ".github/workflows/readme-translation.yml"
      - ".github/scripts/**"
    purpose: continuous_integration_and_documentation_automation
    shipped: false
    runtime_required: false
    lifecycle_owner: DEVELOPMENT_TOOLING
    executable: true
    release_owner: toolchain
    compatibility_owner: toolchain
    analysis_inputs:
      - "tests/**"
      - "src/**"
      - "README.md"
      - "README.ko.md"

  - id: repository-maintenance
    classification: TOOLCHAIN
    include:
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "MEMORY.md"
      - "STATUS.md"
      - "bootstrap_repo.ps1"
      - "cliff.toml"
      - "planning/**"
      - "verification-evidence/**"
    purpose: development_planning_evidence_and_repository_maintenance
    shipped: false
    runtime_required: false
    lifecycle_owner: DEVELOPMENT_TOOLING
    executable: true
    release_owner: toolchain
    compatibility_owner: toolchain

policies:
  product_to_toolchain_runtime_dependency: deny
  toolchain_in_product_package: deny
  independent_build_resolution: required
  shared_executable_cross_boundary: deny
  neutral_contract_sharing: allow
