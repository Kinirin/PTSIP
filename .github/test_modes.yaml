# Repository-local Test Mode Registry v2.
#
# Authority firewall:
# - component_ref MUST resolve to a test-owning VERIFICATION component in the
#   canonical Project Profile.
# - selection paths come only from that component's analysis_inputs + include.
# - this registry owns execution targets only; it MUST NOT duplicate
#   architecture authority or change-impact watch paths.
version: 2

modes:
  - id: ptsip-core
    component_ref: ptsip-core-verification
    execution:
      pytest:
        - src/tests/ptsip/clarification
        - src/tests/ptsip/cli
        - src/tests/ptsip/conformance
        - src/tests/ptsip/control_plane
        - src/tests/ptsip/governance/test_authority_runtime.py
        - src/tests/ptsip/governance/test_authorization_transition.py
        - src/tests/ptsip/identity
        - src/tests/ptsip/inspection
        - src/tests/ptsip/integration
        - src/tests/ptsip/pilot
        - src/tests/ptsip/topology
        - src/tests/ptsip/validation
        - src/tests/ptsip/repository/test_profile_convergence_037.py
        - src/tests/ptsip/repository/test_profile_transition_037.py
        - src/tests/ptsip/repository/test_remote_discovery.py
        - src/tests/ptsip/repository/test_snapshot_integrity.py
        - src/tests/ptsip/test_adoption.py
        - src/tests/ptsip/test_clarification.py
        - src/tests/ptsip/test_merge_gate_followup_030.py
        - src/tests/ptsip/test_proposed_component.py
        - src/tests/ptsip/test_context_plane.py

  - id: ptsip-evidence
    component_ref: ptsip-evidence-verification
    execution:
      pytest:
        - src/tests/ptsip/evidence

  - id: ptsip-source-compat
    component_ref: ptsip-source-compat-verification
    execution:
      pytest:
        - src/tests/ptsip/source_compat

  - id: ptsip-migration
    component_ref: ptsip-migration-verification
    execution:
      pytest:
        - src/tests/ptsip/migration

  - id: ptsip-remediation
    component_ref: ptsip-remediation-verification
    execution:
      pytest:
        - src/tests/ptsip/remediation

  - id: vpms
    component_ref: vpms-verification
    execution:
      pytest:
        - src/tests/vpms/domain
        - src/tests/vpms/execution
        - src/tests/vpms/integration
        - src/tests/vpms/architecture
        - src/tests/vpms/selection

  - id: vpms-contract-plane
    component_ref: vpms-contract-plane-verification
    execution:
      pytest:
        - src/tests/vpms/contracts

  - id: ptsip-contract
    component_ref: ptsip-contract-verification
    execution:
      pytest:
        - src/tests/ptsip/contracts
        - src/tests/ptsip/agent_contracts/test_contract_plane.py
        - src/tests/ptsip/agent_contracts/test_operation_loading.py
        - src/tests/ptsip/governance/test_contracts.py

  - id: agent-contract-candidate
    component_ref: agent-contract-candidate-verification
    execution:
      pytest:
        - src/tests/ptsip/agent_contracts/test_candidate_parity.py
        - src/tests/ptsip/agent_contracts/test_projection_bindings.py

  - id: policy-responsibility-analysis
    component_ref: policy-responsibility-analysis-verification
    execution:
      pytest:
        - src/tests/ptsip/policy_responsibility_analysis

  - id: repository-architecture
    component_ref: repository-architecture-verification
    execution:
      go:
        - developer/tests/planning
        - developer/tests/policy
        - developer/tests/pp
        - developer/tests/repository
        - developer/tests/rootfamily
        - developer/tests/workflows
      pytest:
        - src/tests/ptsip/repository/test_self_profile.py

  - id: agent-contract-runtime
    component_ref: agent-contract-runtime-verification
    execution:
      pytest:
        - src/tests/agent_contracts/test_resolver.py

  - id: agent-contract-plane
    component_ref: agent-contract-plane-verification
    execution:
      pytest:
        - src/tests/agent_contracts/test_contract_plane.py
        - src/tests/agent_contracts/test_promotion_contract.py

  - id: repository-release
    component_ref: repository-release-verification
    execution:
      go:
        - developer/tests/release

  - id: test-mode-control-plane
    component_ref: repository-test-mode-control-plane
    execution:
      pytest:
        - src/tests/ptsip/test_modes
