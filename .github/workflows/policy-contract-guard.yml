name: Policy contract guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact comparison base SHA (40 hexadecimal characters)
        type: string
        required: true

permissions:
  contents: read

jobs:
  policy-contract-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install registered validation runtime
        run: python -m pip install --disable-pip-version-check 'PTSIP==0.3.8b5' 'PyYAML==6.0.3' 'pytest>=8,<10'
      - name: Verify unified policy candidate coverage and registration boundaries
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            src/tests/ptsip/contracts/test_unified_policy.py \
            src/tests/ptsip/contracts/test_migrate_unified_current.py \
            src/tests/ptsip/contracts/test_applicability_snapshot.py
          python .ptsip/engine/developer/policy/migrate_unified.py --root . --verify-current
      - name: Check read-only per-rule RA RAC AEC applicability registration
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer test ./policy/applicability/... -count=1
          python .ptsip/engine/developer/policy/applicability/input.py --root . > "$RUNNER_TEMP/policy-applicability-input.json"
          go -C .ptsip/engine/developer run ./policy/applicability/cmd/policy-applicability --input "$RUNNER_TEMP/policy-applicability-input.json" --output "$RUNNER_TEMP/policy-applicability-result.json" --summary
      - name: Retain machine-readable applicability assessment evidence
        uses: actions/upload-artifact@v7
        with:
          name: policy-applicability-assessment-${{ github.sha }}
          path: ${{ runner.temp }}/policy-applicability-result.json
          if-no-files-found: error
      - name: Test shared selection, authoring and review paths
        run: |
          go -C .ptsip/engine/developer test ./internal/contractentry ./internal/contract_authoring ./policy/verification/... ./policy/review/... -count=1
          python -m unittest discover -s .ptsip/engine/developer/policy/verification -p changed_test.py
          python -m unittest discover -s .ptsip/engine/developer/policy/review -p workflow_test.py
      - name: Reject retired contract writes and validate changed policies
        env:
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          POLICY_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python .ptsip/engine/developer/policy/verification/changed.py --base "$POLICY_BASE_SHA" --head "$POLICY_HEAD_SHA"
