name: tooling-verify-032

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip ".[dev]" twine
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Verify Tool and new CLI surfaces
        shell: bash
        run: |
          test "$(ptsip --version)" = "PTSIP Tool 0.3.2"
          ptsip spec
          ptsip topology --help
          ptsip resolve --help
          ptsip conform --help
      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*
