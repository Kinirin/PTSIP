name: readme-verification

on:
  push:
    branches: [main, "dev/**"]
    paths:
      - README.md
      - .ptsip/contracts/release/Platform/Common/releasenote.json
      - .ptsip/contracts/release/Platform/Common/versions_different.json
      - .ptsip/contracts/schemas/release/versions_different.schema.json
      - .ptsip/contracts/schemas/release/releasenote/**
      - .ptsip/engine/developer/Distribution/release/verification/releasenote/**
      - .ptsip/engine/developer/Distribution/release/version/**
      - docs/releasenote/**
      - docs/translated/**
      - .github/workflows/readme-translation.yml
      - .github/workflows/readme-verification.yml
      - .ptsip/engine/developer/Distribution/release/test/releasenote/**
      - developer/tests/distribution/release/test/releasenote/**
  pull_request:
    paths:
      - README.md
      - .ptsip/contracts/release/Platform/Common/releasenote.json
      - .ptsip/contracts/release/Platform/Common/versions_different.json
      - .ptsip/contracts/schemas/release/versions_different.schema.json
      - .ptsip/contracts/schemas/release/releasenote/**
      - .ptsip/engine/developer/Distribution/release/verification/releasenote/**
      - .ptsip/engine/developer/Distribution/release/version/**
      - docs/releasenote/**
      - docs/translated/**
      - .github/workflows/readme-translation.yml
      - .github/workflows/readme-verification.yml
      - .ptsip/engine/developer/Distribution/release/test/releasenote/**
      - developer/tests/distribution/release/test/releasenote/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-readme-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go for README verifier
        uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
          cache-dependency-path: |
            .ptsip/engine/developer/Distribution/release/test/go.sum
            developer/tests/go.sum
      - name: Run Go regression tests
        run: go -C developer/tests test -mod=readonly ./distribution/release/test/releasenote -count=1
      - name: Verify English formatting, classification, and archive contracts
        run: go -C .ptsip/engine/developer/Distribution/release/test run ./releasenote --root ../../../../../.. --action documentation-check
      - name: Verify registered translations without mutation
        run: go -C .ptsip/engine/developer/Distribution/release/test run ./releasenote --root ../../../../../.. --action verify
