name: readme-verification

on:
  push:
    branches: [main, "dev/**"]
    paths:
      - README.md
      - docs/translated/**
      - .github/workflows/readme-translation.yml
      - .github/workflows/readme-verification.yml
      - .ptsip/engine/developer/Distribution/release/test/releasenote/**
  pull_request:
    paths:
      - README.md
      - docs/translated/**
      - .github/workflows/readme-translation.yml
      - .github/workflows/readme-verification.yml
      - .ptsip/engine/developer/Distribution/release/test/releasenote/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-readme-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go for README verifier
        uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
          cache-dependency-path: .ptsip/engine/developer/Distribution/release/test/go.sum
      - name: Run Go regression tests
        run: go -C .ptsip/engine/developer/Distribution/release/test test ./releasenote
      - name: Verify registered translations without mutation
        run: go -C .ptsip/engine/developer/Distribution/release/test run ./releasenote --root ../../../../../.. --action verify
