name: PTSIP b5 Policy Schema Test
on:
  push:
    paths:
      - ".github/workflows/ptsip-b5-policy-schema-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  developer-schema-contracts-b5-diagnostic:
    name: "developer-schema-contracts b5 diagnostic / ${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: developer/tests/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned official PTSIP b5
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PTSIP==0.3.8b5" "PyYAML>=6,<7"
      - name: Confirm retired Test Mode Python scripts are absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/scripts/validate_test_modes.py
          test ! -e .github/scripts/resolve_test_modes.py
          echo "RETIRED_CONTROL_PLANE_UNRESOLVED: old Python validator/resolver absent."
          echo "This diagnostic checks official b5 engine only, not full Test Mode Registry conformance."
      - name: Execute official engine b5 internal ref and developer schema tests
        shell: bash
        env:
          PTSIP_TEST_PACKAGE_VERSION: '0.3.8b5'
        run: |
          set -euo pipefail
          go -C developer/tests test ./schema_validation -count=1 -v
      - name: Run developer-schema-contracts full current schema check
        shell: bash
        env:
          PTSIP_TEST_PACKAGE_VERSION: '0.3.8b5'
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer run . --validator schema-check --root ../../..
      - name: Verify affected Go and declarative ownership test units
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m pytest -q src/tests/ptsip/agent_contracts/test_projection_bindings.py -k exact_declarative_verification_ownership
          go -C developer/tests test ./repository ./workflows -count=1
          go -C developer/tests test ./rootfamily -run '^ -count=1
