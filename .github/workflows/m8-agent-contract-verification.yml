name: m8-agent-contract-verification

on:
  push:
    branches:
      - verify/m8-agent-contracts-20260925

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare isolated Python 3.14
        shell: powershell
        run: |
          $python = (& py -3.14 -c "import sys; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $python) {
            throw "Python 3.14 is required."
          }
          if (Test-Path -LiteralPath ".m8-venv") {
            Remove-Item -LiteralPath ".m8-venv" -Recurse -Force
          }
          & $python -m venv .m8-venv
          $venvScripts = (Resolve-Path ".m8-venv\Scripts").Path
          $venvScripts >> $env:GITHUB_PATH

      - name: Install verification environment
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify repository responsibility and Test Mode routing
        shell: powershell
        run: |
          python .github/scripts/validate_test_modes.py
          $json = python .github/scripts/resolve_test_modes.py automatic --changed-file src/ptsip/agent_contracts/operations/conform.yaml
          if ($LASTEXITCODE -ne 0) { throw "Agent Contract Test Mode resolution failed." }
          $result = ($json | ConvertFrom-Json)
          $selected = @($result.selected_ids)
          if (($selected -join ",") -ne "vpms,ptsip-contract") {
            throw "Unexpected Agent Contract Test Modes: $($selected -join ',')"
          }
          Write-Host "Agent Contract Test Modes: $($selected -join ', ')"

      - name: Run M8 focused regression
        shell: powershell
        run: |
          python -m pytest -q tests/ptsip/agent_contracts tests/ptsip/test_modes tests/ptsip/contracts/test_embedded_specdata.py tests/ptsip/repository/test_self_profile.py

      - name: Verify operation-scoped context budgets
        shell: powershell
        run: |
          @'
          from ptsip.agent_contracts import load_operation_contract, validate_agent_contract_plane
          operations = ("adopt", "validate", "conform", "reconcile-authority", "migrate-profile")
          print("contract-plane:", validate_agent_contract_plane())
          for operation in operations:
              bundle = load_operation_contract(operation)
              assert bundle.context_bytes <= bundle.context_budget_bytes
              assert all(".md" not in value.lower() for value in bundle.resource_refs)
              print(f"{operation}: {bundle.context_bytes}/{bundle.context_budget_bytes} bytes -> {bundle.resource_refs}")
          '@ | python -

      - name: Build wheel
        shell: powershell
        run: |
          python -m build --wheel

      - name: Verify package-only agent entry outside repository
        shell: powershell
        run: |
          $hostPython = (& py -3.14 -c "import sys; print(sys.executable)").Trim()
          if (Test-Path -LiteralPath ".m8-wheel-venv") {
            Remove-Item -LiteralPath ".m8-wheel-venv" -Recurse -Force
          }
          & $hostPython -m venv .m8-wheel-venv
          $wheelPython = (Resolve-Path ".m8-wheel-venv\Scripts\python.exe").Path
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1).FullName
          & $wheelPython -m pip install $wheel
          if ($LASTEXITCODE -ne 0) { throw "Wheel installation failed." }

          Push-Location $env:RUNNER_TEMP
          try {
            @'
            from ptsip.agent_contracts import load_operation_contract, validate_agent_contract_plane
            assert validate_agent_contract_plane() == {"specs": 8, "operations": 5, "vocabularies": 4, "bindings": 1}
            for op in ("adopt", "validate", "conform", "reconcile-authority", "migrate-profile"):
                bundle = load_operation_contract(op)
                assert bundle.binding["loading"]["markdown_dependency"] == "FORBIDDEN"
                assert bundle.context_bytes <= bundle.context_budget_bytes
            print("PACKAGE_ONLY_AGENT_ENTRY: PASS")
            '@ | & $wheelPython -
            if ($LASTEXITCODE -ne 0) { throw "Package-only agent entry failed." }
          }
          finally {
            Pop-Location
          }
