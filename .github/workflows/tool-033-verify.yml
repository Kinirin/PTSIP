name: tool-033-verify

on:
  push:
    branches:
      - tool-0.3.3-github-authority

permissions:
  contents: read

concurrency:
  group: tool-033-verify
  cancel-in-progress: true

jobs:
  test:
    if: contains(github.event.head_commit.message, '[verify-033]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ptsip adopt --help
      - run: ptsip gate --help
      - run: ptsip resolve --help
