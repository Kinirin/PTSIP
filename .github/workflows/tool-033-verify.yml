name: tool-033-verify

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: tool-033-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "twine>=5,<7"
      - run: python -m compileall -q src
      - run: python -m pytest -q
      - run: test "$(ptsip --version)" = "PTSIP Tool 0.3.3"
      - run: ptsip spec --json
      - run: ptsip adopt --help
      - run: ptsip clarify --help
      - run: ptsip gate --help
      - run: ptsip resolve --help
      - run: ptsip validate --help
      - run: ptsip conform --help
      - run: python -m build
      - run: python -m twine check dist/*
