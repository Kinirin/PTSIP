name: Policy Cleanup Verification
on:
  push:
    branches: [main]
    paths:
      - 'developer/automation/internal/machine/policy_cleanup*'
      - 'developer/automation/internal/machine/operations_policy.go'
      - 'developer/automation/policy/lifecycle/discovery.go'
      - '.github/workflows/policy-cleanup-verification.yml'
      - '.ptsip/contracts/policy/routing/verification_exclusions.json'
      - '.ptsip/engine/developer/schema_check/VerificationExclusions_test.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: developer/automation/go.mod
          cache-dependency-path: developer/automation/go.sum
      - name: Cleanup checks and native Go compilation
        run: |
          go -C developer/automation test -tags grammar_subset,grammar_subset_python -count=1 ./internal/machine -run '^TestCleanup(IDValidationRejectsNonPolicyIdentity|ApplyRequiresExpectedHeadBeforeGitAccess|MissingSubstatusFailsClosed)$'
      - name: Verify current policy verification exclusions
        run: |
          go -C .ptsip/engine/developer test ./schema_check -run '^TestPolicyVerificationExclusions$' -count=1
      - name: Cleanup command smoke test (non-destructive)
        shell: bash
        run: |
          go -C developer/automation build -tags grammar_subset,grammar_subset_python -o "$RUNNER_TEMP/ptsip-dev" ./cmd/ptsip-dev
          set +e
          "$RUNNER_TEMP/ptsip-dev" --repository . policy-cleanup inspect MPD-VERI-0006 > "$RUNNER_TEMP/cleanup-inspection.json"
          result=$?
          set -e
          cat "$RUNNER_TEMP/cleanup-inspection.json"
          test "$result" -eq 2
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/cleanup-inspection.json")); assert p["status"] == "BLOCKED" and p["blockers"]'
