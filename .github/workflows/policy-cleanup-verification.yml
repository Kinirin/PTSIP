name: Current Policy Verification Scope
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/policy-cleanup-verification.yml'
      - '.github/test_modes.yaml'
      - '.ptsip/contracts/policy/routing/verification_exclusions.json'
      - '.ptsip/engine/developer/schema_check/VerificationExclusions_test.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-policy-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/go.mod
      - name: Verify current policy exclusion contract and required gates
        run: |
          go -C .ptsip/engine/developer test ./schema_check -run '^TestPolicyVerificationExclusions$' -count=1
