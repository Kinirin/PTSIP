name: Policy Cleanup Verification
on:
  push:
    branches: [main]
    paths:
      - 'developer/automation/internal/machine/policy_cleanup*'
      - 'developer/automation/internal/machine/operations_policy.go'
      - 'developer/automation/policy/lifecycle/discovery.go'
      - 'developer/tests/rootfamily/transition_test.go'
      - 'developer/policy/contracts/go-automation-cutover.v1.json'
      - '.github/workflows/policy-cleanup-verification.yml'
      - 'developer/policy/legacy/**'
      - 'developer/policy/*/*.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: developer/automation/go.mod
          cache-dependency-path: developer/automation/go.sum
      - name: Cleanup checks and native Go compilation
        run: |
          go -C developer/automation test -tags grammar_subset,grammar_subset_python -count=1 ./internal/machine -run '^TestCleanup(IDValidationRejectsNonPolicyIdentity|ApplyRequiresExpectedHeadBeforeGitAccess|MissingSubstatusFailsClosed)$'
      - name: Frozen migration audit verification
        run: |
          go -C developer/tests test -tags grammar_subset,grammar_subset_python -count=1 ./rootfamily -run TestHistoricalSourceEvidencePreservesArchiveAndRouting
      - name: Cleanup command smoke test (non-destructive)
        shell: bash
        run: |
          go -C developer/automation build -tags grammar_subset,grammar_subset_python -o "$RUNNER_TEMP/ptsip-dev" ./cmd/ptsip-dev
          set +e
          "$RUNNER_TEMP/ptsip-dev" --repository . policy-cleanup inspect MPD-VERI-0006 > "$RUNNER_TEMP/cleanup-inspection.json"
          result=$?
          set -e
          cat "$RUNNER_TEMP/cleanup-inspection.json"
          test "$result" -eq 2
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/cleanup-inspection.json")); assert p["status"] == "BLOCKED" and p["blockers"]'

  observe-user-requested-five:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'CLEANUP-OBSERVE-20261013-ONCE') }}
    strategy:
      fail-fast: false
      matrix:
        policy_id: [MPD-0010, MPD-0017, MPD-MIGR-0002, MPD-VERI-0006, MPD-WORK-0003]
    name: Inspect and attempt apply ${{ matrix.policy_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: developer/automation/go.mod
          cache-dependency-path: developer/automation/go.sum
      - name: Attempt cleanup exactly once in isolated runner
        shell: bash
        env:
          POLICY_ID: ${{ matrix.policy_id }}
        run: |
          set -euo pipefail
          go -C developer/automation build -tags grammar_subset,grammar_subset_python -o "$RUNNER_TEMP/ptsip-dev" ./cmd/ptsip-dev
          expected_head="$(git rev-parse HEAD)"
          target="developer/policy/legacy/${POLICY_ID}.yaml"
          test -f "$target"
          set +e
          "$RUNNER_TEMP/ptsip-dev" --repository . policy-cleanup inspect "$POLICY_ID" > "$RUNNER_TEMP/inspect.json" 2> "$RUNNER_TEMP/inspect.err"
          inspect_exit=$?
          "$RUNNER_TEMP/ptsip-dev" --repository . policy-cleanup apply "$POLICY_ID" --expected-head "$expected_head" > "$RUNNER_TEMP/apply.json" 2> "$RUNNER_TEMP/apply.err"
          apply_exit=$?
          set -e
          cat "$RUNNER_TEMP/inspect.err" "$RUNNER_TEMP/apply.err"
          cat "$RUNNER_TEMP/inspect.json" "$RUNNER_TEMP/apply.json"
          INSPECT_EXIT="$inspect_exit" APPLY_EXIT="$apply_exit" python3 - <<'PY'
          import json, os, pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          policy=os.environ['POLICY_ID']
          inspect=json.loads((tmp/'inspect.json').read_text())
          result=json.loads((tmp/'apply.json').read_text())
          status=result.get('status')
          target=pathlib.Path('developer/policy/legacy')/(policy+'.yaml')
          print('OBSERVATION:', policy, 'inspect=',inspect.get('status'),'apply=',status,'file_exists=',target.exists())
          assert status in ('BLOCKED', 'APPLIED'), status
          assert int(os.environ['APPLY_EXIT'])==(0 if status=='APPLIED' else 2)
          assert target.exists()==(status!='APPLIED')
          assert inspect.get('status') in ('ELIGIBLE','BLOCKED','UNRESOLVED')
          if status=='BLOCKED': print('BLOCKERS:',result.get('blockers'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f'### {policy}\n')
              f.write(f'- inspect: `{inspect.get("status")}`\n- apply: `{status}`\n- runner file exists: `{target.exists()}`\n')
              f.write(f'- blockers: `{result.get("blockers", [])}`\n')
          PY
