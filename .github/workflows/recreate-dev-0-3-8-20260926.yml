name: recreate-dev-0-3-8-20260926

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recreate-dev-0-3-8-20260926.yml"

permissions:
  contents: write

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify registered recreation command
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m developer.automation.policy_validator
          python -m developer.automation.branch_control commands
          python -m pytest -q developer/tests/test_branch_creation_guard.py developer/tests/test_branch_control.py

      - name: Retire this one-shot workflow before recreation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          remote_main="$(git rev-parse origin/main)"
          if [ "$remote_main" != "${GITHUB_SHA}" ]; then
            echo "main moved before one-shot retirement: $remote_main != ${GITHUB_SHA}" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recreate-dev-0-3-8-20260926.yml
          git commit -m "ci: retire one-shot dev/0.3.8 recreation"
          git push origin HEAD:main

      - name: Recreate dev/0.3.8 from final main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m developer.automation.branch_control recreate \
            --repository Kinirin/PTSIP \
            --branch dev/0.3.8 \
            --approved-name dev/0.3.8 \
            --base-ref main

      - name: Verify exact ref equality
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          main = get("https://api.github.com/repos/Kinirin/PTSIP/git/ref/heads/main")["object"]["sha"]
          dev = get("https://api.github.com/repos/Kinirin/PTSIP/git/ref/heads/dev%2F0.3.8")["object"]["sha"]
          print(json.dumps({"main": main, "dev/0.3.8": dev, "equal": main == dev}, sort_keys=True))
          if main != dev:
              raise SystemExit("recreated branch does not equal final main")
          PY
