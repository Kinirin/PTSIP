name: Tool 0.3.0 Final Release Readiness

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ptsip --version
      - run: ptsip spec
      - run: ptsip conform --help
      - run: python -c "from ptsip.constants import SPEC_REVISION; assert SPEC_REVISION == 'a877b2f66a7f94c1b844c979e1b08fb08a9a8e45'"

  package:
    name: Package Python 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" build twine
      - name: Verify release identity
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "tool-v${PACKAGE_VERSION}" = "tool-v0.3.0"
          python -c "from ptsip.constants import SPEC_REVISION, TOOL_VERSION; assert TOOL_VERSION == '0.3.0'; assert SPEC_REVISION == 'a877b2f66a7f94c1b844c979e1b08fb08a9a8e45'"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install built wheel
        shell: bash
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install --force-reinstall "$WHEEL"
      - run: ptsip --version
      - run: ptsip spec
      - run: ptsip conform --help
