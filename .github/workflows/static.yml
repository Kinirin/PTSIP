# Deploy the PTSIP static website from Pages/ only.
name: Deploy PTSIP Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Pages/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Supabase browser configuration
        shell: bash
        env:
          PTSIP_SUPABASE_URL: ${{ vars.PTSIP_SUPABASE_URL }}
          PTSIP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PTSIP_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const runtimeConfig = {
            url: process.env.PTSIP_SUPABASE_URL || "",
            publishableKey: process.env.PTSIP_SUPABASE_PUBLISHABLE_KEY || ""
          };

          const outputDir = path.join("Pages", "config");
          fs.mkdirSync(outputDir, { recursive: true });
          fs.writeFileSync(
            path.join(outputDir, "supabase-runtime.js"),
            "window.__PTSIP_SUPABASE__ = Object.freeze(" +
              JSON.stringify(runtimeConfig) +
              ");\n",
            "utf8"
          );
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./Pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
