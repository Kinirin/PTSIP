name: context-plane-verification

on:
  push:
    branches:
      - "verify/context-plane-20260925"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install context verification environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install verification environment."
          }
          "CTX_PYTHON=python" >> $env:GITHUB_ENV

      - name: Verify generated context projections
        shell: pwsh
        run: |
          & $env:CTX_PYTHON -m developer.automation.context_projection check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Canonical projection drift detected; regenerating for diagnostic diff."
            & $env:CTX_PYTHON -m developer.automation.context_projection sync
            git diff --no-ext-diff -- .ptsip/context
            throw "Context projection verification failed."
          }

      - name: Resolve and run deterministic Test Modes
        shell: pwsh
        env:
          VERIFY_BASE: 8fa45f8b12d8794f7f5e85bb2e209cfc1d3d5540
        run: |
          $json = & $env:CTX_PYTHON .github/scripts/resolve_test_modes.py automatic --base $env:VERIFY_BASE --head HEAD
          if ($LASTEXITCODE -ne 0 -or -not $json) {
            throw "Automatic Test Mode resolution failed."
          }
          $result = (($json -join "`n") | ConvertFrom-Json)
          Write-Host "Selected Test Modes: $($result.selected_ids -join ', ')"
          Write-Host "No-Test-Mode paths: $($result.no_verification_required -join ', ')"
          foreach ($mode in @($result.plan)) {
            $targets = @($mode.pytest)
            if ($targets.Count -eq 0) {
              throw "Test Mode '$($mode.id)' has no pytest targets."
            }
            Write-Host "=== $($mode.id): $($targets -join ', ') ==="
            & $env:CTX_PYTHON -m pytest -q @targets
            if ($LASTEXITCODE -ne 0) {
              throw "Test Mode '$($mode.id)' failed."
            }
          }

      - name: Confirm legacy state files are retired
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "STATUS.md") { throw "STATUS.md must remain retired." }
          if (Test-Path -LiteralPath "MEMORY.md") { throw "MEMORY.md must remain retired." }
          if (Test-Path -LiteralPath ".ptsip/state/current.json") { throw "Legacy current.json must remain retired." }
          if (Test-Path -LiteralPath ".ptsip/memory/memory.jsonl") { throw "Legacy memory.jsonl must remain retired." }
          Write-Host "Legacy state surfaces: RETIRED"
