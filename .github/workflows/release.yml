name: prepare-tool-release

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: read

concurrency:
  group: prepare-tool-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact dispatched main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare self-hosted Python 3.14
        shell: powershell
        run: |
          $launcher = Get-Command py -ErrorAction SilentlyContinue
          if (-not $launcher) {
            throw "The self-hosted Windows runner must provide the Python launcher 'py' on PATH."
          }

          $python = (& py -3.14 -c "import sys; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $python) {
            throw "Python 3.14 is not available through 'py -3.14' on this self-hosted runner."
          }

          & $python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version; print(sys.version)"
          if ($LASTEXITCODE -ne 0) {
            throw "The selected host interpreter is not Python 3.14."
          }

          if (Test-Path -LiteralPath ".venv") {
            Remove-Item -LiteralPath ".venv" -Recurse -Force
          }

          & $python -m venv .venv
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create the isolated release virtual environment."
          }

          $venvRoot = (Resolve-Path -LiteralPath ".venv").Path
          $venvScripts = Join-Path $venvRoot "Scripts"
          $venvPython = Join-Path $venvScripts "python.exe"
          if (-not (Test-Path -LiteralPath $venvPython -PathType Leaf)) {
            throw "Release virtual environment did not produce .venv\\Scripts\\python.exe."
          }

          & $venvPython --version
          "VIRTUAL_ENV=$venvRoot" >> $env:GITHUB_ENV
          $venvScripts >> $env:GITHUB_PATH
          Write-Host "Using host Python 3.14 via isolated environment: $venvPython"

      - name: Resolve and verify immutable release identity
        id: release
        shell: powershell
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          DISPATCHED_REF: ${{ github.ref }}
        run: |
          if ($env:DISPATCHED_REF -ne "refs/heads/main") {
            throw "Release preparation must be dispatched from main. Selected ref: $env:DISPATCHED_REF"
          }

          $sourceSha = (git rev-parse HEAD).Trim()
          if ($sourceSha -ne $env:DISPATCHED_SHA) {
            throw "Checked out SHA $sourceSha does not match workflow-dispatch SHA $env:DISPATCHED_SHA."
          }

          git fetch --force --tags origin "refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to refresh origin/main and release tags."
          }

          $mainSha = (git rev-parse origin/main).Trim()
          if ($mainSha -ne $sourceSha) {
            throw "Release candidate $sourceSha is no longer the current origin/main HEAD ($mainSha). Run tooling-test for the new main HEAD before releasing."
          }

          $packageVersion = (python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version']); f.close()").Trim()
          $tag = "tool-v$packageVersion"
          $note = "releasenote/$packageVersion.md"

          git show-ref --verify --quiet "refs/tags/$tag"
          $tagLookupExit = $LASTEXITCODE
          if ($tagLookupExit -eq 0) {
            throw "Tag $tag already exists. Tagged release notes are immutable."
          }
          if ($tagLookupExit -ne 1) {
            throw "Unable to determine whether tag $tag already exists."
          }
          # Exit 1 means the release tag does not exist, which is the expected pre-release state.
          $global:LASTEXITCODE = 0

          if (-not (Test-Path -LiteralPath $note -PathType Leaf)) {
            throw "Missing reviewed Tool release note $note. Finalize and commit the release note before release preparation."
          }
          if ((Get-Item -LiteralPath $note).Length -eq 0) {
            throw "Tool release note is empty: $note"
          }
          if (-not (Select-String -LiteralPath $note -Pattern '^## ' -Quiet)) {
            throw "Tool release note contains no categorized Tool changes: $note"
          }

          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "note=$note" >> $env:GITHUB_OUTPUT
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Require exact self-hosted tooling verification
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $combined = Invoke-RestMethod `
            -Method Get `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/commits/$env:SOURCE_SHA/status" `
            -Headers $headers

          $status = $combined.statuses |
            Where-Object { $_.context -eq "self-hosted/tooling-test" } |
            Select-Object -First 1

          if (-not $status -or $status.state -ne "success") {
            throw "No successful self-hosted/tooling-test status exists for exact release-candidate SHA $env:SOURCE_SHA."
          }

          Write-Host "Exact self-hosted tooling verification confirmed for $env:SOURCE_SHA"

      - name: Install release verification tooling
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify required Specification release contract
        shell: powershell
        run: python .github/scripts/verify_release_contract.py

      - name: Verify Tool identity before release preparation
        shell: powershell
        run: |
          ptsip --version
          ptsip spec
          ptsip conform --help

      - name: Reconfirm candidate remains current main
        shell: powershell
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to refresh origin/main before draft release creation."
          }
          $mainSha = (git rev-parse origin/main).Trim()
          if ($mainSha -ne $env:SOURCE_SHA) {
            throw "origin/main moved to $mainSha after tooling verification. Re-run tooling-test for the new SHA."
          }

      - name: Create draft GitHub Release for exact verified SHA
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTE: ${{ steps.release.outputs.note }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $notePath = (Resolve-Path -LiteralPath $env:NOTE).Path
          $noteBody = [System.IO.File]::ReadAllText($notePath)
          $payload = @{
            tag_name = $env:TAG
            target_commitish = $env:SOURCE_SHA
            name = "PTSIP Tool $env:VERSION"
            body = $noteBody
            draft = $true
            prerelease = ($env:VERSION -match '[A-Za-z]')
          } | ConvertTo-Json -Depth 4

          $release = Invoke-RestMethod `
            -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $payload

          Write-Host "Draft release created for exact SHA $env:SOURCE_SHA"
          Write-Host "Release URL: $($release.html_url)"
