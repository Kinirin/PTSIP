name: prepare-tool-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tool version from pyproject.toml (for example 0.3.6)"
        required: true
        type: string
      source_sha:
        description: "Exact release-candidate SHA already verified by tooling-test.yml"
        required: true
        type: string
      host_ready:
        description: "Confirm DESKTOP-5HCCQIR is online and its PowerShell environment is ready"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  statuses: read

concurrency:
  group: prepare-tool-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify self-hosted authorization and runner identity
        shell: powershell
        env:
          HOST_READY: ${{ inputs.host_ready }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:HOST_READY -ne "true") {
            throw "Release preparation requires host_ready=true after the maintainer confirms the host and PowerShell environment are ready."
          }
          if ($env:RUNNER_NAME -ne "DESKTOP-5HCCQIR") {
            throw "Unexpected self-hosted runner '$env:RUNNER_NAME'. Expected DESKTOP-5HCCQIR."
          }
          if ($env:REQUESTED_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "source_sha must be a full 40-character lowercase Git commit SHA."
          }
          Write-Host "Using approved self-hosted runner: $env:RUNNER_NAME"

      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Resolve and verify immutable release identity
        id: release
        shell: powershell
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($sourceSha -ne $env:REQUESTED_SOURCE_SHA) {
            throw "Checked out SHA $sourceSha does not match requested release-candidate SHA $env:REQUESTED_SOURCE_SHA."
          }

          git fetch --force --tags origin "refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to refresh origin/main and release tags."
          }

          $mainSha = (git rev-parse origin/main).Trim()
          if ($mainSha -ne $sourceSha) {
            throw "Release candidate $sourceSha is no longer the current origin/main HEAD ($mainSha). Verify the new main HEAD before releasing."
          }

          $packageVersion = (python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version']); f.close()").Trim()
          if ($env:REQUESTED_VERSION -ne $packageVersion) {
            throw "Requested version $env:REQUESTED_VERSION does not match pyproject.toml version $packageVersion."
          }

          $tag = "tool-v$packageVersion"
          $note = "releasenote/$packageVersion.md"

          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists. Tagged release notes are immutable."
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Unable to determine whether tag $tag already exists."
          }

          if (-not (Test-Path -LiteralPath $note -PathType Leaf)) {
            throw "Missing reviewed Tool release note $note. Finalize and commit the release note before release-candidate verification."
          }
          if ((Get-Item -LiteralPath $note).Length -eq 0) {
            throw "Tool release note is empty: $note"
          }
          if (-not (Select-String -LiteralPath $note -Pattern '^## ' -Quiet)) {
            throw "Tool release note contains no categorized Tool changes: $note"
          }

          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "note=$note" >> $env:GITHUB_OUTPUT
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Require exact self-hosted release verification
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $combined = Invoke-RestMethod `
            -Method Get `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/commits/$env:SOURCE_SHA/status" `
            -Headers $headers

          $status = $combined.statuses |
            Where-Object { $_.context -eq "self-hosted/release-verification" } |
            Select-Object -First 1

          if (-not $status -or $status.state -ne "success") {
            throw "No successful self-hosted/release-verification status exists for exact release-candidate SHA $env:SOURCE_SHA."
          }

          Write-Host "Exact self-hosted verification confirmed for $env:SOURCE_SHA"

      - name: Install release verification tooling
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify required Specification release contract
        shell: powershell
        run: python .github/scripts/verify_release_contract.py

      - name: Verify Tool identity before release preparation
        shell: powershell
        run: |
          ptsip --version
          ptsip spec
          ptsip conform --help

      - name: Reconfirm candidate remains current main
        shell: powershell
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to refresh origin/main before draft release creation."
          }
          $mainSha = (git rev-parse origin/main).Trim()
          if ($mainSha -ne $env:SOURCE_SHA) {
            throw "origin/main moved to $mainSha after release verification. Re-run release-candidate verification for the new SHA."
          }

      - name: Create draft GitHub Release for exact verified SHA
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTE: ${{ steps.release.outputs.note }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $notePath = (Resolve-Path -LiteralPath $env:NOTE).Path
          $noteBody = [System.IO.File]::ReadAllText($notePath)
          $payload = @{
            tag_name = $env:TAG
            target_commitish = $env:SOURCE_SHA
            name = "PTSIP Tool $env:VERSION"
            body = $noteBody
            draft = $true
            prerelease = ($env:VERSION -match '[A-Za-z]')
          } | ConvertTo-Json -Depth 4

          $release = Invoke-RestMethod `
            -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $payload

          Write-Host "Draft release created for exact SHA $env:SOURCE_SHA"
          Write-Host "Release URL: $($release.html_url)"
