name: prepare-tool-release

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: read

concurrency:
  group: prepare-tool-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact dispatched main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go Developer automation
        uses: actions/setup-go@v6
        with:
          go-version-file: developer/automation/go.mod
          cache-dependency-path: developer/automation/go.sum

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Resolve and verify immutable release identity
        id: release
        shell: pwsh
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          DISPATCHED_REF: ${{ github.ref }}
        run: |
          $result = (& go -C developer/automation run ./cmd/ptsip-dev release prepare --dispatched-sha "$env:DISPATCHED_SHA" --dispatched-ref "$env:DISPATCHED_REF" | Out-String | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            throw "Native release preparation failed."
          }
          "version=$($result.version)" >> $env:GITHUB_OUTPUT
          "tag=$($result.tag)" >> $env:GITHUB_OUTPUT
          "note=$($result.note)" >> $env:GITHUB_OUTPUT
          "source_sha=$($result.source_sha)" >> $env:GITHUB_OUTPUT

      - name: Require exact CI tooling verification
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          go -C developer/automation run ./cmd/ptsip-dev release gate --source-sha "$env:SOURCE_SHA" --github-repository "$env:GITHUB_REPOSITORY" --github-api-url "$env:GITHUB_API_URL"
          if ($LASTEXITCODE -ne 0) {
            throw "Native release gate verification failed."
          }

      - name: Install release verification tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify exact-SHA Project Profile release snapshot
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: go -C developer/automation run -tags grammar_subset,grammar_subset_python ./cmd/ptsip-dev pp release --sha $env:SOURCE_SHA

      - name: Verify required Specification release contract
        shell: pwsh
        run: python .github/scripts/verify_release_contract.py

      - name: Verify Tool identity before release preparation
        shell: pwsh
        run: |
          ptsip --version
          ptsip spec
          ptsip conform --help

      - name: Reconfirm candidate remains current main
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          go -C developer/automation run ./cmd/ptsip-dev release reconfirm --source-sha "$env:SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) {
            throw "Native release main-head reconfirmation failed."
          }

      - name: Create draft GitHub Release for exact verified SHA
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTE: ${{ steps.release.outputs.note }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          go -C developer/automation run ./cmd/ptsip-dev release draft --source-sha "$env:SOURCE_SHA" --version "$env:VERSION" --tag "$env:TAG" --note "$env:NOTE" --github-repository "$env:GITHUB_REPOSITORY" --github-api-url "$env:GITHUB_API_URL"
          if ($LASTEXITCODE -ne 0) {
            throw "Native draft release creation failed."
          }
