name: readme-translation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - src/VERSION
      - .ptsip/contracts/release/releasenote.json
      - .ptsip/contracts/release/versions_different.json
      - .ptsip/contracts/schemas/release/versions_different.schema.json
      - .ptsip/contracts/schemas/release/releasenote/**
      - .ptsip/engine/developer/Distribution/release/verification/releasenote/**
      - .ptsip/engine/developer/Distribution/release/version/**
      - .github/workflows/readme-translation.yml
      - .ptsip/engine/developer/Distribution/release/test/releasenote/**
      - .github/workflows/readme-verification.yml
      - docs/translated/index.yaml
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact baseline SHA for declared version change notes; blank validates the current README only
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: readme-translation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-localized-readmes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go translation controller
        uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
          cache-dependency-path: .ptsip/engine/developer/Distribution/release/test/go.sum

      - name: Verify README translation controller independently
        shell: pwsh
        run: |
          go -C .ptsip/engine/developer/Distribution/release/test test ./releasenote
          if ($LASTEXITCODE -ne 0) { throw 'Independent Go README translation regression failed.' }

      - name: Build registered-language translator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts | Out-Null
          go -C .ptsip/engine/developer/Distribution/release/test build -o ../../../../../../.artifacts/readme-translate ./releasenote
          if ($LASTEXITCODE -ne 0) { throw 'Go README translator build failed.' }
          & ./.artifacts/readme-translate --root . --action list-targets
          if ($LASTEXITCODE -ne 0) { throw 'README translation registry validation failed.' }

      - name: Generate classified English notes and current README from declared version changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || inputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or $env:BASE_SHA -match '^0{40}$') {
            $report = & ./.artifacts/readme-translate --root . --action documentation-check
          } else {
            $report = & ./.artifacts/readme-translate --root . --action documentation-generate --base $env:BASE_SHA --head $env:HEAD_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'English documentation contract or version-change generation failed.' }
          $report | Set-Content -LiteralPath .artifacts/documentation-generation.json -Encoding utf8

      # Argos itself is a third-party CLI backed by Python. No PTSIP Python
      # translation script executes; the Go controller owns all document logic.
      - name: Install offline Argos command-line engine
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Prepare Argos models from registry
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'argostranslate==1.11.0'
          if ($LASTEXITCODE -ne 0) { throw 'Argos CLI installation failed.' }
          $modelRoot = Join-Path $HOME '.ptsip/readme-translation/argos-packages'
          New-Item -ItemType Directory -Force $modelRoot | Out-Null
          "ARGOS_PACKAGES_DIR=$modelRoot" >> $env:GITHUB_ENV
          $env:ARGOS_PACKAGES_DIR = $modelRoot
          $env:ARGOS_DEVICE_TYPE = 'cpu'
          $env:ARGOS_CHUNK_TYPE = 'MINISBD'
          "ARGOS_DEVICE_TYPE=cpu" >> $env:GITHUB_ENV
          "ARGOS_CHUNK_TYPE=MINISBD" >> $env:GITHUB_ENV
          & ./.artifacts/readme-translate --root . --action models
          if ($LASTEXITCODE -ne 0) { throw 'Argos model preparation failed.' }

      - name: Apply registered translations and strictly verify generated source hashes
        shell: pwsh
        run: |
          & ./.artifacts/readme-translate --root . --action apply
          if ($LASTEXITCODE -ne 0) { throw 'README synchronization failed.' }
          & ./.artifacts/readme-translate --root . --action verify-strict
          if ($LASTEXITCODE -ne 0) { throw 'README translation validation failed.' }

      - name: Commit generated English records and registered current translation targets
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Translation whitespace validation failed.' }

          $targets = @(& ./.artifacts/readme-translate --root . --action list-targets)
          if ($LASTEXITCODE -ne 0) {
            throw 'Registered translation target validation failed.'
          }
          $documentation = Get-Content -LiteralPath .artifacts/documentation-generation.json -Raw | ConvertFrom-Json
          $englishOutputs = @($documentation.output_paths) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          foreach ($path in $englishOutputs) {
            if ($path -ne 'README.md' -and (-not $path.StartsWith('docs/releasenote/') -or $path.Contains('\') -or $path.Split('/') -contains '..')) {
              throw "Unexpected generated English output: $path"
            }
          }
          foreach ($target in @($targets + $englishOutputs | Sort-Object -Unique)) {
            git add -- $target
            if ($LASTEXITCODE -ne 0) { throw "Failed to stage $target" }
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'English documentation and registered current translations are already synchronized.'
            exit 0
          }
          git fetch origin $env:TARGET_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh current source branch.' }
          $localSha = (git rev-parse HEAD).Trim()
          $remoteSha = (git rev-parse "origin/$env:TARGET_BRANCH").Trim()
          if ($localSha -ne $remoteSha) {
            throw "Source branch advanced during translation ($localSha -> $remoteSha); rerun without overwriting."
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: generate English version records and synchronize current translations'
          if ($LASTEXITCODE -ne 0) { throw 'README translation commit failed.' }
          git push origin "HEAD:$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'README translation push failed.' }
