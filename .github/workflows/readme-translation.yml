name: readme-translation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/readme-translation.yml
      - .github/scripts/sync_readme_argos.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-translation-main
  cancel-in-progress: true

jobs:
  sync-localized-readmes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Prepare Argos runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Failed to upgrade pip for Argos runtime." }
          python -m pip install --upgrade "argostranslate==1.11.0"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install argostranslate==1.11.0." }

          python -c "import argostranslate, importlib.metadata; print('Argos Translate ' + importlib.metadata.version('argostranslate'))"
          if ($LASTEXITCODE -ne 0) { throw "Argos runtime verification failed." }

          $runtimeRoot = Join-Path $HOME ".ptsip/readme-translation"
          $modelRoot = Join-Path $runtimeRoot "argos-packages"
          New-Item -ItemType Directory -Force -Path $modelRoot | Out-Null

          "ARGOS_PACKAGES_DIR=$modelRoot" >> $env:GITHUB_ENV
          "ARGOS_DEVICE_TYPE=cpu" >> $env:GITHUB_ENV
          "ARGOS_CHUNK_TYPE=MINISBD" >> $env:GITHUB_ENV
          "TRANSLATION_PYTHON=python" >> $env:GITHUB_ENV

      - name: Generate localized README files
        shell: pwsh
        run: |
          & $env:TRANSLATION_PYTHON .github/scripts/sync_readme_argos.py --source README.md --target "ko:README.ko.md"
          if ($LASTEXITCODE -ne 0) {
            throw "README translation or validation failed."
          }

      - name: Commit synchronized translations
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Generated translation contains whitespace errors."
          }

          git add README.ko.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Localized README files are already synchronized."
            exit 0
          }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to refresh origin/main before committing translation."
          }

          $localSha = (git rev-parse HEAD).Trim()
          $remoteSha = (git rev-parse origin/main).Trim()
          if ($localSha -ne $remoteSha) {
            throw "main moved from $localSha to $remoteSha while translation was running; rerun against the new main instead of overwriting newer work."
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync localized README via Argos"
          git push origin HEAD:main
