name: readme-translation

on:
  push:
    branches: [main]
    paths:
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: readme-translation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-korean-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate Korean README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ vars.README_TRANSLATION_MODEL || 'openai/gpt-4o' }}
        run: python tools/ai_interface_tool/readme_translation/sync_readme_ko.py

      - name: Commit synchronized translation
        shell: bash
        run: |
          if git diff --quiet -- README.ko.md; then
            echo "README.ko.md is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.ko.md
          git commit -m "docs: sync Korean README"
          git push
