# retry-after-policy-resolver-fix
name: planning-reset-verify-20260926

on:
  push:
    branches: ["dev/0.3.8"]
    paths:
      - ".github/workflows/planning-reset-verify-20260926.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify empty planning state
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m developer.automation.policy_validator
          python -m developer.automation.planning.planning_validator
          python -m pytest -q developer/tests/test_policy_resolver.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          from developer.automation.planning.planning_entry_resolver import (
              PlanningEntryResolutionError,
              resolve_planning_entry,
          )

          root = Path(".").resolve()
          payload = yaml.safe_load((root / "developer/planning/index.yaml").read_text(encoding="utf-8"))
          assert payload["plans"] == [], payload

          try:
              resolve_planning_entry("dev/0.3.8", root=root)
          except PlanningEntryResolutionError as exc:
              assert exc.code == "UNKNOWN_PLANNING_ENTRY", exc.code
          else:
              raise AssertionError("dev/0.3.8 unexpectedly resolved a historical planning entry")

          forbidden_roots = [
              root / "developer/planning/0.3.8a1",
              root / "developer/planning/0.4.0",
          ]
          assert all(not path.exists() for path in forbidden_roots), forbidden_roots
          print("EMPTY_PLANNING_STATE: PASS")
          PY

      - name: Retire this one-shot verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/planning-reset-verify-20260926.yml
          git commit -m "ci: retire planning reset verification"
          git push origin HEAD:dev/0.3.8
