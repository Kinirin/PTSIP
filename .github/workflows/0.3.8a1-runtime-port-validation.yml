name: 0.3.8a1-runtime-port-validation

on:
  push:
    branches:
      - release/0.3.8a1-port
    paths:
      - .github/workflows/0.3.8a1-runtime-port-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare Python 3.14
        shell: powershell
        run: |
          $python = (& py -3.14 -c "import sys; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $python) { throw "Python 3.14 unavailable" }
          if (Test-Path .venv) { Remove-Item .venv -Recurse -Force }
          & $python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path .venv\Scripts).Path >> $env:GITHUB_PATH
      - name: Install tooling
        shell: powershell
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Print responsibility-map gaps
        shell: powershell
        run: |
          @'
          import json
          from ptsip.validation.profile import validate_profile
          result = validate_profile(".")
          details = result.details or {}
          coverage = details.get("responsibility_map_coverage", {})
          print("UNASSIGNED_FILES=" + json.dumps(coverage.get("unassigned_files", []), ensure_ascii=False))
          print("UNASSIGNED_COUNT=" + str(coverage.get("unassigned_count")))
          print("VALID=" + str(result.valid))
          print("ERRORS=" + json.dumps(result.errors, ensure_ascii=False))
          print("WARNINGS=" + json.dumps(result.warnings, ensure_ascii=False))
          '@ | python -
      - name: Run 0.3.8a1 focused feature tests
        shell: powershell
        run: |
          python -m pytest -q tests/ptsip/test_proposed_component.py tests/ptsip/control_plane/test_github_authority.py tests/ptsip/identity/test_tool_identity.py tests/ptsip/identity/test_spec_identity_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Runtime identity
        shell: powershell
        run: |
          ptsip --version
          ptsip spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and check distributions
        shell: powershell
        run: |
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $distFiles = Get-ChildItem -Path dist -File | ForEach-Object { $_.FullName }
          if (-not $distFiles) { throw "No distributions produced" }
          python -m twine check $distFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify built version
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import email
          import zipfile
          import tomllib
          expected = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              meta_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(meta_name))
              license_names = sorted(name for name in archive.namelist() if ".dist-info/licenses/" in name)
          assert metadata["Version"] == expected, (metadata["Version"], expected)
          print(f"VERIFIED_WHEEL_VERSION={expected}")
          print("WHEEL_LICENSE_FILES=" + ",".join(license_names))
          '@ | python -
