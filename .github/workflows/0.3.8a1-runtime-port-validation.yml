name: 0.3.8a1-runtime-port-validation

on:
  push:
    branches:
      - release/0.3.8a1-port
    paths:
      - .github/workflows/0.3.8a1-runtime-port-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare Python 3.14
        shell: powershell
        run: |
          $python = (& py -3.14 -c "import sys; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $python) { throw "Python 3.14 unavailable" }
          if (Test-Path .venv) { Remove-Item .venv -Recurse -Force }
          & $python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path .venv\Scripts).Path >> $env:GITHUB_PATH
      - name: Install tooling
        shell: powershell
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require clean repository profile
        shell: powershell
        run: |
          @'
          from ptsip.validation.profile import validate_profile
          result = validate_profile(".")
          assert result.valid, result.errors
          assert result.errors == [], result.errors
          assert result.warnings == [], result.warnings
          coverage = (result.details or {}).get("responsibility_map_coverage", {})
          assert coverage.get("unassigned_count") == 0, coverage
          print("PROFILE_COVERAGE=PASS")
          '@ | python -
      - name: Run regression except known Specification-revision blocker
        shell: powershell
        run: |
          python -m pytest -q --deselect tests/ptsip/test_release_readiness_030.py::test_release_contract_accepts_current_exact_bound_assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Runtime identity
        shell: powershell
        run: |
          ptsip --version
          ptsip spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and check distributions
        shell: powershell
        run: |
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $distFiles = Get-ChildItem -Path dist -File | ForEach-Object { $_.FullName }
          if (-not $distFiles) { throw "No distributions produced" }
          python -m twine check $distFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify built version and license set
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import email
          import zipfile
          import tomllib
          expected = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_licenses = {
              "LICENSE", "NOTICE", "LICENSE-GUIDE.md", "LICENSE-HISTORY.md", "COMMERCIAL-USE.md"
          }
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              meta_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(meta_name))
              license_names = {
                  name.rsplit("/", 1)[-1] for name in names if ".dist-info/licenses/" in name
              }
          assert metadata["Version"] == expected, (metadata["Version"], expected)
          assert license_names == expected_licenses, (license_names, expected_licenses)
          print(f"VERIFIED_WHEEL_VERSION={expected}")
          print("VERIFIED_LICENSE_SET=" + ",".join(sorted(license_names)))
          '@ | python -
