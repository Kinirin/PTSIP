name: tooling-release
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Components: package, tool, profiles, engine:context or comma-separated selections'
        type: string
        default: package
      optional_platforms:
        description: 'Optional macOS verification artifacts (leave empty for Windows and Linux)'
        type: string
        default: ''
      destination:
        description: Publication destination
        type: choice
        default: github-pypi
        options: [github, github-pypi]
permissions:
  contents: read
concurrency:
  group: ptsip-component-publication
  cancel-in-progress: false
jobs:
  release-admission:
    runs-on: ubuntu-latest
    outputs:
      publication_matrix: ${{ steps.preflight.outputs.publication_matrix }}
      pypi_count: ${{ steps.preflight.outputs.pypi_count }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGETS: ${{ inputs.targets }}
      OPTIONAL: ${{ inputs.optional_platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/controller/go.mod
          cache: true
          cache-dependency-path: .github/checks/release/controller/go.sum
      - name: Resolve original verification and prepare admitted publication
        shell: bash
        run: |
          set -euo pipefail
          go -C .github/checks/release/controller run ./cmd/ptsip-release prepare-publication --root "$GITHUB_WORKSPACE" --targets "$TARGETS" --optional-platforms "$OPTIONAL" --output .artifacts/release/shipping
      - name: Consume immutable PyPI file identities before publication
        id: preflight
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release pypi-stage --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
      - uses: actions/upload-artifact@v7
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
          if-no-files-found: error
  github-publication:
    needs: release-admission
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/controller/go.mod
          cache: true
          cache-dependency-path: .github/checks/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Publish one verified source-SHA Release
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release publish-carrier --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
  pypi-publication:
    needs: [release-admission, github-publication]
    if: ${{ inputs.destination == 'github-pypi' && needs.release-admission.outputs.pypi_count != '0' }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-admission.outputs.publication_matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Upload the admitted original wheel set
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: .artifacts/release/shipping/pypi/${{ matrix.component }}
  package-record:
    needs: [release-admission, github-publication, pypi-publication]
    if: ${{ always() && needs.github-publication.result == 'success' && (inputs.destination == 'github' || needs.release-admission.outputs.pypi_count == '0' || needs.pypi-publication.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/controller/go.mod
          cache: true
          cache-dependency-path: .github/checks/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Confirm public PyPI digests
        if: ${{ inputs.destination == 'github-pypi' }}
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release pypi-verify --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
      - name: Record the published Package composition and separate Package note
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release record-package --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
