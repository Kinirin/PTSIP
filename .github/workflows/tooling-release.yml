name: tooling-release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: tooling-release-${{ github.event_name }}-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      statuses: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact dispatched main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go Developer automation
        uses: actions/setup-go@v6
        with:
          go-version-file: developer/automation/go.mod
          cache-dependency-path: developer/automation/go.sum

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Resolve and verify immutable release identity
        id: release
        shell: pwsh
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          DISPATCHED_REF: ${{ github.ref }}
        run: |
          $result = (& go -C developer/automation run ./cmd/ptsip-dev release prepare --dispatched-sha "$env:DISPATCHED_SHA" --dispatched-ref "$env:DISPATCHED_REF" | Out-String | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            throw "Native release preparation failed."
          }
          "version=$($result.version)" >> $env:GITHUB_OUTPUT
          "tag=$($result.tag)" >> $env:GITHUB_OUTPUT
          "note=$($result.note)" >> $env:GITHUB_OUTPUT
          "source_sha=$($result.source_sha)" >> $env:GITHUB_OUTPUT

      - name: Require exact CI tooling verification
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          go -C developer/automation run ./cmd/ptsip-dev release gate --source-sha "$env:SOURCE_SHA" --github-repository "$env:GITHUB_REPOSITORY" --github-api-url "$env:GITHUB_API_URL"
          if ($LASTEXITCODE -ne 0) {
            throw "Native release gate verification failed."
          }

      - name: Install release verification tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify exact-SHA Project Profile release snapshot
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: go -C developer/automation run -tags grammar_subset,grammar_subset_python ./cmd/ptsip-dev pp release --sha $env:SOURCE_SHA

      - name: Verify required Specification release contract
        shell: pwsh
        run: python .github/scripts/verify_release_contract.py

      - name: Verify Tool identity before release preparation
        shell: pwsh
        run: |
          ptsip --version
          ptsip spec
          ptsip conform --help

      - name: Reconfirm candidate remains current main
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          go -C developer/automation run ./cmd/ptsip-dev release reconfirm --source-sha "$env:SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) {
            throw "Native release main-head reconfirmation failed."
          }

      - name: Create draft GitHub Release for exact verified SHA
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTE: ${{ steps.release.outputs.note }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          go -C developer/automation run ./cmd/ptsip-dev release draft --source-sha "$env:SOURCE_SHA" --version "$env:VERSION" --tag "$env:TAG" --note "$env:NOTE" --github-repository "$env:GITHUB_REPOSITORY" --github-api-url "$env:GITHUB_API_URL"
          if ($LASTEXITCODE -ne 0) {
            throw "Native draft release creation failed."
          }
build:
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'tool-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published Tool tag with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install distribution tooling
        shell: pwsh
        run: python -m pip install --upgrade pip build twine "PyYAML>=6.0,<7" "jsonschema>=4.23,<5"

      - name: Set up Go Developer automation
        uses: actions/setup-go@v6
        with:
          go-version-file: developer/automation/go.mod
          cache-dependency-path: developer/automation/go.sum

      - name: Verify release tag matches package version and Specification contract
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PYTHONPATH: ".:src"
        run: |
          go -C developer/automation run ./cmd/ptsip-dev release tag-verify --release-tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Native release tag verification failed."
          }
          python .github/scripts/verify_release_contract.py
          python -m ptsip context check . --json
          if ($LASTEXITCODE -ne 0) {
            throw "Published source Context Plane is not release-ready."
          }
          go -C developer/automation run -tags grammar_subset,grammar_subset_python ./cmd/ptsip-dev pp release --sha HEAD

      - name: Build distributions
        shell: pwsh
        run: go -C developer/automation run ./cmd/ptsip-dev release build

      - name: Verify publication Product Artifact evidence and exact snapshot binding
        shell: pwsh
        env:
          REPOSITORY_ID: ${{ github.repository }}
        run: |
          $verifiedSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $verifiedSha) {
            throw "Unable to resolve the exact published-tag source SHA."
          }

          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel) {
            throw "No wheel was produced under dist/."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($wheel.FullName)
          try {
            $wheelPaths = @(
              $archive.Entries |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_.Name) } |
                ForEach-Object { $_.FullName } |
                Sort-Object -Unique
            )

            $metadataEntry = $archive.Entries |
              Where-Object { $_.FullName -match '^[^/]+\.dist-info/METADATA$' } |
              Select-Object -First 1
            if (-not $metadataEntry) {
              throw "Built wheel has no .dist-info/METADATA entry."
            }
            $metadataReader = New-Object System.IO.StreamReader($metadataEntry.Open())
            try {
              $metadataText = $metadataReader.ReadToEnd()
            }
            finally {
              $metadataReader.Dispose()
            }

            $entryPointsEntry = $archive.Entries |
              Where-Object { $_.FullName -match '^[^/]+\.dist-info/entry_points\.txt$' } |
              Select-Object -First 1
            if (-not $entryPointsEntry) {
              throw "Built wheel has no .dist-info/entry_points.txt entry."
            }
            $entryPointsReader = New-Object System.IO.StreamReader($entryPointsEntry.Open())
            try {
              $entryPointsText = $entryPointsReader.ReadToEnd()
            }
            finally {
              $entryPointsReader.Dispose()
            }
          }
          finally {
            $archive.Dispose()
          }

          if (-not $wheelPaths) {
            throw "Built wheel contains no file entries."
          }
          if ($metadataText -notmatch '(?m)^Name:\s*PTSIP\s*$') {
            throw "Built wheel metadata does not report Name: PTSIP."
          }
          $expectedWheelVersion = (python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version']); f.close()").Trim()
          $escapedWheelVersion = [regex]::Escape($expectedWheelVersion)
          if ($metadataText -notmatch "(?m)^Version:\s*$escapedWheelVersion\s*$") {
            throw "Built wheel metadata does not report Version: $expectedWheelVersion."
          }
          if ($entryPointsText -notmatch '(?m)^ptsip\s*=\s*ptsip\.cli:main\s*$') {
            throw "Built wheel does not expose the ptsip console entry point."
          }
          if ($entryPointsText -notmatch '(?m)^ptsip-app\s*=\s*ptsip\.app\.server:main\s*$') {
            throw "Built wheel does not expose the ptsip-app console entry point."
          }

          $sourcePaths = @()
          $components = @()
          $sawDistributionMetadata = $false
          $sawAgentContractsPackage = $false
          $declaredLicenseFiles = @(
            & python -c "import tomllib; f=open('pyproject.toml','rb'); p=tomllib.load(f)['project']; print(*p.get('license-files', []), sep='\n'); f.close()"
          )
          if ($LASTEXITCODE -ne 0 -or $declaredLicenseFiles.Count -eq 0) {
            throw "Unable to resolve declared distribution license files from pyproject.toml."
          }
          $seenLicenseFiles = @()

          foreach ($path in $wheelPaths) {
            if ($path -like 'ptsip/support/policy/*') {
              $relativeSupportPath = $path.Substring('ptsip/support/policy/'.Length)
              $sourcePaths += "src/policy/$relativeSupportPath"
              $components += 'ptsip-embedded-contracts'
              continue
            }
            if ($path -like 'ptsip/support/schemas/*') {
              $relativeSupportPath = $path.Substring('ptsip/support/schemas/'.Length)
              $sourcePaths += "src/policy/schemas/$relativeSupportPath"
              $components += 'ptsip-embedded-contracts'
              continue
            }
            if ($path -like 'ptsip/support/registries/*') {
              $relativeSupportPath = $path.Substring('ptsip/support/registries/'.Length)
              $sourcePaths += "src/policy/registries/$relativeSupportPath"
              $components += 'ptsip-embedded-contracts'
              continue
            }
            if ($path -like 'ptsip/specdata/*') {
              $sourcePaths += "src/$path"
              $components += 'ptsip-embedded-contracts'
              continue
            }
            if ($path -like 'ptsip/profiles/*') {
              $relativeProfilePath = $path.Substring('ptsip/profiles/'.Length)
              $sourcePaths += "profiles/$relativeProfilePath"
              $components += 'ptsip-public-profiles'
              continue
            }
            if ($path -like 'ptsip/evidence/*') {
              $sourcePaths += "src/$path"
              $components += 'ptsip-evidence'
              continue
            }
            if ($path -like 'ptsip/source_compat/*') {
              $sourcePaths += "src/$path"
              $components += 'ptsip-source-compat'
              continue
            }
            if ($path -like 'ptsip/migration/*') {
              $sourcePaths += "src/$path"
              $components += 'ptsip-migration'
              continue
            }
            if ($path -like 'ptsip/*') {
              $sourcePaths += "src/$path"
              $components += 'ptsip-core'
              continue
            }
            if ($path -like 'agent_contracts/*') {
              $sourcePaths += "src/$path"
              $components += 'ptsip-embedded-contracts'
              $sawAgentContractsPackage = $true
              continue
            }
            if ($path -like 'vpms/*') {
              $sourcePaths += "src/$path"
              $components += 'vpms'
              continue
            }
            if ($path -like '*.dist-info/licenses/*') {
              $marker = '.dist-info/licenses/'
              $markerIndex = $path.IndexOf($marker)
              if ($markerIndex -lt 0) {
                throw "Unable to resolve packaged license projection path: $path"
              }

              $licenseRelativePath = $path.Substring($markerIndex + $marker.Length)
              if ($declaredLicenseFiles -notcontains $licenseRelativePath) {
                throw "Packaged license file is not declared by pyproject.toml: $path"
              }

              $sourcePaths += $licenseRelativePath
              $seenLicenseFiles += $licenseRelativePath
              $components += 'repository-license-authority'
              $components += 'ptsip-distribution'
              $sawDistributionMetadata = $true
              continue
            }
            if ($path -match '^[^/]+\.dist-info/') {
              $components += 'ptsip-distribution'
              $sawDistributionMetadata = $true
              continue
            }
            throw "Unrecognized wheel content outside the declared Product package boundary: $path"
          }

          $sourcePaths = @($sourcePaths | Sort-Object -Unique)
          $components = @($components | Sort-Object -Unique)

          if ($components -notcontains 'ptsip-core') {
            throw "Built wheel does not contain the ptsip-core Product implementation."
          }
          if ($components -notcontains 'ptsip-evidence') {
            throw "Built wheel does not contain the ptsip-evidence Product component."
          }
          if ($components -notcontains 'ptsip-source-compat') {
            throw "Built wheel does not contain the ptsip-source-compat Product component."
          }
          if ($components -notcontains 'ptsip-migration') {
            throw "Built wheel does not contain the ptsip-migration Product component."
          }
          if ($components -notcontains 'vpms') {
            throw "Built wheel does not contain the vpms Product package."
          }
          if ($components -notcontains 'ptsip-embedded-contracts') {
            throw "Built wheel does not contain embedded PTSIP contract assets."
          }
          if (-not $sawAgentContractsPackage) {
            throw "Built wheel does not contain the canonical agent_contracts package."
          }
          if (-not $sawDistributionMetadata) {
            throw "Built wheel does not contain distribution metadata."
          }
          $missingDeclaredLicenseFiles = @(
            $declaredLicenseFiles |
              Where-Object { $seenLicenseFiles -notcontains $_ }
          )
          if ($missingDeclaredLicenseFiles.Count -ne 0) {
            throw "Built wheel is missing declared license projections: $($missingDeclaredLicenseFiles -join ', ')"
          }

          python -m pip install --force-reinstall --no-deps "$($wheel.FullName)"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to install the actual publication wheel for artifact-aware verification."
          }
          python -c "from pathlib import Path; import ptsip; p=Path(ptsip.__file__).resolve().parent/'support'/'policy'/'index.yaml'; assert p.is_file(), p"
          if ($LASTEXITCODE -ne 0) {
            throw "Installed publication wheel is missing the ptsip/support projection."
          }
          python -c "import ptsip.context_plane as cp; assert callable(cp.context_status); assert callable(cp.check_context)"
          if ($LASTEXITCODE -ne 0) {
            throw "Installed publication wheel is missing the Consumer Context Plane implementation."
          }
          ptsip context --help
          if ($LASTEXITCODE -ne 0) {
            throw "Installed publication wheel does not expose the ptsip context command surface."
          }
          ptsip context check . --json
          if ($LASTEXITCODE -ne 0) {
            throw "Installed publication wheel cannot validate the repository Context Plane."
          }

          # Tool 0.3.8a3 is a bounded namespace-stabilization prerelease.
          # Keep package-content, metadata, license, installation, registry-projection,
          # and twine verification, but do not promote its known continuing 0.3.8
          # repository-conformance work into a publication blocker.
          if ($expectedWheelVersion -eq '0.3.8a3') {
            Write-Host "PTSIP 0.3.8a3 bounded publication gate: wheel content and install verification passed."
            Write-Host "Full Product Artifact repository conformance remains outside this prerelease claim."
            exit 0
          }

          $wheelHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel.FullName).Hash.ToLowerInvariant()
          $trackedFingerprint = (& python -c "from ptsip.repository.snapshot import capture_snapshot; print(capture_snapshot('.').tracked_content_fingerprint)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $trackedFingerprint) {
            throw "Unable to capture the exact tracked-content fingerprint for publication artifact binding."
          }

          $evidencePath = Join-Path $env:RUNNER_TEMP 'release-wheel-artifact-evidence.json'
          $bindingPath = "$evidencePath.binding.json"
          $evidence = [ordered]@{
            format = 'ptsip-artifact-evidence/v1'
            artifact_id = "ptsip-wheel-$($wheelHash.Substring(0, 16))"
            classification = 'PRODUCT'
            producer_component = 'repository-release-automation'
            artifact_type = 'python-wheel'
            shipping_scope = 'product-distribution'
            contents = [ordered]@{
              paths = $sourcePaths
              components = $components
              complete = $true
            }
            derivation = @(
              [ordered]@{
                relation = 'BUILDS'
                source = 'repository-release-automation'
              }
            )
            provenance = 'OBSERVED'
            evidence_ids = @("wheel-sha256:$wheelHash")
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $evidencePath -Encoding UTF8

          $evidenceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $evidencePath).Hash.ToLowerInvariant()
          $binding = [ordered]@{
            format = 'ptsip-artifact-evidence-binding/v1'
            artifact_sha256 = $evidenceHash
            subject = [ordered]@{
              repository = $env:REPOSITORY_ID
              revision = $verifiedSha
              tracked_content_sha256 = $trackedFingerprint
            }
          }
          $binding | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $bindingPath -Encoding UTF8

          $conformOutput = & ptsip conform . --artifact-evidence $evidencePath --json
          $conformExit = $LASTEXITCODE
          if ($conformExit -notin @(0, 6)) {
            throw "Publication artifact-aware conformance failed with unexpected exit code $conformExit."
          }

          $report = (($conformOutput -join "`n") | ConvertFrom-Json)
          if ($report.evaluators.product_artifact_boundary.status -ne 'RAN') {
            throw "Product Artifact boundary evaluator did not run for the publication wheel."
          }
          if ($report.evaluators.artifact_snapshot_binding.status -ne 'RAN') {
            throw "Artifact snapshot binding evaluator did not run successfully for the publication wheel."
          }

          $artifactDocuments = @($report.artifacts.documents)
          if ($artifactDocuments.Count -ne 1 -or $artifactDocuments[0].binding_valid -ne $true) {
            throw "Publication artifact evidence was not imported with a valid exact-snapshot binding."
          }

          $artifactGaps = @(
            $report.coverage.blocking_gaps |
              Where-Object { $_.id -like 'artifact-evidence:*' }
          )
          if ($artifactGaps.Count -ne 0) {
            throw "Publication conformance retained blocking artifact-evidence gaps: $($artifactGaps.id -join ', ')"
          }

          $packageViolations = @(
            $report.diagnostics |
              Where-Object { $_.rule_id -eq 'PTSIP-PKG-001' -and $_.outcome_effect -eq 'NON_CONFORMANT' }
          )
          if ($packageViolations.Count -ne 0) {
            throw "Publication Product Artifact violates PTSIP-PKG-001."
          }

          Write-Host "Publication Product Artifact evidence passed for wheel SHA-256 $wheelHash"
          Write-Host "Publication artifact-aware conformance outcome: $($report.outcome)"
          exit 0

      - name: Verify wheel and sdist registry projections
        shell: pwsh
        run: python .github/scripts/verify_distribution_contracts.py

      - name: Verify distribution metadata
        shell: pwsh
        run: go -C developer/automation run ./cmd/ptsip-dev release metadata-check

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'tool-v') }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      # pypa/gh-action-pypi-publish is Docker-based and requires GNU/Linux.
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
