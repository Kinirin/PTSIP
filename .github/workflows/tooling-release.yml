# Design-only verification entry. Publication remains disabled by explicit policy.
name: tooling-release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Requested release selection (verification design only)'
        type: choice
        default: PTSIP_PACKAGE
        options: [PTSIP_PACKAGE, TOOL_ONLY, ENGINE_ONLY, PROFILES_ONLY, TOOL_ENGINES, TOOL_PROFILES, ENGINES_PROFILES, MULTIPLE_ENGINES]
      components:
        description: 'Selected component names (not published)'
        type: string
        default: ''
      optional_platforms:
        description: 'Optional platform selection (not executed)'
        type: string
        default: ''
      destination:
        description: 'Intended publisher (not contacted)'
        type: choice
        default: github-pypi
        options: [github, github-pypi]
permissions:
  contents: read
concurrency:
  group: ptsip-release-design-verification
  cancel-in-progress: false
jobs:
  release-admission-contract-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/go.mod
      - name: Resolve Release Admission validator from test_modes.json
        id: release_mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          registry = json.loads(Path('.github/test_modes.json').read_text())
          modes = [x for x in registry['modes'] if x.get('id') == 'release-admission-design-check']
          if len(modes) != 1 or modes[0].get('task_ref') != 'release-admission-contract-check':
              raise SystemExit('BLOCKED: unregistered or ambiguous release verification mode')
          execution = registry['tasks']['execution']['release-admission-contract-check']
          if (execution.get('module_root') != '.ptsip/engine/developer'
              or execution.get('validator') != 'release-admission-check'
              or execution.get('contract_ref') != '.ptsip/contracts/release/admission.json'
              or execution.get('publication_authorized') is not False):
              raise SystemExit('BLOCKED: unsafe release verification task binding')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('validator=' + execution['validator'], file=out)
          PY
      - name: Run developer Release Admission validator tests
        shell: bash
        run: go -C .ptsip/engine/developer test ./release -count=1
      - name: Validate registered Release Admission contract projection
        shell: bash
        run: go -C .ptsip/engine/developer run . --validator "${{ steps.release_mode.outputs.validator }}" --root "$GITHUB_WORKSPACE"
      - name: Reject actual release publication until successor policy activation
        shell: bash
        run: |
          echo "BLOCKED: Release Admission verifier is a contract-design check, not publication authority."
          echo "No GitHub Release, PyPI upload, publication credentials, or release records are invoked."
          exit 1
