# Engine verification is admitted by the scoped CTRL/ASSURE contract.
# The selected-engine Release Gate is enabled; publication remains separate.
name: tooling-release

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Selected engine verification only; publication remains blocked"
        required: true
        type: choice
        default: all
        options:
          - all
          - context
          - storage
          - validation
          - discovery
          - planning
          - execution
          - projection

permissions:
  contents: read

jobs:
  verification-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: developer/tests/go.mod
          cache: true
          cache-dependency-path: |
            developer/automation/go.sum
            developer/tests/go.sum
            .github/checks/release/engine-verification/go.mod
      - name: Resolve current verification admission from canonical policy
        shell: bash
        run: go -C .github/checks/release/engine-verification run ./cmd/engine-wheel admit --root "$GITHUB_WORKSPACE"

  engine-verification:
    needs: verification-admission
    name: "Engine Verification / ${{ matrix.engine }} / ${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        engine: ${{ fromJSON(inputs.engine == 'all' && '["context","storage","validation","discovery","planning","execution","projection"]' || format('["{0}"]', inputs.engine)) }}
        platform:
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            suffix: ''

    env:
      CARGO_TARGET_DIR: .artifacts/native-engine-test-target
      PTSIP_ENGINE_WHEEL_DIR: .artifacts/release/engine-wheels/${{ matrix.platform.name }}

    steps:
      - name: Checkout exact requested source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go from repository module
        uses: actions/setup-go@v6
        with:
          go-version-file: developer/tests/go.mod
          cache: true
          cache-dependency-path: |
            developer/automation/go.sum
            developer/tests/go.sum
            .github/checks/release/engine-verification/go.mod

      - name: Set up isolated consumer package installer
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reject unexpected Rust host toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV > rust-host.txt
          cat rust-host.txt
          grep -Fqx "host: ${{ matrix.platform.target }}" rust-host.txt
          awk '/^commit-hash:/ {print "toolchain=" $2}' rust-host.txt >> "$GITHUB_OUTPUT"

      - name: Restore Cargo dependencies and selected engine compilation
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            ${{ env.CARGO_TARGET_DIR }}
          key: rust-engine-v1-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ steps.rust.outputs.toolchain }}-${{ matrix.engine }}-${{ hashFiles(format('src/ptsip/engines/{0}/Cargo.toml', matrix.engine), format('src/ptsip/engines/{0}/Cargo.lock', matrix.engine)) }}-${{ hashFiles(format('src/ptsip/engines/{0}/**', matrix.engine)) }}
          restore-keys: |
            rust-engine-v1-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ steps.rust.outputs.toolchain }}-${{ matrix.engine }}-${{ hashFiles(format('src/ptsip/engines/{0}/Cargo.toml', matrix.engine), format('src/ptsip/engines/{0}/Cargo.lock', matrix.engine)) }}-

      - name: Record compilation cache result
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          RUST_COMPILER: ${{ steps.rust.outputs.toolchain }}
        run: |
          printf 'Exact cache hit: %s\nRust compiler: %s\nTests and artifact verification run regardless of cache hit.\n' "$CACHE_HIT" "$RUST_COMPILER" | tee rust-cache.txt

      - name: Run only the selected engine's Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path "src/ptsip/engines/${{ matrix.engine }}/Cargo.toml"

      - name: Build only the selected independent Rust engine
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path "src/ptsip/engines/${{ matrix.engine }}/Cargo.toml"
          test -f "$CARGO_TARGET_DIR/release/ptsip-engine-${{ matrix.engine }}${{ matrix.platform.suffix }}"

      - name: Assemble local native wheel (unreleased)
        shell: bash
        run: |
          set -euo pipefail
          go -C .github/checks/release/engine-verification run ./cmd/engine-wheel \
            --root "$GITHUB_WORKSPACE" \
            --kind "${{ matrix.engine }}" \
            --target "${{ matrix.platform.target }}" \
            --binary "$GITHUB_WORKSPACE/$CARGO_TARGET_DIR/release/ptsip-engine-${{ matrix.engine }}${{ matrix.platform.suffix }}" \
            --output "$GITHUB_WORKSPACE/$PTSIP_ENGINE_WHEEL_DIR" \
            --source-sha "$GITHUB_SHA"

      - name: Verify the wheel in Go and install into isolated consumer
        shell: bash
        run: |
          set -euo pipefail
          go -C developer/tests test ./engines -run '^TestIndependentEngineWheel/${{ matrix.engine }}$' -count=1 -v -timeout=15m | tee engine-verification.log

      - name: Preserve engine verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: engine-verification-${{ matrix.engine }}-${{ matrix.platform.name }}-${{ github.sha }}
          path: |
            ${{ env.PTSIP_ENGINE_WHEEL_DIR }}/*
            engine-verification.log
            rust-host.txt
            rust-cache.txt
          if-no-files-found: error

  tool-verification:
    name: Tool Verification (deferred)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  profile-verification:
    name: Profile Verification (deferred)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  package-verification:
    name: Package Verification (deferred)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  release-gate:
    name: Release Gate
    needs: [verification-admission, engine-verification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: developer/tests/go.mod
          cache: true
          cache-dependency-path: |
            developer/automation/go.sum
            developer/tests/go.sum
            .github/checks/release/engine-verification/go.mod
      - name: Verify exact-source selected engine jobs and artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELECTED_ENGINE: ${{ inputs.engine }}
        run: |
          set -euo pipefail
          go -C .github/checks/release/engine-verification run ./cmd/engine-wheel gate \
            --root "$GITHUB_WORKSPACE" --kind "$SELECTED_ENGINE" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --source-sha "$GITHUB_SHA" | tee release-gate.json
          printf 'Selected engine verification gate: PASS\nPublication was not executed.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve selected-engine gate result
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ inputs.engine }}-${{ github.sha }}
          path: release-gate.json
          if-no-files-found: error
