name: tooling-release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Package always includes Tool, Profiles and ALL registered engines'
        type: choice
        default: PTSIP_PACKAGE
        options: [PTSIP_PACKAGE, TOOL_ONLY, ENGINE_ONLY, PROFILES_ONLY, TOOL_ENGINES, TOOL_PROFILES, ENGINES_PROFILES, MULTIPLE_ENGINES]
      components:
        description: 'Engine names for an explicit component release; leave empty for Package'
        type: string
        default: ''
      optional_platforms:
        description: 'Optional macOS verification artifacts (leave empty for Windows and Linux)'
        type: string
        default: ''
      destination:
        description: Publication destination
        type: choice
        default: github-pypi
        options: [github, github-pypi]
permissions:
  contents: read
concurrency:
  group: ptsip-component-publication
  cancel-in-progress: false
jobs:
  release-admission:
    runs-on: ubuntu-latest
    outputs:
      publication_matrix: ${{ steps.preflight.outputs.publication_matrix }}
      pypi_count: ${{ steps.preflight.outputs.pypi_count }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      COMPONENTS: ${{ inputs.components }}
      OPTIONAL: ${{ inputs.optional_platforms }}
      DESTINATION: ${{ inputs.destination }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/controller/go.mod
          cache: true
          cache-dependency-path: .ptsip/engine/developer/Distribution/release/controller/go.sum
      - name: Confirm latest CTRL ownership and non-normative design consistency
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/test_modes.json
          go -C .ptsip/engine/developer test ./release -count=1
          go -C .ptsip/engine/developer run . --validator release-admission-check --root "$GITHUB_WORKSPACE"
      - name: Admit the effective CTRL normative release policy (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer/Distribution/release/controller run ./cmd/ptsip-release admit-policy --root "$GITHUB_WORKSPACE"
      - name: Resolve original verification and prepare admitted publication
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer/Distribution/release/controller run ./cmd/ptsip-release prepare-publication --root "$GITHUB_WORKSPACE" --release-type "$RELEASE_TYPE" --components "$COMPONENTS" --optional-platforms "$OPTIONAL" --output .artifacts/release/shipping
      - name: Consume immutable PyPI file identities before publication
        id: preflight
        shell: bash
        run: go -C .ptsip/engine/developer/Distribution/release/controller run ./cmd/ptsip-release pypi-stage --root "$GITHUB_WORKSPACE" --destination "$DESTINATION" --output .artifacts/release/shipping
      - uses: actions/upload-artifact@v7
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
          if-no-files-found: error
  github-publication:
    needs: release-admission
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/controller/go.mod
          cache: true
          cache-dependency-path: .ptsip/engine/developer/Distribution/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Publish one verified source-SHA Release
        shell: bash
        run: go -C .ptsip/engine/developer/Distribution/release/controller run ./cmd/ptsip-release publish-carrier --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
  pypi-publication:
    needs: [release-admission, github-publication]
    if: ${{ inputs.destination == 'github-pypi' && needs.release-admission.outputs.pypi_count != '0' }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-admission.outputs.publication_matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Upload the admitted original wheel set
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
          packages-dir: .artifacts/release/shipping/pypi/${{ matrix.component }}
  package-record:
    needs: [release-admission, github-publication, pypi-publication]
    if: ${{ always() && needs.github-publication.result == 'success' && (inputs.destination == 'github' || needs.release-admission.outputs.pypi_count == '0' || needs.pypi-publication.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/controller/go.mod
          cache: true
          cache-dependency-path: .ptsip/engine/developer/Distribution/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Confirm public PyPI digests
        if: ${{ inputs.destination == 'github-pypi' }}
        shell: bash
        run: go -C .ptsip/engine/developer/Distribution/release/controller run ./cmd/ptsip-release pypi-verify --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
      - name: Record the published Package composition and separate Package note
        shell: bash
        run: go -C .ptsip/engine/developer/Distribution/release/controller run ./cmd/ptsip-release record-package --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
