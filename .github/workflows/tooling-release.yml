name: tooling-release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Verify artifacts or publish selected independent releases
        type: choice
        options: [verify, publish]
        default: verify
      targets:
        description: all or comma-separated tool,profile,context,storage,validation,discovery,planning,execution,projection,package
        default: all
      disabled_targets:
        description: Comma-separated targets to switch off
        default: ''
      package_base:
        description: Explicit Package numeric base (empty uses the owner-approved catalog value)
        default: ''
  release:
    types: [published]

permissions:
  contents: read
concurrency:
  group: tooling-release-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'tool-v') || startsWith(github.event.release.tag_name, 'engine-') || startsWith(github.event.release.tag_name, 'profile-') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      targets: ${{ steps.selection.outputs.targets }}
      has_builds: ${{ steps.selection.outputs.has_builds }}
      has_targets: ${{ steps.selection.outputs.has_targets }}
      tool: ${{ steps.selection.outputs.tool }}
      package: ${{ steps.selection.outputs.package }}
      phase: ${{ steps.selection.outputs.phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/go.mod
          cache-dependency-path: |
            .github/checks/release/go.sum
            developer/automation/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify the independent release control plane
        shell: pwsh
        run: |
          go -C .github/checks/release test -tags grammar_subset,grammar_subset_python ./...
          if ($LASTEXITCODE -ne 0) { throw 'Independent release regression failed.' }
      - name: Verify exact-source Profile transition
        shell: pwsh
        env:
          PTSIP_EXECUTION_BRANCH: main
          PTSIP_EXECUTION_SHA: ${{ github.sha }}
        run: |
          go -C developer/automation run -tags grammar_subset,grammar_subset_python ./cmd/ptsip-dev pp release --sha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Exact-source Profile transition failed.' }
      - id: selection
        name: Select registered changed release targets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGETS: ${{ inputs.targets || 'all' }}
          DISABLED_TARGETS: ${{ inputs.disabled_targets }}
          PACKAGE_BASE: ${{ inputs.package_base }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PHASE: ${{ github.event_name == 'release' && 'publish' || inputs.phase }}
        run: |
          $params = @{ Action='Plan'; Targets=$env:TARGETS; DisabledTargets=$env:DISABLED_TARGETS; PackageBase=$env:PACKAGE_BASE }
          if ($env:RELEASE_TAG) { $params.ReleaseTag=$env:RELEASE_TAG }
          & ./.github/checks/release/run_release.ps1 @params
          $plan = Get-Content -LiteralPath .artifacts/release/selection.json -Raw | ConvertFrom-Json
          $hosts = @{ 'any'='ubuntu-latest'; 'linux-x64'='ubuntu-latest'; 'windows-x64'='windows-latest'; 'macos-arm64'='macos-15' }
          $builds = @($plan.components | Where-Object { $_.state -eq 'BUILD' })
          $rows = @(foreach ($component in $builds) { foreach ($platform in $component.platforms) { @{ target=$component.id; platform=$platform; os=$hosts[$platform]; kind=$component.kind; output=$(if($component.id -eq 'tool'){'dist'}else{".artifacts/release/build/$($component.id)/$platform"}) } } })
          $publishTargets = @($builds | Where-Object { $_.id -ne 'tool' } | ForEach-Object { @{ target=$_.id } })
          "matrix=$(@{include=$rows}|ConvertTo-Json -Depth 5 -Compress)" >> $env:GITHUB_OUTPUT
          "targets=$(@{include=$publishTargets}|ConvertTo-Json -Depth 5 -Compress)" >> $env:GITHUB_OUTPUT
          "has_builds=$($rows.Count -gt 0)" >> $env:GITHUB_OUTPUT
          "has_targets=$($publishTargets.Count -gt 0)" >> $env:GITHUB_OUTPUT
          "tool=$(@($builds | Where-Object {$_.id -eq 'tool'}).Count -eq 1)" >> $env:GITHUB_OUTPUT
          "package=$($plan.package_selected)" >> $env:GITHUB_OUTPUT
          "phase=$env:PHASE" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: release-selection
          path: .artifacts/release/selection.json

  build:
    name: build-${{ matrix.target }}-${{ matrix.platform }}
    needs: prepare
    if: ${{ needs.prepare.outputs.has_builds == 'True' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/go.mod
          cache-dependency-path: |
            .github/checks/release/go.sum
            developer/automation/go.sum
            developer/tests/go.sum
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ matrix.kind == 'ENGINE' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Tool distribution verification dependencies
        if: ${{ matrix.target == 'tool' }}
        run: python -m pip install build twine PyYAML jsonschema pytest
      - uses: actions/download-artifact@v4
        with:
          name: release-selection
          path: .artifacts/release
      - name: Build and verify only the selected component
        shell: pwsh
        env:
          REPOSITORY_ID: ${{ github.repository }}
          PTSIP_EXECUTION_BRANCH: main
          PTSIP_EXECUTION_SHA: ${{ github.sha }}
        run: |
          & ./.github/checks/release/run_release.ps1 -Action Build -SelectionFile .artifacts/release/selection.json -Target '${{ matrix.target }}' -Platform '${{ matrix.platform }}' -OutputDirectory '${{ matrix.output }}'
      - name: Upload verified component artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.platform }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.phase == 'publish' && needs.prepare.outputs.has_targets == 'True' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: release-selection
          path: .artifacts/release
      - uses: actions/download-artifact@v4
        with:
          pattern: release-${{ matrix.target }}-*
          merge-multiple: true
          path: .artifacts/release/publication/${{ matrix.target }}
      - name: Publish this component after all its platforms verify
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & ./.github/checks/release/run_release.ps1 -Action Verify -Target '${{ matrix.target }}' -OutputDirectory '.artifacts/release/publication/${{ matrix.target }}'
          & ./.github/checks/release/run_release.ps1 -Action Publish -Target '${{ matrix.target }}' -OutputDirectory '.artifacts/release/publication/${{ matrix.target }}'

  tool-publish:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.phase == 'publish' && needs.prepare.outputs.tool == 'True' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: release-selection
          path: .artifacts/release
      - uses: actions/download-artifact@v4
        with:
          name: release-tool-any
          path: dist
      - name: Verify and publish immutable Tool artifacts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & ./.github/checks/release/run_release.ps1 -Action Verify -Target tool -OutputDirectory dist
          & ./.github/checks/release/run_release.ps1 -Action Publish -Target tool -OutputDirectory dist
          New-Item -ItemType Directory -Path pypi-dist | Out-Null
          Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -like '*.whl' -or $_.Name -like '*.tar.gz' } | Copy-Item -Destination pypi-dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/

  package:
    needs: [prepare, build, publish, tool-publish]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.package == 'True' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: release-selection
          path: .artifacts/release
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-*
          path: .artifacts/release/components
      - name: Join verified new or immutable existing component artifacts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PHASE: ${{ needs.prepare.outputs.phase }}
        run: |
          $params=@{ Action='Package'; InputDirectory='.artifacts/release/components'; OutputDirectory='.artifacts/release/package' }
          if ($env:PHASE -eq 'publish') { $params.PublishPackage=$true }
          & ./.github/checks/release/run_release.ps1 @params
      - uses: actions/upload-artifact@v4
        with:
          name: package-distribution
          path: .artifacts/release/package
          if-no-files-found: error
