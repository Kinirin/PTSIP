name: tooling-release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Package always includes Tool, Profiles and ALL registered engines'
        type: choice
        default: PTSIP_PACKAGE
        options: [PTSIP_PACKAGE, TOOL_ONLY, ENGINE_ONLY, PROFILES_ONLY, TOOL_ENGINES, TOOL_PROFILES, ENGINES_PROFILES, MULTIPLE_ENGINES]
      components:
        description: 'Engine names for an explicit component release; leave empty for Package'
        type: string
        default: ''
      optional_platforms:
        description: 'Optional macOS verification artifacts (leave empty for Windows and Linux)'
        type: string
        default: ''
      destination:
        description: Publication destination
        type: choice
        default: github-pypi
        options: [github, github-pypi]
permissions:
  contents: read
concurrency:
  group: ptsip-component-publication
  cancel-in-progress: false
jobs:
  release-admission:
    runs-on: ubuntu-latest
    outputs:
      pypi_count: ${{ steps.preflight.outputs.pypi_count }}
      package_count: ${{ steps.preflight.outputs.package_count }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      COMPONENTS: ${{ inputs.components }}
      OPTIONAL: ${{ inputs.optional_platforms }}
      DESTINATION: ${{ inputs.destination }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/controller/go.mod
          cache: true
          cache-dependency-path: .github/checks/release/controller/go.sum
      - name: Resolve original verification and prepare admitted publication
        shell: bash
        run: |
          set -euo pipefail
          go -C .github/checks/release/controller run ./cmd/ptsip-release prepare-publication --root "$GITHUB_WORKSPACE" --release-type "$RELEASE_TYPE" --components "$COMPONENTS" --optional-platforms "$OPTIONAL" --output .artifacts/release/shipping
      - name: Consume immutable PyPI file identities before publication
        id: preflight
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release pypi-stage --root "$GITHUB_WORKSPACE" --destination "$DESTINATION" --output .artifacts/release/shipping
      - uses: actions/upload-artifact@v7
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
          if-no-files-found: error
  github-publication:
    needs: release-admission
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/controller/go.mod
          cache: true
          cache-dependency-path: .github/checks/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Publish one verified source-SHA Release
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release publish-carrier --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
  pypi-publication:
    needs: [release-admission, github-publication]
    if: ${{ inputs.destination == 'github-pypi' && needs.release-admission.outputs.pypi_count != '0' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Upload all admitted engine wheels sequentially with one publisher setup
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.ENTIRE_ACCOUNT }}
          attestations: false
          packages-dir: .artifacts/release/shipping/pypi/engines
  package-publication:
    needs: [release-admission, github-publication, pypi-publication]
    if: ${{ always() && inputs.destination == 'github-pypi' && needs.github-publication.result == 'success' && needs.release-admission.outputs.package_count != '0' && (needs.release-admission.outputs.pypi_count == '0' || needs.pypi-publication.result == 'success') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Publish complete Package only after every engine upload succeeds
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.ENTIRE_ACCOUNT }}
          attestations: false
          packages-dir: .artifacts/release/shipping/pypi/package
  package-record:
    needs: [release-admission, github-publication, pypi-publication, package-publication]
    if: ${{ always() && needs.github-publication.result == 'success' && (inputs.destination == 'github' || ((needs.release-admission.outputs.pypi_count == '0' || needs.pypi-publication.result == 'success') && (needs.release-admission.outputs.package_count == '0' || needs.package-publication.result == 'success'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/controller/go.mod
          cache: true
          cache-dependency-path: .github/checks/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Confirm public PyPI digests
        if: ${{ inputs.destination == 'github-pypi' }}
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release pypi-verify --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
      - name: Record the published Package composition and separate Package note
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release record-package --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
