name: tooling-release
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Registered publication selection
        type: string
        default: package
      verification_run_id:
        description: Successful exact-source tooling-test run
        type: string
        required: true
      optional_platforms:
        description: Explicit optional platform selection
        type: string
        default: ''
      release_id:
        description: Optional existing same-source GitHub Draft Release ID
        type: string
        default: '0'
      destination:
        description: Publication destination
        type: choice
        default: github-pypi
        options: [github, github-pypi]
permissions:
  contents: read
concurrency:
  group: ptsip-component-publication
  cancel-in-progress: false
jobs:
  release-admission:
    runs-on: ubuntu-latest
    outputs:
      publication_matrix: ${{ steps.preflight.outputs.publication_matrix }}
      pypi_count: ${{ steps.preflight.outputs.pypi_count }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: ${{ inputs.verification_run_id }}
      TARGETS: ${{ inputs.targets }}
      OPTIONAL: ${{ inputs.optional_platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/controller/go.mod
          cache: true
          cache-dependency-path: .github/checks/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verification_run_id }}
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - name: Resolve publication selection and consume verification evidence
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          go -C .github/checks/release/controller run ./cmd/ptsip-release admit --root "$GITHUB_WORKSPACE" --run-id "$VERIFIED_RUN" --targets "$TARGETS" --optional-platforms "$OPTIONAL"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verification_run_id }}
          pattern: verification-*-${{ github.sha }}
          path: .artifacts/release/verified
      - name: Prepare original artifacts for publication
        shell: bash
        run: |
          set -euo pipefail
          go -C .github/checks/release/controller run ./cmd/ptsip-release prepare-shipping --root "$GITHUB_WORKSPACE" --run-id "$VERIFIED_RUN" --output .artifacts/release/shipping
      - name: Consume immutable PyPI file identities before publication
        id: preflight
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release pypi-stage --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
      - uses: actions/upload-artifact@v7
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
          if-no-files-found: error
  github-publication:
    needs: release-admission
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: ${{ inputs.verification_run_id }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/controller/go.mod
          cache: true
          cache-dependency-path: .github/checks/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verification_run_id }}
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Publish one source-SHA GitHub carrier
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release publish-carrier --root "$GITHUB_WORKSPACE" --run-id "$VERIFIED_RUN" --release-id "$RELEASE_ID" --output .artifacts/release/shipping
  pypi-publication:
    needs: [release-admission, github-publication]
    if: ${{ inputs.destination == 'github-pypi' && needs.release-admission.outputs.pypi_count != '0' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-admission.outputs.publication_matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Upload the admitted original wheel set
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: .artifacts/release/shipping/pypi/${{ matrix.component }}
  package-record:
    needs: [release-admission, github-publication, pypi-publication]
    if: ${{ always() && needs.github-publication.result == 'success' && (inputs.destination == 'github' || needs.release-admission.outputs.pypi_count == '0' || needs.pypi-publication.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/controller/go.mod
          cache: true
          cache-dependency-path: .github/checks/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verification_run_id }}
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - uses: actions/download-artifact@v8
        with:
          name: admitted-publication-${{ github.sha }}
          path: .artifacts/release/shipping
      - name: Confirm public PyPI digests
        if: ${{ inputs.destination == 'github-pypi' }}
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release pypi-verify --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
      - name: Record the published Package composition and separate Package note
        shell: bash
        run: go -C .github/checks/release/controller run ./cmd/ptsip-release record-package --root "$GITHUB_WORKSPACE" --output .artifacts/release/shipping
