name: tooling-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-unavailable:
    runs-on: ubuntu-latest
    steps:
      - name: Report the intentional release deployment gap
        shell: bash
        run: |
          echo '::error::RELEASE_EXECUTION_BLOCKED: The previous verification contract has been removed. A separately approved successor policy and contract are required before release deployment resumes.'
          exit 1
