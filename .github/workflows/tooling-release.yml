name: tooling-release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'tool-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )"
          EXPECTED_TAG="tool-v${PACKAGE_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}. Expected ${EXPECTED_TAG}."
            exit 1
          fi
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Verify wheel and sdist exclude tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))

          with zipfile.ZipFile(wheel) as archive:
              wheel_tests = [name for name in archive.namelist() if "tests" in PurePosixPath(name).parts]
          if wheel_tests:
              raise SystemExit(f"wheel contains tests/: {wheel_tests}")

          with tarfile.open(sdist, "r:gz") as archive:
              sdist_tests = [member.name for member in archive.getmembers() if "tests" in PurePosixPath(member.name).parts]
          if sdist_tests:
              raise SystemExit(f"sdist contains tests/: {sdist_tests}")
          PY
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    if: startsWith(github.event.release.tag_name, 'tool-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
