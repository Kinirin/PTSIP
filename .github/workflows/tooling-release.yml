# Engine verification is admitted by the scoped CTRL/ASSURE contract.
# Publication remains BLOCKED. Deferred components never produce PASS evidence.
name: tooling-release

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Selected engine verification only; publication remains blocked"
        required: true
        type: choice
        default: all
        options:
          - all
          - context
          - storage
          - validation
          - discovery
          - planning
          - execution
          - projection

permissions:
  contents: read

jobs:
  verification-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: developer/tests/go.mod
          cache: false
      - name: Resolve current verification admission from canonical policy
        shell: bash
        run: go -C .github/checks/release/engine-verification run ./cmd/engine-wheel admit --root "$GITHUB_WORKSPACE"

  engine-verification:
    needs: verification-admission
    name: "Engine Verification / ${{ matrix.engine }} / ${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        engine: ${{ fromJSON(inputs.engine == 'all' && '["context","storage","validation","discovery","planning","execution","projection"]' || format('["{0}"]', inputs.engine)) }}
        platform:
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            suffix: ''

    env:
      CARGO_TARGET_DIR: .artifacts/native-engine-test-target
      PTSIP_ENGINE_WHEEL_DIR: .artifacts/release/engine-wheels/${{ matrix.platform.name }}

    steps:
      - name: Checkout exact requested source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go from repository module
        uses: actions/setup-go@v6
        with:
          go-version-file: developer/tests/go.mod
          cache: false

      - name: Set up isolated consumer package installer
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reject unexpected Rust host toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV > rust-host.txt
          cat rust-host.txt
          grep -Fqx "host: ${{ matrix.platform.target }}" rust-host.txt
          echo "Engine verification evidence only; Release Gate remains blocked."

      - name: Run only the selected engine's Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path "src/ptsip/engines/${{ matrix.engine }}/Cargo.toml"

      - name: Build only the selected independent Rust engine
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path "src/ptsip/engines/${{ matrix.engine }}/Cargo.toml"
          test -f "$CARGO_TARGET_DIR/release/ptsip-engine-${{ matrix.engine }}${{ matrix.platform.suffix }}"

      - name: Assemble local native wheel (unreleased)
        shell: bash
        run: |
          set -euo pipefail
          go -C .github/checks/release/engine-verification run ./cmd/engine-wheel \
            --root "$GITHUB_WORKSPACE" \
            --kind "${{ matrix.engine }}" \
            --target "${{ matrix.platform.target }}" \
            --binary "$GITHUB_WORKSPACE/$CARGO_TARGET_DIR/release/ptsip-engine-${{ matrix.engine }}${{ matrix.platform.suffix }}" \
            --output "$GITHUB_WORKSPACE/$PTSIP_ENGINE_WHEEL_DIR" \
            --source-sha "$GITHUB_SHA"

      - name: Verify the wheel in Go and install into isolated consumer
        shell: bash
        run: |
          set -euo pipefail
          go -C developer/tests test ./engines -run '^TestIndependentEngineWheel/${{ matrix.engine }}$' -count=1 -v -timeout=15m | tee engine-verification.log

      - name: Preserve engine verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: engine-verification-${{ matrix.engine }}-${{ matrix.platform.name }}-${{ github.sha }}
          path: |
            ${{ env.PTSIP_ENGINE_WHEEL_DIR }}/*
            engine-verification.log
            rust-host.txt
          if-no-files-found: error

  tool-verification:
    name: Tool Verification (deferred)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  profile-verification:
    name: Profile Verification (deferred)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  package-verification:
    name: Package Verification (deferred)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  release-gate:
    name: Release Gate (BLOCKED)
    needs: [verification-admission, engine-verification, tool-verification, profile-verification, package-verification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the release publication suspension
        run: |
          echo '::error::RELEASE_EXECUTION_BLOCKED: Engine verification alone is insufficient. Tool, Profile, Package and successor release admission remain unresolved.'
          exit 1
