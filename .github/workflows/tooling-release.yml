# Design-only verification entry. Publication remains disabled by explicit policy.
name: tooling-release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Requested release selection (verification design only)'
        type: choice
        default: PTSIP_PACKAGE
        options: [PTSIP_PACKAGE, TOOL_ONLY, ENGINE_ONLY, PROFILES_ONLY, TOOL_ENGINES, TOOL_PROFILES, ENGINES_PROFILES, MULTIPLE_ENGINES]
      components:
        description: 'Selected component names (not published)'
        type: string
        default: ''
      optional_platforms:
        description: 'Optional platform selection (not executed)'
        type: string
        default: ''
      destination:
        description: 'Intended publisher (not contacted)'
        type: choice
        default: github-pypi
        options: [github, github-pypi]
permissions:
  contents: read
concurrency:
  group: ptsip-release-design-verification
  cancel-in-progress: false
jobs:
  release-admission-contract-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/go.mod
      - name: Run developer Release Admission validator tests
        shell: bash
        run: go -C .ptsip/engine/developer test ./release -count=1
      - name: Validate registered Release Admission contract projection
        shell: bash
        run: go -C .ptsip/engine/developer run . --validator release-admission-check --root "$GITHUB_WORKSPACE"
      - name: Reject actual release publication until successor policy activation
        shell: bash
        run: |
          echo "BLOCKED: Release Admission verifier is a contract-design check, not publication authority."
          echo "No GitHub Release, PyPI upload, publication credentials, or release records are invoked."
          exit 1
