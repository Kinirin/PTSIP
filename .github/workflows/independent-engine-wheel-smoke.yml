# Candidate-only cross-platform engine wheel verification. Not a release gate.
# Retired common/release workflows remain disabled and authoritative release
# approval remains blocked until a separate successor verification contract.
name: independent-engine-wheel-smoke

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Independent official engine to verify (or all seven)"
        required: true
        type: choice
        default: all
        options:
          - all
          - context
          - storage
          - validation
          - discovery
          - planning
          - execution
          - projection

permissions:
  contents: read

jobs:
  candidate-wheel-smoke:
    name: "${{ matrix.engine }} / ${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        engine: ${{ fromJSON(inputs.engine == 'all' && '["context","storage","validation","discovery","planning","execution","projection"]' || format('["{0}"]', inputs.engine)) }}
        platform:
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            suffix: ''

    env:
      CARGO_TARGET_DIR: .artifacts/native-engine-test-target
      PTSIP_ENGINE_WHEEL_DIR: .artifacts/release/engine-wheels/${{ matrix.platform.name }}

    steps:
      - name: Checkout exact requested source revision
        uses: actions/checkout@v4

      - name: Set up Go from repository module
        uses: actions/setup-go@v6
        with:
          go-version-file: developer/tests/go.mod
          cache: false

      - name: Set up packaging Python (not the test implementation)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reject unexpected Rust host toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV
          rustc -vV | grep -Fqx "host: ${{ matrix.platform.target }}"
          echo "Candidate evidence only; does not authorize release."

      - name: Run only the selected engine's Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path "src/ptsip/engines/${{ matrix.engine }}/Cargo.toml"

      - name: Build only the selected independent Rust engine
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path "src/ptsip/engines/${{ matrix.engine }}/Cargo.toml"
          test -f "$CARGO_TARGET_DIR/release/ptsip-engine-${{ matrix.engine }}${{ matrix.platform.suffix }}"

      - name: Assemble local native wheel (unreleased)
        shell: bash
        run: |
          set -euo pipefail
          python developer/automation/engine_wheels.py \
            --root . \
            --kind "${{ matrix.engine }}" \
            --target "${{ matrix.platform.target }}" \
            --binary "$CARGO_TARGET_DIR/release/ptsip-engine-${{ matrix.engine }}${{ matrix.platform.suffix }}" \
            --output "$PTSIP_ENGINE_WHEEL_DIR" \
            --source-sha "$(git rev-parse HEAD)"

      - name: Verify the wheel in Go and install into isolated consumer
        shell: bash
        run: |
          set -euo pipefail
          go -C developer/tests test ./engines -run '^TestIndependentEngineWheel/${{ matrix.engine }}$' -count=1 -v -timeout=15m
