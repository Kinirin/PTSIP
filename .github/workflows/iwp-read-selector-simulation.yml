name: iwp-read-selector-simulation

on:
  push:
    branches:
      - dev/0.3.8a1
    paths:
      - .github/workflows/iwp-read-selector-simulation.yml

permissions:
  contents: read

jobs:
  simulate:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore branch identity
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git checkout -B dev/0.3.8a1 $env:EXPECTED_SHA
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'HEAD mismatch' }

      - name: Prepare Python 3.14
        shell: powershell
        run: |
          $python = (& py -3.14 -c "import sys; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $python) { throw 'Python 3.14 unavailable' }
          if (Test-Path .venv) { Remove-Item .venv -Recurse -Force }
          & $python -m venv .venv
          $scripts = (Resolve-Path .venv\Scripts).Path
          $scripts >> $env:GITHUB_PATH

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run selector-granular tests
        shell: powershell
        run: |
          python -m pytest developer/tests/test_implementation_work_packet.py developer/tests/test_policy_resolver.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare packet and brief
        shell: powershell
        run: |
          python -m developer.automation.implementation_work_packet prepare --scope src/ptsip/app/github_authority.py --operation MODIFY --output .git/ptsip-iwp.json --brief-output .git/ptsip-agent-brief.json --agent-brief --json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m developer.automation.implementation_work_packet context --packet .git/ptsip-iwp.json --role read --output .git/read-all.json --json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Simulate selector-granular reads
        shell: powershell
        run: |
          @'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          packet = root / '.git/ptsip-iwp.json'
          brief = json.loads((root / '.git/ptsip-agent-brief.json').read_text(encoding='utf-8'))
          all_read = json.loads((root / '.git/read-all.json').read_text(encoding='utf-8'))

          def json_size(obj):
              return len(json.dumps(obj, ensure_ascii=False, sort_keys=True).encode('utf-8'))

          all_json_bytes = json_size(all_read)
          all_source_bytes = sum(len(item['source'].encode('utf-8')) for item in all_read['items'])
          rows = []
          for index, ref in enumerate(brief['read_context'], start=1):
              context_id = ref['context_id']
              output = root / '.git' / f'read-one-{index}.json'
              command = [
                  sys.executable, '-m', 'developer.automation.implementation_work_packet',
                  'context', '--packet', str(packet), '--role', 'read',
                  '--context-id', context_id, '--output', str(output), '--json',
              ]
              completed = subprocess.run(command, cwd=root, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
              if completed.returncode != 0:
                  raise SystemExit(completed.stderr or f'context failed: {context_id}')
              payload = json.loads(output.read_text(encoding='utf-8'))
              item = payload['items'][0]
              source_bytes = len(item['source'].encode('utf-8'))
              row = {
                  'context_id': context_id,
                  'path': item['path'],
                  'selector': item['selector'],
                  'json_bytes': json_size(payload),
                  'source_bytes': source_bytes,
                  'json_reduction_vs_all_percent': round((1-json_size(payload)/all_json_bytes)*100,1),
                  'source_reduction_vs_all_percent': round((1-source_bytes/all_source_bytes)*100,1),
              }
              rows.append(row)

          one_json = [row['json_bytes'] for row in rows]
          first_three_json = sum(one_json[:3])
          all_four_individual_json = sum(one_json)
          metrics = {
              'read_selector_count': len(rows),
              'all_read_json_bytes': all_json_bytes,
              'all_read_source_bytes': all_source_bytes,
              'individual_reads': rows,
              'single_read_json_bytes_min': min(one_json),
              'single_read_json_bytes_max': max(one_json),
              'single_read_json_bytes_avg': round(sum(one_json)/len(one_json),1),
              'single_read_avg_reduction_vs_all_percent': round((1-(sum(one_json)/len(one_json))/all_json_bytes)*100,1),
              'three_iterations_bundle_each_time_bytes': all_json_bytes*3,
              'three_iterations_three_unique_selectors_bytes': first_three_json,
              'three_iteration_reduction_percent': round((1-first_three_json/(all_json_bytes*3))*100,1),
              'all_four_once_bundle_bytes': all_json_bytes,
              'all_four_once_individual_bytes': all_four_individual_json,
              'all_four_individual_delta_percent': round((all_four_individual_json/all_json_bytes-1)*100,1),
          }
          print('IWP_READ_SELECTOR_METRICS=' + json.dumps(metrics, sort_keys=True))
          '@ | python -
