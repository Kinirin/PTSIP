name: tooling-test
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Registered verification mode; empty uses registry default
        type: string
        default: ''
      targets:
        description: Registered selection; empty uses registry default
        type: string
        default: ''
      optional_platforms:
        description: Explicit optional platform selection
        type: string
        default: ''
permissions:
  contents: read
jobs:
  developer-schema-contracts:
    name: "Developer schema contracts / ${{ matrix.runner }}"
    if: ${{ inputs.mode == 'developer-schema-contracts' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install registered PTSIP VALIDATION runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PTSIP==0.3.8b5" "PyYAML>=6,<7" "pytest>=8,<10" "jsonschema>=4,<5"
      - name: Record retired registry validator gap
        shell: bash
        run: |
          echo "UNRESOLVED: retired Test Mode Registry validator/resolver intentionally removed."
          echo "This manually selected job executes developer schema checks; it does NOT assert Test Mode Registry conformance."
      - name: Validate current developer contract schemas
        shell: bash
        env:
          PTSIP_TEST_PACKAGE_VERSION: '0.3.8b5'
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer test ./policy/verification -count=1
          go -C .ptsip/engine/developer run . --validator schema-check --root ../../..

  ptsip-validation-runtime:
    name: "Installed PTSIP VALIDATION smoke / ${{ matrix.runner }}"
    if: ${{ inputs.mode == 'ptsip-validation-runtime' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact released PTSIP engine and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PTSIP==0.3.8b3" "pytest>=8,<10" "PyYAML>=6,<7"
      - name: Execute declared installed VALIDATION runtime tests (registry selection unverified)
        shell: bash
        env:
          PTSIP_TEST_PACKAGE_VERSION: '0.3.8b3'
        run: |
          set -euo pipefail
          echo "UNRESOLVED: retired Test Mode Registry validation and mode resolution are not available."
          echo "Executing existing ptsip-validation-runtime pytest directory without asserting registry conformance."
          python -m pytest -q src/tests/ptsip/engine_runtime_validation
  mode-selection:
    if: ${{ inputs.mode != 'ptsip-validation-runtime' && inputs.mode != 'developer-schema-contracts' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mode.outputs.matrix }}
      python: ${{ steps.mode.outputs.python }}
      fetch_depth: ${{ steps.mode.outputs.fetch_depth }}
      join_matrix: ${{ steps.mode.outputs.join_matrix }}
      join_count: ${{ steps.mode.outputs.join_count }}
      lightweight_matrix: ${{ steps.mode.outputs.lightweight_matrix }}
      lightweight_count: ${{ steps.mode.outputs.lightweight_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
          cache: true
          cache-dependency-path: |
            .ptsip/engine/developer/Distribution/release/test/go.sum
            .ptsip/engine/developer/Distribution/release/controller/go.sum
      - name: Resolve registered mode and execution contract
        id: mode
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          TARGETS: ${{ inputs.targets }}
          OPTIONAL: ${{ inputs.optional_platforms }}
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test plan --root "$GITHUB_WORKSPACE" --mode "$MODE" --targets "$TARGETS" --optional-platforms "$OPTIONAL"
          go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test validate --root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release/selection.json
          if-no-files-found: error
  registered-join:
    name: "Registered join / ${{ matrix.component }} / ${{ matrix.platform }}"
    needs: [mode-selection, registered-verification]
    if: ${{ needs.mode-selection.outputs.join_count != '0' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mode-selection.outputs.join_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.mode-selection.outputs.fetch_depth }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
          cache: true
          cache-dependency-path: |
            .ptsip/engine/developer/Distribution/release/test/go.sum
            .ptsip/engine/developer/Distribution/release/controller/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.mode-selection.outputs.python }}
      - uses: actions/download-artifact@v8
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - uses: actions/download-artifact@v8
        with:
          pattern: verification-*-${{ github.sha }}
          path: .artifacts/release/verified
      - name: Execute registered join contract
        shell: bash
        run: go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test join --root "$GITHUB_WORKSPACE" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-package-${{ matrix.platform }}-${{ github.sha }}
          path: .artifacts/release/package/${{ matrix.platform }}
          if-no-files-found: error
  registered-verification:
    name: "Registered verification / ${{ matrix.component }} / ${{ matrix.platform }}"
    needs: mode-selection
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.mode-selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.mode-selection.outputs.fetch_depth }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
          cache: true
          cache-dependency-path: |
            .ptsip/engine/developer/Distribution/release/test/go.sum
            .ptsip/engine/developer/Distribution/release/controller/go.sum
            .ptsip/engine/developer/Distribution/release/verification/engine/go.sum
            developer/tests/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.mode-selection.outputs.python }}
      - uses: actions/download-artifact@v8
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - name: Resolve contract environment
        id: environment
        shell: bash
        run: go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test environment --root "$GITHUB_WORKSPACE" --component "${{ matrix.component }}" --platform "${{ matrix.platform }}"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.environment.outputs.cache_paths }}
          key: ${{ steps.environment.outputs.cache_key }}
          restore-keys: ${{ steps.environment.outputs.cache_restore_prefix }}
      - name: Execute registered verification
        shell: bash
        run: go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test execute --root "$GITHUB_WORKSPACE" --component "${{ matrix.component }}" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.component }}-${{ matrix.platform }}-${{ github.sha }}
          path: .artifacts/release/components/${{ matrix.component }}/${{ matrix.platform }}
          if-no-files-found: error
  lightweight-package:
    name: "Lightweight install / package / ${{ matrix.platform }}"
    needs: [mode-selection, registered-verification]
    if: ${{ needs.mode-selection.outputs.lightweight_count != '0' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mode-selection.outputs.lightweight_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.mode-selection.outputs.python }}
      - uses: actions/download-artifact@v8
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - uses: actions/download-artifact@v8
        with:
          pattern: verification-*-${{ github.sha }}
          path: .artifacts/release/verified
      - name: Verify exact-source complete wheel install, versions, hashes and sdist
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "build>=1.2,<2"
          go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test lightweight --root "$GITHUB_WORKSPACE" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-package-${{ matrix.platform }}-${{ github.sha }}
          path: .artifacts/release/package/${{ matrix.platform }}
          if-no-files-found: error
