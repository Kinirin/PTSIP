name: tooling-test

on:
  workflow_dispatch:
    inputs:
      host_ready:
        description: "Confirm DESKTOP-5HCCQIR is online and its PowerShell environment is ready"
        required: true
        type: boolean
        default: false
      release_candidate:
        description: "Enforce the Tool/Specification release contract and record release verification for this SHA"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: tooling-test-self-hosted
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify self-hosted authorization and runner identity
        shell: powershell
        env:
          HOST_READY: ${{ inputs.host_ready }}
        run: |
          if ($env:HOST_READY -ne "true") {
            throw "Self-hosted verification requires host_ready=true after the maintainer confirms the host and PowerShell environment are ready."
          }
          if ($env:RUNNER_NAME -ne "DESKTOP-5HCCQIR") {
            throw "Unexpected self-hosted runner '$env:RUNNER_NAME'. Expected DESKTOP-5HCCQIR."
          }
          Write-Host "Using approved self-hosted runner: $env:RUNNER_NAME"

      - name: Checkout selected ref with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install verification tooling
        shell: powershell
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]"

      - name: Verify required Specification release contract
        if: ${{ inputs.release_candidate }}
        shell: powershell
        run: python .github/scripts/verify_release_contract.py

      - name: Run complete repository regression
        shell: powershell
        run: python -m pytest -q

      - name: Verify Tool, Specification, and repository profile
        shell: powershell
        run: |
          ptsip --version
          ptsip spec
          ptsip validate . --json
          ptsip clarify . --json
          ptsip gate . --coordination local --json
          ptsip conform --help

      - name: Build and verify distributions
        shell: powershell
        run: |
          python -m build
          $distFiles = Get-ChildItem -Path dist -File | ForEach-Object { $_.FullName }
          if (-not $distFiles) {
            throw "No distributions were produced under dist/."
          }
          python -m twine check $distFiles

      - name: Reinstall built wheel and smoke public surfaces
        shell: powershell
        run: |
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel) {
            throw "No wheel was produced under dist/."
          }
          python -m pip install --force-reinstall --no-deps "$($wheel.FullName)"
          ptsip --version
          ptsip spec
          ptsip conform --help
          python -c "from vpms import VerificationPurpose; assert VerificationPurpose.PRODUCT.value == 'PRODUCT'; assert VerificationPurpose.TOOLCHAIN.value == 'TOOLCHAIN'"

      - name: Record successful release-candidate verification
        if: ${{ inputs.release_candidate }}
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = "success"
            context = "self-hosted/release-verification"
            description = "DESKTOP-5HCCQIR verified the Tool release candidate"
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body
