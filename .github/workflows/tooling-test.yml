name: tooling-test
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Registered verification mode; empty uses registry default
        type: string
        default: ''
      targets:
        description: Registered selection; empty uses registry default
        type: string
        default: ''
      optional_platforms:
        description: Explicit optional platform selection
        type: string
        default: ''
permissions:
  contents: read
jobs:
  mode-selection:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mode.outputs.matrix }}
      python: ${{ steps.mode.outputs.python }}
      fetch_depth: ${{ steps.mode.outputs.fetch_depth }}
      join_matrix: ${{ steps.mode.outputs.join_matrix }}
      join_count: ${{ steps.mode.outputs.join_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/test/go.mod
          cache: true
          cache-dependency-path: |
            .github/checks/release/test/go.sum
            .github/checks/release/controller/go.sum
      - name: Resolve registered mode and execution contract
        id: mode
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          TARGETS: ${{ inputs.targets }}
          OPTIONAL: ${{ inputs.optional_platforms }}
        run: |
          set -euo pipefail
          go -C .github/checks/release/test run ./cmd/ptsip-release-test plan --root "$GITHUB_WORKSPACE" --mode "$MODE" --targets "$TARGETS" --optional-platforms "$OPTIONAL"
          go -C .github/checks/release/test run ./cmd/ptsip-release-test validate --root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release/selection.json
          if-no-files-found: error
  registered-join:
    name: "Registered join / ${{ matrix.component }} / ${{ matrix.platform }}"
    needs: [mode-selection, registered-verification]
    if: ${{ needs.mode-selection.outputs.join_count != '0' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mode-selection.outputs.join_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.mode-selection.outputs.fetch_depth }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/test/go.mod
          cache: true
          cache-dependency-path: |
            .github/checks/release/test/go.sum
            .github/checks/release/controller/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.mode-selection.outputs.python }}
      - uses: actions/download-artifact@v8
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - uses: actions/download-artifact@v8
        with:
          pattern: verification-*-${{ github.sha }}
          path: .artifacts/release/verified
      - name: Execute registered join contract
        shell: bash
        run: go -C .github/checks/release/test run ./cmd/ptsip-release-test join --root "$GITHUB_WORKSPACE" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-package-${{ matrix.platform }}-${{ github.sha }}
          path: .artifacts/release/package/${{ matrix.platform }}
          if-no-files-found: error
  registered-verification:
    name: "Registered verification / ${{ matrix.component }} / ${{ matrix.platform }}"
    needs: mode-selection
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.mode-selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.mode-selection.outputs.fetch_depth }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/checks/release/test/go.mod
          cache: true
          cache-dependency-path: |
            .github/checks/release/test/go.sum
            .github/checks/release/controller/go.sum
            .github/checks/release/engine-verification/go.sum
            developer/tests/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.mode-selection.outputs.python }}
      - uses: actions/download-artifact@v8
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - name: Resolve contract environment
        id: environment
        shell: bash
        run: go -C .github/checks/release/test run ./cmd/ptsip-release-test environment --root "$GITHUB_WORKSPACE" --component "${{ matrix.component }}" --platform "${{ matrix.platform }}"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.environment.outputs.cache_paths }}
          key: ${{ steps.environment.outputs.cache_key }}
          restore-keys: ${{ steps.environment.outputs.cache_restore_prefix }}
      - name: Execute registered verification
        shell: bash
        run: go -C .github/checks/release/test run ./cmd/ptsip-release-test execute --root "$GITHUB_WORKSPACE" --component "${{ matrix.component }}" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.component }}-${{ matrix.platform }}-${{ github.sha }}
          path: .artifacts/release/components/${{ matrix.component }}/${{ matrix.platform }}
          if-no-files-found: error
