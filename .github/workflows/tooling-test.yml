# Generic Check execution; mode/Check IDs resolved exclusively from registries.
name: tooling-test
on:
  push:
  workflow_dispatch:
    inputs:
      verification:
        description: Verification preset
        required: true
        type: choice
        default: auto
        options:
          - auto
          - full
          - a3-prerelease
          - policy-lifecycle
          - agent-context-migration
          - markdown-cleanup-simulation
      checks:
        description: Comma-separated Check IDs (auto only)
        type: string
        required: false
      modes:
        description: Comma-separated registered Mode IDs (auto only)
        type: string
        required: false
permissions:
  contents: read
  statuses: write
jobs:
  resolve:
    if: ${{ github.event_name != 'push' || github.event.deleted == false }}
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.select.outputs.checks }}
      required: ${{ steps.select.outputs.required }}
      preset: ${{ steps.select.outputs.preset }}
      scope: ${{ steps.select.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install PyYAML
      - id: select
        name: Resolve independent Checks
        env:
          CHECK_PRESET: ${{ github.event_name == 'push' && 'auto' || inputs.verification }}
          EXPLICIT_CHECKS: ${{ inputs.checks }}
          EXPLICIT_MODES: ${{ inputs.modes }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AUTO_BASE: ${{ github.event.before }}
        run: |
          python .github/scripts/check_execution.py plan \
            --event '${{ github.event_name }}' \
            --preset "$CHECK_PRESET" \
            --checks "$EXPLICIT_CHECKS" \
            --modes "$EXPLICIT_MODES"
  check:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        check: ${{ fromJSON(needs.resolve.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ matrix.check != '__no_check__' }}
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        if: ${{ matrix.check != '__no_check__' }}
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-go@v6
        if: ${{ matrix.check != '__no_check__' }}
        with:
          go-version-file: developer/automation/go.mod
          cache-dependency-path: |
            developer/automation/go.sum
            developer/tests/go.sum
      - name: Install Check dependencies
        if: ${{ matrix.check != '__no_check__' }}
        run: python -m pip install -e '.[dev]'
      - name: Run Check independently
        if: ${{ matrix.check != '__no_check__' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          VERIFICATION_MODE: ${{ needs.resolve.outputs.preset }}
        run: python .github/scripts/check_execution.py run '${{ matrix.check }}'
      - name: Upload Check evidence
        if: ${{ always() && matrix.check != '__no_check__' }}
        uses: actions/upload-artifact@v4
        with:
          name: ptsip-check-${{ matrix.check }}
          path: .artifacts/check-results/${{ matrix.check }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Check supplementary evidence
        if: ${{ always() && matrix.check != '__no_check__' }}
        uses: actions/upload-artifact@v4
        with:
          name: ptsip-supplement-${{ matrix.check }}
          path: |
            .artifacts/*.log
            .artifacts/markdown-cleanup-simulation.json
          if-no-files-found: ignore
          retention-days: 14
  coverage:
    if: ${{ always() && needs.resolve.result == 'success' }}
    needs: [resolve, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install PyYAML
      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.required != '[]' }}
        with:
          pattern: ptsip-check-*
          path: .artifacts/collected
          merge-multiple: true
      - name: Verify required Check coverage
        env:
          REQUIRED_CHECKS: ${{ needs.resolve.outputs.required }}
          VERIFICATION_MODE: ${{ needs.resolve.outputs.preset }}
          SELECTION_SCOPE: ${{ needs.resolve.outputs.scope }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_execution.py coverage --required "$REQUIRED_CHECKS" --preset "$VERIFICATION_MODE" --scope "$SELECTION_SCOPE"
