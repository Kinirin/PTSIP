name: tooling-test
on:
  push:
    branches: [main]
    paths:
      - '.ptsip/engine/developer/policy/contract/update/**'
      - 'developer/tests/policy/contract/update/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Registered verification mode; empty uses registry default
        type: string
        default: ''
      targets:
        description: Registered selection; empty uses registry default
        type: string
        default: ''
      optional_platforms:
        description: Explicit optional platform selection
        type: string
        default: ''
      engine_verification_run:
        description: Engine version sync run that verified the committed sync lineage (for ptsip-common-contract)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  current-engine-derivation:
    name: "Current engine source / ${{ matrix.derivation }}"
    if: ${{ inputs.mode == 'ptsip-common-contract' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        derivation: [engine-snapshot, engine-dependency-graph]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/build/go.mod
          cache-dependency-path: src/build/go.sum
      - name: Generate from the exact committed source
        env:
          DERIVATION: ${{ matrix.derivation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go -C src/build run -mod=readonly . "$DERIVATION" -root "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/$DERIVATION.json"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.derivation }}
          path: ${{ runner.temp }}/${{ matrix.derivation }}.json
          if-no-files-found: error

  current-engine-proof:
    name: Verify exact committed engine source
    needs: current-engine-derivation
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/controller/go.mod
          cache-dependency-path: .ptsip/engine/developer/Distribution/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-*
          path: ${{ runner.temp }}/current-engine-derivation
          merge-multiple: true
      - name: Verify sync lineage and both current derivations
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_VERIFICATION_RUN: ${{ inputs.engine_verification_run }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$ENGINE_VERIFICATION_RUN" =~ ^[0-9]+$ ]]
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$ENGINE_VERIFICATION_RUN"
          gh api "$endpoint" > "$RUNNER_TEMP/prior-engine-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/engine-version-sync.yml" and
            .event == "push" and .head_branch == "main" and .status == "completed" and
            .repository.full_name == $repo and .head_repository.full_name == $repo
          ' "$RUNNER_TEMP/prior-engine-run.json" >/dev/null
          gh api "$endpoint/jobs?filter=latest&per_page=100" | jq -e '
            [.jobs[] | select(.conclusion == "success") | .name] |
            index("sync") != null and index("Commit and verify exact final source") != null
          ' >/dev/null

          prior="$RUNNER_TEMP/prior-engine-proof"
          gh run download "$ENGINE_VERIFICATION_RUN" --repo "$GITHUB_REPOSITORY" \
            --name engine-source-verification --dir "$prior"
          seed="$prior/engine-source-verification.json"
          sync_sha="$(jq -er '.sync_sha | select(test("^[0-9a-f]{40}$"))' "$seed")"
          prior_sha="$(jq -er '.source_sha | select(test("^[0-9a-f]{40}$"))' "$seed")"
          trigger_sha="$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/prior-engine-run.json")"
          git merge-base --is-ancestor "$trigger_sha" "$sync_sha"
          git merge-base --is-ancestor "$sync_sha" "$prior_sha"
          git merge-base --is-ancestor "$prior_sha" "$GITHUB_SHA"

          derived="$RUNNER_TEMP/current-engine-derivation"
          cmp src/ptsip/engines/contracts/engines_registries/derived-snapshot.json "$derived/engine-snapshot.json"
          cmp src/ptsip/engines/contracts/dependency-graph.json "$derived/engine-dependency-graph.json"
          controller=.ptsip/engine/developer/Distribution/release/controller
          go -C "$controller" run -mod=readonly ./cmd/ptsip-release check-version -root "$GITHUB_WORKSPACE"
          go -C src/build run -mod=readonly . verify-engine-derived -root "$GITHUB_WORKSPACE" -sync-sha "$sync_sha" \
            > "$RUNNER_TEMP/engine-source-verification.json"
          go -C src/tests/build run -mod=readonly . -root "$GITHUB_WORKSPACE" -stage prebuild
      - uses: actions/upload-artifact@v7
        with:
          name: current-engine-source-verification
          path: ${{ runner.temp }}/engine-source-verification.json
          if-no-files-found: error

  ptsip-common-contract:
    name: "Customer common contracts / ${{ matrix.runner }}"
    needs: current-engine-proof
    runs-on: ${{ matrix.runner }}
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/controller/go.mod
          cache-dependency-path: |
            src/ptsip/common_contract/go.sum
            .ptsip/engine/developer/Distribution/release/controller/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: current-engine-source-verification
          path: ${{ runner.temp }}/common-contract-engine-proof
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: python -m pip install --disable-pip-version-check 'build>=1.2,<2' 'PyYAML>=6,<7' 'jsonschema>=4,<5'
        shell: bash
      - name: Execute registered common contract checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/common-contract-evidence"
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          import yaml

          registry = yaml.safe_load(Path('.github/test_modes.yaml').read_text(encoding='utf-8'))
          mode, = [item for item in registry['modes'] if item['id'] == 'ptsip-common-contract']
          execution = mode['execution']
          evidence = Path(os.environ['RUNNER_TEMP']) / 'common-contract-evidence'
          for module in execution['go']:
              with (evidence / 'go-test.jsonl').open('ab') as report:
                  subprocess.run(['go', '-C', module, 'test', './...', '-count=1', '-json'], stdout=report, check=True)
              subprocess.run(['go', '-C', module, 'vet', './...'], check=True)
          PY
      - name: Verify source archive and exact-source installed Wheel
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          proof_file="$RUNNER_TEMP/common-contract-engine-proof/engine-source-verification.json"
          export PTSIP_VERIFIED_ENGINE_SOURCE_SHA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_sha"])' "$proof_file")"
          export PTSIP_ENGINE_VERSION_SYNC_SHA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sync_sha"])' "$proof_file")"
          test "$PTSIP_VERIFIED_ENGINE_SOURCE_SHA" = "$GITHUB_SHA"
          go -C src/build run -mod=readonly . wheel-ready -root "$GITHUB_WORKSPACE"
          go -C src/tests/build run -mod=readonly . -root "$GITHUB_WORKSPACE" -stage prebuild
          dist="$RUNNER_TEMP/common-contract-dist"
          evidence="$RUNNER_TEMP/common-contract-evidence"
          python -m build --sdist --outdir "$dist"
          sdists=("$dist/"*.tar.gz)
          test "${#sdists[@]}" -eq 1 && test -f "${sdists[0]}"
          go -C src/tests/build run -mod=readonly . -root "$GITHUB_WORKSPACE" -stage sdist \
            -artifact "${sdists[0]}" > "$evidence/source-archive.json"
          python -m build --wheel --outdir "$dist"
          wheels=("$dist/"*.whl)
          test "${#wheels[@]}" -eq 1 && test -f "${wheels[0]}"
          go -C src/tests/build run -mod=readonly . -root "$GITHUB_WORKSPACE" -stage wheel \
            -artifact "${wheels[0]}" > "$evidence/wheel.json"
          interpreter="$(python -c 'import sys; print(sys.executable)')"
          go -C src/tests/build run -mod=readonly . -root "$GITHUB_WORKSPACE" -stage installed \
            -artifact "${wheels[0]}" -python "$interpreter" -receipt "$evidence/native-wheel-receipt.json" \
            > "$evidence/installed-wheel.json"
          go -C .ptsip/engine/developer/Distribution/release/controller run -mod=readonly ./cmd/ptsip-release \
            verify-native-wheel-receipt -root "$GITHUB_WORKSPACE" -wheel "${wheels[0]}" \
            -receipt "$evidence/native-wheel-receipt.json" -engine-proof "$proof_file"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: common-contract-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/common-contract-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: verified-native-wheel-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/common-contract-dist/*.whl
            ${{ runner.temp }}/common-contract-dist/*.tar.gz
            ${{ runner.temp }}/common-contract-evidence/native-wheel-receipt.json
          if-no-files-found: error

  developer-schema-contracts:
    name: "Developer schema contracts / ${{ matrix.runner }}"
    if: ${{ github.event_name == 'push' || inputs.mode == 'developer-schema-contracts' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: developer/tests/go.mod
          cache-dependency-path: developer/tests/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install registered PTSIP VALIDATION runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PTSIP==0.3.8b5" "PyYAML>=6,<7" "pytest>=8,<10" "jsonschema>=4,<5"
      - name: Record retired registry validator gap
        shell: bash
        run: |
          echo "UNRESOLVED: retired Test Mode Registry validator/resolver intentionally removed."
          echo "This manually selected job executes developer schema checks; it does NOT assert Test Mode Registry conformance."
      - name: Validate current developer contract schemas
        shell: bash
        env:
          PTSIP_TEST_PACKAGE_VERSION: '0.3.8b5'
        run: |
          set -euo pipefail
          go -C developer/tests test -mod=readonly ./policy/verification/... ./policy/contract/... ./policy/review/... -count=1
          python -m unittest discover -s .ptsip/engine/developer/policy/review -p workflow_test.py
          python -m unittest discover -s .ptsip/engine/developer/policy/verification -p changed_test.py
          go -C .ptsip/engine/developer run . --validator contract-entry --root ../../.. --target developer/policy/ARCH/MPD-ARCH-0001.yaml --dry-run
          go -C .ptsip/engine/developer run . --validator contract-entry --root ../../.. --target developer/policy/ARCH/MPD-ARCH-0001.yaml
          go -C .ptsip/engine/developer run . --validator schema-check --root ../../..
          go -C src/ptsip/common_contract test ./cmd/ptsip-common-contract -run '^TestUnifiedPolicySource' -count=1

      - name: Verify authorized WU-15 operating request on exact checkout
        if: ${{ matrix.runner == 'ubuntu-24.04' && github.event_name == 'push' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = Get-Content -Raw -LiteralPath 'developer/planning/0.3.8/go-policy-source-digest-sync.plan.json' | ConvertFrom-Json -AsHashtable
          $request = @($plan.approval.authorized_update_requests | Where-Object { $_.approval_ref -eq 'WU15-OPERATING-VERIFICATION-DUPLICATE-RULE-CLEANUP-20261127' })
          if ($request.Count -ne 1) { throw 'Exact WU-15 request missing or ambiguous' }
          $request = $request[0]
          $raw = $request | ConvertTo-Json -Depth 100 -Compress
          $raw | go -C .ptsip/engine/developer run -mod=readonly . --root "$env:GITHUB_WORKSPACE" --validator policy-rules --operation update --input -
          if ($LASTEXITCODE -ne 0) { throw 'Operating policy update failed' }
          go -C .ptsip/engine/developer run -mod=readonly . --root "$env:GITHUB_WORKSPACE" --validator contract-entry --target $request.target
          if ($LASTEXITCODE -ne 0) { throw 'Independent policy verification failed' }
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $request.target))
          $encoded = [Convert]::ToBase64String($bytes)
          for ($offset = 0; $offset -lt $encoded.Length; $offset += 2000) {
            $length = [Math]::Min(2000, $encoded.Length - $offset)
            Write-Output ("WU15_VERIFIED_POLICY_BYTES {0} {1}" -f $offset, $encoded.Substring($offset, $length))
          }
          Write-Output ("WU15_VERIFIED_POLICY_LENGTH {0}" -f $encoded.Length)

  ptsip-validation-runtime:
    name: "Installed PTSIP VALIDATION smoke / ${{ matrix.runner }}"
    if: ${{ inputs.mode == 'ptsip-validation-runtime' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact released PTSIP engine and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PTSIP==0.3.8b3" "pytest>=8,<10" "PyYAML>=6,<7"
      - name: Execute declared installed VALIDATION runtime tests (registry selection unverified)
        shell: bash
        env:
          PTSIP_TEST_PACKAGE_VERSION: '0.3.8b3'
        run: |
          set -euo pipefail
          echo "UNRESOLVED: retired Test Mode Registry validation and mode resolution are not available."
          echo "Executing existing ptsip-validation-runtime pytest directory without asserting registry conformance."
          python -m pytest -q src/tests/ptsip/engine_runtime_validation
  mode-selection:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'ptsip-validation-runtime' && inputs.mode != 'developer-schema-contracts' && inputs.mode != 'ptsip-common-contract' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mode.outputs.matrix }}
      python: ${{ steps.mode.outputs.python }}
      fetch_depth: ${{ steps.mode.outputs.fetch_depth }}
      join_matrix: ${{ steps.mode.outputs.join_matrix }}
      join_count: ${{ steps.mode.outputs.join_count }}
      lightweight_matrix: ${{ steps.mode.outputs.lightweight_matrix }}
      lightweight_count: ${{ steps.mode.outputs.lightweight_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
          cache: true
          cache-dependency-path: |
            .ptsip/engine/developer/Distribution/release/test/go.sum
            .ptsip/engine/developer/Distribution/release/controller/go.sum
      - name: Resolve registered mode and execution contract
        id: mode
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          TARGETS: ${{ inputs.targets }}
          OPTIONAL: ${{ inputs.optional_platforms }}
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test plan --root "$GITHUB_WORKSPACE" --mode "$MODE" --targets "$TARGETS" --optional-platforms "$OPTIONAL"
          go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test validate --root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release/selection.json
          if-no-files-found: error
  registered-join:
    name: "Registered join / ${{ matrix.component }} / ${{ matrix.platform }}"
    needs: [mode-selection, registered-verification]
    if: ${{ needs.mode-selection.outputs.join_count != '0' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mode-selection.outputs.join_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.mode-selection.outputs.fetch_depth }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
          cache: true
          cache-dependency-path: |
            .ptsip/engine/developer/Distribution/release/test/go.sum
            .ptsip/engine/developer/Distribution/release/controller/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.mode-selection.outputs.python }}
      - uses: actions/download-artifact@v8
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - uses: actions/download-artifact@v8
        with:
          pattern: verification-*-${{ github.sha }}
          path: .artifacts/release/verified
      - name: Execute registered join contract
        shell: bash
        run: go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test join --root "$GITHUB_WORKSPACE" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-package-${{ matrix.platform }}-${{ github.sha }}
          path: .artifacts/release/package/${{ matrix.platform }}
          if-no-files-found: error
  registered-verification:
    name: "Registered verification / ${{ matrix.component }} / ${{ matrix.platform }}"
    needs: mode-selection
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.mode-selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.mode-selection.outputs.fetch_depth }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
          cache: true
          cache-dependency-path: |
            .ptsip/engine/developer/Distribution/release/test/go.sum
            .ptsip/engine/developer/Distribution/release/controller/go.sum
            .ptsip/engine/developer/Distribution/release/verification/engine/go.sum
            developer/tests/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.mode-selection.outputs.python }}
      - uses: actions/download-artifact@v8
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - name: Resolve contract environment
        id: environment
        shell: bash
        run: go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test environment --root "$GITHUB_WORKSPACE" --component "${{ matrix.component }}" --platform "${{ matrix.platform }}"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.environment.outputs.cache_paths }}
          key: ${{ steps.environment.outputs.cache_key }}
          restore-keys: ${{ steps.environment.outputs.cache_restore_prefix }}
      - name: Execute registered verification
        shell: bash
        run: go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test execute --root "$GITHUB_WORKSPACE" --component "${{ matrix.component }}" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.component }}-${{ matrix.platform }}-${{ github.sha }}
          path: .artifacts/release/components/${{ matrix.component }}/${{ matrix.platform }}
          if-no-files-found: error
  lightweight-package:
    name: "Lightweight install / package / ${{ matrix.platform }}"
    needs: [mode-selection, registered-verification]
    if: ${{ needs.mode-selection.outputs.lightweight_count != '0' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mode-selection.outputs.lightweight_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/test/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.mode-selection.outputs.python }}
      - uses: actions/download-artifact@v8
        with:
          name: verification-selection-${{ github.sha }}
          path: .artifacts/release
      - uses: actions/download-artifact@v8
        with:
          pattern: verification-*-${{ github.sha }}
          path: .artifacts/release/verified
      - name: Verify exact-source complete wheel install, versions, hashes and sdist
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "build>=1.2,<2"
          go -C .ptsip/engine/developer/Distribution/release/test run ./cmd/ptsip-release-test lightweight --root "$GITHUB_WORKSPACE" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-package-${{ matrix.platform }}-${{ github.sha }}
          path: .artifacts/release/package/${{ matrix.platform }}
          if-no-files-found: error
