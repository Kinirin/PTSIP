name: iwp-credit-simulation

on:
  push:
    branches:
      - dev/0.3.8a1
    paths:
      - .github/workflows/iwp-credit-simulation.yml
      - developer/automation/implementation_work_packet.py
      - developer/automation/policy_resolver.py
      - developer/tests/test_implementation_work_packet.py

permissions:
  contents: read

jobs:
  simulate:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore branch identity
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git checkout -B dev/0.3.8a1 $env:EXPECTED_SHA
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'HEAD mismatch' }

      - name: Prepare Python 3.14
        shell: powershell
        run: |
          $python = (& py -3.14 -c "import sys; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $python) { throw 'Python 3.14 unavailable' }
          if (Test-Path .venv) { Remove-Item .venv -Recurse -Force }
          & $python -m venv .venv
          $scripts = (Resolve-Path .venv\Scripts).Path
          $scripts >> $env:GITHUB_PATH

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run progressive-context tests
        shell: powershell
        run: |
          python -m pytest developer/tests/test_implementation_work_packet.py developer/tests/test_policy_resolver.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Simulate compact coding-agent entry
        shell: powershell
        run: |
          python -m developer.automation.implementation_work_packet prepare --scope src/ptsip/app/github_authority.py --operation MODIFY --output .git/ptsip-iwp.json --agent-brief --json > .git/ptsip-agent-brief.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m developer.automation.implementation_work_packet context --packet .git/ptsip-iwp.json --role mutation --json > .git/ptsip-mutation-context.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m developer.automation.policy_resolver rule PTSIP-AUT-001 --json > .git/ptsip-rule-sample.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure progressive-disclosure cost
        shell: powershell
        run: |
          @'
          import json
          from pathlib import Path
          root = Path('.')
          packet = json.loads((root/'.git/ptsip-iwp.json').read_text(encoding='utf-8'))
          brief = json.loads((root/'.git/ptsip-agent-brief.json').read_text(encoding='utf-8'))
          mutation = json.loads((root/'.git/ptsip-mutation-context.json').read_text(encoding='utf-8'))
          rule = json.loads((root/'.git/ptsip-rule-sample.json').read_text(encoding='utf-8'))
          def size(obj): return len(json.dumps(obj, ensure_ascii=False, sort_keys=True).encode('utf-8'))
          packet_bytes = size(packet)
          brief_bytes = size(brief)
          mutation_bytes = size(mutation)
          rule_bytes = size(rule)
          failure_delta_bytes = len(json.dumps({
              'schema_version':'ptsip-implementation-failure-route/v1',
              'repeat_count':1,
              'classification':'IMPLEMENTATION_FAILURE',
              'next_action':'FIX_WITHIN_CURRENT_MUTATION_PLAN',
              'scope_expansion_allowed':False,
          }, sort_keys=True).encode('utf-8'))
          whole_file_bytes = (root/'src/ptsip/app/github_authority.py').stat().st_size
          exact_mutation_source_bytes = sum(len(i['source'].encode('utf-8')) for i in mutation['items'])
          metrics = {
              'full_packet_bytes': packet_bytes,
              'agent_brief_bytes': brief_bytes,
              'brief_reduction_percent': round((1 - brief_bytes/packet_bytes)*100, 1),
              'mutation_context_json_bytes': mutation_bytes,
              'exact_mutation_source_bytes': exact_mutation_source_bytes,
              'whole_mutation_file_bytes': whole_file_bytes,
              'mutation_source_reduction_percent': round((1 - exact_mutation_source_bytes/whole_file_bytes)*100, 1),
              'single_rule_on_demand_bytes': rule_bytes,
              'three_iterations_full_packet_bytes': packet_bytes*3,
              'brief_plus_mutation_plus_three_failure_deltas_bytes': brief_bytes+mutation_bytes+failure_delta_bytes*3,
              'three_iteration_reduction_percent': round((1-(brief_bytes+mutation_bytes+failure_delta_bytes*3)/(packet_bytes*3))*100,1),
              'normative_headline_count': len(brief['normative_rules']),
              'mutation_item_count': len(mutation['items']),
          }
          print('IWP_PROGRESSIVE_METRICS=' + json.dumps(metrics, sort_keys=True))
          '@ | python -
