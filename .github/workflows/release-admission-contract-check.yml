# Non-publishing CI verification of temporary release structure and artifact safety.
name: release-admission-contract-check
on:
  push:
    branches: [main]
    paths:
      - '.ptsip/contracts/**'
      - '.ptsip/engine/developer/Distribution/release/verification/admission/**'
      - 'src/ptsip/engines/**'
      - 'developer/tests/engines/**'
      - '.ptsip/engine/developer/policy/verification/**'
      - '.ptsip/engine/developer/Distribution/release/**'
      - 'src/ptsip/profiles/**'
      - 'src/ptsip/specdata/**'
      - 'src/VERSION'
      - '.github/test_modes.yaml'
      - 'pyproject.toml'
      - '.ptsip/engine/developer/main.go'
      - '.github/verification-retirement.json'
      - '.github/workflows/tooling-release.yml'
      - '.github/workflows/release-admission-contract-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-projection:
    runs-on: ubuntu-latest
    env:
      PTSIP_TEST_PACKAGE_VERSION: "0.3.8b5"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/Distribution/release/controller/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verification runtime dependencies
        run: python -m pip install --disable-pip-version-check "PTSIP==0.3.8b5" "PyYAML>=6,<7" "jsonschema>=4,<5"
      - name: Assert relocated Go code and contract ownership
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/checks/release ] && find .github/checks/release -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) | grep -q .; then
            echo "BLOCKED: legacy release Go code remains in .github/checks/release"
            exit 1
          fi
          # Negative tests must be allowed to reference the retired path as rejected input.
          # Reject references in production Go sources and module declarations only.
          if grep -R -n --include='*.go' --include='go.mod' --exclude='*_test.go' -F '.github/checks/release' .ptsip/engine/developer/Distribution/release; then
            echo "BLOCKED: relocated Go code still references the retired Go path"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          m = json.loads((root/'.ptsip/contracts/release/migration-inventory.json').read_text())
          assert m['original_go_files_relocated'] == 38
          assert m['original_module_files_relocated'] == 6
          assert m['original_module_files_superseded'] == 1
          for item in m['migrated_source_files']:
              assert not (root/item['from']).exists(), item['from']
              assert (root/item['to']).is_file(), item['to']
          composition = json.loads((root/'.ptsip/contracts/release/composition-contract.json').read_text())
          assert composition['test_contract'] == '.ptsip/contracts/release/verification-contract.json'
          for contract in m['derived_legacy_contracts']:
              assert (root/contract).is_file(), contract
          print('Legacy Go source relocation and contract references verified; publication authority not asserted.')
          PY
      - name: Compile and check publication admission gate without publishing
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer/Distribution/release/controller test ./... -count=1
          go -C .ptsip/engine/developer/Distribution/release/test test ./... -count=1
          go -C .ptsip/engine/developer/Distribution/release/verification/engine test ./... -count=1
      - name: Verify current Package and Profile native contracts
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer/Distribution/release/verification/profile test ./... -count=1
      - name: Verify unresolved publication authority fails closed
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer test ./Distribution/release/verification/admission -count=1
          if go -C .ptsip/engine/developer run . --validator ctrl-release-admission-check --root "$GITHUB_WORKSPACE" > /tmp/ctrl-policy.json; then
            echo "BLOCKED: unresolved publication authority was unexpectedly admitted"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/ctrl-policy.json').read_text())
          assert p['status']=='UNVERIFIED'
          assert p['problem']=='SUCCESSOR_AUTHORITY_UNRESOLVED'
          assert p['publication_authorized'] is False
          assert p['per_release_evidence']=='NOT_ASSERTED'
          print('Successor authority unresolved; no publication authority granted.')
          PY
      - name: Test release structure and retirement guards
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer test ./Distribution/release/... -count=1
      - name: Test all Developer schema contracts and fourteen Family routes
        shell: bash
        run: go -C .ptsip/engine/developer test ./policy/verification -count=1 -v
      - name: Check temporary machine contract structure
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer run . --validator release-admission-check --root "$GITHUB_WORKSPACE" > /tmp/admission-design-report.json
          cat /tmp/admission-design-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/admission-design-report.json').read_text())
          assert report['status'] == 'CONTRACT_STRUCTURE_VALID'
          assert report['publication_admission'] == 'UNVERIFIED'
          assert report['publication_authorized'] is False
          assert report['release_verification'] == 'NOT_ASSERTED'
          print('Temporary contract structure verified; publication remains unresolved.')
          PY

  capability-contract-verification:
    name: "Registered contract and digest verification"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: developer/tests/go.mod
      - name: Verify new capability identities and all native source digests
        shell: bash
        run: |
          set -euo pipefail
          go -C developer/tests test ./engines -run '^(TestRegisteredManifestContractBindingAndIndependentOwnerClosure|TestPostB5CapabilityVersions|TestWithdrawnCTRLReleaseAdmissionPolicyAbsent)$' -count=1
  native-engine-contract-smoke:
    name: "Native contract / ${{ matrix.engine }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [validation, projection]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Test exact registered Rust engine implementation
        shell: bash
        run: cargo test --locked --manifest-path "src/ptsip/engines/${{ matrix.engine }}/Cargo.toml"
