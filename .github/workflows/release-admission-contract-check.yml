# Non-publishing CI verification of the approved Release Admission design projection.
name: release-admission-contract-check
on:
  push:
    branches: [main]
    paths:
      - '.ptsip/contracts/**'
      - 'developer/policy/CTRL/release-admission.policy.json'
      - 'developer/policy/registries/release-admission-ctrl-ownership.json'
      - 'developer/policy/registries/release-admission-publication-activation.json'
      - 'developer/policy/approvals/MPA-20261026-CTRL-RELEASE-ADMISSION-COMPLETION.yaml'
      - '.ptsip/engine/developer/ctrl_admission/**'
      - 'src/ptsip/engines/**'
      - 'developer/tests/engines/**'
      - 'developer/policy/approvals/MPA-20261026-VALIDATION-PROJECTION-CAPABILITY-CONTRACT-BUMPS.yaml'
      - '.ptsip/engine/developer/schema_check/**'
      - '.ptsip/engine/developer/release/**'
      - 'src/ptsip/profiles/**'
      - 'registry/project-profile-contracts.yaml'
      - 'pyproject.toml'
      - '.ptsip/engine/developer/main.go'
      - '.github/test_modes.json'
      - '.github/verification-retirement.json'
      - 'developer/policy/approvals/MPA-202610*-RELEASE-*.yaml'
      - 'developer/policy/approvals/MPA-202610*-E*.yaml'
      - '.github/workflows/tooling-release.yml'
      - '.github/workflows/release-admission-contract-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/release/controller/go.mod
      - name: Assert relocated Go code and contract ownership
        shell: bash
        run: |
          set -euo pipefail
          if find .github/checks/release -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) | grep -q .; then
            echo "BLOCKED: legacy release Go code remains in .github/checks/release"
            exit 1
          fi
          # Negative tests must be allowed to reference the retired path as rejected input.
          # Reject references in production Go sources and module declarations only.
          if grep -R -n --include='*.go' --include='go.mod' --exclude='*_test.go' -F '.github/checks/release' .ptsip/engine/developer/release; then
            echo "BLOCKED: relocated Go code still references the retired Go path"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          m = json.loads((root/'.ptsip/contracts/release/migration-inventory.json').read_text())
          assert m['original_go_files_relocated'] == 38
          assert m['original_module_files_relocated'] == 6
          assert m['original_module_files_superseded'] == 1
          for item in m['migrated_source_files']:
              assert not (root/item['from']).exists(), item['from']
              assert (root/item['to']).is_file(), item['to']
          composition = json.loads((root/'.ptsip/contracts/release/composition-contract.json').read_text())
          assert composition['test_contract'] == '.ptsip/contracts/release/verification-contract.json'
          for contract in m['derived_legacy_contracts']:
              assert (root/contract).is_file(), contract
          print('Legacy Go source relocation and contract references verified; publication authority not asserted.')
          PY
      - name: Compile and check publication admission gate without publishing
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer/release/controller test ./... -run '^(TestCTRLAdmissionFailClosedWithoutActiveNormativePolicy|TestCTRLAdmissionBlocksWithdrawnPolicy|TestPublicationEvidenceAuthority.*|TestAdmitShippingHasNoRetiredPolicyRuntimePath|TestPublishedB5EngineVersionsAndProjections)$' -count=1
          go -C .ptsip/engine/developer/release/test test ./... -run '^$'
          go -C .ptsip/engine/developer/release/engine-verification test ./... -run '^$'
      - name: Verify current Package and Profile native contracts
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer/release/test test ./... -run TestNativeProfile -count=1
          go -C .ptsip/engine/developer/release/test test ./... -run TestLightweightSDistManifestTracksCurrentProfile -count=1
          go -C .ptsip/engine/developer/release/test test ./... -run TestDeclaredVerificationSelection -count=1
          go -C .ptsip/engine/developer/release/test test ./... -run TestReleasePresentation -count=1
          go -C .ptsip/engine/developer/release/test test ./... -run TestReleaseComposition -count=1
          go -C .ptsip/engine/developer/release/controller test ./... -run TestCTRLAdmission -count=1
      - name: Verify withdrawn temporary CTRL policy fails closed (no publication)
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer test ./ctrl_admission -count=1
          if go -C .ptsip/engine/developer run . --validator ctrl-release-admission-check --root "$GITHUB_WORKSPACE" > /tmp/ctrl-policy.json; then
            echo "BLOCKED: withdrawn CTRL policy was unexpectedly admitted"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/ctrl-policy.json').read_text())
          assert p['status']=='BLOCKED'
          assert p['publication_authorized'] is False
          assert p['per_release_evidence']=='NOT_ASSERTED'
          print('Withdrawn temporary policy rejected; no publication authority granted.')
          PY
      - name: Execute Release Admission negative tests
        shell: bash
        run: go -C .ptsip/engine/developer test ./release -count=1
      - name: Test all Developer schema contracts and fourteen Family routes
        shell: bash
        run: go -C .ptsip/engine/developer test ./schema_check -count=1 -v -v
      - name: Check approval-bound machine contract (not publication)
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer run . --validator release-admission-check --root "$GITHUB_WORKSPACE" > /tmp/admission-design-report.json
          cat /tmp/admission-design-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/admission-design-report.json').read_text())
          assert report['status'] == 'DESIGN_CONTRACT_CONSISTENT'
          assert report['contract_validation'] == 'APPROVED_PROVENANCE_BINDINGS_MATCH'
          assert report['publication_authorized'] is False
          assert report['release_verification'] == 'NOT_ASSERTED'
          assert report['approved_error_directions_checked'] == 14
          assert report['common_directions_checked'] == 5
          print('Design projection verified; normative policy and publication remain BLOCKED.')
          PY

  capability-contract-verification:
    name: "Registered contract and digest verification"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: developer/tests/go.mod
      - name: Verify new capability identities and all native source digests
        shell: bash
        run: |
          set -euo pipefail
          go -C developer/tests test ./engines -run '^(TestRegisteredManifestContractBindingAndIndependentOwnerClosure|TestPostB5CapabilityVersions|TestWithdrawnCTRLReleaseAdmissionPolicyAbsent)$' -count=1
  native-engine-contract-smoke:
    name: "Native contract / ${{ matrix.engine }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [validation, projection]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Test exact registered Rust engine implementation
        shell: bash
        run: cargo test --locked --manifest-path "src/ptsip/engines/${{ matrix.engine }}/Cargo.toml"
