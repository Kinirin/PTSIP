# Non-publishing CI verification of the approved Release Admission design projection.
name: release-admission-contract-check
on:
  push:
    branches: [main]
    paths:
      - '.ptsip/contracts/release/**'
      - '.ptsip/engine/developer/release/**'
      - '.ptsip/engine/developer/main.go'
      - '.github/test_modes.json'
      - '.github/verification-retirement.json'
      - 'developer/policy/approvals/MPA-202610*-RELEASE-*.yaml'
      - 'developer/policy/approvals/MPA-202610*-E*.yaml'
      - '.github/workflows/tooling-release.yml'
      - '.github/workflows/release-admission-contract-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ptsip/engine/developer/go.mod
      - name: Execute Release Admission negative tests
        shell: bash
        run: go -C .ptsip/engine/developer test ./release -count=1
      - name: Check approval-bound machine contract (not publication)
        shell: bash
        run: |
          set -euo pipefail
          go -C .ptsip/engine/developer run . --validator release-admission-check --root "$GITHUB_WORKSPACE" > /tmp/admission-design-report.json
          cat /tmp/admission-design-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/admission-design-report.json').read_text())
          assert report['status'] == 'DESIGN_CONTRACT_CONSISTENT'
          assert report['contract_validation'] == 'APPROVED_PROVENANCE_BINDINGS_MATCH'
          assert report['publication_authorized'] is False
          assert report['release_verification'] == 'NOT_ASSERTED'
          assert report['approved_error_directions_checked'] == 14
          assert report['common_directions_checked'] == 5
          print('Design projection verified; normative policy and publication remain BLOCKED.')
          PY
