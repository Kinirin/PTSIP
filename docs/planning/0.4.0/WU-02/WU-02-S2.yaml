    - src/ptsip/remediation/solution/__init__.py
    - src/ptsip/remediation/solution/engine.py
    - src/ptsip/remediation/domain/model.py
    - src/ptsip/remediation/rules/contract.py
  additional_path_rule: REQUEST_INTEGRATION_HANDOFF_DO_NOT_EDIT_DIRECTLY

non_goals:
