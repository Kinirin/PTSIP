policy_class: PTSIP_DEVELOPER_POLICY
plan_version: 0.4.0

record:
  id: WU-02-S1
  kind: PARALLEL_WORK_LANE
  title: Semantic Interpretation + Candidate Generation
  status: ACTIVE
  parent_work_unit: WU-02
  branch: dev/0.4.0-WU-02-S1
  base_branch: dev/0.4.0
  authority: PROJECT_OWNER
  implementation_authorization: AUTHORIZED
  integration_target: dev/0.4.0

branch_baseline:
  canonical_plan_source: CENTRAL_CONTROL_PLANE
  control_plane_branch: dev/0.4.0
  synchronization: MUST_START_FROM_CURRENT_CENTRAL_CONTROL_PLANE_REVISION_BEFORE_IMPLEMENTATION
  lane_plan_is_canonical_on_control_plane: true
  synchronized_control_plane_sha: fb247d55c04cb0ff7c859b6210b18dd04cfae83d

responsibility:
  primary: SEMANTIC_INTERPRETATION_AND_CANDIDATE_GENERATION
  question_owned: WHAT_LEGAL_SEMANTIC_INTERPRETATIONS_AND_TARGETS_ARE_POSSIBLE
  outputs:
    - SemanticCandidate
    - CANDIDATE_GENERATION_DIAGNOSTICS
  must_preserve:
    - OBSERVED_CLASSIFICATION_DOES_NOT_BY_ITSELF_PROVE_VIOLATION
    - PRODUCT_LOCATION_OR_MEMBERSHIP_DOES_NOT_BY_ITSELF_PROVE_REMOVAL_IS_REQUIRED
    - CANDIDATES_MAY_REPRESENT_CONFORMANT_OR_NON_REMEDIATION_INTERPRETATIONS_WHEN_SUPPORTED
    - CANDIDATE_OUTPUT_IS_NOT_PROJECT_AUTHORITY
    - TOOL_MUST_NOT_INVENT_PROJECT_INTENT

approved_example_boundary:
  observed_state: DEVELOPMENT_TOOLING_ASSOCIATED_WITH_PRODUCT_CONTEXT
  interpretations_may_include:
    - ACCIDENTAL_PRODUCT_ARTIFACT_INCLUSION
    - NON_SHIPPED_REPOSITORY_COLOCATION
    - INTENTIONAL_PRODUCT_HOSTED_TOOLING
    - CLASSIFICATION_OR_BOUNDARY_CONFLICT_REQUIRING_FURTHER_EVIDENCE_OR_AUTHORITY
  rule: NO_INTERPRETATION_MAY_BE_PROMOTED_TO_FACT_WITHOUT_SUPPORTING_EVIDENCE_RULE_OR_CURRENT_AUTHORITY

approved_contract_design:
  normative_architecture:
    language_runtime_os_tool_neutral: true
    binding_rule: LANGUAGE_BINDINGS_MUST_NOT_ADD_SEMANTIC_RULES
    canonical_layers:
      - CANONICAL_IDENTITY_REGISTRY
      - CANONICAL_SCHEMA
      - CANONICAL_INVARIANTS
      - GENERATED_BINDINGS
    registry_does_not_define_object_shape: true
    schema_does_not_duplicate_identity_grammar: true
    invariants_do_not_duplicate_registry_or_schema_definitions: true
    policy_ref: MPD-0010

  candidate_provenance:
    semantic_candidate_shape:
      fields:
        - id
        - rule_id
        - remediation_family
        - target_state
        - provenance
    provenance_type: CandidateProvenance
    interpretation_id:
      grammar: 'interpretation:<RULE_ID>:<LOCAL_INTERPRETATION_ID>'
      rule_scoped: true
      forbidden_meanings:
        - TARGET
        - SUPPORT_COUNT
        - CONFIDENCE
        - RANKING
        - AUTHORITY
        - ELIMINATION
        - OUTCOME
    supporting_rules:
      producer_rule_field: SemanticCandidate.rule_id
      consumed_rule_set: CandidateProvenance.supporting_references.RULE
      producer_rule_must_appear_in_consumed_rule_set: true
      only_consumed_rules_are_included: true
      duplicate_rule_refs_forbidden: true
    fact_support:
      candidate_direct_raw_evidence_reference: FORBIDDEN
      support_path:
        - SOURCE_OBSERVATION
        - NORMALIZED_EVIDENCE
        - CANONICAL_FACT
        - CANDIDATE_PROVENANCE_FACT_REFERENCE
        - SEMANTIC_CANDIDATE
    authority_support:
      model: DUAL_CHANNEL_SPARSE_CANONICAL
      consumed_authority:
        canonical_location: CandidateProvenance.supporting_references.AUTHORITY
        semantics: ACTUALLY_CONSUMED_CURRENT_PROJECT_AUTHORITY_ONLY
        requirements:
          - AUTHORITY_MUST_EXIST
          - AUTHORITY_MUST_BE_CURRENTLY_ELIGIBLE_FOR_PROJECT_AUTHORITY_PROJECTION
          - AUTHORITY_MUST_BE_SUBJECT_APPLICABLE
          - AUTHORITY_MUST_BE_MATERIALLY_CONSUMED_BY_CURRENT_SOLVE
        excludes:
          - AVAILABLE_BUT_UNUSED_AUTHORITY
          - ADVISORY_AUTHORITY
          - UNRESOLVED_AUTHORITY
        consumed_identity_enters_fresh_solve_binding: true
      required_authority:
        canonical_location: CandidateProvenance.authority_requirements
        semantics: UNSATISFIED_PROJECT_AUTHORITY_REQUIREMENT_FOR_CANDIDATE_SEMANTIC_OR_PROJECT_INTENT_RESOLUTION
        authority_requirement_shape:
          - requirement_id
          - subject_binding
          - required_effects
        rules:
          future_authority_id_guessing: FORBIDDEN
          desired_owner_answer_field: FORBIDDEN
          mutation_authorization_semantics: FORBIDDEN
          subject_binding_must_be_explicit: true
          required_effects_must_be_machine_readable: true
          unsupported_extension_requirement_blocks_unrelated_development: false
      satisfaction:
        requires:
          - CURRENTLY_ELIGIBLE_FOR_PROJECT_AUTHORITY_PROJECTION
          - SUBJECT_MATCH
          - REQUIRED_EFFECTS_SUBSET_OF_AUTHORITY_EFFECTS
        semantic_similarity_or_llm_inference: FORBIDDEN
        satisfied_requirement_retained_as_current_unsatisfied_requirement: false
      sparse_current_state:
        consumed_authorities_record_only_actual_usage: true
        authority_requirements_record_only_currently_unsatisfied_requirements: true
        separate_authority_status_field_required: false

  canonical_fact:
    shape:
      - id
      - subject_ref
      - predicate_id
      - value
      - derivation_bases
    id_grammar: 'fact:<SEMANTIC_DIGEST>'
    identity_payload:
      - subject_ref
      - predicate_id
      - canonical_value
    identity_excludes:
      - derivation
      - evidence
      - solve_id
      - timestamp
      - implementation_language
    same_semantics_different_provenance_same_fact_id: true
    historical_comparison_requires_explicit_separate_contract: true

  subject_and_predicate:
    subject_registry:
      root: SUBJECT
      root_direct_reference_forbidden: true
      initial_concrete_families:
        - SUBJECT.COMPONENT
        - SUBJECT.ARTIFACT
        - SUBJECT.PACKAGE
        - SUBJECT.PROJECT
        - SUBJECT.DEPENDENCY
      predicate_applicability_is_explicit_per_concrete_kind: true
      default_wildcard: FORBIDDEN
    predicate_registry:
      id_grammar: 'predicate:<OPAQUE_TOKEN>'
      immutable_semantics_per_identity: true
      semantic_change_requires_new_identity: true
      human_label_normative: false
      subject_compatibility_explicit: true
      predicate_owns_value_schema_ref: true

  canonical_value_system:
    arbitrary_native_object_or_free_json: FORBIDDEN
    closed_value_algebra:
      - SCALAR.BOOLEAN
      - SCALAR.INTEGER
      - SCALAR.DECIMAL
      - SCALAR.TEXT
      - REFERENCE.IDENTITY
      - ENUM.CLOSED
      - COLLECTION.ORDERED
      - COLLECTION.UNORDERED
      - STRUCTURE.RECORD
    generic_float_preferred: false
    canonical_decimal_required_for_decimal_semantics: true
    generic_null_must_not_encode_unknown_unset_or_not_applicable: true
    fact_must_not_duplicate_value_type_or_schema_ref: true

  derivation_system:
    layers:
      - CORE_CLOSED_CANONICAL_DERIVATION_ALGEBRA
      - REGISTERED_DETERMINISTIC_EXTENSION_CONTRACT
    derivation_id_grammar: 'derivation:<OPAQUE_TOKEN>'
    implementation_is_not_authority: true
    arbitrary_custom_code_as_normative_derivation: FORBIDDEN
    changing_external_state_must_enter_as_evidence_first: true
    unsupported_unregistered_or_nonconformant: FAIL_CLOSED
    derivation_basis:
      fields:
        - derivation_id
        - binding_ref
        - evidence_bindings
      evidence_bindings_model: 'CanonicalMapping<CanonicalInputRoleIdentity,CanonicalEvidenceReferenceCollection>'
      evidence_input_wrapper_object: FORBIDDEN
      evidence_role_binding_wrapper_object: FORBIDDEN
    binding:
      id_grammar: 'binding:<OPAQUE_IMMUTABLE_TOKEN>'
      fields:
        - binding_id
        - derivation_id
        - parameter_values
      parameter_schema_owned_by_derivation_registry: true
      evidence_or_authority_hidden_in_binding: FORBIDDEN
      binding_excluded_from_fact_semantic_identity: true
      parameterless_derivation_uses_canonical_zero_parameter_binding: true

  canonical_input_role:
    role_id_grammar: 'role:<OPAQUE_IMMUTABLE_TOKEN>'
    globally_direct_resolvable: true
    scoped_to_exactly_one_derivation: true
    owns:
      - derivation_scope
      - target_ref
      - min_count
      - max_count
      - allowed_evidence_kinds
    role_local_properties_must_not_be_repeated_in_derivation_contract: true
    cross_role_relations_owned_by_derivation_invariants: true
    min_count:
      type: NON_NEGATIVE_CANONICAL_INTEGER
    max_count:
      type: NON_NEGATIVE_CANONICAL_INTEGER_OR_UNBOUNDED
      unbounded_token: UNBOUNDED

  evidence_bindings:
    collection_semantics: ORDERED_UNIQUE
    declared_order_is_canonical_order: true
    declared_order_does_not_imply_authority_confidence_trust_or_ranking: true
    derivation_may_consume_or_ignore_order_by_explicit_semantics: true
    same_role_duplicate_evidence_identity: FORBIDDEN
    cross_role_same_evidence_identity: ALLOWED_BY_DEFAULT
    cross_role_reuse_has_no_implicit_authority_confidence_or_priority: true
    cross_role_restriction_requires_explicit_derivation_invariant: true
    absent_role_effective_count: 0
    materialized_role_binding_minimum_evidence_count: 1
    explicit_empty_collection_in_canonical_source: FORBIDDEN
    effective_count_must_satisfy_role_cardinality: true

  evidence_kind_policy:
    core_closed_vocabulary:
      - EVIDENCE_KIND.OBSERVED
      - EVIDENCE_KIND.DECLARED
      - EVIDENCE_KIND.DERIVED
      - EVIDENCE_KIND.EXPLICIT_HUMAN_INPUT
    excluded_as_initial_core_kind:
      - IMPORTED
      - GENERATED
      - INFERRED
      - AUTHORITY
    allowed_selector_forms:
      - EXACT
      - PATTERN
    core_kind_reference_mode: EXACT_ONLY
    pattern:
      scope: EXTENSION_COMMUNITY_OR_USER_NAMESPACE_ONLY
      grammar: TERMINAL_NAMESPACE_PREFIX_WILDCARD_ONLY
      regex: FORBIDDEN
      arbitrary_glob: FORBIDDEN
      semantic_similarity_matching: FORBIDDEN
      registration_bypass: FORBIDDEN
      unknown_pattern_grammar: FAIL_CLOSED
      compatibility_guarantee: false
      maintenance_owner: EXTENSION_OWNER

  evidence_target:
    canonical_shape:
      - target_id
      - target_class
      - access_contract_ref
      - parent_ref
    optional_fields:
      - parent_ref
    target_class:
      values:
        - ABSTRACT
        - CONCRETE
    concrete:
      direct_role_target_allowed: true
      access_contract_ref: REQUIRED
    abstract:
      direct_role_target_allowed: false
      access_contract_ref: FORBIDDEN
    parent_ref_semantics: CLASSIFICATION_ONLY
    parent_ref_does_not_imply:
      - COMPATIBILITY
      - AUTHORITY_INHERITANCE
      - ACCESS_BEHAVIOR_INHERITANCE
    fields_excluded_from_target_contract:
      - registration_ref
      - allowed_evidence_kinds
      - cardinality
      - authority
      - compatibility_refs
      - human_metadata
      - runtime_implementation
    generated_runtime_projection:
      key: target_id
      value: resolved_access_binding

  evidence_target_access_contract:
    canonical_shape:
      access_contract_id: REQUIRED
      primitive_composition:
        composition_ref: REQUIRED
        primitive_refs: REQUIRED
    target_reverse_reference: FORBIDDEN
    duplicated_input_output_contracts: FORBIDDEN
    per_contract_failure_policy: FORBIDDEN
    per_contract_determinism_class: FORBIDDEN
    registration_or_governance_fields: FORBIDDEN
    runtime_implementation_fields: FORBIDDEN

  canonical_access_primitive:
    canonical_shape:
      - primitive_id
      - input_schema_ref
      - output_schema_ref
      - operation_semantics_ref
      - failure_semantics_ref
      - conformance_vectors_ref
    responsibility_model: SIX_RESPONSIBILITY_MODEL
    responsibility_rules:
      input_schema_ref: DEFINES_CANONICAL_ACCEPTED_REPRESENTATION_NOT_OPERATION_MEANING
      output_schema_ref: DEFINES_CANONICAL_SUCCESSFUL_OUTPUT_REPRESENTATION_NOT_FAILURE_REPRESENTATION
      operation_semantics_ref: DEFINES_NORMATIVE_SUCCESSFUL_TRANSFORMATION_SEMANTIC_PRECONDITIONS_AND_SEMANTIC_GUARANTEES
      failure_semantics_ref: DEFINES_CANONICAL_SEMANTIC_FAILURE_STATES_AND_TRIGGERING_CONDITIONS_WITHOUT_REDEFINING_GLOBAL_FAIL_CLOSED_POLICY
      conformance_vectors_ref: PROVIDES_MACHINE_VERIFIABLE_SUCCESS_AND_FAILURE_EXAMPLES_WITHOUT_CREATING_OR_OVERRIDING_NORMATIVE_SEMANTICS
    outside_contract:
      - TARGET_IDENTITY
      - COMPOSITION_OR_ORDER
      - RUNTIME_IMPLEMENTATION
      - LANGUAGE_OS_OR_TOOL_BINDING
      - PROJECT_AUTHORITY
      - RANKING_OR_CONFIDENCE
      - REGISTRATION_OR_GOVERNANCE_METADATA
      - PER_INSTANCE_EXECUTION_STATE
    generated_bindings_must_not_add_remove_or_reinterpret_semantics: true
    unresolved_reference_undeclared_failure_interface_mismatch_or_semantic_conformance_conflict: FAIL_CLOSED
    ref_minimum_interface_shapes:
      operation_semantics_ref:
        interface: OPERATION_SEMANTICS_INTERFACE
        ownership_model: DIRECT_DECLARATIVE
        required_fields:
          - operation_semantics_id
          - semantic_preconditions
          - transformation
          - semantic_guarantees
        boundaries:
          semantic_preconditions: SEMANTIC_VALIDITY_NOT_INPUT_SCHEMA_VALIDATION
          transformation: NORMATIVE_SEMANTIC_TRANSFORMATION_NOT_RUNTIME_IMPLEMENTATION
          semantic_guarantees: SUCCESSFUL_OPERATION_POSTCONDITIONS
          failure_semantics: EXCLUDED_OWNED_BY_FAILURE_SEMANTICS_REF
          conformance_vectors: EXCLUDED_OWNED_BY_CONFORMANCE_VECTORS_REF
        nested_transformation_ref_required: false
      failure_semantics_ref:
        interface: FAILURE_SEMANTICS_INTERFACE
        ownership_model: DIRECT_FAILURE_SET
        required_fields:
          - failure_semantics_id
          - failures
        failures_cardinality: ZERO_OR_MORE
        failure_case_required_fields:
          - failure_id
          - triggering_condition
          - semantic_result
        common_empty_failure_contract:
          required: true
          semantics: NO_DECLARED_PRIMITIVE_SEMANTIC_FAILURES
          identity: OPAQUE_IMMUTABLE_EXACTLY_RESOLVABLE
          reusable_across_primitives: true
        boundaries:
          triggering_condition: LANGUAGE_RUNTIME_OS_TOOL_NEUTRAL_SEMANTIC_CONDITION
          semantic_result: CANONICAL_SEMANTIC_FAILURE_MEANING
          runtime_exception_names_as_normative_failure_identity: FORBIDDEN
          undeclared_runtime_failure: GLOBAL_FAIL_CLOSED
          unresolved_failure_semantics_ref: GLOBAL_FAIL_CLOSED
          operation_success_semantics: EXCLUDED_OWNED_BY_OPERATION_SEMANTICS_REF
          conformance_vectors: EXCLUDED_OWNED_BY_CONFORMANCE_VECTORS_REF
          global_fail_closed_policy: NOT_REDEFINED_HERE
      conformance_vectors_ref:
        interface: CONFORMANCE_VECTOR_SET_INTERFACE
        ownership_model: SELF_BOUND_DIRECT_WITH_BOUNDED_EXTENSION_POINT
        required_fields:
          - vector_set_id
          - contract_binding
          - vectors
        contract_binding_required_fields:
          - input_schema_ref
          - output_schema_ref
          - operation_semantics_ref
          - failure_semantics_ref
        vector_required_fields:
          - vector_id
          - input
          - expected_result
        expected_result:
          tagged_union:
            SUCCESS:
              required:
                - output
            FAILURE:
              required:
                - failure_id
          unknown_or_malformed_form: FAIL_CLOSED
        bounded_extension_point:
          field: extensions.assertion_refs
          presence: OPTIONAL_WHEN_NONEMPTY
          required_interface: REGISTERED_MACHINE_READABLE_ASSERTION_INTERFACE
          may_add_or_override_base_normative_semantics: false
          may_override_expected_result: false
          unsupported_behavior: EXPLICIT_UNSUPPORTED_EXTENSION_CAPABILITY_SCOPED_TO_EXTENSION
          silent_mapping_to_core_semantics: FORBIDDEN
        inference_cost_rules:
          self_bound_contract_refs_reduce_parent_lookup: true
          per_vector_schema_ref_duplication: FORBIDDEN
          failure_semantic_result_duplication_in_vector: FORBIDDEN
          failure_vector_references_failure_id_only: true
          vector_id_required_for_stable_machine_diagnostics: true
          vector_order_implies_authority_confidence_or_ranking: false
        extension_rules:
          official_and_registered_extension_contracts_use_same_base_interface: true
          distinct_extension_identity_required: true
          extension_owner_retains_conformance_and_maintenance_responsibility: true
          unsupported_extension_must_not_be_inferred_as_core_semantics: true
          unsupported_extension_must_not_block_unrelated_development: true
        normative_boundaries:
          conformance_vectors_define_new_semantics: false
          vectors_must_conform_to_bound_schema_operation_and_failure_contracts: true
          success_output_must_conform_to_output_schema_ref: true
          failure_id_must_exist_in_bound_failure_semantics_ref: true
          input_must_conform_to_input_schema_ref: true
          contract_binding_mismatch: FAIL_CLOSED
          runtime_implementation_details: FORBIDDEN
      input_schema_ref:
        interface: EXISTING_CANONICAL_SCHEMA_CONTRACT
        reuse: REQUIRED
        access_primitive_specific_schema_interface: FORBIDDEN_WITHOUT_PROVEN_CAPABILITY_GAP
        responsibilities:
          - DEFINE_CANONICAL_ACCEPTED_VALUE_REPRESENTATION
          - RESOLVE_EXACTLY_UNDER_EXISTING_SCHEMA_REFERENCE_RULES
          - PRESERVE_EXISTING_CANONICAL_VALUE_AND_EXTENSION_SEMANTICS
        boundaries:
          operation_semantics: EXCLUDED
          failure_semantics: EXCLUDED
          runtime_implementation: EXCLUDED
      output_schema_ref:
        interface: EXISTING_CANONICAL_SCHEMA_CONTRACT
        reuse: REQUIRED
        access_primitive_specific_schema_interface: FORBIDDEN_WITHOUT_PROVEN_CAPABILITY_GAP
        responsibilities:
          - DEFINE_CANONICAL_SUCCESSFUL_OUTPUT_VALUE_REPRESENTATION
          - RESOLVE_EXACTLY_UNDER_EXISTING_SCHEMA_REFERENCE_RULES
          - PRESERVE_EXISTING_CANONICAL_VALUE_AND_EXTENSION_SEMANTICS
        boundaries:
          operation_semantics: EXCLUDED
          failure_semantics: EXCLUDED
          runtime_implementation: EXCLUDED
      schema_reuse_rationale:
        canonical_value_algebra_already_covers:
          - SCALAR.BOOLEAN
          - SCALAR.INTEGER
          - SCALAR.DECIMAL
          - SCALAR.TEXT
          - REFERENCE.IDENTITY
          - ENUM.CLOSED
          - COLLECTION.ORDERED
          - COLLECTION.UNORDERED
          - STRUCTURE.RECORD
        reusable_complex_values_use: SCHEMA_REFERENCE
        extension_atomic_values_use_existing_core_backed_or_custom_atomic_contracts: true
        access_primitive_specific_schema_layer_would_duplicate_existing_semantics: true
        future_general_schema_refinement_belongs_to_shared_schema_layer: true

  canonical_access_primitive_identity_and_versioning:
    primitive_id_semantic_binding:
      exact_refs:
        - input_schema_ref
        - output_schema_ref
        - operation_semantics_ref
        - failure_semantics_ref
      conformance_vectors_ref_in_semantic_identity: false
      primitive_id_encoding: OPAQUE_NOT_DERIVED_FROM_REF_TEXT
    identity_change_rules:
      any_exact_semantic_ref_change_requires_new_primitive_id: true
      semantic_change_behind_same_ref: FORBIDDEN
      conformance_vector_coverage_change_requires_new_primitive_id: false
      changed_conformance_vector_set_requires_new_vector_set_id: true
      conformance_change_that_exposes_semantic_change_requires_semantic_contract_change_and_new_primitive_id: true
      undeclared_semantic_equivalence_between_distinct_refs: FORBIDDEN
    immutable_resolution:
      primitive_record_is_immutable_within_bound_canonical_specification_or_extension_registry_revision: true
      same_primitive_id_may_reference_newer_conformance_vector_set_only_in_a_new_immutable_bound_revision_when_semantic_refs_are_unchanged: true
      in_place_mutation_without_new_bound_revision: FORBIDDEN
    duplicate_identity_control:
      duplicate_official_core_primitive_identities_for_same_exact_semantic_quartet: FORBIDDEN_WITHOUT_EXPLICIT_ALIAS_OR_MIGRATION_CONTRACT
      extension_identity_may_be_distinct: true
      extension_identity_does_not_imply_core_equivalence_or_compatibility: true

  composition:
    access_contract_composition_shape:
      - composition_ref
      - primitive_refs
    composition_id_grammar: 'composition:<OPAQUE_IMMUTABLE_TOKEN>'
    generated_dispatch: REQUIRED
    generated_dispatch_is_authority: false
    canonical_composition_contract:
      fields:
        - composition_id
        - execution_form
        - operand_schema_ref
    closed_execution_algebra:
      - SEQUENCE
    sequence_semantics:
      operands_ordered: true
      first_operand_receives_external_input: true
      each_output_feeds_next_input: true
      final_operand_output_is_composition_output: true
      adjacent_contracts_must_be_compatible: true
      failure: FAIL_CLOSED
    schema_compatibility_validation:
      decision_authority_layer: CANONICAL_SCHEMA_COMPATIBILITY
      enforcement_owner_layer: ACCESS_CONTRACT_COMPOSITION
      generated_or_runtime_projection_is_authority: false
      direction: OUTPUT_SCHEMA_TO_NEXT_INPUT_SCHEMA
      fast_path:
        identical_schema_ref: COMPATIBLE
      distinct_schema_refs:
        explicit_machine_readable_compatibility_required: true
        structural_similarity_inference: FORBIDDEN
        semantic_similarity_inference: FORBIDDEN
        natural_language_or_llm_inference: FORBIDDEN
        implicit_transitive_compatibility: FORBIDDEN
      outcomes:
        - COMPATIBLE
        - INCOMPATIBLE
        - UNRESOLVED
        - UNSUPPORTED_EXTENSION
      sequence_acceptance:
        COMPATIBLE: ACCEPT
        INCOMPATIBLE: REJECT
        UNRESOLVED: FAIL_CLOSED_FOR_DEPENDENT_SEQUENCE_EDGE
        UNSUPPORTED_EXTENSION: FAIL_CLOSED_FOR_DEPENDENT_SEQUENCE_EDGE
      extension_boundary:
        registered_machine_readable_compatibility_extension_allowed: true
        unsupported_extension_must_be_explicit: true
        unsupported_extension_must_not_be_silently_mapped_to_core: true
        unsupported_extension_must_not_block_unrelated_development: true
      physical_registry_topology_fixed: false

  collection_value_schema:
    shape:
      - kind
      - element_contract
      - min_count
      - max_count
    optional_when_nonempty_only:
      - extensions.constraint_refs
    explicit_empty_extensions_in_canonical_source: FORBIDDEN
    missing_extensions_normalizes_to_empty_runtime_collection: true
    duplicate_policy_core_field: FORBIDDEN
    element_contract_tagged_union:
      - INLINE_CANONICAL_TYPE
      - SCHEMA_REFERENCE
    inline_core_atomic_representations:
      - SCALAR.BOOLEAN
      - SCALAR.INTEGER
      - SCALAR.DECIMAL
      - SCALAR.TEXT
      - REFERENCE.IDENTITY
    inline_extension_category:
      - EXTENSION.INLINE
    complex_or_reusable_element_default: SCHEMA_REFERENCE
    min_count_type: NON_NEGATIVE_CANONICAL_INTEGER
    max_count_type: NON_NEGATIVE_CANONICAL_INTEGER_OR_UNBOUNDED
    unbounded_token: UNBOUNDED

  extension_inline:
    modes:
      - CORE_BACKED
      - CUSTOM_ATOMIC
    core_backed:
      representation_kind_required: true
      representation_contract_ref_forbidden: true
    custom_atomic:
      representation_contract_ref_required: true
      representation_kind_forbidden: true
      extension_owner_bears_semantic_implementation_inference_maintenance_and_revalidation_cost: true
    canonical_atomic_representation_contract:
      fixed_current_fields:
        - representation_contract_id
        - validation_ref
        - canonicalization_ref
        - canonical_serialization_ref
        - conformance_vectors_ref
      validation_and_canonicalization_are_separate_responsibilities: true
      validation_failure: FAIL_CLOSED
      invalid_input_repair_by_canonicalization: FORBIDDEN
      canonicalization_idempotent: true
      reference_registry_topology_fixed_now: false
      reference_requirements:
        validation_ref: VALIDATION_INTERFACE
        canonicalization_ref: CANONICALIZATION_INTERFACE
        canonical_serialization_ref: CANONICAL_SERIALIZATION_INTERFACE
        conformance_vectors_ref: CONFORMANCE_VECTOR_SET_INTERFACE
      common_reference_rules:
        - OPAQUE_IMMUTABLE_IDENTITY
        - EXACT_RESOLUTION
        - EXPECTED_INTERFACE_MATCH
        - UNRESOLVED_UNSUPPORTED_OR_MISMATCH_FAILS_CLOSED
        - UNDECLARED_COMPATIBILITY_MUST_NOT_BE_INFERRED

  registry_and_runtime_efficiency:
    registry_resolution_budget:
      - EXACT_BOUNDED_LOOKUP_ONLY
      - NO_FULL_REGISTRY_SCAN
      - NO_SEMANTIC_SIMILARITY_SEARCH
      - NO_HISTORY_OR_GIT_TRAVERSAL_FOR_RUNTIME_SEMANTICS
      - NO_DOCUMENTATION_LOOKUP_FOR_RUNTIME_SEMANTICS
      - NO_INTERPRETIVE_FALLBACK_CANDIDATE_SELECTION
    canonical_source_representation: SPARSE_WHERE_SEMANTICALLY_UNAMBIGUOUS
    generated_runtime_projection: DENSE_OR_PRECOMPILED_WHERE_USEFUL
    repeated_runtime_registry_traversal: AVOID
    machine_explicit_reference_duplication_allowed_when_it_reduces_semantic_inference_cost: true

  extension_and_compatibility:
    extension_freedom_does_not_imply_core_identity_reuse: true
    extension_freedom_does_not_imply_compatibility_guarantee: true
    modified_official_core_semantics_require_distinct_extension_identity: true
    official_core_semantics_immutable_within_bound_canonical_specification_revision: true
    cross_version_backward_or_forward_compatibility_automatic_guarantee: false
    absent_explicit_compatibility_must_not_be_treated_as_compatibility: true
    extension_owner_responsibilities:
      - MAINTENANCE
      - REVALIDATION
      - MIGRATION_RESPONSE
      - SEMANTIC_COMPATIBILITY_CONFIRMATION
    promotion_to_official_core_uses_new_official_identity: true
    feedback_or_popularity_is_refinement_evidence_not_authority: true

  refinement:
    strategy: EVIDENCE_DRIVEN_CONTRACT_REFINEMENT
    refine_when:
      - REPEATED_SEMANTIC_INFERENCE
      - REPEATED_HUMAN_INTERVENTION
      - RECURRING_CUSTOM_WORKAROUNDS
      - REPEATED_EXTENSION_PATTERNS
      - ACCUMULATED_USER_FEEDBACK_OR_DATA
    stop_when_additional_subdivision_no_longer_has_WORTHWHILE_CLARITY_OR_EFFICIENCY_BENEFIT: true
    stop_is_permanent_closure: false
    may_reopen_on_new_evidence: true

