      - PROJECT_EXTERNAL_INPUT_PTSIP_OR_NONE_RESPONSIBILITY_CLASSIFICATION
      - MACHINE_READABLE_BLOCKING_REASON_REFERENCES
    does_not_own:
      - RECOVERY_SEMANTIC_MATERIALIZATION
      - CANDIDATE_PROVENANCE_SEMANTICS
      - AUTHORITY_REQUIREMENT_SEMANTICS
      - PROJECT_AUTHORITY
      - ELIMINATION_AUTHORITY
      - MUTATION_AUTHORIZATION
  ordering:
    - RESOLUTION_CLASSIFICATION_MUST_NOT_DECLARE_TERMINAL_TOOL_CAPABILITY_GAP_BEFORE_REQUIRED_CAPABILITY_RECOVERY_IS_EXHAUSTED
    - SUCCESSFUL_RECOVERY_REQUIRES_FRESH_SOLVE_BEFORE_FINAL_RESOLUTION_CLASSIFICATION
    - RECOVERY_AND_RESOLUTION_MUST_REMAIN_SEPARATE_CANONICAL_RESPONSIBILITIES_EVEN_WHEN_IMPLEMENTED_IN_ONE_WORK_UNIT
  automation_requirement:
    required: true
    rules:
      - BOTH_RESPONSIBILITIES_MUST_HAVE_MACHINE_READABLE_INPUTS_OUTPUTS_AND_FAILURES
      - NO_LLM_OR_NATURAL_LANGUAGE_INTERPRETATION_MAY_BE_REQUIRED_FOR_NORMAL_EXECUTION
      - EXACT_BOUNDED_REFERENCE_RESOLUTION_IS_REQUIRED
      - UNRESOLVED_REQUIRED_SEMANTICS_FAIL_CLOSED_ONLY_FOR_THE_DEPENDENT_OPERATION

canonical_capability:
  status: PROJECT_OWNER_APPROVED
  purpose: DIRECTLY_IDENTIFY_WHAT_CAPABILITY_IS_REQUIRED_HOW_PROVIDER_CONFORMANCE_IS_PROVEN_WHEN_IT_IS_SATISFIED_AND_WHICH_SINGLE_OFFICIAL_RECOVERY_PLAN_APPLIES
  canonical_shape:
    - capability_id
    - required_interface_ref
    - satisfaction_semantics_ref
    - recovery_plan_ref
  field_responsibilities:
    capability_id:
      semantics: OPAQUE_IMMUTABLE_EXACTLY_RESOLVABLE_CAPABILITY_IDENTITY
      reuse:
        - MPD_0010_CANONICAL_IDENTITY_RULES
        - SAME_IDENTITY_SAME_NORMATIVE_SEMANTICS
        - SEMANTIC_CHANGE_REQUIRES_NEW_IDENTITY
    required_interface_ref:
      semantics: EXACT_REFERENCE_TO_THE_CANONICAL_INTERFACE_A_PROVIDER_MUST_CONFORM_TO_IN_ORDER_TO_SATISFY_THIS_CAPABILITY
      rules:
        - EXPECTED_INTERFACE_MATCH_REQUIRED
        - NO_PROVIDER_ELIGIBILITY_BY_NATURAL_LANGUAGE_OR_LLM_INFERENCE
        - BOUNDED_EXPLICIT_REFERENCE_DUPLICATION_IS_ALLOWED_WHEN_IT_REDUCES_AGENT_LOOKUP_AND_REASONING_COST
    satisfaction_semantics_ref:
      semantics: EXACT_REFERENCE_TO_MACHINE_DECIDABLE_SEMANTICS_FOR_WHETHER_THE_CAPABILITY_IS_CURRENTLY_SATISFIED
      required_interface: CAPABILITY_SATISFACTION_INTERFACE
      interface_status: PROJECT_OWNER_APPROVED
      boundaries:
        - MUST_NOT_BE_REPLACED_BY_OPERATION_SEMANTICS_INTERFACE_UNLESS_RESPONSIBILITY_EQUIVALENCE_IS_PROVEN
        - MUST_NOT_BE_REPLACED_BY_VALUE_OR_SCHEMA_VALIDATION_SEMANTICS
        - MUST_NOT_REQUIRE_LLM_OR_NATURAL_LANGUAGE_INTERPRETATION
        - UNRESOLVED_UNSUPPORTED_OR_INTERFACE_MISMATCH_FAILS_CLOSED_FOR_THE_DEPENDENT_OPERATION_ONLY
    recovery_plan_ref:
      semantics: EXACT_DIRECT_REFERENCE_TO_THE_ONE_OFFICIAL_CORE_RECOVERY_PLAN_FOR_THIS_CAPABILITY
      cardinality: EXACTLY_ONE
      rules:
        - NORMAL_CORE_EXECUTION_MUST_NOT_SELECT_AMONG_MULTIPLE_RECOVERY_PLANS
        - NORMAL_CORE_EXECUTION_MUST_NOT_SCAN_FOR_A_RECOVERY_PLAN
        - RECOVERY_PLAN_NORMATIVE_CHANGE_CHANGES_CANONICAL_CAPABILITY_SEMANTICS_AND_REQUIRES_A_NEW_CAPABILITY_IDENTITY
  explicitly_excluded_fields:
    conformance_vectors_ref:
      reason: EXISTING_CONFORMANCE_VECTOR_SET_INTERFACE_IS_SELF_BOUND_TO_INPUT_OUTPUT_OPERATION_AND_FAILURE_CONTRACTS_AND_IS_NOT_SEMANTICALLY_EQUIVALENT_TO_CAPABILITY_SATISFACTION
      rule: DO_NOT_REUSE_AN_EXISTING_INTERFACE_BY_SHAPE_SIMILARITY_WHEN_RESPONSIBILITY_DOES_NOT_MATCH
  priority_alignment:
    priority_1_coding_agent_inference_cost:
      - CAPABILITY_RESOLVES_DIRECTLY_TO_REQUIRED_INTERFACE_SATISFACTION_SEMANTICS_AND_ONE_OFFICIAL_RECOVERY_PLAN
      - NO_NORMAL_PATH_BINDING_SELECTION_OR_PLAN_SELECTION
      - EXACT_BOUNDED_LOOKUP_ONLY
    priority_2_independent_extension:
      - EXTENSION_MUST_USE_DISTINCT_IDENTITY
      - EXTENSION_MUST_NOT_MODIFY_OR_IMPERSONATE_CORE_CAPABILITY_SEMANTICS
      - EXTENSION_RECOVERY_MAY_EXIST_BEHIND_A_SEPARATE_EXACT_INDEXED_REGISTRATION_BOUNDARY
      - EXTENSION_RECOVERY_LOOKUP_MUST_NOT_BE_PAID_ON_THE_NORMAL_CORE_PATH
      - UNSUPPORTED_EXTENSION_RECOVERY_BLOCKS_ONLY_THE_DEPENDENT_OPERATION_OR_VALIDATION
    priority_3_user_machine_readable_policy_automation:
      - USER_POLICY_MAY_REFERENCE_REGISTERED_CAPABILITY_INTERFACE_SATISFACTION_AND_RECOVERY_IDENTITIES
      - USER_POLICY_MUST_NOT_GAIN_PROJECT_OR_CORE_AUTHORITY_BY_REFERENCE
      - USER_POLICY_RESOLUTION_REMAINS_EXACT_BOUNDED_AND_FAIL_CLOSED
  reuse_policy:
    reuse_existing:
      - MPD_0010_IDENTITY_AND_RESOLUTION_RULES
      - MPD_0010_SPARSE_CANONICAL_DENSE_RUNTIME_PROJECTION
      - MPD_0010_EXTENSION_BOUNDARY
      - EXISTING_CANONICAL_REFERENCE_AND_EXPECTED_INTERFACE_MATCH_RULES
    recovery_path_future_reuse:
      - S1_D24_OPERATION_SEMANTICS_INTERFACE
      - S1_D25_FAILURE_SEMANTICS_INTERFACE
      - S1_D26_CONFORMANCE_VECTOR_SET_INTERFACE
      - S1_D27_EXISTING_CANONICAL_SCHEMA_CONTRACT
    rule: NEW_RECOVERY_SPECIFIC_CONTRACTS_MUST_BE_CREATED_ONLY_WHEN_EXISTING_CANONICAL_RESPONSIBILITY_IS_NOT_SEMANTICALLY_EQUIVALENT

capability_satisfaction_interface:
  status: PROJECT_OWNER_APPROVED
  selection: OPTION_A_DIRECT_ASSERTION_COMPOSITION
  canonical_shape:
    - satisfaction_semantics_id
    - context_schema_ref
    - assertion_refs
  responsibilities:
    satisfaction_semantics_id:
      semantics: OPAQUE_IMMUTABLE_EXACTLY_RESOLVABLE_SATISFACTION_SEMANTICS_IDENTITY
    context_schema_ref:
      semantics: EXACT_REFERENCE_TO_THE_CANONICAL_CONTEXT_SCHEMA_REQUIRED_FOR_ALL_ASSERTIONS_IN_THIS_SATISFACTION_CONTRACT
      reuse: EXISTING_CANONICAL_SCHEMA_CONTRACT
    assertion_refs:
      semantics: SEMANTICALLY_UNORDERED_UNIQUE_SET_OF_REGISTERED_MACHINE_READABLE_ASSERTION_IDENTITIES
      required_interface: REGISTERED_MACHINE_READABLE_ASSERTION_INTERFACE
  aggregation:
    rules:
      - EVERY_ASSERTION_MUST_BE_EVALUATED_BEFORE_THE_AGGREGATE_RESULT_IS_FINAL
      - ANY_ASSERTION_EVALUATION_BLOCKED_YIELDS_EVALUATION_BLOCKED
      - OTHERWISE_ANY_ASSERTION_FAIL_YIELDS_UNSATISFIED
      - OTHERWISE_ALL_ASSERTIONS_PASS_YIELDS_SATISFIED
    result_algebra:
      - SATISFIED
      - UNSATISFIED
      - EVALUATION_BLOCKED
    invariants:
      - ASSERTION_ORDER_HAS_NO_SEMANTIC_MEANING
      - DUPLICATE_ASSERTION_REFS_ARE_FORBIDDEN
      - EVALUATION_BLOCKED_IS_NOT_UNSATISFIED
      - EVALUATION_BLOCKED_IS_NOT_TOOL_CAPABILITY_GAP
      - UNSATISFIED_MAY_ENTER_THE_CANONICAL_CAPABILITY_OFFICIAL_RECOVERY_PLAN
      - EVALUATION_BLOCKED_FAILS_CLOSED_ONLY_FOR_THE_DEPENDENT_OPERATION
      - NO_LLM_NATURAL_LANGUAGE_OR_SEMANTIC_SIMILARITY_EVALUATION
  boundaries:
    owns:
      - MACHINE_DECIDABLE_CURRENT_CAPABILITY_SATISFACTION_COMPOSITION
    does_not_own:
      - PROVIDER_INTERFACE_SEMANTICS
      - PROJECT_AUTHORITY_SEMANTICS
      - AUTHORITY_REQUIREMENT_SEMANTICS
      - RECOVERY_PATH_OR_RECOVERY_ORDER
      - CANDIDATE_OR_PROVENANCE_SEMANTICS
      - ELIMINATION
      - RESOLUTION_CLASSIFICATION
      - MUTATION
  priority_alignment:
    priority_1:
      - FIXED_ALL_ASSERTIONS_REQUIRED_COMPOSITION_REMOVES_BOOLEAN_EXPRESSION_INFERENCE
      - ASSERTION_REFS_ARE_EXACT_AND_BOUNDED
      - DENSE_RUNTIME_PROJECTION_MAY_PRE_RESOLVE_ASSERTIONS_WITHOUT_BECOMING_AUTHORITY
    priority_2:
      - UNSUPPORTED_EXTENSION_ASSERTION_YIELDS_EVALUATION_BLOCKED_NOT_FALSE
      - BLOCKING_IS_SCOPED_TO_THE_DEPENDENT_OPERATION
    priority_3:
      - USER_POLICY_MAY_REFERENCE_REGISTERED_ASSERTIONS_WITHOUT_GAINING_CORE_OR_PROJECT_AUTHORITY

registered_machine_readable_assertion_interface:
  status: PROJECT_OWNER_APPROVED
  selection: OPTION_A_SIX_FIELD_EXPLICIT_ASSERTION_OPERATION_CONTRACT
  canonical_object: MachineAssertionContract
  identity_namespace_rule: MUST_BE_DISTINCT_FROM_EvidenceAssertion_IDENTITY_NAMESPACE
  recommended_identity_grammar: 'assertion-contract:<OPAQUE_IMMUTABLE_TOKEN>'
  canonical_shape:
    - assertion_contract_id
    - input_schema_ref
    - output_schema_ref
    - operation_semantics_ref
    - failure_semantics_ref
    - conformance_vectors_ref
  field_responsibilities:
    assertion_contract_id:
      semantics: OPAQUE_IMMUTABLE_EXACTLY_RESOLVABLE_MACHINE_ASSERTION_CONTRACT_IDENTITY
    input_schema_ref:
      semantics: EXACT_CANONICAL_CONTEXT_SCHEMA_ACCEPTED_BY_THE_ASSERTION
      reuse: S1_D27_EXISTING_CANONICAL_SCHEMA_CONTRACT
      capability_satisfaction_binding_rule: MUST_EXACTLY_MATCH_PARENT_CAPABILITY_SATISFACTION_context_schema_ref
      implicit_projection_adapter_or_field_guessing: FORBIDDEN
    output_schema_ref:
      semantics: EXACT_REFERENCE_TO_THE_COMMON_MACHINE_ASSERTION_RESULT_SCHEMA
      required_schema: MACHINE_ASSERTION_RESULT_SCHEMA
      fixed_result_algebra:
        - PASS
        - FAIL
      extension_defined_result_algebra: FORBIDDEN
    operation_semantics_ref:
      reuse: S1_D24_OPERATION_SEMANTICS_INTERFACE
      semantics: DETERMINISTIC_CANONICAL_CONTEXT_TO_PASS_OR_FAIL_EVALUATION
    failure_semantics_ref:
      reuse: S1_D25_FAILURE_SEMANTICS_INTERFACE
      semantics: ASSERTION_EVALUATION_FAILURES_THAT_ARE_NEITHER_PASS_NOR_FAIL
      global_unresolved_or_interface_mismatch: MPD_0010_FAIL_CLOSED
    conformance_vectors_ref:
      reuse: S1_D26_CONFORMANCE_VECTOR_SET_INTERFACE
      rule: SELF_BOUND_INPUT_OUTPUT_OPERATION_AND_FAILURE_REFS_MUST_MATCH_THIS_ASSERTION_CONTRACT
  evidence_assertion_boundary:
    existing_EvidenceAssertion_semantics: EVIDENCE_VALUE_PLUS_PROVENANCE
    MachineAssertionContract_semantics: NORMATIVE_MACHINE_EVALUATION_CONTRACT
    same_type_or_identity_namespace: FORBIDDEN
    evidence_assertion_as_machine_assertion: FORBIDDEN
    machine_assertion_as_evidence_assertion: FORBIDDEN
  evaluation_rules:
    - SUCCESS_OUTPUT_IS_PASS_OR_FAIL_ONLY
    - ASSERTION_EVALUATION_FAILURE_IS_NOT_FAIL
    - ASSERTION_EVALUATION_FAILURE_PROPAGATES_TO_PARENT_CAPABILITY_SATISFACTION_AS_EVALUATION_BLOCKED
    - ALL_PARENT_ASSERTIONS_MUST_BE_EVALUATED_BEFORE_FINAL_AGGREGATION
  extension_rules:
    - OFFICIAL_AND_REGISTERED_EXTENSION_ASSERTIONS_USE_THE_SAME_BASE_INTERFACE
    - DISTINCT_EXTENSION_IDENTITY_REQUIRED
    - SILENT_MAPPING_TO_CORE_ASSERTION_SEMANTICS_FORBIDDEN
    - UNSUPPORTED_EXTENSION_ASSERTION_IS_EVALUATION_BLOCKED_NOT_FAIL
    - UNSUPPORTED_EXTENSION_ASSERTION_MUST_NOT_BLOCK_UNRELATED_DEVELOPMENT
  user_policy_rules:
    - REGISTERED_USER_ASSERTIONS_MAY_USE_THE_SAME_BASE_INTERFACE
    - USER_ASSERTION_REFERENCE_DOES_NOT_CREATE_PROJECT_OR_CORE_AUTHORITY
    - USER_ASSERTION_MUST_REMAIN_EXACT_BOUNDED_AND_MACHINE_DECIDABLE
  reuse_policy:
    - MPD_0010_IDENTITY_AND_EXACT_RESOLUTION
    - S1_D24_OPERATION_SEMANTICS_INTERFACE
    - S1_D25_FAILURE_SEMANTICS_INTERFACE
    - S1_D26_CONFORMANCE_VECTOR_SET_INTERFACE
    - S1_D27_EXISTING_CANONICAL_SCHEMA_CONTRACT
  new_dsl_required: false

resolution_model:
  state_type: ResolutionState
  states:
    - RECOVERY_REQUIRED
    - TERMINAL
  outcome_type: ResolutionOutcome
  terminal_outcomes:
    - DETERMINISTIC
    - OWNER_INTENT_REQUIRED
    - EXTERNAL_FACT_REQUIRED
    - UNSATISFIABLE
    - TOOL_CAPABILITY_GAP
  rule: RECOVERY_REQUIRED_AND_TERMINAL_ARE_RESOLUTION_STATES_NOT_TERMINAL_OUTCOMES

capability_recovery:
  unsupported_semantics_is_terminal_gap: false
  required_order:
    - LOSSLESS_CANONICAL_NORMALIZATION
    - PROJECT_LOCAL_AUTHORITY_COMPATIBILITY_ADAPTER
    - EXISTING_AUTHORITY_COMPATIBLE_MATERIALIZATION
    - TERMINAL_TOOL_CAPABILITY_GAP_ONLY_AFTER_RECOVERY_EXHAUSTION
  adapter_rules:
    - MUST_MAP_EXPLICIT_EXISTING_PROJECT_MEANING_TO_PTSIP_CANONICAL_SEMANTICS
    - MUST_NOT_INVENT_PROJECT_INTENT
    - MUST_BE_MACHINE_READABLE
    - MUST_USE_CLOSED_VOCABULARY
    - MUST_FAIL_CLOSED_ON_AMBIGUITY
    - MUST_PRESERVE_SUBJECT_BINDING
    - MUST_NOT_USE_FILESYSTEM_PATH_OR_GIT_REVISION_AS_CANONICAL_AUTHORITY_IDENTITY
  terminal_tool_gap_requires:
    - CapabilityRecoveryAssessment
    - REQUIRED_CAPABILITY_IDENTIFIED
    - NORMALIZATION_PATH_REJECTED_WITH_REASON
    - ADAPTER_PATH_REJECTED_WITH_REASON
    - COMPATIBLE_MATERIALIZATION_PATH_REJECTED_WITH_REASON
  responsibility_semantics:
    PROJECT: MISSING_OR_AMBIGUOUS_PROJECT_INTENT
    EXTERNAL_INPUT: MISSING_EXTERNALLY_KNOWABLE_FACT
    PTSIP: TERMINAL_TOOL_CAPABILITY_GAP_AFTER_RECOVERY_EXHAUSTION
    NONE: DETERMINISTIC_OR_OTHER_TERMINAL_STATE_WITHOUT_ACTION_OWNER

coverage_gap_relationship:
  CoverageGap_is_problem_observation: true
  CoverageGap_is_not_automatically_final_outcome: true
  final_resolution_may_be:
    - DETERMINISTIC
    - OWNER_INTENT_REQUIRED
    - EXTERNAL_FACT_REQUIRED
    - TOOL_CAPABILITY_GAP
    - UNSATISFIABLE

canonical_contract_reconciliation:
  policy_status: PROJECT_OWNER_APPROVED
  policy_reason: S3_RECOVERY_AND_RESOLUTION_PHILOSOPHY_MUST_CONSUME_THE_LATEST_S1_CANONICAL_AUTHORITY_PROVENANCE_AND_CANDIDATE_CONTRACTS
