policy_class: PTSIP_DEVELOPER_POLICY
plan_version: 0.4.0

record:
  id: WU-02-S3
  kind: PARALLEL_WORK_LANE
  title: Capability Recovery + Resolution Boundary + Feedback Outcome
  status: ACTIVE
  parent_work_unit: WU-02
  branch: dev/0.4.0-WU-02-S3
  base_branch: dev/0.4.0
  authority: PROJECT_OWNER
  implementation_authorization: AUTHORIZED
  integration_target: dev/0.4.0

branch_baseline:
  canonical_plan_source: CENTRAL_CONTROL_PLANE
  control_plane_branch: dev/0.4.0
  synchronization: MUST_START_FROM_CURRENT_CENTRAL_CONTROL_PLANE_REVISION_BEFORE_IMPLEMENTATION
  lane_plan_is_canonical_on_control_plane: true
  implementation_base: dev/0.4.0
  legacy_branch: dev/0.4.0-WU-02-S3
  legacy_branch_disposition: REFERENCE_IMPLEMENTATION_ONLY_PENDING_DELETION
  legacy_branch_merge: FORBIDDEN
  legacy_branch_rebase: NOT_REQUIRED
  rule: CURRENT_dev_0_4_0_IS_THE_ONLY_POLICY_AND_IMPLEMENTATION_BASE

responsibility:
  primary: CAPABILITY_RECOVERY_RESOLUTION_BOUNDARY_AND_FEEDBACK_OUTCOME
  question_owned: WHY_THE_CURRENT_SOLVE_CANNOT_YET_REDUCE_FURTHER_AND_WHETHER_RECOVERY_IS_AVAILABLE
  final_output_goal: ONE_MACHINE_INSPECTABLE_RESOLUTION_RECORD
  feedback_goal: DISTINGUISH_PROJECT_EXTERNAL_INPUT_AND_PTSIP_RESPONSIBILITY_WITHOUT_PREMATURE_TOOL_GAP

resolution_model:
  state_type: ResolutionState
  states:
    - RECOVERY_REQUIRED
    - TERMINAL
  outcome_type: ResolutionOutcome
  terminal_outcomes:
    - DETERMINISTIC
    - OWNER_INTENT_REQUIRED
    - EXTERNAL_FACT_REQUIRED
    - UNSATISFIABLE
    - TOOL_CAPABILITY_GAP
  rule: RECOVERY_REQUIRED_AND_TERMINAL_ARE_RESOLUTION_STATES_NOT_TERMINAL_OUTCOMES

capability_recovery:
  unsupported_semantics_is_terminal_gap: false
  required_order:
    - LOSSLESS_CANONICAL_NORMALIZATION
    - PROJECT_LOCAL_AUTHORITY_COMPATIBILITY_ADAPTER
    - EXISTING_AUTHORITY_COMPATIBLE_MATERIALIZATION
    - TERMINAL_TOOL_CAPABILITY_GAP_ONLY_AFTER_RECOVERY_EXHAUSTION
  adapter_rules:
    - MUST_MAP_EXPLICIT_EXISTING_PROJECT_MEANING_TO_PTSIP_CANONICAL_SEMANTICS
    - MUST_NOT_INVENT_PROJECT_INTENT
    - MUST_BE_MACHINE_READABLE
    - MUST_USE_CLOSED_VOCABULARY
    - MUST_FAIL_CLOSED_ON_AMBIGUITY
    - MUST_PRESERVE_SUBJECT_BINDING
    - MUST_NOT_USE_FILESYSTEM_PATH_OR_GIT_REVISION_AS_CANONICAL_AUTHORITY_IDENTITY
  terminal_tool_gap_requires:
    - CapabilityRecoveryAssessment
    - REQUIRED_CAPABILITY_IDENTIFIED
    - NORMALIZATION_PATH_REJECTED_WITH_REASON
    - ADAPTER_PATH_REJECTED_WITH_REASON
    - COMPATIBLE_MATERIALIZATION_PATH_REJECTED_WITH_REASON
  responsibility_semantics:
    PROJECT: MISSING_OR_AMBIGUOUS_PROJECT_INTENT
    EXTERNAL_INPUT: MISSING_EXTERNALLY_KNOWABLE_FACT
    PTSIP: TERMINAL_TOOL_CAPABILITY_GAP_AFTER_RECOVERY_EXHAUSTION
    NONE: DETERMINISTIC_OR_OTHER_TERMINAL_STATE_WITHOUT_ACTION_OWNER

coverage_gap_relationship:
  CoverageGap_is_problem_observation: true
  CoverageGap_is_not_automatically_final_outcome: true
  final_resolution_may_be:
    - DETERMINISTIC
    - OWNER_INTENT_REQUIRED
    - EXTERNAL_FACT_REQUIRED
    - TOOL_CAPABILITY_GAP
    - UNSATISFIABLE

canonical_contract_reconciliation:
  policy_status: PROJECT_OWNER_APPROVED
  policy_reason: S3_RECOVERY_AND_RESOLUTION_PHILOSOPHY_MUST_CONSUME_THE_LATEST_S1_CANONICAL_AUTHORITY_PROVENANCE_AND_CANDIDATE_CONTRACTS
  authority_requirement_input:
    canonical_source: CandidateProvenance.authority_requirements
    minimum_shape:
      - requirement_id
      - subject_binding
      - required_effects
    rules:
      - S3_MUST_NOT_REPLACE_AUTHORITY_REQUIREMENT_WITH_A_GUESSED_FUTURE_AUTHORITY_ID
      - S3_MUST_NOT_TREAT_LEGACY_required_authority_ids_AS_EQUIVALENT_TO_AuthorityRequirement
      - S3_MUST_NOT_INFER_REQUIREMENT_SEMANTICS_FROM_FREE_TEXT_OR_LLM_SIMILARITY
      - REQUIREMENT_SATISFACTION_REQUIRES_CURRENT_PROJECT_AUTHORITY_ELIGIBILITY
      - REQUIREMENT_SATISFACTION_REQUIRES_MACHINE_READABLE_SUBJECT_APPLICABILITY
      - REQUIREMENT_SATISFACTION_REQUIRES_REQUIRED_EFFECT_COVERAGE
      - ELIGIBILITY_EVIDENCE_MUST_BE_BOUND_TO_THE_EXACT_REQUIREMENT_SUBJECT_BINDING
  project_authority_recovery_input:
    canonical_authority_input: ProjectAuthorityRecord
    eligibility_input: EligibilityResult
    legacy_ProjectIntentAuthority_is_canonical_input: false
    consumed_authority_rule: ONLY_AUTHORITY_ACTUALLY_USED_BY_THE_CURRENT_RECOVERY_MAY_BE_RECORDED_AS_CONSUMED
    available_but_unused_authority_is_consumed: false
    ambiguity_rule: MULTIPLE_RECOVERABLE_AUTHORITIES_FAIL_CLOSED_WITHOUT_IMPLICIT_PREFERENCE
  compatibility_adapter:
    storage_and_discovery: EXPLICIT_INJECTED_MACHINE_READABLE_CATALOG_ONLY
    repository_or_filesystem_scan: FORBIDDEN
    semantic_similarity_matching: FORBIDDEN
    exact_match_dimensions:
      - AUTHORITY_REQUIREMENT_IDENTITY
      - AUTHORITY_REQUIREMENT_SUBJECT_BINDING
      - REQUIRED_EFFECTS
      - CURRENT_PROJECT_AUTHORITY_IDENTITY
      - CURRENT_PROJECT_AUTHORITY_MACHINE_SEMANTICS
    may_invent_project_intent: false
  candidate_handoff:
    upstream_pipeline:
      - OPERATIONAL_RULE_OR_COVERAGE_GAP_OR_REGISTERED_EXTENSION
      - SemanticCandidateProposal
      - CandidateGenerationAdapter
      - SemanticCandidate_PLUS_CandidateProvenance
    S3_consumes:
      - S2_SURVIVOR_IDENTITIES
      - CANONICAL_CandidateProvenance_FOR_EACH_SURVIVOR
      - S2_ELIMINATION_RECORD_IDENTITIES
    rules:
      - EVERY_NONEMPTY_SURVIVOR_SET_MUST_CARRY_ITS_CANONICAL_CandidateProvenance
      - CandidateProvenance_IS_THE_ONLY_CANONICAL_SUPPORT_AND_AUTHORITY_REQUIREMENT_SSOT
      - LEGACY_fact_ids_MAY_NOT_BECOME_AN_INDEPENDENT_S3_CANONICAL_SOURCE
      - S3_MUST_NOT_GENERATE_CANDIDATES
      - S3_MUST_NOT_CREATE_OR_OVERRIDE_ELIMINATION_AUTHORITY
  owner_intent_resolution:
    canonical_basis: UNSATISFIED_CandidateProvenance_authority_requirements
    RuleRequirementKind_PROJECT_INTENT_role: DERIVED_ROUTING_CLASSIFICATION_ONLY
    rules:
      - PROJECT_INTENT_ENUM_ALONE_MUST_NOT_PRODUCE_OWNER_INTENT_REQUIRED
      - TWO_OR_MORE_SURVIVORS_ALONE_MUST_NOT_PRODUCE_OWNER_INTENT_REQUIRED
      - OWNER_INTENT_REQUIRED_REQUIRES_AN_EXPLICIT_UNSATISFIED_CANONICAL_AUTHORITY_REQUIREMENT_AND_UNRESOLVED_SEMANTIC_DIMENSION
  recovery_effect_on_canonical_state:
    successful_recovery_may_rewrite_CandidateProvenance_in_place: false
    successful_recovery_requires: FRESH_SOLVE_THROUGH_THE_CANONICAL_S1_CANDIDATE_MATERIALIZATION_BOUNDARY
    recovered_authority_identity_enters_fresh_solve_binding_when_consumed: true
    recovered_state_before_fresh_solve: RECOVERY_REQUIRED

