  selection: OPTION_B
  design_principle: STRUCTURAL_SIZE_OR_IMPLEMENTATION_COMPLEXITY_IS_NOT_A_NEGATIVE_WHEN_RESPONSIBILITIES_REMAIN_MACHINE_READABLE_DETERMINISTIC_AND_AUTOMATABLE_AND_REDUCE_AGENT_INFERENCE
  capability_recovery:
    canonical_responsibility: DETERMINE_WHETHER_A_BLOCKING_CAPABILITY_CAN_BE_RECOVERED_WITHOUT_NEW_SEMANTIC_AUTHORITY
    owns:
      - RECOVERY_PRECONDITION_VALIDATION
      - ORDERED_MACHINE_READABLE_RECOVERY_ATTEMPTS
      - RECOVERY_SUCCESS_OR_EXHAUSTION_PROOF
      - EXACT_REFERENCES_TO_CONSUMED_CURRENT_AUTHORITY_WHEN_APPLICABLE
      - EXACT_REFERENCE_TO_RECOVERED_CANONICAL_MATERIALIZATION_WHEN_SUCCESSFUL
    does_not_own:
      - CANDIDATE_GENERATION
      - CANDIDATE_PROVENANCE_SEMANTICS
      - PROJECT_AUTHORITY_CREATION
      - OWNER_INTENT_INVENTION
      - ELIMINATION
      - FINAL_RESOLUTION_CLASSIFICATION
      - MUTATION_AUTHORIZATION
  resolution_classification:
    canonical_responsibility: CLASSIFY_THE_CURRENT_SOLVE_AFTER_REQUIRED_RECOVERY_EVALUATION
    consumes:
