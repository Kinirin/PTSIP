      ZERO: UNSATISFIABLE
      ONE: DETERMINISTIC
      TWO_OR_MORE: OWNER_INTENT_REQUIRED
      deterministic_means_mutation_authorized: false
      precondition: NO_REQUIRED_REMEDIATION_FAMILY_OR_CURRENT_AUTHORITY_INTERPRETATION_IS_OUTSIDE_MODELED_TOOL_CAPABILITY
