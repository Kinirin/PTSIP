policy_class: PTSIP_DEVELOPER_POLICY
plan_version: 0.4.0

record:
  id: WU-02-S3-PROVISIONAL-RELEASE-BRIDGE
  status: PROVISIONAL_IMPLEMENTATION_CONTRACT
  authority: PROJECT_OWNER
  parent: WU-02-S3
  purpose: ALLOW_IMPLEMENTATION_AND_EMERGENCY_RELEASE_WORK_TO_CONTINUE_WITHOUT_PREMATURELY_FREEZING_NONCRITICAL_RECORD_SHAPES

fixed_semantic_boundaries:
  - CandidateProvenance_REMAINS_THE_SOLE_SUPPORT_AND_AUTHORITY_REQUIREMENT_SSOT
  - CURRENT_SOLVE_BINDING_MUST_BE_EXACT
  - RECOVERY_SUCCESS_REQUIRES_A_FRESH_SOLVE
  - DECLARED_PATH_FAILURE_IS_NOT_EVALUATION_BLOCKED
  - EVALUATION_BLOCKED_IS_NOT_UNSATISFIED
  - EXHAUSTED_IS_NOT_TOOL_CAPABILITY_GAP
  - TOOL_CAPABILITY_GAP_REMAINS_A_RESOLUTION_CLASSIFICATION_RESPONSIBILITY
  - RECOVERY_MUST_NOT_INVENT_PROJECT_INTENT
  - RECOVERY_MUST_NOT_MUTATE_CandidateProvenance_IN_PLACE
  - UNSUPPORTED_EXTENSION_BEHAVIOR_BLOCKS_ONLY_THE_DEPENDENT_OPERATION

CapabilityRecoveryAssessment:
  status: PROVISIONAL_EXACT_SHAPE_REFINABLE_AFTER_0_3_8_DEMO
  semantic_responsibility: FIXED
  provisional_shape:
    - solve_binding_ref
    - required_capability_ref
    - recovery_plan_ref
    - attempts
    - result
  result_values:
    - RECOVERED
    - EXHAUSTED
    - EVALUATION_BLOCKED
  invariants:
    - result_MUST_BE_MACHINE_DERIVABLE_FROM_attempts
    - RECOVERED_REQUIRES_EXACT_SUCCESSFUL_output_ref
    - EXHAUSTED_REQUIRES_ALL_ORDERED_PATHS_TO_END_IN_DECLARED_PATH_FAILURE
    - EVALUATION_BLOCKED_MUST_NOT_BE_REWRITTEN_AS_EXHAUSTED
    - ASSESSMENT_MUST_NOT_DECLARE_TOOL_CAPABILITY_GAP

RecoveryAttempt:
  status: PROVISIONAL_EXACT_SHAPE_REFINABLE_AFTER_0_3_8_DEMO
  semantic_responsibility: FIXED
  provisional_shape:
    - recovery_path_ref
    - status
    - failure_id
    - output_ref
  status_values:
    - RECOVERED
    - DECLARED_FAILURE
    - EVALUATION_BLOCKED
  field_rules:
    failure_id: REQUIRED_ONLY_FOR_DECLARED_FAILURE
    output_ref: REQUIRED_ONLY_FOR_RECOVERED
  invariants:
    - failure_id_MUST_RESOLVE_IN_THE_REFERENCED_path_failure_semantics
    - output_ref_MUST_CONFORM_TO_THE_REFERENCED_path_output_schema
    - EVALUATION_BLOCKED_MUST_NOT_CARRY_A_DECLARED_failure_id

ResolutionClassificationRecord:
  status: PROVISIONAL_EXACT_SHAPE_REFINABLE_AFTER_0_3_8_DEMO
  semantic_responsibility: FIXED
  minimum_required_information:
    - current_solve_binding_ref
    - resolution_state
    - resolution_outcome
    - responsibility
    - blocking_reason_refs
    - recovery_assessment_ref_when_required
  invariants:
    - TERMINAL_TOOL_CAPABILITY_GAP_REQUIRES_EXHAUSTED_RECOVERY
    - RECOVERED_REQUIRES_FRESH_SOLVE_BEFORE_FINAL_CLASSIFICATION
    - MULTIPLE_SURVIVORS_ALONE_MUST_NOT_PRODUCE_OWNER_INTENT_REQUIRED

deferred_until_after_0_3_8_demo:
  - FINAL_ASSESSMENT_IDENTITY_DERIVATION
  - FINAL_ATTEMPT_IDENTITY_DERIVATION
  - FINAL_DIAGNOSTIC_REFERENCE_MODEL
  - FINAL_CONSUMED_AUTHORITY_RECORDING_LOCATION
  - FINAL_RECOVERY_AUDIT_NORMALIZATION
  - FINAL_EXTENSION_RECOVERY_REGISTRATION_SCHEMA
  - FINAL_RESOLUTION_RECORD_FIELD_NAMES_WHERE_SEMANTICS_ARE_UNCHANGED

release_priority_rule:
  statement: NONCRITICAL_RECORD_SHAPE_REFINEMENT_MUST_NOT_DELAY_THE_0_3_8_DEMO_RELEASE
  release_blocking_policy_questions: ONLY_SEMANTIC_AMBIGUITIES_THAT_CAN_CHANGE_BEHAVIOR_AUTHORITY_FAIL_CLOSED_BOUNDARIES_OR_CANONICAL_SSOT
