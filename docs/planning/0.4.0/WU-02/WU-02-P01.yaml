schema_version: ptsip-plan-extension/v1
policy_class: PTSIP_DEVELOPER_POLICY
plan_version: 0.4.0

extension:
  id: WU-02-P01
  parent: WU-02
  title: Developer Policy and Support Feature Control Plane Separation
  classification: DEVELOPMENT
  lifecycle:
    status: ACTIVE

approval:
  status: APPROVED
  authority: PROJECT_OWNER

implementation_authorization:
  status: AUTHORIZED

depends_on:
  - WU-02

scope:
  - FIX_MPD_AND_SFP_NAMESPACES
  - MATERIALIZE_DEVELOPER_POLICY_CONTROL_PLANE
  - MATERIALIZE_DEVELOPER_PLANNING_CONTROL_PLANE
  - MOVE_PTSIP_REPOSITORY_PROFILE_TOWARD_DEVELOPER_PROFILE_PATH
  - FIX_SUPPORT_PROFILE_SUBSYSTEM_TARGET_AS_SRC_PTSIP_PROFILES
  - INVENTORY_LEGACY_ADR_CORPUS_AS_MPD_SFP_SPLIT_OR_RETIRE
  - REMOVE_PRODUCT_RUNTIME_DEPENDENCIES_ON_DEVELOPER_POLICY
  - AUTO_REMOVE_LEGACY_DECISIONS_AFTER_MACHINE_GATE_PASS

policy_namespaces:
  developer:
    constant: PTSIP_DEVELOPER_POLICY
    id_pattern: '^MPD-[0-9]{4}$'
  support:
    constant: PTSIP_SUPPORT_FEATURE
    id_pattern: '^SFP-[0-9]{4}$'

migration_stages:
  P01_A_CONTROL_PLANE:
    status: IMPLEMENTED_VALIDATION_PENDING_FULL_REGRESSION
    completion:
      - DEVELOPER_POLICY_INDEX_VALID
      - PLANNING_INDEX_VALID
      - CURRENT_GATE_SCHEMA_VALID
  P01_B_DECISION_INVENTORY:
    status: COMPLETE_23_OF_23
    inventory: developer/policy/legacy-decisions-inventory.yaml
    classification_summary:
      MPD: 2
      SFP: 15
      SPLIT: 6
      RETIRE: 0
    materialization_targets:
      SFP: 21
      MPD: 8
      RETIRED_FRAGMENTS: 0
    output_classes:
      - MPD
      - SFP
      - SPLIT
      - RETIRE
    split_target_allocation:
      ADR-0003: [SFP-0003, MPD-0002]
      ADR-0005: [SFP-0005, MPD-0003]
      ADR-0011: [SFP-0011, MPD-0004]
      ADR-0017: [SFP-0017, MPD-0005]
      ADR-0021: [SFP-0019, MPD-0006]
      ADR-0023: [SFP-0021, MPD-0007]
    pure_mpd_allocation:
      ADR-0018: MPD-0008
      ADR-0020: MPD-0009
    reference_routing: developer/policy/legacy-decision-reference-routing.yaml
    relation_rule: SPLIT_RELATION_REQUIRES_EXPLICIT_PREDECLARED_ROUTE
    textual_reference_rule:
      single_target: AUTO_REWRITE_ALLOWED
      split_target: MANUAL_CONTEXT_REVIEW_REQUIRED
      split_auto_rewrite: FORBIDDEN
      review_granularity: OCCURRENCE
      review_registry: developer/policy/split-textual-reference-review.yaml
      resolution_vocabulary:
        - SFP_ONLY
        - MPD_ONLY
        - BOTH
        - REMOVE_REFERENCE
    linked_profile_migration:
      target_root: src/ptsip/profiles/
      schema_root: src/ptsip/profiles/schema/
      builtin_root: src/ptsip/profiles/builtin/
      execution: DEFER_TO_POLICY_MATERIALIZATION_AFTER_INVENTORY
  P01_C_POLICY_MATERIALIZATION:
    status: ACTIVE
    includes:
      - MATERIALIZE_MPD_RESULTS
      - MATERIALIZE_SFP_RESULTS
      - SPLIT_MIXED_RESULTS
      - MIGRATE_SUPPORT_PROFILE_SCHEMA_ASSETS_TO_SRC_PTSIP_PROFILES_SCHEMA
      - UPDATE_PACKAGE_RESOURCE_AND_SCHEMA_REFERENCES
      - GENERATE_SPLIT_TEXTUAL_REFERENCE_REVIEW
      - RESOLVE_SPLIT_TEXTUAL_REFERENCES_MANUALLY_BEFORE_LEGACY_REMOVAL
  P01_D_RUNTIME_BOUNDARY:
    status: BLOCKED_ON_P01_C
    required:
      - PRODUCT_RUNTIME_DECISIONS_DEPENDENCY_COUNT_ZERO
      - SUPPORT_FEATURE_RUNTIME_USES_ONLY_SHIPPED_CONTRACTS
  P01_E_LEGACY_REMOVAL:
    status: BLOCKED_ON_P01_D
    preauthorized_action: REMOVE_DECISIONS_DIRECTORY_FROM_ACTIVE_TREE
    confirmation_required: false
  P01_F_PROFILE_COMPATIBILITY_BRIDGE_REMOVAL:
    status: BLOCKED
    required:
      - DEVELOPER_AUTOMATION_EXPLICIT_PROFILE_SELECTION_VERIFIED
      - ROOT_PTSIP_YAML_NOT_REQUIRED_FOR_PTSIP_REPOSITORY_SELF_MANAGEMENT

profile_subsystem_decision:
  status: APPROVED
  target_root: src/ptsip/profiles/
  schema_root: src/ptsip/profiles/schema/
  builtin_root: src/ptsip/profiles/builtin/
  current_assets_remain_in_specdata_until_inventory: true
  move_authorized_only_as_part_of_inventory_linked_materialization: true

current_known_blockers:
  - POLICY_MATERIALIZATION_INCOMPLETE
  - SPLIT_TEXTUAL_REFERENCE_REVIEW_INCOMPLETE
  - SRC_PTSIP_GOVERNANCE_READS_DECISIONS
  - ROOT_PTSIP_YAML_COMPATIBILITY_BRIDGE_STILL_ACTIVE
