[build-system]
requires = ["setuptools>=77.0.3", "PyYAML>=6.0,<7"]
build-backend = "setuptools.build_meta"

[project]
name = "PTSIP"
version = "0.3.8a1"
description = "Reference tooling for primary lifecycle ownership and responsibility isolation"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PTSIP-Community-Reciprocity-1.0"
license-files = ["License-Authority/license-authority.yaml", "License-Authority/LICENSE.md", "License-Authority/NOTICE.md", "License-Authority/LICENSE-GUIDE.md", "License-Authority/LICENSE-HISTORY.md", "License-Authority/COMMERCIAL-USE.md"]
authors = [
  { name = "Kinirin" }
]
maintainers = [
  { name = "Kinirin" }
]
keywords = ["architecture", "lifecycle", "governance", "validation", "delivery", "operations", "ptsip"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/Kinirin/PTSIP"
Specification = "https://github.com/Kinirin/PTSIP"
Issues = "https://github.com/Kinirin/PTSIP/issues"

[project.scripts]
ptsip = "ptsip.cli:main"
ptsip-app = "ptsip.app.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptsip*", "vpms*", "agent_contracts*"]

[tool.setuptools.package-data]
ptsip = [
  "specdata/*.json",
  "specdata/*.yaml",
]
agent_contracts = [
  "*.yaml",
  "schemas/*.json",
  "spec/*.yaml",
  "operations/*.yaml",
  "vocabulary/*.yaml",
  "bindings/*.yaml",
]

[project.optional-dependencies]
github-app = [
  "PyJWT[crypto]>=2.10,<3",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "setuptools>=77.0.3",
]
