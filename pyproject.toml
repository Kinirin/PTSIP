[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "ptsip_pep517"
backend-path = ["src/build"]

[project]
name = "PTSIP"
version = "0.3.8"
description = "Reference tooling for primary lifecycle ownership and responsibility isolation"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PTSIP-Community-Reciprocity-1.0"
license-files = ["License-Authority/license-authority.yaml", "License-Authority/LICENSE.md", "License-Authority/NOTICE.md", "License-Authority/LICENSE-GUIDE.md", "License-Authority/LICENSE-HISTORY.md", "License-Authority/COMMERCIAL-USE.md"]
authors = [
  { name = "Kinirin" }
]
maintainers = [
  { name = "Kinirin" }
]
keywords = ["architecture", "lifecycle", "governance", "validation", "delivery", "operations", "ptsip"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/Kinirin/PTSIP"
Specification = "https://github.com/Kinirin/PTSIP"
Issues = "https://github.com/Kinirin/PTSIP/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptsip", "vpms", "vpms.*", "agent_contracts", "agent_contracts.*"]
namespaces = true

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "setuptools>=77.0.3",
]

# Canonical current composition. Published snapshots are recorded separately
# after their original-source artifacts and publication state are verified.
[tool.ptsip.release]
schema_version = "ptsip-current-composition/v2"
package_base = "0.3.8"
package_revision = 0
package_state = ""
tool_version_ref = "tool.ptsip.release.tool_version"
tool_version = "T.0.3.8.b3"
profile_version = "pp.3.00"
specification_source = "https://github.com/Kinirin/PTSIP"
spec_revision = "3c47816770d194ae42f98faedc911d980db0e62a"

[tool.ptsip.release.engines]
context = "2.2.0"
storage = "3.0.0"
validation = "4.5.0"
discovery = "3.6.0"
execution = "3.0.0"
projection = "2.5.0"

[tool.ptsip.release.published]
identity = "0.3.8.fa660a"
composition_sha256 = "fa660aac1b7bef6b3692d8b54ce447472b666560ea2c87eb84d2159543be20a3"
source_sha = "7c493c0484614885c6d92b9f41562b16273c6682"
release_tag = "ptsip-release-7c493c0484614885c6d92b9f41562b16273c6682"
