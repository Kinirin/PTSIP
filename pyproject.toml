[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ptsip"
version = "0.2.0"
description = "Reference development tooling for the Product-Toolchain SDK Isolation Policy"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "kwaksinwoo01" }
]
keywords = ["architecture", "sdk", "toolchain", "governance", "validation", "ptsip"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/kwaksinwoo01/ptsip"
Specification = "https://github.com/kwaksinwoo01/ptsip"
Issues = "https://github.com/kwaksinwoo01/ptsip/issues"

[project.scripts]
ptsip = "ptsip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptsip = ["specdata/*.json", "specdata/*.yaml"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
]
