[build-system]
requires = ["setuptools>=77.0.3", "PyYAML>=6.0,<7"]
build-backend = "ptsip_build_backend"
backend-path = ["."]

[project]
name = "PTSIP"
version = "0.3.8b4"
description = "Reference tooling for primary lifecycle ownership and responsibility isolation"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PTSIP-Community-Reciprocity-1.0"
license-files = ["License-Authority/license-authority.yaml", "License-Authority/LICENSE.md", "License-Authority/NOTICE.md", "License-Authority/LICENSE-GUIDE.md", "License-Authority/LICENSE-HISTORY.md", "License-Authority/COMMERCIAL-USE.md"]
authors = [
  { name = "Kinirin" }
]
maintainers = [
  { name = "Kinirin" }
]
keywords = ["architecture", "lifecycle", "governance", "validation", "delivery", "operations", "ptsip"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/Kinirin/PTSIP"
Specification = "https://github.com/Kinirin/PTSIP"
Issues = "https://github.com/Kinirin/PTSIP/issues"

[project.scripts]
ptsip = "ptsip.cli:main"
ptsip-app = "ptsip.app.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptsip*", "vpms*", "agent_contracts*"]
exclude = ["tests*", "ptsip.profiles.history*"]
namespaces = false

[tool.setuptools.package-data]
"ptsip.profiles" = ["index.yaml", "*.ptsip.yaml"]
vpms = [
  "contracts/*.json",
  "contracts/schemas/*.json",
]
ptsip = [
  "package-distribution.json",
  "engines/index.json",
  "engines/*/*.json",
  "engines/contracts/*.json",
  "engines/contracts/schemas/*.json",
  "engines/registries/*.json",
  "specdata/*.json",
  "specdata/*.yaml",
  "repository/schemas/*.json",
  "agent_contracts/*.yaml",
  "agent_contracts/schemas/*.json",
  "agent_contracts/spec/*.yaml",
  "agent_contracts/operations/*.yaml",
  "agent_contracts/vocabulary/*.yaml",
  "agent_contracts/bindings/*.yaml",
]
agent_contracts = [
  "*.yaml",
  "schemas/contracts/*.json",
  "schemas/io/*.json",
  "spec/*.yaml",
  "operations/*.yaml",
  "actions/*.yaml",
  "conditions/*.yaml",
  "gates/*.yaml",
  "vocabulary/*.yaml",
  "bindings/*.yaml",
  "index.json",
  "contracts/current.json",
  "conformance/current.json",
  "promotion/current.json",
  "promotion/index.json",
  "promotion/specification-contract.json",
  "canonicalization/*.json",
  "digests/*.json",
  "schemas/candidate-index.schema.json",
  "schemas/candidate-group.schema.json",
  "schemas/candidate-vectors.schema.json",
]

[project.optional-dependencies]
github-app = [
  "PyJWT[crypto]>=2.10,<3",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "setuptools>=77.0.3",
]

[tool.setuptools.exclude-package-data]
"ptsip.profiles" = ["history/*", "history/**"]

# Canonical current composition. Published snapshots are recorded separately
# after their original-source artifacts and publication state are verified.
[tool.ptsip.release]
schema_version = "ptsip-current-composition/v3"
package_base = "0.3.8"
package_release_version = "0.3.8.b4"
tool_version_ref = "tool.ptsip.release.tool_version"
tool_version = "T.0.3.8.b4"
profile_version = "pp.1.02"
specification_source = "https://github.com/Kinirin/PTSIP"
spec_revision = "3c47816770d194ae42f98faedc911d980db0e62a"

[tool.ptsip.release.engines]
context = "0.2.1"
storage = "0.3.1"
validation = "0.3.2"
discovery = "0.3.1"
planning = "0.3.1"
execution = "0.3.1"
projection = "0.2.1"

[tool.ptsip.release.published]
identity = "0.3.8.acbb35"
composition_sha256 = "acbb35d2f2712a43d3084d2341296360136359364c06ecb1e1a02f4002ad73ec"
source_sha = "8275490b85a3b685a7840d6fba80783a01b9b2c0"
release_tag = "ptsip-release-8275490b85a3b685a7840d6fba80783a01b9b2c0"
pypi_version = "0.3.8b3"
